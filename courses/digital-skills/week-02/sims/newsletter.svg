<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="640" height="440" fill="#ffffff"/>
<text x="24" y="36" font-size="22" fill="#2a2f2c" text-anchor="start" font-weight="800">Newsletter Check</text>
<text x="24" y="60" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800">5 sentences to check</text>
<rect x="24" y="72" width="220" height="300" rx="12" fill="#ebfbee" stroke="#b2f2bb" stroke-width="1.5"/>
<text x="36" y="94" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800">Company records</text>
<text x="36" y="118" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">Sales: Sept 3 500 JD,</text>
<text x="36" y="140" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">Oct 4 200 JD.</text>
<text x="36" y="162" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">New: green tea cups.</text>
<text x="36" y="184" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">New staff: Lina, Sami.</text>
<text x="36" y="206" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">Open 9 a.m. to 6 p.m.,</text>
<text x="36" y="228" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">Saturday to Thursday.</text>
<text x="36" y="250" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">Awards: none.</text>
<rect x="254" y="72" width="362" height="300" rx="12" fill="#fff" stroke="#d9d4cf" stroke-width="1.5"/>
<text x="266" y="94" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800">The AI draft</text>
<rect x="262" y="106" width="346" height="34" rx="8" fill="#ebfbee" stroke="#b2f2bb" stroke-width="1.5"/>
<text x="272" y="128" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">October was a great month.</text>
<rect x="262" y="146" width="346" height="52" rx="8" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="272" y="166" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Sales grew from 3 500 JD to 4 200 JD,</text>
<text x="272" y="184" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">a rise of 1 200 JD.</text>
<rect x="262" y="204" width="346" height="34" rx="8" fill="#fff" stroke="none" stroke-width="1.5"/>
<text x="272" y="226" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">We welcome Lina and Sami.</text>
<rect x="262" y="240" width="346" height="52" rx="8" fill="#fff" stroke="none" stroke-width="1.5"/>
<text x="272" y="260" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">We won the Best Shop in Amman</text>
<text x="272" y="278" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">award in 2025.</text>
<rect x="262" y="296" width="346" height="52" rx="8" fill="#fff" stroke="none" stroke-width="1.5"/>
<text x="272" y="316" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">The shop is open every day</text>
<text x="272" y="334" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">from 9 a.m. to 6 p.m.</text>
<rect x="24" y="386" width="220" height="36" rx="10" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="134" y="409" font-size="14" fill="#fff" text-anchor="middle" font-weight="800">Publish the newsletter</text>
</svg>
