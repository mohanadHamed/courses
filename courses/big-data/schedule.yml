# The 8 labs of the course in teaching order (one each Sunday, 60 minutes,
# in the computer lab). Labs 1-3 cover C1 (a big data platform: Google
# BigQuery and Looker Studio); Labs 4-8 cover C3 (a real big data problem in
# R: the transactions of an online shop). The two outcomes stay apart.
#
# The course package of the Technical College is not made for this course,
# so `week` is the number of the lab (folder week-WW), not a syllabus row.
# Every session is a lecture in the lab model (`lab: true`), labelled "Lab";
# `heading` names the outcome on the card instead of "Unit N".

units:
  - unit: 1
    week: 1
    heading: "Outcome C1 · a big data platform"
    sessions:
      - {kind: lecture, n: 1, slot: "Lab (C1)", title: "A Big Data Platform: A First Look at Google BigQuery", ilos: [C1]}
  - unit: 2
    week: 2
    heading: "Outcome C1 · a big data platform"
    sessions:
      - {kind: lecture, n: 2, slot: "Lab (C1)", title: "Collect and Store: Loading Data into BigQuery", ilos: [C1]}
  - unit: 3
    week: 3
    heading: "Outcome C1 · a big data platform"
    sessions:
      - {kind: lecture, n: 3, slot: "Lab (C1)", title: "Process and Analyse: From a Query to a Dashboard in Looker Studio", ilos: [C1]}
  - unit: 4
    week: 4
    heading: "Outcome C3 · a real problem in R"
    sessions:
      - {kind: lecture, n: 4, slot: "Lab (C3)", title: "R and RStudio: Reading a Big File", ilos: [C3]}
  - unit: 5
    week: 5
    heading: "Outcome C3 · a real problem in R"
    sessions:
      - {kind: lecture, n: 5, slot: "Lab (C3)", title: "The Problem and the Data: Cleaning the Shop Data in R", ilos: [C3]}
  - unit: 6
    week: 6
    heading: "Outcome C3 · a real problem in R"
    sessions:
      - {kind: lecture, n: 6, slot: "Lab (C3)", title: "Explore and Visualize: Summaries and Charts with ggplot2", ilos: [C3]}
  - unit: 7
    week: 7
    heading: "Outcome C3 · a real problem in R"
    sessions:
      - {kind: lecture, n: 7, slot: "Lab (C3)", title: "Will the Customer Buy Again? A Decision Tree, Trained and Tested", ilos: [C3]}
  - unit: 8
    week: 8
    heading: "Outcome C3 · a real problem in R"
    sessions:
      - {kind: lecture, n: 8, slot: "Lab (C3)", title: "Communicate the Solution: A Short Report in R", ilos: [C3]}
