<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A check log: what you checked, and what you did</text>
<rect x="20" y="52" width="640" height="34" rx="0" fill="#D9480F"/>
<text x="30" y="73.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">claim</text>
<text x="305" y="73.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">source used</text>
<text x="460" y="73.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">result</text>
<text x="590" y="73.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">action</text>
<text x="30" y="107.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">adults: at least 7 h sleep</text>
<text x="305" y="107.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">a national health site</text>
<text x="460" y="107.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">true</text>
<text x="590" y="107.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">kept</text>
<rect x="20" y="120" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="141.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">brain: 50 % of energy</text>
<text x="305" y="141.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">two biology textbooks</text>
<text x="460" y="141.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">wrong: ≈ 20 %</text>
<text x="590" y="141.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">corrected</text>
<text x="30" y="175.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Miller &amp; Hart (2019)</text>
<text x="305" y="175.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">search: not found</text>
<text x="460" y="175.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">made up</text>
<text x="590" y="175.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">deleted</text>
<rect x="20" y="188" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="209.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">library opens 7:00</text>
<text x="305" y="209.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">the college website</text>
<text x="460" y="209.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">wrong: 8:00</text>
<text x="590" y="209.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">corrected</text>
<text x="30" y="243.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">“Einstein said …”</text>
<text x="305" y="243.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">quote sites disagree</text>
<text x="460" y="243.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">cannot check</text>
<text x="590" y="243.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">removed</text>
<rect x="20" y="52" width="640" height="204" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="280" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Keep the log with the document: you (and your teacher) can see that every claim was checked.</text>
</svg>
