<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="900" height="300" fill="#ffffff"/>
<rect x="10" y="10" width="880" height="280" rx="18" fill="#fff9f2" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="450.0" y="42" font-size="17" fill="#7a2a06" text-anchor="middle" font-weight="800">Follow-up prompts: improve the answer step by step</text>
<rect x="30" y="74" width="190" height="120" rx="14" fill="#D9480F" stroke="#D9480F" stroke-width="2"/>
<text x="44" y="98" font-size="13" fill="#fff" text-anchor="start" font-weight="800">You</text>
<text x="44" y="130" font-size="14" fill="#fff" text-anchor="start" font-weight="700">Give me tips to</text>
<text x="44" y="152" font-size="14" fill="#fff" text-anchor="start" font-weight="700">save money.</text>
<line x1="222" y1="134" x2="234" y2="134" stroke="#D9480F" stroke-width="3" stroke-linecap="round"/>
<polygon points="242,134 232,128 232,140" fill="#D9480F"/>
<rect x="245" y="74" width="190" height="120" rx="14" fill="#e3fafc" stroke="#0b7285" stroke-width="2"/>
<text x="259" y="98" font-size="13" fill="#0b7285" text-anchor="start" font-weight="800">AI</text>
<text x="259" y="130" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">A long paragraph</text>
<text x="259" y="152" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">for everyone ...</text>
<line x1="437" y1="134" x2="449" y2="134" stroke="#D9480F" stroke-width="3" stroke-linecap="round"/>
<polygon points="457,134 447,128 447,140" fill="#D9480F"/>
<rect x="460" y="74" width="190" height="120" rx="14" fill="#D9480F" stroke="#D9480F" stroke-width="2"/>
<text x="474" y="98" font-size="13" fill="#fff" text-anchor="start" font-weight="800">You</text>
<text x="474" y="130" font-size="14" fill="#fff" text-anchor="start" font-weight="700">Make it a list of 3</text>
<text x="474" y="152" font-size="14" fill="#fff" text-anchor="start" font-weight="700">for students.</text>
<line x1="652" y1="134" x2="664" y2="134" stroke="#D9480F" stroke-width="3" stroke-linecap="round"/>
<polygon points="672,134 662,128 662,140" fill="#D9480F"/>
<rect x="675" y="74" width="190" height="120" rx="14" fill="#e3fafc" stroke="#0b7285" stroke-width="2"/>
<text x="689" y="98" font-size="13" fill="#0b7285" text-anchor="start" font-weight="800">AI</text>
<text x="689" y="130" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">1. Cook at home.</text>
<text x="689" y="152" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">2. Use your discount.</text>
<text x="689" y="174" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">3. Buy used books.</text>
<text x="450" y="230" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="700">A follow-up can change the length, the form (a list), the tone, the reader or the language.</text>
<text x="450" y="254" font-size="13.5" fill="#7a6a60" text-anchor="middle" font-weight="600">Stay in the same chat: the AI remembers the last answer.</text>
</svg>
