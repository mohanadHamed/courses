# Applies to every page in this course folder.
# Source: course syllabus 01101154 v2 (2026-10-23, Drive: blended, Office and AI;
# based on the university description "Smart Digital Skills") and the ILO-PLO matrix v5.
author: "Mohanad Hamed"
# Taught to every diploma of the college, not only Mobile Game Development:
# overrides the diploma line of _quarto.yml (banner, PDF footer, title slide).
diploma-line: "All diploma programmes — Technical College, Al-Israa University"
course:
  slug: "digital-skills"
  file-prefix: "digital_skills"   # downloads: digital_skills_lecture5.pdf, digital_skills_lecture6_tasks.pdf
  title: "Digital Skills"
  code: "01101154"
  minutes: 60          # the face-to-face lab lecture = one lesson
  # Blended: each week, lecture 2k-1 is face-to-face (lesson: notes, page,
  # slides) and lecture 2k is an online activity (online: true; tasks to
  # submit on the e-learning platform). No separate homework.
  blended: true
  theme: "workshop"    # course look: colours in lesson.css and the PDF template
  accent: "#D9480F"
  accent2: "#FFC078"
  tagline: "Word, Excel, PowerPoint and AI tools for study, work and daily life"
  textbook: "Evans, A.; Martin, K.; Poatsy, M. A. Technology in Action, Global Edition. 18th ed. Pearson, 2024."
  # Lessons list ILO codes (ilos: [A1]); the banner prints the text below.
  ilos:
    A1: "Explain the main computer applications used to enhance daily productivity, including artificial intelligence tools. (PLO 3)"
    A2: "Explain basic concepts and terminology related to Microsoft Office applications. (PLO 3)"
    A3: "Describe the main features and uses of Microsoft Word, Excel and PowerPoint. (PLO 3)"
    B1: "Evaluate AI-generated text, data and images for accuracy, bias and suitability before using them in a document, worksheet or presentation. (PLO 3, 4)"
    C1: "Explain how Microsoft Word is used to create and format documents. (PLO 3)"
    C2: "Explain how Microsoft Excel is used to organize and present data. (PLO 3, 4)"
    C3: "Identify the basic features of Microsoft PowerPoint used to create presentations. (PLO 2, 3)"
    C4: "Use generative AI tools to draft, edit and improve Word documents, Excel worksheets and PowerPoint presentations. (PLO 2, 3)"
    D1: "Use digital and AI tools safely, responsibly and ethically: protect personal data, respect copyright and academic integrity, and state when AI was used. (PLO 3, 4)"
