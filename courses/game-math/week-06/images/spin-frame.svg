<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">In the game loop: a little rotation every frame</text>
<circle cx="170" cy="160" r="92" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
<polygon points="170,160 258,160 235.8,136.1" fill="#adb5bd" stroke="#868e96" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="170,160 126,83.8 116.4,115" fill="#adb5bd" stroke="#868e96" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="170,160 126,236.2 157.8,228.9" fill="#adb5bd" stroke="#868e96" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="170" cy="160" r="10" fill="#2a2f2c"/>
<path d="M240 60 Q290 120 274 190" fill="none" stroke="#e8590c" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="274,190 271.1,178.1 281.8,180.5" fill="#e8590c"/>
<text x="330" y="92" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Angular speed 180°/s (lecture 8).</text>
<text x="330" y="124" font-size="13.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">At 60 fps, each frame:</text>
<text x="330" y="148" font-size="13.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">180° × (1/60) = 3° per frame.</text>
<text x="330" y="188" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Each vertex of the blade:</text>
<text x="330" y="212" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">new = R(3°) × old (around the centre).</text>
<text x="330" y="252" font-size="13" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Engines do this for you: transform.Rotate.</text>
</svg>
