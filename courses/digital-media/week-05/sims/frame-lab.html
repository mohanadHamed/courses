<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Frame Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .task { font-weight: 800; margin: 6px 0; }
    .sim .done { color: #2b8a3e; }
    .sim ol { margin: 6px 0 0; padding-left: 1.3em; }
  </style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Frame Lab</h1>
  <p class="hint">You hold the camera for the opening of <i>Rooftop Rescue</i>. Drag the picture to move the camera; use the slider to come closer. Do the four tasks.</p>
  <p class="task" id="task"></p>
  <canvas id="c" aria-label="The flooded street seen through a camera frame"></canvas>
  <div class="controls" id="ctl"></div>
  <p class="message" id="msg"></p>
  <ol id="list"></ol>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script src="rooftop-scene.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const cam = { cx: 50, cy: 28, vh: 56 };
  let thirds = true, task = 0;
  const size = () => cam.vh >= 20 ? "wide shot" : cam.vh >= 6 ? "medium shot" : "close-up";
  const inFrame = (wx, wy, m = 0.08) => { const p = RS.where(cam, wx, wy); return p[0] > m && p[0] < 1 - m && p[1] > m && p[1] < 1 - m; };
  const TASKS = [
    { q: "Make a wide shot that shows the whole street, Nour and the roof.", ok: () => cam.vh >= 40 && inFrame(26, 36) && inFrame(82, 18), say: "A wide shot tells the player where the scene happens." },
    { q: "Make a medium shot of Nour in her boat.", ok: () => cam.vh >= 6 && cam.vh < 14 && inFrame(26, 34.5, 0.15) && inFrame(26, 39, 0.05), say: "A medium shot shows Nour's body and what she does." },
    { q: "Make a close-up of Salma's face.", ok: () => cam.vh < 5 && inFrame(82, 16.9, 0.25), say: "A close-up shows Salma's fear." },
    { q: "Nour rows to the right. Put her on the left third, with room in front of her (medium shot).", ok: () => { const p = RS.where(cam, 26, 34.5); return cam.vh >= 6 && cam.vh < 14 && p[0] > 0.24 && p[0] < 0.42 && p[1] > 0.2 && p[1] < 0.6; }, say: "Lead room: the empty space in front of Nour shows where she goes." },
  ];
  function showTask() { $("task").textContent = task < TASKS.length ? `Task ${task + 1} / 4: ${TASKS[task].q}` : "🎉 All four shots are done. Try your own shots."; }
  function check() {
    if (task >= TASKS.length) return;
    if (TASKS[task].ok()) {
      $("list").appendChild(Kit.el("li", { class: "done" }, TASKS[task].q + " ✓"));
      $("msg").textContent = "✓ " + TASKS[task].say; $("msg").className = "message good"; Kit.good();
      task++; showTask();
    }
  }
  const cv = Kit.canvas($("c"), (W) => Math.round(W * 9 / 16));
  const zoom = Kit.slider($("ctl"), "Closer", 0, 100, 1, 0, (v) => { cam.vh = 56 * Math.pow(3.2 / 56, v / 100); }, () => size());
  zoom.addEventListener("change", check);
  const tb = Kit.el("button", { type: "button", class: "ghost" }, "Thirds: on");
  tb.addEventListener("click", () => { thirds = !thirds; tb.textContent = "Thirds: " + (thirds ? "on" : "off"); });
  const reset = Kit.el("button", { type: "button", class: "ghost" }, "Reset");
  reset.addEventListener("click", () => { cam.cx = 50; cam.cy = 28; zoom.value = 0; zoom.dispatchEvent(new Event("input")); });
  $("ctl").append(tb, reset);
  let drag = null;
  $("c").addEventListener("pointerdown", (e) => { drag = [e.clientX, e.clientY, cam.cx, cam.cy]; $("c").setPointerCapture(e.pointerId); });
  $("c").addEventListener("pointermove", (e) => {
    if (!drag) return;
    const sc = cv.H / cam.vh;
    cam.cx = Math.max(0, Math.min(100, drag[2] - (e.clientX - drag[0]) / sc));
    cam.cy = Math.max(0, Math.min(56, drag[3] - (e.clientY - drag[1]) / sc));
  });
  $("c").addEventListener("pointerup", () => { drag = null; check(); });
  window.FrameLab = { cam, check, zoom };   // used by the recording of the slides
  let drawn = "";
  Kit.loop(() => {
    const key = [cam.cx, cam.cy, cam.vh, thirds, cv.W].join("|");
    if (key === drawn) return; drawn = key;
    RS.draw(cv.ctx, 0, 0, cv.W, cv.H, cam, { thirds });
    Kit.text(cv.ctx, size(), 10, 22, 14, "#fff", "left");
  });
  showTask(); $("msg").textContent = "Drag the picture and use the slider. A task is checked when you let go.";
})();
</script>
</body>
</html>
