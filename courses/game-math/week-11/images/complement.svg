<text x="142" y="300" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">die 1 (rows) × die 2 (columns): 36</text>
<rect x="290" y="60" width="370" height="240" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="304" y="84" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Not A is easier to count</text>
<text x="304" y="102" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">A = “a 5 or 6 on at least one die” (orange). Not A = no 5 or 6:</text>
<text x="304" y="118.9" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">4 × 4 = 16 white cells (1 to 4 on both dice).</text>
<text x="304" y="158" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">P(not A) = 16/36</text>
<text x="304" y="190" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">P(A) = 1 − 16/36 = 20/36 ≈ 0.56</text>
<text x="304" y="234" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">Not 1/3 + 1/3 = 24/36: the 4 cells with a hit on both</text>
<text x="304" y="250.2" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">dice would count twice.</text>
