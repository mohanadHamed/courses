<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Outline view: each line at the left edge becomes a slide</text>
<rect x="20" y="50" width="300" height="230" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
<rect x="20" y="50" width="300" height="26" rx="8" fill="#c43e1c"/>
<text x="32" y="68" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">View › Outline</text>
<text x="34" y="100" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">1  Going paperless</text>
<text x="60" y="125" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• Huda, Office Manager</text>
<text x="34" y="150" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">2  The problem</text>
<text x="60" y="175" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• 9,000 printed pages a month</text>
<text x="60" y="200" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• Lost papers, full cupboards</text>
<text x="34" y="225" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">3  The plan</text>
<text x="60" y="250" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• Shared folders for every team</text>
<text x="170" y="292" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Tab: one level down · Shift+Tab: one level up</text>
<line x1="330" y1="160" x2="347" y2="160" stroke="#D9480F" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="356,160 346,165 346,155" fill="#D9480F"/>
<rect x="366" y="52" width="140" height="78.8" rx="4" fill="#fff4e6" stroke="#ced4da" stroke-width="1.2"/>
<rect x="366" y="52" width="140" height="3.9" rx="0" fill="#D9480F"/>
<text x="374.4" y="70.9" font-size="9.8" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Going paperless</text>
<text x="374.4" y="86.7" font-size="7.3" fill="#2a211c" text-anchor="start" font-weight="600" xml:space="preserve">• Huda, Office Manager</text>
<rect x="520" y="52" width="140" height="78.8" rx="4" fill="#fff4e6" stroke="#ced4da" stroke-width="1.2"/>
<rect x="520" y="52" width="140" height="3.9" rx="0" fill="#D9480F"/>
<text x="528.4" y="70.9" font-size="9.8" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">The problem</text>
<text x="528.4" y="86.7" font-size="7.3" fill="#2a211c" text-anchor="start" font-weight="600" xml:space="preserve">• 9,000 printed pages</text>
<text x="528.4" y="97.9" font-size="7.3" fill="#2a211c" text-anchor="start" font-weight="600" xml:space="preserve">• Lost papers</text>
<rect x="366" y="150" width="140" height="78.8" rx="4" fill="#fff4e6" stroke="#ced4da" stroke-width="1.2"/>
<rect x="366" y="150" width="140" height="3.9" rx="0" fill="#D9480F"/>
<text x="374.4" y="168.9" font-size="9.8" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">The plan</text>
<text x="374.4" y="184.7" font-size="7.3" fill="#2a211c" text-anchor="start" font-weight="600" xml:space="preserve">• Shared folders</text>
<rect x="520" y="150" width="140" height="79" rx="4" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="590" y="194" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">… and so on</text>
