<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="360" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The guard as a state machine</text>
<line x1="160" y1="160" x2="272.2" y2="109.5" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="280,106 273.3,114.2 269.4,105.6" fill="#2a2f2c"/>
<text x="200" y="116" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">s</text>
<line x1="300" y1="116" x2="167.9" y2="172.6" stroke="#6b726e" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<polygon points="160,176 166.9,167.9 170.6,176.6" fill="#6b726e"/>
<text x="232" y="166" font-size="14" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">¬s</text>
<line x1="400" y1="106" x2="512.2" y2="156.5" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="520,160 509.4,160.4 513.3,151.8" fill="#2a2f2c"/>
<text x="480" y="116" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">n</text>
<line x1="520" y1="182" x2="407.7" y2="127.7" stroke="#6b726e" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<polygon points="400,124 410.6,123.9 406.5,132.4" fill="#6b726e"/>
<text x="448" y="168" font-size="14" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">¬n</text>
<line x1="560" y1="210" x2="417.6" y2="282.1" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="410,286 416.3,277.5 420.6,285.9" fill="#2a2f2c"/>
<text x="510" y="266" font-size="14" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">w</text>
<line x1="340" y1="130" x2="340" y2="251.4" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="340,260 335.2,250.5 344.8,250.5" fill="#2a2f2c"/>
<text x="354" y="200" font-size="14" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">w</text>
<line x1="120" y1="210" x2="262.4" y2="286" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="270,290 259.4,289.7 263.8,281.3" fill="#2a2f2c"/>
<text x="176" y="270" font-size="14" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">w</text>
<rect x="50" y="158" width="120" height="44" rx="22" fill="#ffffff" stroke="#2b8a3e" stroke-width="2.5"/>
<text x="110" y="186" font-size="15" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">Patrol</text>
<rect x="280" y="68" width="120" height="44" rx="22" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<text x="340" y="96" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">Chase</text>
<rect x="510" y="158" width="120" height="44" rx="22" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<text x="570" y="186" font-size="15" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">Attack</text>
<rect x="280" y="268" width="120" height="44" rx="22" fill="#ffffff" stroke="#1c7ed6" stroke-width="2.5"/>
<text x="340" y="296" font-size="15" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">Flee</text>
<text x="20" y="344" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Each frame the guard checks only the arrows that leave its state. From every state, w (weak) leads to Flee.</text>
</svg>
