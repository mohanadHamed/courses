<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Network quality for an online game</text>
<rect x="20" y="52" width="640" height="34" rx="0" fill="#A86700"/>
<text x="30" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">measure</text>
<text x="295" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">what it means</text>
<text x="540" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">good for an action game</text>
<text x="30" y="107.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">latency (ping)</text>
<text x="295" y="107.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">time there and back, ms</text>
<text x="540" y="107.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">below about 50 ms</text>
<rect x="20" y="120" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="141.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">jitter</text>
<text x="295" y="141.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">how much the ping changes</text>
<text x="540" y="141.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">below about 10 ms</text>
<text x="30" y="175.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">packet loss</text>
<text x="295" y="175.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">packets that never arrive</text>
<text x="540" y="175.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">below 1 %</text>
<rect x="20" y="188" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="209.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">bandwidth</text>
<text x="295" y="209.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">data per second, Mbit/s</text>
<text x="540" y="209.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">a few Mbit/s is enough</text>
<rect x="20" y="52" width="640" height="170" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<rect x="20" y="236" width="640" height="28" rx="0" fill="#868e96"/>
<text x="30" y="254.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve"></text>
<text x="250" y="254.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">cable (LAN)</text>
<text x="410" y="254.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Wi-Fi</text>
<text x="575" y="254.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">mobile (4G)</text>
<text x="30" y="282.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">typical ping</text>
<text x="250" y="282.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">5–20 ms</text>
<text x="410" y="282.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">10–40 ms</text>
<text x="575" y="282.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">30–80 ms</text>
<rect x="20" y="236" width="640" height="56" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
