<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="420" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="21" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Save Lab: Save, Save As and AutoSave</text>
<text x="24.0" y="56.0" font-size="12" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">Write, then try the buttons. Power cut! shows what you lose.</text>
<rect x="24.0" y="70.0" width="592.0" height="32.0" rx="10" fill="#fff4e6" stroke="#FFC078" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="36.0" y="91.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Task 3: move the file to OneDrive, switch AutoSave on, write, then Power cut!</text>
<rect x="24.0" y="114.0" width="592.0" height="200.0" rx="10" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
