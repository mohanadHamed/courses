<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="260" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The brief of a loop</text>
<rect x="30" y="50" width="620" height="34" rx="0" fill="#9C36B5"/>
<text x="40" y="71.7" font-size="13" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">question</text>
<text x="430" y="71.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">answer for the rowing loop</text>
<text x="40" y="105.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">mood</text>
<text x="430" y="105.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">calm, a little sad, hope</text>
<rect x="30" y="118" width="620" height="34" rx="0" fill="#f8f9fa"/>
<text x="40" y="139.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">tempo</text>
<text x="430" y="139.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">90–110 BPM</text>
<text x="40" y="173.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">length</text>
<text x="430" y="173.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">8 bars (one bar = 4 beats)</text>
<rect x="30" y="186" width="620" height="34" rx="0" fill="#f8f9fa"/>
<text x="40" y="207.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">layers</text>
<text x="430" y="207.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">melody + bass; drums only for danger</text>
<text x="40" y="241.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">file</text>
<text x="430" y="241.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">mus_rowing_calm_loop.ogg, peaks near −6 dB</text>
<rect x="30" y="50" width="620" height="204" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
