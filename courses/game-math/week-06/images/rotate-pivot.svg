<text x="440" y="90" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">1. Move H to the origin:</text>
<text x="456" y="112" font-size="13.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">E − H = (4, 0)</text>
<text x="440" y="144" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">2. Rotate by θ:</text>
<text x="456" y="166" font-size="13.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">90° gives (0, 4)</text>
<text x="440" y="198" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">3. Move back:</text>
<text x="456" y="220" font-size="13.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">(0, 4) + H = (2, 5)</text>
