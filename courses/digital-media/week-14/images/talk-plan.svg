<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A six-minute team talk (example)</text>
<rect x="20" y="50" width="640" height="34" rx="0" fill="#9C36B5"/>
<text x="30" y="71.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">minute</text>
<text x="130" y="71.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">who</text>
<text x="300" y="71.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">what</text>
<text x="30" y="105.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">0–1</text>
<text x="130" y="105.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">producer</text>
<text x="300" y="105.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the brief and the package</text>
<rect x="20" y="118" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="139.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">1–2</text>
<text x="130" y="139.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">artist</text>
<text x="300" y="139.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">storyboard to shots</text>
<text x="30" y="173.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">2–3</text>
<text x="130" y="173.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">sound designer</text>
<text x="300" y="173.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the sound set</text>
<rect x="20" y="186" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="207.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">3–5</text>
<text x="130" y="207.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">editor</text>
<text x="300" y="207.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the promo clip, shown in full</text>
<text x="30" y="241.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">5–6</text>
<text x="130" y="241.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">producer</text>
<text x="300" y="241.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">review, credits, what we learned</text>
<rect x="20" y="50" width="640" height="204" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="278" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Alone: the same six minutes, with the production log as your guide.</text>
</svg>
