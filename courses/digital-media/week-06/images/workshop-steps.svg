<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="260" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The storyboard workshop: from brief to a checked board</text>
<rect x="18" y="80" width="98" height="64" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<circle cx="34" cy="96" r="11" fill="#9C36B5"/>
<text x="34" y="100" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<text x="67" y="128" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Brief</text>
<line x1="117" y1="112" x2="120.7" y2="112" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="127,112 120,115.5 120,108.5" fill="#6b726e"/>
<rect x="128" y="80" width="98" height="64" rx="10" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<circle cx="144" cy="96" r="11" fill="#9C36B5"/>
<text x="144" y="100" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<text x="177" y="128" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Beat list</text>
<line x1="227" y1="112" x2="230.7" y2="112" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="237,112 230,115.5 230,108.5" fill="#6b726e"/>
<rect x="238" y="80" width="98" height="64" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<circle cx="254" cy="96" r="11" fill="#9C36B5"/>
<text x="254" y="100" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<text x="287" y="128" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Thumbnails</text>
<line x1="337" y1="112" x2="340.7" y2="112" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="347,112 340,115.5 340,108.5" fill="#6b726e"/>
<rect x="348" y="80" width="98" height="64" rx="10" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<circle cx="364" cy="96" r="11" fill="#9C36B5"/>
<text x="364" y="100" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<text x="397" y="128" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Clean panels</text>
<line x1="447" y1="112" x2="450.7" y2="112" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="457,112 450,115.5 450,108.5" fill="#6b726e"/>
<rect x="458" y="80" width="98" height="64" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<circle cx="474" cy="96" r="11" fill="#9C36B5"/>
<text x="474" y="100" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">5</text>
<text x="507" y="128" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Animatic</text>
<line x1="557" y1="112" x2="560.7" y2="112" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="567,112 560,115.5 560,108.5" fill="#6b726e"/>
<rect x="568" y="80" width="98" height="64" rx="10" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<circle cx="584" cy="96" r="11" fill="#9C36B5"/>
<text x="584" y="100" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">6</text>
<text x="617" y="128" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Review</text>
<text x="340" y="186" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Steps 1–2 plan, steps 3–4 draw, steps 5–6 check and improve.</text>
<text x="340" y="212" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Expect a version 2: every good board is changed at least once.</text>
