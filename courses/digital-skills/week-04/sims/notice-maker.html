<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Notice Maker</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .hud { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin: 0 0 8px; font-weight: 800; }
    .sim .hud .lvl { color: var(--sim-accent); } .sim .hud .stars { margin-left: auto; }
    .sim .ribbon { display: flex; flex-wrap: wrap; gap: 6px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 10px; padding: 8px; }
    .sim .ribbon button { padding: 6px 10px; font-size: 0.85rem; background: #fff; color: #2a211c; border: 1px solid #ced4da; box-shadow: none; }
    .sim .wrap { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 10px; margin-top: 10px; }
    .sim .page { background: #fff; border: 1px solid #ced4da; box-shadow: 3px 3px 0 #e9ecef; padding: 14px 18px; font-family: Calibri, Carlito, Arial, sans-serif; font-size: 15px; overflow: hidden; }
    .sim .blk { border: 2px solid transparent; border-radius: 4px; padding: 2px 4px; margin-bottom: 6px; cursor: pointer; }
    .sim .blk.sel { border-color: var(--sim-accent); }
    .sim .blk p { margin: 0; }
    .sim .title { font-size: 26px; color: #D9480F; font-weight: 400; }
    .sim .h1 { font-size: 19px; color: #1c5fb4; font-weight: 700; }
    .sim .blk ul, .sim .blk ol { margin: 0; padding-left: 22px; }
    .sim .blk table { border-collapse: collapse; } .sim .blk td { border: 1px solid #dee2e6; padding: 2px 8px; }
    .sim .pic { width: 120px; height: 84px; background: linear-gradient(#a5d8ff 60%, #8ce99a 60%); border-radius: 4px; position: relative; }
    .sim .pic::after { content: ""; position: absolute; right: 16px; top: 12px; width: 18px; height: 18px; border-radius: 50%; background: #ffd43b; }
    .sim .pic.square { float: right; margin: 0 0 6px 10px; }
    .sim .jobs { border: 1px solid #e9ecef; border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; }
    .sim .jobs b { color: var(--sim-accent); }
    .sim .jobs ul { padding-left: 18px; margin: 6px 0; } .sim .jobs li.ok { color: #2b8a3e; font-weight: 800; } .sim .jobs li.ok::marker { content: "✓ "; }
    .sim .alt { display: none; gap: 6px; margin-top: 8px; } .sim .alt.on { display: flex; } .sim .alt input { flex: 1; font: inherit; padding: 6px 8px; border: 1px solid #ced4da; border-radius: 8px; }
    .sim .message.bad { color: #c92a2a; }
    .sim .clear { clear: both; }
    @media (max-width: 560px) { .sim .wrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Notice Maker</h1>
  <p class="hint">Huda must make the notice for the Sunrise Company Family Day. Tap a part of the page, then a button. Finish the six jobs on the list with as few wrong clicks as you can.</p>
  <div class="hud"><span class="lvl" id="lvl">Sunrise Family Day</span><span id="done">0 of 6 jobs</span><span class="stars" id="stars">wrong clicks: 0</span></div>
  <div class="ribbon" id="ribbon"></div>
  <div class="alt" id="alt"><input id="altText" placeholder="Describe the picture in a few words"><button id="altOk" type="button">Save alt text</button></div>
  <div class="wrap">
    <div class="page" id="page"></div>
    <div class="jobs"><b>Jobs</b><ul id="jobs"></ul></div>
  </div>
  <p id="msg" class="message">Tap the first line, "Sunrise Family Day".</p>
  <button id="again" type="button" class="ghost">Play again</button>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const TIMES = [["9:00", "The bus leaves the office"], ["10:00", "Breakfast in the park"], ["13:00", "Lunch"], ["16:00", "The bus comes back"]];
  const THINGS = ["water", "a hat", "sun cream"];
  const TOOLS = [["Title", "title"], ["Heading 1", "h1"], ["Normal", "normal"], ["Bullets", "bul"], ["Numbering", "num"], ["Table", "table"], ["Wrap: Square", "square"], ["Wrap: In Line", "inline"], ["Alt Text", "alt"]];
  const $ = (id) => document.getElementById(id);
  let blocks, sel, wrong, finished;
  function reset() {
    blocks = [
      { id: "title", text: "Sunrise Family Day", style: "normal" },
      { id: "plan", text: "The plan", style: "normal" },
      { id: "times", style: "lines" },
      { id: "bring", text: "What to bring", style: "normal" },
      { id: "things", style: "lines" },
      { id: "pic", wrap: "inline", alt: "" },
    ];
    sel = 0; wrong = 0; finished = false; $("alt").className = "alt";
    say("Tap the first line, \"Sunrise Family Day\"."); paint();
  }
  const B = (id) => blocks.find((b) => b.id === id);
  const JOBS = [
    ["the title has the style Title", () => B("title").style === "title"],
    ["both headings have Heading 1", () => B("plan").style === "h1" && B("bring").style === "h1"],
    ["the things to bring are a bulleted list", () => B("things").style === "bul"],
    ["the times are a table", () => B("times").style === "table"],
    ["the picture has Square wrapping", () => B("pic").wrap === "square"],
    ["the picture has alt text", () => B("pic").alt.trim().split(/\s+/).length >= 3],
  ];
  function say(t, c = "") { $("msg").textContent = t; $("msg").className = "message " + c; }
  function html(b) {
    if (b.id === "pic") return `<div class="pic ${b.wrap === "square" ? "square" : ""}" title="${b.alt}"></div>`;
    if (b.id === "times") {
      if (b.style === "table") return `<table>${TIMES.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>`;
      return TIMES.map((r) => `<p>${r[0]}   ${r[1]}</p>`).join("");
    }
    if (b.id === "things") {
      if (b.style === "bul") return `<ul>${THINGS.map((t) => `<li>${t}</li>`).join("")}</ul>`;
      if (b.style === "num") return `<ol>${THINGS.map((t) => `<li>${t}</li>`).join("")}</ol>`;
      return THINGS.map((t) => `<p>${t}</p>`).join("");
    }
    return `<p class="${b.style === "title" ? "title" : b.style === "h1" ? "h1" : ""}">${b.text}</p>`;
  }
  function paint() {
    // the picture floats next to the text that follows it: put it before "What to bring" when it wraps
    const order = B("pic").wrap === "square" ? ["title", "plan", "times", "pic", "bring", "things"] : ["title", "plan", "times", "bring", "things", "pic"];
    $("page").innerHTML = "";
    order.forEach((id) => {
      const b = B(id), i = blocks.indexOf(b), d = document.createElement("div");
      d.className = "blk" + (i === sel ? " sel" : ""); d.innerHTML = html(b);
      if (id === "pic" && b.wrap === "square") d.style.cssText = "float:right;margin:0 0 4px 8px;";
      d.addEventListener("click", () => { if (finished) return; sel = i; $("alt").className = "alt"; say(id === "pic" ? "The picture is selected." : "Selected. Choose a button."); paint(); });
      $("page").appendChild(d);
    });
    const clr = document.createElement("div"); clr.className = "clear"; $("page").appendChild(clr);
    const res = JOBS.map(([, f]) => f()), n = res.filter(Boolean).length;
    $("jobs").innerHTML = JOBS.map(([t], i) => `<li class="${res[i] ? "ok" : ""}">${t}</li>`).join("");
    $("done").textContent = `${n} of 6 jobs`; $("stars").textContent = `wrong clicks: ${wrong}`;
    if (n === 6 && !finished) {
      finished = true; const stars = wrong === 0 ? 3 : wrong <= 2 ? 2 : 1;
      say(`🎉 The notice is ready: easy to read, with a map of headings, a clear list, a table and an accessible picture. ${"★".repeat(stars)} (${wrong} wrong clicks)`, "good");
    }
  }
  function bad(t) { wrong++; say("✗ " + t, "bad"); paint(); }
  TOOLS.forEach(([label, k]) => {
    const btn = document.createElement("button"); btn.type = "button"; btn.dataset.t = k; btn.textContent = label;
    btn.addEventListener("click", () => {
      if (finished) { say("The notice is done. Press Play again."); return; }
      if (sel === null) { say("First tap a part of the page."); return; }
      const b = blocks[sel];
      if (b.id === "pic") {
        if (k === "square" || k === "inline") { b.wrap = k; say(k === "square" ? "The text now flows around the picture." : "The picture sits in its own line again."); paint(); return; }
        if (k === "alt") { $("alt").className = "alt on"; $("altText").value = b.alt; $("altText").focus(); say("Write what the picture shows, for people who cannot see it."); return; }
        return bad("A picture has no text style. Use Wrap or Alt Text.");
      }
      if (["square", "inline", "alt"].includes(k)) return bad("Wrap and Alt Text are for pictures. Tap the picture first.");
      if (b.id === "times") {
        if (k === "table") { b.style = "table"; say("The times are now a table: time in one column, activity in the other."); paint(); return; }
        return bad(k === "num" || k === "bul" ? "Each line has two kinds of information (time and activity): that is a table, not a list." : "This is a plan with times. Which tool puts information in rows and columns?");
      }
      if (b.id === "things") {
        if (k === "bul") { b.style = "bul"; say("A bulleted list: things in no special order."); paint(); return; }
        if (k === "num") { b.style = "num"; return bad("Numbers are for steps in an order. Water, a hat and sun cream have no order."); }
        return bad("These lines are a list of things. Which list?");
      }
      // single lines: title and headings
      if (k === "table" || k === "bul" || k === "num") return bad("One line is not a list or a table. Give it a style.");
      b.style = k;
      if (b.id === "title" && k !== "title") return bad("This is the name of the whole notice. Which style is for that?");
      if (b.id !== "title" && k !== "h1") return bad(k === "title" ? "A notice has only one title. This line is a main heading." : "This line is a main heading, not normal text.");
      say("Right style."); sel = blocks.findIndex((x, j) => j > sel && x.id !== "times"); if (sel < 0) sel = null; paint();
    });
    $("ribbon").appendChild(btn);
  });
  $("altOk").addEventListener("click", () => {
    const v = $("altText").value.trim();
    if (v.split(/\s+/).filter(Boolean).length < 3) { say("Write at least three words, for example: a green park with trees.", "bad"); return; }
    B("pic").alt = v; $("alt").className = "alt"; say("Alt text saved. A screen reader reads it aloud."); paint();
  });
  $("again").addEventListener("click", reset);
  reset();
})();
</script>
</body>
</html>
