<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Local space → world space → camera space</text>
<rect x="20" y="56" width="196" height="190" rx="12" fill="#2F9E4411" stroke="#2F9E44" stroke-width="1.8"/>
<text x="118" y="82" font-size="15" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">local space</text>
<text x="118" y="214" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">cannon at (2, 1) on the ship</text>
<polygon points="40,200 140,200 160,170 30,170" fill="#e9d5c4" stroke="#a0522d" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="120" cy="160" r="5" fill="#2a2f2c"/>
<circle cx="80" cy="180" r="3" fill="#ffffff"/>
<line x1="218" y1="150" x2="231.9" y2="150" stroke="#e8590c" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="240,150 231,154.5 231,145.5" fill="#e8590c"/>
<rect x="242" y="56" width="196" height="190" rx="12" fill="#1c7ed611" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="340" y="82" font-size="15" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">world space</text>
<text x="340" y="214" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">ship at (10, 4), turned 90°:</text>
<text x="340" y="229.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">(9, 6)</text>
<polygon points="411,170 411,105 391.5,92 391.5,176.5" fill="#e9d5c4" stroke="#a0522d" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="385" cy="118" r="5" fill="#2a2f2c"/>
<line x1="440" y1="150" x2="453.9" y2="150" stroke="#e8590c" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="462,150 453,154.5 453,145.5" fill="#e8590c"/>
<rect x="464" y="56" width="196" height="190" rx="12" fill="#7048e811" stroke="#7048e8" stroke-width="1.8"/>
<text x="562" y="82" font-size="15" fill="#7048e8" text-anchor="middle" font-weight="800" xml:space="preserve">camera space</text>
<text x="562" y="214" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">camera at (8, 3): (9, 6) −</text>
<text x="562" y="229.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">(8, 3) = (1, 3)</text>
<rect x="504" y="150" width="22" height="16" rx="3" fill="#7048e8"/>
<circle cx="584" cy="110" r="5" fill="#2a2f2c"/>
<line x1="515" y1="150" x2="573" y2="117" stroke="#7048e8" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<polygon points="580,113 574.4,121.4 570,113.5" fill="#7048e8"/>
<text x="150" y="274" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">M_world = ship&#x27;s T × R</text>
<text x="500" y="274" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">camera space = camera&#x27;s inverse × world</text>
</svg>
