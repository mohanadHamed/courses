<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Units 1–7 in four parts</text>
<rect x="20" y="54" width="310" height="112" rx="14" fill="#D9480F12" stroke="#D9480F" stroke-width="2"/>
<text x="34" y="82" font-size="15" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Files and the cloud</text>
<rect x="238" y="65.5" width="84" height="21" rx="10.5" fill="#D9480F"/>
<text x="280" y="80" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Units 1 and 3</text>
<text x="34" y="110" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">account, folders, file names, sync, backup,</text>
<text x="34" y="126.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">share links, Office in three places</text>
<rect x="350" y="54" width="310" height="112" rx="14" fill="#1c7ed612" stroke="#1c7ed6" stroke-width="2"/>
<text x="364" y="82" font-size="15" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">AI tools and prompts</text>
<rect x="568" y="65.5" width="84" height="21" rx="10.5" fill="#1c7ed6"/>
<text x="610" y="80" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Units 2 and 5</text>
<text x="364" y="110" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">what AI does well, task + context + format,</text>
<text x="364" y="126.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">follow-up, check every answer, no personal</text>
<text x="364" y="142.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">data</text>
<rect x="20" y="182" width="310" height="112" rx="14" fill="#7048e812" stroke="#7048e8" stroke-width="2"/>
<text x="34" y="210" font-size="15" fill="#7048e8" text-anchor="start" font-weight="800" xml:space="preserve">Word</text>
<rect x="238" y="193.5" width="84" height="21" rx="10.5" fill="#7048e8"/>
<text x="280" y="208" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Units 4 and 5</text>
<text x="34" y="238" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">formatting, styles, lists, tables, pictures,</text>
<text x="34" y="254.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">page layout, header, contents, letter, CV</text>
<rect x="350" y="182" width="310" height="112" rx="14" fill="#2b8a3e12" stroke="#2b8a3e" stroke-width="2"/>
<text x="364" y="210" font-size="15" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Excel</text>
<rect x="568" y="193.5" width="84" height="21" rx="10.5" fill="#2b8a3e"/>
<text x="610" y="208" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Units 6 and 7</text>
<text x="364" y="238" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">formulas, $ references, SUM and more,</text>
<text x="364" y="254.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">budget, sort, filter, rules, charts</text>
<text x="340" y="318" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Each unit had a lecture and an online activity.</text>
</svg>
