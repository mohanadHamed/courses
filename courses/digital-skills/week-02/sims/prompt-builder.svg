<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="640" height="440" fill="#ffffff"/>
<text x="24" y="36" font-size="22" fill="#2a2f2c" text-anchor="start" font-weight="800">Prompt Builder: task, context, format</text>
<rect x="24" y="50" width="592" height="46" rx="12" fill="#fff8f1" stroke="#ffc078" stroke-width="1.5"/>
<text x="36" y="69" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Goal: a message to Ms Rana. You will miss Thursday's</text>
<text x="36" y="86" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">class because of a doctor's appointment.</text>
<rect x="24" y="106" width="592" height="34" rx="10" fill="#fff0e0" stroke="#D9480F" stroke-width="1.5"/>
<rect x="32" y="113" width="74" height="20" rx="6" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="69" y="127" font-size="11" fill="#fff" text-anchor="middle" font-weight="800">TASK</text>
<text x="118" y="128" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700">Write a short message to my teacher.</text>
<rect x="24" y="146" width="592" height="34" rx="10" fill="#fff0e0" stroke="#D9480F" stroke-width="1.5"/>
<rect x="32" y="153" width="74" height="20" rx="6" fill="#1c7ed6" stroke="none" stroke-width="1.5"/>
<text x="69" y="167" font-size="11" fill="#fff" text-anchor="middle" font-weight="800">CONTEXT</text>
<text x="118" y="168" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700">I will miss Thursday's class ...</text>
<rect x="24" y="186" width="592" height="34" rx="10" fill="#fff" stroke="#e3dcd5" stroke-width="1.5"/>
<rect x="32" y="193" width="74" height="20" rx="6" fill="#2b8a3e" stroke="none" stroke-width="1.5"/>
<text x="69" y="207" font-size="11" fill="#fff" text-anchor="middle" font-weight="800">FORMAT</text>
<text x="118" y="208" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700">Write 3 polite sentences ...</text>
<rect x="24" y="226" width="592" height="34" rx="10" fill="#fff" stroke="#e3dcd5" stroke-width="1.5"/>
<rect x="32" y="233" width="74" height="20" rx="6" fill="#868e96" stroke="none" stroke-width="1.5"/>
<text x="69" y="247" font-size="11" fill="#fff" text-anchor="middle" font-weight="800">EXTRA</text>
<text x="118" y="248" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700">My student ID is 2026123456.</text>
<rect x="24" y="274" width="100" height="26" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/>
<text x="74" y="292" font-size="13" fill="#2b8a3e" text-anchor="middle" font-weight="800">ok Task</text>
<rect x="134" y="274" width="100" height="26" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/>
<text x="184" y="292" font-size="13" fill="#2b8a3e" text-anchor="middle" font-weight="800">ok Context</text>
<rect x="244" y="274" width="100" height="26" rx="8" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<text x="294" y="292" font-size="13" fill="#868e96" text-anchor="middle" font-weight="800">Format</text>
<rect x="24" y="312" width="592" height="92" rx="14" fill="#fff" stroke="#e3dcd5" stroke-width="1.5"/>
<text x="36" y="332" font-size="11" fill="#0b7285" text-anchor="start" font-weight="800">AI assistant</text>
<text x="36" y="352" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600">Dear Ms Rana, I hope you are well. I am writing to tell you that I will</text>
<text x="36" y="369" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600">not be able to attend the class on Thursday. The reason is that I have</text>
<text x="36" y="386" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600">an appointment with the doctor ... (far too long: add the format)</text>
<text x="24" y="426" font-size="13" fill="#7a6a60" text-anchor="start" font-weight="700">The facts are right, but the answer is too long. Add the format.</text>
</svg>
