<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="700" height="220" fill="#ffffff"/>
<rect x="14.0" y="14.0" width="330.0" height="192.0" rx="14" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
<rect x="28.0" y="28.0" width="120.0" height="120.0" rx="10" fill="#ffd8a8" stroke="none"/>
<text x="88.0" y="92.0" font-size="15" fill="#7a3a00" text-anchor="middle" font-weight="800" xml:space="preserve">Post A</text>
<text x="164.0" y="52.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">views: 1000</text>
<text x="164.0" y="80.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">clicks: 20</text>
<text x="164.0" y="108.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">orders: 3</text>
<text x="164.0" y="140.0" font-size="13" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">2 clicks for</text>
<text x="164.0" y="158.0" font-size="13" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">every 100 views</text>
<text x="179.0" y="192.0" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">20 ÷ 1000 × 100 = 2</text>
<rect x="364.0" y="14.0" width="330.0" height="192.0" rx="14" fill="#ffffff" stroke="#2f9e44" stroke-width="2.5"/>
<rect x="378.0" y="28.0" width="120.0" height="120.0" rx="10" fill="#ffd8a8" stroke="none"/>
<text x="438.0" y="92.0" font-size="15" fill="#7a3a00" text-anchor="middle" font-weight="800" xml:space="preserve">Post B</text>
<text x="514.0" y="52.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">views: 500</text>
<text x="514.0" y="80.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">clicks: 25</text>
<text x="514.0" y="108.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">orders: 6</text>
<text x="514.0" y="140.0" font-size="13" fill="#2f9e44" text-anchor="start" font-weight="800" xml:space="preserve">5 clicks for</text>
<text x="514.0" y="158.0" font-size="13" fill="#2f9e44" text-anchor="start" font-weight="800" xml:space="preserve">every 100 views</text>
<text x="529.0" y="192.0" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">25 ÷ 500 × 100 = 5</text>
<polyline points="670.0,30.0 674.0,34.0 682.0,25.0" fill="none" stroke="#2f9e44" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
