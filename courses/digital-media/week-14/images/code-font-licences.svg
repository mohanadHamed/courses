<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="280" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Licences of code, fonts and tools</text>
<rect x="20" y="50" width="640" height="42" rx="0" fill="#9C36B5"/>
<text x="30" y="75.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">licence</text>
<text x="200" y="75.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">used for</text>
<text x="390" y="75.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">in a game you sell</text>
<text x="30" y="117.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">MIT, BSD</text>
<text x="200" y="117.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">code libraries</text>
<text x="390" y="117.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">OK: keep the copyright notice</text>
<rect x="20" y="134" width="640" height="42" rx="0" fill="#f8f9fa"/>
<text x="30" y="159.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">GPL</text>
<text x="200" y="159.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">code</text>
<rect x="380" y="134" width="280" height="42" rx="0" fill="#fff3bf"/>
<text x="390" y="159.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">careful: your code may have to be shared</text>
<text x="30" y="201.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">SIL OFL</text>
<text x="200" y="201.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">fonts</text>
<text x="390" y="201.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">OK to embed; do not sell the font alone</text>
<rect x="20" y="218" width="640" height="42" rx="0" fill="#f8f9fa"/>
<text x="30" y="243.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">engine or tool terms</text>
<text x="200" y="243.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">game engines, plug-ins</text>
<text x="390" y="243.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">read them: fees, splash screen, limits</text>
<rect x="20" y="50" width="640" height="210" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
