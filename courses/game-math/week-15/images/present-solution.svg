<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Presenting a solution: five parts, one minute each</text>
<rect x="20" y="52" width="640" height="44" rx="10" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.5"/>
<text x="36" y="80" font-size="13.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">1 Problem</text>
<text x="210" y="80" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">&quot;A drone flies from (2, 1) to (8, 9) at 5 units/s. How long?&quot;</text>
<rect x="20" y="104" width="640" height="44" rx="10" fill="#ffffff" stroke="#2F9E44" stroke-width="1.5"/>
<text x="36" y="132" font-size="13.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">2 Sketch</text>
<text x="210" y="132" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">an arrow from the start to the goal</text>
<rect x="20" y="156" width="640" height="44" rx="10" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.5"/>
<text x="36" y="184" font-size="13.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">3 Tool</text>
<text x="210" y="184" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">the step vector and its length (lecture 2)</text>
<rect x="20" y="208" width="640" height="44" rx="10" fill="#ffffff" stroke="#2F9E44" stroke-width="1.5"/>
<text x="36" y="236" font-size="13.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">4 Steps</text>
<text x="210" y="236" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">(6, 8); length 10; time 10 ÷ 5 = 2 s</text>
<rect x="20" y="260" width="640" height="44" rx="10" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.5"/>
<text x="36" y="288" font-size="13.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">5 Check and answer</text>
<text x="210" y="288" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">5 units/s × 2 s = 10: &quot;The drone arrives after two seconds.&quot;</text>
<text x="340" y="320" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Say the answer in game words, and show one check.</text>
</svg>
