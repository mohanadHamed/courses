<text x="216.0" y="247.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">old Office files</text>
<text x="216.0" y="265.0" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">they open in Compatibility Mode</text>
