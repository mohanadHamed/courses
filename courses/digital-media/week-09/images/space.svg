<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Space: panning and 3D sound with distance falloff</text>
<rect x="20" y="54" width="300" height="220" rx="12" fill="#fbf8ff" stroke="#e5dbff" stroke-width="1.2"/>
<text x="170" y="80" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">Panning</text>
<line x1="50" y1="160" x2="290" y2="160" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
<text x="50" y="186" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">left</text>
<text x="290" y="186" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">right</text>
<circle cx="90" cy="160" r="10" fill="#e8590c"/>
<text x="90" y="140" font-size="12" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">meow (−0.7)</text>
<circle cx="170" cy="160" r="10" fill="#1c7ed6"/>
<text x="170" y="212" font-size="12" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">voice (0)</text>
<rect x="350" y="54" width="310" height="220" rx="12" fill="#fbf8ff" stroke="#e5dbff" stroke-width="1.2"/>
<text x="505" y="80" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">3D sound</text>
<circle cx="420" cy="175" r="22" fill="#9C36B555"/>
<circle cx="420" cy="175" r="44" fill="#9C36B533"/>
<circle cx="420" cy="175" r="66" fill="#9C36B518"/>
<rect x="411" y="166" width="18" height="18" rx="3" fill="#9C36B5"/>
<text x="420" y="209" font-size="11.5" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">engine</text>
<circle cx="560" cy="120" r="9" fill="#2a2f2c"/>
<text x="560" y="104" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">listener (camera)</text>
<line x1="430" y1="170" x2="545.3" y2="126.5" stroke="#e8590c" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/>
<polygon points="552,124 545.9,130.6 543.1,123.1" fill="#e8590c"/>
<text x="470" y="220" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Farther from the listener:</text>
<text x="470" y="235.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">quieter (falloff).</text>
</svg>
