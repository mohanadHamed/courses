<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Two cards without putting the first back: the second branch changes</text>
<circle cx="50" cy="170" r="7" fill="#2a2f2c"/>
<line x1="57" y1="170" x2="190" y2="100" stroke="#2a2f2c" stroke-width="2" stroke-linecap="round"/>
<text x="120" y="125" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">3/12</text>
<rect x="190" y="84" width="74" height="32" rx="8" fill="#d0ebff" stroke="#1c7ed6" stroke-width="1.6"/>
<text x="227" y="105" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">storm</text>
<line x1="264" y1="100" x2="380" y2="66" stroke="#2a2f2c" stroke-width="1.6" stroke-linecap="round"/>
<text x="320" y="75" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">2/11</text>
<rect x="380" y="52" width="66" height="28" rx="7" fill="#d0ebff" stroke="#1c7ed6" stroke-width="1.4"/>
<text x="413" y="71" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">storm</text>
<text x="460" y="71" font-size="12.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">3/12 × 2/11 = 6/132</text>
<line x1="264" y1="100" x2="380" y2="134" stroke="#2a2f2c" stroke-width="1.6" stroke-linecap="round"/>
<text x="320" y="135" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">9/11</text>
<rect x="380" y="120" width="66" height="28" rx="7" fill="#fff4e6" stroke="#e8590c" stroke-width="1.4"/>
<text x="413" y="139" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">sun</text>
<text x="460" y="139" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">3/12 × 9/11 = 27/132</text>
<line x1="57" y1="170" x2="190" y2="240" stroke="#2a2f2c" stroke-width="2" stroke-linecap="round"/>
<text x="120" y="227" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">9/12</text>
<rect x="190" y="224" width="74" height="32" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="227" y="245" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">sun</text>
<line x1="264" y1="240" x2="380" y2="206" stroke="#2a2f2c" stroke-width="1.6" stroke-linecap="round"/>
<text x="320" y="215" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">3/11</text>
<rect x="380" y="192" width="66" height="28" rx="7" fill="#d0ebff" stroke="#1c7ed6" stroke-width="1.4"/>
<text x="413" y="211" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">storm</text>
<text x="460" y="211" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">9/12 × 3/11 = 27/132</text>
<line x1="264" y1="240" x2="380" y2="274" stroke="#2a2f2c" stroke-width="1.6" stroke-linecap="round"/>
<text x="320" y="275" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">8/11</text>
<rect x="380" y="260" width="66" height="28" rx="7" fill="#fff4e6" stroke="#e8590c" stroke-width="1.4"/>
<text x="413" y="279" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">sun</text>
<text x="460" y="279" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">9/12 × 8/11 = 72/132</text>
<text x="20" y="316" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">12 event cards, 3 storms. P(two storms) = 6/132 = 1/22. With the card put back it would be 1/16.</text>
</svg>
