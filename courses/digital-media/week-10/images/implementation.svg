<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="310" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Implementation: from a game event to a sound</text>
<rect x="20" y="60" width="150" height="70" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="95" y="88" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">event</text>
<text x="95" y="112" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Pasha is caught</text>
<line x1="171" y1="95" x2="177.7" y2="95" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="184,95 177,98.5 177,91.5" fill="#e8590c"/>
<rect x="185" y="60" width="150" height="70" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="260" y="88" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">audio source</text>
<text x="260" y="112" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">plays sfx_net_catch</text>
<line x1="336" y1="95" x2="342.7" y2="95" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="349,95 342,98.5 342,91.5" fill="#e8590c"/>
<rect x="350" y="60" width="150" height="70" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="425" y="88" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">mixer group</text>
<text x="425" y="112" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">effects, −3 dB</text>
<line x1="501" y1="95" x2="507.7" y2="95" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="514,95 507,98.5 507,91.5" fill="#e8590c"/>
<rect x="515" y="60" width="150" height="70" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="590" y="88" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">master</text>
<text x="590" y="112" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">to the speakers</text>
<rect x="20" y="160" width="640" height="32" rx="0" fill="#9C36B5"/>
<text x="30" y="180.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">sound</text>
<text x="315" y="180.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">how it is loaded</text>
<text x="545" y="180.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">why</text>
<text x="30" y="212.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">short effect (step)</text>
<text x="315" y="212.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">into memory, WAV or ADPCM</text>
<text x="545" y="212.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">plays at once, many times</text>
<rect x="20" y="224" width="640" height="32" rx="0" fill="#f8f9fa"/>
<text x="30" y="244.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">music, ambience</text>
<text x="315" y="244.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">streamed, OGG</text>
<text x="545" y="244.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">small in memory</text>
<text x="30" y="276.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">voice lines</text>
<text x="315" y="276.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">compressed, loaded when needed</text>
<text x="545" y="276.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">many lines, played once</text>
<rect x="20" y="160" width="640" height="128" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
