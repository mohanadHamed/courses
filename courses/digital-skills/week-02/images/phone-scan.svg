<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="900" height="320" fill="#ffffff"/>
<rect x="10" y="10" width="880" height="300" rx="18" fill="#fff9f2" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="450.0" y="42" font-size="17" fill="#7a2a06" text-anchor="middle" font-weight="800">Scan a page into one PDF with your phone</text>
<rect x="60" y="56" width="200" height="250" rx="22" fill="#343a40"/><rect x="68" y="72" width="184" height="218" rx="10" fill="#fff"/>
<polygon points="88,96 228,88 236,258 82,266" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5"/>
<line x1="98" y1="120" x2="220" y2="116" stroke="#ced4da" stroke-width="2"/>
<line x1="98" y1="142" x2="220" y2="138" stroke="#ced4da" stroke-width="2"/>
<line x1="98" y1="164" x2="220" y2="160" stroke="#ced4da" stroke-width="2"/>
<line x1="98" y1="186" x2="220" y2="182" stroke="#ced4da" stroke-width="2"/>
<line x1="98" y1="208" x2="220" y2="204" stroke="#ced4da" stroke-width="2"/>
<line x1="98" y1="230" x2="220" y2="226" stroke="#ced4da" stroke-width="2"/>
<polygon points="92,100 224,93 231,253 87,260" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-dasharray="7 5"/>
<text x="160" y="288" font-size="12" fill="#2b8a3e" text-anchor="middle" font-weight="800">math-homework3.pdf</text>
<circle cx="310" cy="91" r="12" fill="#0b7285"/><text x="310" y="96" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">1</text><text x="330" y="96" font-size="14.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Android: the Google Drive app, + , then Scan.</text>
<circle cx="310" cy="133" r="12" fill="#0b7285"/><text x="310" y="138" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">2</text><text x="330" y="138" font-size="14.5" fill="#2a2f2c" text-anchor="start" font-weight="700">iPhone: the Files app (or Notes), then Scan Documents.</text>
<circle cx="310" cy="175" r="12" fill="#0b7285"/><text x="310" y="180" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">3</text><text x="330" y="180" font-size="14.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Hold the phone over the page, in good light.</text>
<circle cx="310" cy="217" r="12" fill="#0b7285"/><text x="310" y="222" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">4</text><text x="330" y="222" font-size="14.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Check the crop: the whole page, straight, nothing more.</text>
<circle cx="310" cy="259" r="12" fill="#0b7285"/><text x="310" y="264" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">5</text><text x="330" y="264" font-size="14.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Save it as a PDF with a good name: math-homework3.pdf</text>
</svg>
