<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="270" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Where game sounds come from</text>
<rect x="20" y="54" width="200" height="170" rx="12" fill="#9C36B512" stroke="#9C36B5" stroke-width="1.8"/>
<text x="120" y="82" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">Record (foley)</text>
<text x="120" y="118" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">real objects</text>
<text x="120" y="148" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">a towel for a cat jump</text>
<text x="120" y="178" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">a bucket of water</text>
<rect x="240" y="54" width="200" height="170" rx="12" fill="#1c7ed612" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="340" y="82" font-size="15" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">Make (synthesis)</text>
<text x="340" y="118" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">tones and noise</text>
<text x="340" y="148" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">beeps, lasers, UI clicks</text>
<text x="340" y="178" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">a step sequencer</text>
<rect x="460" y="54" width="200" height="170" rx="12" fill="#0c859912" stroke="#0c8599" stroke-width="1.8"/>
<text x="560" y="82" font-size="15" fill="#0c8599" text-anchor="middle" font-weight="800" xml:space="preserve">Use (a library)</text>
<text x="560" y="118" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">ready sounds</text>
<text x="560" y="148" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">check the licence</text>
<text x="560" y="178" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">write the credit</text>
<text x="340" y="254" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Licences and credits come in lectures 23–26.</text>
</svg>
