<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="600" height="440" fill="#ffffff"/>
<rect x="110.0" y="60.0" width="220.0" height="160.0" rx="0" fill="#f4e1f8" stroke="#9C36B5" stroke-width="1.5"/>
<rect x="330.0" y="60.0" width="220.0" height="160.0" rx="0" fill="#fbf3fd" stroke="#9C36B5" stroke-width="1.5"/>
<rect x="110.0" y="220.0" width="220.0" height="160.0" rx="0" fill="#fbf3fd" stroke="#9C36B5" stroke-width="1.5"/>
<rect x="330.0" y="220.0" width="220.0" height="160.0" rx="0" fill="#ffffff" stroke="#9C36B5" stroke-width="1.5"/>
<text x="220.0" y="46.0" font-size="13" fill="#5f1f70" text-anchor="middle" font-weight="800">in the game space</text>
<text x="440.0" y="46.0" font-size="13" fill="#5f1f70" text-anchor="middle" font-weight="800">not in the game space</text>
<text x="92" y="140.0" font-size="13" fill="#5f1f70" font-weight="800" text-anchor="middle" transform="rotate(-90 92 140.0)">in the story</text>
<text x="92" y="300.0" font-size="13" fill="#5f1f70" font-weight="800" text-anchor="middle" transform="rotate(-90 92 300.0)">not in the story</text>
<text x="220.0" y="122.0" font-size="18" fill="#9C36B5" text-anchor="middle" font-weight="800">Diegetic</text>
<text x="220.0" y="148.0" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="600">ammo counter on the gun</text>
<text x="220.0" y="166.0" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="600">a map in the character's hands</text>
<text x="440.0" y="122.0" font-size="18" fill="#9C36B5" text-anchor="middle" font-weight="800">Meta</text>
<text x="440.0" y="148.0" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="600">blood on the screen</text>
<text x="440.0" y="166.0" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="600">cracked-glass effect</text>
<text x="220.0" y="282.0" font-size="18" fill="#9C36B5" text-anchor="middle" font-weight="800">Spatial</text>
<text x="220.0" y="308.0" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="600">name floating above a character</text>
<text x="220.0" y="326.0" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="600">outline around an item, "+10"</text>
<text x="440.0" y="282.0" font-size="18" fill="#9C36B5" text-anchor="middle" font-weight="800">Non-diegetic</text>
<text x="440.0" y="308.0" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="600">health bar, score, menus</text>
<text x="440.0" y="326.0" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="600">the classic HUD</text>
<text x="330.0" y="420.0" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="600" font-style="italic">after Fagerholt and Lorentzon (2009)</text>
</svg>
