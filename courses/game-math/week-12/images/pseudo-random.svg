<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="270" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Real chance and pseudo-random numbers</text>
<rect x="20" y="52" width="300" height="196" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="34" y="76" font-size="14.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">Real chance</text>
<rect x="40" y="96" width="44" height="44" rx="7.9" fill="#ffffff" stroke="#2a2f2c" stroke-width="2"/>
<circle cx="51" cy="107" r="3.7" fill="#2a2f2c"/>
<circle cx="62" cy="118" r="3.7" fill="#2a2f2c"/>
<circle cx="73" cy="129" r="3.7" fill="#2a2f2c"/>
<rect x="96" y="96" width="44" height="44" rx="7.9" fill="#ffffff" stroke="#2a2f2c" stroke-width="2"/>
<circle cx="107.9" cy="107.9" r="3.7" fill="#2a2f2c"/>
<circle cx="128.1" cy="107.9" r="3.7" fill="#2a2f2c"/>
<circle cx="118" cy="118" r="3.7" fill="#2a2f2c"/>
<circle cx="107.9" cy="128.1" r="3.7" fill="#2a2f2c"/>
<circle cx="128.1" cy="128.1" r="3.7" fill="#2a2f2c"/>
<text x="160" y="104" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">a real die, noise, the</text>
<text x="160" y="119.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">time between key</text>
<text x="160" y="135.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">presses</text>
<text x="34" y="176" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Cannot be repeated or predicted.</text>
<rect x="340" y="52" width="320" height="196" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="354" y="76" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Pseudo-random</text>
<rect x="356" y="92" width="288" height="34" rx="6" fill="#1e1e2e"/>
<text x="368" y="114" font-size="13" fill="#ffd43b" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">x = (5·x + 3) mod 16</text>
<text x="356" y="146" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">A formula: each number comes from the one</text>
<text x="356" y="161.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">before. It only looks random.</text>
<text x="356" y="206" font-size="12.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">The same seed gives the same numbers: good</text>
<text x="356" y="222.2" font-size="12.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">for games.</text>
</svg>
