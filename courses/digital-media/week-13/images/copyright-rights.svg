<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Copyright: the holder decides who may...</text>
<rect x="20" y="52" width="152" height="96" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="96" y="84" font-size="16" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">copy</text>
<text x="96" y="110" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">make copies of the</text>
<text x="96" y="125.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">work</text>
<rect x="182" y="52" width="152" height="96" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="258" y="84" font-size="16" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">share</text>
<text x="258" y="110" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">publish or sell copies</text>
<rect x="344" y="52" width="152" height="96" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="420" y="84" font-size="16" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">change</text>
<text x="420" y="110" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">adapt, remix,</text>
<text x="420" y="125.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">translate</text>
<rect x="506" y="52" width="152" height="96" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="582" y="84" font-size="16" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">show</text>
<text x="582" y="110" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">play or perform it in</text>
<text x="582" y="125.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">public</text>
<rect x="20" y="166" width="640" height="108" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.8"/>
<text x="34" y="190" font-size="14" fill="#868e96" text-anchor="start" font-weight="800" xml:space="preserve">Facts</text>
<text x="34" y="211.5" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">It starts automatically when the work is made: no form, no © sign needed.</text>
<text x="34" y="230.1" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">It protects the expression (this drawing of a cat), not the idea (a cat on a roof).</text>
<text x="34" y="248.7" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">It lasts long: often the life of the creator + 50 or 70 years, by country.</text>
</svg>
