<line x1="170" y1="80" x2="170" y2="290" stroke="#a5d8ff" stroke-width="2" stroke-linecap="round"/>
<line x1="50" y1="200" x2="260" y2="200" stroke="#ffd8a8" stroke-width="2" stroke-linecap="round"/>
<line x1="200" y1="80" x2="200" y2="290" stroke="#a5d8ff" stroke-width="2" stroke-linecap="round"/>
<line x1="50" y1="230" x2="260" y2="230" stroke="#ffd8a8" stroke-width="2" stroke-linecap="round"/>
