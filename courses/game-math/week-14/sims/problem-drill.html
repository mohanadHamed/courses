<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Problem Drill</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 5px 0; font-weight: 700; font-size: .92rem; }
    .sim .bar button.on { background: var(--sim-accent); color: #fff; }
    .sim .prob { background: #ebfbee; border: 1.5px solid #2F9E44; border-radius: 10px; padding: 8px 12px; margin: 6px 0; font-weight: 700; line-height: 1.5; }
    .sim input.ans { font: inherit; font-weight: 800; width: 9em; padding: 6px 8px; border: 2px solid #2F9E44; border-radius: 8px; }
    .sim ol.sol { margin: 6px 0; padding-left: 1.4em; font-weight: 600; line-height: 1.5; }
    .sim .score { font-weight: 800; }
    .sim .task { font-weight: 800; color: var(--sim-accent); margin: 6px 0 0; }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Problem Drill: Star Dock</h1>
  <p class="hint">Choose a topic and solve the problem. Type a number (use a point for decimals) and press <b>Check</b>. After the check you see the solution step by step. Press <b>New problem</b> for another one with new numbers.</p>
  <div class="bar" id="topic"></div>
  <div class="prob" id="prob"></div>
  <div class="bar"><input class="ans" id="ans" type="text" inputmode="decimal" aria-label="Your answer"><button type="button" id="check">Check</button><button type="button" class="ghost" id="new">New problem</button></div>
  <ol class="sol" id="sol"></ol>
  <p class="score" id="score"></p>
  <p class="task" id="task"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const TRI = [[3, 4, 5], [4, 3, 5], [6, 8, 10], [8, 6, 10], [5, 12, 13], [12, 5, 13], [9, 12, 15], [12, 9, 15]];
  const r2 = (v) => Math.round(v * 100) / 100, r3 = (v) => Math.round(v * 1000) / 1000;
  const GEN = {
    "Vectors": () => {
      const [dx, dy, L] = pick(TRI), ax = R(-3, 4), ay = R(-3, 4), bx = ax + dx, by = ay + dy, k = pick(["len", "time", "unit"]);
      if (k === "len") return { q: `A shuttle at A (${ax}, ${ay}) flies to the dock B (${bx}, ${by}). How long is the trip, the length of B − A?`, a: L, tol: 0.01, sol: [`B − A = (${dx}, ${dy})`, `length = √(${dx}² + ${dy}²) = √${dx * dx + dy * dy} = ${L}`] };
      if (k === "time") { const s = pick([1, L / 5 === Math.round(L / 5) ? 5 : 1, L % 3 === 0 ? 3 : 1]); return { q: `A shuttle at A (${ax}, ${ay}) flies to B (${bx}, ${by}) at ${s} unit${s > 1 ? "s" : ""} per second. How many seconds does the trip take?`, a: L / s, tol: 0.01, sol: [`B − A = (${dx}, ${dy}), length ${L}`, `time = length ÷ speed = ${L} ÷ ${s} = ${r2(L / s)} s`] }; }
      return { q: `A drone at A (${ax}, ${ay}) flies towards B (${bx}, ${by}). What is the x part of the unit direction from A to B?`, a: dx / L, tol: 0.01, sol: [`B − A = (${dx}, ${dy}), length ${L}`, `unit direction = (${dx}, ${dy}) ÷ ${L} = (${r2(dx / L)}, ${r2(dy / L)})`, `x part: ${r2(dx / L)}`] };
    },
    "Angles": () => {
      const [dx, dy, L] = pick(TRI), tx = R(0, 4), ty = R(0, 3), k = pick(["dot", "angle"]);
      if (k === "dot") return { q: `A turret at T (${tx}, ${ty}) faces (0, 1). The target is at E (${tx + dx}, ${ty + dy}). What is the dot product of the facing and the unit vector from T to E?`, a: dy / L, tol: 0.01, sol: [`E − T = (${dx}, ${dy}), length ${L}, unit (${r2(dx / L)}, ${r2(dy / L)})`, `(0, 1) · (${r2(dx / L)}, ${r2(dy / L)}) = ${r2(dy / L)}`, `${r2(dy / L)} ${dy / L >= 0.707 ? "≥" : "<"} 0.707: ${dy / L >= 0.707 ? "inside" : "outside"} a 90° field of view`] };
      const [vx, vy, deg] = pick([[5, 5, 45], [0, 4, 90], [-3, 3, 135], [-6, 0, 180], [0, -2, -90], [4, -4, -45], [-2, -2, -135]]);
      return { q: `A turret must face the direction (${vx}, ${vy}). Its sprite is drawn facing +x. What is atan2(${vy}, ${vx}), in degrees (from −180 to 180)?`, a: deg, tol: 0.5, sol: [`(${vx}, ${vy}) points ${deg === 45 ? "up and to the right" : deg === 90 ? "straight up" : deg === 135 ? "up and to the left" : deg === 180 ? "to the left" : deg === -90 ? "straight down" : deg === -45 ? "down and to the right" : "down and to the left"}`, `atan2(${vy}, ${vx}) = ${deg}°`] };
    },
    "Transformations": () => {
      const px = R(-2, 4), py = R(-2, 4), ux = R(1, 4), uy = R(-2, 3), ax = px + ux, ay = py + uy, k = pick(["rotx", "roty", "scale"]);
      if (k !== "scale") { const nx = px - uy, ny = py + ux, w = k === "rotx" ? "x" : "y"; return { q: `A docking arm turns 90° counterclockwise about the pivot P (${px}, ${py}). Its tip is at A (${ax}, ${ay}). What is the ${w}-coordinate of the new tip A'?`, a: w === "x" ? nx : ny, tol: 0.01, sol: [`A − P = (${ux}, ${uy})`, `rotate 90°: (x, y) → (−y, x) gives (${-uy}, ${ux})`, `A' = P + (${-uy}, ${ux}) = (${nx}, ${ny})`] }; }
      const s = pick([2, 3, 0.5]), nx = px + s * ux;
      return { q: `A shield grows by the factor ${s} about its centre P (${px}, ${py}). A corner is at A (${ax}, ${ay}). What is the x-coordinate of the new corner?`, a: nx, tol: 0.01, sol: [`A − P = (${ux}, ${uy})`, `scale: ${s} × (${ux}, ${uy}) = (${r2(s * ux)}, ${r2(s * uy)})`, `A' = P + that = (${r2(nx)}, ${r2(py + s * uy)})`] };
    },
    "Probability": () => {
      const k = pick(["least", "exp"]);
      if (k === "least") { const p = pick([0.5, 0.8, 0.9]), n = R(2, 3), q = Math.pow(1 - p, n); return { q: `A turret hits with p = ${p} per shot and fires ${n} shots. What is P(at least one hit)? (3 decimals)`, a: 1 - q, tol: 0.002, sol: [`P(no hit) = ${r2(1 - p)}^${n} = ${r3(q)}`, `P(at least one) = 1 − ${r3(q)} = ${r3(1 - q)}`] }; }
      { const p = pick([0.1, 0.2, 0.25, 0.4]), n = pick([10, 20, 40, 50]); return { q: `Each asteroid holds a crystal with p = ${p}. A drone mines ${n} asteroids. How many crystals does it find on average?`, a: n * p, tol: 0.01, sol: [`expected value = n · p = ${n} × ${p} = ${r2(n * p)}`] }; }
    },
  };
  const s = { topic: "Vectors", cur: null, done: false, right: {}, tries: 0 };
  Object.keys(GEN).forEach((k) => (s.right[k] = 0));
  const TASKS = [
    { q: "Task 1: Solve two vector problems correctly.", ok: () => s.right["Vectors"] >= 2 },
    { q: "Task 2: Solve one angle problem correctly.", ok: () => s.right["Angles"] >= 1 },
    { q: "Task 3: Solve one transformation problem correctly.", ok: () => s.right["Transformations"] >= 1 },
    { q: "Task 4: Solve one probability problem correctly.", ok: () => s.right["Probability"] >= 1 },
  ];
  let ti = 0, note = "";
  function fresh() { s.cur = GEN[s.topic](); s.done = false; $("ans").value = ""; $("sol").innerHTML = ""; note = ""; upd(); }
  function check() {
    if (!s.cur || s.done) return;
    const v = parseFloat(String($("ans").value).replace(",", ".").replace("−", "-"));
    if (isNaN(v)) { note = "Type a number first."; upd(); return; }
    s.tries++; s.done = true;
    const ok = Math.abs(v - s.cur.a) <= s.cur.tol;
    if (ok) { s.right[s.topic]++; Kit.good(); } else Kit.bad();
    note = ok ? "✓ Right!" : `Not quite: the answer is ${Math.round(s.cur.a * 1000) / 1000}.`;
    $("sol").innerHTML = s.cur.sol.map((x) => `<li>${x}</li>`).join("");
    upd();
  }
  function upd() {
    Kit.buttons($("topic"), Object.keys(GEN).map((k) => ({ k, label: k })), (k) => { s.topic = k; fresh(); });
    $("topic").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.k === s.topic));
    $("prob").textContent = s.cur ? s.cur.q : "";
    $("score").textContent = "Right: " + Object.entries(s.right).map(([k, v]) => `${k} ${v}`).join(" · ");
    let m = "";
    while (ti < TASKS.length && TASKS[ti].ok()) { ti++; m = "✓ Task done. "; }
    $("task").textContent = ti < TASKS.length ? TASKS[ti].q : "All tasks are done: read, draw, choose the tool, compute, check.";
    $("msg").textContent = m + note;
  }
  $("check").addEventListener("click", check);
  $("ans").addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
  $("new").addEventListener("click", fresh);
  window.PDR = { topic: (k) => { s.topic = k; fresh(); }, solve: () => { $("ans").value = String(Math.round(s.cur.a * 1000) / 1000); check(); }, next: fresh };
  fresh();
})();
</script>
</body>
</html>
