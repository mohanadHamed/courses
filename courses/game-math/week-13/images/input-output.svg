<svg xmlns="http://www.w3.org/2000/svg" width="680" height="222" viewBox="0 0 680 222" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="222" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Input randomness or output randomness?</text>
<rect x="20" y="52" width="310" height="154" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="34" y="76" font-size="14.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Input: random, then decide</text>
<rect x="40" y="100" width="86" height="40" rx="8" fill="#2b8a3e"/>
<text x="83" y="125" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">random map</text>
<rect x="136" y="100" width="86" height="40" rx="8" fill="#1c7ed6"/>
<text x="179" y="125" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">player plans</text>
<rect x="232" y="100" width="86" height="40" rx="8" fill="#868e96"/>
<text x="275" y="125" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">result</text>
<text x="40" y="168" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The player sees the luck first and can react:</text>
<text x="40" y="183.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">it feels fair and gives room for skill.</text>
<rect x="350" y="52" width="310" height="154" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.8"/>
<text x="364" y="76" font-size="14.5" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">Output: decide, then random</text>
<rect x="370" y="100" width="86" height="40" rx="8" fill="#1c7ed6"/>
<text x="413" y="125" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">player attacks</text>
<rect x="466" y="100" width="86" height="40" rx="8" fill="#e8590c"/>
<text x="509" y="125" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">hit roll</text>
<rect x="562" y="100" width="86" height="40" rx="8" fill="#868e96"/>
<text x="605" y="125" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">result</text>
<text x="370" y="168" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The luck comes after the choice: exciting,</text>
<text x="370" y="183.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">but a miss can feel unfair. Show the odds</text>
<text x="370" y="199.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">and limit the streaks.</text>
</svg>
