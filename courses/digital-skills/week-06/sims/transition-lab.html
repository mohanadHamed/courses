<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Transition Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .note { font-size: .85rem; color: var(--sim-muted); margin: -4px 0 8px; }
    .sim .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 5px 0; font-weight: 700; font-size: .9rem; }
    .sim .bar button.on { background: var(--sim-accent); color: #fff; }
  </style>
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Transition Lab: transitions and animations</h1>
  <p class="note">A practice model that works like the Transitions and Animations tabs of PowerPoint. Choose a transition and an animation, then press <b>Next</b> to see them, as in a slide show.</p>
  <canvas id="c" aria-label="The slides of a short talk in the slide show"></canvas>
  <div class="bar">Transition: <span id="tr"></span></div>
  <div class="controls" id="sl"></div>
  <div class="bar"><label><input type="checkbox" id="all"> Apply To All</label></div>
  <div class="bar">Animation of the points: <span id="an"></span></div>
  <div class="bar"><button type="button" id="next">Next ▶</button><span id="where"></span></div>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script src="slide-kit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const S = [
    { layout: "Title Slide", theme: "Sunrise", title: "New shop hours", body: ["Huda, Office Manager"] },
    { layout: "Title and Content", theme: "Sunrise", title: "From 1 December", body: ["Sun–Thu: 9:00–20:00", "Friday: closed", "Saturday: 10:00–18:00"] },
    { layout: "Title and Content", theme: "Sunrise", title: "Why the change?", body: ["More customers in the evening", "A free Friday for the staff"] },
  ];
  // tr: transition; an: animation of the points (one by one, on a click); i: the slide;
  // shown: the points on the slide; mode: "tr" (a transition runs) or "pt" (a point comes in).
  const s = { tr: "None", dur: 0.7, all: false, an: "None", i: 0, shown: 0, mode: null, t0: 0 };
  const TR = ["None", "Fade", "Push", "Wipe", "Vortex"], AN = ["None", "Appear", "Fade", "Spin"];
  const list = (k) => S[k].layout === "Title and Content";
  const full = (k) => (s.an === "None" || !list(k) ? S[k].body.length : 0);
  function tabs(id, items, key) {
    Kit.buttons($(id), items.map((k) => ({ k, label: k })), (k) => { s[key] = k; if (key === "an") s.shown = full(s.i); tabs(id, items, key); msg(key); });
    $(id).querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.k === s[key]));
  }
  function msg(key) {
    let m, bad = false;
    if (key === "an") {
      m = s.an === "Spin" ? "Spin is fun once, but it pulls the eyes away from the points. For a work talk, choose Appear or Fade." :
        s.an === "None" ? "No animation: all the points are on the slide at once. Choose Appear or Fade to show them one by one." :
        `✓ ${s.an}: the points come one by one, on a click. The audience reads the point that you talk about.`;
      bad = s.an === "Spin";
    } else {
      m = s.tr === "Vortex" ? "Vortex is fun once, but it pulls the eyes away from your message. For a work talk, choose a quiet one." :
        s.dur > 1.5 ? "A long transition makes the audience wait. 0.5–1 second is enough." :
        s.tr === "None" ? "No transition is fine. A quiet transition such as Fade helps the audience see that the slide changed." :
        !s.all ? "Good choice. Press Apply To All, so that every slide changes the same way." : `✓ ${s.tr}, ${Kit.fmt(s.dur, 1)} s, on all slides: calm and the same everywhere.`;
      bad = s.tr === "Vortex" || s.dur > 1.5;
    }
    $("msg").textContent = m; $("msg").classList.toggle("bad", bad);
    where();
  }
  function where() {
    const n = S[s.i].body.length;
    $("where").textContent = `Slide ${s.i + 1} of ${S.length}` + (list(s.i) ? ` · points: ${Math.min(s.shown, n)} of ${n}` : "");
  }
  Kit.slider($("sl"), "Duration", 0.3, 3, 0.1, s.dur, (v) => { s.dur = v; msg("tr"); }, (v) => Kit.fmt(v, 1) + " s");
  $("all").addEventListener("change", (e) => { s.all = e.target.checked; msg("tr"); });
  $("next").addEventListener("click", () => {
    if (s.mode) return;
    if (list(s.i) && s.shown < S[s.i].body.length) { s.shown++; s.mode = "pt"; s.t0 = performance.now(); where(); return; }
    s.mode = "tr"; s.t0 = performance.now();
  });
  const view = (k, shown, kk) => ({ ...S[k], shown, anim: s.an, k: kk });
  const cv = Kit.canvas($("c"), (W) => Math.min(320, W * 9 / 16));
  Kit.loop((now) => {
    const c = cv.ctx, W = cv.W, H = cv.H, w = Math.min(W, H * 16 / 9), x = (W - w) / 2;
    c.fillStyle = "#fff"; c.fillRect(0, 0, W, H);
    const j = (s.i + 1) % S.length;
    const A = view(s.i, s.shown, 1), B = view(j, full(j), 1);
    if (s.mode === "pt") {
      const len = s.an === "Appear" ? 0.001 : s.an === "Spin" ? 0.9 : 0.5;
      const k = Math.min(1, Math.max(0, now - s.t0) / 1000 / len);
      SK.draw(c, x, 0, w, view(s.i, s.shown, k));
      if (k >= 1) s.mode = null;
      return;
    }
    const k = s.mode === "tr" ? Math.min(1, Math.max(0, now - s.t0) / 1000 / (s.tr === "None" ? 0.001 : s.dur)) : 0;
    if (s.mode !== "tr" || s.tr === "None") { SK.draw(c, x, 0, w, k >= 1 ? B : A); }
    else if (s.tr === "Fade") { SK.draw(c, x, 0, w, A); c.globalAlpha = k; SK.draw(c, x, 0, w, B); c.globalAlpha = 1; }
    else if (s.tr === "Push") { c.save(); c.beginPath(); c.rect(x, 0, w, H); c.clip(); SK.draw(c, x - w * k, 0, w, A); SK.draw(c, x + w * (1 - k), 0, w, B); c.restore(); }
    else if (s.tr === "Wipe") { SK.draw(c, x, 0, w, A); c.save(); c.beginPath(); c.rect(x, 0, w * k, H); c.clip(); SK.draw(c, x, 0, w, B); c.restore(); }
    else { c.save(); c.translate(x + w / 2, H / 2); c.rotate(k * 6.28 * 2); c.scale(1 - Math.sin(k * Math.PI) * 0.8, 1 - Math.sin(k * Math.PI) * 0.8); SK.draw(c, -w / 2, -H / 2, w, k < 0.5 ? A : B); c.restore(); }
    if (s.mode === "tr" && k >= 1) { s.mode = null; s.i = j; s.shown = full(j); where(); }
  });
  // A timer finishes an animation also when the tab draws nothing (hidden).
  setInterval(() => {
    if (!s.mode) return;
    const t = (performance.now() - s.t0) / 1000;
    if (s.mode === "pt" && t > 1.2) s.mode = null;
    if (s.mode === "tr" && t > s.dur + 0.5) { s.mode = null; s.i = (s.i + 1) % S.length; s.shown = full(s.i); where(); }
  }, 250);
  window.TL = {
    set: (o) => { Object.assign(s, o); if (o.dur) { const i = document.querySelector("#sl input"); i.value = o.dur; i.dispatchEvent(new Event("input")); }
      if (o.an) s.shown = full(s.i); $("all").checked = s.all; tabs("tr", TR, "tr"); tabs("an", AN, "an"); msg(o.an ? "an" : "tr"); },
    next: () => $("next").click(),
  };
  tabs("tr", TR, "tr"); tabs("an", AN, "an"); s.shown = full(0); msg("tr");
})();
</script>
</body>
</html>
