<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Board Builder</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    @media (max-width: 520px) { .sim .board { grid-template-columns: 1fr; } }
    .sim .pn { border: 1px solid var(--sim-border); border-radius: 10px; padding: 8px; }
    .sim .pn canvas { border-radius: 6px; }
    .sim .pn select { width: 100%; margin: 6px 0; font: inherit; font-weight: 700; padding: 4px; border-radius: 8px; }
    .sim .pn p { margin: 0; font-size: 0.88rem; }
    .sim .pn b.n { color: var(--sim-accent); }
    .sim ul.fb { margin: 8px 0 0; padding-left: 1.2em; font-weight: 700; }
    .sim ul.fb li.ok { color: #2b8a3e; } .sim ul.fb li.no { color: #c92a2a; }
  </style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Board Builder</h1>
  <p class="hint">Four beats of the opening scene of <i>Rooftop Rescue</i>. Choose a shot for each panel, then press <b>Check my board</b>.</p>
  <div class="board" id="board"></div>
  <div class="controls"><button type="button" id="check">Check my board</button><button type="button" class="ghost" id="clear">Start again</button></div>
  <ul class="fb" id="fb"></ul>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script src="rooftop-scene.js"></script>
<script>
(() => {
  const BEATS = [
    "EXT. FLOODED STREET – DUSK. Water fills the street up to the windows.",
    "Nour jumps into the boat and rows towards the roof.",
    "NOUR (to herself): “Hold on, everyone. I'm coming.”",
    "On the roof, Salma holds her cat. SALMA: “I won't leave without my cat.”",
  ];
  const KEYS = Object.keys(RS.SHOTS);
  const pick = [null, null, null, null];
  const $ = (id) => document.getElementById(id);
  const cvs = [];
  BEATS.forEach((b, i) => {
    const pn = Kit.el("div", { class: "pn" });
    const c = Kit.el("canvas", { "aria-label": "Panel " + (i + 1) });
    const sel = Kit.el("select", { "aria-label": "Shot of panel " + (i + 1), "data-i": i });
    sel.appendChild(Kit.el("option", { value: "" }, "Choose a shot…"));
    KEYS.forEach((k) => sel.appendChild(Kit.el("option", { value: k }, RS.SHOTS[k].name)));
    sel.addEventListener("change", () => { pick[i] = sel.value || null; $("fb").innerHTML = ""; });
    pn.append(c, sel, Kit.el("p", {}, `<b class="n">Panel ${i + 1}</b> · ${b}`));
    $("board").appendChild(pn);
    cvs.push(Kit.canvas(c, (W) => Math.round(W * 9 / 16)));
  });
  function rules() {
    const s = pick.map((k) => k && RS.SHOTS[k]);
    const out = [];
    if (s.some((x) => !x)) return [[false, "Choose a shot for every panel first."]];
    out.push([s[0].size === "wide" && pick[0] === "wideStreet", s[0].size === "wide" && pick[0] === "wideStreet" ? "Panel 1 is a wide shot of the street: the player sees the place first." : "Panel 1 should be a wide (establishing) shot of the street."]);
    out.push([pick[1] === "medNour", pick[1] === "medNour" ? "Panel 2 shows Nour's action in a medium shot." : "Panel 2 is an action: a medium shot of Nour shows the rowing."]);
    out.push([s[2].who === "Nour", s[2].who === "Nour" ? "Panel 3 shows the speaker, Nour." : "Panel 3: Nour speaks, so the shot must show Nour."]);
    out.push([s[3].who === "Salma", s[3].who === "Salma" ? "Panel 4 shows the speaker, Salma." : "Panel 4: Salma speaks, so the shot must show Salma."]);
    const fear = pick[3] === "closeSalma";
    out.push([fear, fear ? "Salma's fear is a close-up." : "Salma's line is about a feeling: a close-up shows it best."]);
    const rep = pick.some((k, i) => i && k === pick[i - 1]);
    out.push([!rep, rep ? "Two panels in a row have the same shot: change one, so each panel shows something new." : "Every panel shows a new shot."]);
    return out;
  }
  $("check").addEventListener("click", () => {
    const r = rules(); $("fb").innerHTML = "";
    r.forEach(([ok, t]) => $("fb").appendChild(Kit.el("li", { class: ok ? "ok" : "no" }, (ok ? "✓ " : "✗ ") + t)));
    if (r.length > 1 && r.every((x) => x[0])) { $("fb").appendChild(Kit.el("li", { class: "ok" }, "🎉 This board is ready for the team.")); Kit.good(); } else Kit.bad();
  });
  $("clear").addEventListener("click", () => { pick.fill(null); document.querySelectorAll(".pn select").forEach((s) => (s.value = "")); $("fb").innerHTML = ""; });
  const drawn = [];
  Kit.loop(() => cvs.forEach((cv, i) => {
    const c = cv.ctx, key = pick[i] + cv.W;
    if (drawn[i] === key) return; drawn[i] = key;
    if (!pick[i]) { c.fillStyle = "#f8f0fc"; c.fillRect(0, 0, cv.W, cv.H); c.strokeStyle = "#d0bfff"; c.setLineDash([6, 5]); c.strokeRect(1, 1, cv.W - 2, cv.H - 2); c.setLineDash([]); Kit.text(c, "Panel " + (i + 1) + ": no shot yet", cv.W / 2, cv.H / 2, 13, "#9C36B5"); return; }
    RS.draw(c, 0, 0, cv.W, cv.H, RS.SHOTS[pick[i]], { arrow: pick[i] === "medNour" ? [24, 33, 30, 33] : null });
  }));
})();
</script>
</body>
</html>
