<line x1="448" y1="202" x2="448" y2="218" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="484" y1="202" x2="484" y2="218" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="520" y1="202" x2="520" y2="218" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="556" y1="202" x2="556" y2="218" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="592" y1="202" x2="592" y2="218" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="628" y1="202" x2="628" y2="218" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round"/>
<text x="640" y="234" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">32 ms</text>
<polygon points="421,258 414,272 428,272" fill="#c92a2a" stroke="none" stroke-width="1.5"/>
<text x="340" y="292" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">A tap at 9 ms is found at 16 ms (120 Hz)</text>
<text x="340" y="310" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">or already at 12 ms (240 Hz).</text>
</svg>
