<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="400" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The layers of a mobile OS: Android and iOS</text>
<text x="180" y="62" font-size="17" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">Android</text>
<rect x="30" y="76" width="300" height="42" rx="9" fill="#2b8a3e33" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="180" y="102" font-size="13.5" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">Apps</text>
<rect x="30" y="126" width="300" height="42" rx="9" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="180" y="152" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Java/Kotlin API framework</text>
<rect x="30" y="176" width="300" height="42" rx="9" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="180" y="202" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Native libraries + Android Runtime (ART)</text>
<rect x="30" y="226" width="300" height="42" rx="9" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="180" y="252" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Hardware abstraction layer (HAL)</text>
<rect x="30" y="276" width="300" height="42" rx="9" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="180" y="302" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Linux kernel</text>
<rect x="30" y="330" width="300" height="40" rx="9" fill="#495057"/>
<text x="180" y="355" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Hardware: SoC, RAM, storage, screen, sensors</text>
<text x="510" y="62" font-size="17" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">iOS</text>
<rect x="360" y="76" width="300" height="42" rx="9" fill="#1c7ed633" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="510" y="102" font-size="13.5" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">Apps</text>
<rect x="360" y="126" width="300" height="42" rx="9" fill="#1c7ed6" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="510" y="152" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Cocoa Touch (UIKit)</text>
<rect x="360" y="176" width="300" height="42" rx="9" fill="#1c7ed6" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="510" y="202" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Media (Metal)</text>
<rect x="360" y="226" width="300" height="42" rx="9" fill="#1c7ed6" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="510" y="252" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Core Services</text>
<rect x="360" y="276" width="300" height="42" rx="9" fill="#1c7ed6" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="510" y="302" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Core OS (XNU kernel)</text>
<rect x="360" y="330" width="300" height="40" rx="9" fill="#495057"/>
<text x="510" y="355" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Hardware: SoC, RAM, storage, screen, sensors</text>
<text x="340" y="392" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Each layer uses only the services of the layer below it.</text>
</svg>
