<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A new gamepad: how the OS manages a device</text>
<rect x="20" y="58" width="150" height="100" rx="12" fill="#ffffff" stroke="#A86700" stroke-width="1.8"/>
<text x="34" y="82" font-size="14.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">1. Connect</text>
<text x="34" y="104.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">USB cable or</text>
<text x="34" y="120.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Bluetooth pairing</text>
<line x1="171" y1="108" x2="176.8" y2="108" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="184,108 176,112 176,104" fill="#6b726e"/>
<rect x="185" y="58" width="150" height="100" rx="12" fill="#ffffff" stroke="#A86700" stroke-width="1.8"/>
<text x="199" y="82" font-size="14.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">2. Detect</text>
<text x="199" y="104.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the OS sees new</text>
<text x="199" y="120.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">hardware</text>
<line x1="336" y1="108" x2="341.8" y2="108" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="349,108 341,112 341,104" fill="#6b726e"/>
<rect x="350" y="58" width="150" height="100" rx="12" fill="#ffffff" stroke="#A86700" stroke-width="1.8"/>
<text x="364" y="82" font-size="14.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">3. Driver</text>
<text x="364" y="104.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the OS loads the</text>
<text x="364" y="120.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">right driver</text>
<line x1="501" y1="108" x2="506.8" y2="108" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="514,108 506,112 506,104" fill="#6b726e"/>
<rect x="515" y="58" width="150" height="100" rx="12" fill="#ffffff" stroke="#A86700" stroke-width="1.8"/>
<text x="529" y="82" font-size="14.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">4. Ready</text>
<text x="529" y="104.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">games can read the</text>
<text x="529" y="120.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">buttons</text>
<text x="20" y="192" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The OS also shares each device between apps, and checks permissions.</text>
<text x="20" y="214" font-size="13" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">A phone connected by USB asks what the cable may do:</text>
<rect x="58.8" y="238.5" width="102.4" height="23" rx="11.5" fill="#868e96"/>
<text x="110" y="254.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">charging only</text>
<rect x="258.8" y="238.5" width="102.4" height="23" rx="11.5" fill="#A86700"/>
<text x="310" y="254.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">file transfer</text>
<rect x="456.9" y="238.5" width="106.2" height="23" rx="11.5" fill="#1c7ed6"/>
<text x="510" y="254.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">photos (PTP)</text>
<text x="20" y="296" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Choose file transfer to copy files; an iPhone asks “Trust this computer?”.</text>
</svg>
