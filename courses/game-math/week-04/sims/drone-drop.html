<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Drone Drop</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .hud { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin: 0 0 8px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .sim .hud .lvl { color: var(--sim-accent); }
    .sim .hud .goal b { color: #e8590c; }
    .sim .hud .stars { margin-left: auto; }
    .sim .pad { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
    .sim .pad button { padding: 7px 0; }
    .sim .pad.houses { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .sim .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 10px; }
    .sim .calc { margin-top: 8px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sim .message.bad { color: #c92a2a; }
    @media (max-width: 520px) { .sim .pad { grid-template-columns: repeat(4, minmax(0, 1fr)); } .sim .pad.houses { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Drone Drop</h1>
  <p class="hint">The drone starts at the depot (0, 0). It flies for <b>1 second</b> at the speed <b>10</b> in the heading θ, so its velocity is 10 × (cos θ, sin θ). Where it stops, it drops the parcel.</p>
  <div class="hud">
    <span class="lvl" id="lvl">Round 1</span>
    <span class="goal" id="goal"></span>
    <span class="stars" id="stars">★ 0</span>
  </div>
  <canvas id="c" aria-label="A map with the depot in the middle and three houses"></canvas>
  <div class="pad" id="choices"></div>
  <p class="calc" id="calc"></p>
  <p id="msg" class="message">Round 1 is the story of the lesson.</p>
  <div class="row"><button id="next" type="button" hidden>Next round ▶</button><button id="sound" type="button" class="ghost">Sound: on</button></div>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const SPEED = 10, FLY_MS = 1400, RANGE = 11;
  const HEADINGS = [0, 30, 45, 60, 90, 120, 135, 150, 180, 210, 225, 240, 270, 300, 315, 330];
  const at = (deg) => [SPEED * Math.cos(deg * Math.PI / 180), SPEED * Math.sin(deg * Math.PI / 180)];
  // ask "heading": choose the heading to the target house. ask "house": the heading is given; choose the house.
  const ROUNDS = [
    { ask: "heading", target: "Ana", houses: [["Ana", 30], ["Ben", 90], ["Cara", 135]] },
    { ask: "heading", target: "Cara", houses: [["Ana", 30], ["Ben", 90], ["Cara", 135]] },
    { ask: "heading", target: "Eli", houses: [["Dana", 210], ["Eli", 240], ["Fay", 300]] },
    { ask: "house", heading: 300, houses: [["Gus", 120], ["Hana", 300], ["Ivy", 330]] },
    { ask: "heading", target: "Jad", houses: [["Jad", 270], ["Kim", 225], ["Lee", 315]] },
  ];
  const COLORS = ["#c92a2a", "#1c7ed6", "#7048e8"];
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => { const r = Math.round(n * 10) / 10; return (r < 0 ? "−" : "") + Math.abs(r === 0 ? 0 : r); };
  const pair = (p) => `(${fmt(p[0])}, ${fmt(p[1])})`;
  let W = 0, H = 0, u = 14, round = 0, stars = 0, tries = 0, cur = ROUNDS[0], solved = false, fly = null, sound = true, audio = null, over = false;

  const house = (name) => cur.houses.find((h) => h[0] === name);
  const right = () => cur.ask === "heading" ? house(cur.target)[1] : cur.houses.find((h) => h[1] === cur.heading)[0];

  function beep(f, d, type = "triangle") {
    if (!sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain(); o.type = type; o.frequency.value = f; g.gain.value = 0.07;
      o.connect(g); g.connect(audio.destination); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + d); o.start(); o.stop(audio.currentTime + d);
    } catch (_) {}
  }
  function startRound() {
    if (round >= ROUNDS.length) {
      over = true; $("lvl").textContent = "All rounds done"; $("goal").textContent = ""; $("choices").innerHTML = ""; $("calc").textContent = "";
      $("msg").textContent = `🎉 Every parcel delivered! ★ ${stars} of ${ROUNDS.length * 3}.`; $("msg").className = "message good";
      $("next").hidden = false; $("next").textContent = "Play again ▶"; fly = null; return;
    }
    over = false; cur = ROUNDS[round]; tries = 0; solved = false; fly = null;
    $("lvl").textContent = `Round ${round + 1} / ${ROUNDS.length}`;
    const box = $("choices"); box.innerHTML = ""; box.className = "pad" + (cur.ask === "house" ? " houses" : "");
    if (cur.ask === "heading") {
      const h = house(cur.target);
      $("goal").innerHTML = `Deliver to <b>${h[0]} ${pair(at(h[1]))}</b>. Which heading?`;
      HEADINGS.forEach((a) => {
        const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.dataset.k = a; b.textContent = a + "°";
        b.addEventListener("click", () => choose(a)); box.appendChild(b);
      });
    } else {
      $("goal").innerHTML = `The drone must fly at <b>${cur.heading}°</b>. Which house gets the parcel?`;
      cur.houses.forEach(([n, a]) => {
        const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.dataset.k = n; b.textContent = `${n} ${pair(at(a))}`;
        b.addEventListener("click", () => choose(n)); box.appendChild(b);
      });
    }
    $("calc").textContent = ""; $("next").hidden = true;
    $("msg").textContent = round === 0 ? "Round 1 is the story of the lesson: Ana, Ben and Cara wait for their parcels." : cur.ask === "house" ? "Use (cos θ, sin θ): which house is in this direction?" : "Find the angle of the house from the +x axis.";
    $("msg").className = "message";
  }
  function choose(k) {
    if (over) { $("msg").textContent = "All rounds are done. Press Play again."; return; }
    if (fly && !fly.done) { $("msg").textContent = "Wait: the drone is still flying."; return; }
    if (solved) { $("msg").textContent = "This round is done. Press Next round."; return; }
    tries++;
    const heading = cur.ask === "heading" ? k : cur.heading;
    const v = at(heading);
    fly = { heading, v, t0: performance.now(), done: false };
    $("calc").textContent = `velocity = 10 × (cos ${heading}°, sin ${heading}°) = ${pair(v)}`;
    $("msg").textContent = `Flying at ${heading}° for 1 second…`; $("msg").className = "message";
    beep(330, 0.4, "sawtooth");
    setTimeout(() => {   // decide with a timer, not in draw()
      fly.done = true;
      const ok = k === right();
      if (ok) {
        solved = true;
        const got = tries === 1 ? 3 : tries === 2 ? 2 : 1; stars += got; $("stars").textContent = "★ " + stars;
        const who = cur.ask === "heading" ? cur.target : k;
        $("msg").textContent = `✓ Delivered to ${who}! ${"★".repeat(got)} After 1 second the drone is at ${pair(v)}.`;
        $("msg").className = "message good"; $("next").hidden = false;
        $("next").textContent = round < ROUNDS.length - 1 ? "Next round ▶" : "Finish ▶";
        [660, 880, 1320].forEach((f, i) => setTimeout(() => beep(f, 0.13), i * 110));
      } else {
        const near = cur.houses.find((h) => h[1] === heading);
        $("msg").textContent = cur.ask === "heading"
          ? `✗ The parcel fell at ${pair(v)}${near ? ", at " + near[0] + "'s house" : ""}. Find the angle of ${cur.target}'s house and try again.`
          : `✗ Not ${k}. At ${cur.heading}°, cos and sin give ${pair(v)}. Try again.`;
        $("msg").className = "message bad"; beep(200, 0.3, "sawtooth");
      }
    }, FLY_MS + 60);
  }
  function resize() {
    W = canvas.clientWidth; u = Math.min((W - 30) / (2 * RANGE), 17);
    H = Math.round(u * 2 * RANGE + 20);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const X = (x) => W / 2 + x * u, Y = (y) => H / 2 - y * u;
  function drawHouse(x, y, name, col, glow) {
    const px = X(x), py = Y(y);
    if (glow) { ctx.fillStyle = "rgba(250,176,5,0.35)"; ctx.beginPath(); ctx.arc(px, py, 20, 0, 7); ctx.fill(); }
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(px - 13, py - 2); ctx.lineTo(px, py - 15); ctx.lineTo(px + 13, py - 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.fillRect(px - 9, py - 2, 18, 13); ctx.strokeRect(px - 9, py - 2, 18, 13);
    ctx.fillStyle = col; ctx.font = "800 12px Nunito, system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.fillText(name, px, py - 20);
  }
  function drawDrone(px, py) {
    ctx.fillStyle = "#495057"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(px - 11, py - 6, 22, 12, 4) : ctx.rect(px - 11, py - 6, 22, 12); ctx.fill();
    ctx.strokeStyle = "#495057"; ctx.lineWidth = 2;
    [[-12, -9], [12, -9], [-12, 9], [12, 9]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(px + dx, py + dy, 5, 0, 7); ctx.stroke(); });
  }
  function draw(now) {
    ctx.fillStyle = "#eef6ee"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#dbeadb"; ctx.lineWidth = 1;
    for (let i = -RANGE; i <= RANGE; i++) { ctx.beginPath(); ctx.moveTo(X(i), Y(-RANGE)); ctx.lineTo(X(i), Y(RANGE)); ctx.stroke(); ctx.beginPath(); ctx.moveTo(X(-RANGE), Y(i)); ctx.lineTo(X(RANGE), Y(i)); ctx.stroke(); }
    ctx.strokeStyle = "#a9c8ad"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(X(-RANGE), Y(0)); ctx.lineTo(X(RANGE), Y(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(0), Y(-RANGE)); ctx.lineTo(X(0), Y(RANGE)); ctx.stroke();
    ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.arc(X(0), Y(0), 10 * u, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#6b726e"; ctx.font = "700 10px Nunito, system-ui, sans-serif"; ctx.textAlign = "center";
    [-10, -5, 5, 10].forEach((v) => ctx.fillText(String(v).replace("-", "−"), X(v), Y(0) + 13));
    [-5, 5].forEach((v) => ctx.fillText(String(v).replace("-", "−"), X(0) + 14, Y(v) + 4));
    if (over) return;
    cur.houses.forEach(([n, a], i) => { const p = at(a); drawHouse(p[0], p[1], n, COLORS[i], cur.ask === "heading" && n === cur.target); });
    // depot
    ctx.fillStyle = "#2F9E44"; ctx.fillRect(X(0) - 11, Y(0) - 11, 22, 22);
    ctx.fillStyle = "#fff"; ctx.font = "800 10px Nunito, system-ui, sans-serif"; ctx.fillText("D", X(0), Y(0) + 4);
    let dx = 0, dy = 0;
    if (fly) {
      const k = fly.done ? 1 : Math.max(0, Math.min((now - fly.t0) / FLY_MS, 1));
      dx = fly.v[0] * k; dy = fly.v[1] * k;
      ctx.strokeStyle = "#e8590c"; ctx.lineWidth = 2.5; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(dx), Y(dy)); ctx.stroke(); ctx.setLineDash([]);
      if (fly.done) { ctx.fillStyle = "#fab005"; ctx.fillRect(X(dx) - 5, Y(dy) + 10, 10, 9); }
    } else if (cur.ask === "house") {
      const p = at(cur.heading); ctx.strokeStyle = "rgba(232,89,12,0.5)"; ctx.lineWidth = 2; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(p[0] * 0.35), Y(p[1] * 0.35)); ctx.stroke(); ctx.setLineDash([]);
    }
    drawDrone(X(dx), Y(dy));
  }
  function loop(now) { requestAnimationFrame(loop); try { draw(now); } catch (e) { /* keep the loop alive */ } }
  $("next").addEventListener("click", () => { if (over) { round = 0; stars = 0; $("stars").textContent = "★ 0"; } else round++; startRound(); });
  $("sound").addEventListener("click", () => { sound = !sound; $("sound").textContent = "Sound: " + (sound ? "on" : "off"); });
  window.addEventListener("resize", resize);
  resize(); startRound(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
