<text x="454" y="121.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">average path: 24 tiles</text>
<text x="454" y="140.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">too short (&lt; 12): 2 %</text>
<text x="454" y="159.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Change one rule, test again.</text>
