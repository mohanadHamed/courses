<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: IP Desk</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #f8f0fc; border: 1.5px solid #9C36B5; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>IP Desk</h1>
  <p class="hint">In the last week before the release, six intellectual-property problems reach Salma's desk. For each one, choose the best action for Night Owl Games.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "A freelance composer made the theme music. Payment was sent, but there is no written contract.", goal: "What does Salma do?", answer: "get a written contract for the rights", choices: C(["get a written contract for the rights", "nothing: we paid, so we own it", "change two notes of the music", "remove the composer from the credits"]), good: "Payment alone does not move the copyright: a written contract says who owns or may use the music.", why: { "nothing: we paid, so we own it": "Without a contract, the freelancer usually keeps the copyright." } },
    { card: "The new Night Owl logo looks very much like the logo of a big drink brand.", goal: "What does Salma do?", answer: "redesign the logo", choices: C(["redesign the logo", "keep it: logos are free", "add a © sign", "make it a little bigger"]), good: "Names and logos are protected as trademarks; a lookalike can confuse buyers." },
    { card: "Nour traced a sprite from another game \"to save time\" and changed the colours.", goal: "What does Salma do?", answer: "draw a new sprite", choices: C(["draw a new sprite", "keep it: the colours are new", "add a credit and keep it", "use it only in level 1"]), good: "Tracing copies the expression; new colours do not make it a new work.", why: { "add a credit and keep it": "A credit is not permission: the other studio owns the sprite." } },
    { card: "A store sends a takedown notice: a photo on the loading screen belongs to a photographer.", goal: "What does Salma do first?", answer: "remove the photo and check the register", choices: C(["remove the photo and check the register", "ignore the notice", "upload the game to another store", "reply that the photo was online"]), good: "Act fast: remove or replace the asset, find how it got in, then answer the store." },
    { card: "A fan draws comics of Pasha the cat and wants to sell prints at a market.", goal: "What does Night Owl do?", answer: "follow its fan content policy", choices: C(["follow its fan content policy", "nothing: fans may sell anything", "copy the comics into the game", "sue every fan at once"]), good: "Fan art is a derivative work; many studios publish a fan content policy that says what fans may do." },
    { card: "Tariq made a poster background with an AI image tool.", goal: "What does Salma do?", answer: "check the tool's terms and record it", choices: C(["check the tool's terms and record it", "nothing: AI images have no rules", "say Nour drew it", "use it only in the trailer"]), good: "The terms of the tool and the local law decide the use; write the tool and the prompt in the register and say honestly how it was made." },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 1, animMs: 600, intro: "Round 1 is the first problem of the seminar: the theme music." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "The desk is clear: Rooftop Rescue is ready for release." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
