<text x="38.0" y="206.0" font-size="13" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">a PDF file (.pdf)</text>
<rect x="24.0" y="226.0" width="592.0" height="34.0" rx="9" fill="#ffffff" stroke="#D9480F" stroke-width="1.5"/>
<text x="38.0" y="248.0" font-size="13" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">the Excel file (.xlsx)</text>
<rect x="24.0" y="268.0" width="592.0" height="34.0" rx="9" fill="#ffffff" stroke="#D9480F" stroke-width="1.5"/>
<text x="38.0" y="290.0" font-size="13" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">a template (.xltx)</text>
<rect x="330.0" y="316.0" width="286.0" height="34.0" rx="14" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="344.0" y="338.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">a PDF file (.pdf)</text>
<text x="24.0" y="380.0" font-size="13" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">A PDF keeps the look, and people read and print it. ★★</text>
