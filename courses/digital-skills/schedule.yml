# The lectures of the course in teaching order (titles from the course
# syllabus v2, 2026-10-23). Students and the teacher count lectures, not
# weeks: a missed or late week moves every course differently, so the site
# never shows weeks. Exams are not listed: the university sets them.
#
# Blended course: each pair is one week. The odd lecture is face-to-face in
# the computer lab (a full lesson: notes, page, slides). The even lecture is
# an online activity (`online: true`): digital content with simulators and
# tasks that the students submit on the e-learning platform. It replaces the
# homework of the other courses.
#
# Files: lecture n is lesson-NN.qmd (NN = n) in the folder week-PP, where
# PP = (n + 1) / 2 rounded down: lectures 1-2 are in week-01, 3-4 in week-02,
# and so on. The folder name is internal (it keeps old links and QR codes
# working) and is never shown. A lecture is ready (bright, with links) when
# its lesson-NN.qmd exists and has no `draft: true`; otherwise it is faded.
lectures:
  - {n: 1, title: "Digital Skills and the Apps That Make Us Productive", ilos: [A1]}
  - {n: 2, title: "Your University Account, Cloud Storage and Files", ilos: [A1], online: true}
  - {n: 3, title: "Generative AI Tools: What They Do Well and Where They Fail", ilos: [A1, C4]}
  - {n: 4, title: "Writing Clear Prompts and Improving the Answer", ilos: [C4], online: true}
  - {n: 5, title: "Microsoft Office: Concepts, Terms and Common Features", ilos: [A2, A3]}
