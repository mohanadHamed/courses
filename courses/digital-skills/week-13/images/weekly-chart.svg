<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Sales per week in March (JD)</text>
<line x1="70" y1="250" x2="450" y2="250" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<rect x="89" y="112.2" width="57" height="137.8" rx="4" fill="#217346"/>
<text x="117.5" y="106.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">87</text>
<text x="117.5" y="267" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Week 1</text>
<rect x="184" y="150.2" width="57" height="99.8" rx="4" fill="#217346"/>
<text x="212.5" y="144.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">63</text>
<text x="212.5" y="267" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Week 2</text>
<rect x="279" y="72.7" width="57" height="177.3" rx="4" fill="#217346"/>
<text x="307.5" y="66.7" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">112</text>
<text x="307.5" y="267" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Week 3</text>
<rect x="374" y="102.8" width="57" height="147.2" rx="4" fill="#217346"/>
<text x="402.5" y="96.8" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">93</text>
<text x="402.5" y="267" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Week 4</text>
<rect x="480" y="60" width="180" height="190" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="494" y="84" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Insights</text>
<text x="494" y="105.5" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Week 3 was the best</text>
<text x="494" y="121.1" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">(112 JD).</text>
<text x="494" y="139.7" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Week 2 was the weakest</text>
<text x="494" y="155.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">(63 JD).</text>
<text x="494" y="173.9" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Not a steady growth.</text>
</svg>
