<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="440" fill="#ffffff"/>
<text x="16" y="30" font-size="19" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Style Lab</text>
<text x="16" y="52" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">Give each line a style. The Navigation Pane builds itself from the headings.</text>
<rect x="16" y="66" width="608" height="40" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
<rect x="26" y="72" width="64" height="28" rx="6" fill="#fff" stroke="#ced4da" stroke-width="1.5"/>
<text x="58" y="91" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Normal</text>
<rect x="96" y="72" width="56" height="28" rx="6" fill="#fff" stroke="#ced4da" stroke-width="1.5"/>
<text x="124" y="91" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Title</text>
<rect x="158" y="72" width="88" height="28" rx="6" fill="#D9480F" stroke="#D9480F" stroke-width="1.5"/>
<text x="202" y="91" font-size="12" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">Heading 1</text>
<rect x="252" y="72" width="88" height="28" rx="6" fill="#fff" stroke="#ced4da" stroke-width="1.5"/>
<text x="296" y="91" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Heading 2</text>
<rect x="16" y="120" width="170" height="250" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
<text x="26" y="142" font-size="12" fill="#6b726e" text-anchor="start" font-weight="800" xml:space="preserve">Navigation Pane</text>
<text x="30" y="168" font-size="12.5" fill="#1c5fb4" text-anchor="start" font-weight="700" xml:space="preserve">The plan</text>
<text x="46" y="192" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Morning</text>
<rect x="204" y="124" width="424" height="250" rx="4" fill="#e9ecef" stroke="none" stroke-width="1.5"/>
<rect x="200" y="120" width="424" height="250" rx="4" fill="#ffffff" stroke="#ced4da" stroke-width="1.2"/>
<text x="222" y="152" font-size="18" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Our class trip</text>
<text x="222" y="186" font-size="15" fill="#1c5fb4" text-anchor="start" font-weight="800" xml:space="preserve">The plan</text>
<text x="222" y="220" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="500" xml:space="preserve">We leave at 9:00.</text>
<text x="222" y="254" font-size="13" fill="#1c5fb4" text-anchor="start" font-weight="800" xml:space="preserve">Morning</text>
<text x="222" y="288" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="500" xml:space="preserve">We visit the museum.</text>
<rect x="212" y="304" width="400" height="26" rx="4" fill="none" stroke="#D9480F" stroke-width="2"/>
<text x="222" y="322" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="500" xml:space="preserve">What to bring</text>
<text x="16" y="400" font-size="13" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Tap "What to bring", then Heading 1.</text>
</svg>
