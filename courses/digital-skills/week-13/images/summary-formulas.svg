<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Summary formulas on the month of sales (24 rows)</text>
<rect x="20" y="50" width="640" height="38" rx="0" fill="#217346"/>
<text x="30" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">question</text>
<text x="220" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">formula</text>
<text x="610" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">result</text>
<text x="30" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">total of the month</text>
<text x="220" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">=SUM(E2:E25)</text>
<text x="610" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">355 JD</text>
<rect x="20" y="126" width="640" height="38" rx="0" fill="#f8f9fa"/>
<text x="30" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">total of Paper</text>
<text x="220" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">=SUMIF(C2:C25,&quot;Paper&quot;,E2:E25)</text>
<text x="610" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">206 JD</text>
<text x="30" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">number of Bags sales</text>
<text x="220" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">=COUNTIF(C2:C25,&quot;Bags&quot;)</text>
<text x="610" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">4</text>
<rect x="20" y="202" width="640" height="38" rx="0" fill="#f8f9fa"/>
<text x="30" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">average Drinks sale</text>
<text x="220" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">=AVERAGEIF(C2:C25,&quot;Drinks&quot;,E2:E25)</text>
<text x="610" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">7.1 JD</text>
<text x="30" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">the biggest sale</text>
<text x="220" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">=MAX(E2:E25)</text>
<text x="610" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">60 JD</text>
<rect x="20" y="50" width="640" height="228" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
