<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="270" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Sound in the edit: duck the music, fade the end</text>
<text x="20" y="92" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">music</text>
<polygon points="80,100 120,76 280,76 295,96 410,96 425,76 580,76 640,110 640,112 80,112" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.6" stroke-linejoin="round"/>
<text x="100" y="128" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">fade in</text>
<text x="352" y="128" font-size="11" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">−8 dB under the voice</text>
<text x="610" y="128" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">fade out</text>
<text x="20" y="172" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">voice</text>
<rect x="295" y="156" width="115" height="26" rx="4" fill="#d0ebff" stroke="#1c7ed6" stroke-width="1.6"/>
<text x="352" y="174" font-size="11.5" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">“Hold on, Pasha!”</text>
<text x="20" y="216" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">sfx</text>
<rect x="110" y="202" width="30" height="22" rx="3" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.2"/>
<rect x="200" y="202" width="30" height="22" rx="3" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.2"/>
<rect x="290" y="202" width="30" height="22" rx="3" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.2"/>
<rect x="380" y="202" width="30" height="22" rx="3" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.2"/>
<rect x="470" y="202" width="30" height="22" rx="3" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.2"/>
<rect x="560" y="202" width="30" height="22" rx="3" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.2"/>
<text x="20" y="258" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">The voice is the most important, then the effects, then the music; the master stays below 0 dB.</text>
