<text x="24" y="290" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Panel = one shot.  Caption = action, dialogue (or sound, SFX) and time.</text>
<text x="24" y="314" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">The team sees the camera before anyone builds the scene, so a bad shot costs one drawing, not one week.</text>
