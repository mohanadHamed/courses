<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="400" fill="#ffffff"/>
<text x="16" y="30" font-size="19" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Voice Match</text>
<text x="16" y="52" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">Who says this line? Listen to the voice: the words, the length, the tone.</text>
<rect x="16" y="70" width="608" height="80" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.5"/>
<text x="320" y="104" font-size="15" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">"My child, the river was here before us,</text>
<text x="320" y="128" font-size="15" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">and it will be here after us."</text>
<rect x="16" y="170" width="195" height="44" rx="10" fill="#fff" stroke="#9C36B5" stroke-width="1.5"/>
<text x="113" y="198" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">Nour</text>
<rect x="221" y="170" width="195" height="44" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2.5"/>
<text x="318" y="198" font-size="14" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">Grandma Salma</text>
<rect x="426" y="170" width="195" height="44" rx="10" fill="#fff" stroke="#e8590c" stroke-width="1.5"/>
<text x="523" y="198" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">Captain Tarek</text>
<text x="16" y="250" font-size="13.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Right: Salma. Slow, an old saying, "my child".</text>
<text x="16" y="280" font-size="13" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Line 1 of 9 · stars: 1</text>
</svg>
