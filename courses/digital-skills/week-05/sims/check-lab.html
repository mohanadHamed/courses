<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Check Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .ribbon { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 10px; padding: 8px; }
    .sim .ribbon .tab { font-weight: 800; color: var(--sim-accent); margin-right: 6px; }
    .sim .ribbon button { padding: 5px 10px; font-size: 0.85rem; background: #fff; color: #2a211c; border: 1px solid #ced4da; box-shadow: none; }
    .sim .ribbon button.on { background: var(--sim-accent); color: #fff; border-color: var(--sim-accent); }
    .sim .task { font-weight: 700; margin: 8px 0; }
    .sim .page { background: #fff; border: 1px solid #ced4da; box-shadow: 3px 3px 0 #e9ecef; padding: 14px 18px; font-family: Calibri, Carlito, Arial, sans-serif; line-height: 1.55; }
    .sim .page h2 { font-size: 1.05rem; margin: 0 0 6px; }
    .sim .page p { margin: 0 0 6px; }
    .sim .bad-word { text-decoration: underline wavy #e03131; text-underline-offset: 3px; cursor: pointer; }
    .sim .bad-word.fixed { text-decoration: none; background: #d3f9d8; }
    .sim .hit { background: #fff3bf; }
    .sim .menu { display: inline-flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; padding: 6px; border: 1px solid #ced4da; border-radius: 8px; background: #fff; }
    .sim .menu[hidden], .sim .fr[hidden] { display: none; }
    .sim .menu button { padding: 3px 9px; font-size: 0.85rem; box-shadow: none; }
    .sim .fr { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; margin: 8px 0; padding: 8px 10px; border: 1px solid #ced4da; border-radius: 10px; background: #f8f9fa; }
    .sim .fr input { font: inherit; padding: 4px 8px; border: 1px solid #ced4da; border-radius: 6px; min-width: 0; }
    .sim .fr .acts { grid-column: 1 / -1; display: flex; gap: 6px; }
    .sim .status { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--sim-muted); margin-top: 6px; }
    .sim .message.bad { color: #c92a2a; }
  </style>
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Check Lab: spelling, Find and Replace</h1>
  <p class="hint">A practice page that works like Word. Nothing is sent to the Internet.</p>
  <div class="ribbon"><span class="tab">Review</span>
    <button type="button" id="spell">Spelling (F7)</button>
    <button type="button" id="replace">Find and Replace (Ctrl + H)</button>
    <button type="button" id="count">Word Count</button>
  </div>
  <p class="task" id="task"></p>
  <div class="menu" id="menu" hidden></div>
  <div class="fr" id="fr" hidden>
    <label for="find">Find what</label><input id="find" type="text" autocomplete="off">
    <label for="with">Replace with</label><input id="with" type="text" autocomplete="off">
    <div class="acts"><button type="button" id="all">Replace All</button><button type="button" id="close" class="ghost">Close</button></div>
  </div>
  <div class="page" id="page"></div>
  <div class="status"><span id="words"></span><span>English (United States)</span></div>
  <div class="controls"><button id="restart" type="button" class="ghost">Start again</button></div>
  <p id="msg" class="message"></p>
</main>
<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  // The report of report-start.docx (Lecture 5, Experiment 2): two spelling
  // mistakes, a name that Word does not know, and the time 9:00 twice.
  const TEXT = [
    ["h2", "Report: The New Sunrise Shop in Zarqa"],
    ["p", "Sunrise Company opens its {secnd} shop next Saturday at 9:00. The new shop is in {Zarqa}, on King Abdullah Street, next to the post office."],
    ["p", "The shop is open from Saturday to Thursday, from 9:00 to 20:00. It is closed on Friday."],
    ["p", "On the first day, the first 50 {custmers} get a free bag. Children under 12 get a free pen."],
  ];
  const WORDS = {
    secnd: { right: "second", options: ["second", "secant", "Ignore"], name: false },
    custmers: { right: "customers", options: ["costumers", "customers", "Ignore"], name: false },
    Zarqa: { right: "Ignore", options: ["Zara", "Ignore"], name: true },
  };
  const $ = (id) => document.getElementById(id);
  const say = (t, c) => { $("msg").innerHTML = t; $("msg").className = "message " + (c || ""); };
  let text, fixed, replaced, step;
  const TASKS = [
    "Task 1 of 2 · Press Spelling (F7), or tap a word with a red line. Fix the two spelling mistakes; a name stays as it is (Ignore).",
    "Task 2 of 2 · The opening time is now 10:00. Open Find and Replace: find 9:00, replace it with 10:00, then Replace All.",
    "Done. Word Count shows how many words the report has now.",
  ];
  function render() {
    $("page").innerHTML = "";
    text.forEach(([tag, s]) => {
      const el = document.createElement(tag);
      el.innerHTML = s.replace(/\{(\w+)\}/g, (m, w) => {
        const done = fixed[w];
        const shown = done ? (WORDS[w].right === "Ignore" ? w : WORDS[w].right) : w;
        return '<span class="bad-word' + (done ? " fixed" : "") + '" data-w="' + w + '">' + shown + "</span>";
      }).replace(/(10:00)/g, replaced ? '<span class="hit">$1</span>' : "$1");
      $("page").appendChild(el);
    });
    $("page").querySelectorAll(".bad-word").forEach((sp) => sp.addEventListener("click", () => open(sp.dataset.w)));
    $("words").textContent = "Words: " + count();
    $("task").textContent = TASKS[step];
  }
  function count() {
    return text.map(([, s]) => s.replace(/\{(\w+)\}/g, "$1")).join(" ").split(/\s+/).filter((w) => /[\w\d]/.test(w)).length;
  }
  function open(w) {
    if (fixed[w]) { say("This word is done."); return; }
    const m = $("menu"); m.innerHTML = "<b>" + w + ":</b> "; m.hidden = false;
    WORDS[w].options.forEach((o) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.textContent = o;
      b.addEventListener("click", () => pick(w, o)); m.appendChild(b);
    });
    say(WORDS[w].name ? "Word does not know this name. Is it a mistake?" : "Choose the right word.");
  }
  function pick(w, o) {
    const d = WORDS[w];
    if (o !== d.right) {
      say(d.name ? "Zarqa is the right name of the city: Word only does not know it. Choose Ignore." :
        (o === "Ignore" ? "This is a spelling mistake, not a name: choose the right word." : "Not this one: read the sentence again."), "bad");
      return;
    }
    fixed[w] = true; $("menu").hidden = true; render();
    const left = Object.keys(WORDS).filter((k) => !fixed[k]);
    if (left.length === 0 && step === 0) { step = 1; render(); Kit.good(); say("✓ The report has no red lines now: second and customers are right, and Zarqa is a name. Now Find and Replace.", "good"); }
    else say("✓ " + (d.name ? "Ignore: the name stays." : d.right + " is right.") + " " + (left.length ? "Find the next red line." : ""), "good");
  }
  function spell() {
    const left = Object.keys(WORDS).filter((k) => !fixed[k]);
    if (!left.length) { say("Spelling: no mistakes left."); return; }
    open(left[0]);
  }
  function replaceAll() {
    const f = $("find").value.trim(), r = $("with").value.trim();
    if (!f) { say("Type 9:00 in Find what.", "bad"); return; }
    if (step < 1) { say("First fix the spelling (Task 1).", "bad"); return; }
    const n = text.reduce((k, [, s]) => k + s.split(f).length - 1, 0);
    if (n === 0) { say("Word found no " + f + ". Type it exactly: 9:00.", "bad"); return; }
    if (f !== "9:00" || r !== "10:00") { say("Word made " + n + " replacement(s), but the task is: find 9:00, replace it with 10:00. Start again to try once more.", "bad"); }
    text = text.map(([t, s]) => [t, s.split(f).join(r)]);
    replaced = f === "9:00" && r === "10:00";
    if (replaced) { step = 2; Kit.good(); }
    $("fr").hidden = true; render();
    if (replaced) say("✓ All done. We made " + n + " replacements: the opening time and the hours. Word Count: " + count() + " words.", "good");
  }
  function start() {
    text = TEXT.map((x) => x.slice()); fixed = {}; replaced = false; step = 0;
    $("menu").hidden = true; $("fr").hidden = true; $("find").value = ""; $("with").value = "";
    render(); say("Words with a red wavy line: Word does not know them.");
  }
  $("spell").addEventListener("click", spell);
  $("replace").addEventListener("click", () => { $("fr").hidden = false; $("find").focus(); say("Find what: 9:00 · Replace with: 10:00 · then Replace All."); });
  $("close").addEventListener("click", () => { $("fr").hidden = true; });
  $("all").addEventListener("click", replaceAll);
  $("count").addEventListener("click", () => say("Word Count: " + count() + " words."));
  $("restart").addEventListener("click", start);
  window.CL = { open, pick };
  start();
})();
</script>
</body>
</html>
