<svg xmlns="http://www.w3.org/2000/svg" width="680" height="272" viewBox="0 0 680 272" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="272" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A high chance still misses: P(at least one miss in n tries)</text>
<rect x="20" y="54" width="620" height="40" rx="0" fill="#2F9E44"/>
<text x="30" y="78.7" font-size="13" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">hit chance</text>
<text x="220" y="78.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">1 try</text>
<text x="340" y="78.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">5 tries</text>
<text x="460" y="78.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">10 tries</text>
<text x="580" y="78.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">20 tries</text>
<text x="30" y="118.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">70 %</text>
<text x="220" y="118.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">30 %</text>
<text x="340" y="118.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">83 %</text>
<text x="460" y="118.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">97 %</text>
<text x="580" y="118.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">&gt; 99 %</text>
<rect x="20" y="134" width="620" height="40" rx="0" fill="#f8f9fa"/>
<text x="30" y="158.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">90 %</text>
<text x="220" y="158.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">10 %</text>
<text x="340" y="158.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">41 %</text>
<rect x="400" y="134" width="120" height="40" rx="0" fill="#ffe066"/>
<text x="460" y="158.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">65 %</text>
<text x="580" y="158.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">88 %</text>
<text x="30" y="198.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">95 %</text>
<text x="220" y="198.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">5 %</text>
<text x="340" y="198.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">23 %</text>
<text x="460" y="198.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">40 %</text>
<text x="580" y="198.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">64 %</text>
<rect x="20" y="54" width="620" height="160" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="232" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">With a 90 % hit chance, a player who attacks 10 times misses at least once in 65 % of the fights.</text>
<text x="20" y="248.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Players feel 90 % as &quot;sure&quot;, so a miss feels like a bug.</text>
</svg>
