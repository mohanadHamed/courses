<text x="135" y="81.4" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">q</text>
<text x="225" y="81.4" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">p XOR q</text>
<text x="335" y="81.4" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">p → q</text>
<rect x="30" y="96" width="70" height="40" rx="0" fill="#ebfbee"/>
