<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">An Android Virtual Device (AVD)</text>
<rect x="20" y="56" width="200" height="110" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="34" y="80" font-size="14" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">Device profile</text>
<text x="34" y="101.5" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">screen 720 × 1600</text>
<text x="34" y="120.1" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">RAM 4 GB, 60 Hz</text>
<rect x="20" y="176" width="200" height="110" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.8"/>
<text x="34" y="200" font-size="14" fill="#7048e8" text-anchor="start" font-weight="800" xml:space="preserve">System image</text>
<text x="34" y="221.5" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Android 11 (API 30)</text>
<text x="34" y="240.1" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">x86_64 processor</text>
<text x="240" y="176" font-size="26" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">+</text>
<rect x="260" y="116" width="180" height="110" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.8"/>
<text x="274" y="140" font-size="14" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">Settings</text>
<text x="274" y="161.5" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">graphics: hardware</text>
<text x="274" y="180.1" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">storage 4 GB</text>
<line x1="446" y1="171" x2="491" y2="171" stroke="#868e96" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="500,171 490,176 490,166" fill="#868e96"/>
<rect x="520" y="60" width="120" height="220" rx="18" fill="#343a40"/>
<rect x="526" y="74" width="108" height="192" rx="6" fill="#ffffff"/>
<rect x="566" y="65" width="28" height="4" rx="2" fill="#868e96"/>
<text x="580" y="160" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">virtual phone</text>
<text x="580" y="178" font-size="15" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">AVD</text>
<text x="580" y="196" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">&quot;P5 twin&quot;</text>
</svg>
