# 16-week schedule (titles from the official syllabus weekly table).
# The course page lists every lesson from this file. A lesson is ready (bright,
# with links) when week-NN/lesson-NN.qmd exists and has no `draft: true`;
# otherwise it is shown faded as "coming soon".
# Lessons are numbered across the course (week 1 → 01–02, week 2 → 03–04, ...).
weeks:
  - week: 1
    ilos: [A1]
    plos: [3]
    lessons:
      - {n: 1, title: "Digital Skills: Concept, Categories and the Labour Market", ilos: [A1]}
      - {n: 2, title: "University Accounts, Cloud Storage and File Management", ilos: [A1]}
  - week: 2
    ilos: [A1, A2]
    plos: [3]
    lessons:
      - {n: 3, title: "Digital Devices, Operating Systems and Productivity Applications", ilos: [A1, A2]}
      - {n: 4, title: "Cloud Collaboration: Sharing, Co-editing and Version History", ilos: [A2]}
  - week: 3
    ilos: [A2]
    plos: [3]
    lessons:
      - {n: 5, title: "Safe and Responsible Digital Use: Passwords, MFA, Phishing and Privacy", ilos: [A2]}
      - {n: 6, title: "Securing Accounts and Devices; Spotting Phishing Messages", ilos: [A2]}
  - week: 4
    ilos: [C1]
    plos: [2, 3]
    lessons:
      - {n: 7, title: "Digital Content Creation (1): Professional Documents", ilos: [C1]}
      - {n: 8, title: "Creating a CV and a Short Game-Design Brief", ilos: [C1]}
  - week: 5
    ilos: [C1]
    plos: [2, 3]
    lessons:
      - {n: 9, title: "Digital Content Creation (2): Presentations and Basic Graphics", ilos: [C1]}
      - {n: 10, title: "Designing a Pitch Presentation and a Social-Media Post", ilos: [C1]}
  - week: 6
    ilos: [B1]
    plos: [3, 4]
    lessons:
      - {n: 11, title: "Spreadsheets (1): Data Entry, Formulas, Cell References and Functions", ilos: [B1]}
      - {n: 12, title: "Building a Budget and Score-Tracking Sheet", ilos: [B1]}
  - week: 7
    ilos: [B1]
    plos: [3, 4]
    lessons:
      - {n: 13, title: "Spreadsheets (2): Sorting, Filtering, Conditional Formatting and Charts", ilos: [B1]}
      - {n: 14, title: "Analyzing a Player Dataset with Charts", ilos: [B1]}
  - week: 8
    ilos: [A1, A2, B1, C1]
    plos: [3, 4]
    exam: "Midterm exam"
    lessons:
      - {n: 15, title: "Review of Weeks 1–7", ilos: [A1, A2, B1, C1]}
  - week: 9
    ilos: [B1]
    plos: [3, 4]
    lessons:
      - {n: 17, title: "Data Analysis: PivotTables, Summaries and Dashboards", ilos: [B1]}
      - {n: 18, title: "Building a Simple Dashboard", ilos: [B1]}
  - week: 10
    ilos: [C2]
    plos: [1, 3]
    lessons:
      - {n: 19, title: "Databases (1): Tables, Fields, Primary Keys and Relationships", ilos: [C2]}
      - {n: 20, title: "Designing a Player-Records Database", ilos: [C2]}
  - week: 11
    ilos: [C2]
    plos: [1, 3]
    lessons:
      - {n: 21, title: "Databases (2): Queries, Forms and Reports", ilos: [C2]}
      - {n: 22, title: "Writing Queries and Generating Reports", ilos: [C2]}
  - week: 12
    ilos: [C3]
    plos: [2, 3]
    lessons:
      - {n: 23, title: "Creating a Digital Service: Website Planning and HTML Basics", ilos: [C3]}
      - {n: 24, title: "Building the Page Structure with HTML", ilos: [C3]}
  - week: 13
    ilos: [C3]
    plos: [2, 3]
    lessons:
      - {n: 25, title: "Website Design: CSS, Layout, Responsive Design and Publishing", ilos: [C3]}
      - {n: 26, title: "Styling and Publishing a Game Landing Page", ilos: [C3]}
  - week: 14
    ilos: [B2]
    plos: [3, 4]
    lessons:
      - {n: 27, title: "Digital Marketing: SEO, Social Media, Email, E-commerce and Analytics", ilos: [B2]}
      - {n: 28, title: "Preparing a Digital Marketing Plan", ilos: [B2]}
  - week: 15
    ilos: [B2, C1, C3, D1]
    plos: [2, 3, 4]
    lessons:
      - {n: 29, title: "Team Project: An Integrated Digital Service", ilos: [B2, C1, C3]}
      - {n: 30, title: "Team Project Presentations", ilos: [D1]}
  - week: 16
    ilos: [All]
    plos: [2, 3, 4]
    exam: "Final exam"
