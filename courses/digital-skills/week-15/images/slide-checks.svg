<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Check every slide before you present</text>
<rect x="20" y="50" width="640" height="42" rx="0" fill="#c43e1c"/>
<text x="30" y="75.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">check</text>
<text x="140" y="75.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">question</text>
<text x="420" y="75.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">example of a problem</text>
<text x="30" y="117.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">accuracy</text>
<text x="140" y="117.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Is every number the same as in Excel?</text>
<text x="420" y="117.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">415 JD in Excel, 451 JD on the slide</text>
<rect x="20" y="134" width="640" height="42" rx="0" fill="#f8f9fa"/>
<text x="30" y="159.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">claims</text>
<text x="140" y="159.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Does the data show this?</text>
<text x="420" y="159.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">&quot;Everyone loves sandwiches.&quot;</text>
<text x="30" y="201.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">pictures</text>
<text x="140" y="201.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Does the AI picture fit the topic?</text>
<text x="420" y="201.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a big restaurant, not a canteen</text>
<rect x="20" y="218" width="640" height="42" rx="0" fill="#f8f9fa"/>
<text x="30" y="243.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">honesty</text>
<text x="140" y="243.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Does the last slide say where AI helped?</text>
<text x="420" y="243.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">no AI-use line</text>
<rect x="20" y="50" width="640" height="210" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
