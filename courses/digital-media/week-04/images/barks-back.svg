<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="720" height="330" fill="#ffffff"/>
<text x="360.0" y="30.0" font-size="16" fill="#212529" text-anchor="middle" font-weight="600" xml:space="preserve">Nour rows back with Salma: two barks, three triggers</text>
<text x="160.0" y="70.0" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="600" xml:space="preserve">Nour's barks</text>
<text x="530.0" y="70.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="600" xml:space="preserve">The triggers</text>
<rect x="40.0" y="95.0" width="240.0" height="62.0" rx="14" fill="#fbf3fd" stroke="#9C36B5" stroke-width="2"/>
<polygon points="80.0,157.0 100.0,157.0 78.0,175.0" fill="#fbf3fd" stroke="#9C36B5" stroke-width="2" stroke-linejoin="round"/>
<line x1="81.0" y1="157.0" x2="99.0" y2="157.0" stroke="#fbf3fd" stroke-width="3" stroke-linecap="round"/>
<text x="160.0" y="133.0" font-size="18" fill="#212529" text-anchor="middle" font-weight="600" xml:space="preserve">"Hold on tight!"</text>
<rect x="40.0" y="190.0" width="240.0" height="62.0" rx="14" fill="#fbf3fd" stroke="#9C36B5" stroke-width="2"/>
<polygon points="80.0,252.0 100.0,252.0 78.0,270.0" fill="#fbf3fd" stroke="#9C36B5" stroke-width="2" stroke-linejoin="round"/>
<line x1="81.0" y1="252.0" x2="99.0" y2="252.0" stroke="#fbf3fd" stroke-width="3" stroke-linecap="round"/>
<text x="160.0" y="228.0" font-size="18" fill="#212529" text-anchor="middle" font-weight="600" xml:space="preserve">"Almost there."</text>
<rect x="390.0" y="90.0" width="280.0" height="50.0" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="530.0" y="121.0" font-size="15" fill="#212529" text-anchor="middle" font-weight="600" xml:space="preserve">(1) the hill is in view</text>
<rect x="390.0" y="162.0" width="280.0" height="50.0" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="530.0" y="193.0" font-size="15" fill="#212529" text-anchor="middle" font-weight="600" xml:space="preserve">(2) a wave hits the boat</text>
<rect x="390.0" y="234.0" width="280.0" height="50.0" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="530.0" y="265.0" font-size="15" fill="#212529" text-anchor="middle" font-weight="600" xml:space="preserve">(3) Salma opens her bag</text>
<text x="530.0" y="316.0" font-size="13" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">One trigger is not used.</text>
</svg>
