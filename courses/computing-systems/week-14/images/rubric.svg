<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">How the project is marked (example rubric)</text>
<rect x="20" y="50" width="640" height="36" rx="0" fill="#A86700"/>
<text x="30" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">criterion</text>
<text x="215" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">marks</text>
<text x="270" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">full marks when …</text>
<text x="30" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">content</text>
<text x="215" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">4</text>
<text x="270" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">all six parts, correct facts</text>
<rect x="20" y="122" width="640" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">sources</text>
<text x="215" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">2</text>
<text x="270" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">reliable sources with dates</text>
<text x="30" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">slides</text>
<text x="215" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">2</text>
<text x="270" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">one message per slide, readable</text>
<rect x="20" y="194" width="640" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">talk</text>
<text x="215" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1</text>
<text x="270" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">five minutes, clear and calm</text>
<text x="30" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">questions</text>
<text x="215" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1</text>
<text x="270" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">answers with facts from the report</text>
<rect x="20" y="50" width="640" height="216" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="280" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Total 10 marks. Your teacher gives the final rubric and the date on the e-learning platform.</text>
</svg>
