<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Before a test: check the device</text>
<rect x="20" y="54" width="630" height="40" rx="0" fill="#A86700"/>
<text x="30" y="78.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">check</text>
<text x="255" y="78.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">goal</text>
<text x="500" y="78.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">phone P5 today</text>
<text x="30" y="118.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Free storage</text>
<text x="255" y="118.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">at least 2 GB</text>
<text x="500" y="118.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1.1 GB: delete old videos, clear caches</text>
<rect x="20" y="134" width="630" height="40" rx="0" fill="#f8f9fa"/>
<text x="30" y="158.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Battery</text>
<text x="255" y="158.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">above 50 %, or charging</text>
<text x="500" y="158.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">34 %: charge first</text>
<text x="30" y="198.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Open apps</text>
<text x="255" y="198.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">only the game</text>
<text x="500" y="198.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">9 apps: close them</text>
<rect x="20" y="214" width="630" height="40" rx="0" fill="#f8f9fa"/>
<text x="30" y="238.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">OS version</text>
<text x="255" y="238.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">write it in the report</text>
<text x="500" y="238.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Android 14</text>
<text x="30" y="278.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Notifications</text>
<text x="255" y="278.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Do not disturb on</text>
<text x="500" y="278.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">a call stops the test</text>
<rect x="20" y="54" width="630" height="240" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
