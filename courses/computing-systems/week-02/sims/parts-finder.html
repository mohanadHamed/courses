<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Parts Finder</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .hud { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin: 0 0 8px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .sim .hud .lvl { color: var(--sim-accent); }
    .sim .hud .stars { margin-left: auto; }
    .sim .ask { font-size: 1.08rem; font-weight: 800; background: #fff9db; border: 1.5px solid #ffe066; border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; min-height: 1.6em; }
    .sim #pc { display: block; width: 100%; max-width: 560px; margin: 0 auto; border: 1px solid var(--sim-border); border-radius: 12px; background: #fff; touch-action: manipulation; }
    .sim .part { cursor: pointer; transition: opacity .15s; }
    .sim .part:hover { opacity: .85; }
    .sim .part.good { filter: drop-shadow(0 0 6px #2b8a3e) drop-shadow(0 0 2px #2b8a3e); }
    .sim .part.bad { filter: drop-shadow(0 0 6px #e03131) drop-shadow(0 0 2px #e03131); }
    .sim .message.bad { color: #c92a2a; }
    .sim .pad { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  </style>
</head>
<body class="theme-circuit">

<g class="part" data-part="gpu"><rect x="70" y="244" width="300" height="56" rx="6" fill="#343a40" stroke="#212529" stroke-width="2"/><circle cx="150" cy="272" r="22" fill="#212529" stroke="#868e96" stroke-width="2"/><circle cx="260" cy="272" r="22" fill="#212529" stroke="#868e96" stroke-width="2"/><circle cx="150" cy="272" r="5" fill="#868e96"/><circle cx="260" cy="272" r="5" fill="#868e96"/><rect x="70" y="300" width="300" height="5" fill="#c9a227"/></g>

</svg>
  <p id="msg" class="message">Tap a part.</p>
  <div class="pad"><button id="next" type="button" hidden>Next ▶</button><button id="sound" type="button" class="ghost">Sound: on</button></div>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const NAME = { cpu: "the CPU (under its cooler)", ram: "the memory (RAM)", ssd: "the storage (SSD)", gpu: "the graphics card", motherboard: "the motherboard", psu: "the power supply", cooling: "the cooling fan" };
  const JOB = { cpu: "it runs the instructions", ram: "it holds the game while it runs", ssd: "it keeps the game when the power is off", gpu: "it draws the images", motherboard: "it connects all the parts", psu: "it turns wall power into the right voltages", cooling: "it carries heat away" };
  const ROUNDS = [
    { title: "Round 1 · by name", cards: [["Tap the memory (RAM).", "ram"], ["Tap the CPU.", "cpu"], ["Tap the storage (SSD).", "ssd"], ["Tap the graphics card.", "gpu"], ["Tap the power supply.", "psu"], ["Tap the motherboard.", "motherboard"], ["Tap the cooling fan of the case.", "cooling"]] },
    { title: "Round 2 · by job", cards: [["Which part keeps the game when the power is off?", "ssd"], ["Which part runs the instructions of the game?", "cpu"], ["Which part draws the images of the game?", "gpu"], ["A report says “Out of memory”. Which part does the game need more of?", "ram"], ["Which part turns wall power into the voltages the parts need?", "psu"], ["Which part connects the CPU, the memory and the storage?", "motherboard"], ["The computer gets too hot. Which part carries heat away?", "cooling"]] },
  ];
  let r = 0, i = 0, stars = 0, missed = false, locked = false, sound = true, audio = null;
  const groups = [...document.querySelectorAll(".part")];
  function beep(f, d, type = "triangle") {
    if (!sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain(); o.type = type; o.frequency.value = f; g.gain.value = 0.07;
      o.connect(g); g.connect(audio.destination); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + d); o.start(); o.stop(audio.currentTime + d);
    } catch (_) {}
  }
  function show() {
    groups.forEach((g) => g.classList.remove("good", "bad"));
    if (r >= ROUNDS.length) {
      const total = ROUNDS.reduce((n, x) => n + x.cards.length, 0);
      $("lvl").textContent = "Done"; $("count").textContent = ""; $("ask").textContent = `You found every part. Score: ★ ${stars} of ${total}.`;
      $("msg").textContent = "Press “Play again” to start over."; $("msg").className = "message good";
      $("next").hidden = false; $("next").textContent = "Play again ▶"; return;
    }
    const R = ROUNDS[r];
    $("lvl").textContent = R.title; $("count").textContent = `${i + 1} / ${R.cards.length}`;
    $("ask").textContent = R.cards[i][0];
    $("msg").textContent = "Tap a part."; $("msg").className = "message";
    $("next").hidden = true; missed = false; locked = false;
  }
  groups.forEach((g) => g.addEventListener("click", () => {
    if (r >= ROUNDS.length) return;
    if (locked) { $("msg").textContent = "Correct already. Press Next."; return; }
    const want = ROUNDS[r].cards[i][1], got = g.dataset.part;
    groups.forEach((x) => x.classList.remove("bad"));
    if (got === want) {
      g.classList.add("good"); locked = true;
      if (!missed) { stars++; $("stars").textContent = "★ " + stars; }
      $("msg").textContent = `✓ Yes: ${NAME[got]} — ${JOB[got]}.`; $("msg").className = "message good";
      $("next").hidden = false; $("next").textContent = "Next ▶";
      beep(880, 0.12);
    } else {
      g.classList.add("bad"); missed = true;
      $("msg").textContent = `✗ That is ${NAME[got]}: ${JOB[got]}. Try again.`; $("msg").className = "message bad";
      beep(200, 0.25, "sawtooth");
    }
  }));
  $("next").addEventListener("click", () => {
    if (r >= ROUNDS.length) { r = 0; i = 0; stars = 0; $("stars").textContent = "★ 0"; show(); return; }
    i++; if (i >= ROUNDS[r].cards.length) { r++; i = 0; }
    show();
  });
  $("sound").addEventListener("click", () => { sound = !sound; $("sound").textContent = "Sound: " + (sound ? "on" : "off"); });
  show();
})();
</script>
</body>
</html>
