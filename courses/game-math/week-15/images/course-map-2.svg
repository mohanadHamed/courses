<text x="620" y="220" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">L26–28</text>
<text x="474" y="254" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">five steps, motion,</text>
<text x="474" y="270.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">generators, tests</text>
<text x="340" y="336" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Lectures 1–14 are in the revision of lecture 15: together, the whole course.</text>
