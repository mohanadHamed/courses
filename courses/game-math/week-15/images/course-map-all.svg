<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="350" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800">The whole course in six parts</text>
<rect x="20" y="56" width="200" height="120" rx="14" fill="#2F9E4412" stroke="#2F9E44" stroke-width="2"/>
<text x="34" y="84" font-size="15" fill="#2F9E44" font-weight="800">Vectors</text>
<rect x="156" y="96" width="52" height="21" rx="10.5" fill="#2F9E44"/>
<text x="182" y="111" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800">L1–3</text>
<text x="34" y="132" font-size="12.5" fill="#2a2f2c" font-weight="700">steps, lengths, unit vectors;</text>
<text x="34" y="149" font-size="12.5" fill="#2a2f2c" font-weight="700">dot and cross products;</text>
<text x="34" y="166" font-size="12.5" fill="#2a2f2c" font-weight="700">distance and projection</text>
<rect x="240" y="56" width="200" height="120" rx="14" fill="#1c7ed612" stroke="#1c7ed6" stroke-width="2"/>
<text x="254" y="84" font-size="13.5" fill="#1c7ed6" font-weight="800">Angles and matrices</text>
<rect x="376" y="96" width="52" height="21" rx="10.5" fill="#1c7ed6"/>
<text x="402" y="111" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800">L4–7</text>
<text x="254" y="132" font-size="12.5" fill="#2a2f2c" font-weight="700">sin, cos, atan2; matrices;</text>
<text x="254" y="149" font-size="12.5" fill="#2a2f2c" font-weight="700">translate, scale, rotate;</text>
<text x="254" y="166" font-size="12.5" fill="#2a2f2c" font-weight="700">M = T × R × S</text>
<rect x="460" y="56" width="200" height="120" rx="14" fill="#9C36B512" stroke="#9C36B5" stroke-width="2"/>
<text x="474" y="84" font-size="15" fill="#9C36B5" font-weight="800">Logic</text>
<rect x="596" y="96" width="52" height="21" rx="10.5" fill="#9C36B5"/>
<text x="622" y="111" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800">L8–9</text>
<text x="474" y="132" font-size="12.5" fill="#2a2f2c" font-weight="700">truth tables, De Morgan;</text>
<text x="474" y="149" font-size="12.5" fill="#2a2f2c" font-weight="700">decision tables and</text>
<text x="474" y="166" font-size="12.5" fill="#2a2f2c" font-weight="700">else-if chains</text>
<rect x="20" y="196" width="200" height="120" rx="14" fill="#e8590c12" stroke="#e8590c" stroke-width="2"/>
<text x="34" y="224" font-size="15" fill="#e8590c" font-weight="800">Probability</text>
<rect x="156" y="236" width="52" height="21" rx="10.5" fill="#e8590c"/>
<text x="182" y="251" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800">L10</text>
<text x="34" y="272" font-size="12.5" fill="#2a2f2c" font-weight="700">P(A), not A, OR, AND;</text>
<text x="34" y="289" font-size="12.5" fill="#2a2f2c" font-weight="700">conditions; expected</text>
<text x="34" y="306" font-size="12.5" fill="#2a2f2c" font-weight="700">value; fair games</text>
<rect x="240" y="196" width="200" height="120" rx="14" fill="#c92a2a12" stroke="#c92a2a" stroke-width="2"/>
<text x="254" y="224" font-size="13.5" fill="#c92a2a" font-weight="800">Randomness and balance</text>
<rect x="376" y="236" width="52" height="21" rx="10.5" fill="#c92a2a"/>
<text x="402" y="251" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800">L11–12</text>
<text x="254" y="272" font-size="12.5" fill="#2a2f2c" font-weight="700">seeds, Random.Range,</text>
<text x="254" y="289" font-size="12.5" fill="#2a2f2c" font-weight="700">weights; drop rates, pity,</text>
<text x="254" y="306" font-size="12.5" fill="#2a2f2c" font-weight="700">streaks, shuffle bags</text>
<rect x="460" y="196" width="200" height="120" rx="14" fill="#A8670012" stroke="#A86700" stroke-width="2"/>
<text x="474" y="224" font-size="15" fill="#A86700" font-weight="800">Case studies</text>
<rect x="596" y="236" width="52" height="21" rx="10.5" fill="#A86700"/>
<text x="622" y="251" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800">P3–4</text>
<text x="474" y="272" font-size="12.5" fill="#2a2f2c" font-weight="700">a moving object;</text>
<text x="474" y="289" font-size="12.5" fill="#2a2f2c" font-weight="700">a random level;</text>
<text x="474" y="306" font-size="12.5" fill="#2a2f2c" font-weight="700">the five steps</text>
</svg>