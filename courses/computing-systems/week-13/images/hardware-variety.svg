<text x="150" y="222" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Tune once, test on one device; a dev</text>
<text x="150" y="237.6" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">kit and certification are needed.</text>
