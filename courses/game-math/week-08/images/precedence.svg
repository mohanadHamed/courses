<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="260" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Order of the operators: NOT, then AND, then OR</text>
<rect x="20" y="54" width="310" height="170" rx="12" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.8"/>
<text x="34" y="78" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Without brackets</text>
<text x="36" y="98" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">bossDead &amp;&amp; hasKey || hasTorch</text>
<text x="36" y="130" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">means (bossDead &amp;&amp; hasKey) || hasTorch</text>
<text x="36" y="178" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Boss alive, torch: true. The gate opens by</text>
<text x="36" y="194.2" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">mistake.</text>
<rect x="350" y="54" width="310" height="170" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="364" y="78" font-size="15" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">With brackets</text>
<text x="366" y="98" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">bossDead &amp;&amp; (hasKey || hasTorch)</text>
<text x="366" y="130" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">OR first, because of the brackets</text>
<text x="366" y="178" font-size="12.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Boss alive, torch: false. The gate stays shut.</text>
<text x="340" y="248" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">When AND and OR meet, write the brackets: the reader and the game see the same rule.</text>
</svg>
