<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Tutu Lab: AI changes your sheet</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <link rel="stylesheet" href="../../../../shared/sims/office-lab.css">
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Tutu Lab: AI changes your sheet</h1>
  <p class="hint">The Extra of your worksheet, as on <b>tutudocs.com</b> (no sign-in): <b>open</b> your sheet, ask the <b>AI Assistant</b> for a change, then <b>download</b> it for Excel. (Practice with fixed answers: no real AI here.)</p>
  <div id="tutu"></div>
  <div class="jobs"><b class="t">Steps</b> · <span id="progress"></span><ol id="jobs"></ol></div>
  <div class="row"><button id="reset" type="button" class="ghost">Start again</button></div>
  <p id="msg" class="message"></p>
</main>
<script src="../../../../shared/sims/sim-base.js"></script>
<script>
window.TUTU = {
  kind: "sheet", file: "sales-Huda.xlsx",
  model: { cols: ["A", "B", "C"], rows: [[{ v: "Item", b: 1 }, { v: "Sales (JD)", b: 1 }, { v: "Type", b: 1 }], ["Sandwich", 30, "Food"], ["Cake", 25, "Food"], ["Juice", 18, "Drinks"], ["Chips", 15, "Food"], ["Water", 12, "Drinks"], ["Tea", 9, "Drinks"]] },
  asks: [
    { text: "Add a row at the end: Total, with the sum of the sales.", keys: /total|sum/i, done: "Done: row 8 is Total, 109.",
      apply: (m) => { m.rows.push([{ v: "Total", b: 1 }, { v: 109, b: 1 }, ""]); return ["7:0", "7:1"]; } },
    { text: "Make the Type column green for Drinks.", keys: /green|drinks/i, done: "Done: the cells of Drinks are green.",
      apply: (m) => { const f = []; m.rows.forEach((r, i) => { if (r[2] === "Drinks") { r[2] = { v: "Drinks", fill: "#c6efce" }; f.push(i + ":2"); } }); return f; } },
  ],
};
</script>
<script src="../../../../shared/sims/tutu-lab.js"></script>
</body>
</html>
