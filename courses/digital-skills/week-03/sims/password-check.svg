<text x="46.0" y="256.0" font-size="12.5" fill="#2f9e44" text-anchor="start" font-weight="700" xml:space="preserve">Three kinds: letters, capitals, numbers, symbols</text>
<polyline points="27.2,278.0 30.4,281.2 36.8,274.0" fill="none" stroke="#2f9e44" stroke-width="2.08" stroke-linejoin="round" stroke-linecap="round"/>
<text x="46.0" y="282.0" font-size="12.5" fill="#2f9e44" text-anchor="start" font-weight="700" xml:space="preserve">No common word, name or year</text>
