<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="280" fill="#ffffff"/>
<text x="160.0" y="34.0" font-size="15" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Digital input: on or off</text>
<text x="480.0" y="34.0" font-size="15" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Analog input: a range of values</text>
<rect x="50.0" y="70.0" width="80.0" height="60.0" rx="10" fill="#ffffff" stroke="#A86700" stroke-width="2.5"/>
<text x="90.0" y="108.0" font-size="14" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">Space</text>
<text x="90.0" y="160.0" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">key up</text>
<text x="90.0" y="192.0" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">value 0</text>
<rect x="190.0" y="70.0" width="80.0" height="60.0" rx="10" fill="#A86700" stroke="#A86700" stroke-width="2.5"/>
<text x="230.0" y="108.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Space</text>
<text x="230.0" y="160.0" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">key down</text>
<text x="230.0" y="192.0" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">value 1</text>
<circle cx="400.0" cy="110.0" r="46.0" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<circle cx="423.0" cy="110.0" r="17.0" fill="#1971c2" stroke="none" stroke-width="1.5"/>
<line x1="400.0" y1="110.0" x2="423.0" y2="110.0" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
<line x1="470.0" y1="110.0" x2="610.0" y2="110.0" stroke="#adb5bd" stroke-width="3" stroke-linecap="round"/>
<line x1="470.0" y1="103.0" x2="470.0" y2="117.0" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text x="470.0" y="136.0" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">−1</text>
<line x1="540.0" y1="103.0" x2="540.0" y2="117.0" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text x="540.0" y="136.0" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<line x1="575.0" y1="103.0" x2="575.0" y2="117.0" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text x="575.0" y="136.0" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0.5</text>
<line x1="610.0" y1="103.0" x2="610.0" y2="117.0" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text x="610.0" y="136.0" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<circle cx="575.0" cy="110.0" r="7.0" fill="#1971c2" stroke="none" stroke-width="1.5"/>
<text x="540.0" y="172.0" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">stick pushed half way right:</text>
<text x="540.0" y="194.0" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">x = 0.5</text>
<text x="320.0" y="250.0" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">A key gives 0 or 1. A stick or a trigger gives any value in between, so the car can steer a little.</text>
</svg>
