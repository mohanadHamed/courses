<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Four kinds of intellectual property in a game</text>
<rect x="20" y="52" width="152" height="180" rx="12" fill="#ffffff" stroke="#1c7ed6" stroke-width="2"/>
<rect x="20" y="52" width="152" height="40" rx="12" fill="#1c7ed6"/>
<rect x="20" y="80" width="152" height="12" rx="0" fill="#1c7ed6"/>
<text x="96" y="78" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Copyright</text>
<text x="96" y="118" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">art, music, sound,</text>
<text x="96" y="134.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">video, story, code</text>
<text x="96" y="192" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">starts automatically</text>
<rect x="182" y="52" width="152" height="180" rx="12" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<rect x="182" y="52" width="152" height="40" rx="12" fill="#7048e8"/>
<rect x="182" y="80" width="152" height="12" rx="0" fill="#7048e8"/>
<text x="258" y="78" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Trademark</text>
<text x="258" y="118" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the game&#x27;s name and</text>
<text x="258" y="134.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">logo, the studio&#x27;s</text>
<text x="258" y="150.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">name</text>
<text x="258" y="192" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">registered, for</text>
<text x="258" y="206.9" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">products</text>
<rect x="344" y="52" width="152" height="180" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<rect x="344" y="52" width="152" height="40" rx="12" fill="#e8590c"/>
<rect x="344" y="80" width="152" height="12" rx="0" fill="#e8590c"/>
<text x="420" y="78" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Patent</text>
<text x="420" y="118" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">a new technical</text>
<text x="420" y="134.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">invention</text>
<text x="420" y="192" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">registered, limited</text>
<text x="420" y="206.9" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">time</text>
<rect x="506" y="52" width="152" height="180" rx="12" fill="#ffffff" stroke="#0c8599" stroke-width="2"/>
<rect x="506" y="52" width="152" height="40" rx="12" fill="#0c8599"/>
<rect x="506" y="80" width="152" height="12" rx="0" fill="#0c8599"/>
<text x="582" y="78" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Trade secret</text>
<text x="582" y="118" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">unreleased plans,</text>
<text x="582" y="134.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">source code</text>
<text x="582" y="192" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">kept secret by</text>
<text x="582" y="206.9" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">contracts</text>
</svg>
