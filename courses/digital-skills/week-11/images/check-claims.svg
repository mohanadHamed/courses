<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Find the claims, then check each one</text>
<rect x="20" y="52" width="380" height="250" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1.4"/>
<text x="36" y="91" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Sleep matters for exams.</text>
<rect x="30" y="116" width="253.5" height="28" rx="4" fill="#d3f9d8"/>
<text x="36" y="135" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Adults need at least 7 hours of sleep.</text>
<rect x="30" y="160" width="276.7" height="28" rx="4" fill="#ffe3e3"/>
<text x="36" y="179" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The brain uses 50 % of the body&#x27;s energy.</text>
<rect x="30" y="204" width="227" height="28" rx="4" fill="#fff3bf"/>
<text x="36" y="223" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Our college library opens at 7:00.</text>
<text x="36" y="267" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">So sleep well before the exam!</text>
<rect x="420" y="52" width="240" height="250" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="434" y="76" font-size="14.5" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">For each claim</text>
<text x="434" y="94" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">1 Find it: a number, a date, a</text>
<text x="434" y="110.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">name.</text>
<text x="434" y="134" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">2 Check it in two reliable sources.</text>
<text x="434" y="174" font-size="12.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">true → keep it</text>
<text x="434" y="214" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">wrong → correct it (20 %)</text>
<text x="434" y="254" font-size="12.5" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">cannot check → remove it or ask</text>
</svg>
