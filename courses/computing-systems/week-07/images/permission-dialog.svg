<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A runtime permission: the same question on two phones</text>
<rect x="40" y="54" width="270" height="230" rx="16" fill="#f8f9fa" stroke="#2b8a3e" stroke-width="2"/>
<text x="175" y="82" font-size="14" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">Android</text>
<text x="175" y="110" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Allow Pocket Quest to use this</text>
<text x="175" y="126.9" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">device&#x27;s location?</text>
<rect x="65" y="160" width="220" height="30" rx="15" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="175" y="180" font-size="13" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">While using the app</text>
<rect x="65" y="198" width="220" height="30" rx="15" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="175" y="218" font-size="13" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">Only this time</text>
<rect x="65" y="236" width="220" height="30" rx="15" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="175" y="256" font-size="13" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">Don&#x27;t allow</text>
<rect x="370" y="54" width="270" height="230" rx="16" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="2"/>
<text x="505" y="82" font-size="14" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">iPhone</text>
<text x="505" y="110" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Allow Pocket Quest to use this</text>
<text x="505" y="126.9" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">device&#x27;s location?</text>
<rect x="395" y="160" width="220" height="30" rx="15" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="505" y="180" font-size="13" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">Allow While Using App</text>
<rect x="395" y="198" width="220" height="30" rx="15" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="505" y="218" font-size="13" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">Allow Once</text>
<rect x="395" y="236" width="220" height="30" rx="15" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="505" y="256" font-size="13" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">Don&#x27;t Allow</text>
<text x="340" y="312" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Give only what the game needs. Change it later: Settings › Apps (iPhone: Settings › the app).</text>
</svg>
