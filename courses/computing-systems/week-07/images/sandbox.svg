<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Every app in its own sandbox</text>
<rect x="30" y="60" width="140" height="130" rx="12" fill="#A8670014" stroke="#A86700" stroke-width="2" stroke-dasharray="6 4"/>
<text x="100" y="86" font-size="14" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">Pocket Quest</text>
<path d="M52 104 H73 L82 113 V142 H52 Z" fill="#ffffff" stroke="#A86700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M73 104 V113 H82" fill="none" stroke="#A86700" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="58" y1="121" x2="75" y2="121" stroke="#A86700" stroke-width="1.6" stroke-linecap="round"/>
<line x1="58" y1="128" x2="75" y2="128" stroke="#A86700" stroke-width="1.6" stroke-linecap="round"/>
<line x1="58" y1="135" x2="75" y2="135" stroke="#A86700" stroke-width="1.6" stroke-linecap="round"/>
<text x="120" y="128" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">own files</text>
<text x="100" y="172" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">own memory</text>
<rect x="190" y="60" width="140" height="130" rx="12" fill="#1c7ed614" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="6 4"/>
<text x="260" y="86" font-size="14" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">Camera app</text>
<path d="M212 104 H233 L242 113 V142 H212 Z" fill="#ffffff" stroke="#1c7ed6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M233 104 V113 H242" fill="none" stroke="#1c7ed6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="218" y1="121" x2="235" y2="121" stroke="#1c7ed6" stroke-width="1.6" stroke-linecap="round"/>
<line x1="218" y1="128" x2="235" y2="128" stroke="#1c7ed6" stroke-width="1.6" stroke-linecap="round"/>
<line x1="218" y1="135" x2="235" y2="135" stroke="#1c7ed6" stroke-width="1.6" stroke-linecap="round"/>
<text x="280" y="128" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">own files</text>
<text x="260" y="172" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">own memory</text>
<rect x="350" y="60" width="140" height="130" rx="12" fill="#7048e814" stroke="#7048e8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="420" y="86" font-size="14" fill="#7048e8" text-anchor="middle" font-weight="800" xml:space="preserve">Messages</text>
<path d="M372 104 H393 L402 113 V142 H372 Z" fill="#ffffff" stroke="#7048e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M393 104 V113 H402" fill="none" stroke="#7048e8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="378" y1="121" x2="395" y2="121" stroke="#7048e8" stroke-width="1.6" stroke-linecap="round"/>
<line x1="378" y1="128" x2="395" y2="128" stroke="#7048e8" stroke-width="1.6" stroke-linecap="round"/>
<line x1="378" y1="135" x2="395" y2="135" stroke="#7048e8" stroke-width="1.6" stroke-linecap="round"/>
<text x="440" y="128" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">own files</text>
<text x="420" y="172" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">own memory</text>
<line x1="100" y1="196" x2="100" y2="229.9" stroke="#e8590c" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="100,238 95.5,229 104.5,229" fill="#e8590c"/>
<text x="108" y="222" font-size="12" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">asks</text>
<rect x="30" y="242" width="460" height="50" rx="10" fill="#A86700"/>
<text x="260" y="272" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">the OS: checks the permission (camera, microphone, location)</text>
<rect x="510" y="60" width="150" height="180" rx="12" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.8"/>
<text x="524" y="84" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">The rule</text>
<text x="522" y="104" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">An app cannot read</text>
<text x="522" y="120.2" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">the files of another</text>
<text x="522" y="136.5" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">app. It reaches the</text>
<text x="522" y="152.8" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">hardware only</text>
<text x="522" y="169" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">through the OS,</text>
<text x="522" y="185.2" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">with a permission.</text>
</svg>
