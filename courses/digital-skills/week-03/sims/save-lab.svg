<text x="552.0" y="133.0" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Saved to OneDrive</text>
<rect x="24.0" y="144.0" width="592.0" height="40.0" rx="0" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<rect x="34.0" y="150.0" width="138.0" height="28.0" rx="9" fill="#2b579a" stroke="#2b579a" stroke-width="1.5"/>
<text x="103.0" y="168.5" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Save (Ctrl + S)</text>
