<rect x="20" y="82" width="118" height="12" rx="0" fill="#1c7ed6"/>
<text x="79" y="83" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">The build</text>
<text x="79" y="116" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">PocketQuest_1.3</text>
<text x="79" y="130.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">.apk and .ipa</text>
<rect x="150" y="60" width="118" height="120" rx="12" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<rect x="150" y="60" width="118" height="34" rx="12" fill="#7048e8"/>
<rect x="150" y="82" width="118" height="12" rx="0" fill="#7048e8"/>
<text x="209" y="83" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Devices</text>
<text x="209" y="116" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">emulators and</text>
<text x="209" y="130.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">real phones</text>
<rect x="280" y="60" width="118" height="120" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<rect x="280" y="60" width="118" height="34" rx="12" fill="#e8590c"/>
<rect x="280" y="82" width="118" height="12" rx="0" fill="#e8590c"/>
<text x="339" y="83" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Tools</text>
<text x="339" y="116" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Android Studio,</text>
<text x="339" y="130.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">adb, Logcat,</text>
<text x="339" y="145.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Xcode</text>
<rect x="410" y="60" width="118" height="120" rx="12" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/>
<rect x="410" y="60" width="118" height="34" rx="12" fill="#2b8a3e"/>
<rect x="410" y="82" width="118" height="12" rx="0" fill="#2b8a3e"/>
<text x="469" y="83" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Test plan</text>
<text x="469" y="116" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">what to test, on</text>
<text x="469" y="130.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">which device</text>
<rect x="540" y="60" width="118" height="120" rx="12" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/>
<rect x="540" y="60" width="118" height="34" rx="12" fill="#c92a2a"/>
<rect x="540" y="82" width="118" height="12" rx="0" fill="#c92a2a"/>
<text x="599" y="83" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Bug report</text>
<text x="599" y="116" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">steps, expected,</text>
<text x="599" y="130.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">actual</text>
<text x="340" y="214" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Plan which devices and versions, set them up, run the build, record what happens.</text>
<text x="340" y="236" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">The same test on the same setup must give the same result: write the setup down.</text>
