<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="260" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The same second at 30 and at 60 frames per second</text>
<text x="20" y="95" font-size="13" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">30 fps</text>
<line x1="100" y1="90" x2="600" y2="90" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="100" cy="90" r="3.5" fill="#e8590c"/>
<circle cx="200" cy="90" r="3.5" fill="#e8590c"/>
<circle cx="300" cy="90" r="3.5" fill="#e8590c"/>
<circle cx="400" cy="90" r="3.5" fill="#e8590c"/>
<circle cx="500" cy="90" r="3.5" fill="#e8590c"/>
<circle cx="600" cy="90" r="3.5" fill="#e8590c"/>
<text x="610" y="95" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">5 units</text>
<text x="100" y="76" font-size="11.5" fill="#e8590c" text-anchor="start" font-weight="700" xml:space="preserve">step = 5 × 1/30 = 0.167</text>
<text x="20" y="175" font-size="13" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">60 fps</text>
<line x1="100" y1="170" x2="600" y2="170" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="100" cy="170" r="3.5" fill="#1c7ed6"/>
<circle cx="150" cy="170" r="3.5" fill="#1c7ed6"/>
<circle cx="200" cy="170" r="3.5" fill="#1c7ed6"/>
<circle cx="250" cy="170" r="3.5" fill="#1c7ed6"/>
<circle cx="300" cy="170" r="3.5" fill="#1c7ed6"/>
<circle cx="350" cy="170" r="3.5" fill="#1c7ed6"/>
<circle cx="400" cy="170" r="3.5" fill="#1c7ed6"/>
<circle cx="450" cy="170" r="3.5" fill="#1c7ed6"/>
<circle cx="500" cy="170" r="3.5" fill="#1c7ed6"/>
<circle cx="550" cy="170" r="3.5" fill="#1c7ed6"/>
<circle cx="600" cy="170" r="3.5" fill="#1c7ed6"/>
<text x="610" y="175" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">5 units</text>
<text x="100" y="156" font-size="11.5" fill="#1c7ed6" text-anchor="start" font-weight="700" xml:space="preserve">step = 5 × 1/60 = 0.083</text>
<text x="20" y="222" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Each frame: position += velocity × Δt. More frames give smaller steps, the same distance per second (a</text>
<text x="20" y="237.6" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">dot for every sixth frame).</text>
</svg>
