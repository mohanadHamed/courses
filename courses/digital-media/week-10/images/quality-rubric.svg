<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Evaluating the audio of a level</text>
<rect x="20" y="50" width="640" height="32" rx="0" fill="#9C36B5"/>
<text x="30" y="70.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">criterion</text>
<text x="370" y="70.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">question</text>
<text x="620" y="70.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">1–3</text>
<text x="30" y="102.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">clarity</text>
<text x="370" y="102.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Do I hear every important cue (voice, warnings)?</text>
<text x="620" y="102.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve"></text>
<rect x="20" y="114" width="640" height="32" rx="0" fill="#f8f9fa"/>
<text x="30" y="134.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">balance</text>
<text x="370" y="134.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Is any group too loud or lost?</text>
<text x="620" y="134.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve"></text>
<text x="30" y="166.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">consistency</text>
<text x="370" y="166.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Do sounds fit the style and each other?</text>
<text x="620" y="166.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve"></text>
<rect x="20" y="178" width="640" height="32" rx="0" fill="#f8f9fa"/>
<text x="30" y="198.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">repetition</text>
<text x="370" y="198.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Does any sound get annoying?</text>
<text x="620" y="198.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve"></text>
<text x="30" y="230.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">technical</text>
<text x="370" y="230.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">No clipping, clicks, gaps; peaks below 0 dB?</text>
<text x="620" y="230.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve"></text>
<rect x="20" y="242" width="640" height="32" rx="0" fill="#f8f9fa"/>
<text x="30" y="262.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">accessibility</text>
<text x="370" y="262.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Visual cues, subtitles, a slider per group?</text>
<text x="620" y="262.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve"></text>
<text x="30" y="294.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">performance</text>
<text x="370" y="294.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Small memory, no slow start?</text>
<text x="620" y="294.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve"></text>
<rect x="20" y="50" width="640" height="256" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="340" y="320" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Give each criterion 1 (weak), 2 (fair) or 3 (good), with one note of evidence.</text>
</svg>
