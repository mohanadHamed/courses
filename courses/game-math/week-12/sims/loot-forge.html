<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Loot Forge</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #ebfbee; border: 1.5px solid #2F9E44; border-radius: 10px; padding: 8px 12px; margin: 6px 0; } .sim .card code { font-size: .95rem; }</style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Loot Forge</h1>
  <p class="hint">The loot designer of <i>Torch Hall</i> builds the random parts of the game. Answer each question of the forge.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "Loot table: common 50, rare 35, epic 12, legendary 3.", goal: "P(epic)?", answer: "12 %", choices: C(["12 %", "12/50", "1/4", "88 %"]), good: "12 ÷ (50 + 35 + 12 + 3) = 12/100 = 12 %." },
    { card: "A rack: bow with weight 2, axe with weight 3. (They do not add up to 100.)", goal: "P(axe)?", answer: "3/5", choices: C(["3/5", "3 %", "1/2", "2/3"]), good: "3 ÷ (2 + 3) = 3/5. Only the share of the sum counts." },
    { card: "Cumulative weights: common 50, rare 85, epic 97, legendary 100. The random number is r = 90.", goal: "Which item drops?", answer: "epic", choices: C(["epic", "rare", "legendary", "common"]), good: "90 is from 85 to 97: epic." },
    { card: "A critical hit should come with 15 %. The code uses Random.value (0 to 1).", goal: "Which condition?", answer: "Random.value < 0.15f", choices: C(["Random.value < 0.15f", "Random.value < 15", "Random.value > 0.15f", "Random.Range(0, 15) == 1"]), good: "Random.value is below 0.15 in 15 % of the cases." },
    { card: "The daily cave must be the same for every player today. The code seeds with the time in every frame.", goal: "The fix?", answer: "seed once, with the date", choices: C(["seed once, with the date", "seed with the time", "seed in every frame", "no seed at all"]), good: "The same seed gives the same cave; the date changes only tomorrow. Seed once, when the level starts." },
    { card: "A weighted pick: r = Random.value * sum, then the code checks the items in order with r < cumulative.", goal: "What does an item with weight 0 do?", answer: "it never drops", choices: C(["it never drops", "it drops once", "it drops most often", "the game crashes"]), good: "Its part of the bar has length 0: no r falls into it." },
  ];
  rounds.forEach((r) => { r.why = {}; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 1, animMs: 600, intro: "Round 1 is the story of the lesson: the chest loot table." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "The forge is cold: all loot is ready." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
