<text x="162.5" y="245" font-size="10" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">16–19</text>
<rect x="188" y="60" width="39" height="170" rx="2" fill="#2F9E44"/>
<text x="207.5" y="245" font-size="10" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">20–23</text>
<rect x="233" y="80.3" width="39" height="149.7" rx="2" fill="#2F9E44"/>
<text x="252.5" y="245" font-size="10" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">24–27</text>
