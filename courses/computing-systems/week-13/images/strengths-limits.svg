<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Strengths and limits (typical, they change over time)</text>
<rect x="20" y="50" width="640" height="52" rx="0" fill="#A86700"/>
<text x="30" y="80.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">platform</text>
<text x="150" y="80.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">strengths</text>
<text x="410" y="80.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">limits</text>
<text x="30" y="132.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">console</text>
<text x="150" y="132.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">fixed hardware, big screen, controller</text>
<text x="410" y="132.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">dev kit, certification, store rules</text>
<rect x="20" y="154" width="640" height="52" rx="0" fill="#f8f9fa"/>
<text x="30" y="184.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">gaming PC</text>
<text x="150" y="184.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">strong hardware, open stores, mods</text>
<text x="410" y="184.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">many configurations to test</text>
<text x="30" y="236.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">mobile</text>
<text x="150" y="236.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">biggest reach, always with the player</text>
<text x="410" y="236.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">touch only, battery, heat, small screen</text>
<rect x="20" y="258" width="640" height="52" rx="0" fill="#f8f9fa"/>
<text x="30" y="288.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">cloud gaming</text>
<text x="150" y="288.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">no download, weak devices can play</text>
<text x="410" y="288.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">needs a fast, stable network</text>
<rect x="20" y="50" width="640" height="260" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
