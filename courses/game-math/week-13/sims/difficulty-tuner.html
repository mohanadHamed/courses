<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Difficulty Tuner</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 4px 0; font-weight: 700; font-size: .9rem; }
    .sim .bar button.on { background: var(--sim-accent); color: #fff; }
    .sim .task { font-weight: 800; color: var(--sim-accent); margin: 6px 0 0; }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Difficulty Tuner: how hard is the skeleton?</h1>
  <p class="hint">In <i>Torch Hall</i>, the player (50 health, 10 damage) and an enemy attack in turns, the player first. Each attack hits with its hit chance. Tune the enemy, then simulate 1000 fights.</p>
  <div class="bar" id="sl"></div>
  <div class="bar"><button type="button" id="go">Simulate 1000 fights ▶</button></div>
  <canvas id="c" aria-label="The win rate and the fight lengths"></canvas>
  <p class="calc" id="calc"></p>
  <p class="task" id="task"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const PL = { hp: 50, dmg: 10, hit: 0.7 };
  const s = { ehp: 40, edmg: 12, ehit: 0.6, res: null };
  const TASKS = [
    { q: "Task 1: Simulate the skeleton (40 health, 12 damage, 60 % hit). What is the player's win rate?", ok: () => s.res && s.ehp === 40 && s.edmg === 12 && Math.abs(s.ehit - 0.6) < 0.01 },
    { q: "Task 2: A normal enemy should be beaten in 70–85 % of fights. Change ONE value of the skeleton and simulate.", ok: () => s.res && s.res.win >= 0.7 && s.res.win <= 0.85 },
    { q: "Task 3: Make a boss that the player beats in only 30–45 % of fights.", ok: () => s.res && s.res.win >= 0.3 && s.res.win <= 0.45 },
  ];
  let ti = 0, ready = false;
  const sl = {};
  [["ehp", "Enemy health", 10, 120, 10, (v) => v], ["edmg", "Enemy damage", 2, 30, 1, (v) => v], ["ehit", "Enemy hit chance", 0.1, 1, 0.05, (v) => Math.round(v * 100) + " %"]]
    .forEach(([k, l, lo, hi, st, show]) => { sl[k] = Kit.slider($("sl"), l, lo, hi, st, s[k], (v) => { s[k] = v; s.res = null; if (ready) upd(); }, show); });
  function fight() {
    let ph = PL.hp, eh = s.ehp, turns = 0;
    for (;;) { turns++; if (Math.random() < PL.hit) eh -= PL.dmg; if (eh <= 0) return { win: true, turns }; if (Math.random() < s.ehit) ph -= s.edmg; if (ph <= 0) return { win: false, turns }; }
  }
  $("go").addEventListener("click", () => {
    const R = Array.from({ length: 1000 }, fight), w = R.filter((r) => r.win);
    s.res = { win: w.length / 1000, turns: R.reduce((a, r) => a + r.turns, 0) / 1000, R };
    upd();
  });
  function upd() {
    const hitsToKill = Math.ceil(s.ehp / PL.dmg), expAtt = hitsToKill / PL.hit, enemyHits = Math.ceil(PL.hp / s.edmg), expEnemy = enemyHits / s.ehit;
    $("calc").textContent = `player needs ${hitsToKill} hits ≈ ${Kit.fmt(expAtt, 1)} attacks · enemy needs ${enemyHits} hits ≈ ${Kit.fmt(expEnemy, 1)} attacks` + (s.res ? ` · win rate ${Math.round(s.res.win * 100)} %, average ${Kit.fmt(s.res.turns, 1)} turns` : "");
    let m = "";
    while (ti < TASKS.length && TASKS[ti].ok()) { ti++; m = "✓ Done. "; Kit.good(); }
    $("task").textContent = ti < TASKS.length ? TASKS[ti].q : "All tasks are done: the expected numbers guide you, the simulation confirms.";
    $("msg").textContent = m + (!s.res ? "Compare the expected attacks of both sides, then simulate." : s.res.win > 0.9 ? "Too easy: the enemy is no threat." : s.res.win < 0.3 ? "Too hard for most players." : "A fair challenge for this kind of enemy?");
    paint();
  }
  const cv = Kit.canvas($("c"), (W) => Math.min(170, W * 0.32));
  function paint() {
    const c = cv.ctx, W = cv.W, H = cv.H;
    c.clearRect(0, 0, W, H);
    if (!s.res) { Kit.text(c, "Press Simulate.", W / 2, H / 2, 14, "#868e96"); return; }
    const bw = W * 0.35;
    Kit.rrect(c, 10, 20, bw, 26, 6, "#ffe3e3"); Kit.rrect(c, 10, 20, bw * s.res.win, 26, 6, "#2F9E44");
    Kit.text(c, `player wins ${Math.round(s.res.win * 100)} %`, 10 + bw / 2, 38, 12, "#fff");
    [[0.7, "#868e96"], [0.85, "#868e96"]].forEach(([v]) => { c.fillStyle = "#495057"; c.fillRect(10 + bw * v - 1, 16, 2, 34); });
    Kit.text(c, "70–85 %: normal", 10 + bw * 0.78, 64, 10, "#495057");
    const cnt = Array(31).fill(0); s.res.R.forEach((r) => cnt[Math.min(30, r.turns)]++);
    const mx = Math.max(...cnt), x0 = bw + 40, w = W - x0 - 10;
    cnt.forEach((k, t) => { const h = (H - 40) * k / mx; c.fillStyle = "#74c0fc"; c.fillRect(x0 + w * t / 31, H - 20 - h, w / 31 - 1, h); });
    Kit.text(c, "turns per fight", x0 + w / 2, H - 4, 10, "#868e96");
  }
  window.addEventListener("resize", () => setTimeout(paint, 60));
  window.DT = { set: (o) => { Object.entries(o).forEach(([k, v]) => { sl[k].value = v; s[k] = v; sl[k].dispatchEvent(new Event("input")); }); }, go: () => $("go").click() };
  ready = true; upd();
})();
</script>
</body>
</html>
