<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Check a translation: days, dates, numbers and names</text>
<rect x="20" y="52" width="300" height="140" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
<text x="34" y="76" font-size="13" fill="#6b726e" text-anchor="start" font-weight="800" xml:space="preserve">English (the memo)</text>
<text x="34" y="102" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The office will close early on</text>
<text x="34" y="120.2" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Thursday, 20 November, at 1 pm.</text>
<rect x="360" y="52" width="300" height="140" rx="8" fill="#ffffff" stroke="#D9480F" stroke-width="2"/>
<text x="646" y="76" font-size="13" fill="#D9480F" text-anchor="end" font-weight="800" xml:space="preserve">العربية (ترجمة آلية)</text>
<text x="646" y="110" font-size="18" text-anchor="start" direction="rtl" font-weight="600" fill="#2a2f2c">سيُغلق المكتب مبكرًا يوم <tspan fill="#c92a2a" font-weight="800" text-decoration="underline">الثلاثاء</tspan></text>
<text x="646" y="144" font-size="18" text-anchor="start" direction="rtl" font-weight="600" fill="#2a2f2c">20 نوفمبر، الساعة 1 ظهرًا</text>
<text x="526" y="182" font-size="12.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">الثلاثاء = Tuesday, not Thursday</text>
<text x="20" y="228" font-size="13.5" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Check: the day and the date · the time and the numbers · the names · the meaning</text>
<text x="340" y="270" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Never paste a private document into a free online translator.</text>
</svg>
