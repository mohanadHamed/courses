<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Tutu Lab: AI changes your letter</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <link rel="stylesheet" href="../../../../shared/sims/office-lab.css">
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Tutu Lab: AI changes your letter</h1>
  <p class="hint">The Extra of your worksheet, as on <b>tutudocs.com</b> (no sign-in): <b>open</b> your letter, ask the <b>AI Assistant</b> for a change, then <b>download</b> it for Word. (Practice with fixed answers: no real AI here.)</p>
  <div id="tutu"></div>
  <div class="jobs"><b class="t">Steps</b> · <span id="progress"></span><ol id="jobs"></ol></div>
  <div class="row"><button id="reset" type="button" class="ghost">Start again</button></div>
  <p id="msg" class="message"></p>
</main>
<script src="../../../../shared/sims/sim-base.js"></script>
<script>
window.TUTU = {
  kind: "doc", file: "letter-Huda.docx",
  model: [
    { style: "Normal", text: "Subject: Request for a training place" },
    { style: "Normal", text: "Dear Ms Saleh," },
    { style: "Normal", text: "I am a first-year diploma student. I ask for a summer training place in July." },
    { style: "Normal", text: "Yours sincerely," },
    { style: "Normal", text: "Huda Ali" },
  ],
  asks: [
    { text: "Add a short paragraph about my skills: Word, Excel and teamwork.", keys: /skills|paragraph/i, done: "Done: a short paragraph about your skills is before Yours sincerely.",
      apply: (m) => { m.splice(3, 0, { style: "Normal", text: "I can use Word and Excel, and I like to work in a team." }); return [3]; } },
    { text: "Make the subject line bold.", keys: /bold|subject/i, done: "Done: the subject line is bold.", apply: (m) => { m[0].bold = true; return [0]; } },
  ],
};
</script>
<script src="../../../../shared/sims/tutu-lab.js"></script>
</body>
</html>
