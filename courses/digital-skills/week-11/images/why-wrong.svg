<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Why an AI answer can be wrong</text>
<rect x="20" y="52" width="205" height="226" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="34" y="76" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">It predicts words</text>
<text x="34" y="92" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">“Students who sleep 8 hours</text>
<text x="34" y="107.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">get …”</text>
<rect x="34" y="140" width="120" height="20" rx="4" fill="#D9480F"/>
<text x="160" y="155" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">better</text>
<rect x="34" y="170" width="40.6" height="20" rx="4" fill="#FFC078"/>
<text x="160" y="185" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">25 %</text>
<rect x="34" y="200" width="9.7" height="20" rx="4" fill="#FFC078"/>
<text x="160" y="215" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">tired</text>
<text x="34" y="238" font-size="11.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Likely words, not checked</text>
<text x="34" y="252.9" font-size="11.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">facts.</text>
<rect x="238" y="52" width="205" height="226" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="252" y="76" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">It has a cutoff</text>
<line x1="254" y1="150" x2="428" y2="150" stroke="#adb5bd" stroke-width="3" stroke-linecap="round"/>
<circle cx="330" cy="150" r="7" fill="#D9480F"/>
<text x="330" y="136" font-size="11.5" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">cutoff</text>
<text x="394" y="176" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">new facts?</text>
<text x="252" y="206" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">It may not know newer facts,</text>
<text x="252" y="220.9" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">or your local facts (your</text>
<text x="252" y="235.9" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">library&#x27;s hours).</text>
<rect x="456" y="52" width="204" height="226" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="470" y="76" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">It sounds sure</text>
<text x="470" y="92" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Wrong answers come in the</text>
<text x="470" y="107.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">same calm, sure voice as</text>
<text x="470" y="123.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">right ones.</text>
<text x="470" y="176" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">A made-up answer is called a</text>
<text x="470" y="191.6" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">hallucination.</text>
</svg>
