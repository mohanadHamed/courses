<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">An animatic: the panels on a time line, with sound</text>
<rect x="30" y="70" width="110" height="60" rx="6" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="85" y="96" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<text x="85" y="116" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">3 s</text>
<text x="85" y="150" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">wide street</text>
<rect x="144" y="70" width="110" height="60" rx="6" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="199" y="96" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<text x="199" y="116" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">3 s</text>
<text x="199" y="150" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Nour rows</text>
<rect x="258" y="70" width="72" height="60" rx="6" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="294" y="96" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<text x="294" y="116" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">2 s</text>
<text x="294" y="150" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Nour&#x27;s line</text>
<rect x="334" y="70" width="110" height="60" rx="6" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="389" y="96" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<text x="389" y="116" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">3 s</text>
<text x="389" y="150" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">the roof</text>
<rect x="448" y="70" width="110" height="60" rx="6" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="503" y="96" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">5</text>
<text x="503" y="116" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">3 s</text>
<text x="503" y="150" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Salma&#x27;s line</text>
<rect x="562" y="70" width="72" height="60" rx="6" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="598" y="96" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">6</text>
<text x="598" y="116" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">2 s</text>
<text x="598" y="150" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">the cat</text>
<rect x="30" y="172" width="604" height="26" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.4"/>
<text x="38" y="190" font-size="12" fill="#1c7ed6" text-anchor="start" font-weight="700" xml:space="preserve">sound: water, wind, splash, the two lines</text>
<line x1="30" y1="220" x2="630.3" y2="220" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="638,220 629.4,224.3 629.4,215.7" fill="#adb5bd"/>
<text x="30" y="238" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">0 s</text>
<text x="182" y="238" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">4 s</text>
<text x="334" y="238" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">8 s</text>
<text x="486" y="238" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">12 s</text>
<text x="638" y="238" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">16 s</text>
<text x="30" y="270" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Total 16 s. Play it: is a line too short to read? Does a shot drag?</text>
</svg>
