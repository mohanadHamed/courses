<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="270" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Finding a network problem, from near to far</text>
<rect x="15" y="64" width="150" height="70" rx="8" fill="#1e1e2e"/>
<text x="90.0" y="104" font-size="13" fill="#ffd43b" text-anchor="middle" font-weight="700" xml:space="preserve">1 ipconfig</text>
<text x="90.0" y="160" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">an IP address?</text>
<text x="90.0" y="208" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="700" xml:space="preserve">no → cable, Wi-Fi</text>
<line x1="165" y1="99" x2="179" y2="99" stroke="#A86700" stroke-width="2" stroke-linecap="round"/>
<polygon points="185,99 179,102 179,96" fill="#A86700"/>
<rect x="185" y="64" width="150" height="70" rx="8" fill="#1e1e2e"/>
<text x="260.0" y="104" font-size="13" fill="#ffd43b" text-anchor="middle" font-weight="700" xml:space="preserve">2 ping gateway</text>
<text x="260.0" y="160" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">the router answers?</text>
<text x="260.0" y="208" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="700" xml:space="preserve">no → LAN problem</text>
<line x1="335" y1="99" x2="349" y2="99" stroke="#A86700" stroke-width="2" stroke-linecap="round"/>
<polygon points="355,99 349,102 349,96" fill="#A86700"/>
<rect x="355" y="64" width="150" height="70" rx="8" fill="#1e1e2e"/>
<text x="430.0" y="104" font-size="13" fill="#ffd43b" text-anchor="middle" font-weight="700" xml:space="preserve">3 ping server</text>
<text x="430.0" y="160" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">the server answers?</text>
<text x="430.0" y="208" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="700" xml:space="preserve">name fails, IP works → DNS</text>
<line x1="505" y1="99" x2="519" y2="99" stroke="#A86700" stroke-width="2" stroke-linecap="round"/>
<polygon points="525,99 519,102 519,96" fill="#A86700"/>
<rect x="525" y="64" width="150" height="70" rx="8" fill="#1e1e2e"/>
<text x="600.0" y="104" font-size="13" fill="#ffd43b" text-anchor="middle" font-weight="700" xml:space="preserve">4 speed test</text>
<text x="600.0" y="160" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">enough bandwidth?</text>
<text x="600.0" y="208" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="700" xml:space="preserve">no → too many users</text>
<text x="340" y="252" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">yes → go to the next step. The first “no” shows where the problem is.</text>
</svg>
