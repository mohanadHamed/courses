<rect x="510" y="200" width="140" height="22" rx="6" fill="#2b8a3e"/>
<text x="580" y="242" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">all players</text>
<text x="340" y="270" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">If the crash rate rises, the studio stops the rollout and fixes the bug.</text>
