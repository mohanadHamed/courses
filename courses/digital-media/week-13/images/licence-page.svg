<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Reading a licence page (example)</text>
<rect x="20" y="50" width="400" height="250" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
<rect x="20" y="50" width="400" height="26" rx="8" fill="#e9ecef"/>
<rect x="20" y="68" width="400" height="8" rx="0" fill="#e9ecef"/>
<circle cx="34" cy="63" r="4.5" fill="#ff6b6b"/>
<circle cx="48" cy="63" r="4.5" fill="#fcc419"/>
<circle cx="62" cy="63" r="4.5" fill="#51cf66"/>
<text x="220" y="67" font-size="11.5" fill="#495057" text-anchor="middle" font-weight="700" xml:space="preserve">sounds.example.org / night-rain</text>
<text x="40" y="104" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Night Rain (loop, 30 s)</text>
<text x="40" y="126" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">by Lina Haddad</text>
<text x="40" y="158" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Licence</text>
<text x="300" y="158" font-size="12.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">CC BY 4.0</text>
<text x="40" y="184" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Commercial use</text>
<text x="300" y="184" font-size="12.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">yes</text>
<text x="40" y="210" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Changes allowed</text>
<text x="300" y="210" font-size="12.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">yes</text>
<text x="40" y="236" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Credit required</text>
<text x="300" y="236" font-size="12.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">yes</text>
<text x="40" y="262" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Sell the sound file alone</text>
<text x="300" y="262" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">no</text>
<rect x="440" y="50" width="220" height="250" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="454" y="74" font-size="14" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Check and save</text>
<text x="454" y="95.5" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Who is the author?</text>
<text x="454" y="114.1" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Which licence, exactly?</text>
<text x="454" y="132.7" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Commercial use? Changes?</text>
<text x="454" y="151.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Which credit text?</text>
<text x="454" y="169.9" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Save the page as a PDF with the</text>
<text x="454" y="185.5" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">date.</text>
</svg>
