<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Check a summary: every point must be in the text</text>
<rect x="20" y="52" width="300" height="236" rx="6" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
<text x="34" y="76" font-size="13" fill="#6b726e" text-anchor="start" font-weight="800" xml:space="preserve">The memo (original)</text>
<text x="34" y="104" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">The office will close early on</text>
<text x="34" y="128" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Thursday, 20 November, at 1 pm.</text>
<text x="34" y="152" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Please save your work and turn off</text>
<text x="34" y="176" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">your computers.</text>
<text x="34" y="200" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">The shop stays open until 6 pm.</text>
<text x="34" y="224" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Shop staff come to the office door</text>
<text x="34" y="248" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">at 5 pm for the new price list.</text>
<rect x="32" y="252" width="52" height="20" rx="4" fill="#fff3bf"/>
<text x="58" y="266" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">5 pm</text>
<rect x="360" y="52" width="300" height="236" rx="6" fill="#ffffff" stroke="#D9480F" stroke-width="2"/>
<text x="374" y="76" font-size="13" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">The AI summary</text>
<circle cx="380" cy="104" r="10" fill="#2b8a3e"/>
<text x="380" y="109" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">ok</text>
<text x="398" y="108" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The office closes at 1 pm on Thursday.</text>
<circle cx="380" cy="162" r="10" fill="#2b8a3e"/>
<text x="380" y="167" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">ok</text>
<text x="398" y="166" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Staff save their work and turn off</text>
<text x="398" y="182.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">computers.</text>
<circle cx="380" cy="220" r="10" fill="#c92a2a"/>
<text x="380" y="225" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">!</text>
<text x="398" y="224" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">Shop staff pick up the list at 3 pm.</text>
<text x="374" y="274" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Point 3: the memo says 5 pm.</text>
</svg>
