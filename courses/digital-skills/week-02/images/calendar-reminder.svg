<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="900" height="320" fill="#ffffff"/>
<rect x="10" y="10" width="880" height="300" rx="18" fill="#fff9f2" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="450.0" y="42" font-size="17" fill="#7a2a06" text-anchor="middle" font-weight="800">A reminder in the calendar of your phone</text>
<rect x="60" y="56" width="200" height="250" rx="22" fill="#343a40"/><rect x="68" y="72" width="184" height="218" rx="10" fill="#fff"/>
<text x="160" y="96" font-size="14" fill="#0b7285" text-anchor="middle" font-weight="800">New event</text>
<rect x="76" y="106" width="168" height="32" rx="6" fill="#f1f3f5" stroke="#dee2e6"/>
<text x="84" y="120" font-size="10.5" fill="#6b6259" text-anchor="start" font-weight="700">Title</text><text x="84" y="133" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800">Study group, room 105</text>
<rect x="76" y="146" width="168" height="32" rx="6" fill="#f1f3f5" stroke="#dee2e6"/>
<text x="84" y="160" font-size="10.5" fill="#6b6259" text-anchor="start" font-weight="700">Date</text><text x="84" y="173" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800">Sun 22 Nov 2026</text>
<rect x="76" y="186" width="168" height="32" rx="6" fill="#f1f3f5" stroke="#dee2e6"/>
<text x="84" y="200" font-size="10.5" fill="#6b6259" text-anchor="start" font-weight="700">Time</text><text x="84" y="213" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800">14:00 – 15:00</text>
<rect x="76" y="226" width="168" height="32" rx="6" fill="#e3fafc" stroke="#0b7285"/>
<text x="84" y="240" font-size="10.5" fill="#6b6259" text-anchor="start" font-weight="700">Reminder</text><text x="84" y="253" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800">1 hour before</text>
<rect x="196" y="278" width="48" height="20" rx="10" fill="#0b7285"/><text x="220" y="292" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="800">Save</text>
<circle cx="310" cy="91" r="12" fill="#0b7285"/><text x="310" y="96" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">1</text><text x="330" y="96" font-size="14.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Open the calendar app: Google Calendar, Outlook or Calendar.</text>
<circle cx="310" cy="133" r="12" fill="#0b7285"/><text x="310" y="138" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">2</text><text x="330" y="138" font-size="14.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Tap + (New event), and type a short title.</text>
<circle cx="310" cy="175" r="12" fill="#0b7285"/><text x="310" y="180" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">3</text><text x="330" y="180" font-size="14.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Choose the date and the time.</text>
<circle cx="310" cy="217" r="12" fill="#0b7285"/><text x="310" y="222" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">4</text><text x="330" y="222" font-size="14.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Add a reminder (Notification, Alert): 1 hour before.</text>
<circle cx="310" cy="259" r="12" fill="#0b7285"/><text x="310" y="264" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">5</text><text x="330" y="264" font-size="14.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Tap Save (or Add). Your phone reminds you.</text>
</svg>
