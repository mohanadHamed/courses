<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="340" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Emulator or real device?</text>
<rect x="20" y="50" width="640" height="36" rx="0" fill="#A86700"/>
<text x="30" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve"></text>
<text x="337.5" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">emulator / simulator</text>
<text x="552.5" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">real device</text>
<text x="30" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">cost</text>
<rect x="230" y="86" width="215" height="36" rx="0" fill="#d3f9d8"/>
<text x="337.5" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">free, on the computer</text>
<text x="552.5" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">must be bought</text>
<rect x="20" y="122" width="640" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">many OS versions</text>
<rect x="230" y="122" width="215" height="36" rx="0" fill="#d3f9d8"/>
<text x="337.5" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">minutes per version</text>
<text x="552.5" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">one version per phone</text>
<text x="30" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">screen sizes</text>
<rect x="230" y="158" width="215" height="36" rx="0" fill="#d3f9d8"/>
<text x="337.5" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">any size</text>
<text x="552.5" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">only its own</text>
<rect x="20" y="194" width="640" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">speed, heat, battery</text>
<text x="337.5" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">not realistic</text>
<rect x="445" y="194" width="215" height="36" rx="0" fill="#d3f9d8"/>
<text x="552.5" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">real</text>
<text x="30" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">camera, sensors, touch</text>
<text x="337.5" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">imitated or missing</text>
<rect x="445" y="230" width="215" height="36" rx="0" fill="#d3f9d8"/>
<text x="552.5" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">real</text>
<rect x="20" y="266" width="640" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="288.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">final check before release</text>
<text x="337.5" y="288.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">not enough</text>
<rect x="445" y="266" width="215" height="36" rx="0" fill="#d3f9d8"/>
<text x="552.5" y="288.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">needed</text>
<rect x="20" y="50" width="640" height="252" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="326" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Use both: emulators for breadth (many versions and sizes), real devices for truth (performance and feel).</text>
</svg>
