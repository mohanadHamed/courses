<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="360" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The operating system works between the apps and the hardware</text>
<rect x="60" y="52" width="160" height="52" rx="12" fill="#ffffff" stroke="#A86700" stroke-width="1.8"/>
<text x="140" y="84" font-size="15" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">Game</text>
<rect x="260" y="52" width="160" height="52" rx="12" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="340" y="84" font-size="15" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">Music app</text>
<rect x="460" y="52" width="160" height="52" rx="12" fill="#ffffff" stroke="#0c8599" stroke-width="1.8"/>
<text x="540" y="84" font-size="15" fill="#0c8599" text-anchor="middle" font-weight="800" xml:space="preserve">Chat app</text>
<rect x="40" y="130" width="600" height="110" rx="14" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<text x="340" y="154" font-size="15" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">Operating system: its services</text>
<rect x="54" y="170" width="104" height="50" rx="10" fill="#ffffff" stroke="#FFD43B" stroke-width="2"/>
<text x="106" y="200" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">processes</text>
<rect x="172" y="170" width="104" height="50" rx="10" fill="#ffffff" stroke="#FFD43B" stroke-width="2"/>
<text x="224" y="200" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">memory</text>
<rect x="290" y="170" width="104" height="50" rx="10" fill="#ffffff" stroke="#FFD43B" stroke-width="2"/>
<text x="342" y="200" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">files</text>
<rect x="408" y="170" width="104" height="50" rx="10" fill="#ffffff" stroke="#FFD43B" stroke-width="2"/>
<text x="460" y="200" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">devices</text>
<rect x="526" y="170" width="104" height="50" rx="10" fill="#ffffff" stroke="#FFD43B" stroke-width="2"/>
<text x="578" y="200" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">permissions</text>
<rect x="20" y="268" width="100" height="44" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6"/>
<text x="70" y="295" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">CPU</text>
<rect x="140" y="268" width="100" height="44" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6"/>
<text x="190" y="295" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">RAM</text>
<rect x="260" y="268" width="100" height="44" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6"/>
<text x="310" y="295" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Storage</text>
<rect x="390" y="268" width="100" height="44" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6"/>
<text x="440" y="295" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Screen, touch</text>
<rect x="520" y="268" width="100" height="44" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6"/>
<text x="570" y="295" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Camera, mic</text>
<line x1="140" y1="106" x2="140" y2="119.7" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="140,128 135.4,118.8 144.6,118.8" fill="#6b726e"/>
<line x1="340" y1="106" x2="340" y2="119.7" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="340,128 335.4,118.8 344.6,118.8" fill="#6b726e"/>
<line x1="540" y1="106" x2="540" y2="119.7" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="540,128 535.4,118.8 544.6,118.8" fill="#6b726e"/>
<line x1="70" y1="242" x2="70" y2="257.7" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="70,266 65.4,256.8 74.6,256.8" fill="#6b726e"/>
<line x1="190" y1="242" x2="190" y2="257.7" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="190,266 185.4,256.8 194.6,256.8" fill="#6b726e"/>
<line x1="310" y1="242" x2="310" y2="257.7" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="310,266 305.4,256.8 314.6,256.8" fill="#6b726e"/>
<line x1="440" y1="242" x2="440" y2="257.7" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="440,266 435.4,256.8 444.6,256.8" fill="#6b726e"/>
<line x1="570" y1="242" x2="570" y2="257.7" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="570,266 565.4,256.8 574.6,256.8" fill="#6b726e"/>
<text x="340" y="340" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">An app never talks to the hardware alone: it asks the operating system.</text>
</svg>
