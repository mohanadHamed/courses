<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Harbor Guard</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .hud { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 0 0 8px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .sim .hud .order { font-size: 1.15rem; }
    .sim .hud .order b { color: #e8590c; }
    .sim .hud .score { margin-left: auto; }
    .sim .timer { height: 6px; border-radius: 4px; background: #eef1ee; overflow: hidden; margin-bottom: 8px; }
    .sim .timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--sim-accent), var(--sim-accent2)); }
    .sim .message.bad { color: #c92a2a; }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Harbor Guard</h1>
  <p class="hint">The radar reports where a ship is. Tap that point of the harbour to build a tower and stop the ship. The origin (0, 0) is in the centre; y grows upward.</p>
  <div class="hud">
    <span id="round">Round 0/10</span>
    <span class="order" id="order">Press Start</span>
    <span class="score" id="score">Score 0</span>
  </div>
  <div class="timer"><i id="bar"></i></div>
  <canvas id="c" aria-label="The harbour of Harbor Guard on a coordinate grid"></canvas>
  <div class="controls">
    <button id="start" type="button">Start</button>
    <button id="sound" type="button" class="ghost">Sound: on</button>
  </div>
  <p id="msg" class="message">10 ships. Some orders give a point, some give only a quadrant.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const X0 = -6, X1 = 6, Y0 = -6, Y1 = 8;            // the harbour: x −6..6, y −6..8
  const COLS = X1 - X0, ROWS = Y1 - Y0, ROUNDS = 10, TIME = 10;
  const LAND = { dock: [0, -6], lighthouse: [-4, 5], gate: [3, 2] };
  const fmt = (n) => (n < 0 ? "−" + -n : String(n));
  const pair = (p) => `(${fmt(p[0])}, ${fmt(p[1])})`;
  const quadrantOf = (x, y) => (x > 0 && y > 0 ? 1 : x < 0 && y > 0 ? 2 : x < 0 && y < 0 ? 3 : x > 0 && y < 0 ? 4 : 0);
  const ROMAN = ["", "I", "II", "III", "IV"];

  let W = 0, H = 0, cell = 30, left = 0, top = 18;
  let game = null, fx = [], towers = [], sound = true, audio = null;
  let best = 0;
  try { best = Number(localStorage.getItem("harbor-guard-best")) || 0; } catch (_) {}

  function resize() {
    W = canvas.clientWidth;
    cell = Math.min((W - 52) / COLS, 34);
    left = (W - cell * COLS) / 2; top = 18;
    H = Math.round(cell * ROWS + top * 2 + 8);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const px = (x) => left + (x - X0) * cell;
  const py = (y) => top + (Y1 - y) * cell;

  function beep(freq, dur, type = "triangle") {
    if (!sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = 0.08;
      o.connect(g); g.connect(audio.destination);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (_) {}
  }

  function drawShip(x, y, alpha = 1) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#5c3d2e"; ctx.beginPath();
    ctx.moveTo(x - 13, y); ctx.lineTo(x + 13, y); ctx.lineTo(x + 8, y + 8); ctx.lineTo(x - 8, y + 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(x - 1, y - 2); ctx.lineTo(x - 1, y - 18); ctx.lineTo(x + 10, y - 4); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function drawTower(x, y, ok) {
    ctx.fillStyle = ok ? "#2F9E44" : "#c92a2a";
    ctx.fillRect(x - 6, y - 16, 12, 16);
    ctx.fillRect(x - 8, y - 20, 16, 5);
    ctx.fillStyle = "#fff"; ctx.fillRect(x - 2, y - 12, 4, 5);
  }

  function draw(now) {
    // water
    ctx.fillStyle = "#e7f5ff"; ctx.fillRect(0, 0, W, H);
    // grid
    ctx.lineWidth = 1; ctx.strokeStyle = "#cfe5f5";
    for (let x = X0; x <= X1; x++) { ctx.beginPath(); ctx.moveTo(px(x), py(Y1)); ctx.lineTo(px(x), py(Y0)); ctx.stroke(); }
    for (let y = Y0; y <= Y1; y++) { ctx.beginPath(); ctx.moveTo(px(X0), py(y)); ctx.lineTo(px(X1), py(y)); ctx.stroke(); }
    // quadrant labels
    ctx.font = "800 22px Nunito, system-ui, sans-serif"; ctx.fillStyle = "rgba(47,158,68,0.18)"; ctx.textAlign = "center";
    ctx.fillText("I", px(4.5), py(7)); ctx.fillText("II", px(-4.5), py(7)); ctx.fillText("III", px(-4.5), py(-4.5)); ctx.fillText("IV", px(4.5), py(-4.5));
    // axes
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#c0392b"; ctx.beginPath(); ctx.moveTo(px(X0), py(0)); ctx.lineTo(px(X1), py(0)); ctx.stroke();
    ctx.strokeStyle = "#27ae60"; ctx.beginPath(); ctx.moveTo(px(0), py(Y0)); ctx.lineTo(px(0), py(Y1)); ctx.stroke();
    ctx.font = "600 10px Nunito, system-ui, sans-serif"; ctx.fillStyle = "#5b6b78";
    for (let x = X0; x <= X1; x++) if (x) { ctx.textAlign = "center"; ctx.fillText(fmt(x), px(x), py(0) + 12); }
    for (let y = Y0; y <= Y1; y++) if (y) { ctx.textAlign = "right"; ctx.fillText(fmt(y), px(0) - 4, py(y) + 3); }
    ctx.font = "800 12px Nunito, system-ui, sans-serif"; ctx.fillStyle = "#c0392b"; ctx.textAlign = "left"; ctx.fillText("x", px(X1) - 10, py(0) - 5);
    ctx.fillStyle = "#27ae60"; ctx.fillText("y", px(0) + 5, py(Y1) + 10);
    // landmarks
    const [dx, dy] = LAND.dock; ctx.fillStyle = "#a47148"; ctx.fillRect(px(dx) - cell * 1.5, py(dy) - 5, cell * 3, 10);
    ctx.fillStyle = "#5b6b78"; ctx.font = "700 10px Nunito, system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText("dock", px(dx), py(dy) - 8);
    const [lx, ly] = LAND.lighthouse; ctx.fillStyle = "#fff"; ctx.strokeStyle = "#c92a2a"; ctx.lineWidth = 2;
    ctx.fillRect(px(lx) - 4, py(ly) - 16, 8, 16); ctx.strokeRect(px(lx) - 4, py(ly) - 16, 8, 16);
    ctx.fillStyle = "#ffd43b"; ctx.beginPath(); ctx.arc(px(lx), py(ly) - 18, 4, 0, 7); ctx.fill();
    ctx.fillStyle = "#5b6b78"; ctx.fillText("lighthouse", px(lx), py(ly) + 11);
    const [gx, gy] = LAND.gate; ctx.strokeStyle = "#5c3d2e"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(px(gx) - 8, py(gy) + 4); ctx.lineTo(px(gx) - 8, py(gy) - 10); ctx.moveTo(px(gx) + 8, py(gy) + 4); ctx.lineTo(px(gx) + 8, py(gy) - 10); ctx.stroke();
    ctx.fillStyle = "#5b6b78"; ctx.fillText("gate", px(gx), py(gy) + 14);
    // towers built
    for (const t of towers) drawTower(px(t[0]), py(t[1]), true);
    // the ship moving towards the dock (only its last known position is shown after the round)
    if (game && game.ship) {
      const s = game.ship;
      drawShip(px(s.x), py(s.y), s.visible ? 1 : 0.0);
    }
    // effects
    fx = fx.filter((f) => now - f.t < f.life);
    for (const f of fx) {
      const k = (now - f.t) / f.life;
      if (f.kind === "splash") {
        ctx.strokeStyle = `rgba(47,158,68,${1 - k})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(f.x, f.y, 6 + 28 * k, 0, 7); ctx.stroke();
      } else if (f.kind === "miss") {
        ctx.strokeStyle = `rgba(201,42,42,${1 - k * 0.6})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(f.x - 7, f.y - 7); ctx.lineTo(f.x + 7, f.y + 7); ctx.moveTo(f.x + 7, f.y - 7); ctx.lineTo(f.x - 7, f.y + 7); ctx.stroke();
      } else if (f.kind === "show") {
        ctx.strokeStyle = `rgba(232,89,12,${1 - k * 0.5})`; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.arc(f.x, f.y, 12, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }

  function randomPoint() {
    let x, y;
    do { x = X0 + 1 + Math.floor(Math.random() * (COLS - 1)); y = Y0 + 2 + Math.floor(Math.random() * (ROWS - 2)); }
    while (x === 0 || y === 0 || towers.some((t) => t[0] === x && t[1] === y));
    return [x, y];
  }
  function makeOrders() {
    // The first orders use the numbers of the story; then points and quadrants mixed.
    const list = [{ type: "point", p: [-4, 5], note: "next to the lighthouse" }, { type: "point", p: [3, 2], note: "at the gate" }];
    const quads = [3, 4, 2].sort(() => Math.random() - 0.5);
    for (let i = 2; i < ROUNDS; i++) {
      if (i === 4 || i === 7 || i === 9) list.push({ type: "quadrant", q: quads.pop() || 1 });
      else list.push({ type: "point", p: randomPoint() });
    }
    return list;
  }

  function nextRound() {
    if (game.round >= ROUNDS) {
      game.done = true; game.ship = null;
      if (game.score > best) { best = game.score; try { localStorage.setItem("harbor-guard-best", String(best)); } catch (_) {} }
      $("order").textContent = "The harbour is safe!";
      $("msg").textContent = `Game over: ${game.hits} of ${ROUNDS} ships stopped, score ${game.score}. Best: ${best}.`;
      $("msg").className = "message good"; $("start").textContent = "Play again";
      return;
    }
    const o = game.orders[game.round++];
    game.order = o; game.t0 = performance.now(); game.locked = false;
    if (o.type === "point") {
      game.ship = { x: o.p[0], y: o.p[1], visible: false };
      $("order").innerHTML = `Ship at <b>${pair(o.p)}</b>` + (o.note ? ` · ${o.note}` : "");
    } else {
      const p = randomPoint(); let q = quadrantOf(...p), tries = 0, pp = p;
      while (q !== o.q && tries++ < 200) { pp = randomPoint(); q = quadrantOf(...pp); }
      game.ship = { x: pp[0], y: pp[1], visible: false };
      $("order").innerHTML = `Ship somewhere in <b>quadrant ${ROMAN[o.q]}</b> · build any tower there`;
    }
    $("round").textContent = `Round ${game.round}/${ROUNDS}`;
  }

  function resolve(tap) {
    if (!game || game.done || game.locked) return;
    game.locked = true;
    const o = game.order, now = performance.now();
    let ok = false;
    if (tap) {
      ok = o.type === "point" ? tap[0] === o.p[0] && tap[1] === o.p[1] : quadrantOf(...tap) === o.q;
    }
    game.ship.visible = true;
    if (ok) {
      const leftT = Math.max(0, 1 - (now - game.t0) / (TIME * 1000));
      const pts = 5 + Math.round(5 * leftT);
      game.score += pts; game.hits++;
      towers.push(tap);
      fx.push({ kind: "splash", x: px(tap[0]), y: py(tap[1]), t: now, life: 700 });
      $("msg").textContent = `✓ Tower at ${pair(tap)}. Ship stopped! +${pts}`;
      $("msg").className = "message good";
      beep(660, 0.12); setTimeout(() => beep(990, 0.12), 90);
    } else {
      if (tap) fx.push({ kind: "miss", x: px(tap[0]), y: py(tap[1]), t: now, life: 1300 });
      fx.push({ kind: "show", x: px(game.ship.x), y: py(game.ship.y), t: now, life: 1300 });
      const why = !tap ? "Too late." :
        o.type === "point" ? `You built at ${pair(tap)}, but the ship is at ${pair(o.p)}.` :
        `${pair(tap)} is ${quadrantOf(...tap) ? "in quadrant " + ROMAN[quadrantOf(...tap)] : "on an axis"}, not in quadrant ${ROMAN[o.q]}.`;
      $("msg").textContent = "✗ " + why; $("msg").className = "message bad";
      beep(180, 0.25, "sawtooth");
    }
    $("score").textContent = `Score ${game.score}`;
    game.pending = setTimeout(() => { game.ship = null; nextRound(); }, ok ? 700 : 1600);
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (!game || game.done || game.locked) return;
    const r = canvas.getBoundingClientRect();
    const x = Math.round((e.clientX - r.left - left) / cell) + X0;
    const y = Y1 - Math.round((e.clientY - r.top - top) / cell);
    if (x < X0 || x > X1 || y < Y0 || y > Y1) return;
    resolve([x, y]);
  });
  $("start").addEventListener("click", () => {
    if (game && game.pending) clearTimeout(game.pending);
    towers = [];
    game = { round: 0, score: 0, hits: 0, orders: makeOrders(), done: false, locked: false, ship: null };
    $("start").textContent = "Restart"; $("score").textContent = "Score 0";
    $("msg").textContent = "Read the order, then tap the point."; $("msg").className = "message";
    nextRound();
  });
  $("sound").addEventListener("click", () => { sound = !sound; $("sound").textContent = "Sound: " + (sound ? "on" : "off"); });

  function loop(now) {
    requestAnimationFrame(loop);
    if (game && !game.done && !game.locked && game.order) {
      const k = (now - game.t0) / (TIME * 1000);
      $("bar").style.width = Math.max(0, 100 * (1 - k)) + "%";
      if (k >= 1) resolve(null);
    }
    try { draw(now); } catch (e) { console.error(e); }
  }
  window.addEventListener("resize", resize);
  resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
