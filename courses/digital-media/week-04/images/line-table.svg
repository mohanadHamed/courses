<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800">The barks of Rooftop Rescue</text>
<rect x="20" y="48" width="640" height="34" fill="#9C36B5"/>
<text x="30" y="70" font-size="13" fill="#ffffff" font-weight="800">character</text>
<text x="130" y="70" font-size="13" fill="#ffffff" font-weight="800">line</text>
<text x="420" y="70" font-size="13" fill="#ffffff" font-weight="800">trigger (when it plays)</text>
<text x="30" y="105" font-size="13" fill="#2a2f2c" font-weight="800">Nour</text>
<text x="130" y="105" font-size="13" fill="#2a2f2c" font-weight="600">Hold on, everyone. I&#8217;m coming.</text>
<text x="420" y="105" font-size="13" fill="#2a2f2c" font-weight="600">the scene starts</text>
<rect x="20" y="118" width="640" height="36" fill="#fbf3fd"/>
<text x="30" y="141" font-size="13" fill="#2a2f2c" font-weight="800">Nour</text>
<text x="130" y="141" font-size="13" fill="#2a2f2c" font-weight="600">Car ahead! Around it.</text>
<text x="420" y="141" font-size="13" fill="#2a2f2c" font-weight="600">a floating car is in view</text>
<text x="30" y="177" font-size="13" fill="#2a2f2c" font-weight="800">Family</text>
<text x="130" y="177" font-size="13" fill="#2a2f2c" font-weight="600">Over here! Please!</text>
<text x="420" y="177" font-size="13" fill="#2a2f2c" font-weight="600">the rooftop is in view</text>
<rect x="20" y="190" width="640" height="36" fill="#fbf3fd"/>
<text x="30" y="213" font-size="13" fill="#2a2f2c" font-weight="800">Nour</text>
<text x="130" y="213" font-size="13" fill="#2a2f2c" font-weight="600">I see you! Stay there.</text>
<text x="420" y="213" font-size="13" fill="#2a2f2c" font-weight="600">after the family calls</text>
<text x="30" y="249" font-size="13" fill="#2a2f2c" font-weight="800">Nour</text>
<text x="130" y="249" font-size="13" fill="#2a2f2c" font-weight="600">Faster. The water&#8217;s still rising.</text>
<text x="420" y="249" font-size="13" fill="#2a2f2c" font-weight="600">the water rises</text>
<rect x="20" y="262" width="640" height="36" fill="#fbf3fd"/>
<text x="30" y="285" font-size="13" fill="#2a2f2c" font-weight="800">Salma</text>
<text x="130" y="285" font-size="13" fill="#2a2f2c" font-weight="600">I won&#8217;t leave without my cat.</text>
<text x="420" y="285" font-size="13" fill="#2a2f2c" font-weight="600">the boat reaches the roof</text>
<rect x="20" y="48" width="640" height="250" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="340" y="326" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700">Each bark is short and has a trigger: the event in the game that plays it.</text>
</svg>
