<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="500" fill="#ffffff"/>
<text x="16" y="30" font-size="19" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Sky Lift</text>
<text x="16" y="52" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">y = 2 + 3 × sin(360° × t ÷ 4). When is the lift level with the cliff?</text>
<rect x="16" y="66" width="608" height="320" rx="12" fill="#e7f5ff" stroke="#d0ebff" stroke-width="1.5"/>
<rect x="380" y="119" width="234" height="261" rx="0" fill="#8d6e63" stroke="none" stroke-width="1.5"/>
<rect x="380" y="119" width="234" height="10" rx="0" fill="#66bb6a" stroke="none" stroke-width="1.5"/>
<text x="500" y="109" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">cliff at height 5</text>
<circle cx="420" cy="103" r="9" fill="#e8590c" stroke="none" stroke-width="1.5"/>
<rect x="412" y="111" width="16" height="10" rx="4" fill="#e8590c" stroke="none" stroke-width="1.5"/>
<line x1="40" y1="323" x2="60" y2="323" stroke="#6b726e" stroke-width="1.5" stroke-linecap="round"/>
<text x="36" y="327" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">−1</text>
<line x1="40" y1="289" x2="60" y2="289" stroke="#6b726e" stroke-width="1.5" stroke-linecap="round"/>
<text x="36" y="293" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">0</text>
<line x1="40" y1="255" x2="60" y2="255" stroke="#6b726e" stroke-width="1.5" stroke-linecap="round"/>
<text x="36" y="259" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">1</text>
<line x1="40" y1="221" x2="60" y2="221" stroke="#6b726e" stroke-width="1.5" stroke-linecap="round"/>
<text x="36" y="225" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">2</text>
<line x1="40" y1="187" x2="60" y2="187" stroke="#6b726e" stroke-width="1.5" stroke-linecap="round"/>
<text x="36" y="191" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">3</text>
<line x1="40" y1="153" x2="60" y2="153" stroke="#6b726e" stroke-width="1.5" stroke-linecap="round"/>
<text x="36" y="157" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">4</text>
<line x1="40" y1="119" x2="60" y2="119" stroke="#6b726e" stroke-width="1.5" stroke-linecap="round"/>
<text x="36" y="123" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">5</text>
<line x1="60" y1="323" x2="60" y2="119" stroke="#6b726e" stroke-width="1" stroke-linecap="round"/>
<rect x="220" y="215" width="120" height="14" rx="6" fill="#2F9E44" stroke="none" stroke-width="1.5"/>
<line x1="280" y1="115" x2="280" y2="327" stroke="#2F9E44" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/>
<text x="280" y="247" font-size="12.5" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">lift (t = 0 s): y = 2</text>
<rect x="16" y="400" width="100" height="36" rx="9" fill="#fff" stroke="#2F9E44" stroke-width="1.5"/>
<text x="66" y="423" font-size="13" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">Jump at 0 s</text>
<rect x="126" y="400" width="100" height="36" rx="9" fill="#fff" stroke="#2F9E44" stroke-width="1.5"/>
<text x="176" y="423" font-size="13" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">Jump at 1 s</text>
<rect x="236" y="400" width="100" height="36" rx="9" fill="#fff" stroke="#2F9E44" stroke-width="1.5"/>
<text x="286" y="423" font-size="13" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">Jump at 2 s</text>
<rect x="346" y="400" width="100" height="36" rx="9" fill="#fff" stroke="#2F9E44" stroke-width="1.5"/>
<text x="396" y="423" font-size="13" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">Jump at 3 s</text>
<text x="16" y="470" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Round 1 / 5 · middle 2, amplitude 3, period 4 s</text>
