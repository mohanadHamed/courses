<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Fair or Frustrating?</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #ebfbee; border: 1.5px solid #2F9E44; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Fair or Frustrating?</h1>
  <p class="hint">Players of <i>Torch Hall</i> send messages about luck. Use probability and the tools of today to answer each one.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "\"My hit chance is 70 % and I missed 3 times in a row. The game cheats!\"", goal: "P(3 misses in a row)?", answer: "2.7 %", choices: C(["2.7 %", "0 %", "30 %", "21 %"]), good: "0.3³ = 0.027. Rare in one try, but in 100 attacks a run of 3 misses is very likely.", why: { "21 %": "That is 0.7 × 0.3: one hit and one miss." } },
    { card: "\"I flipped tails 4 times. Heads must come now!\"", goal: "P(heads on the next flip)?", answer: "50 %", choices: C(["50 %", "97 %", "6.25 %", "80 %"]), good: "The coin has no memory: the gambler's fallacy.", why: { "6.25 %": "That is the chance of a whole run, not of the next flip." } },
    { card: "\"With 90 % I should never miss!\" The player attacks 10 times in a fight.", goal: "P(at least one miss in 10 attacks)?", answer: "about 65 %", choices: C(["about 65 %", "10 %", "1 %", "90 %"]), good: "1 − 0.9¹⁰ ≈ 1 − 0.35 = 0.65." },
    { card: "Crits are 25 %, but some players wait 20 attacks for one and quit.", goal: "Which tool keeps 25 % and ends the long droughts?", answer: "a shuffle bag", choices: C(["a shuffle bag", "lower crits to 10 %", "remove crits", "double the crit damage"]), good: "One crit in every bag of 4: exactly 25 %, never more than 6 attacks without one." },
    { card: "The team uses PRD with C = 0.085 for the crits.", goal: "At which attack after a crit is the next crit sure?", answer: "the 12th", choices: C(["the 12th", "the 4th", "the 25th", "never"]), good: "0.085 × 12 = 1.02, so attack 12 is a sure crit: at most 11 attacks without one.", why: { "the 4th": "4 attacks is the average wait, not the longest." } },
    { card: "A store page shows \"5 % for a golden torch\", but the code uses 1 %.", goal: "What is this?", answer: "dishonest: show the true odds", choices: C(["dishonest: show the true odds", "fine: players cannot see the code", "a shuffle bag", "input randomness"]), good: "Shown odds must be the true odds, above all for paid items." },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 1, animMs: 600, intro: "Round 1 is the story of the lesson: three misses in a row." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "All messages are answered." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
