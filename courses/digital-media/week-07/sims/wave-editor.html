<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Wave Editor</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
    @media (max-width: 520px) { .sim .tools { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .sim .tasks { margin: 8px 0 0; padding-left: 1.2em; line-height: 1.5; }
    .sim .tasks li.ok { color: #2b8a3e; font-weight: 700; }
    .sim .out { font-weight: 700; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Wave Editor: clean up Pasha's meow</h1>
  <p class="hint">Yara recorded Pasha the cat for <i>Rooftop Rescue</i>. The take has a long silence at the start, a hum, and a click at the end, and it is too quiet. Use the tools as in Audacity, in a good order. Tap <b>Play</b> to hear the take.</p>
  <canvas id="c" aria-label="The waveform of the recording"></canvas>
  <p class="out" id="out"></p>
  <div class="tools" id="tools"></div>
  <ol class="tasks" id="tasks"></ol>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script src="take.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const P0 = { lead: 0.9, hum: 0.06, gain: 0.25, click: true };
  let p, done;
  const TASKS = [
    ["Cut the silence at the start (leave a short gap).", () => p.lead <= 0.1],
    ["Remove the hum with Noise Reduction.", () => !p.hum],
    ["Fade out the end, so that the click is gone.", () => !p.click],
    ["Normalize the loudest peak to −1 dB, after the other steps.", () => done.norm && !p.hum && !p.click],
  ];
  const TOOLS = [
    ["play", "▶ Play"], ["trim", "Trim the start"], ["noise", "Noise Reduction"], ["fade", "Fade out the end"],
    ["norm", "Normalize to −1 dB"], ["amp", "Amplify +20 dB"], ["undo", "Start again"],
  ];
  function reset() { p = { ...P0 }; done = {}; render("The raw take: 2.4 seconds. Which step first?"); }
  function act(k) {
    if (k === "play") { TK.play(TK.make(p)); return; }
    if (k === "undo") { reset(); return; }
    if (k === "trim") { p.lead = 0.08; Kit.good(); render("Trimmed: the meow now starts at once. A short gap stays, so that it does not start with a click."); }
    if (k === "noise") { p.hum = 0; Kit.good(); render("Noise Reduction: Yara took the noise profile from the silent part, then removed the hum from the whole take."); }
    if (k === "fade") { p.click = false; Kit.good(); render("Faded out: the last 0.2 s goes smoothly to silence, so the click is gone."); }
    if (k === "norm") { p.gain = 0.89 - (p.hum || 0); done.norm = true; Kit.good();
      render(p.hum || p.click ? "Normalized, but the hum or the click got louder too. Clean first, then normalize: try again with Start again." : "Normalized: the loudest peak is now at −1 dB. The take is ready to export."); }
    if (k === "amp") { p.gain = Math.min(1, p.gain * 10); Kit.bad(); p.clipped = true;
      render("+20 dB is 10 times louder: the peaks hit the top (0 dB) and are cut flat. That is clipping. Start again and use Normalize instead.", true); }
  }
  function render(t, bad) {
    const d = TK.make({ ...p, clip: p.clipped && p.gain >= 1 }), pk = TK.peak(d);
    $("out").textContent = `Length ${Kit.fmt(d.length / TK.RATE, 1)} s · loudest peak ${Kit.fmt(20 * Math.log10(pk), 1)} dB`;
    $("tasks").innerHTML = TASKS.map(([q, ok]) => `<li class="${ok() ? "ok" : ""}">${q}</li>`).join("");
    $("msg").textContent = t; $("msg").classList.toggle("bad", !!bad);
    window.__take = d;
  }
  Kit.buttons($("tools"), TOOLS.map(([k, label]) => ({ k, label })), act);
  window.WE = { do: act };
  const cv = Kit.canvas($("c"), (W) => Math.min(200, W * 0.4));
  let last = null;
  Kit.loop(() => { if (last === window.__take && cv.W === last?.w) return; last = window.__take; if (!last) return; TK.draw(cv.ctx, 0, 0, cv.W, cv.H, last); last.w = cv.W; });
  reset();
})();
</script>
</body>
</html>
