<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: AI Deck Check</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>AI Deck Check</h1>
  <p class="hint">Huda made the talk “Going paperless” with AI help. Before the Monday meeting, check each slide and each prompt, and choose the best action.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script src="../../week-09/sims/slide-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { s: { title: "The problem", body: ["We print 9,000 pages a month", "Lost papers, full cupboards"] }, fix: { body: ["We print 6,500 pages a month", "Lost papers, full cupboards"] },
      goal: "The AI wrote 9,000 pages. Huda's notes say 6,500. What do you do?", answer: "correct it from the real data", choices: C(["correct it from the real data", "keep it: the AI knows best", "delete the slide", "round it to 10,000"]),
      good: "Numbers come from your data, not from the AI. Check every number." },
    { s: { title: "The plan", body: ["Shared folders for every team", "E-forms instead of paper", "Source: Green Office Report 2021"] }, fix: { body: ["Shared folders for every team", "E-forms instead of paper"] },
      goal: "Nobody can find the “Green Office Report 2021”. What do you do?", answer: "delete it: a made-up source", choices: C(["delete it: a made-up source", "keep it: it sounds serious", "change the year", "make the font smaller"]),
      good: "AI tools sometimes invent sources. Open every source; if it does not exist, it goes." },
    { s: { title: "The plan", body: ["Shared folders for every team", "E-forms instead of paper"], pic: true, picText: true }, fix: { picText: false },
      goal: "The AI picture shows a sign with “SUNRSIE CMOPANY”. Fix?", answer: "a picture without text; type the name in PowerPoint", choices: C(["a picture without text; type the name in PowerPoint", "keep it, nobody reads signs", "make the picture bigger", "add a second AI picture"]),
      good: "AI pictures often get letters wrong. Ask for no text, and write text on the slide yourself." },
    { prompt: "Make 5 slides about going paperless. Staff: Rana 079-555-0142, Sami 079-555-0187 …", s: { title: "Going paperless", body: ["Huda, Office Manager"], layout: "Title Slide" }, fix: {},
      goal: "Huda's first prompt has names and phone numbers of the staff. What is wrong?", answer: "personal data does not go into a prompt", choices: C(["personal data does not go into a prompt", "the prompt is too short", "nothing, it helps the AI", "the numbers need +962"]),
      good: "Leave out names, phone numbers and other personal data. The AI does not need them." },
    { s: { title: "Our goal", body: ["Half the paper in three months, which helps the environment", "Shared folders will make every team faster and happier", "E-forms save time for the customers and for the office staff", "Printers will be used only for contracts and some letters", "We will measure the pages every month and report back"] }, fix: { body: ["Half the paper in 3 months", "Measure pages every month", "Print only contracts"] },
      goal: "The AI slide “Our goal” has five long sentences. Fix?", answer: "keep 3–5 short points, say the rest", choices: C(["keep 3–5 short points, say the rest", "make the font smaller", "split it into 5 slides", "add more sentences"]),
      good: "AI slides are often too full. Short points on the slide, the details in your words." },
    { s: { title: "Questions?", body: ["Thank you!"], layout: "Title Slide" }, fix: { body: ["Thank you!", "Outline and pictures made with AI help"] },
      goal: "How does Huda tell the staff that AI helped?", answer: "a short note: outline and pictures made with AI help", choices: C(["a short note: outline and pictures made with AI help", "say nothing", "say that the AI made all of it", "write the name of every prompt"]),
      good: "Be honest and short: say what the AI did and that you checked it." },
  ];
  rounds.forEach((r) => { r.after = { ...r.s, ...r.fix }; });
  Kit.game({
    rounds, cols: 1, colsPhone: 1, animMs: 700, still: true,
    intro: "Round 1 is the story of the lesson: the number on the slide “The problem”.",
    canvas: (W) => Math.min(260, W * 9 / 16 * 0.75) + 10,
    draw(c, W, H, now, r, st) {
      c.fillStyle = "#f1f3f5"; c.fillRect(0, 0, W, H);
      if (!r) { Kit.text(c, "The talk is ready for Monday!", W / 2, H / 2, 18, "#D9480F"); return; }
      const s = st.done && st.ok ? r.after : r.s, h = H - 10, w = Math.min(W - 10, h * 16 / 9), x = (W - w) / 2;
      if (r.prompt && !(st.done && st.ok)) { Kit.rrect(c, x, 5, w, h, 8, "#1e1e2e"); Kit.wrap(c, r.prompt, x + 14, 34, w - 28, Math.max(12, w / 34), "#ffd43b", "left", 700); return; }
      SK.draw(c, x, 5, w, { theme: "Sunrise", layout: s.layout || "Title and Content", title: s.title, body: s.body, pic: s.pic, alt: "x" });
      if (s.pic && s.picText) { const px = x + w * 0.58, py = 5 + h * 0.3; c.fillStyle = "#fff"; c.fillRect(px, py, w * 0.34, h * 0.12); Kit.text(c, "SUNRSIE CMOPANY", px + w * 0.17, py + h * 0.09, Math.max(9, w / 34), "#c92a2a"); }
    },
  });
})();
</script>
</body>
</html>
