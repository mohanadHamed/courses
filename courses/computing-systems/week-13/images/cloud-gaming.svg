<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Cloud gaming: the game runs far away</text>
<rect x="20" y="66" width="120" height="70" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6"/>
<text x="80" y="92" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">player</text>
<text x="80" y="114" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">TV stick or phone</text>
<path d="M466.8 120.4 a22.4 22.4 0 0 1 5.6 -42 a30.8 30.8 0 0 1 50.4 -16.8 a25.2 25.2 0 0 1 42 19.6 a19.6 19.6 0 0 1 8.4 39.2 Z" fill="#fff4e6" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="520" y="96" font-size="12.5" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">server with GPU</text>
<text x="520" y="114" font-size="11" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">runs the game</text>
<line x1="146" y1="82" x2="431.1" y2="82" stroke="#1c7ed6" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="440,82 430.2,86.9 430.2,77.1" fill="#1c7ed6"/>
<text x="292" y="72" font-size="12" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">1 inputs (buttons, touch)</text>
<line x1="440" y1="122" x2="154.9" y2="122" stroke="#2b8a3e" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="146,122 155.8,117.1 155.8,126.9" fill="#2b8a3e"/>
<text x="292" y="144" font-size="12" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">2 video stream (like a film)</text>
<rect x="20" y="170" width="640" height="28" rx="0" fill="#f8f9fa"/>
<text x="30" y="188.1" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">needs (example values)</text>
<text x="250" y="188.1" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">720p: about 10 Mbps</text>
<text x="470" y="188.1" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">1080p: about 20 Mbps</text>
<text x="30" y="216.1" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">delay = ping + about 40 ms</text>
<text x="250" y="216.1" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">racing: total under 80 ms</text>
<text x="470" y="216.1" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">no download, weak device OK</text>
<rect x="20" y="170" width="640" height="56" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
