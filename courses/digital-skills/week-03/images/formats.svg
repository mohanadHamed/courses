<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="300" fill="#ffffff"/>
<text x="320.0" y="30.0" font-size="15" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Choose the format for the job</text>
<rect x="30.0" y="52.0" width="580.0" height="48.0" rx="10" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.8"/>
<rect x="30.0" y="52.0" width="170.0" height="48.0" rx="10" fill="#2b8a3e" stroke="none" stroke-width="1.5"/>
<rect x="190.0" y="52.0" width="10.0" height="48.0" rx="0" fill="#2b8a3e" stroke="none" stroke-width="1.5"/>
<text x="115.0" y="82.0" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">.docx  .xlsx  .pptx</text>
<text x="216.0" y="73.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">normal Office files</text>
<text x="216.0" y="91.0" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">you and others can change them</text>
<rect x="30.0" y="110.0" width="580.0" height="48.0" rx="10" fill="#ffffff" stroke="#1971c2" stroke-width="1.8"/>
<rect x="30.0" y="110.0" width="170.0" height="48.0" rx="10" fill="#1971c2" stroke="none" stroke-width="1.5"/>
<rect x="190.0" y="110.0" width="10.0" height="48.0" rx="0" fill="#1971c2" stroke="none" stroke-width="1.5"/>
<text x="115.0" y="140.0" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">.pdf</text>
<text x="216.0" y="131.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">PDF file</text>
<text x="216.0" y="149.0" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">people read and print it; the look stays the same</text>
<rect x="30.0" y="168.0" width="580.0" height="48.0" rx="10" fill="#ffffff" stroke="#D9480F" stroke-width="1.8"/>
<rect x="30.0" y="168.0" width="170.0" height="48.0" rx="10" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<rect x="190.0" y="168.0" width="10.0" height="48.0" rx="0" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="115.0" y="198.0" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">.dotx  .xltx  .potx</text>
<text x="216.0" y="189.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">templates</text>
<text x="216.0" y="207.0" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">a ready-made start for a new file</text>
<rect x="30.0" y="226.0" width="580.0" height="48.0" rx="10" fill="#ffffff" stroke="#6b726e" stroke-width="1.8"/>
<rect x="30.0" y="226.0" width="170.0" height="48.0" rx="10" fill="#6b726e" stroke="none" stroke-width="1.5"/>
<rect x="190.0" y="226.0" width="10.0" height="48.0" rx="0" fill="#6b726e" stroke="none" stroke-width="1.5"/>
