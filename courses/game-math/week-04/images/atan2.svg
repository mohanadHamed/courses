<text x="440" y="60" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Same slope, different angle</text>
<text x="440" y="90" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">A: y ÷ x = 4 ÷ 4 = 1</text>
<text x="440" y="114" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">C: y ÷ x = −4 ÷ −4 = 1</text>
<text x="440" y="138" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">tan gives 45° for both.</text>
<text x="440" y="162" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">atan2(y, x) looks at the</text>
