<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Presentation Day</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #fff4e6; border: 1.5px solid #D9480F; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Presentation Day</h1>
  <p class="hint">Today every student presents a course project in three minutes. In each round, something happens. Choose the best thing to do.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "Before the talk, the linked chart on slide 3 still shows the old numbers.", answer: "update the link and check the numbers", choices: C(["update the link and check the numbers", "present it anyway", "delete the chart", "say the numbers are wrong"]), good: "A linked chart follows Excel after Update Link." },
    { card: "Sami's slide 4 says: \"Everyone loves sandwiches.\"", answer: "change it to what the data shows", choices: C(["change it to what the data shows", "keep it: it sounds good", "add more slides", "make the text bigger"]), good: "\"Sandwiches earned the most: 138 JD.\" A claim needs data." },
    { card: "The talk is at 2:40, and two slides are left.", answer: "say the main insight and finish", choices: C(["say the main insight and finish", "speak very fast", "skip to the questions", "start again"]), good: "Three minutes: finish with the most important sentence." },
    { card: "A classmate asks a question, and you do not know the answer.", answer: "say so and say how you could find out", choices: C(["say so and say how you could find out", "invent an answer", "ignore the question", "ask an AI tool on the projector"]), good: "An honest answer is better than a made-up one." },
    { card: "You notice that you read every word from the slides.", answer: "look at the class and use the notes", choices: C(["look at the class and use the notes", "read faster", "put more text on the slides", "turn away from the class"]), good: "Few words on the slide; you say the rest." },
    { card: "After the talk, classmates give you feedback.", answer: "write it down for the final version", choices: C(["write it down for the final version", "argue with each comment", "forget it", "ask for marks only"]), good: "Peer feedback helps the final version in lecture 30." },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; r.goal = "What is the best thing to do?"; });
  const g = Kit.game({ rounds, cols: 1, colsPhone: 1, animMs: 600, intro: "Round 1 is before the talk: an old chart." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "All talks are done. Well presented!" : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
