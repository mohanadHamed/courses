<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="900" height="320" fill="#ffffff"/>
<rect x="10" y="10" width="880" height="300" rx="18" fill="#fff9f2" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="450" y="42" font-size="17" fill="#7a2a06" text-anchor="middle" font-weight="800">What AI does well: five good jobs</text>

<!-- 1 Draft: a page and a pencil -->
<rect x="26" y="60" width="164" height="190" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="108" y="88" font-size="16" fill="#1c7ed6" text-anchor="middle" font-weight="800">Draft</text>
<rect x="74" y="104" width="46" height="60" rx="4" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
<line x1="82" y1="118" x2="112" y2="118" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<line x1="82" y1="130" x2="106" y2="130" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<line x1="82" y1="142" x2="112" y2="142" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<rect x="132" y="108" width="11" height="42" rx="2" fill="#FFC078" stroke="#D9480F" stroke-width="1.5"/>
<polygon points="132,150 143,150 137.5,161" fill="#D9480F"/>
<text x="108" y="200" font-size="12.5" fill="#7a6a60" text-anchor="middle" font-weight="600">a notice for</text>
<text x="108" y="218" font-size="12.5" fill="#7a6a60" text-anchor="middle" font-weight="600">customers</text>

<!-- 2 Summarize: a long page becomes a short one -->
<rect x="198" y="60" width="164" height="190" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="280" y="88" font-size="16" fill="#0b7285" text-anchor="middle" font-weight="800">Summarize</text>
<rect x="222" y="100" width="40" height="68" rx="4" fill="#fff" stroke="#0b7285" stroke-width="2"/>
<line x1="229" y1="112" x2="255" y2="112" stroke="#99e9f2" stroke-width="3" stroke-linecap="round"/>
<line x1="229" y1="122" x2="250" y2="122" stroke="#99e9f2" stroke-width="3" stroke-linecap="round"/>
<line x1="229" y1="132" x2="255" y2="132" stroke="#99e9f2" stroke-width="3" stroke-linecap="round"/>
<line x1="229" y1="142" x2="250" y2="142" stroke="#99e9f2" stroke-width="3" stroke-linecap="round"/>
<line x1="229" y1="152" x2="255" y2="152" stroke="#99e9f2" stroke-width="3" stroke-linecap="round"/>
<line x1="268" y1="134" x2="284" y2="134" stroke="#D9480F" stroke-width="3" stroke-linecap="round"/>
<polygon points="292,134 283,128 283,140" fill="#D9480F"/>
<rect x="298" y="112" width="42" height="44" rx="4" fill="#fff" stroke="#0b7285" stroke-width="2"/>
<circle cx="306" cy="123" r="2.6" fill="#0b7285"/>
<line x1="312" y1="123" x2="332" y2="123" stroke="#99e9f2" stroke-width="3" stroke-linecap="round"/>
<circle cx="306" cy="134" r="2.6" fill="#0b7285"/>
<line x1="312" y1="134" x2="328" y2="134" stroke="#99e9f2" stroke-width="3" stroke-linecap="round"/>
<circle cx="306" cy="145" r="2.6" fill="#0b7285"/>
<line x1="312" y1="145" x2="332" y2="145" stroke="#99e9f2" stroke-width="3" stroke-linecap="round"/>
<text x="280" y="200" font-size="12.5" fill="#7a6a60" text-anchor="middle" font-weight="600">a long report</text>
<text x="280" y="218" font-size="12.5" fill="#7a6a60" text-anchor="middle" font-weight="600">in 3 points</text>

<!-- 3 Ideas: a light bulb -->
<rect x="370" y="60" width="164" height="190" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="452" y="88" font-size="16" fill="#e67700" text-anchor="middle" font-weight="800">Ideas</text>
<circle cx="452" cy="126" r="22" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<rect x="442" y="148" width="20" height="8" rx="2" fill="#adb5bd"/>
<rect x="444" y="157" width="16" height="6" rx="2" fill="#868e96"/>
<line x1="418" y1="126" x2="408" y2="126" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/>
<line x1="486" y1="126" x2="496" y2="126" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/>
<line x1="428" y1="102" x2="421" y2="95" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/>
<line x1="476" y1="102" x2="483" y2="95" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/>
<text x="452" y="200" font-size="12.5" fill="#7a6a60" text-anchor="middle" font-weight="600">5 titles</text>
<text x="452" y="218" font-size="12.5" fill="#7a6a60" text-anchor="middle" font-weight="600">for a poster</text>

<!-- 4 Rewrite: a long message becomes a short, polite one -->
<rect x="542" y="60" width="164" height="190" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="624" y="88" font-size="16" fill="#7048e8" text-anchor="middle" font-weight="800">Rewrite</text>
<rect x="578" y="100" width="92" height="30" rx="9" fill="#fff" stroke="#c92a2a" stroke-width="2"/>
<line x1="588" y1="111" x2="660" y2="111" stroke="#ffc9c9" stroke-width="3" stroke-linecap="round"/>
<line x1="588" y1="120" x2="648" y2="120" stroke="#ffc9c9" stroke-width="3" stroke-linecap="round"/>
<polygon points="618,136 630,136 624,146" fill="#7048e8"/>
<rect x="594" y="150" width="60" height="24" rx="9" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/>
<line x1="604" y1="162" x2="644" y2="162" stroke="#8ce99a" stroke-width="3" stroke-linecap="round"/>
<text x="624" y="200" font-size="12.5" fill="#7a6a60" text-anchor="middle" font-weight="600">shorter, simpler,</text>
<text x="624" y="218" font-size="12.5" fill="#7a6a60" text-anchor="middle" font-weight="600">more polite</text>

<!-- 5 Translate: two speech bubbles -->
<rect x="714" y="60" width="164" height="190" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="796" y="88" font-size="16" fill="#c2255c" text-anchor="middle" font-weight="800">Translate</text>
<rect x="744" y="104" width="46" height="34" rx="9" fill="#fff0f6" stroke="#c2255c" stroke-width="2"/>
<text x="767" y="127" font-size="15" fill="#c2255c" text-anchor="middle" font-weight="800">AR</text>
<rect x="802" y="136" width="46" height="34" rx="9" fill="#fff" stroke="#c2255c" stroke-width="2"/>
<text x="825" y="159" font-size="15" fill="#c2255c" text-anchor="middle" font-weight="800">EN</text>
<line x1="788" y1="146" x2="796" y2="154" stroke="#D9480F" stroke-width="3" stroke-linecap="round"/>
<polygon points="802,160 790,157 799,148" fill="#D9480F"/>
<text x="796" y="200" font-size="12.5" fill="#7a6a60" text-anchor="middle" font-weight="600">a short notice</text>
<text x="796" y="218" font-size="12.5" fill="#7a6a60" text-anchor="middle" font-weight="600">into English</text>

<text x="450" y="284" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="700">AI writes a first version in seconds. You read it, check it and make it yours.</text>
</svg>
