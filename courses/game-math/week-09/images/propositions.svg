<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A proposition is true or false</text>
<rect x="20" y="54" width="310" height="220" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="34" y="78" font-size="15" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Propositions</text>
<text x="36" y="102" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• The player has the key.</text>
<text x="36" y="142" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• The health is 0.</text>
<text x="36" y="182" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• The boss is defeated.</text>
<text x="36" y="222" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• 3 &gt; 5   (false, but a proposition)</text>
<rect x="350" y="54" width="310" height="220" rx="12" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.8"/>
<text x="364" y="78" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Not propositions</text>
<text x="366" y="102" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• Open the door!   (an order)</text>
<text x="366" y="142" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• Is the boss alive?   (a question)</text>
<text x="366" y="182" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• health &gt; 50   (true for which health?)</text>
<text x="366" y="222" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• Great level!   (an opinion)</text>
<text x="340" y="292" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">In game code, a proposition is a bool: it holds true or false.</text>
</svg>
