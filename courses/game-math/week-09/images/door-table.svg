<text x="344" y="74" font-size="15" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Read the table</text>
<text x="346" y="92" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">p: the ship has the pass. q: shields up. r: an</text>
<text x="346" y="108.9" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">officer on board.</text>
<text x="346" y="162" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The door opens in 3 of 8 cases (yellow):</text>
<text x="346" y="178.9" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">always with the pass, and with the shields or</text>
<text x="346" y="195.8" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">an officer.</text>
<text x="346" y="250" font-size="13" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Without the pass (rows 5–8) it never opens.</text>
