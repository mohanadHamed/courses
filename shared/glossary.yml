# Master English–Arabic glossary for all courses.
# Use in a lesson with {{< glossary key1 key2 >}}.
# Rules: one key per concept; same English term and same Arabic everywhere.
#   en:  the English term as students see it
#   ar:  Arabic translation (with tashkeel only where it helps reading)
#   def: one short, simple English sentence (A2 level)

2d:
  en: 2D (two-dimensional)
  ar: ثنائي الأبعاد
  def: A flat world. We use two numbers for a position (x, y).

3d:
  en: 3D (three-dimensional)
  ar: ثلاثي الأبعاد
  def: A world with depth. We use three numbers for a position (x, y, z).

axis:
  en: axis (plural axes)
  ar: محور
  def: A number line. We use it to measure position.

coordinate:
  en: coordinate
  ar: إحداثي
  def: One number that tells where something is on an axis.

game-engine:
  en: game engine
  ar: محرّك الألعاب
  def: A ready program that helps us build games (for example, Unity).

grid:
  en: grid
  ar: شبكة
  def: Lines that cross and make small squares.

origin:
  en: origin
  ar: نقطة الأصل
  def: The point where all axes meet. All coordinates are 0 there.

position:
  en: position
  ar: موقع
  def: The place of an object in the game world.

x-axis:
  en: x-axis
  ar: المحور السيني
  def: The horizontal line. x grows to the right.

y-axis:
  en: y-axis
  ar: المحور الصادي
  def: The vertical line. y grows up.

z-axis:
  en: z-axis
  ar: المحور العيني
  def: The depth line in 3D. In many games, z goes forward, into the screen.

negative-number:
  en: negative number
  ar: عدد سالب
  def: A number less than 0. It has a minus sign, for example −2.

# --- game-math week 1, lesson 2: vectors ---

vector:
  en: vector
  ar: مُتَّجَه
  def: An arrow with a direction and a length. It shows a move.

component:
  en: component
  ar: مُرَكَّبة
  def: One number of a vector. x is the steps right or left. y is the steps up or down.

direction:
  en: direction
  ar: اتجاه
  def: The way something points or moves. For example, right, left, up or down.

magnitude:
  en: magnitude (length)
  ar: مقدار (طول)
  def: How long a vector is. It shows how far the move goes.

velocity:
  en: velocity
  ar: السرعة المتجهة
  def: A vector that shows how an object moves in each frame (or each second).

frame:
  en: frame
  ar: إطار
  def: One picture of the game. A game draws many frames every second.

opposite-vector:
  en: opposite vector
  ar: المتجه المعاكس
  def: The same move, but the other way. The opposite of (3, 2) is (−3, −2).

zero-vector:
  en: zero vector
  ar: المتجه الصفري
  def: The vector (0, 0). It means "do not move".

# --- computing-systems week 1: computing systems and devices ---

hardware:
  en: hardware
  ar: المكونات المادية (العتاد)
  def: The parts of a device that you can touch.

software:
  en: software
  ar: البرمجيات
  def: The programs on a device. A game is software.

input:
  en: input
  ar: الإدخال
  def: Data that goes into the device. For example, a touch or a key press.

processing:
  en: processing
  ar: المعالجة
  def: The work the device does with the data.

output:
  en: output
  ar: الإخراج
  def: What the device gives back to you. For example, a picture or a sound.

storage:
  en: storage
  ar: وحدة التخزين
  def: The part that keeps apps and files, also when the device is off.

memory:
  en: memory (RAM)
  ar: الذاكرة (RAM)
  def: Fast memory for the apps that run now. It is empty when the device is off.

cpu:
  en: CPU (processor)
  ar: وحدة المعالجة المركزية (المعالج)
  def: The "brain" of the device. It runs the steps of the programs.

gpu:
  en: GPU (graphics processor)
  ar: وحدة معالجة الرسوميات
  def: The part that draws the pictures of the game on the screen.

platform:
  en: platform
  ar: منصّة
  def: The kind of system a game runs on. For example, Android phones, iPhones, PC or a game console.

device:
  en: device
  ar: جهاز
  def: A machine like a phone, a tablet, a laptop or a game console.

operating-system:
  en: operating system (OS)
  ar: نظام التشغيل
  def: The main software that runs the device and its apps. For example, Android or iOS.

specifications:
  en: specifications (specs)
  ar: المواصفات
  def: The list of the parts of a device and how strong they are.

app-store:
  en: app store
  ar: متجر التطبيقات
  def: The place where you download apps and games. For example, Google Play or the App Store.

install:
  en: install
  ar: تثبيت
  def: To put an app on a device, so you can use it.
