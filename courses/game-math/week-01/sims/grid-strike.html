<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Grid Strike</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .hud { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 0 0 8px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .sim .hud .stage { color: var(--sim-accent); }
    .sim .hud .target { font-size: 1.25rem; }
    .sim .hud .target b { color: #e8590c; }
    .sim .hud .score { margin-left: auto; }
    .sim .timer { height: 6px; border-radius: 4px; background: #eef1ee; overflow: hidden; margin-bottom: 8px; }
    .sim .timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--sim-accent), var(--sim-accent2)); }
    .sim .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .sim .choices button { min-width: 96px; }
    .sim .message.bad { color: #c92a2a; }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Grid Strike</h1>
  <p class="hint" id="hint">Tap the grid point with the coordinates shown. 8 strikes per stage.</p>
  <div class="hud">
    <span class="stage" id="stage">Stage 1 · World space</span>
    <span class="target" id="target"></span>
    <span class="score" id="score">Score 0</span>
  </div>
  <div class="timer"><i id="bar"></i></div>
  <canvas id="c" aria-label="Coordinate grid for the Grid Strike game"></canvas>
  <div class="choices" id="choices" hidden></div>
  <div class="controls">
    <button id="start" type="button">Start</button>
    <button id="sound" type="button" class="ghost">Sound: on</button>
  </div>
  <p id="msg" class="message">Stage 1: world space (y up). Stage 2: screen space (y down). Stage 3: read the point.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const ROUNDS = 8, TIME = 9;           // strikes per stage, seconds per strike
  const STAGES = [
    { name: "Stage 1 · World space", mode: "world", hint: "World space: the origin is in the centre, y grows upward." },
    { name: "Stage 2 · Screen space", mode: "screen", hint: "Screen space: the origin is at the top-left, y grows downward (pixels)." },
    { name: "Stage 3 · Read the point", mode: "read", hint: "World space again: read the coordinates of the flashing target." },
  ];
  const fmt = (n) => (n < 0 ? "−" + -n : String(n));
  const pair = (a, b) => `(${fmt(a)}, ${fmt(b)})`;

  let W = 0, H = 0, cell = 40, padL = 30, padT = 20;
  let game = null;          // { stage, round, score, target, t0, done, pending }
  let fx = [];              // explosions and marks
  let sound = true, audio = null;

  // Grid sizes: world x −6..6, y −4..4; screen 0..1200 × 0..800 px in steps of 100.
  const WORLD = { x0: -6, x1: 6, y0: -4, y1: 4 };
  const SCREEN = { cols: 12, rows: 8, step: 100 };

  function resize() {
    W = canvas.clientWidth;
    padL = W < 420 ? 26 : 34; padT = 22;
    cell = Math.min((W - padL * 2) / 12, 52);
    H = Math.round(cell * 8 + padT * 2 + 6);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  const gx0 = () => (W - cell * 12) / 2;
  // grid index (i 0..12, j 0..8 from the top) <-> pixel
  const px = (i) => gx0() + i * cell;
  const py = (j) => padT + j * cell;
  const mode = () => (game ? STAGES[game.stage].mode : "world");
  // coordinates shown to the player for grid index (i, j)
  function coordOf(i, j) {
    if (mode() === "screen") return [i * SCREEN.step, j * SCREEN.step];
    return [i + WORLD.x0, WORLD.y1 - j];
  }
  function indexOf(x, y) {
    if (mode() === "screen") return [x / SCREEN.step, y / SCREEN.step];
    return [x - WORLD.x0, WORLD.y1 - y];
  }

  function draw(now = performance.now()) {
    ctx.clearRect(0, 0, W, H);
    const m = mode();
    ctx.lineWidth = 1;
    for (let i = 0; i <= 12; i++) { ctx.strokeStyle = "#e6ebe7"; ctx.beginPath(); ctx.moveTo(px(i), py(0)); ctx.lineTo(px(i), py(8)); ctx.stroke(); }
    for (let j = 0; j <= 8; j++) { ctx.strokeStyle = "#e6ebe7"; ctx.beginPath(); ctx.moveTo(px(0), py(j)); ctx.lineTo(px(12), py(j)); ctx.stroke(); }
    ctx.font = "600 11px Nunito, system-ui, sans-serif";
    ctx.fillStyle = "#7a827d";
    if (m === "screen") {
      // axes along the top and the left edge
      arrow(px(0), py(0), px(12) + 14, py(0), "#c0392b");
      arrow(px(0), py(0), px(0), py(8) + 14, "#27ae60");
      ctx.fillStyle = "#7a827d";
      ctx.textAlign = "center";
      for (let i = 2; i <= 12; i += 2) ctx.fillText(String(i * 100), px(i), py(0) - 6);
      ctx.textAlign = "right";
      for (let j = 2; j <= 8; j += 2) ctx.fillText(String(j * 100), px(0) - 4, py(j) + 4);
      ctx.fillText("0", px(0) - 4, py(0) - 4);
      label("x", px(12) + 10, py(0) + 16, "#c0392b"); label("y", px(0) + 12, py(8) + 4, "#27ae60");
    } else {
      const oi = -WORLD.x0, oj = WORLD.y1;
      arrow(px(0) - 4, py(oj), px(12) + 14, py(oj), "#c0392b");
      arrow(px(oi), py(8) + 4, px(oi), py(0) - 14, "#27ae60");
      ctx.fillStyle = "#7a827d";
      ctx.textAlign = "center";
      for (let i = 0; i <= 12; i++) { const v = i + WORLD.x0; if (v) ctx.fillText(fmt(v), px(i), py(oj) + 15); }
      ctx.textAlign = "right";
      for (let j = 0; j <= 8; j++) { const v = WORLD.y1 - j; if (v) ctx.fillText(fmt(v), px(oi) - 5, py(j) + 4); }
      label("x", px(12) + 8, py(oj) - 8, "#c0392b"); label("y", px(oi) + 12, py(0) - 4, "#27ae60");
    }
    // target in the "read" stage
    if (game && !game.done && m === "read" && game.target) {
      const [i, j] = indexOf(...game.target);
      const pulse = 9 + 3 * Math.sin(now / 160);
      ctx.fillStyle = "#e8590c"; ctx.beginPath(); ctx.arc(px(i), py(j), pulse, 0, 7); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    }
    // effects
    fx = fx.filter((f) => now - f.t < f.life);
    for (const f of fx) {
      const k = (now - f.t) / f.life;
      if (f.kind === "boom") {
        ctx.strokeStyle = `rgba(47,158,68,${1 - k})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(f.x, f.y, 8 + 34 * k, 0, 7); ctx.stroke();
        for (let a = 0; a < 8; a++) {
          const r = 10 + 30 * k, ang = a * Math.PI / 4;
          ctx.fillStyle = `rgba(169,227,75,${1 - k})`;
          ctx.beginPath(); ctx.arc(f.x + r * Math.cos(ang), f.y + r * Math.sin(ang), 3.5 * (1 - k) + 1, 0, 7); ctx.fill();
        }
      } else if (f.kind === "miss") {
        ctx.strokeStyle = `rgba(201,42,42,${1 - k * 0.6})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(f.x - 8, f.y - 8); ctx.lineTo(f.x + 8, f.y + 8); ctx.moveTo(f.x + 8, f.y - 8); ctx.lineTo(f.x - 8, f.y + 8); ctx.stroke();
      } else if (f.kind === "show") {
        ctx.strokeStyle = `rgba(232,89,12,${1 - k * 0.5})`; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.arc(f.x, f.y, 13, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }
  function arrow(x1, y1, x2, y2, color) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 10 * Math.cos(a - 0.4), y2 - 10 * Math.sin(a - 0.4));
    ctx.lineTo(x2 - 10 * Math.cos(a + 0.4), y2 - 10 * Math.sin(a + 0.4)); ctx.fill();
  }
  function label(t, x, y, color) { ctx.font = "800 14px Nunito, system-ui, sans-serif"; ctx.fillStyle = color; ctx.textAlign = "center"; ctx.fillText(t, x, y); ctx.font = "600 11px Nunito, system-ui, sans-serif"; ctx.fillStyle = "#7a827d"; }

  function beep(freq, dur, type = "sine") {
    if (!sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = 0.08;
      o.connect(g); g.connect(audio.destination);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (_) {}
  }

  function randomTarget() {
    const m = mode();
    let x, y;
    do {
      const i = 1 + Math.floor(Math.random() * 11), j = 1 + Math.floor(Math.random() * 7);
      [x, y] = coordOf(i, j);
    } while (m !== "screen" && (x === 0 || y === 0) && Math.random() < 0.7);  // mostly inside a quadrant
    return [x, y];
  }

  function nextRound() {
    const st = STAGES[game.stage];
    if (game.round >= ROUNDS) {
      if (game.stage < STAGES.length - 1) {
        game.stage++; game.round = 0;
        $("msg").textContent = "Stage complete! " + STAGES[game.stage].hint;
        $("msg").className = "message good";
        game.pending = setTimeout(nextRound, 1400);
        updateHud(); draw();
        return;
      }
      game.done = true;
      $("target").textContent = "";
      $("choices").hidden = true;
      $("msg").textContent = `🏆 Game over. Score ${game.score} of ${ROUNDS * STAGES.length * 10}. Press Start to play again.`;
      $("msg").className = "message good";
      $("start").textContent = "Play again";
      return;
    }
    game.round++;
    game.target = randomTarget();
    game.t0 = performance.now();
    game.locked = false;
    $("hint").textContent = st.hint;
    if (st.mode === "read") {
      $("target").innerHTML = "Which point is flashing?";
      const opts = new Set([pair(...game.target)]);
      const [x, y] = game.target;
      const swaps = [pair(y, x), pair(-x, y), pair(x, -y), pair(-x, -y), pair(x + 1, y)];
      for (const s of swaps.sort(() => Math.random() - 0.5)) { if (opts.size >= 4) break; opts.add(s); }
      const box = $("choices"); box.innerHTML = ""; box.hidden = false;
      [...opts].sort(() => Math.random() - 0.5).forEach((t) => {
        const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.textContent = t;
        b.addEventListener("click", () => answer(t === pair(...game.target), null, t));
        box.appendChild(b);
      });
    } else {
      $("choices").hidden = true;
      $("target").innerHTML = `Strike <b>${pair(...game.target)}</b>`;
    }
    updateHud();
  }
  function updateHud() {
    $("stage").textContent = `${STAGES[game.stage].name} · ${game.round}/${ROUNDS}`;
    $("score").textContent = "Score " + game.score;
  }

  function answer(ok, hit, text) {
    if (!game || game.done || game.locked) return;
    game.locked = true;
    const [ti, tj] = indexOf(...game.target);
    const now = performance.now();
    if (ok) {
      const left = Math.max(0, 1 - (now - game.t0) / (TIME * 1000));
      const pts = 5 + Math.round(5 * left);
      game.score += pts;
      fx.push({ kind: "boom", x: px(ti), y: py(tj), t: now, life: 650 });
      $("msg").textContent = `✓ Hit! +${pts}` + (left > 0.6 ? " (fast)" : "");
      $("msg").className = "message good";
      beep(880, 0.15, "triangle"); setTimeout(() => beep(1320, 0.12, "triangle"), 90);
    } else {
      if (hit) fx.push({ kind: "miss", x: px(hit[0]), y: py(hit[1]), t: now, life: 1200 });
      fx.push({ kind: "show", x: px(ti), y: py(tj), t: now, life: 1200 });
      const said = hit ? `You hit ${pair(...coordOf(...hit))}.` : (text ? `${text} is wrong.` : "Time is up.");
      $("msg").textContent = `✗ ${said} The target was ${pair(...game.target)}.`;
      $("msg").className = "message bad";
      beep(180, 0.25, "sawtooth");
    }
    updateHud();
    game.pending = setTimeout(nextRound, ok ? 650 : 1500);
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (!game || game.done || mode() === "read") return;
    const r = canvas.getBoundingClientRect();
    const i = Math.round((e.clientX - r.left - gx0()) / cell), j = Math.round((e.clientY - r.top - padT) / cell);
    if (i < 0 || i > 12 || j < 0 || j > 8) return;
    const [ti, tj] = indexOf(...game.target);
    answer(i === ti && j === tj, [i, j]);
  });

  $("start").addEventListener("click", () => {
    if (game && game.pending) clearTimeout(game.pending);
    game = { stage: 0, round: 0, score: 0, target: null, done: false, locked: false };
    $("start").textContent = "Restart";
    $("msg").textContent = STAGES[0].hint; $("msg").className = "message";
    nextRound();
  });
  $("sound").addEventListener("click", () => { sound = !sound; $("sound").textContent = "Sound: " + (sound ? "on" : "off"); });

  function loop(now) {
    if (game && !game.done && !game.locked && game.target) {
      const k = (now - game.t0) / (TIME * 1000);
      $("bar").style.width = Math.max(0, 100 * (1 - k)) + "%";
      if (k >= 1) answer(false, null, null);
    }
    draw(now);
    requestAnimationFrame(loop);
  }
  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
