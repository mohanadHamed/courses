<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="400" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="21" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Share Settings: who and what?</text>
<text x="24.0" y="56.0" font-size="12" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">Share each file with the right people and the right permission.</text>
<rect x="24.0" y="70.0" width="592.0" height="32.0" rx="10" fill="#fff4e6" stroke="#FFC078" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="36.0" y="91.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Task 1 of 4: Ms Rana must read your report, but not change it.</text>
<rect x="24.0" y="114.0" width="420.0" height="262.0" rx="14" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
<text x="40.0" y="142.0" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Share &quot;class-report.docx&quot;</text>
<text x="40.0" y="170.0" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Who can open the link?</text>
<circle cx="50.0" cy="190.0" r="7.0" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text x="64.0" y="194.0" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Anyone with the link</text>
<circle cx="50.0" cy="216.0" r="7.0" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text x="64.0" y="220.0" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">People in your organization (the university)</text>
<circle cx="50.0" cy="242.0" r="7.0" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<circle cx="50.0" cy="242.0" r="3.5" fill="#1971c2" stroke="none" stroke-width="1.5"/>
<text x="64.0" y="246.0" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Specific people</text>
<rect x="40.0" y="262.0" width="380.0" height="26.0" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
<text x="50.0" y="280.0" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Rana</text>
<text x="40.0" y="310.0" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">What can they do?</text>
<rect x="160.0" y="296.0" width="80.0" height="24.0" rx="9" fill="#1971c2" stroke="#1971c2" stroke-width="1.5"/>
<text x="200.0" y="312.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Can view</text>
<rect x="246.0" y="296.0" width="80.0" height="24.0" rx="9" fill="#ffffff" stroke="#1971c2" stroke-width="1.5"/>
<text x="286.0" y="312.5" font-size="11" fill="#1971c2" text-anchor="middle" font-weight="800" xml:space="preserve">Can edit</text>
<rect x="40.0" y="334.0" width="110.0" height="28.0" rx="9" fill="#D9480F" stroke="#D9480F" stroke-width="1.5"/>
<text x="95.0" y="352.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Copy link</text>
<text x="460.0" y="200.0" font-size="13" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Share only</text>
<text x="460.0" y="218.0" font-size="13" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">with the people</text>
<text x="460.0" y="236.0" font-size="13" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">who need it.</text>
</svg>
