<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A shot list for the Rooftop Rescue promo</text>
<rect x="20" y="52" width="640" height="32" rx="0" fill="#9C36B5"/>
<text x="30" y="72.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">#</text>
<text x="90" y="72.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">time</text>
<text x="270" y="72.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">shot (from the capture)</text>
<text x="470" y="72.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">length</text>
<text x="590" y="72.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">note</text>
<text x="30" y="104.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">1</text>
<text x="90" y="104.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">0:00</text>
<text x="270" y="104.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">the wave hits the roof, Nour jumps</text>
<text x="470" y="104.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">2.5 s</text>
<text x="590" y="104.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">hook, loud</text>
<rect x="20" y="116" width="640" height="32" rx="0" fill="#f8f9fa"/>
<text x="30" y="136.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">2</text>
<text x="90" y="136.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">0:03</text>
<text x="270" y="136.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">wide shot of the flooded town</text>
<text x="470" y="136.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">3 s</text>
<text x="590" y="136.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">title in</text>
<text x="30" y="168.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">3</text>
<text x="90" y="168.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">0:06</text>
<text x="270" y="168.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Nour rows, rain</text>
<text x="470" y="168.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">2 s</text>
<text x="590" y="168.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">on the beat</text>
<rect x="20" y="180" width="640" height="32" rx="0" fill="#f8f9fa"/>
<text x="30" y="200.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">4</text>
<text x="90" y="200.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">0:08</text>
<text x="270" y="200.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">the net catches Pasha</text>
<text x="470" y="200.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">2 s</text>
<text x="590" y="200.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">cut on action</text>
<text x="30" y="232.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">5</text>
<text x="90" y="232.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">0:10</text>
<text x="270" y="232.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">three short level shots</text>
<text x="470" y="232.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">3 × 1.5 s</text>
<text x="590" y="232.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">fast</text>
<rect x="20" y="244" width="640" height="32" rx="0" fill="#f8f9fa"/>
<text x="30" y="264.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">…</text>
<text x="90" y="264.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">…</text>
<text x="270" y="264.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">…</text>
<text x="470" y="264.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">…</text>
<text x="590" y="264.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">…</text>
<text x="30" y="296.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">9</text>
<text x="90" y="296.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">0:25</text>
<text x="270" y="296.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">logo, “Play free now”</text>
<text x="470" y="296.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">5 s</text>
<text x="590" y="296.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">music ends</text>
<rect x="20" y="52" width="640" height="256" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
