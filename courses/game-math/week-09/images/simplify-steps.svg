<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Simplifying a condition step by step</text>
<rect x="40" y="64" width="340" height="40" rx="8" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.6"/>
<text x="56" y="90" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">(p ∧ q) ∨ (p ∧ ¬q)</text>
<text x="400" y="90" font-size="13" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve"></text>
<rect x="40" y="116" width="340" height="40" rx="8" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.6"/>
<text x="56" y="142" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">p ∧ (q ∨ ¬q)</text>
<text x="400" y="142" font-size="13" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">= by the distributive law</text>
<rect x="40" y="168" width="340" height="40" rx="8" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.6"/>
<text x="56" y="194" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">p ∧ T</text>
<text x="400" y="194" font-size="13" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">= by the complement law</text>
<rect x="40" y="220" width="340" height="40" rx="8" fill="#2F9E44" stroke="#2F9E44" stroke-width="1.6"/>
<text x="56" y="246" font-size="15" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">p</text>
<text x="400" y="246" font-size="13" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">= by the identity law</text>
<text x="340" y="282" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">In code: (hasPass &amp;&amp; shieldsUp) || (hasPass &amp;&amp; !shieldsUp) is just hasPass.</text>
</svg>
