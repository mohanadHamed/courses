# The lectures of the course in teaching order (titles from the official
# syllabus). Students and the teacher count lectures, not weeks: a missed or
# late week moves every course differently, so the site never shows weeks.
# Exams are not listed: the university sets them.
#
# Files: lecture n is lesson-NN.qmd (NN = n) in the folder week-PP, where
# PP = (n + 1) / 2 rounded down: lectures 1-2 are in week-01, 3-4 in week-02,
# and so on. The folder name is internal (it keeps old links and QR codes
# working) and is never shown. Homework k (homework-0k.qmd, in week-0k)
# follows lectures 2k-1 and 2k. A lecture is ready (bright, with links) when
# its lesson-NN.qmd exists and has no `draft: true`; otherwise it is faded.
lectures:
  - {n: 1, title: "Digital Media and Creative Production in Games", ilos: [A1]}
  - {n: 2, title: "Analyzing the Media of a Game", ilos: [A1]}
  - {n: 3, title: "Story Fundamentals: Character, Setting, Conflict and Structure", ilos: [A1]}
  - {n: 4, title: "Analyzing the Story Structure of a Mobile Game", ilos: [A1, B1]}
  - {n: 5, title: "Narrative in Games: Linear, Branching and Environmental Storytelling", ilos: [A1]}
  - {n: 6, title: "Drafting a Story Premise", ilos: [A1, B1]}
  - {n: 7, title: "Screenwriting: Format, Scenes and Dialogue", ilos: [A1]}
