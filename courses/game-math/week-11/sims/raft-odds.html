<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Raft Odds</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Raft Odds</h1>
  <p class="hint">In the board game <i>Lucky Raft</i>, players roll dice, open loot crates and draw event cards. Before each move, find the probability.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script src="dice.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { kind: "die", hl: [5, 6], goal: "The raft reaches the island with a <b>5 or a 6</b>. P?", answer: "2/6 = 1/3", choices: C(["2/6 = 1/3", "1/6", "5/6", "1/2"]),
      good: "2 of 6 equally likely outcomes: 2/6 = 1/3.", why: { "1/6": "That is only one face. Two faces win." } },
    { kind: "crate", goal: "A crate has 1 gold, 3 silver and 6 wood items. P(<b>not wood</b>)?", answer: "4/10", choices: C(["4/10", "6/10", "1/10", "3/10"]),
      good: "P(not wood) = 1 − 6/10 = 4/10: the gold and the silver items.", why: { "6/10": "That is P(wood). Not wood is the complement." } },
    { kind: "grid", ev: (a, b) => a + b === 7, goal: "Two dice. P(<b>sum 7</b>)?", answer: "6/36", choices: C(["6/36", "7/36", "1/11", "1/12"]),
      good: "6 of the 36 cells make 7: 1+6, 2+5, 3+4, 4+3, 5+2, 6+1.", why: { "1/11": "There are 11 sums, but they are not equally likely. Count the 36 cells." } },
    { kind: "grid", ev: (a, b) => a === 6 || b === 6, goal: "Two dice. P(<b>at least one 6</b>)?", answer: "11/36", choices: C(["11/36", "12/36", "1/6", "25/36"]),
      good: "Not A = no 6 = 5 × 5 = 25 cells, so P = 1 − 25/36 = 11/36.", why: { "12/36": "1/6 + 1/6 counts the cell (6, 6) twice.", "25/36": "That is P(no 6), the complement." } },
    { kind: "die", hl: [2, 4, 5, 6], goal: "One die. P(<b>even or more than 4</b>)?", answer: "4/6", choices: C(["4/6", "5/6", "3/6", "1/6"]),
      good: "3/6 + 2/6 − 1/6 = 4/6: the 6 is in both events.", why: { "5/6": "The 6 is even and more than 4: do not count it twice." } },
    { kind: "cards", goal: "12 event cards, 3 are storms. Draw one, put it back, draw again. P(<b>two storms</b>)?", answer: "1/16", choices: C(["1/16", "1/8", "1/4", "6/12"]),
      good: "The draws are independent: 3/12 × 3/12 = 1/4 × 1/4 = 1/16.", why: { "1/8": "Do not add the chances when both must happen: multiply.", "6/12": "Two storms together is rarer than one storm." } },
  ];
  Kit.game({
    rounds, cols: 2, colsPhone: 2, animMs: 800, still: true,
    intro: "Round 1 is the story of the lesson: the raft needs a 5 or a 6.",
    canvas: (W) => Math.min(210, W * 0.42),
    draw(c, W, H, now, r, st) {
      if (!r) { Kit.text(c, "🎉 Safe on the island!", W / 2, H / 2, 20, "#2b8a3e"); return; }
      const show = st.done && st.ok;
      if (r.kind === "die") {
        const sz = Math.min(60, (W - 70) / 6), gap = (W - sz * 6) / 7;
        for (let i = 1; i <= 6; i++) { const x = gap + (i - 1) * (sz + gap), y = H / 2 - sz / 2; if (show && r.hl.includes(i)) Kit.rrect(c, x - 6, y - 6, sz + 12, sz + 12, 12, "#b2f2bb"); DC.die(c, x, y, sz, i); }
      } else if (r.kind === "crate") {
        const items = ["#fab005", "#ced4da", "#ced4da", "#ced4da", "#c97b44", "#c97b44", "#c97b44", "#c97b44", "#c97b44", "#c97b44"];
        const rr = Math.min(22, W / 26);
        items.forEach((col, i) => { const x = W / 2 + (i % 5 - 2) * rr * 2.6, y = H / 2 + (i < 5 ? -rr * 1.4 : rr * 1.4); if (show && i < 4) { c.fillStyle = "#b2f2bb"; c.beginPath(); c.arc(x, y, rr + 6, 0, 7); c.fill(); } c.fillStyle = col; c.strokeStyle = "#495057"; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, rr, 0, 7); c.fill(); c.stroke(); });
        Kit.text(c, "gold · silver · wood", W / 2, H - 8, 12, "#495057");
      } else if (r.kind === "grid") {
        const cell = Math.min((W - 30) / 6, (H - 10) / 6), x0 = (W - cell * 6) / 2, y0 = (H - cell * 6) / 2;
        for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) {
          const hit = show && r.ev(a, b);
          Kit.rrect(c, x0 + (b - 1) * cell + 1, y0 + (a - 1) * cell + 1, cell - 2, cell - 2, 3, hit ? "#b2f2bb" : "#fff", "#ced4da", 1);
          Kit.text(c, a + b, x0 + (b - 0.5) * cell, y0 + (a - 0.5) * cell + 4, Math.min(12, cell * 0.36), hit ? "#2a2f2c" : "#adb5bd", "center", 700);
        }
      } else {
        const w = Math.min(40, (W - 40) / 13), h = w * 1.4;
        for (let i = 0; i < 12; i++) { const x = (W - 12 * (w + 4)) / 2 + i * (w + 4), y = H / 2 - h / 2, storm = i < 3; Kit.rrect(c, x, y, w, h, 5, storm ? (show ? "#a5d8ff" : "#d0ebff") : "#fff4e6", storm ? "#1c7ed6" : "#e8590c", 1.5); Kit.text(c, storm ? "⚡" : "☀", x + w / 2, y + h / 2 + 5, w * 0.4, "#2a2f2c"); }
      }
    },
  });
})();
</script>
</body>
</html>
