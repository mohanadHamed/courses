<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">An AI summary of the month, checked with the PivotTable</text>
<rect x="20" y="52" width="640" height="250" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
<text x="40" y="80" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">AI: &quot;Here is a summary of Rana&#x27;s sales in March:&quot;</text>
<text x="40" y="112" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• Total sales were 355 JD.</text>
<rect x="537.5" y="97" width="45" height="22" rx="11" fill="#2b8a3e"/>
<text x="560" y="112.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">true</text>
<text x="40" y="150" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• Bags sold the most.</text>
<rect x="532.2" y="135" width="55.6" height="22" rx="11" fill="#c92a2a"/>
<text x="560" y="150.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">wrong</text>
<text x="40" y="188" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• The third week was the best (112 JD).</text>
<rect x="537.5" y="173" width="45" height="22" rx="11" fill="#2b8a3e"/>
<text x="560" y="188.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">true</text>
<text x="40" y="226" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• Sales grew every week.</text>
<rect x="532.2" y="211" width="55.6" height="22" rx="11" fill="#c92a2a"/>
<text x="560" y="226.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">wrong</text>
<text x="40" y="264" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• The average sale was about 15 JD.</text>
<rect x="537.5" y="249" width="45" height="22" rx="11" fill="#2b8a3e"/>
<text x="560" y="264.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">true</text>
<text x="40" y="292" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Paper sold most (206 JD). The second week (63 JD) was lower than the first (87 JD).</text>
</svg>
