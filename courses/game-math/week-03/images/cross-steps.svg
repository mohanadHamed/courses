<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="330" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="18" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">a = (2, 1, 0)</text>
<text x="190.0" y="34.0" font-size="18" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">b = (0, 3, 1)</text>
<text x="24.0" y="58.0" font-size="13" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">Each part of a × b uses the two other axes: the x-part uses y and z, and so on.</text>
<rect x="24.0" y="80.0" width="592.0" height="54.0" rx="10" fill="#f8f9fa" stroke="none" stroke-width="1.5"/>
<circle cx="52.0" cy="107.0" r="17.0" fill="#c0392b" stroke="none" stroke-width="1.5"/>
<text x="52.0" y="113.0" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">x</text>
<text x="84.0" y="113.0" font-size="16" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">a<tspan dy="4.5" font-size="11.2">y</tspan><tspan dy="-4.5"> </tspan> b<tspan dy="4.5" font-size="11.2">z</tspan><tspan dy="-4.5"> </tspan> − a<tspan dy="4.5" font-size="11.2">z</tspan><tspan dy="-4.5"> </tspan> b<tspan dy="4.5" font-size="11.2">y</tspan><tspan dy="-4.5"> </tspan></text>
<text x="300.0" y="113.0" font-size="16" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">1 × 1 − 0 × 3</text>
<text x="470.0" y="113.0" font-size="16" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">=</text>
<text x="500.0" y="113.0" font-size="20" fill="#c0392b" text-anchor="start" font-weight="800" xml:space="preserve">1</text>
<rect x="24.0" y="146.0" width="592.0" height="54.0" rx="10" fill="#f8f9fa" stroke="none" stroke-width="1.5"/>
<circle cx="52.0" cy="173.0" r="17.0" fill="#27ae60" stroke="none" stroke-width="1.5"/>
<text x="52.0" y="179.0" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">y</text>
<text x="84.0" y="179.0" font-size="16" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">a<tspan dy="4.5" font-size="11.2">z</tspan><tspan dy="-4.5"> </tspan> b<tspan dy="4.5" font-size="11.2">x</tspan><tspan dy="-4.5"> </tspan> − a<tspan dy="4.5" font-size="11.2">x</tspan><tspan dy="-4.5"> </tspan> b<tspan dy="4.5" font-size="11.2">z</tspan><tspan dy="-4.5"> </tspan></text>
<text x="300.0" y="179.0" font-size="16" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">0 × 0 − 2 × 1</text>
<text x="470.0" y="179.0" font-size="16" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">=</text>
<text x="500.0" y="179.0" font-size="20" fill="#27ae60" text-anchor="start" font-weight="800" xml:space="preserve">−2</text>
<rect x="24.0" y="212.0" width="592.0" height="54.0" rx="10" fill="#f8f9fa" stroke="none" stroke-width="1.5"/>
<circle cx="52.0" cy="239.0" r="17.0" fill="#2471a3" stroke="none" stroke-width="1.5"/>
<text x="52.0" y="245.0" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">z</text>
<text x="84.0" y="245.0" font-size="16" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">a<tspan dy="4.5" font-size="11.2">x</tspan><tspan dy="-4.5"> </tspan> b<tspan dy="4.5" font-size="11.2">y</tspan><tspan dy="-4.5"> </tspan> − a<tspan dy="4.5" font-size="11.2">y</tspan><tspan dy="-4.5"> </tspan> b<tspan dy="4.5" font-size="11.2">x</tspan><tspan dy="-4.5"> </tspan></text>
<text x="300.0" y="245.0" font-size="16" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">2 × 3 − 1 × 0</text>
<text x="470.0" y="245.0" font-size="16" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">=</text>
<text x="500.0" y="245.0" font-size="20" fill="#2471a3" text-anchor="start" font-weight="800" xml:space="preserve">6</text>
<rect x="24.0" y="282.0" width="592.0" height="38.0" rx="10" fill="#ebfbee" stroke="none" stroke-width="1.5"/>
<text x="320.0" y="307.0" font-size="14" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">a × b = (1, −2, 6). Check: (1, −2, 6) · a = 0 and (1, −2, 6) · b = 0.</text>
</svg>
