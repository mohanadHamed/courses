<text x="304" y="84" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">B = the first die is 6 (blue row)</text>
<text x="304" y="104" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">A = the sum is 10 or more (green).</text>
<text x="304" y="140" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Without the condition: P(A) = 6/36 = 1/6.</text>
<text x="304" y="180" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Knowing B, the sample space is only the 6 blue cells;</text>
<text x="304" y="196.9" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">3 of them are in A.</text>
<text x="304" y="240" font-size="14" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">P(A | B) = P(A and B) / P(B) = (3/36) / (6/36)</text>
<text x="304" y="258.2" font-size="14" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">= 1/2</text>
