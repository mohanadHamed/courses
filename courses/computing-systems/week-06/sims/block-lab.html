<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Block Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .grid { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; margin: 8px 0; }
    .sim .grid div { aspect-ratio: 1; border-radius: 3px; background: #f1f3f5; border: 1px solid #e9ecef; position: relative; overflow: hidden; }
    .sim .grid div span { position: absolute; left: 0; right: 0; bottom: 0; }
    .sim .out { font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.5; }
    .sim .legend { font-size: .85rem; color: var(--sim-muted); }
  </style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Block Lab: size and size on disk</h1>
  <p class="hint">A tiny memory card with 64 blocks of 4 KB (256 KB). Save files and watch the blocks. The coloured part of a block is the data; the rest of the block is wasted.</p>
  <div class="controls" id="btns"></div>
  <div class="grid" id="grid"></div>
  <p class="out" id="out"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const COLS = ["#1c7ed6", "#7048e8", "#e8590c", "#0c8599", "#d6336c", "#2b8a3e", "#A86700"];
  let files = [], n = 0;
  const $ = (id) => document.getElementById(id);
  const blocks = (kb) => Math.ceil(kb / 4);
  const used = () => files.reduce((s, f) => s + blocks(f.kb), 0);
  function save(name, kb, say) {
    if (used() + blocks(kb) > 64) { $("msg").textContent = "✗ The card is full: there are not enough free blocks."; $("msg").className = "message bad"; Kit.bad(); return false; }
    files.push({ name, kb, col: COLS[n++ % COLS.length] });
    if (say) { $("msg").textContent = say; $("msg").className = "message"; }
    Kit.beep(520, 0.05); show(); return true;
  }
  const ITEMS = [
    { k: "note", label: "save note.txt (1 KB)", f: () => save("note.txt", 1, "1 KB of text, but it takes a whole block: 4 KB on disk.") },
    { k: "pic", label: "save icon.png (9 KB)", f: () => save("icon.png", 9, "9 KB needs 3 blocks: 12 KB on disk.") },
    { k: "small", label: "save 10 small files (1 KB each)", f: () => { for (let i = 1; i <= 10; i++) if (!save(`tile${i}.dat`, 1)) return; $("msg").textContent = "10 × 1 KB = 10 KB of data, but 10 blocks = 40 KB on disk."; $("msg").className = "message"; } },
    { k: "pack", label: "pack the small files into one", f: () => {
      const small = files.filter((x) => x.kb <= 2);
      if (small.length < 2) { $("msg").textContent = "There are not enough small files to pack. Save small files first."; return; }
      const kb = small.reduce((s, x) => s + x.kb, 0);
      files = files.filter((x) => x.kb > 2); save("pack.dat", kb);
      $("msg").textContent = `✓ ${small.length} small files became one pack of ${kb} KB: ${blocks(kb)} blocks instead of ${small.length}. Games pack their assets for this.`; $("msg").className = "message good";
    } },
    { k: "clear", label: "delete all", f: () => { files = []; show(); $("msg").textContent = "The card is empty."; } },
  ];
  Kit.buttons($("btns"), ITEMS, (k) => ITEMS.find((x) => x.k === k).f());
  function show() {
    const g = $("grid"); g.innerHTML = "";
    const cells = [];
    files.forEach((f) => { for (let b = 0; b < blocks(f.kb); b++) cells.push({ f, fill: Math.min(4, f.kb - b * 4) / 4 }); });
    for (let i = 0; i < 64; i++) {
      const d = Kit.el("div", { title: cells[i] ? cells[i].f.name : "free" });
      if (cells[i]) { d.style.borderColor = cells[i].f.col; d.innerHTML = `<span style="height:${cells[i].fill * 100}%;background:${cells[i].f.col}"></span>`; }
      g.appendChild(d);
    }
    const size = files.reduce((s, f) => s + f.kb, 0), disk = used() * 4;
    $("out").innerHTML = `Files: ${files.length} · size ${size} KB · size on disk ${disk} KB · wasted ${disk - size} KB · free ${256 - disk} KB`;
  }
  show(); $("msg").textContent = "Save a note of 1 KB. How many KB does it take on the card?";
})();
</script>
</body>
</html>
