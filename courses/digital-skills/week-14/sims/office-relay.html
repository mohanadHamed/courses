<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Office Relay</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #fff4e6; border: 1.5px solid #D9480F; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Office Relay</h1>
  <p class="hint">At Sunrise Company, the monthly report passes from Excel to Word to PowerPoint. In each round, choose the best way to do the job.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "Huda needs the total of 24 sales for the report.", answer: "a SUM formula in Excel, then copy the number", choices: C(["a SUM formula in Excel, then copy the number", "add them with a phone calculator", "ask an AI tool and copy its answer", "type the numbers into Word"]), good: "Excel does the numbers; the formula is easy to check." },
    { card: "The Excel table must look like the rest of Huda's Word report, and she may still change a number in Word.", answer: "paste it with Use Destination Styles", choices: C(["paste it with Use Destination Styles", "paste it as a picture", "type the table again in Word", "take a screenshot"]), good: "Use Destination Styles gives a Word table in the look of the report, and you can still edit it." },
    { card: "Huda wants slides from the report's main points.", answer: "use Heading 1 and 2, then Slides from Outline", choices: C(["use Heading 1 and 2, then Slides from Outline", "copy the whole report onto one slide", "make every sentence a slide", "send the Word file as the talk"]), good: "Heading 1 gives slide titles; Heading 2 gives bullets." },
    { card: "An AI draft of the report says: \"Sales grew by 50% this month.\"", answer: "check the number in Excel before using it", choices: C(["check the number in Excel before using it", "keep it: it sounds good", "make it 60%", "delete all AI text"]), good: "Every AI number is checked against the data." },
    { card: "The manager must read the report but must not change it.", answer: "save a PDF copy and send it", choices: C(["save a PDF copy and send it", "send the Word file to everyone", "send only the Excel file", "remove the table"]), good: "A PDF keeps the look, and people do not easily change it." },
    { card: "The report, the sheet and the slides are finished with AI help.", answer: "add one line that says where AI helped", choices: C(["add one line that says where AI helped", "say nothing about AI", "write that AI did everything", "remove the AI parts"]), good: "Be honest about AI use: say where it helped, and that you checked it." },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; r.goal = "What is the best way?"; });
  const g = Kit.game({ rounds, cols: 1, colsPhone: 1, animMs: 600, intro: "Round 1 starts in Excel: the total of the month." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "The report, the sheet and the slides are ready." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
