<rect x="41" y="160" width="4" height="26" fill="#d9480f"/>
<text x="58" y="178" font-size="13" font-weight="400" fill="#a3a8ad" text-anchor="start">4</text>
<text x="80" y="178" font-size="13" font-weight="700" fill="#3c4043" text-anchor="start">GROUP BY year</text>
<text x="58" y="204" font-size="13" font-weight="400" fill="#a3a8ad" text-anchor="start">5</text>
<text x="80" y="204" font-size="13" font-weight="400" fill="#3c4043" text-anchor="start">ORDER BY year;</text>
<text x="40" y="262" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">GROUP BY year: one group for each year.</text>
<text x="40" y="290" font-size="15" font-weight="400" fill="#5f656b" text-anchor="start">Each colour is one group. Then COUNT(*) counts each group.</text>
