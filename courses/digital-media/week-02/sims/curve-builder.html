<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Curve Builder</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .sim .presets button { padding: 5px 12px; font-size: 0.88rem; }
    .sim .steps { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 8px; text-align: center; font-variant-numeric: tabular-nums; }
    .sim .steps div { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .sim .steps button { padding: 2px 0; width: 100%; max-width: 46px; font-size: 1rem; }
    .sim .steps output { font-size: 1.1rem; font-weight: 800; color: var(--sim-accent); }
    .sim .steps small { font-size: 0.72rem; color: var(--sim-muted); font-weight: 700; }
    .sim ul.fb { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; }
    .sim ul.fb li { font-weight: 700; font-size: 0.92rem; padding: 4px 8px; border-radius: 8px; }
    .sim ul.fb li.ok { background: #ebfbee; color: #2b8a3e; }
    .sim ul.fb li.no { background: #fff5f5; color: #c92a2a; }
  </style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Curve Builder</h1>
  <p class="hint">Give each of the eight stages a tension from 1 (calm) to 10 (very tense) with − and +. The simulator draws the curve and checks its shape.</p>
  <div class="presets">
    <button type="button" class="ghost" data-p="draft">Moon Diver: first draft</button>
    <button type="button" class="ghost" data-p="final">Moon Diver: final</button>
    <button type="button" class="ghost" data-p="flat">Flat</button>
    <button type="button" class="ghost" data-p="tense">Always tense</button>
  </div>
  <canvas id="c" aria-label="The tension curve of eight stages"></canvas>
  <div class="steps" id="steps"></div>
  <ul class="fb" id="fb" aria-live="polite"></ul>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const PRESETS = { draft: [3, 4, 9, 5, 5, 5, 6, 2], final: [6, 5, 4, 2, 6, 7, 9, 2], flat: [5, 5, 5, 5, 5, 5, 5, 5], tense: [8, 8, 9, 9, 9, 10, 10, 9] };
  let t = PRESETS.draft.slice(), W = 0, H = 0;
  $("steps").innerHTML = t.map((_, i) => `<div><button type="button" class="ghost" data-i="${i}" data-d="1">+</button><output id="o${i}"></output><button type="button" class="ghost" data-i="${i}" data-d="-1">−</button><small>stage ${i + 1}</small></div>`).join("");

  function checks() {
    const max = Math.max(...t), peak = t.lastIndexOf(max), first = t.indexOf(max);
    let rest = false; for (let i = 2; i <= 6; i++) if (t[i] < t[i - 1]) rest = true;
    const act2max = Math.max(t[4], t[5], t[6]);
    return [
      [t[0] >= 5, "Hook: stage 1 catches the player (5 or more).", "No hook: stage 1 is calm. Start with something strong."],
      [first >= 5 && peak <= 6, `The peak (${max}) is near the end, in stage ${peak + 1}: the climax.`, first < 5 ? `The peak (${max}) comes too early, in stage ${first + 1}. Move the biggest moment to stage 6 or 7.` : "The peak is in the last stage: there is no time left for a resolution."],
      [act2max > t[2], "Act 2 rises: stages 5–7 are more tense than stage 3.", "Act 2 does not rise: the middle is flat or falls. Make the obstacles bigger."],
      [rest, "There is a rest in the middle: a calmer stage lets the player breathe.", "No rest: add a calmer stage between the tense ones."],
      [t[7] <= max - 3, "Resolution: the last stage is calm after the climax.", "No resolution: the last stage is still tense."],
      [t.filter((v) => v >= 8).length <= 2, "Not always tense: at most two stages at 8 or more.", "Always tense: too many stages at 8 or more. The climax will not feel special."],
    ];
  }
  function resize() {
    W = canvas.clientWidth; H = Math.round(Math.min(W * 0.48, 300));
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function draw() {
    try {
      const L = 34, R = 14, T = 14, B = 24, cw = W - L - R, ch = H - T - B;
      const X = (i) => L + (i + 0.5) * cw / 8, Y = (v) => T + ch - (v / 10) * ch;
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
      // act bands
      [[0, 2, "#f3f0ff", "act 1"], [2, 6, "#fff0f6", "act 2"], [6, 8, "#f3f0ff", "act 3"]].forEach(([a, b, c, n]) => {
        ctx.fillStyle = c; ctx.fillRect(L + a * cw / 8, T, (b - a) * cw / 8, ch);
        ctx.fillStyle = "#9C36B5"; ctx.font = "800 11px Nunito, system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText(n, L + (a + b) / 2 * cw / 8, T + 12);
      });
      ctx.strokeStyle = "#e9ecef"; ctx.lineWidth = 1; ctx.fillStyle = "#868e96"; ctx.font = "600 10px Nunito, system-ui, sans-serif"; ctx.textAlign = "right";
      for (let v = 0; v <= 10; v += 2) { ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(W - R, Y(v)); ctx.stroke(); ctx.fillText(String(v), L - 6, Y(v) + 3); }
      ctx.textAlign = "center"; for (let i = 0; i < 8; i++) ctx.fillText(String(i + 1), X(i), H - 8);
      ctx.strokeStyle = "#9C36B5"; ctx.lineWidth = 4; ctx.lineJoin = "round"; ctx.beginPath();
      t.forEach((v, i) => (i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)))); ctx.stroke();
      t.forEach((v, i) => { ctx.fillStyle = "#F783AC"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X(i), Y(v), 6, 0, 7); ctx.fill(); ctx.stroke(); });
    } catch (e) { /* keep the simulator alive */ }
  }
  function show() {
    t.forEach((v, i) => ($("o" + i).textContent = v));
    $("fb").innerHTML = checks().map(([ok, yes, no]) => `<li class="${ok ? "ok" : "no"}">${ok ? "✓ " + yes : "✗ " + no}</li>`).join("");
    draw();
  }
  document.querySelectorAll("[data-i]").forEach((b) => b.addEventListener("click", () => {
    const i = Number(b.dataset.i); t[i] = Math.max(1, Math.min(10, t[i] + Number(b.dataset.d))); show();
  }));
  document.querySelectorAll("[data-p]").forEach((b) => b.addEventListener("click", () => { t = PRESETS[b.dataset.p].slice(); show(); }));
  window.addEventListener("resize", resize);
  show(); resize();
})();
</script>
</body>
</html>
