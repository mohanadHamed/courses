<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Check the board before the team builds the scene</text>
<rect x="36" y="52" width="20" height="20" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<path d="M40 63 l5 6 l9 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="68" y="67" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Every beat has a panel.</text>
<rect x="36" y="88" width="20" height="20" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<path d="M40 99 l5 6 l9 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="68" y="103" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Panel 1 shows the place (a wide shot).</text>
<rect x="36" y="124" width="20" height="20" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<path d="M40 135 l5 6 l9 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="68" y="139" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The shots change: wide, medium, close-up.</text>
<rect x="36" y="160" width="20" height="20" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<path d="M40 171 l5 6 l9 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="68" y="175" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Feelings are close-ups.</text>
<rect x="36" y="196" width="20" height="20" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<path d="M40 207 l5 6 l9 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="68" y="211" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The screen direction stays the same.</text>
<rect x="36" y="232" width="20" height="20" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<path d="M40 243 l5 6 l9 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="68" y="247" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Every panel has a caption and a time.</text>
<rect x="440" y="60" width="210" height="210" rx="12" fill="#ffffff" stroke="#9C36B5" stroke-width="1.8"/>
<text x="454" y="84" font-size="15" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">The time line</text>
<text x="454" y="106.8" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Add the seconds of all panels.</text>
<text x="454" y="126.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Wide 3 s + medium 3 s +</text>
<text x="454" y="143.6" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">close-up 2 s + close-up 3 s =</text>
<text x="454" y="160.5" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">11 s.</text>
<text x="454" y="180.4" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Is it too long for the</text>
<text x="454" y="197.3" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">moment?</text>
</svg>
