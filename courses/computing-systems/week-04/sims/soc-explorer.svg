<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="440" fill="#ffffff"/>
<text x="16" y="30" font-size="19" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">SoC Explorer</text>
<text x="16" y="52" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">Tap a part of the chip. Then test yourself: which part does the job?</text>
<rect x="16" y="70" width="608" height="250" rx="16" fill="#fff3bf" stroke="#A86700" stroke-width="2.5"/>
<rect x="32" y="90" width="182" height="96" rx="12" fill="#fff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="46" y="120" font-size="14" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">CPU cores</text>
<text x="46" y="144" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">game logic, physics</text>
<rect x="230" y="90" width="182" height="96" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2.5"/>
<text x="244" y="120" font-size="14" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">GPU</text>
<text x="244" y="144" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">draws every frame</text>
<rect x="428" y="90" width="182" height="96" rx="12" fill="#fff" stroke="#7048e8" stroke-width="1.5"/>
<text x="442" y="120" font-size="14" fill="#7048e8" text-anchor="start" font-weight="800" xml:space="preserve">NPU (AI engine)</text>
<text x="442" y="144" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">faces, speech, AI</text>
<rect x="32" y="202" width="182" height="96" rx="12" fill="#fff" stroke="#0b7285" stroke-width="1.5"/>
<text x="46" y="232" font-size="14" fill="#0b7285" text-anchor="start" font-weight="800" xml:space="preserve">modem</text>
<text x="46" y="256" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">mobile data, online play</text>
<rect x="230" y="202" width="182" height="96" rx="12" fill="#fff" stroke="#e8590c" stroke-width="1.5"/>
<text x="244" y="232" font-size="14" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">image processor</text>
<text x="244" y="256" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">camera pictures</text>
<rect x="428" y="202" width="182" height="96" rx="12" fill="#fff" stroke="#6b726e" stroke-width="1.5"/>
<text x="442" y="232" font-size="14" fill="#6b726e" text-anchor="start" font-weight="800" xml:space="preserve">memory controller</text>
<text x="442" y="256" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">talks to the RAM</text>
<rect x="16" y="334" width="608" height="56" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1.5"/>
<text x="30" y="358" font-size="13.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">GPU: draws every frame of the game.</text>
<text x="30" y="378" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">In a phone it shares the RAM with the CPU.</text>
<rect x="16" y="400" width="120" height="32" rx="9" fill="#A86700" stroke="none" stroke-width="1.5"/>
<text x="76" y="421" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">Explore</text>
<rect x="146" y="400" width="120" height="32" rx="9" fill="#fff" stroke="#A86700" stroke-width="1.5"/>
<text x="206" y="421" font-size="13" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">Quiz</text>
</svg>
