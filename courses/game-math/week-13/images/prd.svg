<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Pseudo-random distribution: the chance grows after each miss</text>
<line x1="60" y1="240" x2="480" y2="240" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round"/>
<line x1="60" y1="60" x2="60" y2="240" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round"/>
<rect x="64" y="224.7" width="27" height="15.3" rx="2" fill="#2F9E44"/>
<text x="77.5" y="255" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<rect x="99" y="209.4" width="27" height="30.6" rx="2" fill="#2F9E44"/>
<text x="112.5" y="255" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
<rect x="134" y="194.1" width="27" height="45.9" rx="2" fill="#2F9E44"/>
<text x="147.5" y="255" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
<rect x="169" y="178.8" width="27" height="61.2" rx="2" fill="#2F9E44"/>
<text x="182.5" y="255" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">4</text>
<rect x="204" y="163.5" width="27" height="76.5" rx="2" fill="#2F9E44"/>
<text x="217.5" y="255" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">5</text>
<rect x="239" y="148.2" width="27" height="91.8" rx="2" fill="#2F9E44"/>
<text x="252.5" y="255" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">6</text>
<rect x="274" y="132.9" width="27" height="107.1" rx="2" fill="#2F9E44"/>
<text x="287.5" y="255" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">7</text>
<rect x="309" y="117.6" width="27" height="122.4" rx="2" fill="#2F9E44"/>
<text x="322.5" y="255" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">8</text>
<rect x="344" y="102.3" width="27" height="137.7" rx="2" fill="#2F9E44"/>
<text x="357.5" y="255" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">9</text>
<rect x="379" y="87" width="27" height="153" rx="2" fill="#2F9E44"/>
<text x="392.5" y="255" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">10</text>
<rect x="414" y="71.7" width="27" height="168.3" rx="2" fill="#2F9E44"/>
<text x="427.5" y="255" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">11</text>
<rect x="449" y="60" width="27" height="180" rx="2" fill="#c92a2a"/>
<text x="462.5" y="255" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">12</text>
<text x="54" y="244" font-size="10.5" fill="#6b726e" text-anchor="end" font-weight="700" xml:space="preserve">0 %</text>
<text x="54" y="154" font-size="10.5" fill="#6b726e" text-anchor="end" font-weight="700" xml:space="preserve">50 %</text>
<text x="54" y="64" font-size="10.5" fill="#6b726e" text-anchor="end" font-weight="700" xml:space="preserve">100 %</text>
<text x="270" y="274" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">attacks since the last crit (N)</text>
<rect x="500" y="56" width="160" height="200" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="514" y="80" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">P(N) = C · N</text>
<text x="514" y="102.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">C = 0.085</text>
<text x="514" y="121.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">average: 25 %</text>
<text x="514" y="140.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">attack 12 is a sure</text>
<text x="514" y="156.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">crit</text>
