<text x="590" y="88" font-size="13.5" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">production</text>
<text x="590" y="110" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">all players</text>
<text x="30" y="186" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Staged rollout of version 1.1:</text>
