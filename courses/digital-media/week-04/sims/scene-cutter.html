<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Scene Cutter</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .hud { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin: 0 0 8px; font-weight: 800; }
    .sim .hud .lvl { color: var(--sim-accent); } .sim .hud .stars { margin-left: auto; }
    .sim .card { background: #fffdf5; border: 1.5px solid #e9d8a6; border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; font-weight: 600; }
    .sim .card b { color: var(--sim-accent); }
    .sim .bar { position: relative; height: 28px; background: #e9ecef; border-radius: 8px; margin: 10px 0; overflow: hidden; }
    .sim .bar .fill { position: absolute; inset: 0 auto 0 0; background: #c92a2a; transition: width 0.25s; }
    .sim .bar .fill.ok { background: #2b8a3e; }
    .sim .bar .goal { position: absolute; top: 0; bottom: 0; width: 3px; background: #2a211c; }
    .sim .bar span { position: relative; padding: 0 10px; line-height: 28px; color: #fff; font-weight: 800; font-size: 0.85rem; }
    .sim .lines { display: grid; gap: 5px; }
    .sim .ln { display: flex; justify-content: space-between; gap: 8px; text-align: left; background: #fff; color: #2a211c; border: 1.5px solid #e9ecef; box-shadow: none; padding: 7px 10px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; }
    .sim .ln small { color: var(--sim-muted); white-space: nowrap; }
    .sim .ln.cut { background: #fff5f5; border-color: #f1aeb5; color: #868e96; text-decoration: line-through; }
    .sim .ln.key { border-color: #2b8a3e; }
    .sim .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .sim .message.bad { color: #c92a2a; }
  </style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Scene Cutter</h1>
  <p class="hint">The producer of Night Owl Games wants each cutscene short. Tap a line to cut it (tap again to bring it back). Keep the goal, the obstacle and the turn of the scene card. Then press <b>Check the cut</b>.</p>
  <div class="hud"><span class="lvl" id="lvl">Scene 1 / 2</span><span id="name"></span><span class="stars" id="stars">★ 0</span></div>
  <div class="card" id="card"></div>
  <div class="bar"><div class="fill" id="fill"></div><div class="goal" id="goal"></div><span id="time"></span></div>
  <div class="lines" id="lines"></div>
  <div class="row"><button id="check" type="button">Check the cut</button><button id="reset" type="button" class="ghost">Bring all lines back</button><button id="next" type="button" hidden>Next scene ▶</button></div>
  <p id="msg" class="message">Scene 1 is the story of the lesson.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  // [text, seconds, kind]: "key" must stay (goal, obstacle, turn), "weak" should go, "" may stay or go
  const SCENES = [
    { name: "Rooftop Rescue · EXT. ROOFTOP – NIGHT", max: 35,
      card: "<b>Goal:</b> Nour wants Salma in the boat now. <b>Obstacle:</b> Salma will not leave her house. <b>Turn:</b> the water opens the door; Salma gives Nour the house key and gets in. <b>Length:</b> at most 35 seconds.",
      lines: [
        ["Rain. Salma sits on a chair on the roof, the cat in her arms.", 4, "key", "it shows the place and Salma"],
        ["NOUR: Grandma Salma! Get in the boat, quickly!", 3, "key", "it is Nour's goal"],
        ["SALMA: Hello, Nour. How is your mother?", 3, "weak", "small talk: nothing changes"],
        ["NOUR: She's fine. She's at the hill with the others.", 4, "weak", "small talk: nothing changes"],
        ["SALMA: I am not going. Fifty years I have lived in this house.", 5, "key", "it is the obstacle"],
        ["NOUR: As you know, the river has flooded the whole old city.", 5, "weak", "\"as you know\": both know it"],
        ["SALMA: Yes, I know. I can see the water.", 3, "weak", "it repeats what we see"],
        ["NOUR: I am very scared and very sad.", 3, "weak", "it says the feeling instead of showing it"],
        ["The water reaches the door below. The door opens by itself.", 4, "key", "it pushes Salma to change"],
        ["SALMA: (quietly) That door has never opened by itself.", 4, "", ""],
        ["NOUR: The house will wait for you. The water won't.", 4, "", ""],
        ["Salma takes the house key from her pocket and gives it to Nour.", 4, "key", "it is the turn"],
        ["SALMA: Lock it for me.", 2, "key", "it is the turn"],
        ["Nour helps her into the boat. The cat jumps in first.", 4, "key", "it ends the scene"],
      ] },
    { name: "Silent Station · INT. RADIO ROOM – NIGHT", max: 32,
      card: "<b>Goal:</b> Mira must call for help. <b>Obstacle:</b> one wire of the radio is missing. <b>Turn:</b> she finds Aziz's old headphones and uses their wire; a voice answers. <b>Length:</b> at most 32 seconds.",
      lines: [
        ["Smoke rises from the burnt radio. Mira opens its back.", 4, "key", "it shows the place and the problem"],
        ["MIRA: (to herself) One wire. Just one wire is missing.", 4, "key", "it is the obstacle"],
        ["MIRA: I am a radio operator, and I repair radios.", 4, "weak", "it tells us what we can already see"],
        ["She looks around the dark room.", 3, "", ""],
        ["MIRA: Where are you, Aziz? You always left your things everywhere.", 4, "", ""],
        ["MIRA: I feel very alone and afraid right now.", 3, "weak", "it says the feeling instead of showing it"],
        ["Under the desk: Aziz's old headphones. The cable is cut.", 4, "key", "it is the clue"],
        ["MIRA: As I said before, I need a wire for the radio.", 4, "weak", "\"as I said\": a repeat"],
        ["She pulls the wire from the headphones and connects it. The radio hums.", 5, "key", "it is the turn"],
        ["MIRA: (into the microphone) Station Seven calling. Can anyone hear me?", 4, "key", "it is the goal"],
        ["Static. Then a voice answers.", 3, "key", "it ends the scene"],
      ] },
  ];
  const $ = (id) => document.getElementById(id);
  let s = 0, stars = 0, tries = 0, cut = new Set(), solved = false, over = false, cur = SCENES[0];
  const total = () => cur.lines.reduce((a, l, i) => a + (cut.has(i) ? 0 : l[1]), 0);
  function paint() {
    const t = total(), full = cur.lines.reduce((a, l) => a + l[1], 0);
    $("fill").style.width = Math.min(100, t / full * 100) + "%"; $("fill").className = "fill" + (t <= cur.max ? " ok" : "");
    $("goal").style.left = (cur.max / full * 100) + "%";
    $("time").textContent = `${t} s of at most ${cur.max} s`;
    $("lines").innerHTML = "";
    cur.lines.forEach(([txt, sec], i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "ln" + (cut.has(i) ? " cut" : ""); b.dataset.i = i;
      b.innerHTML = `<span>${txt}</span><small>${sec} s</small>`;
      b.addEventListener("click", () => { if (solved) { $("msg").textContent = "This scene is done. Press Next scene."; return; } cut.has(i) ? cut.delete(i) : cut.add(i); $("msg").textContent = ""; paint(); });
      $("lines").appendChild(b);
    });
  }
  function start() {
    if (s >= SCENES.length) {
      over = true; $("lvl").textContent = "All scenes done"; $("name").textContent = ""; $("card").textContent = "Both cutscenes are short, and each still has its goal, its obstacle and its turn.";
      $("lines").innerHTML = ""; $("msg").textContent = `🎉 ★ ${stars} of ${SCENES.length * 3}.`; $("msg").className = "message good";
      $("next").hidden = false; $("next").textContent = "Play again ▶"; return;
    }
    over = false; cur = SCENES[s]; cut = new Set(); tries = 0; solved = false;
    $("lvl").textContent = `Scene ${s + 1} / ${SCENES.length}`; $("name").textContent = cur.name; $("card").innerHTML = cur.card;
    $("next").hidden = true; $("msg").textContent = s === 0 ? "Scene 1 is the story of the lesson." : ""; $("msg").className = "message";
    paint();
  }
  $("check").addEventListener("click", () => {
    if (over) { $("msg").textContent = "Press Play again."; return; }
    if (solved) { $("msg").textContent = "This scene is done. Press Next scene."; return; }
    tries++;
    const keyCut = cur.lines.findIndex((l, i) => cut.has(i) && l[2] === "key");
    if (keyCut >= 0) {
      document.querySelector(`.ln[data-i="${keyCut}"]`).classList.add("key");
      $("msg").textContent = `✗ Bring back "${cur.lines[keyCut][0].slice(0, 40)}…": ${cur.lines[keyCut][3]}. Without it the scene does not work.`; $("msg").className = "message bad"; return;
    }
    if (total() > cur.max) {
      const weak = cur.lines.findIndex((l, i) => !cut.has(i) && l[2] === "weak");
      $("msg").textContent = `✗ Still ${total()} s: too long. ` + (weak >= 0 ? `Look at "${cur.lines[weak][0].slice(0, 40)}…".` : "Cut one more line that does not move the scene.");
      $("msg").className = "message bad"; return;
    }
    solved = true; const got = tries === 1 ? 3 : tries === 2 ? 2 : 1; stars += got; $("stars").textContent = "★ " + stars;
    const left = cur.lines.filter((l, i) => !cut.has(i) && l[2] === "weak").length;
    $("msg").textContent = `✓ ${total()} s, and the goal, the obstacle and the turn are all there. ${"★".repeat(got)}` + (left ? " (A weak line is still in: you could cut it too.)" : "");
    $("msg").className = "message good"; $("next").hidden = false; $("next").textContent = s < SCENES.length - 1 ? "Next scene ▶" : "Finish ▶";
  });
  $("reset").addEventListener("click", () => { if (solved) { $("msg").textContent = "This scene is done. Press Next scene."; return; } cut = new Set(); $("msg").textContent = ""; paint(); });
  $("next").addEventListener("click", () => { if (over) { s = 0; stars = 0; $("stars").textContent = "★ 0"; } else s++; start(); });
  start();
})();
</script>
</body>
</html>
