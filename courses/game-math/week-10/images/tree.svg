<line x1="222" y1="100" x2="360" y2="56" stroke="#2a2f2c" stroke-width="1.6" stroke-linecap="round"/>
<text x="291" y="71" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">1/3</text>
