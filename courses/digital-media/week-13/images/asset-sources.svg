<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Where can the assets of a game come from?</text>
<rect x="20" y="54" width="118" height="176" rx="12" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/>
<rect x="20" y="54" width="118" height="36" rx="12" fill="#2b8a3e"/>
<rect x="20" y="78" width="118" height="12" rx="0" fill="#2b8a3e"/>
<text x="79" y="77" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Own work</text>
<text x="79" y="112" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">made by the team</text>
<text x="79" y="176" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">keep:</text>
<text x="79" y="194" font-size="11.5" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">nothing extra</text>
<rect x="150" y="54" width="118" height="176" rx="12" fill="#ffffff" stroke="#1c7ed6" stroke-width="2"/>
<rect x="150" y="54" width="118" height="36" rx="12" fill="#1c7ed6"/>
<rect x="150" y="78" width="118" height="12" rx="0" fill="#1c7ed6"/>
<text x="209" y="77" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Open asset sites</text>
<text x="209" y="112" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">CC0, CC BY, OFL</text>
<text x="209" y="176" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">keep:</text>
<text x="209" y="194" font-size="11.5" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">the licence page</text>
<rect x="280" y="54" width="118" height="176" rx="12" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<rect x="280" y="54" width="118" height="36" rx="12" fill="#7048e8"/>
<rect x="280" y="78" width="118" height="12" rx="0" fill="#7048e8"/>
<text x="339" y="77" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Paid libraries</text>
<text x="339" y="112" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">a royalty-free</text>
<text x="339" y="127" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">licence</text>
<text x="339" y="176" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">keep:</text>
<text x="339" y="194" font-size="11.5" fill="#7048e8" text-anchor="middle" font-weight="800" xml:space="preserve">the receipt and</text>
<text x="339" y="208.9" font-size="11.5" fill="#7048e8" text-anchor="middle" font-weight="800" xml:space="preserve">licence</text>
<rect x="410" y="54" width="118" height="176" rx="12" fill="#ffffff" stroke="#0c8599" stroke-width="2"/>
<rect x="410" y="54" width="118" height="36" rx="12" fill="#0c8599"/>
<rect x="410" y="78" width="118" height="12" rx="0" fill="#0c8599"/>
<text x="469" y="77" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Public domain</text>
<text x="469" y="112" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">old works, CC0</text>
<text x="469" y="176" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">keep:</text>
<text x="469" y="194" font-size="11.5" fill="#0c8599" text-anchor="middle" font-weight="800" xml:space="preserve">the date and the</text>
<text x="469" y="208.9" font-size="11.5" fill="#0c8599" text-anchor="middle" font-weight="800" xml:space="preserve">source</text>
<rect x="540" y="54" width="118" height="176" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<rect x="540" y="54" width="118" height="36" rx="12" fill="#e8590c"/>
<rect x="540" y="78" width="118" height="12" rx="0" fill="#e8590c"/>
<text x="599" y="77" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Freelancers</text>
<text x="599" y="112" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">music, art on</text>
<text x="599" y="127" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">order</text>
<text x="599" y="176" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">keep:</text>
<text x="599" y="194" font-size="11.5" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">the signed</text>
<text x="599" y="208.9" font-size="11.5" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">contract</text>
</svg>
