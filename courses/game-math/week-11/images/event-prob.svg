<text x="40" y="140" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A = “an even number” = {2, 4, 6}</text>
<text x="40" y="166" font-size="15" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">P(A) = 3 / 6 = 1/2 = 0.5 = 50 %</text>
<line x1="40" y1="220" x2="640" y2="220" stroke="#adb5bd" stroke-width="4" stroke-linecap="round"/>
<circle cx="40" cy="220" r="7" fill="#2F9E44"/>
<text x="40" y="206" font-size="13" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">0</text>
<text x="40" y="246" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">impossible: a 7</text>
<circle cx="140" cy="220" r="7" fill="#2F9E44"/>
<text x="140" y="206" font-size="13" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">1/6</text>
<text x="140" y="268" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">a 6</text>
<circle cx="340" cy="220" r="7" fill="#2F9E44"/>
<text x="340" y="206" font-size="13" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">1/2</text>
<text x="340" y="246" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">even</text>
<circle cx="640" cy="220" r="7" fill="#2F9E44"/>
<text x="640" y="206" font-size="13" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<text x="640" y="246" font-size="12" fill="#2a2f2c" text-anchor="end" font-weight="700" xml:space="preserve">certain: 1 to 6</text>
