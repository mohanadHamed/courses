<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The project: a platform report for one game</text>
<rect x="20" y="52" width="206" height="100" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<text x="34" y="84" font-size="14" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">1 The game</text>
<text x="34" y="110" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">genre, players, controls</text>
<rect x="238" y="52" width="206" height="100" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<text x="252" y="84" font-size="14" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">2 Platforms</text>
<text x="252" y="110" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">two platforms compared</text>
<rect x="456" y="52" width="206" height="100" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<text x="470" y="84" font-size="14" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">3 Specs</text>
<text x="470" y="110" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">targets and requirements</text>
<rect x="20" y="164" width="206" height="100" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<text x="34" y="196" font-size="14" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">4 Test plan</text>
<text x="34" y="222" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">devices, emulators, cases</text>
<rect x="238" y="164" width="206" height="100" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<text x="252" y="196" font-size="14" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">5 Risks</text>
<text x="252" y="222" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">performance, compatibility</text>
<rect x="456" y="164" width="206" height="100" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<text x="470" y="196" font-size="14" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">6 Publishing</text>
<text x="470" y="222" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">store rules, cloud services</text>
<text x="340" y="284" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Each part uses reliable sources, with the date.</text>
</svg>
