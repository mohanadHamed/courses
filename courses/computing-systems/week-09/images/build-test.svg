<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Building and testing for each platform</text>
<rect x="20" y="50" width="640" height="38" rx="0" fill="#A86700"/>
<text x="30" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve"></text>
<text x="280" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Android</text>
<text x="525" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">iOS</text>
<text x="30" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">main tool</text>
<text x="280" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Android Studio</text>
<text x="525" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Xcode</text>
<rect x="20" y="126" width="640" height="38" rx="0" fill="#f8f9fa"/>
<text x="30" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">runs on</text>
<text x="280" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Windows, macOS, Linux</text>
<text x="525" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">macOS only (a Mac)</text>
<text x="30" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">virtual test phone</text>
<text x="280" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Android Emulator</text>
<text x="525" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">iOS Simulator (on the Mac)</text>
<rect x="20" y="202" width="640" height="38" rx="0" fill="#f8f9fa"/>
<text x="30" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">real test phones</text>
<text x="280" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">weak, typical, strong</text>
<text x="525" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">an older and a newer iPhone</text>
<text x="30" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Unity builds</text>
<text x="280" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">on any PC</text>
<text x="525" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Xcode project, built on a Mac</text>
<rect x="20" y="50" width="640" height="228" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
