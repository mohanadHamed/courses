<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="400" fill="#ffffff"/>
<text x="20" y="32" font-size="18" fill="#2a2f2c" font-weight="800">How the worksheet works</text>
<!-- the worksheet: a sheet of paper with one experiment -->
<rect x="28" y="56" width="250" height="322" rx="10" fill="#fff8f0" stroke="#e8a46a" stroke-width="1.6"/>
<rect x="28" y="56" width="250" height="34" rx="10" fill="#ffd8a8"/>
<rect x="28" y="76" width="250" height="14" fill="#ffd8a8"/>
<text x="42" y="79" font-size="13" fill="#7a2e0b" font-weight="800">Experiment 1 · Cells</text>
<text x="42" y="114" font-size="11.5" fill="#3b3f3c">1. Click the price of the pen.</text>
<rect x="42" y="124" width="58" height="18" rx="4" fill="#ffe2c2"/>
<text x="71" y="137" font-size="9.5" fill="#7a2e0b" text-anchor="middle" font-weight="800">RESULT</text>
<line x1="106" y1="141" x2="262" y2="141" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="120" y="138" font-size="14" fill="#1c5fb8" font-style="italic" font-weight="700">B3</text>
<text x="42" y="170" font-size="11.5" fill="#3b3f3c">2. Type B2:B4 in the Name Box.</text>
<rect x="42" y="180" width="58" height="18" rx="4" fill="#ffe2c2"/>
<text x="71" y="193" font-size="9.5" fill="#7a2e0b" text-anchor="middle" font-weight="800">RESULT</text>
<line x1="106" y1="197" x2="262" y2="197" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="120" y="194" font-size="14" fill="#1c5fb8" font-style="italic" font-weight="700">Sum 14.5</text>
<text x="42" y="232" font-size="12" fill="#7a2e0b" font-weight="800">Table of results</text>
<rect x="42" y="242" width="220" height="112" rx="4" fill="#ffffff" stroke="#e8a46a" stroke-width="1.2"/>
<line x1="42" y1="270" x2="262" y2="270" stroke="#e8a46a" stroke-width="1.2"/>
<line x1="42" y1="298" x2="262" y2="298" stroke="#f0c9a4" stroke-width="1"/>
<line x1="42" y1="326" x2="262" y2="326" stroke="#f0c9a4" stroke-width="1"/>
<text x="52" y="261" font-size="10.5" fill="#7a2e0b" font-weight="800">What</text>
<text x="170" y="261" font-size="10.5" fill="#7a2e0b" font-weight="800">Your result</text>
<text x="52" y="289" font-size="10.5" fill="#3b3f3c">The address</text>
<text x="170" y="289" font-size="12" fill="#1c5fb8" font-style="italic" font-weight="700">B3</text>
<text x="52" y="317" font-size="10.5" fill="#3b3f3c">The Sum</text>
<text x="170" y="317" font-size="12" fill="#1c5fb8" font-style="italic" font-weight="700">14.5</text>
<!-- the three moves -->
<rect x="318" y="62" width="340" height="86" rx="14" fill="#fff4e6" stroke="#f08c3c" stroke-width="1.6"/>
<circle cx="350" cy="105" r="18" fill="#d9480f"/>
<text x="350" y="111" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800">1</text>
<text x="380" y="98" font-size="16" fill="#7a2e0b" font-weight="800">Do the step</text>
<text x="380" y="120" font-size="12" fill="#4a4f4b">on the computer: Word, Excel,</text>
<text x="380" y="136" font-size="12" fill="#4a4f4b">PowerPoint, an AI tool or a simulator</text>
<!-- a small screen -->
<rect x="600" y="78" width="46" height="32" rx="4" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<rect x="606" y="84" width="34" height="5" rx="1" fill="#ffc078"/>
<rect x="606" y="93" width="22" height="4" rx="1" fill="#f0c9a4"/>
<rect x="606" y="100" width="28" height="4" rx="1" fill="#f0c9a4"/>
<path d="M 614 110 L 632 110 L 636 122 L 610 122 Z" fill="#d9480f"/>
<rect x="318" y="164" width="340" height="86" rx="14" fill="#fff4e6" stroke="#f08c3c" stroke-width="1.6"/>
<circle cx="350" cy="207" r="18" fill="#d9480f"/>
<text x="350" y="213" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800">2</text>
<text x="380" y="200" font-size="16" fill="#7a2e0b" font-weight="800">Write your result</text>
<text x="380" y="222" font-size="12" fill="#4a4f4b">in the box after the step: a value,</text>
<text x="380" y="238" font-size="12" fill="#4a4f4b">a formula, a file name, what you see</text>
<!-- a pencil, drawn at an angle -->
<path d="M 604 236 L 636 196 L 646 204 L 614 244 Z" fill="#ffc078" stroke="#d9480f" stroke-width="1.6"/>
<path d="M 604 236 L 614 244 L 600 250 Z" fill="#7a2e0b"/>
<rect x="318" y="266" width="340" height="86" rx="14" fill="#fff4e6" stroke="#f08c3c" stroke-width="1.6"/>
<circle cx="350" cy="309" r="18" fill="#d9480f"/>
<text x="350" y="315" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800">3</text>
<text x="380" y="302" font-size="16" fill="#7a2e0b" font-weight="800">Check it</text>
<text x="380" y="324" font-size="12" fill="#4a4f4b">at the end of the worksheet, or with</text>
<text x="380" y="340" font-size="12" fill="#4a4f4b">"Check your result" on the page</text>
<!-- a check mark in a circle -->
<circle cx="622" cy="309" r="20" fill="#ffffff" stroke="#2f9e44" stroke-width="2.4"/>
<polyline points="612,310 619,318 633,300" fill="none" stroke="#2f9e44" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<!-- arrows between the moves -->
<path d="M 488 148 L 488 162" stroke="#d9480f" stroke-width="2.4"/>
<path d="M 482 156 L 488 163 L 494 156" fill="none" stroke="#d9480f" stroke-width="2.4"/>
<path d="M 488 250 L 488 264" stroke="#d9480f" stroke-width="2.4"/>
<path d="M 482 258 L 488 265 L 494 258" fill="none" stroke="#d9480f" stroke-width="2.4"/>
<path d="M 282 210 L 312 210" stroke="#e8a46a" stroke-width="2" stroke-dasharray="4 4"/>
<text x="318" y="380" font-size="12" fill="#4a4f4b">At the end: copy your key results into the Table of results.</text>
</svg>
