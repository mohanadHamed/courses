<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="440" fill="#ffffff"/>
<text x="16" y="30" font-size="19" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Tilt Lab</text>
<text x="16" y="52" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">Tilt your phone (or drag the pad). Watch the accelerometer and the gyroscope.</text>
<rect x="16" y="70" width="360" height="280" rx="14" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
<circle cx="196" cy="210" r="120" fill="#fff" stroke="#dee2e6" stroke-width="2"/>
<circle cx="250" cy="180" r="18" fill="#A86700" stroke="none" stroke-width="1.5"/>
<circle cx="196" cy="210" r="6" fill="#adb5bd" stroke="none" stroke-width="1.5"/>
<rect x="392" y="80" width="232" height="54" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1.5"/>
<text x="406" y="100" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">accelerometer x</text>
<text x="406" y="122" font-size="17" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">3.1</text>
<rect x="392" y="144" width="232" height="54" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1.5"/>
<text x="406" y="164" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">accelerometer y</text>
<text x="406" y="186" font-size="17" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">−2.0</text>
<rect x="392" y="208" width="232" height="54" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1.5"/>
<text x="406" y="228" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">accelerometer z</text>
<text x="406" y="250" font-size="17" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">8.9</text>
<rect x="392" y="272" width="232" height="54" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1.5"/>
<text x="406" y="292" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">gyroscope (turning)</text>
<text x="406" y="314" font-size="17" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">0 °/s</text>
<text x="16" y="380" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Source: drag pad (on a phone: Use the sensors)</text>
<rect x="16" y="396" width="170" height="32" rx="9" fill="#A86700" stroke="none" stroke-width="1.5"/>
<text x="101" y="417" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">Use the sensors</text>
</svg>
