<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Test Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .hud { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin: 0 0 8px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .sim .hud .lvl { color: var(--sim-accent); }
    .sim .hud .stars { margin-left: auto; }
    .sim .ticket { display: flex; gap: 10px; align-items: center; font-size: 1.05rem; font-weight: 800; background: #fff9db; border: 1.5px dashed #f59f00; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; min-height: 2.2em; }
    .sim .ticket .who { font-size: 0.78rem; color: var(--sim-muted); font-weight: 700; white-space: nowrap; }
    .sim .devices { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .sim .dev { text-align: left; background: #fff; color: var(--sim-fg); border: 2px solid #dee2e6; border-radius: 14px; padding: 10px 12px; box-shadow: none; font-weight: 600; cursor: pointer; }
    .sim .dev:hover { border-color: var(--sim-accent); }
    .sim .dev h2 { font-size: 1rem; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 6px; }
    .sim .dev h2 small { color: var(--sim-muted); font-size: 0.75rem; }
    .sim .dev dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; margin: 0; font-size: 0.86rem; }
    .sim .dev dt { color: var(--sim-muted); font-weight: 700; }
    .sim .dev dd { margin: 0; font-weight: 800; }
    .sim .dev.good { border-color: #2b8a3e; background: #ebfbee; }
    .sim .dev.bad { border-color: #e03131; background: #fff5f5; }
    .sim .message.bad { color: #c92a2a; }
    .sim .pad { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  </style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Test Lab</h1>
  <p class="hint">The testers of Byte Bay send requests. Read the spec sheets and tap the device that answers each request.</p>
  <div class="hud"><span class="lvl" id="lvl">Request 1</span><span class="stars" id="stars">★ 0</span></div>
  <div class="ticket" aria-live="polite"><span class="who" id="who">Tester</span><span id="ask"></span></div>
  <div class="devices" id="devices"></div>
  <p id="msg" class="message">Tap a device.</p>
  <div class="pad"><button id="next" type="button" hidden>Next request ▶</button><button id="sound" type="button" class="ghost">Sound: on</button></div>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DEVICES = [
    { id: "L1", name: "Laptop L1", os: "Windows 11", lines: [["Processor", "8 cores (4 perf. + 4 eff.), up to 4.4 GHz"], ["Memory", "16 GB"], ["Storage", "512 GB SSD · 120 GB free"], ["Graphics", "GPU inside the processor"]] },
    { id: "P1", name: "Phone P1", os: "Android 14", lines: [["Chipset", "8 cores, up to 3.0 GHz"], ["RAM", "8 GB"], ["Storage", "256 GB · 40 GB free"], ["OS", "Android 14"]] },
    { id: "P2", name: "Phone P2", os: "iOS 17", lines: [["Chip", "6 cores (2 perf. + 4 eff.)"], ["RAM", "not given"], ["Storage", "128 GB · 3 GB free"], ["OS", "iOS 17"]] },
  ];
  const TICKETS = [
    ["Mia (tester)", "Which device has the most RAM?", "L1", "16 GB is more than 8 GB, and P2 does not show its RAM."],
    ["Omar (tester)", "The 5 GB update must go on a phone. Which phone has room for it?", "P1", "P1 has 40 GB free; P2 has only 3 GB free."],
    ["Lina (tester)", "Which spec sheet does not show the RAM?", "P2", "Apple does not print the RAM of an iPhone."],
    ["Sami (tester)", "I need an Android phone. Which one?", "P1", "The OS line of P1 says Android 14."],
    ["Mia (tester)", "Which device has the fastest core?", "L1", "Up to 4.4 GHz is faster than 3.0 GHz."],
    ["Omar (tester)", "Which device has the smallest storage capacity?", "P2", "128 GB is the smallest capacity."],
    ["Lina (tester)", "A 50 GB test build must be copied. Which device has room for it?", "L1", "Only L1 has more than 50 GB free (120 GB)."],
    ["Sami (tester)", "Which device has 6 cores?", "P2", "The Chip line of P2 says 6 cores."],
  ];
  let t = 0, stars = 0, missed = false, locked = false, sound = true, audio = null;
  $("devices").innerHTML = DEVICES.map((d) => `<button type="button" class="dev" data-id="${d.id}"><h2>${d.name}<small>${d.os}</small></h2><dl>${d.lines.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></button>`).join("");
  const cards = [...document.querySelectorAll(".dev")];
  function beep(f, d, type = "triangle") {
    if (!sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain(); o.type = type; o.frequency.value = f; g.gain.value = 0.07;
      o.connect(g); g.connect(audio.destination); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + d); o.start(); o.stop(audio.currentTime + d);
    } catch (_) {}
  }
  function show() {
    cards.forEach((c) => c.classList.remove("good", "bad"));
    if (t >= TICKETS.length) {
      $("lvl").textContent = "All requests done"; $("who").textContent = "Lab"; $("ask").textContent = `Every tester has a device. Score: ★ ${stars} of ${TICKETS.length}.`;
      $("msg").textContent = "Press “Play again” to start over."; $("msg").className = "message good";
      $("next").hidden = false; $("next").textContent = "Play again ▶"; return;
    }
    const [who, ask] = TICKETS[t];
    $("lvl").textContent = `Request ${t + 1} / ${TICKETS.length}`; $("who").textContent = who; $("ask").textContent = ask;
    $("msg").textContent = "Tap a device."; $("msg").className = "message";
    $("next").hidden = true; missed = false; locked = false;
  }
  cards.forEach((c) => c.addEventListener("click", () => {
    if (t >= TICKETS.length) return;
    if (locked) { $("msg").textContent = "Done. Press Next request."; return; }
    const [, , want, why] = TICKETS[t];
    cards.forEach((x) => x.classList.remove("bad"));
    if (c.dataset.id === want) {
      c.classList.add("good"); locked = true;
      if (!missed) { stars++; $("stars").textContent = "★ " + stars; }
      $("msg").textContent = "✓ Sent! " + why; $("msg").className = "message good";
      $("next").hidden = false; $("next").textContent = "Next request ▶"; beep(880, 0.12);
    } else {
      c.classList.add("bad"); missed = true;
      $("msg").textContent = "✗ Not this one. Read the line that the request is about, then try again."; $("msg").className = "message bad";
      beep(200, 0.25, "sawtooth");
    }
  }));
  $("next").addEventListener("click", () => { if (t >= TICKETS.length) { t = 0; stars = 0; $("stars").textContent = "★ 0"; } else t++; show(); });
  $("sound").addEventListener("click", () => { sound = !sound; $("sound").textContent = "Sound: " + (sound ? "on" : "off"); });
  show();
})();
</script>
</body>
</html>
