<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The export (Deliver) settings</text>
<rect x="20" y="52" width="360" height="230" rx="10" fill="#2b2a33"/>
<text x="36" y="82" font-size="12" fill="#adb5bd" text-anchor="start" font-weight="700" xml:space="preserve">File name</text>
<rect x="170" y="66" width="196" height="22" rx="4" fill="#3b3a45"/>
<text x="178" y="82" font-size="12" fill="#ffffff" text-anchor="start" font-weight="700" xml:space="preserve">rooftop-trailer-v1</text>
<text x="36" y="110" font-size="12" fill="#adb5bd" text-anchor="start" font-weight="700" xml:space="preserve">Format</text>
<rect x="170" y="94" width="196" height="22" rx="4" fill="#3b3a45"/>
<text x="178" y="110" font-size="12" fill="#ffffff" text-anchor="start" font-weight="700" xml:space="preserve">MP4</text>
<text x="36" y="138" font-size="12" fill="#adb5bd" text-anchor="start" font-weight="700" xml:space="preserve">Codec</text>
<rect x="170" y="122" width="196" height="22" rx="4" fill="#3b3a45"/>
<text x="178" y="138" font-size="12" fill="#ffffff" text-anchor="start" font-weight="700" xml:space="preserve">H.264</text>
<text x="36" y="166" font-size="12" fill="#adb5bd" text-anchor="start" font-weight="700" xml:space="preserve">Resolution</text>
<rect x="170" y="150" width="196" height="22" rx="4" fill="#3b3a45"/>
<text x="178" y="166" font-size="12" fill="#ffffff" text-anchor="start" font-weight="700" xml:space="preserve">1920 × 1080</text>
<text x="36" y="194" font-size="12" fill="#adb5bd" text-anchor="start" font-weight="700" xml:space="preserve">Frame rate</text>
<rect x="170" y="178" width="196" height="22" rx="4" fill="#3b3a45"/>
<text x="178" y="194" font-size="12" fill="#ffffff" text-anchor="start" font-weight="700" xml:space="preserve">30</text>
<text x="36" y="222" font-size="12" fill="#adb5bd" text-anchor="start" font-weight="700" xml:space="preserve">Quality</text>
<rect x="170" y="206" width="196" height="22" rx="4" fill="#3b3a45"/>
<text x="178" y="222" font-size="12" fill="#ffffff" text-anchor="start" font-weight="700" xml:space="preserve">10 Mbit/s</text>
<text x="36" y="250" font-size="12" fill="#adb5bd" text-anchor="start" font-weight="700" xml:space="preserve">Audio</text>
<rect x="170" y="234" width="196" height="22" rx="4" fill="#3b3a45"/>
<text x="178" y="250" font-size="12" fill="#ffffff" text-anchor="start" font-weight="700" xml:space="preserve">AAC, 48 kHz</text>
<rect x="400" y="52" width="260" height="230" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="414" y="76" font-size="14" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Check before you export</text>
<text x="414" y="92" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Resolution and frame rate the same</text>
<text x="414" y="107.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">as the project.</text>
<text x="414" y="136" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The codec the target can play (H.264</text>
<text x="414" y="151.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">in MP4 almost everywhere).</text>
<text x="414" y="180" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">A clear file name with a version, then</text>
<text x="414" y="195.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">watch the whole file once.</text>
</svg>
