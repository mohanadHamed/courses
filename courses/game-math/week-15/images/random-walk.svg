<text x="334" y="102.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">1. Choose one of four directions at random.</text>
<text x="334" y="121.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">2. Move one tile (stay inside the border).</text>
<text x="334" y="140.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">3. Make that tile floor.</text>
<text x="334" y="159.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">More steps give a bigger cave; the same seed gives</text>
<text x="334" y="176.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the same cave.</text>
