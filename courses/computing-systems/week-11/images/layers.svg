<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Protocols in four layers (the TCP/IP model)</text>
<rect x="20" y="52" width="410" height="54" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
<text x="34" y="74" font-size="14" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">Application</text>
<text x="34" y="94" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">HTTPS, DNS, the game&#x27;s own messages</text>
<text x="450" y="84" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">what the app wants to say</text>
<rect x="20" y="114" width="410" height="54" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text x="34" y="136" font-size="14" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">Transport</text>
<text x="34" y="156" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">TCP or UDP, with a port number</text>
<text x="450" y="146" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">which app, and how reliable</text>
<rect x="20" y="176" width="410" height="54" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
<text x="34" y="198" font-size="14" fill="#7048e8" text-anchor="start" font-weight="800" xml:space="preserve">Internet</text>
<text x="34" y="218" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">IP addresses; routers forward the packet</text>
<text x="450" y="208" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">which device in the world</text>
<rect x="20" y="238" width="410" height="54" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/>
<text x="34" y="260" font-size="14" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Link</text>
<text x="34" y="280" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Ethernet cable or Wi-Fi</text>
<text x="450" y="270" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">the next device on the way</text>
<line x1="436" y1="64" x2="436" y2="272" stroke="#868e96" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="436,280 431.6,271.1 440.4,271.1" fill="#868e96"/>
<text x="20" y="310" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Sending: each layer adds its own header (like an envelope in an envelope). Receiving: in the reverse order.</text>
</svg>
