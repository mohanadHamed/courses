<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Timeline Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 5px 0; font-weight: 700; font-size: .9rem; }
    .sim .bar > span.l { min-width: 92px; }
    .sim canvas { cursor: pointer; }
    .sim .task { font-weight: 800; color: var(--sim-accent); margin: 6px 0 0; }
  </style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Timeline Lab: a first cut of the teaser</h1>
  <p class="hint">Build a short teaser of <i>Rooftop Rescue</i>. Add clips from the media pool, move the playhead, split and delete, add a title and music. Tap a clip on the timeline to select it.</p>
  <div class="bar"><span class="l">Media pool</span><span id="pool" style="display:contents"></span></div>
  <canvas id="c" aria-label="The viewer and the timeline"></canvas>
  <div class="bar" id="ph"></div>
  <div class="bar"><span class="l">Edit</span><span id="tools" style="display:contents"></span></div>
  <p class="calc" id="calc"></p>
  <p class="task" id="task"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script src="scene.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // Each source: its length (s), its colour on the timeline and its look in the viewer.
  const SRC = {
    "rooftop.mp4": { len: 6, col: "#1c7ed6", look: { sky: "#a5d8ff" } },
    "boat-chase.mp4": { len: 9, col: "#0c8599", look: { sky: "#99e9f2" } },
    "pasha.mp4": { len: 5, col: "#e8590c", look: { sky: "#ffd8a8" } },
  };
  const s = { v1: [], v2: [], a1: [], ph: 0, sel: null, did: {} };
  const end = (tr) => tr.reduce((m, c) => Math.max(m, c.at + c.len), 0);
  const vlen = () => end(s.v1);
  function rippleV1() { let t = 0; s.v1.forEach((c) => { c.at = t; t += c.len; }); }
  function add(name) {
    if (name === "title") { s.v2.push({ name: "TITLE", at: s.ph, len: 3, col: "#9c36b5", from: 0 }); s.did.title = s.ph < 0.5; }
    else if (name === "music.wav") { s.a1 = [{ name: "music", at: 0, len: 20, col: "#2b8a3e", from: 0 }]; }
    else s.v1.push({ name, at: vlen(), len: SRC[name].len, col: SRC[name].col, from: 0, src: name });
    upd();
  }
  function hit(t) { return s.v1.find((c) => t >= c.at && t < c.at + c.len); }
  function split() {
    const c = hit(s.ph);
    if (!c || s.ph - c.at < 0.5 || c.at + c.len - s.ph < 0.5) { msg("Put the playhead inside a V1 clip (not at its edge), then split."); return; }
    const i = s.v1.indexOf(c), cut = s.ph - c.at;
    const b = { ...c, at: s.ph, len: c.len - cut, from: c.from + cut };
    c.len = cut; s.v1.splice(i + 1, 0, b); s.did.split = true; s.sel = b; upd();
  }
  function del() {
    if (!s.sel) { msg("Tap a clip on the timeline first."); return; }
    for (const k of ["v1", "v2", "a1"]) { const i = s[k].indexOf(s.sel); if (i >= 0) s[k].splice(i, 1); }
    if (s.v1.includes(s.sel) === false) rippleV1();
    s.did.del = true; s.sel = null; upd();
  }
  function trim(dt) {
    const c = s.sel; if (!c) { msg("Tap a clip on the timeline first."); return; }
    c.len = Math.max(1, c.len + dt); if (s.v1.includes(c)) rippleV1(); upd();
  }
  const TASKS = [
    { q: "Task 1: Add rooftop, boat-chase and pasha to V1 (in this order).", ok: () => s.v1.map((c) => c.src).join() === "rooftop.mp4,boat-chase.mp4,pasha.mp4" },
    { q: "Task 2: The boat chase is too long. Put the playhead in it, split it, and delete one part, so that the teaser is 15 s or shorter.", ok: () => s.did.split && s.did.del && vlen() <= 15 && vlen() >= 8 },
    { q: "Task 3: Move the playhead to 0 and add the title on V2.", ok: () => s.v2.some((c) => c.at < 0.5) },
    { q: "Task 4: Add the music on A1 and trim it so that it ends with the video.", ok: () => s.a1.length && Math.abs(end(s.a1) - vlen()) < 0.6 },
  ];
  let ti = 0;
  function msg(t) { $("msg").textContent = t; }
  Kit.buttons($("pool"), ["rooftop.mp4", "boat-chase.mp4", "pasha.mp4", "title", "music.wav"].map((k) => ({ k, label: "+ " + k })), add);
  Kit.buttons($("tools"), [{ k: "split", label: "Split at playhead" }, { k: "del", label: "Delete (ripple)" }, { k: "t-", label: "Trim end −1 s" }, { k: "t+", label: "Trim end +1 s" }], (k) => (k === "split" ? split() : k === "del" ? del() : trim(k === "t-" ? -1 : 1)));
  const phIn = Kit.slider($("ph"), "Playhead", 0, 25, 0.5, 0, (v) => { s.ph = v; upd(true); }, (v) => v.toFixed(1) + " s");
  function upd(quiet) {
    $("calc").textContent = `V1: ${s.v1.length} clip(s), video ${vlen()} s · V2: ${s.v2.length ? "title" : "—"} · A1: ${s.a1.length ? "music " + end(s.a1) + " s" : "—"}${s.sel ? " · selected: " + s.sel.name : ""}`;
    let m = "";
    while (ti < TASKS.length && TASKS[ti].ok()) { ti++; m = "✓ Done."; Kit.good(); }
    $("task").textContent = ti < TASKS.length ? TASKS[ti].q : "All tasks are done: a first cut with a title and music. Next: transitions and export (lecture 21).";
    if (m) msg(m); else if (!quiet) msg(s.a1.length && end(s.a1) > vlen() + 0.5 ? "The music is longer than the video: select it and trim its end." : "");
  }
  const cv = Kit.canvas($("c"), (W) => Math.min(380, W * 0.66));
  const geo = () => { const W = cv.W, H = cv.H, vh = H * 0.5, x0 = 44, x1 = W - 8, ty = vh + 22, th = (H - ty - 6) / 3; return { W, H, vh, x0, x1, ty, th, X: (t) => x0 + (x1 - x0) * t / 25 }; };
  cv.el.addEventListener("click", (e) => {
    const r = cv.el.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, g = geo();
    if (y < g.ty) return;
    const row = Math.floor((y - g.ty) / g.th), tr = [s.v2, s.v1, s.a1][row], t = (x - g.x0) / (g.x1 - g.x0) * 25;
    if (!tr) return;
    s.sel = tr.find((c) => t >= c.at && t < c.at + c.len) || null;
    if (!s.sel) { s.ph = Math.max(0, Math.min(25, Math.round(t * 2) / 2)); phIn.value = s.ph; phIn.dispatchEvent(new Event("input")); }
    upd();
  });
  Kit.loop((now) => {
    const c = cv.ctx, g = geo();
    c.fillStyle = "#2b2a33"; c.fillRect(0, 0, g.W, g.H);
    const vw = Math.min(g.W - 20, g.vh * 16 / 9 - 10), vhh = vw * 9 / 16, vx = (g.W - vw) / 2, vy = 6;
    const clip = hit(s.ph);
    if (clip) RS.draw(c, vx, vy, vw, vhh, s.ph - clip.at + clip.from + (clip.src === "boat-chase.mp4" ? 2 : 0), SRC[clip.src].look);
    else { c.fillStyle = "#000"; c.fillRect(vx, vy, vw, vhh); Kit.text(c, "no clip at the playhead", g.W / 2, vy + vhh / 2, 13, "#868e96"); }
    if (s.v2.some((t) => s.ph >= t.at && s.ph < t.at + t.len)) { Kit.text(c, "ROOFTOP RESCUE", g.W / 2, vy + vhh * 0.3, Math.max(14, vw / 14), "#ffffff"); }
    ["V2", "V1", "A1"].forEach((n, i) => { const y = g.ty + i * g.th; c.fillStyle = "#3b3a45"; c.fillRect(g.x0, y + 2, g.x1 - g.x0, g.th - 4); Kit.text(c, n, 20, y + g.th / 2 + 4, 12, "#e9ecef"); });
    for (let t = 0; t <= 25; t += 5) Kit.text(c, t + "s", g.X(t), g.ty - 6, 10, "#adb5bd");
    [s.v2, s.v1, s.a1].forEach((tr, i) => tr.forEach((cl) => {
      const y = g.ty + i * g.th;
      Kit.rrect(c, g.X(cl.at) + 1, y + 4, g.X(cl.at + cl.len) - g.X(cl.at) - 2, g.th - 8, 4, cl.col, cl === s.sel ? "#ffd43b" : null, 3);
      c.save(); c.beginPath(); c.rect(g.X(cl.at), y, g.X(cl.at + cl.len) - g.X(cl.at), g.th); c.clip();
      Kit.text(c, cl.name.replace(".mp4", ""), g.X(cl.at) + 6, y + g.th / 2 + 4, 11, "#fff", "left"); c.restore();
    }));
    const px = g.X(s.ph);
    c.strokeStyle = "#ff6b6b"; c.lineWidth = 2.5; c.beginPath(); c.moveTo(px, g.ty - 2); c.lineTo(px, g.H - 4); c.stroke();
  });
  window.TLB = { add, split, del, trim, ph: (v) => { phIn.value = v; phIn.dispatchEvent(new Event("input")); }, sel: (k, i) => { s.sel = s[k][i] || null; upd(); } };
  upd();
})();
</script>
</body>
</html>
