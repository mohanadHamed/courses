# 16-week schedule (titles from the official syllabus weekly table).
# The course page lists every lesson from this file. A lesson is ready (bright,
# with links) when week-NN/lesson-NN.qmd exists and has no `draft: true`;
# otherwise it is shown faded as "coming soon".
# Lessons are numbered across the course (week 1 → 01–02, week 2 → 03–04, ...).
weeks:
  - week: 1
    ilos: [A1]
    plos: [1]
    lessons:
      - {n: 1, title: "Mathematics in Game Development and Coordinate Systems", ilos: [A1]}
      - {n: 2, title: "Vectors: Definition, Components and Basic Operations", ilos: [A1]}
  - week: 2
    ilos: [A1, B1]
    plos: [1]
    lessons:
      - {n: 3, title: "Vector Operations: Addition, Scaling, Magnitude and Normalization", ilos: [A1, B1]}
      - {n: 4, title: "The Dot Product and the Angle Between Vectors", ilos: [A1, B1]}
  - week: 3
    ilos: [B1]
    plos: [1]
    lessons:
      - {n: 5, title: "The Cross Product: Direction and Surface Normals", ilos: [B1]}
      - {n: 6, title: "Distance, Projection and Direction in Game Worlds", ilos: [B1]}
  - week: 4
    ilos: [A2, B1]
    plos: [1]
    lessons:
      - {n: 7, title: "Trigonometry: Sine, Cosine, Tangent and the Unit Circle", ilos: [A2]}
      - {n: 8, title: "Applied Trigonometry: Angles, Rotation and Oscillating Motion", ilos: [A2, B1]}
  - week: 5
    ilos: [A1, C1]
    plos: [1]
    lessons:
      - {n: 9, title: "Matrices: Definition and Basic Operations", ilos: [A1]}
      - {n: 10, title: "Matrix Multiplication, the Identity and the Inverse", ilos: [A1, C1]}
  - week: 6
    ilos: [C1]
    plos: [1]
    lessons:
      - {n: 11, title: "Translation and Scaling Transformations", ilos: [C1]}
      - {n: 12, title: "Rotation in 2D", ilos: [C1]}
  - week: 7
    ilos: [C1]
    plos: [1]
    lessons:
      - {n: 13, title: "Homogeneous Coordinates and Transformation Matrices", ilos: [C1]}
      - {n: 14, title: "3D Transformations: Translation, Rotation and Scaling", ilos: [C1]}
  - week: 8
    ilos: [A1, A2, B1, C1]
    plos: [1]
    exam: "Midterm exam"
    lessons:
      - {n: 15, title: "Revision of Weeks 1–7", ilos: [A1, A2, B1, C1]}
  - week: 9
    ilos: [A2, B2]
    plos: [1, 2]
    lessons:
      - {n: 17, title: "Mathematical Logic: Propositions and Logical Operators", ilos: [A2]}
      - {n: 18, title: "Truth Tables and Logical Conditions in Game Rules", ilos: [A2, B2]}
  - week: 10
    ilos: [B2]
    plos: [1, 2]
    lessons:
      - {n: 19, title: "Boolean Algebra and Decision Conditions", ilos: [B2]}
      - {n: 20, title: "Applying Logic to Game Rules and Decisions", ilos: [B2]}
  - week: 11
    ilos: [A2, B2]
    plos: [1, 2]
    lessons:
      - {n: 21, title: "Probability Basics: Events and Sample Space", ilos: [A2]}
      - {n: 22, title: "Conditional Probability and Expected Value", ilos: [A2, B2]}
  - week: 12
    ilos: [C2]
    plos: [1, 2]
    lessons:
      - {n: 23, title: "Random Numbers: Pseudo-Random Generators and Seeds", ilos: [C2]}
      - {n: 24, title: "Random Distributions: Uniform and Weighted", ilos: [C2]}
  - week: 13
    ilos: [C2]
    plos: [1, 2]
    lessons:
      - {n: 25, title: "Probability for Game Balance: Drop Rates and Difficulty", ilos: [C2]}
      - {n: 26, title: "Randomness and Fairness: The Player's Perception", ilos: [C2]}
  - week: 14
    ilos: [B1, C1, D1]
    plos: [1, 4]
    lessons:
      - {n: 27, title: "Applied Problem Set: Vectors, Transformations and Probability", ilos: [B1, C1]}
      - {n: 28, title: "Case Study: Movement of a 2D Object", ilos: [B1, C1, D1]}
  - week: 15
    ilos: [C2, D1]
    plos: [1, 2, 4]
    lessons:
      - {n: 29, title: "Case Study: Random Level and Event Generation", ilos: [C2]}
      - {n: 30, title: "Course Revision", ilos: [C2, D1]}
  - week: 16
    ilos: [All]
    plos: [1, 2, 4]
    exam: "Final exam"
