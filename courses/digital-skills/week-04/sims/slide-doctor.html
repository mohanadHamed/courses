<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Slide Doctor</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .pad button { text-align: left; }</style>
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Slide Doctor</h1>
  <p class="hint">Huda checks the slides of the Sunrise team before a meeting. Each slide has one problem. Choose the best fix.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script src="slide-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const LONG = ["Our shop will be open from nine in the morning until eight in the evening from Sunday to Thursday", "On Friday the shop will be closed for the whole day because of the weekly holiday", "On Saturday the shop will open later, at ten, and close at six in the evening", "The new hours start on the first day of next month for all staff and customers", "Please tell every customer about the new hours when they pay at the shop", "Rana will put a big notice on the door of the shop next week", "Questions: call Huda"];
  const rounds = [
    { s: { layout: "Title and Content", theme: "Sunrise", title: "New shop hours", body: LONG }, fix: { body: ["Sun–Thu: 9:00–20:00", "Friday: closed", "Saturday: 10:00–18:00", "From 1 December"] },
      goal: "Slide 2 has seven long sentences. What is the best fix?", choices: C(["keep a few short points, say the rest", "make the font smaller", "add more sentences", "change the theme"]), answer: "keep a few short points, say the rest",
      good: "3–5 short points; the speaker says the details. The audience listens instead of reading.", why: { "make the font smaller": "Then nobody can read it from the back of the room." } },
    { s: { layout: "Title and Content", theme: "Sky", title: "Sales this month", body: ["Paper: 75 JD", "Drinks: 50 JD", "Bags: 60 JD"], contrast: "low" }, fix: { contrast: "" },
      goal: "The text is light grey on light blue. People at the back cannot read it. Fix?", choices: C(["dark text on a light background (strong contrast)", "a bigger slide", "bold only the title", "add a picture"]), answer: "dark text on a light background (strong contrast)",
      good: "Strong contrast (dark on light, or light on dark) can be read from far and by people with weak eyes.", why: {} },
    { s: { layout: "Title and Content", theme: "Sunrise", title: "Our new shop", body: ["Opens 1 December", "Near the bus stop"], pic: true, stretch: true }, fix: { stretch: false },
      goal: "The photo of the shop looks too tall and thin. What went wrong?", choices: C(["it was stretched: resize it from a corner", "it is too small", "it needs a frame", "it needs alt text only"]), answer: "it was stretched: resize it from a corner",
      good: "Drag a corner handle (not a side) so that the picture keeps its shape.", why: {} },
    { s: { layout: "Title and Content", theme: "Night", title: "Our new shop", body: ["Opens 1 December", "Near the bus stop"], pic: true }, fix: {},
      goal: "A colleague uses a screen reader. What must the photo have?", choices: C(["alt text that describes it", "a bigger size", "an animation", "a border"]), answer: "alt text that describes it",
      good: "Right-click › View Alt Text: “The new Sunrise shop next to the bus stop.”", why: {} },
    { s: { layout: "Title and Content", theme: "Plain", title: "Thank you!", body: ["Questions?"] }, fix: { layout: "Title Slide" },
      goal: "The last slide only says “Thank you! Questions?” but has an empty content box style. Which layout fits?", choices: C(["Title Slide (or Section Header)", "Two Content", "Title and Content", "Blank with a table"]), answer: "Title Slide (or Section Header)",
      good: "A short slide with one big message uses a title layout: large and centred.", why: {} },
  ];
  rounds.forEach((r) => { r.after = { ...r.s, ...r.fix }; });
  Kit.game({
    rounds, cols: 1, colsPhone: 1, animMs: 700, still: true,
    intro: "Round 1 is the story of the lesson: the slide about the new opening hours.",
    canvas: (W) => Math.min(300, W * 9 / 16 * 0.8) + 10,
    draw(c, W, H, now, r, st) {
      c.fillStyle = "#fff"; c.fillRect(0, 0, W, H);
      if (!r) return;
      const w = Math.min(W - 10, (H - 10) * 16 / 9);
      SK.draw(c, (W - w) / 2, 5, w, st.done && st.ok ? r.after : r.s);
    },
  });
})();
</script>
</body>
</html>
