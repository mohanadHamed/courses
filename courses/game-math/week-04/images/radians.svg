<text x="227.5" y="188" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">radius 1</text>
<circle cx="170" cy="170" r="4" fill="#2a2f2c" stroke="none" stroke-width="1.5"/>
<text x="340" y="62" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Degrees and radians</text>
<rect x="340" y="76" width="260" height="30" rx="6" fill="#2F9E44" stroke="none" stroke-width="1.5"/>
<text x="354" y="96" font-size="13" fill="#fff" text-anchor="start" font-weight="800" xml:space="preserve">degrees</text>
<text x="444" y="96" font-size="13" fill="#fff" text-anchor="start" font-weight="800" xml:space="preserve">radians</text>
<text x="534" y="96" font-size="13" fill="#fff" text-anchor="start" font-weight="800" xml:space="preserve"></text>
<text x="354" y="132" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">90°</text>
<text x="444" y="132" font-size="14" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">π/2</text>
<text x="508" y="132" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">≈ 1.57</text>
<line x1="340" y1="142" x2="600" y2="142" stroke="#e4e8e5" stroke-width="1" stroke-linecap="round"/>
<text x="354" y="162" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">180°</text>
<text x="444" y="162" font-size="14" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">π</text>
<text x="508" y="162" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">≈ 3.14</text>
<line x1="340" y1="172" x2="600" y2="172" stroke="#e4e8e5" stroke-width="1" stroke-linecap="round"/>
<text x="354" y="192" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">270°</text>
<text x="444" y="192" font-size="14" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">3π/2</text>
<text x="508" y="192" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">≈ 4.71</text>
<line x1="340" y1="202" x2="600" y2="202" stroke="#e4e8e5" stroke-width="1" stroke-linecap="round"/>
<text x="354" y="222" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">360°</text>
<text x="444" y="222" font-size="14" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">2π</text>
<text x="508" y="222" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">≈ 6.28</text>
<line x1="340" y1="232" x2="600" y2="232" stroke="#e4e8e5" stroke-width="1" stroke-linecap="round"/>
<text x="340" y="268" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">radians = degrees × π ÷ 180</text>
<text x="340" y="292" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" font-family="Menlo, Consolas, monospace" xml:space="preserve">In Unity: Mathf.Deg2Rad ≈ 0.01745</text>
</svg>
