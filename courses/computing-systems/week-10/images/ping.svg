<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">ping: is it there, and how fast?</text>
<rect x="20" y="50" width="440" height="157" rx="10" fill="#1e1e2e"/>
<text x="32" y="72" font-size="11" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">C:\&gt; ping play.example.net</text>
<text x="32" y="91" font-size="11" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Reply from 198.51.100.7: time=24ms</text>
<text x="32" y="110" font-size="11" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Reply from 198.51.100.7: time=27ms</text>
<rect x="26" y="115" width="428" height="19" rx="4" fill="#5c4813"/>
<text x="32" y="129" font-size="11" fill="#ffd43b" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Request timed out.</text>
<text x="32" y="148" font-size="11" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Reply from 198.51.100.7: time=25ms</text>
<rect x="26" y="153" width="428" height="19" rx="4" fill="#5c4813"/>
<text x="32" y="167" font-size="11" fill="#ffd43b" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Packets: Sent = 4, Received = 3, Lost = 1 (25% loss)</text>
<rect x="26" y="172" width="428" height="19" rx="4" fill="#5c4813"/>
<text x="32" y="186" font-size="11" fill="#ffd43b" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Minimum = 24ms, Maximum = 27ms, Average = 25ms</text>
<rect x="476" y="50" width="184" height="180" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="490" y="74" font-size="14" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">Read it</text>
<text x="490" y="90" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">time = the latency of one</text>
<text x="490" y="105.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">packet.</text>
<text x="490" y="128" font-size="12" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Average 25 ms: good.</text>
<text x="490" y="158" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">25 % loss: bad. A real test</text>
<text x="490" y="173.6" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">sends more packets (ping</text>
<text x="490" y="189.2" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">-n 20).</text>
</svg>
