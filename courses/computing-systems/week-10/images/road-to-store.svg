<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The road from a build to the store</text>
<rect x="14" y="62" width="102" height="128" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="65" y="92" font-size="13" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">1 Account</text>
<text x="65" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">developer</text>
<text x="65" y="146.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">account</text>
<line x1="117" y1="126" x2="118.6" y2="126" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="124,126 118,129 118,123" fill="#e8590c"/>
<rect x="125" y="62" width="102" height="128" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="176" y="92" font-size="13" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">2 Build</text>
<text x="176" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">package with a</text>
<text x="176" y="146.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">new build</text>
<text x="176" y="161.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">number</text>
<line x1="228" y1="126" x2="229.6" y2="126" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="235,126 229,129 229,123" fill="#e8590c"/>
<rect x="236" y="62" width="102" height="128" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="287" y="92" font-size="13" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">3 Listing</text>
<text x="287" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">name, icon,</text>
<text x="287" y="146.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">screenshots,</text>
<text x="287" y="161.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">text</text>
<line x1="339" y1="126" x2="340.6" y2="126" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="346,126 340,129 340,123" fill="#e8590c"/>
<rect x="347" y="62" width="102" height="128" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="398" y="92" font-size="13" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">4 Rating,</text>
<text x="398" y="108.9" font-size="13" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">privacy</text>
<text x="398" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">questionnaire,</text>
<text x="398" y="146.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">policy, data</text>
<text x="398" y="161.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">form</text>
<line x1="450" y1="126" x2="451.6" y2="126" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="457,126 451,129 451,123" fill="#e8590c"/>
<rect x="458" y="62" width="102" height="128" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="509" y="92" font-size="13" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">5 Review</text>
<text x="509" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the store</text>
<text x="509" y="146.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">checks</text>
<line x1="561" y1="126" x2="562.6" y2="126" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="568,126 562,129 562,123" fill="#e8590c"/>
<rect x="569" y="62" width="102" height="128" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="620" y="92" font-size="13" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">6 Release</text>
<text x="620" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">all players or a</text>
<text x="620" y="146.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">rollout</text>
<text x="340" y="226" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">A problem at any step stops the launch: plan each step before launch day.</text>
</svg>
