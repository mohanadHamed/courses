<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Promo Judge</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #f8f0fc; border: 1.5px solid #9C36B5; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Promo Judge</h1>
  <p class="hint">Students of a game design class show their promos of <i>Rooftop Rescue</i>. You are on the jury: for each problem, choose the best advice.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "Promo 1 starts with the logo for 5 seconds, then the menu, then the gameplay.", answer: "start with the most exciting shot (the hook)", choices: C(["start with the most exciting shot (the hook)", "make the logo bigger", "add a cross dissolve", "slow down the menu"]), good: "Viewers decide in about 3 seconds. The logo belongs at the end." },
    { card: "Promo 2 is 55 seconds long and is meant for a social media feed.", answer: "cut it to 15–30 seconds", choices: C(["cut it to 15–30 seconds", "speed it up to 2×", "add more titles", "export at 60 fps"]), good: "Short promos keep the viewers; keep only the best shots." },
    { card: "Promo 3 has a title “The best game ever!!!” over the gameplay.", answer: "show a real feature, e.g. “Rescue cats in 30 levels”", choices: C(["show a real feature, e.g. “Rescue cats in 30 levels”", "make the font red", "add three more !!!", "keep it, it is exciting"]), good: "Honest, concrete features persuade more, and a store may reject misleading claims." },
    { card: "Promo 4 ends on a gameplay shot. Viewers do not know the name or what to do.", answer: "end with the logo and a call to action", choices: C(["end with the logo and a call to action", "end with the menu", "end with a jump cut", "add a credits list"]), good: "The end shows the name and what to do: “Play free now”." },
    { card: "Promo 5 uses a famous song that a student found on a video site.", answer: "use the game's own music or a licensed track", choices: C(["use the game's own music or a licensed track", "keep it, everybody knows it", "play it at low volume", "cut the song to 10 s"]), good: "Music has a copyright. Use music you are allowed to use (lectures 23–26)." },
    { card: "Promo 6 has great shots, but the cuts fall between the beats and the music stops in the middle.", answer: "cut on the beats and fade the music with the logo", choices: C(["cut on the beats and fade the music with the logo", "remove the music", "use only cross dissolves", "make every shot 5 s"]), good: "Cuts on the beat feel right; the music ends with the picture." },
  ];
  rounds.forEach((r) => { r.goal = "Your advice?"; r.why = {}; });
  const g = Kit.game({ rounds, cols: 1, colsPhone: 1, animMs: 600, intro: "Round 1 is the story of the lesson: the opening of a promo." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "The jury has spoken." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
