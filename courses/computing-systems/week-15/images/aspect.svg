<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="280" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">One menu, three screen shapes</text>
<rect x="40" y="60" width="70" height="156" rx="10" fill="#343a40"/>
<rect x="45" y="65" width="60" height="146" rx="6" fill="#e7f5ff"/>
<rect x="63" y="65" width="24" height="8" rx="4" fill="#343a40"/>
<rect x="50" y="181" width="50" height="22" rx="5" fill="#A86700"/>
<text x="75" y="196" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Start</text>
<text x="75" y="236" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">20:9, with a notch</text>
<rect x="170" y="60" width="90" height="160" rx="10" fill="#343a40"/>
<rect x="175" y="65" width="80" height="150" rx="6" fill="#e7f5ff"/>
<rect x="180" y="185" width="70" height="22" rx="5" fill="#A86700"/>
<text x="215" y="200" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Start</text>
<text x="215" y="240" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">16:9 phone</text>
<rect x="320" y="60" width="150" height="200" rx="10" fill="#343a40"/>
<rect x="325" y="65" width="140" height="190" rx="6" fill="#e7f5ff"/>
<rect x="330" y="225" width="130" height="22" rx="5" fill="#A86700"/>
<text x="395" y="240" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Start</text>
<text x="395" y="280" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">4:3 tablet</text>
<rect x="470" y="56" width="190" height="210" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="484" y="80" font-size="14" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">Safe area</text>
<text x="484" y="101.5" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Keep buttons inside the</text>
<text x="484" y="117.1" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">safe area.</text>
<text x="484" y="135.7" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Anchor them to the edges.</text>
<text x="484" y="154.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Test every shape in an</text>
<text x="484" y="169.9" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">emulator.</text>
</svg>
