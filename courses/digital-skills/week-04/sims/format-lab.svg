<text x="36" y="224" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="500" xml:space="preserve">16:00. On Friday it is closed.</text>
<text x="36" y="270" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="500" xml:space="preserve">Please return your books on time.</text>
