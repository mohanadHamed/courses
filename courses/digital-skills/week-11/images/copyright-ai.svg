<svg xmlns="http://www.w3.org/2000/svg" width="680" height="216" viewBox="0 0 680 216" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="216" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Copyright and AI: what goes in, what comes out</text>
<rect x="20" y="52" width="310" height="146" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="34" y="76" font-size="14.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">What goes in</text>
<text x="34" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Upload only files you may share.</text>
<text x="34" y="117.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">A colleague&#x27;s report or a paid e-book is not</text>
<text x="34" y="133.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">yours to upload everywhere.</text>
<text x="34" y="152.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Ask the owner, or use a short quote with the</text>
<text x="34" y="169.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">source.</text>
<rect x="350" y="52" width="310" height="146" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.8"/>
<text x="364" y="76" font-size="14.5" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">What comes out</text>
<text x="364" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Read the terms of use of the tool.</text>
<text x="364" y="117.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">AI text or images can be close to an existing</text>
<text x="364" y="133.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">work.</text>
<text x="364" y="152.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Use licensed or your own images; name your</text>
<text x="364" y="169.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">sources.</text>
</svg>
