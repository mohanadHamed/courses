<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Site Planner</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <link rel="stylesheet" href="web.css">
  <style>
    .sim .pages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 600px; margin-top: 8px; }
    .sim .page { border: 1.5px solid #ced4da; border-radius: 10px; min-height: 120px; padding: 6px; background: #fff; }
    .sim .page h3 { margin: 0 0 4px; font-size: 0.9rem; text-align: center; background: #fff4e6; border-radius: 6px; padding: 3px; }
    .sim .page div { font-size: 0.8rem; font-weight: 700; border: 1px solid #b2f2bb; background: #ebfbee; border-radius: 6px; padding: 3px 5px; margin: 3px 0; }
    .sim .card { font-weight: 800; border: 1.5px solid #D9480F; border-radius: 10px; padding: 8px 12px; max-width: 520px; }
  </style>
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Site Planner: what goes on which page?</h1>
  <p class="hint">Mona's Cakes gets a small website with three pages. Put each part of the content on the right page.</p>
  <div class="task" id="task"></div>
  <div class="card" id="card"></div>
  <div class="pad" id="btns"><button type="button" class="ghost" data-p="Home">Home</button><button type="button" class="ghost" data-p="Service">Service</button><button type="button" class="ghost" data-p="Contact">Contact</button></div>
  <p id="msg" class="message"></p>
  <div class="pages"><div class="page" id="Home"><h3>Home</h3></div><div class="page" id="Service"><h3>Service</h3></div><div class="page" id="Contact"><h3>Contact</h3></div></div>
</main>
<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const C = [
    ["Welcome to Mona's Cakes! Cakes made at home, for every party.", "Home", "The home page says who you are and what you offer."],
    ["The cakes and their prices: Chocolate 12 JD, Lemon 10 JD, Fruit 11 JD.", "Service", "The service page shows what the customer can get."],
    ["The button Order now (the link to the order form).", "Service", "The customer orders on the service page."],
    ["Phone 079 000 0000 (made up) and the address in Amman.", "Contact", "The contact page says how to reach you."],
    ["A big photo of a birthday cake.", "Home", "A good photo on the home page shows the service at once."],
    ["Open: Sunday to Thursday, 9:00 to 17:00.", "Contact", "Opening times belong with the contact details."],
  ];
  const $ = (id) => document.getElementById(id);
  let i = 0;
  function show() {
    if (i >= C.length) { $("task").textContent = "The plan is ready: three pages, each with its content."; $("card").hidden = true; $("btns").hidden = true; return; }
    $("task").textContent = `Part ${i + 1} of ${C.length}: which page?`; $("card").textContent = C[i][0];
  }
  document.querySelectorAll("#btns button").forEach((b) => b.addEventListener("click", () => {
    const [t, ok, why] = C[i];
    if (b.dataset.p !== ok) { $("msg").textContent = `✗ Not on ${b.dataset.p}. ${why}`; $("msg").className = "message bad"; return; }
    $(ok).insertAdjacentHTML("beforeend", `<div>${t.slice(0, 42)}${t.length > 42 ? "…" : ""}</div>`);
    $("msg").textContent = "✓ " + why; $("msg").className = "message good"; i++; show();
  }));
  show();
})();
</script>
</body>
</html>
