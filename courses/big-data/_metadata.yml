# Applies to every page in this course folder.
# Big Data and Data Analysis (02053116): a course of the Faculty of Business
# (Bachelor in Management Information Systems, year 3, blended), not of the
# Technical College. The teacher gives only its lab part, one hour every
# Sunday, for two outcomes of the course plan: C1 (big data platforms) and
# C3 (a real big data problem in R). NOTES.md has the model of the course.
author: "Mohanad Hamed"
diploma-line: "Bachelor in Management Information Systems — Faculty of Business, Al-Israa University"
course:
  slug: "big-data"
  file-prefix: "big_data"   # downloads: big_data_lecture1_sheet.pdf
  title: "Big Data and Data Analysis: the Lab"
  code: "02053116"
  minutes: 60
  # Every lab has only its page and its worksheet: no notes, no slides
  # (check_size.py does not ask for them).
  pages-only: true
  # Every session is a lab (the lab model of Digital Skills): the label of a
  # lecture is "Lab" on the course page and on the banner.
  lecture-label: "Lab"
  course-chip: "The lab part: one 60-min lab every week"
  theme: "ledger"      # course look: colours in lesson.css, site.scss and sim-base.css
  accent: "#C92A2A"
  accent2: "#FFA8A8"
  tagline: "Big data platforms (Google BigQuery) and a real big data problem solved in R"
  textbook: "Marz, N.; Warren, J. Big Data: Principles and Best Practices of Scalable Real-Time Data Systems. Manning, 2015."
  # Only the two outcomes of the lab part (the course plan of 2026-10-07).
  ilos:
    C1: "Use big data platforms to work with big data sets: collect, store, process and analyse the data. (PLO 3)"
    C3: "Solve a real big data problem with the R language. (PLO 3)"
