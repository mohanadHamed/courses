<svg xmlns="http://www.w3.org/2000/svg" width="680" height="222" viewBox="0 0 680 222" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="222" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The coin has no memory</text>
<circle cx="60" cy="110" r="24" fill="#ced4da" stroke="#868e96" stroke-width="2"/>
<text x="60" y="116" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">T</text>
<circle cx="124" cy="110" r="24" fill="#ced4da" stroke="#868e96" stroke-width="2"/>
<text x="124" y="116" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">T</text>
<circle cx="188" cy="110" r="24" fill="#ced4da" stroke="#868e96" stroke-width="2"/>
<text x="188" y="116" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">T</text>
<circle cx="252" cy="110" r="24" fill="#ced4da" stroke="#868e96" stroke-width="2"/>
<text x="252" y="116" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">T</text>
<circle cx="316" cy="110" r="24" fill="none" stroke="#2F9E44" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="316" y="116" font-size="18" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">?</text>
<text x="188" y="162" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">four tails in a row</text>
<rect x="370" y="56" width="290" height="140" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="384" y="80" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Next flip</text>
<text x="384" y="102.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">P(heads) = 1/2, still.</text>
<text x="384" y="121.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">The flips are independent: the past does</text>
<text x="384" y="137.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">not change the next one.</text>
<text x="384" y="156.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">&quot;Heads is due&quot; is the gambler&#x27;s fallacy.</text>
<text x="188" y="200" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">P(T, T, T, T, then H) = (1/2)⁵, but P(H | four T) = 1/2.</text>
</svg>
