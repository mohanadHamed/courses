<text x="400" y="60" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">An orb circles the hero</text>
<text x="400" y="90" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">centre C = (5, 5), radius 2</text>
<text x="400" y="114" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">90° per second, start at 0°</text>
<text x="400" y="138" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">angle θ = 90° × t</text>
<text x="400" y="162" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">position = C + 2 × (cos θ, sin θ)</text>
<text x="400" y="186" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">t = 1 s: θ = 90°,</text>
<text x="400" y="210" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">(5, 5) + 2 × (0, 1) = (5, 7)</text>
<text x="400" y="234" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">One turn takes 360° ÷ 90° = 4 s.</text>
