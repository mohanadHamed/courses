# Master English–Arabic glossary for all courses.
# Use in a lesson with {{< glossary key1 key2 >}}.
# Rules: one key per concept; same English term and same Arabic everywhere.
#   en:  the English term as students see it
#   ar:  Arabic translation (with tashkeel only where it helps reading)
#   def: one short, simple English sentence (A2 level)

2d:
  en: 2D (two-dimensional)
  ar: ثنائي الأبعاد
  def: A flat world. We use two numbers for a position (x, y).

3d:
  en: 3D (three-dimensional)
  ar: ثلاثي الأبعاد
  def: A world with depth. We use three numbers for a position (x, y, z).

axis:
  en: axis (plural axes)
  ar: محور
  def: A number line. We use it to measure position.

coordinate:
  en: coordinate
  ar: إحداثي
  def: One number that tells where something is on an axis.

game-engine:
  en: game engine
  ar: محرّك الألعاب
  def: A ready program that helps us build games (for example, Unity).

grid:
  en: grid
  ar: شبكة
  def: Lines that cross and make small squares.

origin:
  en: origin
  ar: نقطة الأصل
  def: The point where all axes meet. All coordinates are 0 there.

position:
  en: position
  ar: موقع
  def: The place of an object in the game world.

x-axis:
  en: x-axis
  ar: المحور السيني
  def: The horizontal line. x grows to the right.

y-axis:
  en: y-axis
  ar: المحور الصادي
  def: The vertical line. y grows up.

z-axis:
  en: z-axis
  ar: المحور العيني
  def: The depth line in 3D. In many games, z goes forward, into the screen.
