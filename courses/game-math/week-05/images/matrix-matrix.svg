<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Matrix × matrix: entry (i, j) = row i of A · column j of B</text>
<text x="30" y="66" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A</text>
<path d="M37 74 H30 V162 H37" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M127 74 H134 V162 H127" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="80" width="40" height="36" rx="5" fill="#ffe8cc"/>
<text x="60" y="104.5" font-size="18" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<rect x="84" y="80" width="40" height="36" rx="5" fill="#ffe8cc"/>
<text x="104" y="104.5" font-size="18" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
<text x="60" y="144.5" font-size="18" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
<text x="104" y="144.5" font-size="18" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<text x="150" y="66" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">B</text>
<path d="M157 74 H150 V162 H157" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M247 74 H254 V162 H247" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="180" y="104.5" font-size="18" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">4</text>
<rect x="204" y="80" width="40" height="36" rx="5" fill="#ffe8cc"/>
<text x="224" y="104.5" font-size="18" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<text x="180" y="144.5" font-size="18" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<rect x="204" y="120" width="40" height="36" rx="5" fill="#ffe8cc"/>
<text x="224" y="144.5" font-size="18" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
<text x="270" y="122" font-size="24" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">=</text>
<text x="290" y="66" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">AB</text>
<path d="M297 74 H290 V162 H297" fill="none" stroke="#2F9E44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M387 74 H394 V162 H387" fill="none" stroke="#2F9E44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="320" y="104.5" font-size="18" fill="#2F9E44" text-anchor="middle" font-weight="700" xml:space="preserve">4</text>
<rect x="344" y="80" width="40" height="36" rx="5" fill="#ffe8cc"/>
<text x="364" y="104.5" font-size="18" fill="#2F9E44" text-anchor="middle" font-weight="700" xml:space="preserve">5</text>
<text x="320" y="144.5" font-size="18" fill="#2F9E44" text-anchor="middle" font-weight="700" xml:space="preserve">12</text>
<text x="364" y="144.5" font-size="18" fill="#2F9E44" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
<text x="30" y="200" font-size="15" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">row 1 of A · column 2 of B = 1 × 1 + 2 × 2 = 5</text>
<text x="30" y="240" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Sizes:  (2 × 3) times (3 × 4) gives 2 × 4.</text>
<text x="30" y="264" font-size="13" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">The inner numbers (3 and 3) must be equal.</text>
<text x="30" y="288" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">(2 × 3) times (2 × 3): not possible.</text>
<rect x="470" y="70" width="190" height="100" rx="12" fill="#ffffff" stroke="#2F9E44" stroke-width="1.8"/>
<text x="484" y="94" font-size="15" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Each entry</text>
<text x="484" y="116.8" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Take one row of A and one</text>
<text x="484" y="133.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">column of B.</text>
<text x="484" y="153.6" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Multiply pairs and add.</text>
</svg>
