<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A small LCG by hand: a = 5, c = 3, m = 16, seed 7</text>
<rect x="20" y="50" width="420" height="32" rx="0" fill="#2F9E44"/>
<text x="50" y="70.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">n</text>
<text x="120" y="70.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">x(n)</text>
<text x="220" y="70.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">5·x + 3</text>
<text x="360" y="70.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">mod 16 → x(n+1)</text>
<text x="50" y="102.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">0</text>
<text x="120" y="102.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">7</text>
<text x="220" y="102.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">38</text>
<text x="360" y="102.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">6</text>
<rect x="20" y="114" width="420" height="32" rx="0" fill="#f8f9fa"/>
<text x="50" y="134.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<text x="120" y="134.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">6</text>
<text x="220" y="134.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">33</text>
<text x="360" y="134.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1</text>
<text x="50" y="166.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<text x="120" y="166.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1</text>
<text x="220" y="166.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">8</text>
<text x="360" y="166.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">8</text>
<rect x="20" y="178" width="420" height="32" rx="0" fill="#f8f9fa"/>
<text x="50" y="198.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<text x="120" y="198.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">8</text>
<text x="220" y="198.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">43</text>
<text x="360" y="198.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">11</text>
<text x="50" y="230.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<text x="120" y="230.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">11</text>
<text x="220" y="230.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">58</text>
<text x="360" y="230.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">10</text>
<rect x="20" y="242" width="420" height="32" rx="0" fill="#f8f9fa"/>
<text x="50" y="262.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">5</text>
<text x="120" y="262.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">10</text>
<text x="220" y="262.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">53</text>
<text x="360" y="262.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">5</text>
<rect x="20" y="50" width="420" height="224" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<rect x="460" y="50" width="200" height="180" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="474" y="74" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">The whole cycle</text>
<text x="474" y="90" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">7 6 1 8 11 10 5 12 15 14 9</text>
<text x="474" y="106.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">0 3 2 13 4 7</text>
<text x="474" y="160" font-size="12.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">After 16 numbers, 7 comes</text>
<text x="474" y="176.2" font-size="12.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">again: the period is 16.</text>
<text x="20" y="300" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Real generators use huge m (2^32 or more) and better formulas, but the idea is the same.</text>
</svg>
