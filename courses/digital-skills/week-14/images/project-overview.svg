<text x="34" y="74" font-size="15" fill="#217346" text-anchor="start" font-weight="800" xml:space="preserve">data sheet</text>
<text x="34" y="96.8" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Excel: a table, a summary,</text>
<text x="34" y="113" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">one chart</text>
<rect x="238" y="50" width="206" height="92" rx="12" fill="#ffffff" stroke="#2b579a" stroke-width="1.8"/>
<text x="252" y="74" font-size="15" fill="#2b579a" text-anchor="start" font-weight="800" xml:space="preserve">report</text>
<text x="252" y="96.8" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Word: two pages with</text>
<text x="252" y="113" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">headings</text>
<rect x="456" y="50" width="206" height="92" rx="12" fill="#ffffff" stroke="#c43e1c" stroke-width="1.8"/>
<text x="470" y="74" font-size="15" fill="#c43e1c" text-anchor="start" font-weight="800" xml:space="preserve">talk</text>
<text x="470" y="96.8" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">PowerPoint: 5 slides, 3</text>
<text x="470" y="113" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">minutes</text>
<line x1="40" y1="210" x2="640" y2="210" stroke="#868e96" stroke-width="3" stroke-linecap="round"/>
<circle cx="110" cy="210" r="10" fill="#D9480F"/>
<text x="110" y="186" font-size="13.5" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">Online activity 14</text>
<text x="110" y="240" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">plan, data sheet, first draft</text>
<circle cx="340" cy="210" r="10" fill="#D9480F"/>
<text x="340" y="186" font-size="13.5" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">Lecture 10</text>
<text x="340" y="240" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">present the talk in the lab</text>
<circle cx="570" cy="210" r="10" fill="#D9480F"/>
<text x="570" y="186" font-size="13.5" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">Online activity 15</text>
<text x="570" y="240" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">final files and AI-use statement</text>
<text x="340" y="290" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Work alone. Use AI as a helper, check its output, and say where it helped.</text>
