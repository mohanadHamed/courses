<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Creative Commons: four conditions</text>
<rect x="20" y="50" width="640" height="40" rx="0" fill="#9C36B5"/>
<text x="65" y="74.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">part</text>
<text x="120" y="74.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">means</text>
<text x="420" y="74.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">in a commercial game</text>
<text x="65" y="114.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">BY</text>
<text x="120" y="114.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">give credit to the creator</text>
<rect x="410" y="90" width="250" height="40" rx="0" fill="#d3f9d8"/>
<text x="420" y="114.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">OK, with a credit</text>
<rect x="20" y="130" width="640" height="40" rx="0" fill="#f8f9fa"/>
<text x="65" y="154.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">SA</text>
<text x="120" y="154.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">share changed versions under the same licence</text>
<rect x="410" y="130" width="250" height="40" rx="0" fill="#fff3bf"/>
<text x="420" y="154.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">careful: your changes too</text>
<text x="65" y="194.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">NC</text>
<text x="120" y="194.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">non-commercial use only</text>
<rect x="410" y="170" width="250" height="40" rx="0" fill="#ffe3e3"/>
<text x="420" y="194.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">not allowed in a game you sell</text>
<rect x="20" y="210" width="640" height="40" rx="0" fill="#f8f9fa"/>
<text x="65" y="234.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">ND</text>
<text x="120" y="234.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">no changes (no derivatives)</text>
<rect x="410" y="210" width="250" height="40" rx="0" fill="#fff3bf"/>
<text x="420" y="234.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">only unchanged</text>
<text x="65" y="274.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">CC0</text>
<text x="120" y="274.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">no conditions (public domain)</text>
<rect x="410" y="250" width="250" height="40" rx="0" fill="#d3f9d8"/>
<text x="420" y="274.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">OK</text>
<rect x="20" y="50" width="640" height="240" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="316" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Licences combine the parts: CC BY, CC BY-SA, CC BY-NC, CC BY-ND, CC BY-NC-SA and more.</text>
</svg>
