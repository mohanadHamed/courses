<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: AI Formula Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .note { font-size: .85rem; color: var(--sim-muted); margin: -4px 0 8px; }
    .sim .task { font-weight: 700; margin: 4px 0 8px; }
    .sim .chat { border: 1.5px solid #ffd8a8; border-radius: 10px; padding: 8px 10px; background: #fffaf3; margin-bottom: 8px; }
    .sim .chat .you { background: #fff; border: 1px dashed #ffc078; border-radius: 8px; padding: 6px 8px; margin: 6px 0; font-size: .9rem; }
    .sim .chat .ai { background: #fff; border: 1.5px solid #e3dcd5; border-radius: 8px; padding: 6px 8px; font-size: .9rem; }
    .sim .chat code { font-weight: 800; color: #D9480F; }
    .sim .jobs { display: flex; flex-wrap: wrap; gap: 6px; }
    .sim .jobs button.on { background: var(--sim-accent); color: #fff; }
  </style>
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>AI Formula Lab: ask for a formula, then test it</h1>
  <p class="note">A practice model with prepared AI answers. Nothing is sent to the Internet. The sheet works like Excel. One AI answer has a mistake: test every formula before you trust it.</p>
  <p class="task" id="task"></p>
  <div class="chat">
    <div class="jobs" id="jobs"></div>
    <div class="you" id="you"></div>
    <div class="ai" id="ai"></div>
    <div class="row"><button type="button" id="paste">Paste the formula into the sheet</button></div>
  </div>
  <div id="sheet"></div>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script src="../../../../shared/sims/mini-sheet.js"></script>
<script src="sales-data.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const say = (t, cls = "") => { $("msg").textContent = t; $("msg").className = "message " + cls; };
  const data = {}, locked = [];
  ["A", "B", "C", "D", "E"].forEach((c, i) => { data[c + "1"] = SALES_HEAD[i]; locked.push(c + "1"); });
  SALES.forEach((r, k) => r.forEach((v, i) => { const a = "ABCDE"[i] + (k + 2); data[a] = v; locked.push(a); }));
  Object.assign(data, { F1: "Question", G1: "Answer", F2: "Week total", F3: "Biggest sale", F4: "Average sale" });
  locked.push("F1", "G1", "F2", "F3", "F4");
  const JOBS = [
    { k: "1", cell: "G2", prompt: "In Excel, my data is in A1:E11. Column E is the Total in JD. Write one formula for the total of all the sales.",
      ai: 'Use SUM: <code>=SUM(E2:E11)</code>. It adds the ten totals in column E.', f: "=SUM(E2:E11)" },
    { k: "2", cell: "G3", prompt: "Same data. Write a formula for the biggest total in column E.",
      ai: 'Use MAX: <code>=MAX(E2:E11)</code>. It finds the highest total.', f: "=MAX(E2:E11)" },
    { k: "3", cell: "G4", prompt: "Same data. Write a formula for the average Total of the ten sales.",
      ai: 'Use AVERAGE: <code>=AVERAGE(D2:D11)</code>. It finds the average of the sales.', f: "=AVERAGE(D2:D11)" },
  ];
  const f = (s, a) => (s.formula(a) || "").replace(/\s/g, "").toUpperCase();
  const tasks = [
    { q: "Job 1: ask the AI for the total of the week, paste the formula into G2, and check: Paper 75 + Drinks 50 + Bags 60.", check: (s) => f(s, "G2") === "=SUM(E2:E11)", ok: "G2 = 185 JD. Check by hand: 75 + 50 + 60 = 185. The formula is right." },
    { q: "Job 2: get the formula for the biggest sale into G3. Find the biggest total in column E yourself to check.", check: (s) => f(s, "G3") === "=MAX(E2:E11)", ok: "G3 = 36 JD: the bag of Tuesday is the biggest sale." },
    { q: "Job 3: get the formula for the average sale into G4. Check it: 185 ÷ 10 = 18.5. Fix the formula if the result is different.", check: (s) => f(s, "G4") === "=AVERAGE(E2:E11)", ok: "Fixed: the AI used column D (Qty) instead of E (Total). Now G4 = 18.50 JD." },
  ];
  const sheet = MiniSheet.create($("sheet"), {
    rows: 11, cols: 7, data, locked, widths: { F: 130 }, select: "G2", bold: ["A1", "B1", "C1", "D1", "E1", "F1", "G1"],
    formats: { G4: "0.00" }, taskEl: $("task"), say, tasks,
    onTask: (t) => { say("✓ " + t.ok, "good"); Kit.good(); },
    onChange: (s) => { if (s.sel === "G4" && /D2:D11/i.test(s.formula("G4") || "")) say("G4 shows 19.50, not 18.50. Which column does the formula average? Look at the range.", "bad"); },
  });
  let job = JOBS[0];
  function show(k) {
    job = JOBS.find((j) => j.k === k);
    Kit.buttons($("jobs"), JOBS.map((j) => ({ k: j.k, label: "Job " + j.k })), show);
    $("jobs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.k === k));
    $("you").innerHTML = "<b>You:</b> " + job.prompt;
    $("ai").innerHTML = "<b>AI:</b> " + job.ai;
  }
  $("paste").addEventListener("click", () => { sheet.select(job.cell); sheet.set(job.cell, job.f); });
  window.AF = { job: show, paste: () => $("paste").click(), set: (a, v) => { sheet.select(a); sheet.set(a, v); } };
  show("1");
  say("Job 1: read the prompt and the answer, then paste the formula.");
})();
</script>
</body>
</html>
