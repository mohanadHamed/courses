<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Ask the AI for an outline, not for finished slides</text>
<rect x="20" y="50" width="300" height="260" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="34" y="74" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">A good prompt</text>
<text x="34" y="92" font-size="12.5" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Topic</text>
<text x="34" y="110" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">going paperless at Sunrise Company</text>
<text x="34" y="134" font-size="12.5" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Audience</text>
<text x="34" y="152" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">12 office staff, not technical</text>
<text x="34" y="176" font-size="12.5" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Length</text>
<text x="34" y="194" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">5 slides, about 3 minutes</text>
<text x="34" y="218" font-size="12.5" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Form</text>
<text x="34" y="236" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">a title and 3 short points per slide</text>
<text x="34" y="260" font-size="12.5" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Limit</text>
<text x="34" y="278" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">at most 8 words per point</text>
<line x1="326" y1="180" x2="343" y2="180" stroke="#D9480F" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="352,180 342,185 342,175" fill="#D9480F"/>
<rect x="358" y="50" width="302" height="260" rx="10" fill="#1e1e2e"/>
<text x="370" y="76" font-size="11.5" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">1 Going paperless</text>
<text x="370" y="99" font-size="11.5" fill="#adb5bd" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  - Huda, Office Manager</text>
<text x="370" y="122" font-size="11.5" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">2 The problem</text>
<text x="370" y="145" font-size="11.5" fill="#adb5bd" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  - 9,000 printed pages a month</text>
<text x="370" y="168" font-size="11.5" fill="#adb5bd" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  - lost papers, full cupboards</text>
<text x="370" y="191" font-size="11.5" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">3 The plan</text>
<text x="370" y="214" font-size="11.5" fill="#adb5bd" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  - shared folders, e-forms</text>
<text x="370" y="237" font-size="11.5" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">4 Results in 3 months</text>
<text x="370" y="260" font-size="11.5" fill="#adb5bd" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  - …</text>
<text x="370" y="283" font-size="11.5" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">5 Questions</text>
</svg>
