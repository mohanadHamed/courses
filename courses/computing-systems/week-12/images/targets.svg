<text x="350" y="187.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">60 fps</text>
<text x="470" y="187.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">4 GB RAM</text>
<text x="595" y="187.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">2 GB</text>
<rect x="20" y="202" width="640" height="38" rx="0" fill="#f8f9fa"/>
<text x="30" y="225.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">console</text>
<text x="230" y="225.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">4K, high</text>
<text x="350" y="225.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">60 fps</text>
<text x="470" y="225.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">fixed budget</text>
<text x="595" y="225.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">2 GB</text>
<text x="30" y="263.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">cloud</text>
<text x="230" y="263.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1080p stream</text>
