<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Bag Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 5px 0; font-weight: 700; font-size: .92rem; }
    .sim .bar button.on { background: var(--sim-accent); color: #fff; }
    .sim table.cmp { border-collapse: collapse; width: 100%; margin: 6px 0; font-variant-numeric: tabular-nums; }
    .sim table.cmp td, .sim table.cmp th { border: 1px solid #dee2e6; padding: 3px 6px; font-weight: 700; font-size: .88rem; text-align: center; }
    .sim table.cmp th { background: #ebfbee; color: #2b8a3e; }
    .sim .task { font-weight: 800; color: var(--sim-accent); margin: 6px 0 0; }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Bag Lab: pure random or a shuffle bag?</h1>
  <p class="hint">The player's sword in <i>Torch Hall</i> makes a critical hit (crit) 25 % of the time. Compare two ways to roll it: <b>pure random</b> (25 % every attack) and a <b>shuffle bag</b> (1 crit in every bag of 4).</p>
  <div class="bar" id="mode"></div>
  <div class="bar"><button type="button" id="one">100 attacks ▶</button><button type="button" class="ghost" id="many">1000 players ▶</button></div>
  <canvas id="c" aria-label="100 attacks with the crits marked"></canvas>
  <p class="calc" id="calc"></p>
  <table class="cmp" id="tbl"></table>
  <p class="task" id="task"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MODES = ["pure random", "shuffle bag"];
  const s = { mode: "pure random", seq: null, res: {} };
  const TASKS = [
    { q: "Task 1: Run 100 attacks with pure random. How many crits? What is the longest drought (attacks without a crit)?", ok: () => s.seq && s.mode === "pure random" },
    { q: "Task 2: Switch to the shuffle bag and run 100 attacks. Can the drought be longer than 6?", ok: () => s.seq && s.mode === "shuffle bag" },
    { q: "Task 3: Let 1000 players fight with each of the two ways. Which way keeps 25 % and limits the droughts?", ok: () => MODES.every((m) => s.res[m]) },
  ];
  let ti = 0;
  function attacks(mode, n = 100) {
    const out = []; let bag = [];
    for (let i = 0; i < n; i++) {
      let crit;
      if (mode === "pure random") crit = Math.random() < 0.25;
      else if (mode === "shuffle bag") { if (!bag.length) { bag = [1, 0, 0, 0]; for (let k = 3; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [bag[k], bag[j]] = [bag[j], bag[k]]; } } crit = bag.pop() === 1; }
      out.push(crit);
    }
    return out;
  }
  const drought = (seq) => { let b = 0, c = 0; seq.forEach((v) => { c = v ? 0 : c + 1; b = Math.max(b, c); }); return b; };
  const cv = Kit.canvas($("c"), (W) => Math.round(4 * Math.min(26, (W - 20) / 25) + 18));
  function draw() {
    const c = cv.ctx, W = cv.W, H = cv.H;
    c.clearRect(0, 0, W, H);
    if (!s.seq) { Kit.text(c, "Press \"100 attacks\".", W / 2, 60, 14, "#6b726e"); return; }
    const cols = 25, cell = Math.min(26, (W - 20) / cols);
    s.seq.forEach((v, i) => { const x = 10 + (i % cols) * cell, y = 10 + Math.floor(i / cols) * cell; Kit.rrect(c, x, y, cell - 3, cell - 3, 3, v ? "#c92a2a" : "#ced4da"); });
  }
  function tabs() { Kit.buttons($("mode"), MODES.map((k) => ({ k, label: k })), (k) => { s.mode = k; s.seq = null; upd(); }); $("mode").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.k === s.mode)); }
  function upd() {
    tabs(); draw();
    $("calc").textContent = s.seq ? `${s.mode}: ${s.seq.filter(Boolean).length} crits in 100 attacks; longest drought ${drought(s.seq)} attacks.` : "";
    $("tbl").innerHTML = "<tr><th>1000 players × 100 attacks</th><th>crits</th><th>average longest drought</th><th>worst drought</th></tr>" +
      MODES.map((m) => { const r = s.res[m]; return `<tr><td>${m}</td><td>${r ? r.rate.toFixed(1) + " %" : "–"}</td><td>${r ? r.avg.toFixed(1) : "–"}</td><td>${r ? r.worst : "–"}</td></tr>`; }).join("");
    let m = "";
    while (ti < TASKS.length && TASKS[ti].ok()) { ti++; m = "✓ Done. "; Kit.good(); }
    $("task").textContent = ti < TASKS.length ? TASKS[ti].q : "All tasks are done: the bag keeps exactly 25 % and cuts off the long droughts.";
    $("msg").textContent = m + "A red square is a crit.";
  }
  $("one").addEventListener("click", () => { s.seq = attacks(s.mode); upd(); });
  $("many").addEventListener("click", () => { let crits = 0, sum = 0, worst = 0; for (let k = 0; k < 1000; k++) { const q = attacks(s.mode); crits += q.filter(Boolean).length; const d = drought(q); sum += d; worst = Math.max(worst, d); } s.res[s.mode] = { rate: crits / 1000, avg: sum / 1000, worst }; if (!s.seq) s.seq = attacks(s.mode); upd(); });
  window.addEventListener("resize", draw);
  window.BL = { mode: (k) => { s.mode = k; s.seq = null; upd(); }, one: () => $("one").click(), many: () => $("many").click() };
  upd();
})();
</script>
</body>
</html>
