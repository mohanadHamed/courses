<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Talk Doctor</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #fff9db; border: 1.5px solid #A86700; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Talk Doctor</h1>
  <p class="hint">Six students rehearse their project talks. Each rehearsal has one problem. Choose the best advice.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "Slide 2 has 14 lines of small text, and Omar reads them all aloud.", answer: "keep one message and a few words; say the rest", choices: C(["keep one message and a few words; say the rest", "use a smaller font", "read faster", "add more lines"]), good: "One message per slide; the slide supports the talk, it is not the talk." },
    { card: "Sara's talk takes 11 minutes in the rehearsal. The limit is five.", answer: "practise with a timer and cut words, not facts", choices: C(["practise with a timer and cut words, not facts", "speak twice as fast", "skip the recommendation", "ask for more time"]), good: "About 50 seconds per slide; keep the question, the numbers and the answer." },
    { card: "A table says \"the console is 3 times stronger\" with no source.", answer: "add the source and the date", choices: C(["add the source and the date", "remove all tables", "make the number bigger", "write \"everybody knows\""]), good: "Every number needs a reliable source with a date." },
    { card: "Lina shows a chart of frame rates without axis labels.", answer: "add a title, axis names and units", choices: C(["add a title, axis names and units", "make it 3D", "use more colours", "remove the numbers"]), good: "A chart must say what it shows: title, axes, units." },
    { card: "The teacher asks a question that Ali cannot answer.", answer: "say so honestly and offer to check the source", choices: C(["say so honestly and offer to check the source", "invent a number", "change the topic", "say the question is wrong"]), good: "An honest \"I will check it in my source\" is better than a guess." },
    { card: "The talk ends after the risks slide, without an answer to the question.", answer: "end with the recommendation", choices: C(["end with the recommendation", "end with a joke", "end with the sources list", "stop when the time is over"]), good: "Start with the question, end with the answer: the recommendation." },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; r.goal = "What is the best advice?"; });
  const g = Kit.game({ rounds, cols: 1, colsPhone: 1, animMs: 600, intro: "Round 1 is the first rehearsal of the seminar: a crowded slide." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "Every talk is ready." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
