<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="260" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Copy from Excel, paste into Word: three paste options</text>
<rect x="20" y="50" width="640" height="40" rx="0" fill="#2b579a"/>
<text x="30" y="74.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">paste option</text>
<text x="280" y="74.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">can you edit it in Word?</text>
<text x="490" y="74.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">does it change with Excel?</text>
<text x="30" y="114.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Keep Source Formatting</text>
<text x="280" y="114.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">yes, as a Word table</text>
<text x="490" y="114.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">no</text>
<rect x="20" y="130" width="640" height="40" rx="0" fill="#f8f9fa"/>
<text x="30" y="154.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Picture</text>
<text x="280" y="154.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">no, it is an image</text>
<text x="490" y="154.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">no</text>
<rect x="20" y="170" width="640" height="40" rx="0" fill="#e7f5ff"/>
<text x="30" y="194.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Link (Keep Source Formatting)</text>
<text x="280" y="194.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">yes</text>
<text x="490" y="194.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">yes, after Update Link</text>
<rect x="20" y="50" width="640" height="160" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="236" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">A linked table or chart needs the Excel file in the same place; send both files.</text>
</svg>
