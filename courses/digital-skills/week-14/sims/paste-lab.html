<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Paste Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .apps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) { .sim .apps { grid-template-columns: 1fr; } }
    .sim .app { border: 2px solid #ced4da; border-radius: 10px; overflow: hidden; background: #fff; }
    .sim .app .bar { color: #fff; font-weight: 800; padding: 4px 10px; font-size: .9rem; }
    .sim .app .body { padding: 8px 10px; min-height: 150px; }
    .sim .xl .bar { background: #217346; } .sim .wd .bar { background: #2b579a; }
    .sim table.t { border-collapse: collapse; font-weight: 700; font-size: .9rem; margin: 4px 0; }
    .sim table.t td, .sim table.t th { border: 1px solid #adb5bd; padding: 2px 10px; text-align: left; }
    .sim table.t th { background: #e9ecef; }
    .sim table.t td.new { background: #fff3bf; }
    .sim .pic { display: inline-block; border: 2px dashed #868e96; padding: 3px; position: relative; }
    .sim .pic table.t { margin: 0; filter: saturate(.6); }
    .sim .tag { font-size: .78rem; font-weight: 800; color: #495057; }
    .sim .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; align-items: center; font-weight: 700; font-size: .9rem; }
    .sim .row button.on { background: var(--sim-accent); color: #fff; }
    .sim .task { font-weight: 800; color: var(--sim-accent); margin: 6px 0 0; }
  </style>
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Paste Lab: from Excel into Word</h1>
  <p class="hint">Huda copies the summary table from Excel into the Word report. Choose a paste option. Then Rana finds a missing sale of bags, and the Excel numbers change. What happens in Word?</p>
  <div class="apps">
    <div class="app xl"><div class="bar">Excel: sales.xlsx</div><div class="body" id="xl"></div></div>
    <div class="app wd"><div class="bar">Word: report.docx</div><div class="body" id="wd"></div></div>
  </div>
  <div class="row"><span>Paste as</span><span id="opts" style="display:contents"></span></div>
  <div class="row"><button type="button" id="chg">Excel: add the missing sale (Bags +20 JD)</button><button type="button" id="upd">Word: Update Link</button><button type="button" id="edit">Word: edit a number</button></div>
  <p class="task" id="task"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const OPT = { keep: "Keep Source Formatting", pic: "Picture", link: "Link" };
  const s = { changed: false, mode: null, vals: null, note: "" };
  const xl = () => ({ Paper: 206, Bags: s.changed ? 98 : 78, Drinks: 71 });
  const total = (v) => v.Paper + v.Bags + v.Drinks;
  const table = (v, mark) => `<table class="t"><tr><th>Type</th><th>Total (JD)</th></tr>` +
    Object.keys(v).map((k) => `<tr><td>${k}</td><td class="${mark && k === "Bags" ? "new" : ""}">${v[k]}</td></tr>`).join("") +
    `<tr><th>Total</th><th>${total(v)}</th></tr></table>`;
  const TASKS = [
    { q: "Task 1: Paste the table as a Picture, then add the missing sale in Excel. Does the Word table change?", ok: () => s.mode === "pic" && s.changed },
    { q: "Task 2: Make the Word report show the new total (375 JD). Which paste option and which button do you need?", ok: () => s.mode === "link" && s.vals && total(s.vals) === 375 },
  ];
  let ti = 0;
  function upd(m) {
    $("xl").innerHTML = table(xl(), s.changed) + `<div class="tag">${s.changed ? "Bags changed: 78 → 98 JD" : "the summary table"}</div>`;
    let w = "<div class=\"tag\">March report</div><p style=\"margin:4px 0;font-weight:600;font-size:.88rem\">Sales by type:</p>";
    if (!s.mode) w += "<div class=\"tag\">(nothing pasted yet)</div>";
    else if (s.mode === "pic") w += `<span class="pic">${table(s.vals)}</span><div class="tag">a picture: the numbers are part of an image</div>`;
    else w += table(s.vals, s.mode === "link" && s.vals.Bags === 98) + `<div class="tag">${s.mode === "link" ? "a linked table: Update Link reads the Excel file again" : "a Word table: you can edit it, but it does not follow Excel"}</div>`;
    $("wd").innerHTML = w;
    $("opts").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.k === s.mode));
    let done = "";
    while (ti < TASKS.length && TASKS[ti].ok()) { ti++; done = "✓ Done. "; Kit.good(); }
    $("task").textContent = ti < TASKS.length ? TASKS[ti].q : "All tasks are done: only a link follows Excel. A picture and a normal paste stay as they were.";
    $("msg").textContent = done + (m || "Paste the table into Word, then change the data in Excel.");
  }
  Kit.buttons($("opts"), Object.keys(OPT).map((k) => ({ k, label: OPT[k] })), (k) => {
    s.mode = k; s.vals = xl();
    upd(k === "pic" ? "Pasted as a picture." : k === "link" ? "Pasted with a link to sales.xlsx." : "Pasted as a Word table.");
  });
  $("chg").addEventListener("click", () => { s.changed = true; upd(s.mode ? (s.mode === "link" ? "Excel changed. The linked table waits for Update Link." : "Excel changed, but the Word table did not change.") : "Excel changed."); });
  $("upd").addEventListener("click", () => {
    if (s.mode === "link") { s.vals = xl(); upd("Update Link: Word read sales.xlsx again."); }
    else { Kit.bad(); upd(s.mode ? "There is no link: this table does not know the Excel file." : "Paste something first."); }
  });
  $("edit").addEventListener("click", () => {
    if (s.mode === "pic") { Kit.bad(); upd("You cannot edit the numbers: it is a picture."); }
    else if (s.mode) upd("You can edit this table in Word. (A linked table changes back after Update Link.)");
    else upd("Paste something first.");
  });
  window.PL = { paste: (k) => $("opts").querySelector(`[data-k="${k}"]`).click(), change: () => $("chg").click(), update: () => $("upd").click() };
  upd();
})();
</script>
</body>
</html>
