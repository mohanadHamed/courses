<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="640" height="440" fill="#ffffff"/>
<text x="24" y="36" font-size="22" fill="#2a2f2c" text-anchor="start" font-weight="800">Prompt Doctor: what is missing?</text>
<text x="24" y="60" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800">Prompt 2 of 5</text>
<text x="616" y="60" font-size="14" fill="#D9480F" text-anchor="end" font-weight="800">1 right</text>
<rect x="120" y="74" width="496" height="44" rx="14" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="134" y="101" font-size="14.5" fill="#fff" text-anchor="start" font-weight="700">Write a polite e-mail of 4 sentences.</text>
<text x="24" y="146" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800">1 · Which part is missing?</text>
<rect x="24" y="156" width="142" height="34" rx="10" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="36" y="178.0" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Task</text>
<rect x="174" y="156" width="142" height="34" rx="10" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="186" y="178.0" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Context</text>
<rect x="324" y="156" width="142" height="34" rx="10" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="336" y="178.0" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Format</text>
<rect x="474" y="156" width="142" height="34" rx="10" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="486" y="178.0" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Nothing</text>
<text x="24" y="222" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800">2 · Which prompt is better?</text>
<rect x="24" y="232" width="592" height="56" rx="10" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="36" y="254" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Write a polite e-mail of 4 sentences to the library. Ask if I can</text>
<text x="36" y="272" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">keep the book "Easy Accounting" for one more week.</text>
<rect x="24" y="296" width="592" height="36" rx="10" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="36" y="319" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Write a polite e-mail of 4 sentences. My phone number is 0791234567.</text>
<text x="24" y="362" font-size="13" fill="#2b8a3e" text-anchor="start" font-weight="700">The AI does not know who the e-mail is for or what it is about.</text>
</svg>
