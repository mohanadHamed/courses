<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="220" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Five steps for an applied problem</text>
<rect x="20" y="56" width="118" height="140" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="2"/>
<text x="79" y="86" font-size="14" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">1 Read</text>
<text x="79" y="118" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">What is given?</text>
<text x="79" y="133.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">What is asked?</text>
<line x1="139" y1="126" x2="140.7" y2="126" stroke="#868e96" stroke-width="2" stroke-linecap="round"/>
<polygon points="149,126 139.8,130.6 139.8,121.4" fill="#868e96"/>
<rect x="150" y="56" width="118" height="140" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="2"/>
<text x="209" y="86" font-size="14" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">2 Draw</text>
<text x="209" y="118" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">a sketch with</text>
<text x="209" y="133.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">points and</text>
<text x="209" y="149.2" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">arrows</text>
<line x1="269" y1="126" x2="270.7" y2="126" stroke="#868e96" stroke-width="2" stroke-linecap="round"/>
<polygon points="279,126 269.8,130.6 269.8,121.4" fill="#868e96"/>
<rect x="280" y="56" width="118" height="140" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="2"/>
<text x="339" y="86" font-size="14" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">3 Choose</text>
<text x="339" y="118" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">vector, angle,</text>
<text x="339" y="133.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">matrix or</text>
<text x="339" y="149.2" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">probability?</text>
<line x1="399" y1="126" x2="400.7" y2="126" stroke="#868e96" stroke-width="2" stroke-linecap="round"/>
<polygon points="409,126 399.8,130.6 399.8,121.4" fill="#868e96"/>
<rect x="410" y="56" width="118" height="140" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="2"/>
<text x="469" y="86" font-size="14" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">4 Compute</text>
<text x="469" y="118" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">step by step,</text>
<text x="469" y="133.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">with units</text>
<line x1="529" y1="126" x2="530.7" y2="126" stroke="#868e96" stroke-width="2" stroke-linecap="round"/>
<polygon points="539,126 529.8,130.6 529.8,121.4" fill="#868e96"/>
<rect x="540" y="56" width="118" height="140" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="2"/>
<text x="599" y="86" font-size="14" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">5 Check</text>
<text x="599" y="118" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Is the answer</text>
<text x="599" y="133.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">sensible?</text>
</svg>
