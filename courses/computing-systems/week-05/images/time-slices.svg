<text x="128.5" y="108" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Music</text>
<rect x="160" y="80" width="57" height="46" rx="6" fill="#A86700"/>
<text x="188.5" y="108" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Game</text>
<rect x="220" y="80" width="57" height="46" rx="6" fill="#7048e8"/>
<text x="248.5" y="108" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Dwnld</text>
<rect x="280" y="80" width="57" height="46" rx="6" fill="#A86700"/>
<text x="308.5" y="108" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Game</text>
<rect x="340" y="80" width="57" height="46" rx="6" fill="#1c7ed6"/>
<text x="368.5" y="108" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Music</text>
<rect x="400" y="80" width="57" height="46" rx="6" fill="#A86700"/>
<text x="428.5" y="108" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Game</text>
<rect x="460" y="80" width="57" height="46" rx="6" fill="#7048e8"/>
<text x="488.5" y="108" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Dwnld</text>
<rect x="520" y="80" width="57" height="46" rx="6" fill="#A86700"/>
<text x="548.5" y="108" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Game</text>
<rect x="580" y="80" width="57" height="46" rx="6" fill="#1c7ed6"/>
<text x="608.5" y="108" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Music</text>
<line x1="40" y1="144" x2="642.3" y2="144" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="650,144 641.4,148.3 641.4,139.7" fill="#adb5bd"/>
<text x="40" y="162" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">0 ms</text>
<text x="160" y="162" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">8 ms</text>
<text x="280" y="162" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">16 ms</text>
<text x="400" y="162" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">24 ms</text>
<text x="520" y="162" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">32 ms</text>
<text x="640" y="162" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">40 ms</text>
<text x="40" y="68" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">CPU core 1 (each slice: 4 ms)</text>
<rect x="40" y="196" width="196" height="74" rx="10" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="56" y="222" font-size="15" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">running</text>
<text x="56" y="244" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">on the core now</text>
<rect x="250" y="196" width="196" height="74" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<text x="266" y="222" font-size="15" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">ready</text>
<text x="266" y="244" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">waits for a core</text>
<rect x="460" y="196" width="196" height="74" rx="10" fill="#ffffff" stroke="#868e96" stroke-width="2"/>
<text x="476" y="222" font-size="15" fill="#868e96" text-anchor="start" font-weight="800" xml:space="preserve">waiting</text>
<text x="476" y="244" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">waits for a file, the</text>
<text x="476" y="260.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">network or a tap</text>
<text x="340" y="304" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">The switches are so fast that the player sees all apps run at once.</text>
</svg>
