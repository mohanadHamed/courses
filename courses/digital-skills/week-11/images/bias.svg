<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="310" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Bias: check who the AI shows, and how</text>
<rect x="20" y="52" width="310" height="236" rx="12" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.8"/>
<text x="34" y="76" font-size="14" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Prompt: “Describe a doctor and a</text>
<text x="34" y="93.5" font-size="14" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">nurse.”</text>
<text x="34" y="112" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">AI: “The doctor, a confident man, gives</text>
<text x="34" y="128.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">orders; the nurse, a kind young woman, helps</text>
<text x="34" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">him.”</text>
<circle cx="90" cy="198" r="9" fill="#1c7ed6"/>
<path d="M74 228 a16 17 0 0 1 32 0 Z" fill="#1c7ed6"/>
<text x="90" y="262" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">doctor: he</text>
<circle cx="220" cy="198" r="9" fill="#d6336c"/>
<path d="M204 228 a16 17 0 0 1 32 0 Z" fill="#d6336c"/>
<text x="220" y="262" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">nurse: she</text>
<rect x="350" y="52" width="310" height="236" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="364" y="76" font-size="14" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Better prompt and check</text>
<text x="364" y="112" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">“Describe the work of a doctor and a nurse.</text>
<text x="364" y="128.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Use neutral language and do not assume</text>
<text x="364" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">gender or age.”</text>
<text x="364" y="200" font-size="12" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Then read again: Who is shown? Who is</text>
<text x="364" y="215.6" font-size="12" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">missing? Is only one side of a question given?</text>
</svg>
