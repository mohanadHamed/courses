<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Ask an AI for a formula: say where the data is</text>
<rect x="20" y="52" width="380" height="150" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="34" y="76" font-size="15" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">A clear prompt</text>
<text x="36" y="94" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">1. Where: “My data is in A1:E11.”</text>
<text x="36" y="122" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">2. Which columns: “C is the Type, E is the Total.”</text>
<text x="36" y="150" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">3. What: “One formula for the total of the Drinks.”</text>
<text x="36" y="178" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">4. Where the answer goes: “in G2”.</text>
<rect x="420" y="52" width="240" height="150" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="434" y="76" font-size="15" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">The AI answers</text>
<text x="436" y="96" font-size="12.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">=SUMIF(C2:C11,&quot;Drinks&quot;,E2:E11)</text>
<text x="436" y="150" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Paste it, then check with a small</text>
<text x="436" y="166.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">sum by hand.</text>
<rect x="20" y="220" width="640" height="56" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="36" y="244" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Check every formula: one wrong column (D instead of E) gives a number that looks right but</text>
<text x="36" y="260.9" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">is wrong.</text>
</svg>
