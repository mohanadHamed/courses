<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Drawbridge</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Drawbridge</h1>
  <p class="hint">The bridge of the castle turns around its hinge <b>H = (2, 1)</b>. It is 4 units long; lying flat, its end is at <b>E = (6, 1)</b>. Turning by θ: E' = H + R(θ) × (E − H) = H + R(θ) × (4, 0).</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const H = [2, 1], L = 4;
  const end = (deg) => [H[0] + L * Math.cos(deg * Math.PI / 180), H[1] + L * Math.sin(deg * Math.PI / 180)];
  const f = (v) => Kit.fmt(v, 2), pt = (p) => `(${f(p[0])}, ${f(p[1])})`;
  const A = (list) => list.map((d) => ({ k: d + "°", label: Kit.fmt(d, 0) + "°", d }));
  const P = (list) => list.map((p) => ({ k: pt(p), label: pt(p), p }));
  const rounds = [
    { kind: "angle", from: 0, goal: "A ship comes. Raise the bridge so that its end is at <b>(2, 5)</b>. Which turn?", choices: A([90, -90, 180, 45]), answer: "90°", target: [2, 5],
      good: "R(90°) × (4, 0) = (0, 4); H + (0, 4) = (2, 5): the bridge stands up.", why: { "-90°": "−90° turns clockwise: the bridge goes down into the water.", "180°": "180° turns it over to the left." } },
    { kind: "angle", from: 0, goal: "The end must rest on the ledge at <b>(5.46, 3)</b>. Which turn?", choices: A([30, 60, 45, -30]), answer: "30°", target: [5.46, 3],
      good: "R(30°) × (4, 0) = (3.46, 2); H + (3.46, 2) = (5.46, 3).", why: { "60°": "At 60° the end goes to (4, 4.46).", "45°": "At 45° the end goes to (4.83, 3.83)." } },
    { kind: "where", from: 0, deg: 180, goal: "The bridge turns by <b>180°</b>. Where is its end?", choices: P([[-2, 1], [2, -3], [-6, 1], [6, -1]]), answer: "(−2, 1)",
      good: "R(180°) × (4, 0) = (−4, 0); H + (−4, 0) = (−2, 1).", why: { "(−6, 1)": "Turn around the hinge, not the origin: add H = (2, 1)." } },
    { kind: "where", from: 0, deg: -90, goal: "The bridge turns by <b>−90°</b> (clockwise). Where is its end?", choices: P([[2, -3], [2, 5], [-2, 1], [6, -3]]), answer: "(2, −3)",
      good: "R(−90°) × (4, 0) = (0, −4); H + (0, −4) = (2, −3).", why: { "(2, 5)": "That is +90°. A negative angle turns clockwise." } },
    { kind: "angle", from: 60, goal: "The bridge stands at <b>60°</b>. Which turn brings it back flat, to (6, 1)?", choices: A([-60, 60, 120, 0]), answer: "-60°", target: [6, 1],
      good: "R(−60°) undoes R(60°): the inverse of a rotation turns back by the same angle.", why: { "60°": "Another 60° makes 120°: the bridge goes further up.", "0°": "No turn leaves it at 60°." } },
  ];
  const angleOf = (r, k) => { const c = r.choices.find((x) => x.k === k); return r.kind === "angle" ? r.from + c.d : null; };
  Kit.game({
    rounds, cols: 4, colsPhone: 2, animMs: 1200,
    intro: "Round 1 is the story of the lesson: a ship comes to the castle.",
    calc: (k, r) => r.kind === "angle" ? `E' = H + R(${Kit.fmt(parseFloat(k), 0)}°) × (4, 0) = ${pt(end(angleOf(r, k)))}` : "",
    canvas: (W) => Math.min(330, W * 0.66),
    draw(c, W, H2, now, r, st) {
      const G = Kit.grid(c, W, H2, -3, 7, -4, 6, { bg: "#eef7ff", grid: "#d6e9fb", axis: "#9cc3e6" });
      c.fillStyle = "rgba(77,171,247,0.35)"; c.fillRect(G.X(-3), G.Y(0.6), G.X(7) - G.X(-3), G.Y(-4) - G.Y(0.6));
      c.fillStyle = "#868e96"; c.fillRect(G.X(-3), G.Y(1), G.X(2) - G.X(-3), G.Y(0.4) - G.Y(1));
      c.fillStyle = "#adb5bd"; c.fillRect(G.X(5.6), G.Y(1), G.X(7) - G.X(5.6), G.Y(0.4) - G.Y(1));
      if (!r) return;
      if (r.target) { c.strokeStyle = "#e8590c"; c.lineWidth = 3; c.beginPath(); c.arc(G.X(r.target[0]), G.Y(r.target[1]), 11, 0, 7); c.stroke(); }
      let deg = r.from;
      if (st.pick) {
        const goal = r.kind === "angle" ? angleOf(r, st.pick) : r.from + r.deg;
        const k = st.done ? 1 : Math.max(0, Math.min((now - st.t0) / 1100, 1));
        deg = r.from + (goal - r.from) * k;
      }
      const e = end(deg);
      c.strokeStyle = "#8d5524"; c.lineWidth = 10; c.lineCap = "round";
      c.beginPath(); c.moveTo(G.X(H[0]), G.Y(H[1])); c.lineTo(G.X(e[0]), G.Y(e[1])); c.stroke();
      c.fillStyle = "#c92a2a"; c.beginPath(); c.arc(G.X(H[0]), G.Y(H[1]), 7, 0, 7); c.fill();
      Kit.text(c, "H", G.X(H[0]) - 10, G.Y(H[1]) + 20, 12, "#c92a2a");
      if (r.kind === "where" && st.pick) { const ch = r.choices.find((x) => x.k === st.pick).p; c.strokeStyle = "#7048e8"; c.lineWidth = 2.5; c.beginPath(); c.arc(G.X(ch[0]), G.Y(ch[1]), 9, 0, 7); c.stroke(); }
    },
  });
})();
</script>
</body>
</html>
