<svg xmlns="http://www.w3.org/2000/svg" width="680" height="296" viewBox="0 0 680 296" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="296" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Choose the settings for where the video will play</text>
<rect x="20" y="52" width="640" height="34" rx="0" fill="#9C36B5"/>
<text x="30" y="73.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve"></text>
<text x="235" y="73.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">store trailer</text>
<text x="405" y="73.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">social clip</text>
<text x="575" y="73.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">edit master</text>
<text x="30" y="107.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">aspect</text>
<text x="235" y="107.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">16:9 (or the store&#x27;s)</text>
<text x="405" y="107.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">9:16, tall</text>
<text x="575" y="107.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">as recorded</text>
<rect x="20" y="120" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="141.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">resolution</text>
<text x="235" y="141.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1920 × 1080</text>
<text x="405" y="141.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1080 × 1920</text>
<text x="575" y="141.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1920 × 1080 or more</text>
<text x="30" y="175.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">frame rate</text>
<text x="235" y="175.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">30 fps</text>
<text x="405" y="175.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">30 fps</text>
<text x="575" y="175.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">as recorded (60)</text>
<rect x="20" y="188" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="209.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">codec / file</text>
<text x="235" y="209.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">H.264 in MP4</text>
<text x="405" y="209.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">H.264 in MP4</text>
<text x="575" y="209.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">ProRes or high bitrate</text>
<text x="30" y="243.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">length</text>
<text x="235" y="243.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">short (≈ 30 s)</text>
<text x="405" y="243.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">15–30 s</text>
<text x="575" y="243.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">the whole capture</text>
<rect x="20" y="52" width="640" height="204" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="284" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Always check the current help pages of the store or platform before the export.</text>
</svg>
