<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="640" height="440" fill="#ffffff"/>
<text x="24" y="36" font-size="22" fill="#2a2f2c" text-anchor="start" font-weight="800">Follow-up Chat: make the answer better</text>
<rect x="24" y="50" width="592" height="40" rx="12" fill="#fff8f1" stroke="#ffc078" stroke-width="1.5"/>
<text x="36" y="75" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Goal: 3 short tips to save money, for students, as a list, in English.</text>
<rect x="24" y="100" width="104" height="24" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/>
<text x="76" y="117" font-size="12.5" fill="#2b8a3e" text-anchor="middle" font-weight="800">3 tips</text>
<rect x="136" y="100" width="104" height="24" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/>
<text x="188" y="117" font-size="12.5" fill="#2b8a3e" text-anchor="middle" font-weight="800">for students</text>
<rect x="248" y="100" width="104" height="24" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/>
<text x="300" y="117" font-size="12.5" fill="#2b8a3e" text-anchor="middle" font-weight="800">a list</text>
<rect x="360" y="100" width="104" height="24" rx="8" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<text x="412" y="117" font-size="12.5" fill="#868e96" text-anchor="middle" font-weight="800">short</text>
<rect x="472" y="100" width="104" height="24" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/>
<text x="524" y="117" font-size="12.5" fill="#2b8a3e" text-anchor="middle" font-weight="800">English</text>
<rect x="24" y="134" width="592" height="210" rx="14" fill="#fbfaf8" stroke="#d9d4cf" stroke-width="1.5"/>
<rect x="360" y="146" width="244" height="30" rx="12" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="372" y="166" font-size="13" fill="#fff" text-anchor="start" font-weight="700">Make it a list of 3 tips.</text>
<rect x="36" y="186" width="520" height="96" rx="12" fill="#fff" stroke="#e3dcd5" stroke-width="1.5"/>
<text x="48" y="204" font-size="11" fill="#0b7285" text-anchor="start" font-weight="800">AI assistant</text>
<text x="48" y="226" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">1. Cook at home with friends instead of eating at restaurants ...</text>
<text x="48" y="246" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">2. Use your student discount: many shops, buses and apps ...</text>
<text x="48" y="266" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">3. Buy used books from older students, or borrow them ...</text>
<rect x="300" y="296" width="304" height="30" rx="12" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="312" y="316" font-size="13" fill="#fff" text-anchor="start" font-weight="700">Make each tip short, under 10 words.</text>
<rect x="24" y="356" width="190" height="32" rx="10" fill="#fff" stroke="#D9480F" stroke-width="1.5"/>
<text x="119" y="377" font-size="12.5" fill="#D9480F" text-anchor="middle" font-weight="800">Write it for students.</text>
<rect x="224" y="356" width="190" height="32" rx="10" fill="#fff" stroke="#D9480F" stroke-width="1.5"/>
<text x="319" y="377" font-size="12.5" fill="#D9480F" text-anchor="middle" font-weight="800">Add more details.</text>
<rect x="424" y="356" width="190" height="32" rx="10" fill="#fff" stroke="#D9480F" stroke-width="1.5"/>
<text x="519" y="377" font-size="12.5" fill="#D9480F" text-anchor="middle" font-weight="800">Translate it into Arabic.</text>
</svg>
