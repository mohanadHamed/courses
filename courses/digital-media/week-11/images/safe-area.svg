<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Text inside the title safe area</text>
<rect x="40" y="52" width="400" height="225" rx="3" fill="#a5d8ff" stroke="#495057" stroke-width="1.2"/>
<rect x="40" y="200.5" width="400" height="76.5" rx="0" fill="#4dabf7"/>
<rect x="288" y="146.5" width="120" height="54" rx="0" fill="#868e96"/>
<polygon points="136,200.5 224,200.5 208,227.5 152,227.5" fill="#e8590c"/>
<circle cx="180" cy="182.5" r="15.8" fill="#ffd8a8" stroke="#495057" stroke-width="1"/>
<rect x="60" y="63.2" width="360" height="202.5" rx="0" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="80" y="74.5" width="320" height="180" rx="0" fill="none" stroke="#ffd43b" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="240" y="119.5" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">ROOFTOP RESCUE</text>
<text x="436" y="269" font-size="16" fill="#c92a2a" text-anchor="end" font-weight="800" xml:space="preserve">Play fr</text>
<rect x="460" y="52" width="200" height="225" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="474" y="76" font-size="14" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Safe areas</text>
<text x="474" y="92" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">White: the action safe area</text>
<text x="474" y="107.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">(90 %).</text>
<text x="474" y="134" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Yellow: the title safe area</text>
<text x="474" y="149.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">(80 %): all text inside.</text>
<text x="474" y="196" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Red: “Play free” is cut off on</text>
<text x="474" y="211.6" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">some phones and TVs.</text>
</svg>
