<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Launch Planner</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .sim .tabs button.on { background: var(--sim-accent); color: #fff; }
    .sim table.p { border-collapse: collapse; width: 100%; font-size: .92rem; }
    .sim table.p td, .sim table.p th { border: 1px solid #e9ecef; padding: 6px 8px; text-align: left; vertical-align: top; }
    .sim table.p th { background: #fff9db; color: #7a5a00; width: 38%; }
    .sim .note { font-size: .85rem; color: var(--sim-muted); }
  </style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Launch Planner: Android, iOS or both?</h1>
  <p class="hint"><i>Byte Bay</i> plans the launch of <i>Pocket Quest</i>. Choose the platforms and what the studio has. The planner shows what the launch needs.</p>
  <div class="tabs" id="plat"></div>
  <div class="tabs" id="mac"></div>
  <table class="p" id="t"></table>
  <p class="message" id="msg"></p>
  <p class="note">Round numbers for a plan, checked in 2026; fees and shares change: always check the official pages.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const s = { plat: "android", mac: false };
  const P = {
    android: { reach: 70, fee: "25 USD, once (Google Play)", devices: 3, build: "any PC (Windows, macOS or Linux)", review: "usually hours to a few days", pkg: ".aab for Google Play" },
    ios: { reach: 30, fee: "99 USD every year (Apple Developer Program)", devices: 2, build: "a Mac with Xcode", review: "usually one to two days", pkg: ".ipa through App Store Connect" },
  };
  function tabs(id, items, key) {
    Kit.buttons($(id), items.map(([k, label]) => ({ k, label })), (k) => { s[key] = k === "true" ? true : k === "false" ? false : k; tabs(id, items, key); show(); });
    $(id).querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.k === String(s[key])));
  }
  function show() {
    const L = s.plat === "both" ? ["android", "ios"] : [s.plat];
    const reach = L.reduce((a, k) => a + P[k].reach, 0);
    const rows = [
      ["Phones it can reach (worldwide)", `about ${reach} %`],
      ["Developer account", L.map((k) => P[k].fee).join(" + ")],
      ["Build machine", L.map((k) => P[k].build).join(" and ")],
      ["Test phones (at least)", `${L.reduce((a, k) => a + P[k].devices, 0)} (${L.map((k) => (k === "android" ? "weak, typical, strong Android" : "an older and a newer iPhone")).join("; ")})`],
      ["Store review", L.map((k) => (k === "android" ? "Google: " : "Apple: ") + P[k].review).join("; ")],
      ["Package to upload", L.map((k) => P[k].pkg).join("; ")],
    ];
    $("t").innerHTML = rows.map(([a, b]) => `<tr><th>${a}</th><td>${b}</td></tr>`).join("");
    const needMac = L.includes("ios") && !s.mac;
    $("msg").textContent = needMac ? "Problem: an iOS build needs a Mac with Xcode. Byte Bay must buy or rent a Mac first." :
      s.plat === "both" ? "Both: the most players, but two accounts, two builds, more test phones and two reviews." :
      s.plat === "android" ? "Android only: most phones and a cheap account, but many devices to test." : "iOS only: fewer phones, but a small set of devices to test and players who often spend more in games.";
    $("msg").classList.toggle("bad", needMac);
  }
  tabs("plat", [["android", "Android only"], ["ios", "iOS only"], ["both", "Android and iOS"]], "plat");
  tabs("mac", [["false", "Byte Bay has only Windows PCs"], ["true", "Byte Bay has a Mac"]], "mac");
  window.LP = { set: (o) => { Object.assign(s, o); tabs("plat", [["android", "Android only"], ["ios", "iOS only"], ["both", "Android and iOS"]], "plat"); tabs("mac", [["false", "Byte Bay has only Windows PCs"], ["true", "Byte Bay has a Mac"]], "mac"); show(); } };
  show();
})();
</script>
</body>
</html>
