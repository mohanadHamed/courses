<text x="350" y="73.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">frame rate</text>
<text x="470" y="73.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">memory</text>
<text x="595" y="73.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">download</text>
<text x="30" y="111.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">phone P5</text>
<text x="230" y="111.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">720p</text>
