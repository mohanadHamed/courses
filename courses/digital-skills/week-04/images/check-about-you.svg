<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="280" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Before you send: check what the AI wrote about you</text>
<rect x="20" y="52" width="310" height="92" rx="12" fill="#ffffff" stroke="#c92a2a" stroke-width="1.8"/>
<text x="34" y="76" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Is it true?</text>
<text x="34" y="98.8" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Delete invented jobs, degrees and skills.</text>
<rect x="350" y="52" width="310" height="92" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="1.8"/>
<text x="364" y="76" font-size="15" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">Is it private?</text>
<text x="364" y="98.8" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">No ID number, no home address, no grades in</text>
<text x="364" y="115.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a prompt.</text>
<rect x="20" y="158" width="310" height="92" rx="12" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="34" y="182" font-size="15" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">Is it yours?</text>
<text x="34" y="204.8" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Change words so that it sounds like you.</text>
<rect x="350" y="158" width="310" height="92" rx="12" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="364" y="182" font-size="15" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Is it clear?</text>
<text x="364" y="204.8" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">One page, the same format, no spelling</text>
<text x="364" y="221.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">mistakes.</text>
</svg>
