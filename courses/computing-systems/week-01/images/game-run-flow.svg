<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="840" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A86700"/></marker></defs>
<rect x="20" y="40" width="140" height="120" rx="14" fill="#FFF6DB" stroke="#A86700" stroke-width="2.5"/>
<text x="90.0" y="70" font-size="18" fill="#A86700" text-anchor="middle">1  App store</text>
<text x="90.0" y="96" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">you download</text>
<text x="90.0" y="116" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">the game</text>
<line x1="162" y1="100" x2="180" y2="100" stroke="#A86700" stroke-width="3" marker-end="url(#a)"/>
<rect x="184" y="40" width="140" height="120" rx="14" fill="#FFF6DB" stroke="#A86700" stroke-width="2.5"/>
<text x="254.0" y="70" font-size="18" fill="#A86700" text-anchor="middle">2  Storage</text>
<text x="254.0" y="96" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">the game is</text>
<text x="254.0" y="116" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">installed here</text>
<line x1="326" y1="100" x2="344" y2="100" stroke="#A86700" stroke-width="3" marker-end="url(#a)"/>
<rect x="348" y="40" width="140" height="120" rx="14" fill="#FFF6DB" stroke="#A86700" stroke-width="2.5"/>
<text x="418.0" y="70" font-size="18" fill="#A86700" text-anchor="middle">3  Memory</text>
<text x="418.0" y="96" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">you tap the icon:</text>
<text x="418.0" y="116" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">the game loads</text>
<text x="418.0" y="136" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">into RAM</text>
<line x1="490" y1="100" x2="508" y2="100" stroke="#A86700" stroke-width="3" marker-end="url(#a)"/>
<rect x="512" y="40" width="140" height="120" rx="14" fill="#FFF6DB" stroke="#A86700" stroke-width="2.5"/>
<text x="582.0" y="70" font-size="18" fill="#A86700" text-anchor="middle">4  CPU + GPU</text>
<text x="582.0" y="96" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">run the rules,</text>
<text x="582.0" y="116" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">draw the world</text>
<line x1="654" y1="100" x2="672" y2="100" stroke="#A86700" stroke-width="3" marker-end="url(#a)"/>
<rect x="676" y="40" width="140" height="120" rx="14" fill="#FFF6DB" stroke="#A86700" stroke-width="2.5"/>
<text x="746.0" y="70" font-size="18" fill="#A86700" text-anchor="middle">5  Screen</text>
<text x="746.0" y="96" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">and speaker:</text>
<text x="746.0" y="116" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">you play</text>
<path d="M746.0,162 L746.0,235 L582.0,235 L582.0,168" fill="none" stroke="#A86700" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a)"/>
<text x="664.0" y="258" font-size="13" font-weight="400" font-style="italic" fill="#7a6a60" text-anchor="middle">Your touch goes back to the CPU.</text>
<text x="664.0" y="276" font-size="13" font-weight="400" font-style="italic" fill="#7a6a60" text-anchor="middle">This loop runs many times every second.</text>
</svg>
