<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Preparing a real Android device for testing</text>
<rect x="20" y="60" width="118" height="150" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<circle cx="79" cy="92" r="18" fill="#A86700"/>
<text x="79" y="99" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<text x="79" y="134" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Settings → About</text>
<text x="79" y="148.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">→ tap the build</text>
<text x="79" y="163.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">number 7 times</text>
<rect x="150" y="60" width="118" height="150" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<circle cx="209" cy="92" r="18" fill="#A86700"/>
<text x="209" y="99" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<text x="209" y="134" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Developer options</text>
<text x="209" y="148.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">→ USB debugging</text>
<text x="209" y="163.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">on</text>
<rect x="280" y="60" width="118" height="150" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<circle cx="339" cy="92" r="18" fill="#A86700"/>
<text x="339" y="99" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<text x="339" y="134" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Connect the USB</text>
<text x="339" y="148.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">cable</text>
<rect x="410" y="60" width="118" height="150" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<circle cx="469" cy="92" r="18" fill="#A86700"/>
<text x="469" y="99" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<text x="469" y="134" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">On the phone:</text>
<text x="469" y="148.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">allow this</text>
<text x="469" y="163.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">computer</text>
<rect x="540" y="60" width="118" height="150" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<circle cx="599" cy="92" r="18" fill="#A86700"/>
<text x="599" y="99" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">5</text>
<text x="599" y="134" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">adb devices</text>
<text x="599" y="148.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">shows the phone</text>
<text x="340" y="236" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">On an iPhone: a Mac with Xcode, the phone registered as a development device, or TestFlight for beta builds.</text>
</svg>
