<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A rights check for every asset</text>
<rect x="20" y="60" width="118" height="110" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="79" y="88" font-size="13" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">1 Who made it?</text>
<text x="79" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the creator and</text>
<text x="79" y="146.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the source</text>
<line x1="140" y1="115" x2="140.7" y2="115" stroke="#868e96" stroke-width="2" stroke-linecap="round"/>
<polygon points="149,115 139.8,119.6 139.8,110.4" fill="#868e96"/>
<rect x="150" y="60" width="118" height="110" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="209" y="88" font-size="13" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">2 Who owns it?</text>
<text x="209" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">us, or someone</text>
<text x="209" y="146.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">else?</text>
<line x1="270" y1="115" x2="270.7" y2="115" stroke="#868e96" stroke-width="2" stroke-linecap="round"/>
<polygon points="279,115 269.8,119.6 269.8,110.4" fill="#868e96"/>
<rect x="280" y="60" width="118" height="110" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="339" y="88" font-size="13" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">3 Which</text>
<text x="339" y="104.9" font-size="13" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">licence?</text>
<text x="339" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the exact text,</text>
<text x="339" y="146.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">saved</text>
<line x1="400" y1="115" x2="400.7" y2="115" stroke="#868e96" stroke-width="2" stroke-linecap="round"/>
<polygon points="409,115 399.8,119.6 399.8,110.4" fill="#868e96"/>
<rect x="410" y="60" width="118" height="110" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="469" y="88" font-size="13" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">4 Does our use</text>
<text x="469" y="104.9" font-size="13" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">fit?</text>
<text x="469" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">commercial?</text>
<text x="469" y="146.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">changed? where?</text>
<line x1="530" y1="115" x2="530.7" y2="115" stroke="#868e96" stroke-width="2" stroke-linecap="round"/>
<polygon points="539,115 529.8,119.6 529.8,110.4" fill="#868e96"/>
<rect x="540" y="60" width="118" height="110" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="599" y="88" font-size="13" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">5 Credit</text>
<text x="599" y="104.9" font-size="13" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">written?</text>
<text x="599" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">in the credits file</text>
<rect x="20" y="196" width="310" height="54" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/>
<text x="175" y="228" font-size="14" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">all yes: use it</text>
<rect x="350" y="196" width="310" height="54" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="505" y="228" font-size="14" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">a no: ask, replace or remove</text>
<text x="340" y="290" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Rights clearance: check before the release, not after a takedown notice.</text>
</svg>
