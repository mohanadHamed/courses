# The lectures of the course in teaching order (titles from the official
# syllabus). Students and the teacher count lectures, not weeks: a missed or
# late week moves every course differently, so the site never shows weeks.
# Exams are not listed: the university sets them.
#
# Files: lecture n is lesson-NN.qmd (NN = n) in the folder week-PP, where
# PP = (n + 1) / 2 rounded down: lectures 1-2 are in week-01, 3-4 in week-02,
# and so on. The folder name is internal (it keeps old links and QR codes
# working) and is never shown. Homework k (homework-0k.qmd, in week-0k)
# follows lectures 2k-1 and 2k. A lecture is ready (bright, with links) when
# its lesson-NN.qmd exists and has no `draft: true`; otherwise it is faded.
lectures:
  - {n: 1, title: "Mathematics in Game Development and Coordinate Systems", ilos: [A1]}
  - {n: 2, title: "Vectors: Definition, Components and Basic Operations", ilos: [A1]}
  - {n: 3, title: "Vector Operations: Addition, Scaling, Magnitude and Normalization", ilos: [A1, B1]}
  - {n: 4, title: "The Dot Product and the Angle Between Vectors", ilos: [A1, B1]}
  - {n: 5, title: "The Cross Product: Direction and Surface Normals", ilos: [B1]}
  - {n: 6, title: "Distance, Projection and Direction in Game Worlds", ilos: [B1]}
  - {n: 7, title: "Trigonometry: Sine, Cosine, Tangent and the Unit Circle", ilos: [A2]}
  - {n: 8, title: "Applied Trigonometry: Angles, Rotation and Oscillating Motion", ilos: [A2, B1]}
  - {n: 9, title: "Matrices: Definition and Basic Operations", ilos: [A1]}
  - {n: 10, title: "Matrix Multiplication, the Identity and the Inverse", ilos: [A1, C1]}
  - {n: 11, title: "Translation and Scaling Transformations", ilos: [C1]}
  - {n: 12, title: "Rotation in 2D", ilos: [C1]}
  - {n: 13, title: "Homogeneous Coordinates and Transformation Matrices", ilos: [C1]}
  - {n: 14, title: "3D Transformations: Translation, Rotation and Scaling", ilos: [C1]}
  - {n: 15, title: "Revision of Lectures 1–14", ilos: [A1, A2, B1, C1]}
  - {n: 16, title: "Mathematical Logic: Propositions and Logical Operators", ilos: [A2]}
  - {n: 17, title: "Truth Tables and Logical Conditions in Game Rules", ilos: [A2, B2]}
  - {n: 18, title: "Boolean Algebra and Decision Conditions", ilos: [B2]}
  - {n: 19, title: "Applying Logic to Game Rules and Decisions", ilos: [B2]}
  - {n: 20, title: "Probability Basics: Events and Sample Space", ilos: [A2]}
  - {n: 21, title: "Conditional Probability and Expected Value", ilos: [A2, B2]}
  - {n: 22, title: "Random Numbers: Pseudo-Random Generators and Seeds", ilos: [C2]}
  - {n: 23, title: "Random Distributions: Uniform and Weighted", ilos: [C2]}
  - {n: 24, title: "Probability for Game Balance: Drop Rates and Difficulty", ilos: [C2]}
  - {n: 25, title: "Randomness and Fairness: The Player's Perception", ilos: [C2]}
  - {n: 26, title: "Applied Problem Set: Vectors, Transformations and Probability", ilos: [B1, C1]}
  - {n: 27, title: "Case Study: Movement of a 2D Object", ilos: [B1, C1, D1]}
  - {n: 28, title: "Case Study: Random Level and Event Generation", ilos: [C2]}
  - {n: 29, title: "Course Revision", ilos: [C2, D1]}
