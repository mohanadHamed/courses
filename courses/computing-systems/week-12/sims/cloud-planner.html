<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Cloud Planner</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #fff9db; border: 1.5px solid #A86700; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Cloud Planner</h1>
  <p class="hint">Players of <i>Pocket Quest</i> send wishes and complaints. For each one, choose the cloud service or the setting that solves it.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "“I lost my phone, and with it level 12 and 840 coins. Can I continue on my new phone?”", answer: "cloud save", choices: C(["cloud save", "a CDN", "a bigger phone", "a dedicated server"]), good: "A cloud save keeps the progress on a server; after the login it loads on any device." },
    { card: "“Downloading level pack 3 (80 MB) takes ages in Amman.”", answer: "a CDN with an edge near the players", choices: C(["a CDN with an edge near the players", "a cloud save", "more race servers", "a smaller icon"]), good: "A CDN keeps copies of the files near the players." },
    { card: "“In live races, other cars jump. My ping to the race server is 90 ms.”", answer: "race servers in a region near the players", choices: C(["race servers in a region near the players", "a bigger storage bucket", "a new logo", "more cloud saves"]), good: "A region near the players lowers the latency of every race." },
    { card: "“Some players report impossible race times. The phones decide who wins.”", answer: "a dedicated server decides the race", choices: C(["a dedicated server decides the race", "a CDN", "a free tier", "a slower phone"]), good: "A dedicated server decides what really happens; a cheating phone cannot change it alone." },
    { card: "A teammate wants to put the secret key of the payment service inside the game app.", answer: "never: secrets stay on the server", choices: C(["never: secrets stay on the server", "yes, if the file is hidden", "yes, in the store listing", "yes, with a strong font"]), good: "Anyone can unpack a game app. Secret keys stay in the cloud back end." },
    { card: "The cloud bill doubled this month: 50,000 players downloaded the 80 MB pack straight from the storage, far away.", answer: "use the CDN and smaller packs", choices: C(["use the CDN and smaller packs", "delete the cloud saves", "turn off the leaderboard", "buy more storage"]), good: "Downloads cost money: a CDN keeps copies near the players, and smaller files cost less." },
  ];
  rounds.forEach((r) => { r.goal = "What solves it?"; r.why = {}; });
  const g = Kit.game({ rounds, cols: 1, colsPhone: 1, animMs: 600, intro: "Round 1 is the story of the lesson: a player loses a phone." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "The cloud plan of Pocket Quest is ready." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
