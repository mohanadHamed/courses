<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Rotate Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .out { font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 8px; line-height: 1.55; } .sim .out .m { color: #1c7ed6; }</style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Rotate Lab: R(θ) and the pivot</h1>
  <p class="hint">Turn the green house by the angle θ around the orange pivot. Drag on the grid to move the pivot. The numbers show the three steps for the corner P = (2, 2).</p>
  <canvas id="c" aria-label="A grid with a house and the house turned around a pivot"></canvas>
  <div class="controls" id="sl"></div>
  <p class="out" id="out"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const HOUSE = [[0, 0], [2, 0], [2, 2], [1, 3], [0, 2]];
  let th = 30, pv = [0, 0];
  const $ = (id) => document.getElementById(id), f = (v) => Kit.fmt(v, 2);
  const rot = (p) => { const a = th * Math.PI / 180, x = p[0] - pv[0], y = p[1] - pv[1]; return [pv[0] + x * Math.cos(a) - y * Math.sin(a), pv[1] + x * Math.sin(a) + y * Math.cos(a)]; };
  Kit.slider($("sl"), "θ", -180, 180, 15, th, (v) => { th = v; out(); }, (v) => Kit.fmt(v, 0) + "°");
  const reset = Kit.el("button", { type: "button", class: "ghost" }, "Pivot to the origin");
  reset.addEventListener("click", () => { pv = [0, 0]; out(); });
  $("sl").appendChild(reset);
  function out() {
    const a = th * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), d = [2 - pv[0], 2 - pv[1]];
    const r = [d[0] * c - d[1] * s, d[0] * s + d[1] * c];
    $("out").innerHTML = `<span class="m">R(${th}°) = rows (${f(c)}, ${f(-s)}) and (${f(s)}, ${f(c)})</span><br>` +
      `1. P − pivot = (${f(d[0])}, ${f(d[1])})<br>2. Rotate: (${f(r[0])}, ${f(r[1])})<br>3. + pivot: P' = (${f(r[0] + pv[0])}, ${f(r[1] + pv[1])})` +
      `<br>Length before ${f(Math.hypot(d[0], d[1]))}, after ${f(Math.hypot(r[0], r[1]))}: a rotation keeps lengths.`;
  }
  const cv = Kit.canvas($("c"), (W) => Math.min(380, W * 0.72));
  let G = null, drag = false;
  const at = (e) => { const b = $("c").getBoundingClientRect(); return [Math.round((e.clientX - b.left - G.X(0)) / G.u), Math.round((G.Y(0) - (e.clientY - b.top)) / G.u)]; };
  $("c").addEventListener("pointerdown", (e) => { drag = true; $("c").setPointerCapture(e.pointerId); pv = at(e); out(); });
  $("c").addEventListener("pointermove", (e) => { if (drag) { const p = at(e); if (p[0] !== pv[0] || p[1] !== pv[1]) { pv = p; out(); } } });
  $("c").addEventListener("pointerup", () => (drag = false));
  window.RL = { set: (t, p) => { th = t; pv = p; document.querySelector("#sl input").value = t; document.querySelector("#sl .readout").textContent = Kit.fmt(t, 0) + "°"; out(); } };
  Kit.loop(() => {
    const c = cv.ctx;
    G = Kit.grid(c, cv.W, cv.H, -6, 6, -4, 5, { step: 2 });
    const draw = (pts, fill, stroke, dash) => { c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(G.X(p[0]), G.Y(p[1])) : c.moveTo(G.X(p[0]), G.Y(p[1])))); c.closePath(); c.fillStyle = fill; c.fill(); c.setLineDash(dash || []); c.strokeStyle = stroke; c.lineWidth = 2.2; c.stroke(); c.setLineDash([]); };
    draw(HOUSE, "rgba(47,158,68,0.2)", "#2F9E44");
    draw(HOUSE.map(rot), "rgba(28,126,214,0.2)", "#1c7ed6", [6, 4]);
    const q = rot([2, 2]);
    c.strokeStyle = "rgba(232,89,12,0.6)"; c.lineWidth = 1.5; c.setLineDash([3, 4]);
    c.beginPath(); c.moveTo(G.X(pv[0]), G.Y(pv[1])); c.lineTo(G.X(2), G.Y(2)); c.moveTo(G.X(pv[0]), G.Y(pv[1])); c.lineTo(G.X(q[0]), G.Y(q[1])); c.stroke(); c.setLineDash([]);
    const r = Math.hypot(2 - pv[0], 2 - pv[1]) * G.u, a0 = Math.atan2(2 - pv[1], 2 - pv[0]);
    if (r > 1 && th) { c.strokeStyle = "#e8590c"; c.lineWidth = 2; c.beginPath(); c.arc(G.X(pv[0]), G.Y(pv[1]), r, -a0, -a0 - th * Math.PI / 180, th > 0); c.stroke(); }
    c.fillStyle = "#2F9E44"; c.beginPath(); c.arc(G.X(2), G.Y(2), 5, 0, 7); c.fill(); Kit.text(c, "P", G.X(2) + 8, G.Y(2) - 6, 12, "#2F9E44", "left");
    c.fillStyle = "#1c7ed6"; c.beginPath(); c.arc(G.X(q[0]), G.Y(q[1]), 5, 0, 7); c.fill(); Kit.text(c, "P'", G.X(q[0]) + 8, G.Y(q[1]) - 6, 12, "#1c7ed6", "left");
    c.fillStyle = "#e8590c"; c.beginPath(); c.arc(G.X(pv[0]), G.Y(pv[1]), 7, 0, 7); c.fill();
  });
  out();
})();
</script>
</body>
</html>
