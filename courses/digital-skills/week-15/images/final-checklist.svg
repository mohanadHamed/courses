<svg xmlns="http://www.w3.org/2000/svg" width="680" height="256" viewBox="0 0 680 256" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="256" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The final project: three files and one statement</text>
<rect x="20" y="50" width="206" height="168" rx="12" fill="#ffffff" stroke="#217346" stroke-width="1.8"/>
<text x="34" y="74" font-size="15" fill="#217346" text-anchor="start" font-weight="800" xml:space="preserve">project.xlsx</text>
<text x="34" y="96.8" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• one clean table, no gaps</text>
<text x="34" y="115.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• a formula column</text>
<text x="34" y="133.9" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• a PivotTable summary</text>
<text x="34" y="152.5" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• one chart with a title</text>
<rect x="238" y="50" width="206" height="168" rx="12" fill="#ffffff" stroke="#2b579a" stroke-width="1.8"/>
<text x="252" y="74" font-size="15" fill="#2b579a" text-anchor="start" font-weight="800" xml:space="preserve">report.docx</text>
<text x="252" y="96.8" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• Heading 1 for each part</text>
<text x="252" y="115.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• a table of contents and</text>
<text x="252" y="130.9" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">page numbers</text>
<text x="252" y="149.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• the chart and checked</text>
<text x="252" y="165.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">numbers</text>
<text x="252" y="183.8" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• the AI-use statement</text>
<rect x="456" y="50" width="206" height="168" rx="12" fill="#ffffff" stroke="#c43e1c" stroke-width="1.8"/>
<text x="470" y="74" font-size="15" fill="#c43e1c" text-anchor="start" font-weight="800" xml:space="preserve">talk.pptx</text>
<text x="470" y="96.8" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• five slides, few words</text>
<text x="470" y="115.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• speaker notes</text>
<text x="470" y="133.9" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• the four checks passed</text>
<text x="470" y="152.5" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">• the AI-use line on slide 5</text>
<text x="340" y="244" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">No personal data in any file. Use the file names on this page.</text>
</svg>
