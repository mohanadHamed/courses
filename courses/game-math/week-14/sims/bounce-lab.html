<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Bounce Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 5px 0; font-weight: 700; font-size: .9rem; }
    .sim .task { font-weight: 800; color: var(--sim-accent); margin: 6px 0 0; }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Bounce Lab: reflect the velocity</h1>
  <p class="hint">A repair drone of <i>Star Dock</i> flies in a closed hangar. Choose its start velocity and the bounciness e of the walls, then launch it. At each hit the lab shows v, the wall's normal n and v' = v − (1 + e)(v · n)n.</p>
  <div class="bar" id="sl"></div>
  <div class="bar"><button type="button" id="go">Launch ▶</button></div>
  <canvas id="c" aria-label="The drone bouncing in the hangar"></canvas>
  <p class="calc" id="calc"></p>
  <p class="task" id="task"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const s = { vx: 4, vy: -3, e: 1, pos: null, vel: null, hits: [], last: null };
  const TASKS = [
    { q: "Task 1: Launch with v = (4, −3) and e = 1. What is the velocity after the first bounce on the floor?", ok: () => s.hits.some((h) => h.wall === "floor" && h.e === 1 && h.v[0] === 4 && h.v[1] === -3) },
    { q: "Task 2: Set e = 0.8 and launch again. What is v' after the floor now?", ok: () => s.hits.some((h) => h.wall === "floor" && h.e === 0.8) },
    { q: "Task 3: Watch a hit on the right wall (n = (−1, 0)). Which part of v changes its sign?", ok: () => s.hits.some((h) => h.wall === "right wall") },
  ];
  let ti = 0, ready = false;
  const sl = {};
  sl.vx = Kit.slider($("sl"), "vx", -5, 5, 1, s.vx, (v) => { s.vx = v; if (ready) upd(); });
  sl.vy = Kit.slider($("sl"), "vy", -5, 5, 1, s.vy, (v) => { s.vy = v; if (ready) upd(); });
  sl.e = Kit.slider($("sl"), "bounciness e", 0, 1, 0.1, s.e, (v) => { s.e = Math.round(v * 10) / 10; if (ready) upd(); });
  const cv = Kit.canvas($("c"), (W) => Math.min(280, W * 0.5));
  const U = 26, f1 = (v) => Kit.fmt(v, 2);
  function launch() { s.pos = [3, (cv.H / U) - 3]; s.vel = [s.vx, s.vy]; s.last = null; upd(); }
  let lastT = performance.now();
  Kit.loop((now) => {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    const c = cv.ctx, W = cv.W, H = cv.H, w = W / U, h = H / U;
    c.fillStyle = "#f1f3f5"; c.fillRect(0, 0, W, H);
    c.strokeStyle = "#868e96"; c.lineWidth = 6; c.strokeRect(3, 3, W - 6, H - 6);
    if (s.pos) {
      s.pos[0] += s.vel[0] * dt * 1.5; s.pos[1] += s.vel[1] * dt * 1.5;
      const walls = [["floor", [0, 1], () => s.pos[1] < 0.5, () => (s.pos[1] = 0.5)], ["ceiling", [0, -1], () => s.pos[1] > h - 0.5, () => (s.pos[1] = h - 0.5)], ["left wall", [1, 0], () => s.pos[0] < 0.5, () => (s.pos[0] = 0.5)], ["right wall", [-1, 0], () => s.pos[0] > w - 0.5, () => (s.pos[0] = w - 0.5)]];
      walls.forEach(([name, n, hit, fix]) => {
        const vn = s.vel[0] * n[0] + s.vel[1] * n[1];
        if (hit() && vn < 0) {
          const v = s.vel.slice(), k = (1 + s.e) * vn;
          s.vel = [v[0] - k * n[0], v[1] - k * n[1]]; fix();
          s.last = { wall: name, v, n, vn, nv: s.vel.slice(), e: s.e, at: s.pos.slice() }; s.hits.push(s.last); upd();
        }
      });
      if (Math.hypot(...s.vel) < 0.3 && s.pos[1] <= 0.55) s.vel = [0, 0];
      const x = s.pos[0] * U, y = H - s.pos[1] * U;
      if (s.last) {
        const ax = s.last.at[0] * U, ay = H - s.last.at[1] * U;
        c.strokeStyle = "#e8590c"; c.lineWidth = 2.5; c.beginPath(); c.moveTo(ax, ay); c.lineTo(ax + s.last.n[0] * 40, ay - s.last.n[1] * 40); c.stroke();
        Kit.text(c, "n", ax + s.last.n[0] * 48, ay - s.last.n[1] * 48 + 4, 13, "#e8590c");
      }
      c.fillStyle = "#1c7ed6"; c.beginPath(); c.arc(x, y, 10, 0, 7); c.fill();
      c.strokeStyle = "#2f9e44"; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x, y); c.lineTo(x + s.vel[0] * 8, y - s.vel[1] * 8); c.stroke();
    } else Kit.text(c, "Press Launch.", W / 2, H / 2, 14, "#6b726e");
  });
  function upd() {
    const L = s.last;
    $("calc").textContent = L ? `Hit: ${L.wall}, n = (${L.n.join(", ")}). v = (${f1(L.v[0])}, ${f1(L.v[1])}), v · n = ${f1(L.vn)}, e = ${L.e} → v' = (${f1(L.nv[0])}, ${f1(L.nv[1])}).` : `Start velocity (${s.vx}, ${s.vy}), e = ${s.e}.`;
    let m = "";
    while (ti < TASKS.length && TASKS[ti].ok()) { ti++; m = "✓ Done. "; Kit.good(); }
    $("task").textContent = ti < TASKS.length ? TASKS[ti].q : "All tasks are done: only the part of v along the normal turns, and e makes it smaller.";
    $("msg").textContent = m + "The part of v along the wall stays; the part into the wall turns around.";
  }
  $("go").addEventListener("click", launch);
  window.BL = { set: (o) => { Object.entries(o).forEach(([k, v]) => { s[k] = v; sl[k].value = v; sl[k].dispatchEvent(new Event("input")); }); upd(); }, launch };
  ready = true; upd();
})();
</script>
</body>
</html>
