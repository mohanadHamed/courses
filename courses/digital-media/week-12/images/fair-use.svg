<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Fair use (fair dealing): questions a court asks</text>
<rect x="20" y="50" width="310" height="72" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="34" y="78" font-size="14" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">1 Purpose</text>
<text x="34" y="102" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">teaching, review, parody, or selling a product?</text>
<rect x="350" y="50" width="310" height="72" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="364" y="78" font-size="14" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">2 Nature</text>
<text x="364" y="102" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">a fact or a creative work?</text>
<rect x="20" y="134" width="310" height="72" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="34" y="162" font-size="14" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">3 Amount</text>
<text x="34" y="186" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">a short part or the whole work?</text>
<rect x="350" y="134" width="310" height="72" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="364" y="162" font-size="14" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">4 Market</text>
<text x="364" y="186" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">does it replace the original or its sales?</text>
<rect x="20" y="222" width="640" height="62" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.8"/>
<text x="34" y="246" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The rules differ by country, and only a court decides. A game for sale is a commercial product:</text>
<text x="34" y="262.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">plan with licences, not with fair use.</text>
</svg>
