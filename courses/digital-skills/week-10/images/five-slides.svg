<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A five-slide talk of about three minutes</text>
<rect x="14" y="60" width="122" height="120" rx="10" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="75" y="90" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">1 Title</text>
<text x="75" y="114" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">topic, your name</text>
<rect x="43.6" y="151.5" width="62.8" height="21" rx="10.5" fill="#D9480F"/>
<text x="75" y="166" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">15–30 s</text>
<rect x="147" y="60" width="122" height="120" rx="10" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="208" y="90" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">2 Problem</text>
<text x="208" y="114" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">what is wrong now</text>
<rect x="176.6" y="151.5" width="62.8" height="21" rx="10.5" fill="#D9480F"/>
<text x="208" y="166" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">30–45 s</text>
<rect x="280" y="60" width="122" height="120" rx="10" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="341" y="90" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">3 Idea</text>
<text x="341" y="114" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">your suggestion</text>
<rect x="320" y="151.5" width="42" height="21" rx="10.5" fill="#D9480F"/>
<text x="341" y="166" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">45 s</text>
<rect x="413" y="60" width="122" height="120" rx="10" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="474" y="90" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">4 Example</text>
<text x="474" y="114" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">a number or a case</text>
<rect x="453" y="151.5" width="42" height="21" rx="10.5" fill="#D9480F"/>
<text x="474" y="166" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">45 s</text>
<rect x="546" y="60" width="122" height="120" rx="10" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="607" y="90" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">5 Thank you</text>
<text x="607" y="114" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">questions</text>
<rect x="575.6" y="151.5" width="62.8" height="21" rx="10.5" fill="#D9480F"/>
<text x="607" y="166" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">15–30 s</text>
<text x="340" y="216" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Each slide: one idea. The speaker notes hold what you say.</text>
</svg>
