<svg xmlns="http://www.w3.org/2000/svg" width="680" height="306" viewBox="0 0 680 306" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="306" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">P5 in a 20-minute race: uncapped or capped at 30 fps</text>
<line x1="60" y1="236" x2="480" y2="236" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round"/>
<line x1="60" y1="56" x2="60" y2="236" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round"/>
<polyline points="60,81.7 81,90.6 102,97.8 123,103.8 144,108.6 165,112.6 186,115.9 207,118.5 228,120.7 249,122.5 270,124 291,125.2 312,126.1 333,126.9 354,127.6 375,128.1 396,128.6 417,128.9 438,129.2 459,129.5 480,129.7" fill="none" stroke="#c92a2a" stroke-width="2.6" stroke-linejoin="round"/>
<polyline points="60,158.9 81,158.9 102,158.9 123,158.9 144,158.9 165,158.9 186,158.9 207,158.9 228,158.9 249,158.9 270,158.9 291,158.9 312,158.9 333,158.9 354,158.9 375,158.9 396,158.9 417,158.9 438,158.9 459,158.9 480,158.9" fill="none" stroke="#2b8a3e" stroke-width="2.6" stroke-linejoin="round"/>
<text x="486" y="133.7" font-size="11.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">41 fps, hot</text>
<text x="486" y="162.9" font-size="11.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">30 fps, warm</text>
<text x="60" y="252" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">0 min</text>
<text x="165" y="252" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">5 min</text>
<text x="270" y="252" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">10 min</text>
<text x="375" y="252" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">15 min</text>
<text x="480" y="252" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">20 min</text>
<text x="54" y="240" font-size="10.5" fill="#6b726e" text-anchor="end" font-weight="700" xml:space="preserve">0</text>
<text x="54" y="162.9" font-size="10.5" fill="#6b726e" text-anchor="end" font-weight="700" xml:space="preserve">30</text>
<text x="54" y="85.7" font-size="10.5" fill="#6b726e" text-anchor="end" font-weight="700" xml:space="preserve">60</text>
<text x="20" y="280" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Uncapped, the phone heats up and throttles: the frame rate falls and jumps. A 30 fps cap is steady and</text>
<text x="20" y="295.6" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">saves battery (example values).</text>
</svg>
