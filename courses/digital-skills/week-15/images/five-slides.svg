<svg xmlns="http://www.w3.org/2000/svg" width="680" height="236" viewBox="0 0 680 236" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="236" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Five slides for a three-minute talk</text>
<rect x="20" y="56" width="120" height="86" rx="6" fill="#ffffff" stroke="#c43e1c" stroke-width="2"/>
<rect x="20" y="56" width="120" height="22" rx="6" fill="#c43e1c"/>
<rect x="20" y="70" width="120" height="8" rx="0" fill="#c43e1c"/>
<text x="30" y="72" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">slide 1</text>
<text x="80" y="112" font-size="15" fill="#c43e1c" text-anchor="middle" font-weight="800" xml:space="preserve">Title</text>
<text x="80" y="170" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">topic, your name</text>
<rect x="150" y="56" width="120" height="86" rx="6" fill="#ffffff" stroke="#c43e1c" stroke-width="2"/>
<rect x="150" y="56" width="120" height="22" rx="6" fill="#c43e1c"/>
<rect x="150" y="70" width="120" height="8" rx="0" fill="#c43e1c"/>
<text x="160" y="72" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">slide 2</text>
<text x="210" y="112" font-size="15" fill="#c43e1c" text-anchor="middle" font-weight="800" xml:space="preserve">Question</text>
<text x="210" y="170" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">one clear question</text>
<rect x="280" y="56" width="120" height="86" rx="6" fill="#ffffff" stroke="#c43e1c" stroke-width="2"/>
<rect x="280" y="56" width="120" height="22" rx="6" fill="#c43e1c"/>
<rect x="280" y="70" width="120" height="8" rx="0" fill="#c43e1c"/>
<text x="290" y="72" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">slide 3</text>
<text x="340" y="112" font-size="15" fill="#c43e1c" text-anchor="middle" font-weight="800" xml:space="preserve">Chart</text>
<text x="340" y="170" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the answer in a</text>
<text x="340" y="185.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">picture</text>
<rect x="410" y="56" width="120" height="86" rx="6" fill="#ffffff" stroke="#c43e1c" stroke-width="2"/>
<rect x="410" y="56" width="120" height="22" rx="6" fill="#c43e1c"/>
<rect x="410" y="70" width="120" height="8" rx="0" fill="#c43e1c"/>
<text x="420" y="72" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">slide 4</text>
<text x="470" y="112" font-size="15" fill="#c43e1c" text-anchor="middle" font-weight="800" xml:space="preserve">Insights</text>
<text x="470" y="170" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">two checked</text>
<text x="470" y="185.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">sentences</text>
<rect x="540" y="56" width="120" height="86" rx="6" fill="#ffffff" stroke="#c43e1c" stroke-width="2"/>
<rect x="540" y="56" width="120" height="22" rx="6" fill="#c43e1c"/>
<rect x="540" y="70" width="120" height="8" rx="0" fill="#c43e1c"/>
<text x="550" y="72" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">slide 5</text>
<text x="600" y="112" font-size="15" fill="#c43e1c" text-anchor="middle" font-weight="800" xml:space="preserve">End</text>
<text x="600" y="170" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">thanks, AI-use line</text>
<text x="340" y="222" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">About 30–40 seconds per slide. Few words; you say the rest.</text>
</svg>
