<text x="400" y="70" font-size="16" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Angles in game maths</text>
<text x="400" y="100" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">0° points along +x.</text>
<text x="400" y="124" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">A positive angle turns</text>
<text x="400" y="148" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">anticlockwise.</text>
<text x="400" y="172" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">A negative angle turns</text>
<text x="400" y="196" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">clockwise: −45° = 315°.</text>
<text x="400" y="220" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">A full turn is 360°:</text>
<text x="400" y="244" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">370° is the same as 10°.</text>
