<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<rect x="10" y="10" width="660" height="310" rx="18" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
<text x="34" y="46" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">One chip does the main work: the SoC</text>
<rect x="40" y="70" width="400" height="230" rx="16" fill="#fff3bf" stroke="#A86700" stroke-width="2.5"/>
<text x="240" y="94" font-size="14" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">system on a chip (SoC)</text>
<rect x="56" y="108" width="176" height="52" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
<text x="68" y="130" font-size="13.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">CPU cores</text>
<text x="68" y="148" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">game logic, physics</text>
<rect x="248" y="108" width="176" height="52" rx="10" fill="#fff" stroke="#2b8a3e" stroke-width="2"/>
<text x="260" y="130" font-size="13.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">GPU</text>
<text x="260" y="148" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">draws every frame</text>
<rect x="56" y="170" width="176" height="52" rx="10" fill="#fff" stroke="#7048e8" stroke-width="2"/>
<text x="68" y="192" font-size="13.5" fill="#7048e8" text-anchor="start" font-weight="800" xml:space="preserve">other units</text>
<text x="68" y="210" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">sound, video, security</text>
<rect x="248" y="170" width="176" height="52" rx="10" fill="#fff" stroke="#0b7285" stroke-width="2"/>
<text x="260" y="192" font-size="13.5" fill="#0b7285" text-anchor="start" font-weight="800" xml:space="preserve">modem</text>
<text x="260" y="210" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">mobile data, online play</text>
<rect x="56" y="232" width="176" height="52" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2"/>
<text x="68" y="254" font-size="13.5" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">image processor</text>
<text x="68" y="272" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">camera pictures</text>
<rect x="248" y="232" width="176" height="52" rx="10" fill="#fff" stroke="#6b726e" stroke-width="2"/>
<text x="260" y="254" font-size="13.5" fill="#6b726e" text-anchor="start" font-weight="800" xml:space="preserve">memory controller</text>
<text x="260" y="272" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">talks to the RAM</text>
<rect x="470" y="120" width="170" height="120" rx="12" fill="#fff" stroke="#A86700" stroke-width="2"/>
<rect x="486" y="140" width="28" height="40" rx="4" fill="#e9ecef" stroke="#adb5bd" stroke-width="1"/>
<rect x="524" y="140" width="28" height="40" rx="4" fill="#e9ecef" stroke="#adb5bd" stroke-width="1"/>
<rect x="562" y="140" width="28" height="40" rx="4" fill="#e9ecef" stroke="#adb5bd" stroke-width="1"/>
<rect x="600" y="140" width="28" height="40" rx="4" fill="#e9ecef" stroke="#adb5bd" stroke-width="1"/>
<text x="555" y="205" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">RAM (8 GB)</text>
<text x="555" y="225" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">shared by CPU and GPU</text>
<line x1="442" y1="180" x2="458.8" y2="180" stroke="#A86700" stroke-width="3" stroke-linecap="round"/>
<polygon points="466,180 457.9,183.9 457.9,176.1" fill="#A86700" stroke="none" stroke-width="1.5"/>
<line x1="466" y1="196" x2="449.2" y2="196" stroke="#A86700" stroke-width="3" stroke-linecap="round"/>
<polygon points="442,196 450.1,192.1 450.1,199.9" fill="#A86700" stroke="none" stroke-width="1.5"/>
<text x="555" y="272" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">no separate</text>
<text x="555" y="288" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">video memory</text>
</svg>
