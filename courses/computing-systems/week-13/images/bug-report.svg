<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A good bug report</text>
<rect x="20" y="52" width="640" height="250" rx="12" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/>
<rect x="20" y="52" width="8" height="250" rx="0" fill="#c92a2a"/>
<text x="48" y="86" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Title</text>
<text x="160" y="86" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Race freezes when the screen turns to landscape</text>
<text x="48" y="117" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Build</text>
<text x="160" y="117" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">PocketQuest_1.3 (build 42)</text>
<text x="48" y="148" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Device</text>
<text x="160" y="148" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">AVD P5_API_30 (Android 11, 720 × 1600, 4 GB)</text>
<text x="48" y="179" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Steps</text>
<text x="160" y="179" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">1 start a race  2 turn the emulator to landscape</text>
<text x="48" y="210" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Expected</text>
<text x="160" y="210" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">the race goes on in landscape</text>
<text x="48" y="241" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Actual</text>
<text x="160" y="241" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">the screen freezes; Logcat shows an error</text>
<text x="48" y="272" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Attached</text>
<text x="160" y="272" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">screenshot, 20 lines of Logcat</text>
</svg>
