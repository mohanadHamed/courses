<text x="374" y="80" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Right + up at the same time</text>
<text x="374" y="102.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Without normalizing, the ship moves 41 %</text>
<text x="374" y="118.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">faster diagonally.</text>
<text x="374" y="137.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">input = input.normalized (if its length &gt; 1)</text>
<text x="374" y="156.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Then velocity = speed × input.</text>
