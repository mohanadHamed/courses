<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="310" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Commands of the seminar</text>
<rect x="20" y="50" width="640" height="36" rx="0" fill="#A86700"/>
<text x="30" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">command</text>
<text x="330" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">what it does</text>
<text x="30" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">emulator -list-avds</text>
<text x="330" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">lists the virtual devices</text>
<rect x="20" y="122" width="640" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">emulator -avd P5_API_30</text>
<text x="330" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">starts one virtual device</text>
<text x="30" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">adb devices</text>
<text x="330" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">lists the connected devices and emulators</text>
<rect x="20" y="194" width="640" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">adb install PocketQuest_1.3.apk</text>
<text x="330" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">installs the build</text>
<text x="30" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">adb logcat</text>
<text x="330" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">shows the system log (Ctrl + C stops it)</text>
<rect x="20" y="266" width="640" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="288.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">adb uninstall com.bytebay.pocketquest</text>
<text x="330" y="288.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">removes the app</text>
<rect x="20" y="50" width="640" height="252" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
