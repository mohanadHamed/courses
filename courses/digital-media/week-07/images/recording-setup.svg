<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A good recording: the room, the distance and the level</text>
<rect x="30" y="56" width="300" height="240" rx="14" fill="#fbf8ff" stroke="#9C36B5" stroke-width="1.8"/>
<text x="180" y="82" font-size="13" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">a quiet room with soft things</text>
<rect x="60" y="230" width="240" height="30" rx="6" fill="#e9d5c4"/>
<text x="180" y="250" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">curtains, a sofa, a rug</text>
<circle cx="110" cy="160" r="22" fill="#495057"/>
<rect x="104" y="182" width="12" height="40" rx="3" fill="#495057"/>
<circle cx="240" cy="150" r="26" fill="#f3c9a0"/>
<line x1="144.1" y1="159.6" x2="201.9" y2="156.4" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="210,156 201.3,161 200.8,152" fill="#e8590c"/>
<polygon points="136,160 144.7,155 145.2,164" fill="#e8590c"/>
<text x="173" y="140" font-size="12.5" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">15–30 cm</text>
<text x="78" y="166" font-size="12" fill="#2a2f2c" text-anchor="end" font-weight="800" xml:space="preserve">mic</text>
<text x="490" y="70" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">The meter of the recorder</text>
<rect x="360" y="100" width="260" height="20" rx="6" fill="#f1f3f5"/>
<rect x="360" y="100" width="65" height="20" rx="6" fill="#1c7ed6"/>
<text x="360" y="140" font-size="12.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">too quiet: −24 dB</text>
<rect x="360" y="164" width="260" height="20" rx="6" fill="#f1f3f5"/>
<rect x="360" y="164" width="161.2" height="20" rx="6" fill="#2b8a3e"/>
<text x="360" y="204" font-size="12.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">good: peaks near −6 dB</text>
<rect x="360" y="228" width="260" height="20" rx="6" fill="#f1f3f5"/>
<rect x="360" y="228" width="260" height="20" rx="6" fill="#c92a2a"/>
<text x="360" y="268" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">clipping: 0 dB</text>
<line x1="521.2" y1="94" x2="521.2" y2="300" stroke="#2b8a3e" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="340" y="320" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Fix the room and the level before you record: a bad take is hard to save later.</text>
</svg>
