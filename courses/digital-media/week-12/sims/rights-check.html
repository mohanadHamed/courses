<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Rights Check</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 5px 0; font-weight: 700; }
    .sim .bar button.on { background: var(--sim-accent); color: #fff; }
    .sim ol.steps { padding-left: 0; list-style: none; margin: 8px 0; }
    .sim ol.steps li { border: 1.5px solid #dee2e6; border-radius: 10px; padding: 6px 10px; margin: 5px 0; font-weight: 700; font-size: .92rem; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .sim ol.steps li.ok { border-color: #2b8a3e; background: #ebfbee; } .sim ol.steps li.no { border-color: #c92a2a; background: #fff5f5; } .sim ol.steps li.wait { color: #868e96; }
    .sim ol.steps li .q { min-width: 170px; }
    .sim .verdict { font-weight: 800; font-size: 1.05rem; margin: 6px 0; }
    .sim .task { font-weight: 800; color: var(--sim-accent); margin: 6px 0 0; }
  </style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Rights Check: one asset at a time</h1>
  <p class="hint">Before the release of <i>Rooftop Rescue</i>, Salma checks every asset with five questions. Choose an asset, then press <b>Next question</b> until the check stops or passes.</p>
  <div class="bar" id="assets"></div>
  <div class="bar"><button type="button" id="next">Next question ▶</button><button type="button" class="ghost" id="reset">Start again</button></div>
  <ol class="steps" id="steps"></ol>
  <p class="verdict" id="verdict"></p>
  <p class="task" id="task"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const Q = ["1 Who made it?", "2 Who owns it?", "3 Which licence?", "4 Does our use fit?", "5 Credit written?"];
  // Each answer: [ok, text]. The check stops at the first "no".
  const A = {
    "Pasha the cat": [[1, "Nour, an employee of Night Owl"], [1, "Night Owl (work for hire)"], [1, "our own work, no licence needed"], [1, "yes, our own game"], [1, "Nour is in the team credits"]],
    "theme music": [[1, "a freelance composer"], [0, "unclear: there is no written contract"]],
    "rain sound": [[1, "a sound artist on a sound website"], [1, "the sound artist"], [1, "CC BY, licence text saved"], [1, "yes, commercial use is allowed"], [0, "not yet: the credits file has no line for it"]],
    "menu font": [[1, "a font designer"], [1, "the font designer"], [1, "\"free for personal use\", saved"], [0, "no: the game is sold, that is commercial use"]],
    "piano piece": [[1, "a composer who died in 1900; recorded by Yara"], [1, "the piece: public domain; the recording: Night Owl"], [1, "public domain, no licence needed"], [1, "yes"], [1, "the composer is named in the credits"]],
    "poster photo": [[0, "unknown: it was found by an image search"]],
  };
  const FIX = { "theme music": "get a written contract that gives Night Owl the rights or a licence", "rain sound": "write the credit: creator, title, source, licence", "menu font": "buy a commercial licence or choose an open font", "poster photo": "replace it with Nour's own art or a licensed photo" };
  const s = { a: "Pasha the cat", step: 0, done: new Set() };
  const TASKS = [
    { q: "Task 1: Check Pasha the cat. Does it pass all five questions?", ok: () => s.done.has("Pasha the cat") },
    { q: "Task 2: Check the theme music. At which question does it stop, and what is the fix?", ok: () => s.done.has("theme music") },
    { q: "Task 3: Check the rain sound. What is missing?", ok: () => s.done.has("rain sound") },
    { q: "Task 4: Check the menu font and the poster photo. Which one can be fixed by paying?", ok: () => s.done.has("menu font") && s.done.has("poster photo") },
  ];
  let ti = 0;
  const finished = () => { const r = A[s.a]; return s.step >= r.length || (s.step > 0 && !r[s.step - 1][0]); };
  function upd() {
    Kit.buttons($("assets"), Object.keys(A).map((k) => ({ k, label: k })), (k) => { s.a = k; s.step = 0; upd(); });
    $("assets").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.k === s.a));
    const r = A[s.a];
    $("steps").innerHTML = Q.map((q, i) => i < s.step ? `<li class="${r[i][0] ? "ok" : "no"}"><span class="q">${q}</span><span>${r[i][0] ? "✔" : "✘"} ${r[i][1]}</span></li>` : `<li class="wait"><span class="q">${q}</span><span>…</span></li>`).join("");
    const fin = finished();
    $("next").disabled = fin;
    if (fin) s.done.add(s.a);
    const failed = s.step > 0 && !r[s.step - 1][0];
    $("verdict").textContent = !fin ? "" : failed ? `Stop at question ${s.step}: ${FIX[s.a]}.` : "All five are yes: the asset may be used.";
    $("verdict").style.color = failed ? "#c92a2a" : "#2b8a3e";
    let m = "";
    while (ti < TASKS.length && TASKS[ti].ok()) { ti++; m = "✓ Done. "; Kit.good(); }
    $("task").textContent = ti < TASKS.length ? TASKS[ti].q : "All tasks are done: a rights check is quick when every asset has a line in the register.";
    $("msg").textContent = m + `${s.done.size} of 6 assets checked.`;
  }
  $("next").addEventListener("click", () => { if (!finished()) { s.step++; upd(); } });
  $("reset").addEventListener("click", () => { s.step = 0; upd(); });
  window.RC = { check: (a) => { s.a = a; s.step = 0; upd(); }, next: () => { if (!finished()) { s.step++; upd(); } } };
  upd();
})();
</script>
</body>
</html>
