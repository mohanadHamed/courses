<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="330" fill="#ffffff"/>
<polygon points="70,260 329.8,260 329.8,110" fill="#ebfbee" stroke="#2F9E44" stroke-width="2.5"/>
<rect x="313.8" y="244" width="16" height="16" rx="0" fill="none" stroke="#2a2f2c" stroke-width="1.5"/>
<path d="M116.0 260.0 L115.9 256.6 L115.5 253.1 L114.8 249.8 L114.0 246.4 L112.8 243.2 L111.4 240.0 L109.8 237.0" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="124" y="251" font-size="14" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">30°</text>
<text x="181.9" y="157" font-size="14" fill="#2F9E44" text-anchor="end" font-weight="800" xml:space="preserve">hypotenuse 10 m</text>
<text x="181.9" y="175" font-size="12.5" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">(the ramp)</text>
<text x="341.8" y="185" font-size="14" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">opposite</text>
<text x="341.8" y="203" font-size="13" fill="#1c7ed6" text-anchor="start" font-weight="700" xml:space="preserve">5 m (height)</text>
<text x="199.9" y="286" font-size="14" fill="#7048e8" text-anchor="middle" font-weight="800" xml:space="preserve">adjacent  8.7 m (forward)</text>
<text x="430" y="64" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">For the angle θ:</text>
<text x="430" y="96" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">sin θ = opposite ÷ hypotenuse</text>
<text x="430" y="122" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">cos θ = adjacent ÷ hypotenuse</text>
<text x="430" y="148" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">tan θ = opposite ÷ adjacent</text>
<text x="430" y="190" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Here, θ = 30°:</text>
<text x="430" y="218" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">height = 10 × sin 30° = 5</text>
<text x="430" y="242" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">forward = 10 × cos 30° = 8.7</text>
</svg>
