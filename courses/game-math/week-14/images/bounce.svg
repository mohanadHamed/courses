<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A bounce: reflect the velocity on the normal</text>
<rect x="40" y="210" width="340" height="14" rx="2" fill="#868e96"/>
<text x="210" y="246" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">floor, normal n = (0, 1)</text>
<line x1="80" y1="90" x2="193.5" y2="201.6" stroke="#1c7ed6" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="200,208 189.2,204.5 196.3,197.3" fill="#1c7ed6"/>
<text x="110" y="160" font-size="12.5" fill="#1c7ed6" text-anchor="end" font-weight="800" xml:space="preserve">v = (4, −3)</text>
<line x1="202" y1="208" x2="315.5" y2="96.4" stroke="#2b8a3e" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="322,90 318.3,100.7 311.2,93.5" fill="#2b8a3e"/>
<text x="296" y="160" font-size="12.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">v&#x27; = (4, 3)</text>
<line x1="201" y1="208" x2="201" y2="148.6" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="201,140 205.8,149.5 196.2,149.5" fill="#e8590c"/>
<text x="206" y="136" font-size="13" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">n</text>
<rect x="400" y="56" width="260" height="214" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="414" y="80" font-size="14" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">v&#x27; = v − 2(v · n)n</text>
<text x="414" y="101.5" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">v · n = −3</text>
<text x="414" y="120.1" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">v&#x27; = (4, −3) − 2(−3)(0, 1) = (4, 3)</text>
<text x="414" y="138.7" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Bounciness e: v&#x27; = v − (1 + e)(v · n)n; e =</text>
<text x="414" y="154.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">0.8 gives (4, 2.4).</text>
</svg>
