<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A formula starts with = and uses cell addresses</text>
<rect x="30" y="50" width="60" height="26" rx="4" fill="#ffffff" stroke="#c3d9c7" stroke-width="1.2"/>
<text x="60" y="68" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">D2</text>
<text x="102" y="68" font-size="13" fill="#217346" text-anchor="start" font-weight="800" font-style="italic" xml:space="preserve">fx</text>
<rect x="122" y="50" width="258" height="26" rx="4" fill="#ffffff" stroke="#c3d9c7" stroke-width="1.2"/>
<text x="130" y="68" font-size="12.5" fill="#1c7ed6" text-anchor="start" font-weight="700" xml:space="preserve">=B2*C2</text>
<rect x="30" y="86" width="30" height="28" rx="0" fill="#f1f3f5" stroke="#dee2e6" stroke-width="1"/>
<rect x="60" y="86" width="100" height="28" rx="0" fill="#f1f3f5" stroke="#dee2e6" stroke-width="1"/>
<text x="110" y="104.2" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">A</text>
<rect x="160" y="86" width="70" height="28" rx="0" fill="#f1f3f5" stroke="#dee2e6" stroke-width="1"/>
<text x="195" y="104.2" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">B</text>
<rect x="230" y="86" width="70" height="28" rx="0" fill="#f1f3f5" stroke="#dee2e6" stroke-width="1"/>
<text x="265" y="104.2" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">C</text>
<rect x="300" y="86" width="80" height="28" rx="0" fill="#f1f3f5" stroke="#dee2e6" stroke-width="1"/>
<text x="340" y="104.2" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">D</text>
<rect x="30" y="114" width="30" height="28" rx="0" fill="#f1f3f5" stroke="#dee2e6" stroke-width="1"/>
<text x="45" y="132.2" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<rect x="60" y="114" width="100" height="28" rx="0" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
<text x="67" y="132.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Item</text>
<rect x="160" y="114" width="70" height="28" rx="0" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
<text x="167" y="132.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Price</text>
<rect x="230" y="114" width="70" height="28" rx="0" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
<text x="237" y="132.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Qty</text>
<rect x="300" y="114" width="80" height="28" rx="0" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
<text x="307" y="132.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Total</text>
<rect x="30" y="142" width="30" height="28" rx="0" fill="#f1f3f5" stroke="#dee2e6" stroke-width="1"/>
<text x="45" y="160.2" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
<rect x="60" y="142" width="100" height="28" rx="0" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
<text x="67" y="160.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Notebook</text>
<rect x="160" y="142" width="70" height="28" rx="0" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
<text x="223" y="160.2" font-size="12" fill="#2a2f2c" text-anchor="end" font-weight="700" xml:space="preserve">2</text>
<rect x="230" y="142" width="70" height="28" rx="0" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
<text x="293" y="160.2" font-size="12" fill="#2a2f2c" text-anchor="end" font-weight="700" xml:space="preserve">10</text>
<rect x="300" y="142" width="80" height="28" rx="0" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
<text x="373" y="160.2" font-size="12" fill="#2a2f2c" text-anchor="end" font-weight="700" xml:space="preserve">20</text>
<rect x="301" y="143" width="78" height="26" rx="0" fill="none" stroke="#217346" stroke-width="2.6"/>
<rect x="30" y="170" width="30" height="28" rx="0" fill="#f1f3f5" stroke="#dee2e6" stroke-width="1"/>
<text x="45" y="188.2" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
<rect x="60" y="170" width="100" height="28" rx="0" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
<text x="67" y="188.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Pen</text>
<rect x="160" y="170" width="70" height="28" rx="0" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
<text x="223" y="188.2" font-size="12" fill="#2a2f2c" text-anchor="end" font-weight="700" xml:space="preserve">0.5</text>
<rect x="230" y="170" width="70" height="28" rx="0" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
<text x="293" y="188.2" font-size="12" fill="#2a2f2c" text-anchor="end" font-weight="700" xml:space="preserve">40</text>
<rect x="300" y="170" width="80" height="28" rx="0" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
<text x="373" y="188.2" font-size="12" fill="#2a2f2c" text-anchor="end" font-weight="700" xml:space="preserve">20</text>
<text x="30" y="222" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The formula bar shows the formula; the cell shows the result.</text>
<rect x="400" y="50" width="260" height="30" rx="0" fill="#D9480F"/>
<text x="410" y="69.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">sign</text>
<text x="575" y="69.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">meaning</text>
<text x="410" y="99.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">+  −</text>
<text x="575" y="99.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">add, subtract</text>
<rect x="400" y="110" width="260" height="30" rx="0" fill="#f8f9fa"/>
<text x="410" y="129.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">*</text>
<text x="575" y="129.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">multiply</text>
<text x="410" y="159.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">/</text>
<text x="575" y="159.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">divide</text>
<rect x="400" y="170" width="260" height="30" rx="0" fill="#f8f9fa"/>
<text x="410" y="189.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">( )</text>
<text x="575" y="189.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">do this first</text>
<rect x="400" y="50" width="260" height="150" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="400" y="236" font-size="13" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">=2+3*4 gives 14 (* first)</text>
<text x="400" y="258" font-size="13" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">=(2+3)*4 gives 20</text>
<text x="30" y="250" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Change a price, and the total changes by itself.</text>
</svg>
