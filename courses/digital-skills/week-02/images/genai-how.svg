<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="900" height="320" fill="#ffffff"/>
<rect x="10" y="10" width="880" height="300" rx="18" fill="#fff9f2" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="450.0" y="42" font-size="17" fill="#7a2a06" text-anchor="middle" font-weight="800">How generative AI writes: one likely word after another</text>
<rect x="30" y="66" width="230" height="190" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="46" y="92" font-size="15" fill="#D9480F" text-anchor="start" font-weight="800">1  It learned from</text>
<text x="46" y="112" font-size="15" fill="#D9480F" text-anchor="start" font-weight="800">a huge amount of text</text>
<rect x="50" y="130" width="52" height="66" rx="4" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
<line x1="58" y1="144" x2="94" y2="144" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<line x1="58" y1="156" x2="84" y2="156" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<line x1="58" y1="168" x2="94" y2="168" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<line x1="58" y1="180" x2="84" y2="180" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<rect x="116" y="130" width="52" height="66" rx="4" fill="#fff" stroke="#0b7285" stroke-width="2"/>
<line x1="124" y1="144" x2="160" y2="144" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<line x1="124" y1="156" x2="150" y2="156" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<line x1="124" y1="168" x2="160" y2="168" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<line x1="124" y1="180" x2="150" y2="180" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<rect x="182" y="130" width="52" height="66" rx="4" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
<line x1="190" y1="144" x2="226" y2="144" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<line x1="190" y1="156" x2="216" y2="156" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<line x1="190" y1="168" x2="226" y2="168" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<line x1="190" y1="180" x2="216" y2="180" stroke="#a5d8ff" stroke-width="3" stroke-linecap="round"/>
<text x="145" y="222" font-size="12.5" fill="#7a6a60" text-anchor="middle" font-weight="600">books, websites, articles</text>
<text x="145" y="240" font-size="12.5" fill="#7a6a60" text-anchor="middle" font-weight="600">(its training data)</text>
<line x1="268" y1="160" x2="298" y2="160" stroke="#D9480F" stroke-width="3" stroke-linecap="round"/>
<polygon points="306,160 296,154 296,166" fill="#D9480F"/>
<rect x="312" y="66" width="300" height="190" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="328" y="92" font-size="15" fill="#0b7285" text-anchor="start" font-weight="800">2  It guesses the next word</text>
<text x="328" y="122" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800">The shop opens at ...</text>
<text x="340" y="155" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800">8</text>
<rect x="372" y="143" width="162.0" height="16" rx="8" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="542.0" y="156" font-size="12.5" fill="#7a6a60" text-anchor="start" font-weight="700">45%</text>
<text x="340" y="185" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800">9</text>
<rect x="372" y="173" width="144.0" height="16" rx="8" fill="#FFC078" stroke="none" stroke-width="1.5"/>
<text x="524.0" y="186" font-size="12.5" fill="#7a6a60" text-anchor="start" font-weight="700">40%</text>
<text x="340" y="215" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800">10</text>
<rect x="372" y="203" width="54.0" height="16" rx="8" fill="#FFC078" stroke="none" stroke-width="1.5"/>
<text x="434.0" y="216" font-size="12.5" fill="#7a6a60" text-anchor="start" font-weight="700">15%</text>
<text x="328" y="244" font-size="12.5" fill="#7a6a60" text-anchor="start" font-weight="600">It picks a likely word, often the top one.</text>
<line x1="620" y1="160" x2="650" y2="160" stroke="#D9480F" stroke-width="3" stroke-linecap="round"/>
<polygon points="658,160 648,154 648,166" fill="#D9480F"/>
<rect x="664" y="66" width="206" height="190" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="680" y="92" font-size="15" fill="#2b8a3e" text-anchor="start" font-weight="800">3  The result</text>
<rect x="680" y="106" width="174" height="50" rx="10" fill="#ffe3e3" stroke="#c92a2a" stroke-width="1.5"/>
<text x="692" y="127" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800">The shop opens</text>
<text x="692" y="145" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800">at 8 a.m.</text>
<text x="680" y="182" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700">Sounds right, but the</text>
<text x="680" y="200" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700">shop opens at 9 a.m.</text>
<text x="680" y="218" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700">It did not look it up.</text>
<text x="450" y="290" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="700">Likely is not the same as true. Ask the same prompt again, and the answer can change.</text>
</svg>
