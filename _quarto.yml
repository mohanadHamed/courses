# One profile of this group is always active. `site` (the default: CI, and
# `--profile review`) leaves out the face-to-face version of Digital Skills
# (courses/digital-skills/face-to-face/, not published; _quarto-site.yml).
# `--profile f2f` builds it for the teacher's preview (its README.md).
profile:
  group:
    - [site, f2f]

project:
  type: website
  output-dir: _site
  # Only .qmd files become pages. AUTHORING.md, NOTES.md, plan.md, retro/*.md and the
  # templates stay in the repo but are not published.
  render:
    - "*.qmd"
    - "!shared/"
  # Warn when a lesson is too small or too big for its lecture time (AUTHORING.md).
  pre-render:
    - _extensions/lesson/check_size.py
    # Warn about cross shapes in figures and simulators (AUTHORING.md, "Rich and visual").
    - _extensions/lesson/check_figures.py
  # Slides: course colours, answer cards and click animations (see the script).
  post-render:
    - _extensions/lesson/pptx_finish.py
    # Homework PDF = the printed homework page (headless Chrome), one A4 page.
    - _extensions/lesson/homework_pdf.py
    # Meaningful download names: math_lecture5.pdf, math_homework3.pdf.
    - _extensions/lesson/download_names.py
    # Build number on every page, ?v=<build> on local links, version.json and
    # the reload-when-newer check (runs last).
    - _extensions/lesson/build_stamp.py
  resources:
    - "shared/sims/*.css"
    - "shared/sims/*.js"
    - "shared/sims/vendor/*"
    - "shared/fonts/*"
    - "shared/sims/*.html"
    - "courses/*/week-*/sims/*"
    # Start files of the lecture worksheets (the same data for every student).
    - "courses/*/week-*/files/*"
    # Course videos of the online activities: the video, its captions and its poster.
    - "courses/*/week-*/videos/*.mp4"
    - "courses/*/week-*/videos/*.vtt"
    - "courses/*/week-*/videos/*.png"
    # The preview picture of a shared link (LinkedIn, WhatsApp, X).
    - "images/og-image.png"

website:
  title: "Mohanad Hamed — Courses"
  description: "Free, interactive courses of the Mobile Game Development and Design diploma, Technical College, Al-Israa University: lesson notes, interactive lessons that check every answer, 200+ simulators and mini-games, slides and homework."
  site-url: "https://mohanadhamed.github.io/courses/"
  # The preview picture of a shared link: every page without its own image.
  image: images/og-image.png
  image-alt: "Mohanad Hamed — Courses: four interactive courses with simulators and mini-games."
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  repo-url: "https://github.com/mohanadHamed/courses"
  search: true
  navbar:
    collapse-below: xl
    left:
      - href: index.qmd
        text: Home
      - href: courses/game-math/index.qmd
        text: Game Math
      - href: courses/computing-systems/index.qmd
        text: Computing Systems
      - href: courses/digital-media/index.qmd
        text: Digital Media
      - href: courses/digital-skills/index.qmd
        text: Digital Skills
      - href: about.qmd
        text: About
  page-footer:
    left: "Mohanad Hamed · Lecturer, Mobile Game Development and Design — Technical College, Al-Israa University"

# Shared by every page, read by the lesson banner.
diploma-line: "Mobile Game Development and Design diploma — Technical College, Al-Israa University"
# true: each lesson page links its PowerPoint slides. false: slides are teacher-only.
slides-public: true

format:
  html:
    theme:
      light: [cosmo, shared/templates/site.scss]
    lang: en
    toc: true
