<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="240" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">ipconfig: the address of the laptop</text>
<rect x="20" y="50" width="420" height="138" rx="10" fill="#1e1e2e"/>
<text x="32" y="72" font-size="11.5" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">C:\&gt; ipconfig</text>
<text x="32" y="91" font-size="11.5" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"></text>
<text x="32" y="110" font-size="11.5" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Wireless LAN adapter Wi-Fi:</text>
<rect x="26" y="115" width="408" height="19" rx="4" fill="#5c4813"/>
<text x="32" y="129" font-size="11.5" fill="#ffd43b" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">   IPv4 Address. . . . : 192.168.1.23</text>
<text x="32" y="148" font-size="11.5" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">   Subnet Mask . . . . : 255.255.255.0</text>
<rect x="26" y="153" width="408" height="19" rx="4" fill="#5c4813"/>
<text x="32" y="167" font-size="11.5" fill="#ffd43b" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">   Default Gateway . . : 192.168.1.1</text>
<rect x="460" y="50" width="200" height="160" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="474" y="74" font-size="14" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">Read it</text>
<text x="474" y="90" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">IPv4: this laptop.</text>
<text x="474" y="118" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Gateway: the router.</text>
<text x="474" y="148" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">An address 169.254.x.x</text>
<text x="474" y="163.6" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">means: no address from the</text>
<text x="474" y="179.2" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">router.</text>
</svg>
