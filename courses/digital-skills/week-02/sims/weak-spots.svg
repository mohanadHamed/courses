<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="640" height="440" fill="#ffffff"/>
<text x="24" y="36" font-size="22" fill="#2a2f2c" text-anchor="start" font-weight="800">Weak Spots: what is wrong?</text>
<text x="24" y="60" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800">Answer 3 of 7</text>
<text x="616" y="60" font-size="14" fill="#D9480F" text-anchor="end" font-weight="800">2 right</text>
<text x="24" y="88" font-size="13" fill="#7a6a60" text-anchor="start" font-weight="800">Prompt: How much are 12 pens at 0.25 JD each?</text>
<rect x="24" y="98" width="592" height="50" rx="14" fill="#fff" stroke="#e3dcd5" stroke-width="1.5"/>
<text x="36" y="116" font-size="11" fill="#0b7285" text-anchor="start" font-weight="800">AI assistant</text>
<text x="36" y="138" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="700">12 pens cost 3.50 JD.</text>
<text x="24" y="172" font-size="13" fill="#7a6a60" text-anchor="start" font-weight="700">What you know: 12 x 0.25 = 3.00 JD.</text>
<rect x="24" y="190" width="292" height="42" rx="10" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="36" y="216.0" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">Invented fact</text>
<rect x="324" y="190" width="292" height="42" rx="10" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="336" y="216.0" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">Old information</text>
<rect x="24" y="240" width="292" height="42" rx="10" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="36" y="266.0" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">Wrong number</text>
<rect x="324" y="240" width="292" height="42" rx="10" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="336" y="266.0" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">Bias</text>
<rect x="24" y="290" width="292" height="42" rx="10" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="36" y="316.0" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">Missing context</text>
<rect x="324" y="290" width="292" height="42" rx="10" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="336" y="316.0" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">OK after reading</text>
<text x="24" y="362" font-size="14" fill="#2b8a3e" text-anchor="start" font-weight="800">AI can make mistakes in sums.</text>
<text x="24" y="384" font-size="14" fill="#2b8a3e" text-anchor="start" font-weight="800">Check numbers with a calculator or a spreadsheet.</text>
</svg>
