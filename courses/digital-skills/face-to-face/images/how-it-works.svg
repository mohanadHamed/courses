<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="400" fill="#ffffff"/>
<text x="20" y="32" font-size="18" fill="#2a2f2c" font-weight="800">How a session in the lab works</text>
<!-- 1: the slides -->
<rect x="20" y="52" width="640" height="78" rx="14" fill="#fff4e6" stroke="#f08c3c" stroke-width="1.6"/>
<circle cx="52" cy="91" r="18" fill="#d9480f"/>
<text x="52" y="97" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800">1</text>
<text x="84" y="84" font-size="16" fill="#7a2e0b" font-weight="800">The slides</text>
<text x="84" y="106" font-size="12.5" fill="#4a4f4b">First, the teacher explains the new ideas and shows the simulators.</text>
<!-- a projector screen on a stand -->
<rect x="562" y="66" width="74" height="44" rx="4" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<rect x="570" y="74" width="40" height="6" rx="2" fill="#ffc078"/>
<rect x="570" y="85" width="56" height="4" rx="1" fill="#f0c9a4"/>
<rect x="570" y="93" width="48" height="4" rx="1" fill="#f0c9a4"/>
<path d="M 592 110 L 586 124 M 606 110 L 612 124" stroke="#d9480f" stroke-width="2.2" stroke-linecap="round"/>
<!-- 2: the worksheet, two parts -->
<rect x="20" y="146" width="640" height="170" rx="14" fill="#fff8f0" stroke="#e8a46a" stroke-width="1.6"/>
<circle cx="52" cy="176" r="18" fill="#d9480f"/>
<text x="52" y="182" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800">2</text>
<text x="84" y="170" font-size="16" fill="#7a2e0b" font-weight="800">The worksheet</text>
<text x="84" y="190" font-size="12.5" fill="#4a4f4b">Then you practise the same ideas yourself. Each experiment has two parts:</text>
<!-- Part A -->
<rect x="40" y="204" width="294" height="98" rx="10" fill="#ffffff" stroke="#f08c3c" stroke-width="1.4"/>
<text x="54" y="226" font-size="14" fill="#d9480f" font-weight="800">Part A · In the app</text>
<text x="54" y="246" font-size="11.5" fill="#3b3f3c">On a computer: Word, Excel,</text>
<text x="54" y="262" font-size="11.5" fill="#3b3f3c">PowerPoint or an AI tool.</text>
<text x="54" y="284" font-size="11.5" fill="#3b3f3c">Do the step, write the result.</text>
<!-- a small computer -->
<rect x="262" y="226" width="56" height="38" rx="4" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
<rect x="268" y="232" width="30" height="5" rx="1" fill="#ffc078"/>
<rect x="268" y="241" width="40" height="4" rx="1" fill="#f0c9a4"/>
<rect x="268" y="249" width="34" height="4" rx="1" fill="#f0c9a4"/>
<path d="M 280 264 L 300 264 L 304 276 L 276 276 Z" fill="#d9480f"/>
<!-- Part B -->
<rect x="346" y="204" width="294" height="98" rx="10" fill="#ffffff" stroke="#f08c3c" stroke-width="1.4"/>
<text x="360" y="226" font-size="14" fill="#d9480f" font-weight="800">Part B · On the simulator</text>
<text x="360" y="246" font-size="11.5" fill="#3b3f3c">On paper: scan the QR code.</text>
<text x="360" y="262" font-size="11.5" fill="#3b3f3c">On the screen: click the link.</text>
<text x="360" y="284" font-size="11.5" fill="#3b3f3c">It works on a phone too.</text>
<!-- a phone with a QR code -->
<rect x="582" y="216" width="40" height="72" rx="7" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
<rect x="588" y="226" width="28" height="28" fill="#ffffff" stroke="#7a2e0b" stroke-width="1"/>
<rect x="590" y="228" width="8" height="8" fill="#7a2e0b"/>
<rect x="606" y="228" width="8" height="8" fill="#7a2e0b"/>
<rect x="590" y="244" width="8" height="8" fill="#7a2e0b"/>
<rect x="601" y="240" width="4" height="4" fill="#7a2e0b"/>
<rect x="608" y="246" width="5" height="5" fill="#7a2e0b"/>
<circle cx="602" cy="276" r="4" fill="#d9480f"/>
<!-- 3: check -->
<rect x="20" y="332" width="640" height="54" rx="14" fill="#fff4e6" stroke="#f08c3c" stroke-width="1.6"/>
<circle cx="52" cy="359" r="18" fill="#d9480f"/>
<text x="52" y="365" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="800">3</text>
<text x="84" y="355" font-size="15" fill="#7a2e0b" font-weight="800">Check</text>
<text x="140" y="355" font-size="12.5" fill="#4a4f4b">on the interactive lesson (it answers at once),</text>
<text x="140" y="373" font-size="12.5" fill="#4a4f4b">or at the end of the worksheet. Then fill in the Table of results.</text>
<circle cx="622" cy="359" r="18" fill="#ffffff" stroke="#2f9e44" stroke-width="2.4"/>
<polyline points="613,360 619,367 632,351" fill="none" stroke="#2f9e44" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
