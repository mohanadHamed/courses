<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The beat list of level 1, Cat Catch</text>
<rect x="20" y="50" width="640" height="38" rx="0" fill="#9C36B5"/>
<text x="40" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">#</text>
<text x="70" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">beat</text>
<text x="460" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">kind</text>
<text x="595" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">shot</text>
<text x="40" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<text x="70" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">The house in the flood; Pasha on the roof</text>
<text x="460" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">cutscene</text>
<text x="595" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">wide</text>
<rect x="20" y="126" width="640" height="38" rx="0" fill="#f8f9fa"/>
<text x="40" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<text x="70" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">SALMA: Pasha, no! Stay there!</text>
<text x="460" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">cutscene</text>
<text x="595" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">close-up</text>
<text x="40" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<text x="70" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">The player swipes to row under the roof</text>
<text x="460" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">gameplay</text>
<text x="595" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">medium</text>
<rect x="20" y="202" width="640" height="38" rx="0" fill="#f8f9fa"/>
<text x="40" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<text x="70" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Pasha jumps; the player taps to catch</text>
<text x="460" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">gameplay</text>
<text x="595" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">wide (roof)</text>
<text x="40" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">5a</text>
<text x="70" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Caught: +100, Salma smiles</text>
<text x="460" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">gameplay</text>
<text x="595" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">medium</text>
<rect x="20" y="278" width="640" height="38" rx="0" fill="#f8f9fa"/>
<text x="40" y="301.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">5b</text>
<text x="70" y="301.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Missed: splash, one heart lost, try again</text>
<text x="460" y="301.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">gameplay</text>
<text x="595" y="301.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">medium</text>
<rect x="20" y="50" width="640" height="266" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
