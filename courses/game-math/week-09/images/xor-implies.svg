<rect x="170" y="96" width="110" height="40" rx="0" fill="#fff5f5"/>
<text x="225" y="121.4" font-size="15" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">F</text>
<rect x="280" y="96" width="110" height="40" rx="0" fill="#ebfbee"/>
<text x="335" y="121.4" font-size="15" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">T</text>
