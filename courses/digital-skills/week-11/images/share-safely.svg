<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="900" height="330" fill="#ffffff"/>
<rect x="10" y="10" width="880" height="310" rx="18" fill="#fff9f2" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="450.0" y="42" font-size="16" fill="#7a2a06" text-anchor="middle" font-weight="800">Share and use safely: a free picture, its source, and only the permissions an app needs</text>
<rect x="34" y="62" width="268" height="238" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="168" y="90" font-size="15.5" fill="#0b7285" text-anchor="middle" font-weight="800">A picture for a report</text>
<path d="M52 125 l5 6 l10 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="130" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">a stock image of Word</text>
<path d="M52 165 l5 6 l10 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="170" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">your own photo</text>
<circle cx="59" cy="205" r="9" fill="none" stroke="#c92a2a" stroke-width="2.6"/><line x1="54" y1="205" x2="64" y2="205" stroke="#c92a2a" stroke-width="2.6" stroke-linecap="round"/><text x="78" y="210" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">any picture from a search</text>
<circle cx="59" cy="245" r="9" fill="none" stroke="#c92a2a" stroke-width="2.6"/><line x1="54" y1="245" x2="64" y2="245" stroke="#c92a2a" stroke-width="2.6" stroke-linecap="round"/><text x="78" y="250" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">a classmate's photo, not asked</text>
<text x="52" y="290" font-size="11.5" fill="#6b6259" text-anchor="start" font-weight="700">Word: Insert › Pictures › Stock Images</text>
<rect x="318" y="62" width="268" height="238" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="452" y="90" font-size="15.5" fill="#0b7285" text-anchor="middle" font-weight="800">Say where it comes from</text>
<rect x="338" y="108" width="228" height="96" rx="6" fill="#e9ecef"/>
<path d="M358 190 l40 -46 l30 30 l22 -20 l50 36 z" fill="#adb5bd"/><circle cx="518" cy="132" r="12" fill="#ffd43b"/>
<text x="338" y="228" font-size="13.5" fill="#2b8a3e" text-anchor="start" font-weight="800">Picture: Visit Jordan,</text>
<text x="338" y="248" font-size="13.5" fill="#2b8a3e" text-anchor="start" font-weight="800">visitjordan.com, 10 Nov 2026</text>
<text x="338" y="284" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700">Not: “Google” or “the Internet”</text>
<rect x="602" y="62" width="268" height="238" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="736" y="90" font-size="15.5" fill="#0b7285" text-anchor="middle" font-weight="800">App permissions (phone)</text>
<rect x="622" y="104" width="228" height="34" rx="8" fill="#f1f3f5"/><text x="636" y="126" font-size="13" fill="#6b6259" text-anchor="start" font-weight="700">Flashlight app asks for:</text>
<text x="632" y="168" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">Contacts</text>
<rect x="778" y="151" width="62" height="24" rx="12" fill="#c92a2a"/><text x="809" y="168" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="800">Deny</text>
<text x="632" y="206" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">Location</text>
<rect x="778" y="189" width="62" height="24" rx="12" fill="#c92a2a"/><text x="809" y="206" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="800">Deny</text>
<text x="632" y="244" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700">Camera (the light)</text>
<rect x="778" y="227" width="62" height="24" rx="12" fill="#2b8a3e"/><text x="809" y="244" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="800">Allow</text>
<text x="622" y="290" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800">Only what its job needs.</text>
</svg>
