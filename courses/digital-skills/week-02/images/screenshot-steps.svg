<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="900" height="340" fill="#ffffff"/>
<rect x="10" y="10" width="880" height="320" rx="18" fill="#fff9f2" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="450.0" y="42" font-size="17" fill="#7a2a06" text-anchor="middle" font-weight="800">Take a screenshot, then crop it and give it a good name</text>
<rect x="40" y="62" width="190" height="122" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="135" y="90" font-size="16" fill="#0b7285" text-anchor="middle" font-weight="800">Windows</text>
<rect x="52" y="104" width="166" height="34" rx="8" fill="#e3fafc" stroke="#0b7285" stroke-width="1.2"/>
<text x="135" y="127" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800">Windows + Shift + S</text>
<text x="135" y="164" font-size="12.5" fill="#6b6259" text-anchor="middle" font-weight="600">then drag a box (Rectangle)</text>
<rect x="245" y="62" width="190" height="122" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="340" y="90" font-size="16" fill="#0b7285" text-anchor="middle" font-weight="800">Android phone</text>
<rect x="257" y="104" width="166" height="34" rx="8" fill="#e3fafc" stroke="#0b7285" stroke-width="1.2"/>
<text x="340" y="127" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800">Power + Volume down</text>
<text x="340" y="164" font-size="12.5" fill="#6b6259" text-anchor="middle" font-weight="600">press both together</text>
<rect x="450" y="62" width="190" height="122" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="545" y="90" font-size="16" fill="#0b7285" text-anchor="middle" font-weight="800">iPhone</text>
<rect x="462" y="104" width="166" height="34" rx="8" fill="#e3fafc" stroke="#0b7285" stroke-width="1.2"/>
<text x="545" y="127" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800">Side button + Volume up</text>
<text x="545" y="164" font-size="12.5" fill="#6b6259" text-anchor="middle" font-weight="600">press both together</text>
<path d="M660 123 l26 0" stroke="#7a2a06" stroke-width="3"/><path d="M682 115 l10 8 l-10 8" fill="none" stroke="#7a2a06" stroke-width="3"/>
<rect x="700" y="62" width="160" height="122" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<rect x="714" y="76" width="132" height="94" rx="4" fill="#f1f3f5"/>
<rect x="726" y="96" width="108" height="40" fill="#fff" stroke="#2b8a3e" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="780" y="114" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800">Exams:</text><text x="780" y="129" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700">Sun 10 Jan</text>
<text x="780" y="162" font-size="11.5" fill="#2b8a3e" text-anchor="middle" font-weight="800">Crop: keep the dates</text>
<circle cx="62" cy="217" r="12" fill="#0b7285"/><text x="62" y="222" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">✂</text>
<text x="84" y="222" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="700">Crop: keep only the part that matters.</text>
<circle cx="62" cy="251" r="12" fill="#0b7285"/><text x="62" y="256" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">■</text>
<text x="84" y="256" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="700">Cover personal data: names, phone numbers.</text>
<circle cx="62" cy="285" r="12" fill="#0b7285"/><text x="62" y="290" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">✎</text>
<text x="84" y="290" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="700">Save it with a good name: exam-dates.png</text>
<text x="860" y="300" font-size="12.5" fill="#6b6259" text-anchor="end" font-weight="600">Phones keep it in Photos (or Gallery) › Screenshots.</text>
<text x="860" y="320" font-size="12.5" fill="#6b6259" text-anchor="end" font-weight="600">Windows: paste it (Ctrl + V), or save it in Pictures › Screenshots.</text>
</svg>
