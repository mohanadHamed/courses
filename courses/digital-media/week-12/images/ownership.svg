<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Who owns the assets of Rooftop Rescue?</text>
<rect x="20" y="50" width="640" height="36" rx="0" fill="#9C36B5"/>
<text x="30" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">asset</text>
<text x="240" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">made by</text>
<text x="470" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">owner</text>
<text x="30" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Pasha the cat (art)</text>
<text x="240" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Nour, employee</text>
<text x="470" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Night Owl Games</text>
<rect x="20" y="122" width="640" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">the theme music</text>
<text x="240" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a freelancer, with a contract</text>
<text x="470" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Night Owl Games</text>
<text x="30" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">the rain sound</text>
<text x="240" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a sound library</text>
<text x="470" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the library (licence)</text>
<rect x="20" y="194" width="640" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">the menu font</text>
<text x="240" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a font designer</text>
<text x="470" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the designer (licence)</text>
<text x="30" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">a fan&#x27;s comic of Pasha</text>
<text x="240" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a fan</text>
<text x="470" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the fan, based on our work</text>
<rect x="20" y="50" width="640" height="216" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="288" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Work for hire: an employee&#x27;s work, or work under a contract, belongs to the company.</text>
</svg>
