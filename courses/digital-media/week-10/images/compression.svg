<text x="20" y="282" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">file size (MB) ≈ bitrate (Mbit/s) × seconds ÷ 8   ·   10 Mbit/s × 30 s ÷ 8 ≈ 37.5 MB</text>
