<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Generator Doctor</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #ebfbee; border: 1.5px solid #2F9E44; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Generator Doctor</h1>
  <p class="hint">Testers of <i>Torch Hall</i> report six problems with the level and event generator. Choose the fix or the number that answers each report.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "\"I found a bug on floor 3, but when I play it again the floor is different, so nobody can repeat the bug.\"", goal: "What helps?", answer: "save and show the seed of each floor", choices: C(["save and show the seed of each floor", "remove the randomness", "use a new seed for every frame", "make the floor smaller"]), good: "The same seed gives the same floor: the tester sends the seed with the bug report." },
    { card: "Some floors have the exit in a part of the cave that cannot be reached.", goal: "What should the generator do?", answer: "flood fill from the start and reject the seed", choices: C(["flood fill from the start and reject the seed", "hide the exit", "add more bats", "show a hint"]), good: "Flood fill finds every reachable tile; if the exit is not one of them, try the next seed or dig a tunnel." },
    { card: "The chest must be at least 6 steps from the start. 40 % of the floor tiles are allowed.", goal: "How many tries does the generator need on average?", answer: "2.5", choices: C(["2.5", "6", "0.4", "40"]), good: "With acceptance p = 0.4, the expected number of tries is 1/p = 2.5." },
    { card: "Event table per room: chest 25 % (+20 coins), torch 5 % (+100 coins), the rest no coins.", goal: "Expected coins per room?", answer: "10", choices: C(["10", "120", "30", "25"]), good: "0.25 × 20 + 0.05 × 100 = 5 + 5 = 10." },
    { card: "With 8 independent rooms, some floors have no chest at all (0.75⁸ ≈ 10 %). Players feel cheated.", goal: "Which change keeps the rate but spreads the chests?", answer: "deal the rooms from a shuffle bag", choices: C(["deal the rooms from a shuffle bag", "raise the chest chance to 90 %", "remove the empty rooms", "roll every room twice"]), good: "A bag of 20 cards with 5 chests deals the same share, but long runs without a chest become rare." },
    { card: "The team changed the cave steps from 160 to 120.", goal: "How do they know if the levels are still good?", answer: "test 1000 seeds and compare the numbers", choices: C(["test 1000 seeds and compare the numbers", "play one floor", "ask the generator", "nothing: fewer steps is always better"]), good: "A generator test measures the valid share, the path length and more over many seeds." },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 1, animMs: 600, intro: "Round 1 is the first report of the lesson: a bug that cannot be repeated." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "The generator is healthy." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
