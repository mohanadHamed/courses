<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: The Right Tool</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #fff4e6; border: 1.5px solid #D9480F; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>The Right Tool</h1>
  <p class="hint">Huda and Rana have six questions about the month of sales. For each question, choose the quickest right tool in Excel.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const T = ["=SUMIF(…)", "=AVERAGEIF(…)", "=COUNTIF(…)", "=MAX(…)", "a PivotTable", "an AI summary, then check it"];
  const rounds = [
    { card: "How much did Paper sell in March, in one cell of the report?", answer: "=SUMIF(…)", choices: C(T.slice(0, 4)), good: "=SUMIF(C2:C25,\"Paper\",E2:E25) gives 206 JD." },
    { card: "What was the biggest single sale?", answer: "=MAX(…)", choices: C(T.slice(0, 4)), good: "=MAX(E2:E25) gives 60 JD." },
    { card: "How many sales were Bags?", answer: "=COUNTIF(…)", choices: C(T.slice(0, 4)), good: "=COUNTIF(C2:C25,\"Bags\") gives 4." },
    { card: "What is the average Drinks sale?", answer: "=AVERAGEIF(…)", choices: C(T.slice(0, 4)), good: "=AVERAGEIF(C2:C25,\"Drinks\",E2:E25) gives 7.1 JD." },
    { card: "Rana wants the total of every week and every type at once, and to change the view quickly.", answer: "a PivotTable", choices: C(["a PivotTable", "=SUMIF(…)", "=MAX(…)", "a pie chart"]), good: "A PivotTable builds the whole summary table in a few clicks." },
    { card: "Huda wants three short sentences about the month for the staff newsletter.", answer: "an AI summary, then check it", choices: C(["an AI summary, then check it", "an AI summary, used as it is", "=COUNTIF(…)", "a PivotTable only"]), good: "AI writes the sentences fast; check every number with the PivotTable first.", why: { "an AI summary, used as it is": "AI summaries can have wrong numbers or invented trends." } },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; r.goal = "Which tool?"; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 1, animMs: 600, intro: "Round 1 is the first question of the lesson: Paper in March." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "All questions are answered." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
