<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">One core, many processes: the scheduler gives time slices</text>
<rect x="40" y="80" width="57" height="46" rx="6" fill="#A86700"/>
<text x="68.5" y="108" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Game</text>
