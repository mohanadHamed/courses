<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="370" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Yaw: R_y(θ) turns around the y-axis (seen from above)</text>
<circle cx="190" cy="215" r="120" fill="none" stroke="#e9ecef" stroke-width="1.5"/>
<line x1="60" y1="215" x2="323.9" y2="215" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="332,215 323,219.5 323,210.5" fill="#adb5bd"/>
<line x1="190" y1="345" x2="190" y2="81.1" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="190,73 194.5,82 185.5,82" fill="#adb5bd"/>
<text x="336" y="220" font-size="13" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">x (right)</text>
<text x="190" y="67" font-size="13" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">z (forward)</text>
<line x1="190" y1="215" x2="190" y2="104.9" stroke="#2F9E44" stroke-width="3" stroke-linecap="round"/>
<polygon points="190,95 195.5,106 184.5,106" fill="#2F9E44"/>
<text x="180" y="111" font-size="12" fill="#2F9E44" text-anchor="end" font-weight="800" xml:space="preserve">(0, 0, 1)</text>
<line x1="190" y1="215" x2="260.8" y2="130.7" stroke="#1c7ed6" stroke-width="3" stroke-linecap="round"/>
<polygon points="267.1,123.1 264.3,135 255.9,128" fill="#1c7ed6"/>
<text x="275.1" y="117.1" font-size="12.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">(sin θ, 0, cos θ)</text>
<path d="M 190 165 A 50 50 0 0 1 222.1 176.7" fill="none" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="208" y="157" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">θ</text>
<line x1="190" y1="215" x2="301" y2="215" stroke="#7048e8" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 4"/>
<polygon points="310,215 300,220 300,210" fill="#7048e8"/>
<text x="306" y="235" font-size="12" fill="#7048e8" text-anchor="end" font-weight="800" xml:space="preserve">θ = 90°: (1, 0, 0)</text>
<path d="M407 80 H400 V190 H407" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M601 80 H608 V190 H601" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="106" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">cos θ</text>
<text x="504" y="106" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<text x="568" y="106" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">sin θ</text>
<text x="440" y="140" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<rect x="474" y="120" width="60" height="30" rx="5" fill="#e9ecef"/>
<text x="504" y="140" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<text x="568" y="140" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<text x="440" y="174" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">−sin θ</text>
<text x="504" y="174" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<text x="568" y="174" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">cos θ</text>
<text x="410" y="230" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">y stays: the middle row and column</text>
<text x="410" y="246.9" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">are (0, 1, 0). A positive yaw turns</text>
<text x="410" y="263.8" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">to the right.</text>
</svg>
