<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Before you present: check what the AI wrote</text>
<rect x="20" y="52" width="640" height="40" rx="0" fill="#D9480F"/>
<text x="30" y="76.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">check</text>
<text x="280" y="76.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">how</text>
<text x="520" y="76.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">example</text>
<text x="30" y="116.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Facts and numbers</text>
<text x="280" y="116.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">compare with your real data</text>
<text x="520" y="116.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">AI wrote 9,000 pages; the real number is 6,500.</text>
<rect x="20" y="132" width="640" height="40" rx="0" fill="#f8f9fa"/>
<text x="30" y="156.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Sources</text>
<text x="280" y="156.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">open every source it names</text>
<text x="520" y="156.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">“A 2021 report by …” does not exist.</text>
<text x="30" y="196.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Your words</text>
<text x="280" y="196.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">say it like you speak</text>
<text x="520" y="196.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Replace phrases you would never say.</text>
<rect x="20" y="212" width="640" height="40" rx="0" fill="#f8f9fa"/>
<text x="30" y="236.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Few words</text>
<text x="280" y="236.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">3–5 short points</text>
<text x="520" y="236.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">AI slides are often too full.</text>
<text x="30" y="276.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Note the AI use</text>
<text x="280" y="276.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">say what the AI did</text>
<text x="520" y="276.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">“Outline and pictures made with AI help.”</text>
<rect x="20" y="52" width="640" height="240" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
