<rect x="20" y="50" width="380" height="306" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<rect x="410" y="50" width="250" height="300" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="424" y="74" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">How to read it</text>
<text x="424" y="92" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">s: the guard sees the player. n: the</text>
<text x="424" y="108.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">player is near. w: the guard is weak</text>
<text x="424" y="124.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">(health &lt; 30).</text>
<text x="424" y="170" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">3 conditions → 2³ = 8 rows. Each</text>
<text x="424" y="186.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">row has exactly one action:</text>
<text x="424" y="220" font-size="12.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">no case is missing (complete) and</text>
<text x="424" y="236.2" font-size="12.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">no case has two actions (no</text>
<text x="424" y="252.5" font-size="12.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">conflict).</text>
</svg>
