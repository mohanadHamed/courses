<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A or B: add, then take away the overlap</text>
<circle cx="170" cy="170" r="95" fill="#d0ebff" stroke="#1c7ed6" stroke-width="2" opacity="0.8"/>
<circle cx="270" cy="170" r="95" fill="#ffe8cc" stroke="#e8590c" stroke-width="2" opacity="0.8"/>
<text x="150" y="62" font-size="13.5" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">A: even</text>
<text x="300" y="62" font-size="13.5" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">B: more than 4</text>
<rect x="104" y="134" width="32" height="32" rx="5.8" fill="#ffffff" stroke="#2a2f2c" stroke-width="2"/>
<circle cx="112.6" cy="142.6" r="2.7" fill="#2a2f2c"/>
<circle cx="127.4" cy="157.4" r="2.7" fill="#2a2f2c"/>
<rect x="114" y="184" width="32" height="32" rx="5.8" fill="#ffffff" stroke="#2a2f2c" stroke-width="2"/>
<circle cx="122.6" cy="192.6" r="2.7" fill="#2a2f2c"/>
<circle cx="137.4" cy="192.6" r="2.7" fill="#2a2f2c"/>
<circle cx="122.6" cy="207.4" r="2.7" fill="#2a2f2c"/>
<circle cx="137.4" cy="207.4" r="2.7" fill="#2a2f2c"/>
<rect x="204" y="159" width="32" height="32" rx="5.8" fill="#ffffff" stroke="#2a2f2c" stroke-width="2"/>
<circle cx="212.6" cy="166.7" r="2.7" fill="#2a2f2c"/>
<circle cx="227.4" cy="166.7" r="2.7" fill="#2a2f2c"/>
<circle cx="212.6" cy="175" r="2.7" fill="#2a2f2c"/>
<circle cx="227.4" cy="175" r="2.7" fill="#2a2f2c"/>
<circle cx="212.6" cy="183.3" r="2.7" fill="#2a2f2c"/>
<circle cx="227.4" cy="183.3" r="2.7" fill="#2a2f2c"/>
<rect x="294" y="159" width="32" height="32" rx="5.8" fill="#ffffff" stroke="#2a2f2c" stroke-width="2"/>
<circle cx="302.6" cy="167.6" r="2.7" fill="#2a2f2c"/>
<circle cx="317.4" cy="167.6" r="2.7" fill="#2a2f2c"/>
<circle cx="310" cy="175" r="2.7" fill="#2a2f2c"/>
<circle cx="302.6" cy="182.4" r="2.7" fill="#2a2f2c"/>
<circle cx="317.4" cy="182.4" r="2.7" fill="#2a2f2c"/>
<text x="220" y="296" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">outside both: 1 and 3</text>
<rect x="400" y="60" width="260" height="240" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="414" y="84" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">P(A or B)</text>
<text x="414" y="100" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">P(A) + P(B) − P(A and B)</text>
<text x="414" y="132" font-size="13.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">= 3/6 + 2/6 − 1/6 = 4/6</text>
<text x="414" y="176" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The 6 is in both. Without “− 1/6” it</text>
<text x="414" y="192.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">counts twice.</text>
<text x="414" y="232" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Mutually exclusive (no overlap): just</text>
<text x="414" y="248.2" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">add.</text>
</svg>
