<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Criteria for comparing platforms</text>
<rect x="20" y="52" width="206" height="100" rx="10" fill="#ffffff" stroke="#1c7ed6" stroke-width="2"/>
<text x="34" y="82" font-size="14" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">reach</text>
<text x="34" y="106" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">how many players can buy and</text>
<text x="34" y="121.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">play it?</text>
<rect x="238" y="52" width="206" height="100" rx="10" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/>
<text x="252" y="82" font-size="14" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">fit for the game</text>
<text x="252" y="106" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">controls, screen, session</text>
<text x="252" y="121.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">length</text>
<rect x="456" y="52" width="206" height="100" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<text x="470" y="82" font-size="14" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">cost and time</text>
<text x="470" y="106" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">dev kits, porting, store fees</text>
<rect x="20" y="164" width="206" height="100" rx="10" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text x="34" y="194" font-size="14" fill="#7048e8" text-anchor="start" font-weight="800" xml:space="preserve">performance</text>
<text x="34" y="218" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">CPU, GPU, memory of the</text>
<text x="34" y="233.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">devices</text>
<rect x="238" y="164" width="206" height="100" rx="10" fill="#ffffff" stroke="#0c8599" stroke-width="2"/>
<text x="252" y="194" font-size="14" fill="#0c8599" text-anchor="start" font-weight="800" xml:space="preserve">testing</text>
<text x="252" y="218" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">how many devices and</text>
<text x="252" y="233.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">settings?</text>
<rect x="456" y="164" width="206" height="100" rx="10" fill="#ffffff" stroke="#d6336c" stroke-width="2"/>
<text x="470" y="194" font-size="14" fill="#d6336c" text-anchor="start" font-weight="800" xml:space="preserve">business model</text>
<text x="470" y="218" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">premium, free-to-play,</text>
<text x="470" y="233.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">subscription</text>
</svg>
