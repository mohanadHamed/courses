<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="270" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Number formats: the same value, another look</text>
<rect x="20" y="50" width="640" height="34" rx="0" fill="#D9480F"/>
<text x="30" y="71.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">value</text>
<text x="240" y="71.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">format</text>
<text x="385" y="71.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">the cell shows</text>
<text x="560" y="71.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">use it for</text>
<text x="30" y="105.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">0.36</text>
<text x="240" y="105.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Percentage</text>
<text x="385" y="105.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">36%</text>
<text x="560" y="105.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">parts of a total</text>
<rect x="20" y="118" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="139.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">55</text>
<text x="240" y="139.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Currency (JD)</text>
<text x="385" y="139.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">55.00 JD</text>
<text x="560" y="139.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">money</text>
<text x="30" y="173.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">4.8333</text>
<text x="240" y="173.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Number, 2 decimals</text>
<text x="385" y="173.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">4.83</text>
<text x="560" y="173.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">averages</text>
<rect x="20" y="186" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="207.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">46337</text>
<text x="240" y="207.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Date</text>
<text x="385" y="207.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">11/11/2026</text>
<text x="560" y="207.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">dates</text>
<rect x="20" y="50" width="640" height="170" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="240" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Home › Number: the format changes the look; the formula bar keeps the real value.</text>
</svg>
