<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Four kinds of gaming platforms</text>
<rect x="20" y="50" width="152" height="262" rx="12" fill="#fff9db" stroke="#1c7ed6" stroke-width="2"/>
<text x="96" y="76" font-size="14.5" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">Console</text>
<rect x="41" y="92" width="110" height="56" rx="5" fill="#212529"/>
<rect x="46" y="97" width="100" height="46" rx="3" fill="#d0ebff"/>
<line x1="61" y1="148" x2="55" y2="158" stroke="#495057" stroke-width="3" stroke-linecap="round"/>
<line x1="131" y1="148" x2="137" y2="158" stroke="#495057" stroke-width="3" stroke-linecap="round"/>
<rect x="38" y="168" width="52.5" height="30" rx="6" fill="#343a40"/>
<circle cx="80" cy="183" r="3" fill="#69db7c"/>
<rect x="44" y="180" width="22.5" height="4.5" rx="2.2" fill="#868e96"/>
<rect x="102" y="172" width="44.8" height="20.8" rx="10.4" fill="#495057"/>
<circle cx="114.8" cy="182.4" r="4.8" fill="#868e96"/>
<circle cx="134" cy="180" r="2.4" fill="#ffd43b"/>
<circle cx="138.8" cy="184.8" r="2.4" fill="#ff8787"/>
<text x="96" y="222" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">same hardware for</text>
<text x="96" y="237.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">all players; TV and</text>
<text x="96" y="253.2" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">controller; also</text>
<text x="96" y="268.8" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">handhelds</text>
<rect x="182" y="50" width="152" height="262" rx="12" fill="#fff9db" stroke="#7048e8" stroke-width="2"/>
<text x="258" y="76" font-size="14.5" fill="#7048e8" text-anchor="middle" font-weight="800" xml:space="preserve">Gaming PC</text>
<rect x="213" y="92" width="90" height="58" rx="5" fill="#343a40"/>
<rect x="218" y="97" width="80" height="48" rx="3" fill="#d0ebff"/>
<rect x="252" y="150" width="12" height="10" rx="0" fill="#495057"/>
<rect x="236" y="160" width="44" height="5" rx="2" fill="#495057"/>
<rect x="204" y="172" width="76" height="16" rx="3" fill="#495057"/>
<ellipse cx="300" cy="180" rx="10" ry="13" fill="#495057"/>
<text x="258" y="222" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">very different</text>
<text x="258" y="237.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">hardware; keyboard,</text>
<text x="258" y="253.2" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">mouse or controller</text>
<rect x="344" y="50" width="152" height="262" rx="12" fill="#fff9db" stroke="#2b8a3e" stroke-width="2"/>
<text x="420" y="76" font-size="14.5" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">Mobile</text>
<rect x="378" y="90" width="46" height="92" rx="18" fill="#343a40"/>
<rect x="384" y="104" width="34" height="64" rx="6" fill="#ffffff"/>
<rect x="387" y="95" width="28" height="4" rx="2" fill="#868e96"/>
<rect x="434" y="110" width="44" height="66" rx="6" fill="#343a40"/>
<rect x="438" y="115" width="36" height="56" rx="3" fill="#ffffff"/>
<text x="420" y="222" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">phones and tablets;</text>
<text x="420" y="237.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">touch, battery, short</text>
<text x="420" y="253.2" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">sessions</text>
<rect x="506" y="50" width="152" height="262" rx="12" fill="#fff9db" stroke="#e8590c" stroke-width="2"/>
<text x="582" y="76" font-size="14.5" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">Cloud gaming</text>
<path d="M551.6 132.8 a12.8 12.8 0 0 1 3.2 -24 a17.6 17.6 0 0 1 28.8 -9.6 a14.4 14.4 0 0 1 24 11.2 a11.2 11.2 0 0 1 4.8 22.4 Z" fill="#fff4e6" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="582" y1="138" x2="582" y2="157.7" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="582,166 577.4,156.8 586.6,156.8" fill="#e8590c"/>
<rect x="546" y="168" width="72" height="22" rx="4" fill="#343a40"/>
<rect x="550" y="172" width="64" height="14" rx="2" fill="#d0ebff"/>
<text x="582" y="222" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the game runs on a</text>
<text x="582" y="237.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">server and streams</text>
<text x="582" y="253.2" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">video to the player</text>
</svg>
