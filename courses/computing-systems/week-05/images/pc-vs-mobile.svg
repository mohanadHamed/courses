<svg xmlns="http://www.w3.org/2000/svg" width="680" height="344" viewBox="0 0 680 344" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="344" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The same game on a PC and on a phone</text>
<rect x="30" y="50" width="630" height="40" rx="0" fill="#A86700"/>
<text x="40" y="74.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve"></text>
<text x="330" y="74.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">PC (Windows)</text>
<text x="550" y="74.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Phone (Android, iOS)</text>
<text x="40" y="114.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Input</text>
<text x="330" y="114.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">mouse, keyboard, gamepad</text>
<text x="550" y="114.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">touch, sensors</text>
<rect x="30" y="130" width="630" height="40" rx="0" fill="#f8f9fa"/>
<text x="40" y="154.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">In the background</text>
<text x="330" y="154.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">keeps running</text>
<text x="550" y="154.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">paused, may be closed</text>
<text x="40" y="194.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Memory full</text>
<text x="330" y="194.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">page file (slow)</text>
<text x="550" y="194.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">closes background apps</text>
<rect x="30" y="210" width="630" height="40" rx="0" fill="#f8f9fa"/>
<text x="40" y="234.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Installing</text>
<text x="330" y="234.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">store or installer</text>
<text x="550" y="234.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">app store (Android: also APK)</text>
<text x="40" y="274.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Files and privacy</text>
<text x="330" y="274.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">many folders open</text>
<text x="550" y="274.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">sandbox, ask permission</text>
<rect x="30" y="290" width="630" height="40" rx="0" fill="#f8f9fa"/>
<text x="40" y="314.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Permissions</text>
<text x="330" y="314.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">few prompts</text>
<text x="550" y="314.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">asks: camera, microphone</text>
<rect x="30" y="50" width="630" height="280" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
