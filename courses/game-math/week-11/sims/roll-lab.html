<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Roll Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 5px 0; font-weight: 700; font-size: .92rem; }
    .sim .bar button.on { background: var(--sim-accent); color: #fff; }
    .sim .task { font-weight: 800; color: var(--sim-accent); margin: 6px 0 0; }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Roll Lab: theory and experiment</h1>
  <p class="hint">Choose an event and roll many times. The green line is the relative frequency (hits ÷ rolls); the red line is the probability from counting.</p>
  <div class="bar" id="ev"></div>
  <div class="bar" id="go"></div>
  <canvas id="c" aria-label="The last roll and the chart of the relative frequency"></canvas>
  <p class="calc" id="calc"></p>
  <p class="task" id="task"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script src="dice.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const d6 = () => 1 + Math.floor(Math.random() * 6);
  const EV = {
    "a 6 (one die)": { p: [1, 6], roll: () => { const a = d6(); return { show: [a], hit: a === 6 }; } },
    "sum 7 (two dice)": { p: [6, 36], roll: () => { const a = d6(), b = d6(); return { show: [a, b], hit: a + b === 7 }; } },
    "at least one 6 (two dice)": { p: [11, 36], roll: () => { const a = d6(), b = d6(); return { show: [a, b], hit: a === 6 || b === 6 }; } },
    "two heads (two coins)": { p: [1, 4], roll: () => { const t = [0, 0].map(() => (Math.random() < 0.5 ? "H" : "T")); return { coins: t, hit: t[0] === "H" && t[1] === "H" }; } },
  };
  const s = { ev: "a 6 (one die)", n: 0, hits: 0, path: [], last: null, done1000: {} };
  const TASKS = [
    { q: "Task 1: Roll 10 times. Is the relative frequency already close to 1/6?", ok: () => s.n >= 10 },
    { q: "Task 2: Keep rolling to 1000 rolls. How close is the green line to the red one now?", ok: () => s.n >= 1000 },
    { q: "Task 3: Choose “at least one 6 (two dice)” and roll 1000 times. Is it close to 11/36 ≈ 0.31 or to 2/6 ≈ 0.33?", ok: () => s.done1000["at least one 6 (two dice)"] },
  ];
  let ti = 0;
  function reset() { s.n = 0; s.hits = 0; s.path = []; s.last = null; }
  function roll(k) {
    const E = EV[s.ev];
    for (let i = 0; i < k; i++) { const r = E.roll(); s.n++; s.hits += r.hit ? 1 : 0; s.last = r; if (s.n <= 50 || s.n % Math.ceil(s.n / 400) === 0) s.path.push([s.n, s.hits / s.n]); }
    if (s.n >= 1000) s.done1000[s.ev] = true;
    upd();
  }
  function upd() {
    Kit.buttons($("ev"), Object.keys(EV).map((k) => ({ k, label: k })), (k) => { s.ev = k; reset(); upd(); });
    $("ev").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.k === s.ev));
    const E = EV[s.ev], p = E.p[0] / E.p[1], f = s.n ? s.hits / s.n : 0;
    $("calc").textContent = `rolls: ${s.n} · hits: ${s.hits} · relative frequency: ${s.n ? f.toFixed(3) : "—"} · probability: ${DC.frac(E.p[0], E.p[1])} ≈ ${p.toFixed(3)}`;
    let m = "";
    while (ti < TASKS.length && TASKS[ti].ok()) { ti++; m = "✓ Done."; Kit.good(); }
    $("task").textContent = ti < TASKS.length ? TASKS[ti].q : "All tasks are done: with many rolls the experiment comes close to the theory.";
    if (!m) m = !s.n ? "Press a Roll button." : s.n < 100 ? "With few rolls the frequency jumps a lot. That is normal." : `After ${s.n} rolls the difference is ${Math.abs(f - p).toFixed(3)}. More rolls: a smaller difference (most of the time).`;
    $("msg").textContent = m;
  }
  Kit.buttons($("go"), [1, 10, 100, 1000].map((k) => ({ k, label: "Roll ×" + k })).concat([{ k: "r", label: "Reset" }]), (k) => (k === "r" ? (reset(), upd()) : roll(+k)));
  const cv = Kit.canvas($("c"), (W) => Math.min(300, W * 0.55));
  Kit.loop(() => {
    const c = cv.ctx, W = cv.W, H = cv.H, E = EV[s.ev], p = E.p[0] / E.p[1];
    c.clearRect(0, 0, W, H);
    const top = 70, x0 = 40, x1 = W - 14, y0 = top + 10, y1 = H - 26, vmax = 0.6;
    if (s.last) {
      if (s.last.show) s.last.show.forEach((v, i) => DC.die(c, x0 + i * 60, 8, 50, v, s.last.hit ? "#d3f9d8" : "#fff"));
      if (s.last.coins) s.last.coins.forEach((t, i) => DC.coin(c, x0 + 25 + i * 56, 33, 23, t));
      Kit.text(c, s.last.hit ? "hit ✓" : "miss", x0 + 140, 40, 15, s.last.hit ? "#2b8a3e" : "#868e96", "left");
    } else Kit.text(c, "no rolls yet", x0, 40, 14, "#868e96", "left");
    c.strokeStyle = "#adb5bd"; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0, y1); c.lineTo(x1, y1); c.stroke();
    const Y = (v) => y1 - (y1 - y0) * Math.min(v, vmax) / vmax, N = Math.max(10, s.n), X = (t) => x0 + (x1 - x0) * Math.log10(t) / Math.log10(N);
    [0, 0.2, 0.4, 0.6].forEach((v) => { Kit.text(c, v.toFixed(1), x0 - 6, Y(v) + 4, 10, "#868e96", "right", 700); c.strokeStyle = "#f1f3f5"; c.beginPath(); c.moveTo(x0, Y(v)); c.lineTo(x1, Y(v)); c.stroke(); });
    [1, 10, 100, 1000, 10000].filter((t) => t <= N).forEach((t) => Kit.text(c, t, X(t), y1 + 15, 10, "#868e96", "center", 700));
    c.strokeStyle = "#c92a2a"; c.setLineDash([6, 5]); c.lineWidth = 2; c.beginPath(); c.moveTo(x0, Y(p)); c.lineTo(x1, Y(p)); c.stroke(); c.setLineDash([]);
    if (s.path.length) { c.strokeStyle = "#2F9E44"; c.lineWidth = 2.2; c.beginPath(); s.path.forEach(([t, v], i) => (i ? c.lineTo(X(t), Y(v)) : c.moveTo(X(t), Y(v)))); c.stroke(); }
  });
  window.RL = { ev: (k) => { s.ev = k; reset(); upd(); }, roll };
  upd();
})();
</script>
</body>
</html>
