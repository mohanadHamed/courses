<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A pre-submission checklist for Pocket Quest</text>
<rect x="30" y="48" width="18" height="18" rx="4" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="60" y="62" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">tested on weak, typical and strong phones; no crashes</text>
<rect x="30" y="80" width="18" height="18" rx="4" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="60" y="94" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">every button works; no “coming soon”</text>
<rect x="30" y="112" width="18" height="18" rx="4" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="60" y="126" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">screenshots and text show the real game</text>
<rect x="30" y="144" width="18" height="18" rx="4" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="60" y="158" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">privacy policy link; data form; only needed permissions</text>
<rect x="30" y="176" width="18" height="18" rx="4" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="60" y="190" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">purchases through the store; loot-box odds shown</text>
<rect x="30" y="208" width="18" height="18" rx="4" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="60" y="222" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">licences and credits for all music, art and fonts</text>
<rect x="30" y="240" width="18" height="18" rx="4" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="60" y="254" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">age rating questionnaire answered honestly</text>
<rect x="30" y="272" width="18" height="18" rx="4" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="60" y="286" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">new build number; signed with the right key</text>
<text x="340" y="320" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">One line for each part of the guidelines, checked before every upload.</text>
</svg>
