<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Decision conditions in code: nested ifs or guard clauses</text>
<rect x="20" y="54" width="310" height="200" rx="12" fill="#1e1e2e"/>
<text x="34" y="78" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">void TryDock() {</text>
<text x="34" y="100" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  if (hasPass) {</text>
<text x="34" y="122" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">    if (!alarmOn) {</text>
<text x="34" y="144" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">      if (shieldsUp || officer)</text>
<text x="34" y="166" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">        OpenDoor();</text>
<text x="34" y="188" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">    }</text>
<text x="34" y="210" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  }</text>
<text x="34" y="232" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">}</text>
<rect x="350" y="54" width="310" height="200" rx="12" fill="#1e1e2e"/>
<text x="364" y="78" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">void TryDock() {</text>
<text x="364" y="100" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  if (!hasPass) return;</text>
<text x="364" y="122" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  if (alarmOn) return;</text>
<text x="364" y="144" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  if (shieldsUp || officer)</text>
<text x="364" y="166" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">    OpenDoor();</text>
<text x="364" y="188" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">}</text>
<text x="175" y="276" font-size="12.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">nested: three levels deep</text>
<text x="505" y="276" font-size="12.5" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">guard clauses: leave early</text>
</svg>
