<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Lag Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .modes { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
    .sim .modes button.active { background: var(--sim-accent); color: #fff; }
    .sim .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; font-variant-numeric: tabular-nums; }
    .sim .stat { border: 1.5px solid #eadfcd; border-radius: 10px; padding: 6px; text-align: center; font-size: .82rem; }
    .sim .stat b { display: block; font-size: .95rem; }
    .sim .stat.active { border-color: var(--sim-accent); background: color-mix(in srgb, var(--sim-accent2) 25%, #fff); }
    .sim canvas { cursor: pointer; }
  </style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Lag Lab</h1>
  <p class="hint">Tap (or press Space) to jump over the blocks. Choose how far away the game is computed: the jump starts only after the input lag.</p>
  <div class="modes" id="modes">
    <button type="button" class="ghost active" data-lag="0">Local · +0 ms</button>
    <button type="button" class="ghost" data-lag="60">Online · +60 ms</button>
    <button type="button" class="ghost" data-lag="120">Cloud, good network · +120 ms</button>
    <button type="button" class="ghost" data-lag="220">Cloud, poor network · +220 ms</button>
  </div>
  <canvas id="c" aria-label="Jump game with adjustable input lag"></canvas>
  <div class="stats" id="stats"></div>
  <p id="msg" class="message">Tap to start. Jump over 10 blocks in each mode and compare the results.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const G = 2800, JUMP = 900, SPEED = 380;
  const MODES = [0, 60, 120, 220];
  let W = 0, H = 0, ground = 0, lag = 0, last = 0;
  const res = Object.fromEntries(MODES.map((m) => [m, { ok: 0, fail: 0 }]));
  let st, pending = [], marks = [];

  function reset() { st = { y: 0, vy: 0, onGround: true, blocks: [], next: 0.9, started: false, t: 0, cleared: 0, hitFlash: 0 }; pending = []; }
  function resize() {
    W = canvas.clientWidth; H = Math.round(Math.min(250, Math.max(180, W * 0.36)));
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ground = H - 30;
  }
  function stats() {
    $("stats").innerHTML = MODES.map((m) => {
      const r = res[m], n = r.ok + r.fail;
      return `<div class="stat ${m === lag ? "active" : ""}"><b>+${m} ms</b>${n ? Math.round(100 * r.ok / n) + "% cleared" : "—"}<br>${r.ok} / ${n}</div>`;
    }).join("");
  }
  function tap(e) {
    if (e) e.preventDefault();
    if (!st.started) { st.started = true; $("msg").textContent = "Jump! The game is computed with +" + lag + " ms of extra lag."; return; }
    const now = performance.now();
    pending.push(now + lag);                 // the input reaches the game later
    marks.push({ t: now, lag });
  }
  function update(dt, now) {
    if (!st.started) return;
    st.t += dt;
    while (pending.length && pending[0] <= now) {
      pending.shift();
      if (st.onGround) { st.vy = JUMP; st.onGround = false; }
    }
    st.vy -= G * dt; st.y += st.vy * dt;
    if (st.y <= 0) { st.y = 0; st.vy = 0; st.onGround = true; }
    st.next -= dt;
    if (st.next <= 0) { st.blocks.push({ x: W + 10, w: 22, h: 34, done: false }); st.next = 0.85 + Math.random() * 0.9; }
    const px = 70, pw = 24, ph = 28, py = ground - st.y - ph;
    for (const b of st.blocks) {
      b.x -= SPEED * dt;
      const hit = px + pw > b.x + 2 && px < b.x + b.w - 2 && py + ph > ground - b.h + 2;
      if (hit && !b.done) { b.done = true; res[lag].fail++; st.hitFlash = 0.35; stats(); }
      if (!b.done && b.x + b.w < px) { b.done = true; res[lag].ok++; stats(); }
    }
    st.blocks = st.blocks.filter((b) => b.x > -40);
    st.hitFlash = Math.max(0, st.hitFlash - dt);
    const n = res[lag].ok + res[lag].fail;
    if (n >= 10 && !st.reported) {
      st.reported = true;
      $("msg").textContent = `+${lag} ms: ${res[lag].ok} of ${n} blocks cleared. Try another mode and compare.`;
    }
  }
  function draw(now) {
    ctx.fillStyle = st.hitFlash > 0 ? "#ffe3e3" : "#fff7e0"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#e9dcc3"; ctx.fillRect(0, ground, W, H - ground);
    ctx.fillStyle = "#6b4300"; for (const b of st.blocks) ctx.fillRect(b.x, ground - b.h, b.w, b.h);
    ctx.fillStyle = "#A86700"; ctx.fillRect(70, ground - st.y - 28, 24, 28);
    // tap markers: when the finger touched (●) and when the game reacted (▲)
    marks = marks.filter((m) => now - m.t < 1600);
    for (const m of marks) {
      const x1 = 70 + 12 + (now - m.t) * -SPEED / 1000 + 0, x2 = x1 + m.lag * SPEED / 1000;
      ctx.fillStyle = "#e8590c"; ctx.beginPath(); ctx.arc(x1, 18, 5, 0, 7); ctx.fill();
      if (m.lag) {
        ctx.strokeStyle = "#e8590c"; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(x1, 18); ctx.lineTo(x2, 18); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(x2, 12); ctx.lineTo(x2 + 6, 24); ctx.lineTo(x2 - 6, 24); ctx.fill();
      }
    }
    ctx.fillStyle = "rgba(107,67,0,.75)"; ctx.font = "700 12px Nunito, system-ui, sans-serif"; ctx.textAlign = "right";
    ctx.fillText(`extra lag +${lag} ms`, W - 10, 20);
    if (!st.started) { ctx.textAlign = "center"; ctx.font = "800 18px Nunito, system-ui, sans-serif"; ctx.fillText("Tap to start", W / 2, H / 2); }
  }
  function loop(now) {
    const dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60; last = now;
    update(dt, now); draw(now); requestAnimationFrame(loop);
  }
  document.querySelectorAll("#modes button").forEach((b) => b.addEventListener("click", () => {
    lag = Number(b.dataset.lag);
    document.querySelectorAll("#modes button").forEach((x) => x.classList.toggle("active", x === b));
    reset(); stats();
    $("msg").textContent = `Mode +${lag} ms. Tap to start.`;
  }));
  canvas.addEventListener("pointerdown", tap);
  window.addEventListener("keydown", (e) => { if (e.code === "Space") tap(e); });
  window.addEventListener("resize", resize);
  reset(); resize(); stats(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
