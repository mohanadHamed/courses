<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="700" height="300" fill="#ffffff"/>
<text x="350" y="34" font-size="17" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">The line table of Rooftop Rescue</text>
<rect x="20" y="54" width="660" height="28" rx="6" fill="#9C36B5" stroke="none" stroke-width="1.5"/>
<text x="30" y="73" font-size="12.5" fill="#fff" text-anchor="start" font-weight="800" xml:space="preserve">line ID</text>
<text x="134" y="73" font-size="12.5" fill="#fff" text-anchor="start" font-weight="800" xml:space="preserve">character</text>
<text x="220" y="73" font-size="12.5" fill="#fff" text-anchor="start" font-weight="800" xml:space="preserve">line</text>
<text x="476" y="73" font-size="12.5" fill="#fff" text-anchor="start" font-weight="800" xml:space="preserve">trigger (when it plays)</text>
<text x="30" y="104" font-size="11.5" fill="#9C36B5" text-anchor="start" font-weight="800" font-family="Menlo, Consolas, monospace" xml:space="preserve">NOUR_01</text>
<text x="134" y="104" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Nour</text>
<text x="220" y="104" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Hold on, everyone. I'm coming.</text>
<text x="476" y="104" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the scene starts</text>
<rect x="20" y="115" width="660" height="28" rx="4" fill="#f8f0fc" stroke="none" stroke-width="1.5"/>
<text x="30" y="134" font-size="11.5" fill="#9C36B5" text-anchor="start" font-weight="800" font-family="Menlo, Consolas, monospace" xml:space="preserve">NOUR_02</text>
<text x="134" y="134" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Nour</text>
<text x="220" y="134" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Car ahead! Around it.</text>
<text x="476" y="134" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a floating car is in view</text>
<text x="30" y="164" font-size="11.5" fill="#9C36B5" text-anchor="start" font-weight="800" font-family="Menlo, Consolas, monospace" xml:space="preserve">FAM_01</text>
<text x="134" y="164" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Family</text>
<text x="220" y="164" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Over here! Please!</text>
<text x="476" y="164" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the rooftop is in view</text>
<rect x="20" y="175" width="660" height="28" rx="4" fill="#f8f0fc" stroke="none" stroke-width="1.5"/>
<text x="30" y="194" font-size="11.5" fill="#9C36B5" text-anchor="start" font-weight="800" font-family="Menlo, Consolas, monospace" xml:space="preserve">NOUR_03</text>
<text x="134" y="194" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Nour</text>
<text x="220" y="194" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">I see you! Stay there.</text>
<text x="476" y="194" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">after FAM_01</text>
<text x="30" y="224" font-size="11.5" fill="#9C36B5" text-anchor="start" font-weight="800" font-family="Menlo, Consolas, monospace" xml:space="preserve">NOUR_04</text>
<text x="134" y="224" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Nour</text>
<text x="220" y="224" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Faster. The water's still rising.</text>
<text x="476" y="224" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the water rises</text>
<rect x="20" y="235" width="660" height="28" rx="4" fill="#f8f0fc" stroke="none" stroke-width="1.5"/>
<text x="30" y="254" font-size="11.5" fill="#9C36B5" text-anchor="start" font-weight="800" font-family="Menlo, Consolas, monospace" xml:space="preserve">SALMA_01</text>
<text x="134" y="254" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Salma</text>
<text x="220" y="254" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">I won't leave without my cat.</text>
<text x="476" y="254" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the boat reaches the roof</text>
<text x="350" y="288" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">The programmer plays a line by its ID when its trigger happens.</text>
</svg>
