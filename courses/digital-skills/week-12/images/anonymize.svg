<rect x="20" y="52" width="300" height="138" rx="12" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.8"/>
<text x="34" y="76" font-size="14.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Before</text>
<text x="34" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Write a polite reminder to Omar Haddad, ID</text>
<text x="34" y="114.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">9871234567, phone 0790 000 123, who has</text>
<text x="34" y="130.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">not paid 340 JD for invoice 5521 since</text>
<text x="34" y="146.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">March.</text>
<line x1="330" y1="120" x2="341" y2="120" stroke="#868e96" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="350,120 340,125 340,115" fill="#868e96"/>
<rect x="360" y="52" width="300" height="138" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="374" y="76" font-size="14.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">After</text>
<text x="374" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Write a polite reminder to [Customer] who</text>
<text x="374" y="114.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">has not paid [amount] for [invoice] since</text>
<text x="374" y="130.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">[month].</text>
<text x="374" y="149.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Then add the real details yourself, in Word,</text>
<text x="374" y="166.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">not in the chat.</text>
