<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="380" fill="#ffffff"/>
<text x="20" y="32" font-size="18" fill="#2a2f2c" font-weight="800">A clear prompt has three parts</text>
<!-- the prompt: three coloured blocks -->
<rect x="20" y="52" width="400" height="300" rx="14" fill="#fff8f0" stroke="#e8a46a" stroke-width="1.6"/>
<text x="38" y="80" font-size="13" fill="#7a2e0b" font-weight="800">YOUR PROMPT</text>
<rect x="36" y="92" width="368" height="72" rx="10" fill="#d9480f"/>
<text x="50" y="114" font-size="13" fill="#ffffff" font-weight="800">TASK · what the AI must do</text>
<text x="50" y="140" font-size="13" fill="#ffffff">Write a short message to my</text>
<text x="50" y="157" font-size="13" fill="#ffffff">study group.</text>
<rect x="36" y="176" width="368" height="72" rx="10" fill="#ffc078"/>
<text x="50" y="198" font-size="13" fill="#7a2e0b" font-weight="800">CONTEXT · the facts of your situation</text>
<text x="50" y="224" font-size="13" fill="#3b3f3c">We meet on Tuesday at 2 p.m. in the</text>
<text x="50" y="241" font-size="13" fill="#3b3f3c">library to study for the Excel quiz.</text>
<rect x="36" y="260" width="368" height="76" rx="10" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<text x="50" y="282" font-size="13" fill="#7a2e0b" font-weight="800">FORMAT · length, form and tone</text>
<text x="50" y="308" font-size="13" fill="#3b3f3c">Write 3 friendly sentences for our</text>
<text x="50" y="325" font-size="13" fill="#3b3f3c">group chat.</text>
<!-- arrow to the answer -->
<path d="M 428 202 L 462 202" stroke="#d9480f" stroke-width="3"/>
<path d="M 454 194 L 464 202 L 454 210" fill="none" stroke="#d9480f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- the answer bubble -->
<rect x="472" y="110" width="190" height="186" rx="16" fill="#e6fcf5" stroke="#2b8a3e" stroke-width="1.6"/>
<text x="486" y="136" font-size="12" fill="#2b8a3e" font-weight="800">THE ANSWER</text>
<text x="486" y="162" font-size="12" fill="#2a2f2c">Hi all! We meet on</text>
<text x="486" y="180" font-size="12" fill="#2a2f2c">Tuesday at 2 p.m. in</text>
<text x="486" y="198" font-size="12" fill="#2a2f2c">the library. Let's study</text>
<text x="486" y="216" font-size="12" fill="#2a2f2c">for the Excel quiz</text>
<text x="486" y="234" font-size="12" fill="#2a2f2c">together. See you there!</text>
<text x="486" y="272" font-size="11" fill="#4a4f4b">Short, friendly, with</text>
<text x="486" y="288" font-size="11" fill="#4a4f4b">the right facts.</text>
</svg>
