<path d="M200.0 170.0 L199.9 167.9 L199.7 165.7 L199.3 163.6 L198.8 161.5 L198.1 159.5 L197.3 157.5 L196.3 155.6 L195.2 153.8 L194.0 152.0 L192.7 150.3 L191.2 148.8 L189.6 147.3 L188.0 146.0 L186.2 144.8" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
