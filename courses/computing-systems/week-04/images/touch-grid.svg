<circle cx="170" cy="170" r="34" fill="#FFD43B" stroke="none" stroke-width="0" opacity="0.35"/>
<circle cx="170" cy="170" r="16" fill="#A86700" stroke="none" stroke-width="1.5"/>
<rect x="66" y="210" width="208" height="22" rx="6" fill="#ffffff" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="170" y="226" font-size="12" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">finger: the charge changes here</text>
<text x="155" y="324" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">a grid of thin wires under the glass</text>
<text x="340" y="92" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Touch sampling: how often the screen checks</text>
<text x="340" y="126" font-size="12.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">120 Hz: a check about every 8 ms</text>
<line x1="340" y1="140" x2="640" y2="140" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
<line x1="340" y1="132" x2="340" y2="148" stroke="#1c7ed6" stroke-width="2.5" stroke-linecap="round"/>
<line x1="412" y1="132" x2="412" y2="148" stroke="#1c7ed6" stroke-width="2.5" stroke-linecap="round"/>
