<text x="110" y="187" font-size="13" fill="#c92a2a" text-anchor="end" font-weight="800" xml:space="preserve">−340°</text>
<circle cx="170" cy="165" r="8" fill="#2a2f2c" stroke="none" stroke-width="1.5"/>
<text x="380" y="60" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Turn the short way</text>
<text x="380" y="90" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">difference = target − facing</text>
<text x="380" y="114" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">= 10° − 350° = −340°.</text>
<text x="380" y="138" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">If it is less than −180°,</text>
<text x="380" y="162" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">add 360°: −340° + 360° = +20°.</text>
<text x="380" y="186" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">If it is more than 180°,</text>
<text x="380" y="210" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">subtract 360°.</text>
<text x="380" y="234" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">+ turns left (anticlockwise),</text>
<text x="380" y="258" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">− turns right (clockwise).</text>
</svg>
