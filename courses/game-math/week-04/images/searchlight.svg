<text x="72" y="200" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">tower</text>
<text x="420" y="60" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A sweeping searchlight</text>
<text x="420" y="90" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">angle = 45° × sin(360° × t ÷ 4)</text>
<text x="420" y="112" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">amplitude 45°, period 4 s</text>
<text x="420" y="134" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">It sweeps from −45° to 45°:</text>
<text x="420" y="156" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">90° in all.</text>
<text x="420" y="178" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">t = 1 s: angle 45°,</text>
<text x="420" y="200" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">beam (cos 45°, sin 45°)</text>
<text x="420" y="222" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">= (0.71, 0.71)</text>
