<text x="292" y="294" font-size="13" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">x</text>
<text x="90" y="68" font-size="13" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">y</text>
<text x="-18" y="306" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">−3</text>
<text x="18" y="306" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">−2</text>
