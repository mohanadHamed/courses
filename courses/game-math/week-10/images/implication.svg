<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="280" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">If p then q: p is sufficient, q is necessary</text>
<rect x="20" y="54" width="180" height="32" rx="0" fill="#2F9E44"/>
<text x="45" y="74.9" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">p</text>
<text x="95" y="74.9" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">q</text>
<text x="160" y="74.9" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">p → q</text>
<text x="45" y="106.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">T</text>
<text x="95" y="106.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">T</text>
<rect x="120" y="86" width="80" height="32" rx="0" fill="#ebfbee"/>
<text x="160" y="106.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">T</text>
<rect x="20" y="118" width="180" height="32" rx="0" fill="#fff9db"/>
<text x="45" y="138.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">T</text>
<text x="95" y="138.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">F</text>
<rect x="120" y="118" width="80" height="32" rx="0" fill="#fff5f5"/>
<text x="160" y="138.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">F</text>
<text x="45" y="170.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">F</text>
<text x="95" y="170.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">T</text>
<rect x="120" y="150" width="80" height="32" rx="0" fill="#ebfbee"/>
<text x="160" y="170.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">T</text>
<rect x="20" y="182" width="180" height="32" rx="0" fill="#f8f9fa"/>
<text x="45" y="202.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">F</text>
<text x="95" y="202.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">F</text>
<rect x="120" y="182" width="80" height="32" rx="0" fill="#ebfbee"/>
<text x="160" y="202.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">T</text>
<rect x="20" y="54" width="180" height="160" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="110" y="236" font-size="12" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">only T → F breaks the rule</text>
<rect x="220" y="54" width="440" height="100" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="234" y="78" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">p: the player holds the crown · q: the gate is open</text>
<text x="234" y="104" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Rule: crown → gate open. The crown is sufficient for an open gate;</text>
<text x="234" y="120.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">an open gate is necessary for the crown.</text>
<rect x="220" y="168" width="214" height="96" rx="12" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="234" y="192" font-size="14" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Contrapositive ≡</text>
<text x="234" y="212" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">¬q → ¬p: the gate is shut, so no</text>
<text x="234" y="228.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">crown.</text>
<rect x="446" y="168" width="214" height="96" rx="12" fill="#ffffff" stroke="#c92a2a" stroke-width="1.8"/>
<text x="460" y="192" font-size="14" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Converse ≢</text>
<text x="460" y="212" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">q → p: the gate is open, so a</text>
<text x="460" y="228.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">crown? Not sure!</text>
</svg>
