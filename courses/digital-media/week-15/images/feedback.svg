<svg xmlns="http://www.w3.org/2000/svg" width="680" height="186" viewBox="0 0 680 186" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="186" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Constructive feedback: works, improve, how</text>
<rect x="20" y="52" width="206" height="116" rx="12" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="34" y="76" font-size="14.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">What works</text>
<text x="34" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">&quot;The thunder hits exactly on</text>
<text x="34" y="114.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the cut at 0:12.&quot;</text>
<rect x="238" y="52" width="206" height="116" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="1.8"/>
<text x="252" y="76" font-size="14.5" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">What to improve</text>
<text x="252" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">&quot;The music is louder than</text>
<text x="252" y="114.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Nour&#x27;s voice.&quot;</text>
<rect x="456" y="52" width="206" height="116" rx="12" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="470" y="76" font-size="14.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">How</text>
<text x="470" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">&quot;Lower the music by 6 dB</text>
<text x="470" y="114.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">under the voice.&quot;</text>
</svg>
