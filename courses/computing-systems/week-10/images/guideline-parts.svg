<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The main parts of the store guidelines</text>
<rect x="20" y="50" width="640" height="40" rx="0" fill="#A86700"/>
<text x="30" y="74.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">part (Apple)</text>
<text x="285" y="74.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">what it covers</text>
<text x="535" y="74.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">similar topics (Google Play)</text>
<text x="30" y="114.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">1 Safety</text>
<text x="285" y="114.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">content, children, chat and user content</text>
<text x="535" y="114.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">restricted content, families</text>
<rect x="20" y="130" width="640" height="40" rx="0" fill="#f8f9fa"/>
<text x="30" y="154.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">2 Performance</text>
<text x="285" y="154.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">complete build, crashes, true listing</text>
<text x="535" y="154.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">store listing, spam and functionality</text>
<text x="30" y="194.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">3 Business</text>
<text x="285" y="194.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">in-app purchases, ads, loot boxes</text>
<text x="535" y="194.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">payments, monetization and ads</text>
<rect x="20" y="210" width="640" height="40" rx="0" fill="#f8f9fa"/>
<text x="30" y="234.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">4 Design</text>
<text x="285" y="234.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">copies, spam, minimum features</text>
<text x="535" y="234.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">spam and minimum functionality</text>
<text x="30" y="274.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">5 Legal</text>
<text x="285" y="274.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">privacy, data, intellectual property</text>
<text x="535" y="274.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">privacy, user data, intellectual property</text>
<rect x="20" y="50" width="640" height="240" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="340" y="308" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Read the newest version on the store&#x27;s website: the rules change several times a year.</text>
</svg>
