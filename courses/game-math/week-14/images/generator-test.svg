<text x="297.5" y="245" font-size="10" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">28–31</text>
<rect x="323" y="204.8" width="39" height="25.2" rx="2" fill="#2F9E44"/>
<text x="342.5" y="245" font-size="10" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">32–35</text>
