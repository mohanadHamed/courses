<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="310" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Quality criteria for a media package</text>
<rect x="20" y="50" width="640" height="40" rx="0" fill="#9C36B5"/>
<text x="30" y="74.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">criterion</text>
<text x="180" y="74.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">question</text>
<text x="440" y="74.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">evidence</text>
<text x="30" y="114.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">fits the gameplay</text>
<text x="180" y="114.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Does it show and sound like the level?</text>
<text x="440" y="114.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a gameplay shot next to the clip</text>
<rect x="20" y="130" width="640" height="40" rx="0" fill="#f8f9fa"/>
<text x="30" y="154.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">consistent</text>
<text x="180" y="154.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">One art style, one sound mood?</text>
<text x="440" y="154.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">panels, clip and sounds side by side</text>
<text x="30" y="194.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">technical</text>
<text x="180" y="194.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Levels, resolution, length right?</text>
<text x="440" y="194.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">export settings, peak meter</text>
<rect x="20" y="210" width="640" height="40" rx="0" fill="#f8f9fa"/>
<text x="30" y="234.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">clear</text>
<text x="180" y="234.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Is the message clear in 30 s?</text>
<text x="440" y="234.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a viewer&#x27;s one-sentence summary</text>
<text x="30" y="274.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">rights cleared</text>
<text x="180" y="274.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Every asset credited and allowed?</text>
<text x="440" y="274.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the credits file</text>
<rect x="20" y="50" width="640" height="240" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
