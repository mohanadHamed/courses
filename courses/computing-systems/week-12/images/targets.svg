<rect x="20" y="50" width="640" height="228" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="300" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">The same game sets different targets: the weakest device decides the low settings.</text>
