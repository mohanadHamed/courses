<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Mirror a sprite: a scale factor of −1</text>
<rect x="50" y="60" width="240" height="180" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
<line x1="170" y1="70" x2="170" y2="230" stroke="#adb5bd" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect x="152" y="140" width="36" height="60" rx="10" fill="#1c7ed6"/>
<circle cx="170" cy="120" r="20" fill="#f3c9a0"/>
<circle cx="178" cy="116" r="3.5" fill="#2a2f2c"/>
<polygon points="188,160 220,166 188,172" fill="#e8590c"/>
<line x1="200" y1="90" x2="241" y2="90" stroke="#e8590c" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="250,90 240,95 240,85" fill="#e8590c"/>
<circle cx="170" cy="200" r="5" fill="#c92a2a"/>
<text x="170" y="262" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">scale (1, 1): looks right</text>
<text x="178" y="218" font-size="11" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">pivot</text>
<rect x="380" y="60" width="240" height="180" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
<line x1="500" y1="70" x2="500" y2="230" stroke="#adb5bd" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect x="482" y="140" width="36" height="60" rx="10" fill="#1c7ed6"/>
<circle cx="500" cy="120" r="20" fill="#f3c9a0"/>
<circle cx="492" cy="116" r="3.5" fill="#2a2f2c"/>
<polygon points="482,160 450,166 482,172" fill="#e8590c"/>
<line x1="470" y1="90" x2="429" y2="90" stroke="#e8590c" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="420,90 430,85 430,95" fill="#e8590c"/>
<circle cx="500" cy="200" r="5" fill="#c92a2a"/>
<text x="500" y="262" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">scale (−1, 1): looks left</text>
<text x="508" y="218" font-size="11" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">pivot</text>
<text x="340" y="290" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">The pivot at the feet stays; x becomes −x around it.</text>
</svg>
