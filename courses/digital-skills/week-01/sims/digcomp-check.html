<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: DigComp self-check</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim details { border: 1.5px solid #ffe0c2; border-radius: 12px; margin: 8px 0; background: #fff; }
    .sim summary { cursor: pointer; padding: 8px 12px; font-weight: 800; display: flex; justify-content: space-between; gap: 10px; }
    .sim summary .avg { color: var(--sim-accent); font-variant-numeric: tabular-nums; }
    .sim .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 12px; border-top: 1px dashed #ffe0c2; font-size: .92rem; }
    .sim select { font: inherit; padding: 3px 6px; border-radius: 8px; border: 1.5px solid #ffc078; }
    .sim .profile { display: grid; gap: 6px; margin-top: 12px; }
    .sim .bar { display: grid; grid-template-columns: 9.5em 1fr 6.5em; gap: 8px; align-items: center; font-size: .85rem; font-weight: 700; }
    .sim .bar i { display: block; height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--sim-accent2), var(--sim-accent)); }
    .sim .track { background: #fff4e6; border-radius: 7px; }
    .sim .legend { font-size: .8rem; color: var(--sim-muted); margin-top: 6px; }
  </style>
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>DigComp self-check</h1>
  <p class="hint">For each skill, choose the level that is true for you. Your answers stay in this browser only.</p>
  <div id="areas"></div>
  <h1 style="margin-top:14px">Your profile</h1>
  <div class="profile" id="profile"></div>
  <p class="legend">Levels: 1–2 foundation · 3–4 intermediate · 5–6 advanced · 7–8 highly specialised. Your lowest area is your first learning goal.</p>
  <div class="controls">
    <button id="print" type="button" class="ghost">Print or save as PDF</button>
    <button id="reset" type="button" class="ghost">Clear my answers</button>
  </div>
</main>
<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  // Old (official) names: answers saved before the plain-English version are
  // still found under them.
  const OLD = {};
  const AREAS = [
    ["1 Information and data literacy", ["1.1 Browsing, searching and filtering data", "1.2 Evaluating data, information and content", "1.3 Managing data, information and content"]],
    ["2 Communication and collaboration", ["2.1 Interacting through digital technologies", "2.2 Sharing through digital technologies", "2.3 Engaging in citizenship online", "2.4 Collaborating through digital technologies", "2.5 Netiquette", "2.6 Managing digital identity"]],
    ["3 Digital content creation", ["3.1 Developing digital content", "3.2 Integrating and re-elaborating content", "3.3 Copyright and licences", "3.4 Programming"]],
    ["4 Safety", ["4.1 Protecting devices", "4.2 Protecting personal data and privacy", "4.3 Protecting health and well-being", "4.4 Protecting the environment"]],
    ["5 Problem solving", ["5.1 Solving technical problems", "5.2 Identifying needs and technological responses", "5.3 Creatively using digital technologies", "5.4 Identifying digital competence gaps"]],
  ];
  const PLAIN = {
    "1.1": "I search the web and find what I need.", "1.2": "I check if information is true.", "1.3": "I keep my files and information in order.",
    "2.1": "I send messages and make calls online.", "2.2": "I share files and links.", "2.3": "I use online public services (forms, payments).",
    "2.4": "I work with others in shared files.", "2.5": "I write politely online.", "2.6": "I take care of my online image.",
    "3.1": "I make documents, slides and pictures.", "3.2": "I edit and combine content.", "3.3": "I use only content that I am allowed to use.",
    "3.4": "I give simple instructions to a computer (simple programs).",
    "4.1": "I protect my devices (screen lock, updates).", "4.2": "I protect my personal data.", "4.3": "I protect my health (screen time, breaks).",
    "4.4": "I think about nature (old devices, energy).",
    "5.1": "I fix small technical problems.", "5.2": "I choose the right app for a task.", "5.3": "I use apps to make new things.",
    "5.4": "I know what I must still learn." };
  AREAS.forEach(([, comps], ai) => comps.forEach((c, k) => { const id = c.split(" ")[0]; OLD[id] = c; comps[k] = id + " " + PLAIN[id]; }));

  const LEVELS = ["— choose —", "1 · simple tasks, with help", "2 · simple tasks, a little help", "3 · normal tasks, alone", "4 · normal and new tasks, alone", "5 · many tasks, I help others", "6 · hard tasks, I help others", "7 · I solve hard problems", "8 · I find new ways and lead others"];
  const KEY = "digcomp-self-check";
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (_) { data = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (_) {} };
  const band = (v) => (v < 2.5 ? "foundation" : v < 4.5 ? "intermediate" : v < 6.5 ? "advanced" : "highly specialised");
  const root = document.getElementById("areas");
  AREAS.forEach(([area, comps], ai) => {
    const d = document.createElement("details"); if (ai === 0) d.open = true;
    d.innerHTML = `<summary><span>${area}</span><span class="avg" id="avg${ai}">—</span></summary>`;
    comps.forEach((c) => {
      const row = document.createElement("div"); row.className = "row";
      const sel = document.createElement("select"); sel.setAttribute("aria-label", c);
      LEVELS.forEach((l, i) => { const o = document.createElement("option"); o.value = i; o.textContent = l; sel.appendChild(o); });
      const id = c.split(" ")[0];
      if (data[id] === undefined && data[OLD[id]]) data[id] = data[OLD[id]];
      sel.value = data[id] || 0;
      sel.addEventListener("change", () => { data[id] = Number(sel.value); save(); update(); });
      row.innerHTML = `<span>${c}</span>`; row.appendChild(sel); d.appendChild(row);
    });
    root.appendChild(d);
  });
  function update() {
    const prof = document.getElementById("profile"); prof.innerHTML = "";
    let low = null;
    AREAS.forEach(([area, comps], ai) => {
      const vals = comps.map((c) => data[c.split(" ")[0]] || 0).filter((v) => v > 0);
      const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
      document.getElementById("avg" + ai).textContent = vals.length ? `${avg.toFixed(1)} · ${band(avg)}` : `${vals.length}/${comps.length} rated`;
      const b = document.createElement("div"); b.className = "bar";
      b.innerHTML = `<span>${area.replace(/^\d /, "")}</span><span class="track"><i style="width:${(avg / 8) * 100}%"></i></span><span>${vals.length ? avg.toFixed(1) + " · " + band(avg) : "not rated"}</span>`;
      prof.appendChild(b);
      if (vals.length && (!low || avg < low[1])) low = [area, avg];
    });
    if (low) { const p = document.createElement("p"); p.className = "message good"; p.textContent = `First learning goal: ${low[0].replace(/^\d /, "")}.`; prof.appendChild(p); }
  }
  document.getElementById("print").addEventListener("click", () => window.print());
  document.getElementById("reset").addEventListener("click", () => { data = {}; save(); document.querySelectorAll("select").forEach((s) => (s.value = 0)); update(); });
  update();
})();
</script>
</body>
</html>
