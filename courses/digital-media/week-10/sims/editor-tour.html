<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Editor Tour</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Editor Tour</h1>
  <p class="hint">It is the first day of a new trainee in the video room of Night Owl Games. For each job, show the trainee the right panel or tool of the video editor.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { spot: "pool", goal: "“Where are the clips I just imported?”", answer: "the Media Pool", choices: C(["the Media Pool", "the Inspector", "the Timeline", "the Deliver page"]),
      good: "Imported clips, sounds and pictures wait in the Media Pool until you use them." },
    { spot: "time", goal: "“How do I put the clips in order?”", answer: "drag them onto the Timeline", choices: C(["drag them onto the Timeline", "rename the files", "open the Inspector", "export them one by one"]),
      good: "The timeline holds the clips in order, from left (start) to right (end)." },
    { spot: "time", goal: "“I need to cut the boat clip at 0:12.”", answer: "playhead to 0:12, then Split (Blade)", choices: C(["playhead to 0:12, then Split (Blade)", "Delete the whole clip", "change the frame rate", "lower the volume"]),
      good: "Move the playhead, then split: Blade tool (B) or Timeline › Razor (Ctrl+B)." },
    { spot: "v2", goal: "“The title must stay visible over the gameplay.”", answer: "put the title on V2, above V1", choices: C(["put the title on V2, above V1", "put the title on A1", "put the title after the last clip", "make the gameplay 50 % opaque"]),
      good: "Higher video tracks cover the lower ones: V2 over V1." },
    { spot: "insp", goal: "“The title is too big. Where do I change its size?”", answer: "the Inspector", choices: C(["the Inspector", "the Media Pool", "the Deliver page", "the project settings"]),
      good: "The Inspector shows the settings of the selected clip: zoom, position, opacity, volume." },
    { spot: "time", goal: "“Remove the boring middle and leave no black gap.”", answer: "Delete with ripple", choices: C(["Delete with ripple", "Delete and leave the gap", "trim the music", "add a transition"]),
      good: "A ripple delete removes the part and moves the later clips left." },
    { spot: "out", goal: "“Now we need an MP4 for the store page.”", answer: "the Deliver (export) page: MP4, H.264", choices: C(["the Deliver (export) page: MP4, H.264", "File › Save Project", "copy the timeline", "the Media Pool"]),
      good: "Saving the project keeps the edit; only an export makes a video file for players." },
  ];
  const AREAS = { pool: [0.02, 0.06, 0.24, 0.46], view: [0.28, 0.06, 0.44, 0.46], insp: [0.74, 0.06, 0.24, 0.46], time: [0.02, 0.56, 0.96, 0.4], v2: [0.08, 0.6, 0.9, 0.1], out: [0.74, 0.06, 0.24, 0.46] };
  Kit.game({
    rounds, cols: 2, colsPhone: 1, animMs: 700, still: true,
    intro: "Round 1 is the story of the lesson: the trainee imports the gameplay clips.",
    canvas: (W) => Math.min(230, W * 0.44),
    draw(c, W, H, now, r, st) {
      c.fillStyle = "#2b2a33"; c.fillRect(0, 0, W, H);
      const box = (k, label) => { const [x, y, w, h] = AREAS[k]; Kit.rrect(c, x * W, y * H, w * W, h * H, 6, "#3b3a45"); Kit.text(c, label, x * W + 8, y * H + 16, 11.5, "#ffd43b", "left"); };
      box("pool", "Media Pool"); box("view", "Viewer"); box(r && r.spot === "out" ? "out" : "insp", r && r.spot === "out" ? "Deliver" : "Inspector"); box("time", "Timeline");
      const [tx, ty, tw, th] = AREAS.time;
      [["V2", "#9c36b5", 0.15, 0.2], ["V1", "#1c7ed6", 0.05, 0.85], ["A1", "#2b8a3e", 0.05, 0.85]].forEach(([n, col, a, b], i) => {
        const y = (ty + 0.1 + i * 0.1) * H; Kit.text(c, n, tx * W + 10, y + 12, 10, "#e9ecef", "left");
        c.fillStyle = col; c.fillRect((tx + 0.06 + a * 0.9) * W, y, b * 0.9 * W * (n === "V2" ? 0.3 : 1), H * 0.07);
      });
      if (r && st.done && st.ok) { const [x, y, w, h] = AREAS[r.spot]; Kit.rrect(c, x * W - 2, y * H - 2, w * W + 4, h * H + 4, 8, null, "#69db7c", 4); }
    },
  });
})();
</script>
</body>
</html>
