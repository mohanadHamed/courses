<rect x="190" y="200" width="140" height="22" rx="6" fill="#f1f3f5"/>
<rect x="190" y="200" width="28" height="22" rx="6" fill="#e8590c"/>
<text x="260" y="242" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">more players</text>
<rect x="350" y="200" width="140" height="22" rx="6" fill="#f1f3f5"/>
<rect x="350" y="200" width="70" height="22" rx="6" fill="#A86700"/>
<text x="420" y="242" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">most players</text>
