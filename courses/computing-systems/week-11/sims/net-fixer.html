<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Net Fixer</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Net Fixer</h1>
  <p class="hint">Byte Bay moves into a new office. Help Rami set up the network for testing <i>Pocket Quest</i>: the right device, address or protocol for each job.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  // The places in the picture: pc, sw (switch), ap (access point), ph (phones), rt (router), net (Internet), srv (server), dns.
  const rounds = [
    { spot: "sw", goal: "Four PCs need cables to each other. Which device joins them?", answer: "a switch", choices: C(["a switch", "a router", "an access point", "a DNS server"]),
      good: "A switch connects the wired devices of one LAN.", why: { "a router": "A router connects networks, for example the LAN to the Internet." } },
    { spot: "ap", goal: "The test phones P5 and P8 need Wi-Fi. Which device gives it?", answer: "an access point", choices: C(["an access point", "a switch", "a printer", "a DNS server"]),
      good: "A wireless access point connects Wi-Fi devices to the wired LAN." },
    { spot: "rt", goal: "The LAN must reach the Internet through the ISP. Which device?", answer: "a router", choices: C(["a router", "a switch", "an access point", "a hard disk"]),
      good: "The router connects the LAN to the ISP and sends packets towards their destination.", why: { "a switch": "A switch stays inside the LAN." } },
    { spot: "dns", goal: "The phone knows only the name play.example.net. What finds its IP address?", answer: "the DNS", choices: C(["the DNS", "the access point", "UDP", "the switch"]),
      good: "The DNS turns names into IP addresses, such as 198.51.100.7." },
    { spot: "pc", goal: "Which IP address can a PC have inside the office LAN?", answer: "192.168.1.23", choices: C(["192.168.1.23", "play.example.net", "198.51.100.7", "300.1.2.3"]),
      good: "192.168.x.x is a private range used inside LANs.", why: { "198.51.100.7": "That is the public address of the game server on the Internet.", "play.example.net": "That is a name; the DNS turns it into an address.", "300.1.2.3": "Each number of an address is 0–255." } },
    { spot: "srv", goal: "In a live match, the phone sends its position 30 times per second. Which protocol?", answer: "UDP", choices: C(["UDP", "TCP", "DNS", "Wi-Fi"]),
      good: "UDP: fast; a lost position is replaced by the next one.", why: { "TCP": "TCP would wait for lost old positions: the game would lag." } },
    { spot: "srv", goal: "A player buys 100 gems. Which protocol carries the purchase?", answer: "TCP (HTTPS)", choices: C(["TCP (HTTPS)", "UDP", "Wi-Fi", "the switch"]),
      good: "A purchase must arrive completely and safely: HTTPS over TCP.", why: { "UDP": "With UDP a lost packet would be lost money." } },
  ];
  const POS = { pc: [0.1, 0.25], sw: [0.27, 0.55], ap: [0.27, 0.85], ph: [0.45, 0.85], rt: [0.5, 0.55], net: [0.72, 0.5], srv: [0.9, 0.8], dns: [0.9, 0.22] };
  const NAME = { pc: "PCs", sw: "switch", ap: "access point", ph: "P5 · P8", rt: "router", net: "Internet", srv: "game server", dns: "DNS" };
  const EDGES = [["pc", "sw"], ["sw", "ap"], ["ap", "ph"], ["sw", "rt"], ["rt", "net"], ["net", "srv"], ["net", "dns"]];
  Kit.game({
    rounds, cols: 2, colsPhone: 1, animMs: 700, still: true,
    intro: "Round 1 is the story of the lesson: the office LAN of Byte Bay.",
    canvas: (W) => Math.min(220, W * 0.42),
    draw(c, W, H, now, r, st) {
      const P = (k) => [POS[k][0] * W, POS[k][1] * H];
      c.fillStyle = "#fffbeb"; c.fillRect(0, 0, W, H);
      c.strokeStyle = "#A86700"; c.setLineDash([6, 5]); c.lineWidth = 1.5; Kit.rrect(c, 4, 4, W * 0.58, H - 8, 10, null, "#A86700", 1.5); c.setLineDash([]);
      Kit.text(c, "LAN", 24, 20, 11, "#A86700");
      c.strokeStyle = "#adb5bd"; c.lineWidth = 3;
      EDGES.forEach(([a, b]) => { const [x1, y1] = P(a), [x2, y2] = P(b); c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); });
      Object.keys(POS).forEach((k) => {
        const [x, y] = P(k), hot = r && r.spot === k, solved = hot && st.done && st.ok;
        const w = Math.min(96, W * 0.17), h = 30;
        Kit.rrect(c, x - w / 2, y - h / 2, w, h, 8, hot ? (solved ? "#d3f9d8" : "#ffe066") : "#fff", hot ? "#e8590c" : "#A86700", hot ? 3 : 2);
        Kit.text(c, hot && !solved && ["sw", "ap", "rt", "dns"].includes(k) ? "?" : NAME[k], x, y + 4, Math.min(12, W / 50), "#2a2f2c");
      });
    },
  });
})();
</script>
</body>
</html>
