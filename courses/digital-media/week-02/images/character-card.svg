<text x="120.0" y="262.0" font-size="20" fill="#2a2f2c" text-anchor="middle" font-weight="800">Lina</text>
<text x="244.0" y="62.0" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700">role</text>
<text x="244.0" y="82.0" font-size="16" fill="#2a2f2c" text-anchor="start" font-weight="800">protagonist: a young kite maker</text>
<text x="244.0" y="108.0" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700">goal</text>
<text x="244.0" y="128.0" font-size="16" fill="#9C36B5" text-anchor="start" font-weight="800">bring the wind back to her village</text>
<text x="244.0" y="154.0" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700">weakness</text>
<text x="244.0" y="174.0" font-size="16" fill="#e8590c" text-anchor="start" font-weight="800">she is afraid of heights</text>
<text x="244.0" y="200.0" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700">antagonist</text>
<text x="244.0" y="220.0" font-size="16" fill="#c92a2a" text-anchor="start" font-weight="800">Captain Gale, a sky pirate with a jar of wind</text>
<text x="244.0" y="246.0" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700">change</text>
<text x="244.0" y="266.0" font-size="16" fill="#2b8a3e" text-anchor="start" font-weight="800">at the end, she climbs the highest tower</text>
</svg>
