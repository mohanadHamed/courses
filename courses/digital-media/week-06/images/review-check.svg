<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Review your board: the gameplay checklist</text>
<rect x="30" y="50" width="20" height="20" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<path d="M34 61 l5 6 l9 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="62" y="65" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Every beat of the list has a panel.</text>
<rect x="30" y="86" width="20" height="20" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<path d="M34 97 l5 6 l9 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="62" y="101" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Cutscene panels: shot sizes change with the purpose.</text>
<rect x="30" y="122" width="20" height="20" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<path d="M34 133 l5 6 l9 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="62" y="137" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Gameplay panels show the HUD and the player input.</text>
<rect x="30" y="158" width="20" height="20" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<path d="M34 169 l5 6 l9 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="62" y="173" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Success and fail are both drawn.</text>
<rect x="30" y="194" width="20" height="20" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<path d="M34 205 l5 6 l9 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="62" y="209" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Arrows show every movement; the screen direction stays.</text>
<rect x="30" y="230" width="20" height="20" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<path d="M34 241 l5 6 l9 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="62" y="245" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The animatic fits the time (here under 30 s).</text>
</svg>
