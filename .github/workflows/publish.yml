# Render the whole site (HTML + PDF via Typst + PPTX) and deploy to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Render and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Noto Sans (main PDF font) and Noto Naskh Arabic (glossary).
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core
          fc-list | grep -E "NotoSans-Regular|NotoNaskhArabic-Regular"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      # Homework and online-activity PDFs are printed from their pages with
      # Chrome (preinstalled on ubuntu-latest).
      - name: Check Chrome
        run: google-chrome --version

      # The homework and tasks PDFs are forms to type in: homework_pdf.py
      # turns their answer lines into form fields with pypdf.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pypdf
        run: python -m pip install "pypdf>=5,<7"

      - name: Render site
        run: quarto render

      - name: Check outputs
        run: |
          find _site -name "*.pdf" -o -name "*.pptx" | sort
          test -n "$(find _site -name '*.pdf')"
          test -n "$(find _site -name '*.pptx')"
          test -z "$(find _site -name 'lesson-*-book.pdf' -o -name 'lesson-*-sheet.pdf' -o -name 'lesson-*-slides.pptx' -o -name 'seminar-*-book.pdf' -o -name 'seminar-*-slides.pptx' -o -name 'practice-*-book.pdf' -o -name 'practice-*-slides.pptx' -o -name 'online-*.pdf')"
          if ls courses/*/week-*/homework-*.qmd >/dev/null 2>&1; then test -n "$(find _site -name '*_homework[0-9]*.pdf')"; fi
          if ls courses/*/week-*/lesson-*-sheet.qmd >/dev/null 2>&1; then test -n "$(find _site -name '*_lecture[0-9]*_sheet.pdf')"; fi
          if ls courses/*/week-*/seminar-*-book.qmd >/dev/null 2>&1; then test -n "$(find _site -name '*_seminar[0-9]*.pdf')"; fi
          if ls courses/*/week-*/practice-*-book.qmd >/dev/null 2>&1; then test -n "$(find _site -name '*_practice[0-9]*.pdf')"; fi
          if ls courses/*/week-*/online-*.qmd >/dev/null 2>&1; then test -n "$(find _site -name '*_online[0-9]*_tasks.pdf')"; fi
          # Every homework and tasks PDF has form fields (at least the name and the student number).
          python -c "import glob, sys; from pypdf import PdfReader; p = sorted(glob.glob('_site/courses/*/week-*/*_tasks.pdf') + glob.glob('_site/courses/*/week-*/*_homework[0-9]*.pdf')); bad = [f for f in p if not PdfReader(f).get_fields()]; print(len(p), 'fillable PDFs'); sys.exit('no form fields: ' + ', '.join(bad) if bad else 0)"
          # Course videos of the online activities: the video, its captions and its poster.
          for v in courses/*/week-*/videos/*.mp4; do [ -e "$v" ] || continue; for x in mp4 vtt png; do test -f "_site/${v%.mp4}.$x"; done; done

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
