<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">TCP or UDP: reliable or fast</text>
<rect x="20" y="52" width="310" height="180" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="34" y="76" font-size="14.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">TCP: every packet, in order</text>
<rect x="40" y="104" width="42" height="28" rx="4" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.6"/>
<text x="61" y="123" font-size="12.5" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<rect x="92" y="104" width="42" height="28" rx="4" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.6"/>
<text x="113" y="123" font-size="12.5" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<rect x="144" y="104" width="42" height="28" rx="4" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.6"/>
<text x="165" y="123" font-size="12.5" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<rect x="196" y="104" width="42" height="28" rx="4" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.6"/>
<text x="217" y="123" font-size="12.5" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<rect x="248" y="104" width="42" height="28" rx="4" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.6"/>
<text x="269" y="123" font-size="12.5" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">5</text>
<text x="40" y="156" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">packet 3 lost → sent again</text>
<text x="40" y="188" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">For: login, purchases, chat, downloads,</text>
<text x="40" y="204.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">saving the game.</text>
<rect x="350" y="52" width="310" height="180" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.8"/>
<text x="364" y="76" font-size="14.5" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">UDP: fast, no waiting</text>
<rect x="370" y="104" width="42" height="28" rx="4" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="391" y="123" font-size="12.5" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<rect x="422" y="104" width="42" height="28" rx="4" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="443" y="123" font-size="12.5" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<rect x="474" y="104" width="42" height="28" rx="4" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="495" y="123" font-size="12.5" fill="#868e96" text-anchor="middle" font-weight="800" xml:space="preserve">×</text>
<rect x="526" y="104" width="42" height="28" rx="4" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="547" y="123" font-size="12.5" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<rect x="578" y="104" width="42" height="28" rx="4" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="599" y="123" font-size="12.5" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">5</text>
<text x="370" y="156" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">packet 3 lost → skipped; 4 is newer</text>
<text x="370" y="188" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">For: player positions in a live match, voice</text>
<text x="370" y="204.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">chat, video streams.</text>
</svg>
