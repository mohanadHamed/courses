<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Crystal Spells</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Crystal Spells</h1>
  <p class="hint">Every spell is a 2 × 2 matrix. Casting a spell multiplies the position of the crystal by the matrix. <b>Grow</b> = rows (2, 0), (0, 2) · <b>Shrink</b> = rows (0.5, 0), (0, 0.5) · <b>Turn</b> = rows (0, −1), (1, 0) · <b>Flip</b> = rows (−1, 0), (0, 1) · <b>Stay</b> = the identity.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const S = { Grow: [[2, 0], [0, 2]], Shrink: [[0.5, 0], [0, 0.5]], Turn: [[0, -1], [1, 0]], Flip: [[-1, 0], [0, 1]], Stay: [[1, 0], [0, 1]] };
  const mul = (a, p) => [a[0][0] * p[0] + a[0][1] * p[1], a[1][0] * p[0] + a[1][1] * p[1]];
  const f = (v) => Kit.fmt(v, 1), pt = (p) => `(${f(p[0])}, ${f(p[1])})`;
  const spells = (list) => list.map((k) => ({ k, label: k }));
  const points = (list) => list.map((p) => ({ k: pt(p), label: pt(p), p }));
  const rounds = [
    { kind: "where", from: [2, 1], cast: ["Grow"], goal: "The crystal is at <b>(2, 1)</b>. You cast <b>Grow</b>. Where does it land?",
      choices: points([[4, 2], [2, 1], [4, 1], [3, 3]]), answer: "(4, 2)", good: "Grow × (2, 1) = (2 × 2, 2 × 1) = (4, 2)." },
    { kind: "spell", from: [2, 1], target: [-1, 2], goal: "Move the crystal from <b>(2, 1)</b> to the gate at <b>(−1, 2)</b>. Which spell?",
      choices: spells(["Grow", "Turn", "Flip", "Stay"]), answer: "Turn", good: "Turn: row 1 gives 0 × 2 + (−1) × 1 = −1, row 2 gives 1 × 2 + 0 × 1 = 2." },
    { kind: "spell", from: [3, -2], target: [3, -2], goal: "A trap: the crystal at <b>(3, −2)</b> must not move. Which spell is safe?",
      choices: spells(["Flip", "Stay", "Turn", "Grow"]), answer: "Stay", good: "Stay is the identity matrix: I × (3, −2) = (3, −2)." },
    { kind: "spell", from: [4, 2], target: [2, 1], goal: "Grow was cast by mistake: the crystal is at <b>(4, 2)</b>. Which spell undoes it?",
      choices: spells(["Shrink", "Grow", "Flip", "Turn"]), answer: "Shrink", good: "Shrink is the inverse of Grow: 0.5 × (4, 2) = (2, 1). Grow × Shrink = I." },
    { kind: "where", from: [2, 1], cast: ["Flip", "Turn"], goal: "From <b>(2, 1)</b>: first <b>Flip</b>, then <b>Turn</b>. Where does the crystal land?",
      choices: points([[-1, -2], [1, 2], [-2, 1], [2, -1]]), answer: "(−1, −2)", good: "Flip gives (−2, 1); Turn gives (−1, −2). Turn first, then Flip, would give (1, 2): the order matters." },
  ];
  const at = (r, k) => {
    if (r.kind === "spell") return mul(S[k], r.from);
    const c = r.choices.find((x) => x.k === k); return c ? c.p : r.from;
  };
  function diamond(c, x, y, s, col) {
    c.fillStyle = col; c.beginPath(); c.moveTo(x, y - s); c.lineTo(x + s * 0.7, y); c.lineTo(x, y + s); c.lineTo(x - s * 0.7, y); c.closePath(); c.fill();
    c.strokeStyle = "#fff"; c.lineWidth = 1.5; c.stroke();
  }
  Kit.game({
    rounds, cols: 4, colsPhone: 2, animMs: 1100,
    intro: "Round 1 is the story of the lesson: the crystal at (2, 1) and the spell Grow.",
    calc: (k, r) => r.kind === "spell" ? `${k} × ${pt(r.from)} = ${pt(mul(S[k], r.from))}` : "",
    canvas: (W) => Math.min(330, W * 0.7),
    draw(c, W, H, now, r, st) {
      const G = Kit.grid(c, W, H, -5, 5, -4, 4, { bg: "#f3f0ff", grid: "#e5dbff", axis: "#b197fc" });
      if (!r) return;
      if (r.target) { c.strokeStyle = "#e8590c"; c.lineWidth = 3; c.beginPath(); c.arc(G.X(r.target[0]), G.Y(r.target[1]), 15, 0, 7); c.stroke(); Kit.text(c, "gate", G.X(r.target[0]), G.Y(r.target[1]) - 20, 12, "#e8590c"); }
      let p = r.from;
      if (st.pick) {
        const to = at(r, st.pick), k = st.done ? 1 : Math.max(0, Math.min((now - st.t0) / 1000, 1));
        p = [r.from[0] + (to[0] - r.from[0]) * k, r.from[1] + (to[1] - r.from[1]) * k];
        c.setLineDash([5, 5]); c.strokeStyle = "#7048e8"; c.lineWidth = 2; c.beginPath(); c.moveTo(G.X(r.from[0]), G.Y(r.from[1])); c.lineTo(G.X(p[0]), G.Y(p[1])); c.stroke(); c.setLineDash([]);
        diamond(c, G.X(r.from[0]), G.Y(r.from[1]), 9, "rgba(112,72,232,0.3)");
      }
      diamond(c, G.X(p[0]), G.Y(p[1]), 13, "#7048e8");
    },
  });
})();
</script>
</body>
</html>
