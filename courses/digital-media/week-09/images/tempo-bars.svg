<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="270" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Tempo and bars: how long is a loop?</text>
<rect x="40" y="70" width="64" height="50" rx="8" fill="#9C36B5" stroke="#9C36B5" stroke-width="1.6"/>
<text x="72" y="101" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<rect x="110" y="70" width="64" height="50" rx="8" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="142" y="101" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<rect x="180" y="70" width="64" height="50" rx="8" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="212" y="101" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<rect x="250" y="70" width="64" height="50" rx="8" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="282" y="101" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<text x="176" y="142" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">bar 1</text>
<rect x="320" y="70" width="64" height="50" rx="8" fill="#9C36B5" stroke="#9C36B5" stroke-width="1.6"/>
<text x="352" y="101" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<rect x="390" y="70" width="64" height="50" rx="8" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="422" y="101" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<rect x="460" y="70" width="64" height="50" rx="8" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="492" y="101" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<rect x="530" y="70" width="64" height="50" rx="8" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="562" y="101" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<text x="456" y="142" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">bar 2</text>
<text x="40" y="186" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">At 120 BPM: one beat = 60 ÷ 120 = 0.5 s; one bar (4 beats) = 2 s.</text>
<text x="40" y="214" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">A loop of 8 bars = 16 s. At 100 BPM: one bar = 2.4 s, 8 bars = 19.2 s.</text>
<text x="40" y="244" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">A loop is always a whole number of bars, so the beat never stumbles.</text>
</svg>
