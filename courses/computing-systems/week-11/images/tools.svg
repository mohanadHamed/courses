<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Three network tools and the question each one answers</text>
<rect x="20" y="60" width="200" height="136" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<rect x="32" y="74" width="176" height="30" rx="6" fill="#1e1e2e"/>
<text x="120.0" y="94" font-size="12.5" fill="#ffd43b" text-anchor="middle" font-weight="700" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">ipconfig</text>
<text x="120.0" y="130.0" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">What is my address</text>
<text x="120.0" y="145.6" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">and my gateway?</text>
<rect x="240" y="60" width="200" height="136" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<rect x="252" y="74" width="176" height="30" rx="6" fill="#1e1e2e"/>
<text x="340.0" y="94" font-size="12.5" fill="#ffd43b" text-anchor="middle" font-weight="700" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">ping</text>
<text x="340.0" y="130.0" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Can I reach it?</text>
<text x="340.0" y="145.6" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">How fast?</text>
<text x="340.0" y="161.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Are packets lost?</text>
<rect x="460" y="60" width="200" height="136" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<rect x="472" y="74" width="176" height="30" rx="6" fill="#1e1e2e"/>
<text x="560.0" y="94" font-size="12.5" fill="#ffd43b" text-anchor="middle" font-weight="700" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">speed test</text>
<text x="560.0" y="130.0" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">How much bandwidth</text>
<text x="560.0" y="145.6" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">do I have?</text>
<text x="340" y="228" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Windows: open Command Prompt (cmd). A speed test is a website or an app.</text>
</svg>
