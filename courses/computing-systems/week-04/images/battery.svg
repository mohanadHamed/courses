<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<rect x="10" y="10" width="660" height="310" rx="18" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
<text x="34" y="46" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Battery and heat during a game</text>
<rect x="44" y="90" width="150" height="70" rx="10" fill="#fff" stroke="#2a2f2c" stroke-width="3"/>
<rect x="194" y="112" width="10" height="26" rx="3" fill="#2a2f2c" stroke="none" stroke-width="1.5"/>
<rect x="52" y="98" width="134" height="54" rx="6" fill="#2b8a3e" stroke="none" stroke-width="1.5"/>
<text x="119" y="132" font-size="16" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">5000 mAh</text>
<text x="44" y="190" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The game draws 1000 mA.</text>
<text x="44" y="212" font-size="13.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">5000 mAh ÷ 1000 mA = 5 hours</text>
<text x="44" y="244" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">The screen, the CPU and GPU</text>
<text x="44" y="262" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">work, GPS and mobile data</text>
<text x="44" y="280" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">all use power.</text>
<line x1="330" y1="260" x2="630" y2="260" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
<line x1="330" y1="90" x2="330" y2="260" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
<line x1="330" y1="187.1" x2="630" y2="187.1" stroke="#e4e8e5" stroke-width="1" stroke-linecap="round"/>
<text x="324" y="191.1" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">30</text>
<line x1="330" y1="150.7" x2="630" y2="150.7" stroke="#e4e8e5" stroke-width="1" stroke-linecap="round"/>
<text x="324" y="154.7" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">45</text>
<line x1="330" y1="114.3" x2="630" y2="114.3" stroke="#e4e8e5" stroke-width="1" stroke-linecap="round"/>
<text x="324" y="118.3" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">60</text>
<text x="330" y="276" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">0 min</text>
<text x="430" y="276" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">10 min</text>
<text x="530" y="276" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">20 min</text>
<text x="630" y="276" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">30 min</text>
<path d="M330.0 114.3 L510.0 114.3 L540.0 148.3 L630.0 150.7" fill="none" stroke="#c92a2a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="334" y="82" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">frames per second</text>
<text x="500" y="104.3" font-size="12" fill="#c92a2a" text-anchor="end" font-weight="800" xml:space="preserve">hot: the SoC slows down</text>
<text x="620" y="172.7" font-size="12" fill="#c92a2a" text-anchor="end" font-weight="800" xml:space="preserve">thermal throttling: 45 fps</text>
</svg>
