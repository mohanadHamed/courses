<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">What changes in a port?</text>
<rect x="20" y="52" width="310" height="66" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<circle cx="46" cy="85" r="13" fill="#A86700"/>
<text x="46" y="90" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<text x="70" y="80" font-size="13.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">controls</text>
<text x="70" y="101" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">touch → controller or keyboard</text>
<rect x="350" y="52" width="310" height="66" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<circle cx="376" cy="85" r="13" fill="#A86700"/>
<text x="376" y="90" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<text x="400" y="80" font-size="13.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">menus and text</text>
<text x="400" y="101" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">TV distance, mouse, safe area</text>
<rect x="20" y="130" width="310" height="66" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<circle cx="46" cy="163" r="13" fill="#A86700"/>
<text x="46" y="168" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<text x="70" y="158" font-size="13.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">graphics settings</text>
<text x="70" y="179" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">low / medium / high for many PCs</text>
<rect x="350" y="130" width="310" height="66" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<circle cx="376" cy="163" r="13" fill="#A86700"/>
<text x="376" y="168" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<text x="400" y="158" font-size="13.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">accounts and saves</text>
<text x="400" y="179" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">cross-save with one account</text>
<rect x="20" y="208" width="310" height="66" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<circle cx="46" cy="241" r="13" fill="#A86700"/>
<text x="46" y="246" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">5</text>
<text x="70" y="236" font-size="13.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">store rules</text>
<text x="70" y="257" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">certification, age rating, fees</text>
<rect x="350" y="208" width="310" height="66" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<circle cx="376" cy="241" r="13" fill="#A86700"/>
<text x="376" y="246" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">6</text>
<text x="400" y="236" font-size="13.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">testing</text>
<text x="400" y="257" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">weakest device, controller unplugged</text>
</svg>
