<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="220" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">From all rights reserved to the public domain</text>
<rect x="40" y="96" width="150" height="28" rx="0" fill="#c92a2a"/>
<rect x="190" y="96" width="150" height="28" rx="0" fill="#e8590c"/>
<rect x="340" y="96" width="150" height="28" rx="0" fill="#f59f00"/>
<rect x="490" y="96" width="150" height="28" rx="0" fill="#2b8a3e"/>
<text x="115" y="115" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">all rights reserved</text>
<text x="265" y="115" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">a licence you pay for</text>
<text x="415" y="115" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Creative Commons</text>
<text x="565" y="115" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">public domain, CC0</text>
<text x="40" y="80" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">fewer freedoms for the user</text>
<text x="640" y="80" font-size="12" fill="#2b8a3e" text-anchor="end" font-weight="800" xml:space="preserve">more freedoms for the user</text>
<text x="115" y="150" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">ask the holder for</text>
<text x="115" y="165.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">permission</text>
<text x="265" y="150" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the licence lists what</text>
<text x="265" y="165.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">you may do</text>
<text x="415" y="150" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">standard conditions,</text>
<text x="415" y="165.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">such as credit</text>
<text x="565" y="150" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">use it freely (a credit</text>
<text x="565" y="165.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">is still kind)</text>
<text x="340" y="204" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">&quot;Found on the Internet&quot; is not on this line: without a licence, a work is all rights reserved.</text>
