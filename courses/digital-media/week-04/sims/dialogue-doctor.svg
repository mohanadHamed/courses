<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="440" fill="#ffffff"/>
<text x="16" y="30" font-size="19" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Dialogue Doctor</text>
<text x="16" y="52" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">Which line is better for the game? Then read why.</text>
<rect x="16" y="66" width="608" height="52" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.5"/>
<text x="30" y="97" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Pair 1 of 6 · Nour sees that the water is rising.</text>
<rect x="16" y="132" width="608" height="70" rx="12" fill="#fff" stroke="#dee2e6" stroke-width="1.5"/>
<text x="30" y="162" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">A  "Oh no, the water is rising, and this makes</text>
<text x="30" y="184" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">    me feel very worried."</text>
<rect x="16" y="214" width="608" height="52" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2.5"/>
<text x="30" y="246" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">B  "It's still rising. Row!"</text>
<text x="16" y="300" font-size="13" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Right: B. Short, and it pushes the action. The fear shows in the act.</text>
<text x="16" y="330" font-size="14" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Stars: 1</text>
</svg>
