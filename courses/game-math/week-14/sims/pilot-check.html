<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Pilot Check</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #ebfbee; border: 1.5px solid #2F9E44; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Pilot Check</h1>
  <p class="hint">Before the shuttle of <i>Star Dock</i> may fly, the test pilots check six numbers of its movement code. Choose the right result.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "Speed 5 units per second at 30 fps.", goal: "The step in one frame?", answer: "about 0.167 units", choices: C(["about 0.167 units", "5 units", "0.083 units", "150 units"]), good: "5 × 1/30 ≈ 0.167; after 30 frames: 5 units.", why: { "0.083 units": "That is the step at 60 fps." } },
    { card: "The player holds right and up: input (1, 1), speed 5.", goal: "The speed without normalizing?", answer: "about 7.07", choices: C(["about 7.07", "5", "10", "2.5"]), good: "|(5, 5)| = 5√2 ≈ 7.07: 41 % too fast. Normalize the input first." },
    { card: "The velocity is (3, 4). The sprite is drawn facing +x.", goal: "The rotation of the sprite?", answer: "about 53.1°", choices: C(["about 53.1°", "about 36.9°", "7°", "about 126.9°"]), good: "atan2(4, 3) ≈ 53.1°.", why: { "about 36.9°": "That is atan2(3, 4): the parts are swapped." } },
    { card: "The shuttle accelerates with a = 10 from rest; its max speed is 5.", goal: "When does it reach the max speed?", answer: "after 0.5 s", choices: C(["after 0.5 s", "after 2 s", "at once", "after 10 frames"]), good: "v = a × t: 10 × 0.5 = 5." },
    { card: "The drone hits the floor (n = (0, 1)) with v = (4, −3), e = 1.", goal: "The velocity after the bounce?", answer: "(4, 3)", choices: C(["(4, 3)", "(−4, 3)", "(−4, −3)", "(3, 4)"]), good: "v · n = −3; v' = (4, −3) − 2(−3)(0, 1) = (4, 3).", why: { "(−4, 3)": "Both parts turned: only the part along the normal turns." } },
    { card: "The sprite corner (1, 0) is scaled by 2, rotated by 90°, then moved by (5, 3).", goal: "Where is it in the world?", answer: "(5, 5)", choices: C(["(5, 5)", "(7, 3)", "(3, 5)", "(6, 3)"]), good: "(1, 0) → (2, 0) → (0, 2) → (5, 5).", why: { "(7, 3)": "The rotation is missing." } },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 1, animMs: 600, intro: "Round 1 is the first check of the lesson: one frame at 30 fps." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "The shuttle is cleared for flight." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
