<polygon points="278.3,184.1 268.7,186.8 270.2,178.3" fill="#2a2f2c" stroke="none" stroke-width="1.5"/>
<text x="278.3" y="212.1" font-size="13" fill="#2a2f2c" text-anchor="end" font-weight="800" xml:space="preserve">facing 350°</text>
<line x1="170" y1="165" x2="270.5" y2="147.3" stroke="#2F9E44" stroke-width="3" stroke-linecap="round"/>
<polygon points="278.3,145.9 270.2,151.7 268.7,143.2" fill="#2F9E44" stroke="none" stroke-width="1.5"/>
<text x="278.3" y="131.9" font-size="13" fill="#2F9E44" text-anchor="end" font-weight="800" xml:space="preserve">target 10°</text>
