<text x="198" y="275.6" font-size="12" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<text x="470" y="96" font-size="13.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Green: the start.</text>
<text x="470" y="120" font-size="13.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">Blue: R(60°) × each vertex.</text>
<text x="470" y="160" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Same side lengths,</text>
<text x="470" y="180" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">same angles.</text>
<text x="470" y="220" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">R(−60°) turns it back:</text>
<text x="470" y="240" font-size="15" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">R(−θ) = R(θ)⁻¹</text>
