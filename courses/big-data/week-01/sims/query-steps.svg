<text x="80" y="126" font-size="13" font-weight="400" fill="#3c4043" text-anchor="start">  COUNT(*) AS trips</text>
<text x="58" y="152" font-size="13" font-weight="400" fill="#a3a8ad" text-anchor="start">3</text>
<text x="80" y="152" font-size="13" font-weight="400" fill="#3c4043" text-anchor="start">FROM `bigquery-public-data.chicago_taxi_trips.taxi…</text>
