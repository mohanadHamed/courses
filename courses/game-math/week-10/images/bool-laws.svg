<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="360" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Laws of Boolean algebra</text>
<rect x="20" y="50" width="640" height="34" rx="0" fill="#2F9E44"/>
<text x="30" y="71.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">law</text>
<text x="310" y="71.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">AND form</text>
<text x="540" y="71.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">OR form</text>
<text x="30" y="105.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">identity</text>
<text x="310" y="105.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∧ T ≡ p</text>
<text x="540" y="105.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∨ F ≡ p</text>
<rect x="20" y="118" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="139.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">domination</text>
<text x="310" y="139.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∧ F ≡ F</text>
<text x="540" y="139.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∨ T ≡ T</text>
<text x="30" y="173.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">idempotent</text>
<text x="310" y="173.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∧ p ≡ p</text>
<text x="540" y="173.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∨ p ≡ p</text>
<rect x="20" y="186" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="207.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">complement</text>
<text x="310" y="207.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∧ ¬p ≡ F</text>
<text x="540" y="207.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∨ ¬p ≡ T</text>
<text x="30" y="241.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">double negation</text>
<text x="310" y="241.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">¬¬p ≡ p</text>
<text x="540" y="241.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve"></text>
<rect x="20" y="254" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="275.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">commutative</text>
<text x="310" y="275.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∧ q ≡ q ∧ p</text>
<text x="540" y="275.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∨ q ≡ q ∨ p</text>
<text x="30" y="309.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">distributive</text>
<text x="310" y="309.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r)</text>
<text x="540" y="309.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∨ (q ∧ r) ≡ (p ∨ q) ∧ (p ∨ r)</text>
<rect x="20" y="322" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="343.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">absorption</text>
<text x="310" y="343.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∧ (p ∨ q) ≡ p</text>
<text x="540" y="343.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p ∨ (p ∧ q) ≡ p</text>
<rect x="20" y="50" width="640" height="306" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
