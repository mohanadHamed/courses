<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Tutu Lab: AI corrects and adds to the report</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <link rel="stylesheet" href="../../../../shared/sims/office-lab.css">
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Tutu Lab: AI corrects and adds to the report</h1>
  <p class="hint">As on <b>tutudocs.com</b> (no sign-in): <b>open</b> the report, ask the <b>AI Assistant</b> for a change, then <b>download</b> it for Word. (Practice with fixed answers: no real AI here.)</p>
  <div id="tutu"></div>
  <div class="jobs"><b class="t">Steps</b> · <span id="progress"></span><ol id="jobs"></ol></div>
  <div class="row"><button id="reset" type="button" class="ghost">Start again</button></div>
  <p id="msg" class="message"></p>
</main>
<script src="../../../../shared/sims/sim-base.js"></script>
<script>
window.TUTU = {
  kind: "doc", file: "our-phones.docx",
  model: [
    { style: "Title", text: "Our Phones" },
    { style: "Heading 1", text: "Introduction" },
    { style: "Normal", text: "We askd 20 students about there phones." },
    { style: "Heading 1", text: "The answers" },
    { style: "Normal", text: "15 of the 20 students use their phone for study every day." },
  ],
  asks: [
    { text: "Fix the spelling mistakes.", keys: /spell|mistake|fix/i, done: "Done: askd is now asked, and there is now their.",
      apply: (m) => { m[2].text = "We asked 20 students about their phones."; return [2]; } },
    { text: "Add a one-sentence summary at the end.", keys: /summar|end|sentence/i, done: "Done: a one-sentence summary is at the end of the report.",
      apply: (m) => { m.push({ style: "Heading 1", text: "Summary" }, { style: "Normal", text: "Most students use their phone for study every day." }); return [m.length - 2, m.length - 1]; } },
  ],
};
</script>
<script src="../../../../shared/sims/tutu-lab.js"></script>
</body>
</html>
