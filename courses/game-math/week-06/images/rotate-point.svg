<line x1="30" y1="300" x2="330" y2="300" stroke="#e9ecef" stroke-width="1" stroke-linecap="butt"/>
<line x1="30" y1="250" x2="330" y2="250" stroke="#e9ecef" stroke-width="1" stroke-linecap="butt"/>
<line x1="30" y1="200" x2="330" y2="200" stroke="#e9ecef" stroke-width="1" stroke-linecap="butt"/>
<line x1="30" y1="150" x2="330" y2="150" stroke="#e9ecef" stroke-width="1" stroke-linecap="butt"/>
<line x1="30" y1="100" x2="330" y2="100" stroke="#e9ecef" stroke-width="1" stroke-linecap="butt"/>
<line x1="24" y1="300" x2="339.9" y2="300" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="348,300 339,304.5 339,295.5" fill="#adb5bd"/>
<line x1="80" y1="306" x2="80" y2="75.1" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="80,67 84.5,76 75.5,76" fill="#adb5bd"/>
<text x="352" y="304" font-size="13" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">x</text>
<text x="80" y="61" font-size="13" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">y</text>
<text x="30" y="316" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">−1</text>
<text x="130" y="316" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">1</text>
<text x="180" y="316" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">2</text>
<text x="230" y="316" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">3</text>
<text x="280" y="316" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">4</text>
<text x="330" y="316" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">5</text>
<text x="73" y="254" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">1</text>
<text x="73" y="204" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">2</text>
<text x="73" y="154" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">3</text>
<text x="73" y="104" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">4</text>
<text x="73" y="316" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">0</text>
<path d="M280 300 A200 200 0 0 0 253.2 200" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M120 300 A40 40 0 0 0 114.6 280" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="132" y="290" font-size="13" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">30°</text>
<line x1="80" y1="300" x2="270.9" y2="300" stroke="#2F9E44" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="280,300 269.8,305.1 269.8,294.9" fill="#2F9E44"/>
<line x1="80" y1="300" x2="245.3" y2="204.6" stroke="#1c7ed6" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="253.2,200 246.9,209.5 241.9,200.7" fill="#1c7ed6"/>
<circle cx="280" cy="300" r="5" fill="#2F9E44"/>
<text x="280" y="288" font-size="12.5" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">P (4, 0)</text>
<circle cx="253.2" cy="200" r="5" fill="#1c7ed6"/>
<text x="261.2" y="192" font-size="12.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">P&#x27; (3.46, 2)</text>
<text x="400" y="90" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">x&#x27; = x cos θ − y sin θ</text>
<text x="400" y="118" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">y&#x27; = x sin θ + y cos θ</text>
<text x="400" y="160" font-size="13.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">θ = 30°, P = (4, 0):</text>
<text x="400" y="184" font-size="13.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">x&#x27; = 4 × 0.87 − 0 = 3.46</text>
<text x="400" y="208" font-size="13.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">y&#x27; = 4 × 0.5 + 0 = 2</text>
<text x="400" y="246" font-size="13" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">The distance from the origin stays 4.</text>
</svg>
