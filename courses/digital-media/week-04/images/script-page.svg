<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="700" height="430" fill="#ffffff"/>
<text x="350" y="34" font-size="17" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">One page of a screenplay</text>
<rect x="170" y="52" width="360" height="360" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
<text x="190" y="84" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">EXT. FLOODED STREET – DUSK</text>
<line x1="160" y1="80" x2="182" y2="80" stroke="#9C36B5" stroke-width="2" stroke-linecap="round"/>
<rect x="54.2" y="70" width="101.8" height="20" rx="10" fill="#9C36B5" stroke="none" stroke-width="1.5"/>
<text x="105.1" y="85" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">scene heading</text>
<text x="190" y="118" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">Brown water fills the street up to the</text>
<text x="190" y="136" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">windows. A small rowing boat knocks</text>
<line x1="160" y1="132" x2="182" y2="132" stroke="#1c7ed6" stroke-width="2" stroke-linecap="round"/>
<rect x="60.8" y="122" width="95.2" height="20" rx="10" fill="#1c7ed6" stroke="none" stroke-width="1.5"/>
<text x="108.4" y="137" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">action lines</text>
<text x="190" y="154" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">against a broken jetty.</text>
<text x="190" y="182" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">NOUR (17) jumps into the boat.</text>
<text x="350" y="210" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">NOUR</text>
<line x1="522" y1="206" x2="544" y2="206" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<rect x="548" y="196" width="75.4" height="20" rx="10" fill="#e8590c" stroke="none" stroke-width="1.5"/>
<text x="585.7" y="211" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">character</text>
<text x="350" y="234" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">(to herself)</text>
<line x1="522" y1="230" x2="544" y2="230" stroke="#0b7285" stroke-width="2" stroke-linecap="round"/>
<rect x="548" y="220" width="101.8" height="20" rx="10" fill="#0b7285" stroke="none" stroke-width="1.5"/>
<text x="598.9" y="235" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">parenthetical</text>
<text x="350" y="258" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">Hold on, everyone.</text>
<line x1="522" y1="254" x2="544" y2="254" stroke="#2b8a3e" stroke-width="2" stroke-linecap="round"/>
<rect x="548" y="244" width="68.8" height="20" rx="10" fill="#2b8a3e" stroke="none" stroke-width="1.5"/>
<text x="582.4" y="259" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">dialogue</text>
<text x="350" y="276" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">I'm coming.</text>
<text x="190" y="300" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">Far away, a torch blinks on a</text>
<text x="190" y="318" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">rooftop.</text>
<text x="510" y="350" font-size="13" fill="#2a2f2c" text-anchor="end" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">CUT TO:</text>
<line x1="522" y1="346" x2="544" y2="346" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<rect x="548" y="336" width="82" height="20" rx="10" fill="#6b726e" stroke="none" stroke-width="1.5"/>
<text x="589" y="351" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">transition</text>
</svg>
