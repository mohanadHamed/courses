<text x="474" y="116" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">|A| / |S|, 1 − P, P(A | B),</text>
<text x="474" y="132.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">E(X)</text>
