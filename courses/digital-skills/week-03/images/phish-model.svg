<svg xmlns="http://www.w3.org/2000/svg" width="790" height="236" viewBox="0 0 790 236" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="790" height="236" fill="#ffffff"/>
<rect x="20.0" y="14.0" width="450.0" height="208.0" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
<text x="36.0" y="44.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">From: Sunrise Bank &lt;service@sunrise-bank-help.co&gt;</text>
<circle cx="486.0" cy="40.0" r="11.0" fill="#D9480F"/>
<text x="486.0" y="44.5" font-size="12.65" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<text x="36.0" y="70.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Subject: Your card is blocked</text>
<text x="36.0" y="96.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Dear customer,</text>
<text x="36.0" y="122.0" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">Your card is blocked. Open it in 12 hours, or you lose it!</text>
<circle cx="486.0" cy="118.0" r="11.0" fill="#D9480F"/>
<text x="486.0" y="122.5" font-size="12.65" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<text x="36.0" y="148.0" font-size="12.5" fill="#1971c2" text-anchor="start" font-weight="700" xml:space="preserve">Sign in here: sunrise-bank-help.co/login</text>
<circle cx="486.0" cy="144.0" r="11.0" fill="#D9480F"/>
<text x="486.0" y="148.5" font-size="12.65" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<text x="36.0" y="174.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Type your card number and your PIN to open it.</text>
<circle cx="486.0" cy="170.0" r="11.0" fill="#D9480F"/>
<text x="486.0" y="174.5" font-size="12.65" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<text x="36.0" y="200.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Thank you, Sunrise Bank</text>
<text x="522.0" y="50.0" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">1  The address is not the bank's.</text>
<text x="522.0" y="80.0" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">2  It hurries you, with a threat.</text>
<text x="522.0" y="110.0" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">3  The link goes to a strange site.</text>
<text x="522.0" y="140.0" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">4  It asks for your PIN.</text>
</svg>
