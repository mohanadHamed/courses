<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Panel Composer</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .task { font-weight: 800; margin: 4px 0 8px; }
    .sim .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; margin-top: 8px; }
    @media (max-width: 520px) { .sim .opts { grid-template-columns: 1fr; } }
    .sim .opts label { font-weight: 700; justify-content: space-between; }
    .sim .opts select { font: inherit; font-weight: 700; padding: 3px; border-radius: 8px; max-width: 62%; }
    .sim ul.fb { margin: 8px 0 0; padding-left: 1.2em; font-weight: 700; }
    .sim ul.fb li.ok { color: #2b8a3e; } .sim ul.fb li.no { color: #c92a2a; }
  </style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Panel Composer: a gameplay panel</h1>
  <p class="hint">Build each gameplay panel of the <i>Cat Catch</i> level: choose the shot, and what the player sees and does. Then press <b>Check the panel</b>.</p>
  <p class="task" id="task"></p>
  <canvas id="c" aria-label="The panel you are composing"></canvas>
  <div class="opts" id="opts"></div>
  <div class="controls"><button type="button" id="check">Check the panel</button><button type="button" class="ghost" id="next">Next task ▶</button></div>
  <ul class="fb" id="fb"></ul>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script src="../../week-05/sims/rooftop-scene.js"></script>
<script src="gameplay-overlay.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const FIELDS = {
    shot: ["wideStreet", "medNour", "wideRoof", "medSalma", "closeSalma"],
    hud: ["on", "off"], input: ["none", "tap", "swipe"], feedback: ["none", "splash", "+100"], arrow: ["none", "Nour rows", "the cat falls"],
  };
  const NAMES = { shot: "Shot", hud: "HUD (hearts, score)", input: "Player input", feedback: "Feedback", arrow: "Movement arrow" };
  const TASKS = [
    { q: "Panel 1 (gameplay): the player swipes to row Nour to the house.", want: { shot: "medNour", hud: "on", input: "swipe", feedback: "none", arrow: "Nour rows" } },
    { q: "Panel 2 (gameplay): Pasha jumps from the roof; the player must tap to catch.", want: { shot: "wideRoof", hud: "on", input: "tap", feedback: "none", arrow: "the cat falls" } },
    { q: "Panel 3 (fail state): the player tapped too late; Pasha falls into the water.", want: { shot: "medNour", hud: "on", input: "none", feedback: "splash", arrow: "none" } },
  ];
  const WHY = {
    shot: { medNour: "the boat and Nour", wideRoof: "the roof and the fall", wideStreet: "the whole street", medSalma: "Salma and the cat", closeSalma: "Salma's face" },
    hud: "Gameplay panels show the HUD, where the game shows it.",
    input: { none: "In this moment the player does nothing.", tap: "The player taps to catch.", swipe: "The player swipes to row." },
    feedback: { none: "Nothing has happened yet.", splash: "A miss is shown with a splash (and a lost heart).", "+100": "A catch is shown with points." },
    arrow: { none: "Nothing moves in this panel.", "Nour rows": "The arrow shows the rowing.", "the cat falls": "The arrow shows Pasha's fall." },
  };
  let t = 0;
  const s = { shot: "wideStreet", hud: "off", input: "none", feedback: "none", arrow: "none" };
  Object.keys(FIELDS).forEach((k) => {
    const lab = Kit.el("label", {}, NAMES[k]);
    const sel = Kit.el("select", { "data-k": k });
    FIELDS[k].forEach((v) => sel.appendChild(Kit.el("option", { value: v }, k === "shot" ? RS.SHOTS[v].name.split(": ")[0] + ": " + RS.SHOTS[v].name.split(": ")[1] : v)));
    sel.addEventListener("change", () => { s[k] = sel.value; $("fb").innerHTML = ""; draw(); });
    lab.appendChild(sel); $("opts").appendChild(lab);
  });
  const lives = () => (s.feedback === "splash" ? 2 : 3);
  const cv = Kit.canvas($("c"), (W) => Math.round(Math.min(W, 600) * 9 / 16));
  function draw() {
    const w = Math.min(cv.W, 600), h = Math.round(w * 9 / 16), x = (cv.W - w) / 2, c = cv.ctx;
    c.clearRect(0, 0, cv.W, cv.H);
    const arrow = s.arrow === "Nour rows" ? [24, 33, 30, 33] : s.arrow === "the cat falls" ? [87, 21, 84, 34] : null;
    RS.draw(c, x, 0, w, h, RS.SHOTS[s.shot], { arrow });
    if (s.hud === "on") GO.hud(c, x, 0, w, h, { lives: lives() });
    GO.input(c, x + w * 0.78, h * 0.72, s.input, Math.max(9, w * 0.025));
    GO.feedback(c, x + w * 0.45, h * 0.62, s.feedback, w / 520);
  }
  function load() { $("task").textContent = `Task ${t + 1} / ${TASKS.length}: ${TASKS[t].q}`; $("fb").innerHTML = ""; }
  $("check").addEventListener("click", () => {
    const W = TASKS[t].want; $("fb").innerHTML = ""; let all = true;
    Object.keys(W).forEach((k) => {
      const ok = s[k] === W[k]; all = all && ok;
      const why = typeof WHY[k] === "string" ? WHY[k] : k === "shot" ? `This moment needs a shot of ${WHY.shot[W.shot]}.` : WHY[k][W[k]];
      $("fb").appendChild(Kit.el("li", { class: ok ? "ok" : "no" }, (ok ? "✓ " : "✗ ") + NAMES[k] + ": " + why));
    });
    if (all) { $("fb").appendChild(Kit.el("li", { class: "ok" }, "🎉 This panel is ready. Press Next task.")); Kit.good(); } else Kit.bad();
  });
  $("next").addEventListener("click", () => { t = (t + 1) % TASKS.length; load(); });
  window.PC = { set: (k, v) => { const e = document.querySelector(`select[data-k="${k}"]`); e.value = v; e.dispatchEvent(new Event("change")); } };
  window.addEventListener("resize", draw);
  load(); draw();
})();
</script>
</body>
</html>
