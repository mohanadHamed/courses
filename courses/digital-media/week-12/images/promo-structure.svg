<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="230" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A 30-second promo in five parts</text>
<rect x="20" y="60" width="61" height="64" rx="6" fill="#e8590c"/>
<text x="52" y="86" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">hook</text>
<rect x="84" y="60" width="125" height="64" rx="6" fill="#1c7ed6"/>
<text x="148" y="86" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">the world</text>
<rect x="212" y="60" width="231.7" height="64" rx="6" fill="#2b8a3e"/>
<text x="329.3" y="86" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">gameplay beats</text>
<rect x="446.7" y="60" width="103.7" height="64" rx="6" fill="#7048e8"/>
<text x="500" y="86" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">the big moment</text>
<rect x="553.3" y="60" width="103.7" height="64" rx="6" fill="#9C36B5"/>
<text x="606.7" y="86" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">logo + call to</text>
<text x="606.7" y="101" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">action</text>
<text x="20" y="142" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">0 s</text>
<text x="84" y="142" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">3 s</text>
<text x="212" y="142" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">9 s</text>
<text x="446.7" y="142" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">20 s</text>
<text x="553.3" y="142" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">25 s</text>
<text x="660" y="142" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">30 s</text>
<text x="20" y="172" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Hook: the most exciting shot first (people decide in 3 seconds). Beats: short shots (1–3 s) on the beat of</text>
<text x="20" y="187.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">the music. End: the name, and what to do (“Play free now”), with no shot of the menu.</text>
</svg>
