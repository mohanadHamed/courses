<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Fair or Frustrating?</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #ebfbee; border: 1.5px solid #2F9E44; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Fair or Frustrating?</h1>
  <p class="hint">Players of <i>Torch Hall</i> send messages about luck. Use probability and the tools of today to answer each one.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "\"My hit chance is 80 % and I missed 2 times in a row. The game cheats!\"", goal: "P(2 misses in a row)?", answer: "4 %", choices: C(["4 %", "0 %", "20 %", "16 %"]), good: "0.2 × 0.2 = 0.04. Rare in one place, but in a long fight two misses in a row are normal.", why: { "16 %": "That is 0.8 × 0.2: one hit and one miss.", "20 %": "That is one miss, not two in a row." } },
    { card: "\"I rolled no 6 in 5 rolls. A 6 must come now!\"", goal: "P(a 6 on the next roll)?", answer: "1/6", choices: C(["1/6", "5/6", "1/2", "1"]), good: "The die has no memory: the gambler's fallacy. Every roll has 1/6.", why: { "1": "Nothing is \"due\": the rolls are independent." } },
    { card: "\"With 70 % I hit almost always!\" The player attacks 2 times.", goal: "P(at least one miss in 2 attacks)?", answer: "51 %", choices: C(["51 %", "30 %", "60 %", "9 %"]), good: "1 − 0.7 × 0.7 = 1 − 0.49 = 0.51: in half of the pairs of attacks the player misses.", why: { "60 %": "Chances do not add up: use the complement 1 − 0.7².", "9 %": "That is two misses in a row, 0.3 × 0.3." } },
    { card: "\"A key drops with 50 %. I tried 3 times.\"", goal: "P(at least one key in 3 tries)?", answer: "7/8", choices: C(["7/8", "3/2", "1/2", "1/8"]), good: "None in 3 tries: (1/2)³ = 1/8, so at least one is 1 − 1/8 = 7/8.", why: { "3/2": "A probability is never more than 1: the chances do not add up." } },
    { card: "Crits are 20 %, but some players wait 30 attacks. The team uses a shuffle bag: 1 crit and 4 normal hits.", goal: "The longest wait without a crit?", answer: "8 attacks", choices: C(["8 attacks", "4 attacks", "5 attacks", "30 attacks"]), good: "The crit first in one bag and last in the next: 4 + 4 = 8 normal hits between them.", why: { "4 attacks": "That is one bag. The crit can be first in one bag and last in the next." } },
    { card: "A chest gives 10 coins (80 %) or 50 coins (20 %). A bow costs 180 coins.", goal: "Chests on average for the bow?", answer: "10", choices: C(["10", "6", "30", "18"]), good: "E = 0.8 · 10 + 0.2 · 50 = 18 coins, and 180 ÷ 18 = 10 chests.", why: { "6": "That uses the plain average 30. The probabilities are missing." } },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 1, animMs: 600, intro: "Round 1 is the story of the lesson: two misses in a row." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "All messages are answered." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
