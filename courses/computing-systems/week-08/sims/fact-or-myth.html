<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Fact or Myth?</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .pad button { text-align: left; }</style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Fact or Myth?</h1>
  <p class="hint">Rami's comparison table of Android and iOS has some lines from the Internet. Decide for each line: a fact (with the right kind of source), or a myth.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const F = "a fact: keep it, with an official source", M = "a myth: remove it", D = "a fact that changes: keep it, with a dated report";
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { goal: "“An iOS build needs a Mac with Xcode.”", choices: C([F, M, D]), answer: F, good: "Apple's developer pages say so: Xcode runs only on macOS.", why: { [M]: "It is true: Xcode, Apple's tool for iOS builds, runs only on a Mac." } },
    { goal: "“Android games are always slower than iPhone games.”", choices: C([M, F, D]), answer: M, good: "It depends on the phone: a strong Android phone is faster than an old iPhone (lecture 8). ‘Always’ is a warning sign.", why: { [F]: "No test shows ‘always’: speed depends on the chip, not on the OS name." } },
    { goal: "“About 7 in 10 phones in the world run Android.”", choices: C([D, F, M]), answer: D, good: "A market share changes every month: keep it with the name and the date of the report.", why: { [F]: "It is true now, but it changes: write the date of the report." } },
    { goal: "“The Google Play developer account costs 25 USD once.”", choices: C([F, M, D]), answer: F, good: "Google Play Console Help states the one-time fee. Check it again before you publish.", why: {} },
    { goal: "“iPhones cannot get viruses, so testers never need to update them.”", choices: C([M, F, D]), answer: M, good: "No phone is safe for ever: both systems get security updates, and testers keep test phones updated.", why: { [F]: "Apple ships security updates because problems are found." } },
    { goal: "“A game for Android must be tested on several phone models.”", choices: C([F, M, D]), answer: F, good: "Android runs on many models, chips and screens (fragmentation): the Android developer guides advise testing on several devices.", why: {} },
  ];
  Kit.game({ rounds, cols: 1, colsPhone: 1, animMs: 600, intro: "Round 1 is the story of the lesson: the first line of Rami's table." });
})();
</script>
</body>
</html>
