<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="340" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A tree diagram: a coin, then a spinner with 3 equal colours</text>
<circle cx="60" cy="170" r="7" fill="#2a2f2c"/>
