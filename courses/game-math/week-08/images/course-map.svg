<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="350" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Lectures 1–14 in six parts</text>
<rect x="20" y="56" width="200" height="120" rx="14" fill="#2F9E4412" stroke="#2F9E44" stroke-width="2"/>
<text x="34" y="84" font-size="15" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Vectors</text>
<rect x="156.9" y="67.5" width="46.1" height="21" rx="10.5" fill="#2F9E44"/>
<text x="180" y="82" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">L1–3</text>
<text x="34" y="116" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">position, displacement, add,</text>
<text x="34" y="132.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">scale, |v|, unit vector</text>
<rect x="240" y="56" width="200" height="120" rx="14" fill="#1c7ed612" stroke="#1c7ed6" stroke-width="2"/>
<text x="254" y="84" font-size="15" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">Dot and cross</text>
<rect x="376.9" y="67.5" width="46.1" height="21" rx="10.5" fill="#1c7ed6"/>
<text x="400" y="82" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">L4–5</text>
<text x="254" y="116" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">a·b = |a||b| cos θ; a × b is a</text>
<text x="254" y="132.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">normal</text>
<rect x="460" y="56" width="200" height="120" rx="14" fill="#0c859912" stroke="#0c8599" stroke-width="2"/>
<text x="474" y="84" font-size="15" fill="#0c8599" text-anchor="start" font-weight="800" xml:space="preserve">Distance</text>
<rect x="603.7" y="67.5" width="32.6" height="21" rx="10.5" fill="#0c8599"/>
<text x="620" y="82" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">L6</text>
<text x="474" y="116" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">|B − A|; part of v along u =</text>
<text x="474" y="132.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">(v·u) u</text>
<rect x="20" y="194" width="200" height="120" rx="14" fill="#e8590c12" stroke="#e8590c" stroke-width="2"/>
<text x="34" y="222" font-size="15" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">Trigonometry</text>
<rect x="156.9" y="205.5" width="46.1" height="21" rx="10.5" fill="#e8590c"/>
<text x="180" y="220" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">L7–8</text>
<text x="34" y="254" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">(r cos θ, r sin θ), atan2, A</text>
<text x="34" y="270.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">sin(ωt)</text>
<rect x="240" y="194" width="200" height="120" rx="14" fill="#7048e812" stroke="#7048e8" stroke-width="2"/>
<text x="254" y="222" font-size="15" fill="#7048e8" text-anchor="start" font-weight="800" xml:space="preserve">Matrices</text>
<rect x="373.3" y="205.5" width="53.5" height="21" rx="10.5" fill="#7048e8"/>
<text x="400" y="220" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">L9–10</text>
<text x="254" y="254" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">M × v, M × N, I, inverse</text>
<rect x="460" y="194" width="200" height="120" rx="14" fill="#d6336c12" stroke="#d6336c" stroke-width="2"/>
<text x="474" y="222" font-size="15" fill="#d6336c" text-anchor="start" font-weight="800" xml:space="preserve">Transformations</text>
<rect x="589.6" y="205.5" width="60.8" height="21" rx="10.5" fill="#d6336c"/>
<text x="620" y="220" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">L11–14</text>
<text x="474" y="254" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">T, S, R, pivot, (x, y, 1), T × R</text>
<text x="474" y="270.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">× S, 4 × 4</text>
<text x="340" y="336" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Each part uses the parts before it: transformations are matrices acting on vectors.</text>
</svg>
