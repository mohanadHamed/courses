<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="270" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A 2 × 2 matrix cannot move the origin; a 3 × 3 matrix can</text>
<rect x="20" y="52" width="310" height="196" rx="12" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.8"/>
<text x="34" y="76" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">2 × 2: (x, y)</text>
<path d="M47 110 H40 V182 H47" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M129 110 H136 V182 H129" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="68" y="135.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">a</text>
<text x="108" y="135.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">b</text>
<text x="68" y="167.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">c</text>
<text x="108" y="167.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">d</text>
<text x="150" y="150" font-size="18" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">×</text>
<path d="M177 110 H170 V182 H177" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M219 110 H226 V182 H219" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="198" y="135.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<text x="198" y="167.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<text x="240" y="150" font-size="18" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">=</text>
<path d="M265 110 H258 V182 H265" fill="none" stroke="#c92a2a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M307 110 H314 V182 H307" fill="none" stroke="#c92a2a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="286" y="135.8" font-size="16" fill="#c92a2a" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<text x="286" y="167.8" font-size="16" fill="#c92a2a" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<text x="40" y="214" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">Any 2 × 2 matrix sends (0, 0) to (0, 0):</text>
<text x="40" y="230.9" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">it can scale and turn, never move.</text>
<rect x="350" y="52" width="310" height="196" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="364" y="76" font-size="15" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">3 × 3: (x, y, 1)</text>
<path d="M369 98 H362 V196 H369" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M467 98 H474 V196 H467" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="386" y="122.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<text x="418" y="122.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<rect x="436" y="104" width="28" height="26" rx="5" fill="#ffe8cc"/>
<text x="450" y="122.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">5</text>
<text x="386" y="152.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<text x="418" y="152.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<rect x="436" y="134" width="28" height="26" rx="5" fill="#ffe8cc"/>
<text x="450" y="152.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
<text x="386" y="182.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<text x="418" y="182.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<text x="450" y="182.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<text x="486" y="150" font-size="18" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">×</text>
<path d="M505 98 H498 V196 H505" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M539 98 H546 V196 H539" fill="none" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="522" y="122.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<text x="522" y="152.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
<text x="522" y="182.8" font-size="16" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<text x="560" y="150" font-size="18" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">=</text>
<path d="M581 98 H574 V196 H581" fill="none" stroke="#2F9E44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M615 98 H622 V196 H615" fill="none" stroke="#2F9E44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="598" y="122.8" font-size="16" fill="#2F9E44" text-anchor="middle" font-weight="700" xml:space="preserve">5</text>
<text x="598" y="152.8" font-size="16" fill="#2F9E44" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
<text x="598" y="182.8" font-size="16" fill="#2F9E44" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<text x="370" y="214" font-size="13" fill="#2F9E44" text-anchor="start" font-weight="700" xml:space="preserve">The extra 1 picks up the last column: the</text>
<text x="370" y="230.9" font-size="13" fill="#2F9E44" text-anchor="start" font-weight="700" xml:space="preserve">origin moves to (5, 2).</text>
</svg>
