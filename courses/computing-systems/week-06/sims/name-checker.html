<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Name Checker</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim input[type="text"] { width: 100%; font: inherit; font-weight: 700; padding: 8px 10px; border: 1.5px solid #ffd43b; border-radius: 10px; }
    .sim ul.rules { list-style: none; padding: 0; margin: 10px 0; }
    .sim ul.rules li { padding: 4px 0; font-weight: 700; }
    .sim ul.rules li.ok { color: #2b8a3e; } .sim ul.rules li.no { color: #c92a2a; }
    .sim .task { font-weight: 800; margin: 6px 0; }
  </style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Name Checker: file names for a test</h1>
  <p class="hint">Type a file name for the task. The checker shows which rules it keeps.</p>
  <p class="task" id="task"></p>
  <input type="text" id="name" autocomplete="off" spellcheck="false" aria-label="File name">
  <ul class="rules" id="rules"></ul>
  <div class="controls"><button type="button" id="next" class="ghost">Next task ▶</button></div>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const TASKS = [
    { q: "The screenshot of level 3 on phone P5, taken on 12 November 2026 (a .png file).", rules: [
      [/^2026-11-12_/, "starts with the date 2026-11-12_"], [/P5/, "names the device P5"], [/level3/i, "says what it shows (level3)"], [/\.png$/i, "ends with .png"], [/^\S+$/, "has no spaces"]] },
    { q: "The Android build of Pocket Quest, version 1.2 (an .apk file).", rules: [
      [/^PocketQuest_/, "starts with the game name PocketQuest_"], [/_1\.2_/, "has the version _1.2_"], [/android/i, "names the platform (android)"], [/\.apk$/i, "ends with .apk"], [/^\S+$/, "has no spaces"]] },
    { q: "The test report for phone P6 on 13 November 2026 (a .docx file).", rules: [
      [/^2026-11-13_/, "starts with the date 2026-11-13_"], [/P6/, "names the device P6"], [/report/i, "says it is a report"], [/\.docx$/i, "ends with .docx"], [/^\S+$/, "has no spaces"]] },
  ];
  const $ = (id) => document.getElementById(id);
  let t = 0, done = false;
  function check() {
    const v = $("name").value.trim(), T = TASKS[t];
    $("rules").innerHTML = "";
    let all = !!v;
    T.rules.forEach(([re, text]) => { const ok = !!v && re.test(v); all = all && ok; $("rules").appendChild(Kit.el("li", { class: ok ? "ok" : "no" }, (ok ? "✓ " : "✗ ") + text)); });
    if (/final|new|copy/i.test(v)) { all = false; $("rules").appendChild(Kit.el("li", { class: "no" }, "✗ no words like final, new or copy: they say nothing")); }
    if (all && !done) { done = true; $("msg").textContent = "✓ A clear name: anyone in the team can find and sort this file."; $("msg").className = "message good"; Kit.good(); }
    if (!all) { done = false; $("msg").textContent = v ? "Keep typing until every rule is green." : ""; $("msg").className = "message"; }
  }
  function load() { $("task").textContent = `Task ${t + 1} / ${TASKS.length}: ${TASKS[t].q}`; $("name").value = ""; done = false; check(); }
  $("name").addEventListener("input", check);
  $("next").addEventListener("click", () => { t = (t + 1) % TASKS.length; load(); });
  load();
})();
</script>
</body>
</html>
