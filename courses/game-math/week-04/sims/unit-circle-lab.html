<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Unit Circle Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
    .sim .card { border: 1px solid #e9ecef; border-radius: 10px; padding: 6px 10px; }
    .sim .card small { display: block; color: var(--sim-muted); font-weight: 700; font-size: 0.78rem; }
    .sim .card b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .sim .card.ang b { color: #e8590c; } .sim .card.cos b { color: #7048e8; } .sim .card.sin b { color: #1c7ed6; } .sim .card.tan b { color: var(--sim-accent); }
    .sim .pad { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .sim .pad button { padding: 6px 10px; }
    @media (max-width: 480px) { .sim .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Unit Circle Lab</h1>
  <p class="hint">Drag the orange point around the circle (or tap an angle). The point at the angle θ is (cos θ, sin θ): the purple line is cos θ, the blue line is sin θ.</p>
  <canvas id="c" aria-label="A unit circle with a point that you can drag"></canvas>
  <div class="cards">
    <div class="card ang"><small>angle θ</small><b id="ang">30°</b></div>
    <div class="card cos"><small>cos θ (x)</small><b id="cos">0.87</b></div>
    <div class="card sin"><small>sin θ (y)</small><b id="sin">0.5</b></div>
    <div class="card tan"><small>tan θ = sin ÷ cos</small><b id="tan">0.58</b></div>
  </div>
  <div class="pad" id="pad"></div>
  <div class="controls">
    <label><input type="checkbox" id="snap" checked> Snap to 15°</label>
    <label><input type="checkbox" id="rad"> Show radians</label>
  </div>
  <p id="msg" class="message">Quadrant I: x +, y +.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const ANGLES = [0, 30, 45, 60, 90, 120, 135, 150, 180, 210, 270, 330];
  let W = 0, H = 0, R = 120, cx = 0, cy = 0, deg = 30, drag = false;

  const fmt = (v) => { const r = Math.round(v * 100) / 100; return (r < 0 ? "−" : "") + Math.abs(r === 0 ? 0 : r); };
  const rad = (d) => d * Math.PI / 180;

  function update() {
    const c = Math.cos(rad(deg)), s = Math.sin(rad(deg));
    $("ang").textContent = $("rad").checked ? `${deg}° = ${fmt(rad(deg))} rad` : `${deg}°`;
    $("cos").textContent = fmt(c); $("sin").textContent = fmt(s);
    $("tan").textContent = Math.abs(c) < 1e-6 ? "none (cos = 0)" : fmt(s / c);
    const q = deg === 0 || deg === 90 || deg === 180 || deg === 270 ? "On an axis: one of cos and sin is 0."
      : deg < 90 ? "Quadrant I: x +, y +." : deg < 180 ? "Quadrant II: x −, y +." : deg < 270 ? "Quadrant III: x −, y −." : "Quadrant IV: x +, y −.";
    $("msg").textContent = q + (Math.abs(c) < 1e-6 ? " tan θ does not exist here: you cannot divide by 0." : "");
    document.querySelectorAll("#pad button").forEach((b) => b.classList.toggle("ghost", Number(b.dataset.a) !== deg));
  }
  function resize() {
    W = canvas.clientWidth; R = Math.max(80, Math.min(W * 0.36, 150));
    H = Math.round(2 * R + 70); cx = W / 2; cy = H / 2;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function arrowHead(x, y, a, col) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x - Math.cos(a - 0.4) * 9, y - Math.sin(a - 0.4) * 9); ctx.lineTo(x - Math.cos(a + 0.4) * 9, y - Math.sin(a + 0.4) * 9); ctx.fill();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#f8faf8"; ctx.strokeStyle = "#2F9E44"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // axes
    ctx.strokeStyle = "#adb5bd"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx - R - 22, cy); ctx.lineTo(cx + R + 22, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy + R + 22); ctx.lineTo(cx, cy - R - 22); ctx.stroke();
    arrowHead(cx + R + 26, cy, 0, "#adb5bd"); arrowHead(cx, cy - R - 26, -Math.PI / 2, "#adb5bd");
    ctx.fillStyle = "#6b726e"; ctx.font = "700 12px Nunito, system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("1", cx + R + 8, cy + 16); ctx.fillText("−1", cx - R - 10, cy + 16); ctx.fillText("1", cx + 12, cy - R - 4); ctx.fillText("−1", cx + 14, cy + R + 14);
    ctx.fillText("x", cx + R + 22, cy - 8); ctx.fillText("y", cx + 12, cy - R - 20);
    const c = Math.cos(rad(deg)), s = Math.sin(rad(deg)), px = cx + R * c, py = cy - R * s;
    // the triangle
    ctx.fillStyle = "rgba(47,158,68,0.12)"; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, cy); ctx.lineTo(px, py); ctx.closePath(); ctx.fill();
    ctx.lineCap = "round";
    ctx.strokeStyle = "#7048e8"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, cy); ctx.stroke();
    ctx.strokeStyle = "#1c7ed6"; ctx.beginPath(); ctx.moveTo(px, cy); ctx.lineTo(px, py); ctx.stroke();
    ctx.strokeStyle = "#2F9E44"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();
    // the angle
    ctx.strokeStyle = "#e8590c"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx, cy, 30, 0, -rad(deg), true); ctx.stroke();
    // labels
    ctx.font = "800 12px Nunito, system-ui, sans-serif";
    ctx.fillStyle = "#7048e8"; ctx.fillText("cos " + fmt(c), cx + (px - cx) / 2, cy + (s >= 0 ? 18 : -10));
    ctx.fillStyle = "#1c7ed6"; ctx.textAlign = c >= 0 ? "left" : "right"; ctx.fillText("sin " + fmt(s), px + (c >= 0 ? 8 : -8), cy - (cy - py) / 2 + 4);
    // the point
    ctx.fillStyle = "#e8590c"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(px, py, drag ? 13 : 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#e8590c"; ctx.font = "800 13px Nunito, system-ui, sans-serif"; ctx.textAlign = c >= 0 ? "left" : "right";
    ctx.fillText(`(${fmt(c)}, ${fmt(s)})`, px + (c >= 0 ? 16 : -16), py + (s >= 0 ? -12 : 22));
  }
  function setFrom(e) {
    const r = canvas.getBoundingClientRect();
    let a = Math.atan2(-(e.clientY - r.top - cy), e.clientX - r.left - cx) * 180 / Math.PI;
    if (a < 0) a += 360;
    const step = $("snap").checked ? 15 : 1;
    deg = Math.round(a / step) * step % 360;
    update();
  }
  canvas.addEventListener("pointerdown", (e) => { drag = true; canvas.setPointerCapture(e.pointerId); setFrom(e); });
  canvas.addEventListener("pointermove", (e) => { if (drag) setFrom(e); });
  canvas.addEventListener("pointerup", () => { drag = false; });
  canvas.addEventListener("pointercancel", () => { drag = false; });
  ANGLES.forEach((a) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.dataset.a = a; b.textContent = a + "°";
    b.addEventListener("click", () => { deg = a; update(); }); $("pad").appendChild(b);
  });
  $("rad").addEventListener("change", update);
  function loop() { requestAnimationFrame(loop); try { draw(); } catch (e) { /* keep the loop alive */ } }
  window.addEventListener("resize", resize);
  resize(); update(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
