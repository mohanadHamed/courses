<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="270" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Finding a network problem, from near to far</text>
<rect x="14" y="64" width="122" height="70" rx="8" fill="#1e1e2e"/>
<text x="75" y="92" font-size="12" fill="#ffd43b" text-anchor="middle" font-weight="700" xml:space="preserve">1 ipconfig</text>
<text x="75" y="158" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">an IP address?</text>
<text x="75" y="210" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="700" xml:space="preserve">no → cable, Wi-Fi</text>
<line x1="136" y1="99" x2="141.6" y2="99" stroke="#A86700" stroke-width="2" stroke-linecap="round"/>
<polygon points="147,99 141,102 141,96" fill="#A86700"/>
<rect x="147" y="64" width="122" height="70" rx="8" fill="#1e1e2e"/>
<text x="208" y="92" font-size="12" fill="#ffd43b" text-anchor="middle" font-weight="700" xml:space="preserve">2 ping gateway</text>
<text x="208" y="158" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">the router</text>
<text x="208" y="173.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">answers?</text>
<text x="208" y="210" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="700" xml:space="preserve">no → LAN problem</text>
<line x1="269" y1="99" x2="274.6" y2="99" stroke="#A86700" stroke-width="2" stroke-linecap="round"/>
<polygon points="280,99 274,102 274,96" fill="#A86700"/>
<rect x="280" y="64" width="122" height="70" rx="8" fill="#1e1e2e"/>
<text x="341" y="92" font-size="12" fill="#ffd43b" text-anchor="middle" font-weight="700" xml:space="preserve">3 ping server IP</text>
<text x="341" y="158" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">the Internet</text>
<text x="341" y="173.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">works?</text>
<text x="341" y="210" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="700" xml:space="preserve">no → ISP, firewall</text>
<line x1="402" y1="99" x2="407.6" y2="99" stroke="#A86700" stroke-width="2" stroke-linecap="round"/>
<polygon points="413,99 407,102 407,96" fill="#A86700"/>
<rect x="413" y="64" width="122" height="70" rx="8" fill="#1e1e2e"/>
<text x="474" y="92" font-size="12" fill="#ffd43b" text-anchor="middle" font-weight="700" xml:space="preserve">4 nslookup name</text>
<text x="474" y="158" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">the name works?</text>
<text x="474" y="210" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="700" xml:space="preserve">no → DNS problem</text>
<line x1="535" y1="99" x2="540.6" y2="99" stroke="#A86700" stroke-width="2" stroke-linecap="round"/>
<polygon points="546,99 540,102 540,96" fill="#A86700"/>
<rect x="546" y="64" width="122" height="70" rx="8" fill="#1e1e2e"/>
<text x="607" y="92" font-size="12" fill="#ffd43b" text-anchor="middle" font-weight="700" xml:space="preserve">5 speed test</text>
<text x="607" y="158" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">enough bandwidth?</text>
<text x="607" y="210" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="700" xml:space="preserve">no → too many users</text>
<text x="340" y="252" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">yes → go to the next step. The first “no” shows where the problem is.</text>
</svg>
