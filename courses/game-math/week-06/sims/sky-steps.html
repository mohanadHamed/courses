<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Sky Steps</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Sky Steps: the level editor</h1>
  <p class="hint">You build a level of the platform game <b>Sky Steps</b>. Each piece must land exactly on its dashed outline. Choose the transformation; the piece moves when you choose.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const mv = (t) => (p) => [p[0] + t[0], p[1] + t[1]];
  const sc = (k, c = [0, 0], ky = k) => (p) => [c[0] + (p[0] - c[0]) * k, c[1] + (p[1] - c[1]) * ky];
  const then = (a, b) => (p) => b(a(p));
  const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  const flag = (x, y) => [[x, y], [x, y + 3], [x + 2, y + 2.4], [x + 0.3, y + 1.8], [x + 0.3, y]];
  // Each round: the piece, the outline, and the choices with their transformations.
  const R = (goal, piece, target, list, answer, good, why) => ({ goal, piece, target, choices: list.map(([k]) => ({ k, label: k })), fx: Object.fromEntries(list), answer, good, why });
  const rounds = [
    R("Move the platform onto its outline.", rect(1, 1, 3, 2), rect(3, 6, 5, 7),
      [["move (2, 5)", mv([2, 5])], ["move (3, 6)", mv([3, 6])], ["move (5, 2)", mv([5, 2])], ["scale 2", sc(2)]], "move (2, 5)",
      "Every corner moves by (2, 5): (1, 1) → (3, 6).", { "move (3, 6)": "(3, 6) is where the corner must go, not the move: 3 − 1 = 2, 6 − 1 = 5.", "move (5, 2)": "x first: the move is 2 right and 5 up, not 5 right and 2 up.", "scale 2": "Scaling changes the size; this piece only needs to move." }),
    R("The crate must be three times as big, on its outline.", rect(2, 1, 3, 2), rect(6, 3, 9, 6),
      [["scale 3 about the origin", sc(3)], ["scale 3 about its centre", sc(3, [2.5, 1.5])], ["move (4, 2)", mv([4, 2])]], "scale 3 about the origin",
      "About the origin, (2, 1) → (6, 3) and (3, 2) → (9, 6).", { "scale 3 about its centre": "About the centre it stays around (2.5, 1.5): look where the outline is.", "move (4, 2)": "Moving does not change the size." }),
    R("This crate must grow to twice its size, but stay in the same place.", rect(1, 1, 3, 3), rect(0, 0, 4, 4),
      [["scale 2 about the origin", sc(2)], ["scale 2 about its centre", sc(2, [2, 2])], ["move (−1, −1)", mv([-1, -1])]], "scale 2 about its centre",
      "The centre (2, 2) is the pivot: it stays, and every corner goes twice as far from it.", { "scale 2 about the origin": "About the origin the crate moves away, to (2, 2)–(6, 6).", "move (−1, −1)": "Moving does not change the size." }),
    R("The flag must point to the left, at the same pole.", flag(3, 2), flag(3, 2).map(([x, y]) => [6 - x, y]),
      [["scale (−1, 1) about the pole (3, 2)", sc(-1, [3, 2], 1)], ["scale (−1, 1) about the origin", sc(-1, [0, 0], 1)], ["move (−2, 0)", mv([-2, 0])]], "scale (−1, 1) about the pole (3, 2)",
      "A factor −1 on x mirrors the flag; the pole is the pivot, so it stays.", { "scale (−1, 1) about the origin": "About the origin the flag mirrors to x < 0: far from the pole.", "move (−2, 0)": "Moving does not turn the flag round." }),
    R("A small block must become the big step (two steps at once).", rect(0, 0, 1, 1), rect(2, 1, 5, 4),
      [["scale 3, then move (2, 1)", then(sc(3), mv([2, 1]))], ["move (2, 1), then scale 3", then(mv([2, 1]), sc(3))], ["scale 3, then move (1, 2)", then(sc(3), mv([1, 2]))]], "scale 3, then move (2, 1)",
      "Scale first: (1, 1) → (3, 3); then move: (3, 3) → (5, 4). The order matters.", { "move (2, 1), then scale 3": "Moving first, then scaling about the origin triples the move too: the block lands at (6, 3)–(9, 6).", "scale 3, then move (1, 2)": "This lands at (1, 2)–(4, 5): check the corner (0, 0)." }),
  ];
  Kit.game({
    rounds, cols: 2, colsPhone: 1, animMs: 1000,
    intro: "Round 1 is the story of the lesson: the first platform of Sky Steps.",
    canvas: (W) => Math.min(330, W * 0.66),
    draw(c, W, H, now, r, st) {
      const G = Kit.grid(c, W, H, -4, 10, -1, 8, { step: 2, bg: "#eef7ff", grid: "#d6e9fb", axis: "#9cc3e6" });
      if (!r) return;
      const poly = (pts, fill, stroke, dash) => { c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(G.X(p[0]), G.Y(p[1])) : c.moveTo(G.X(p[0]), G.Y(p[1])))); c.closePath(); if (fill) { c.fillStyle = fill; c.fill(); } c.setLineDash(dash || []); c.strokeStyle = stroke; c.lineWidth = 2.4; c.stroke(); c.setLineDash([]); };
      poly(r.target, null, "#e8590c", [7, 5]);
      let pts = r.piece;
      if (st.pick) {
        const end = r.piece.map(r.fx[st.pick]), k = st.done ? 1 : Math.max(0, Math.min((now - st.t0) / 900, 1));
        pts = r.piece.map((p, i) => [p[0] + (end[i][0] - p[0]) * k, p[1] + (end[i][1] - p[1]) * k]);
        poly(r.piece, "rgba(134,142,150,0.15)", "#adb5bd");
      }
      poly(pts, st.done && st.ok ? "rgba(47,158,68,0.45)" : "rgba(28,126,214,0.35)", st.done && st.ok ? "#2F9E44" : "#1c7ed6");
    },
  });
})();
</script>
</body>
</html>
