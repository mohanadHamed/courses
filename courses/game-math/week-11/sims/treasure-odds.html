<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Treasure Odds</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #ebfbee; border: 1.5px solid #2F9E44; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Treasure Odds</h1>
  <p class="hint">The dungeon of <i>Lucky Raft</i> has loot drops and critical hits. Each room has a rule with chance. Use what you already know, and the expected value, to choose well.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "A critical hit needs a sum of 11 or more on two dice. The first die already shows a 5.", goal: "P(critical hit | first die is 5)?", answer: "1/6", choices: C(["1/6", "1/12", "3/36", "1/2"]),
      good: "Only 6 cases are left (5,1 … 5,6); only (5,6) makes 11 or more: 1/6.", why: { "1/12": "That is P(sum ≥ 11) without the condition: 3/36.", "3/36": "That is P(sum ≥ 11) without the condition." } },
    { card: "A chest holds 8 items, 2 of them rare. The hero takes two items, one after the other.", goal: "P(two rare items)?", answer: "1/28", choices: C(["1/28", "1/16", "2/8", "4/8"]),
      good: "2/8 × 1/7 = 2/56 = 1/28. After one rare item, 1 rare of 7 items is left.", why: { "1/16": "That is with the item put back. Here it stays out." } },
    { card: "An enemy drops 50 coins (1/10), 10 coins (4/10) or nothing (5/10).", goal: "Expected coins per enemy?", answer: "9", choices: C(["9", "20", "60", "50"]),
      good: "50·0.1 + 10·0.4 + 0·0.5 = 5 + 4 + 0 = 9.", why: { "20": "That is the plain average of 50, 10 and 0: the probabilities are missing.", "60": "That is the sum of the values, not the expected value." } },
    { card: "A normal hit does 10 damage. A critical hit (probability 1/4) does 30 damage.", goal: "Expected damage per hit?", answer: "15", choices: C(["15", "20", "40", "30"]),
      good: "10·3/4 + 30·1/4 = 7.5 + 7.5 = 15.", why: { "20": "That is the plain average of 10 and 30: a critical hit is rarer." } },
    { card: "A lucky wheel: pay 3 coins, spin 10 equal parts, one part wins 20 coins.", goal: "Expected gain per spin?", answer: "−1 coin", choices: C(["−1 coin", "+17 coins", "0 coins", "+2 coins"]),
      good: "E(win) = 20/10 = 2; gain = 2 − 3 = −1. Not fair for the player: a fair price is 2 coins.", why: { "+2 coins": "That is E(win). Take away the price of 3 coins." } },
    { card: "A rare pet drops from an enemy with probability 1/25.", goal: "How many enemies on average for one pet?", answer: "25", choices: C(["25", "12", "1", "24"]),
      good: "On average 1/p = 25 enemies. Some players need many more." },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 2, animMs: 700, intro: "Round 1 is the story of the lesson: the first die is already a 5." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "All rooms are done: you know the odds of the loot and the hits!" : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
