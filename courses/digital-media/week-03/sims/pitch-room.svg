<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="470" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="21" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Pitch Room: build a premise</text>
<text x="24.0" y="56.0" font-size="12" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">Choose one card in each row, so that the premise fits the brief. Then pitch it.</text>
<text x="24.0" y="84.0" font-size="13" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Brief 1 / 3: Rooftop Rescue</text>
<rect x="24.0" y="94.0" width="592.0" height="40.0" rx="10" fill="#fff0f6" stroke="#F783AC" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="36.0" y="119.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">A mobile puzzle game. Levels of 3 minutes. A flooded city. The player slides blocks.</text>
<text x="24.0" y="165.0" font-size="11.5" fill="#6b726e" text-anchor="start" font-weight="800" xml:space="preserve">Inciting incident</text>
<rect x="150.0" y="146.0" width="228.0" height="28.0" rx="9" fill="#9C36B5" stroke="#9C36B5" stroke-width="1.5"/>
<text x="264.0" y="164.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">When the river floods the old city,</text>
<rect x="386.0" y="146.0" width="228.0" height="28.0" rx="9" fill="#ffffff" stroke="#9C36B5" stroke-width="1.5"/>
<text x="500.0" y="164.5" font-size="11" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">When nothing special happens,</text>
<text x="24.0" y="203.0" font-size="11.5" fill="#6b726e" text-anchor="start" font-weight="800" xml:space="preserve">Character</text>
<rect x="150.0" y="184.0" width="228.0" height="28.0" rx="9" fill="#9C36B5" stroke="#9C36B5" stroke-width="1.5"/>
<text x="264.0" y="202.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Nour, a young boat driver,</text>
<rect x="386.0" y="184.0" width="228.0" height="28.0" rx="9" fill="#ffffff" stroke="#9C36B5" stroke-width="1.5"/>
<text x="500.0" y="202.5" font-size="11" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">the city</text>
<text x="24.0" y="241.0" font-size="11.5" fill="#6b726e" text-anchor="start" font-weight="800" xml:space="preserve">Goal</text>
<rect x="150.0" y="222.0" width="228.0" height="28.0" rx="9" fill="#9C36B5" stroke="#9C36B5" stroke-width="1.5"/>
<text x="264.0" y="240.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">must lead the families to the hill</text>
<rect x="386.0" y="222.0" width="228.0" height="28.0" rx="9" fill="#ffffff" stroke="#9C36B5" stroke-width="1.5"/>
<text x="500.0" y="240.5" font-size="11" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">must win a car race</text>
<text x="24.0" y="279.0" font-size="11.5" fill="#6b726e" text-anchor="start" font-weight="800" xml:space="preserve">Stakes</text>
<rect x="150.0" y="260.0" width="228.0" height="28.0" rx="9" fill="#9C36B5" stroke="#9C36B5" stroke-width="1.5"/>
<text x="264.0" y="278.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">before night falls, or…</text>
<rect x="386.0" y="260.0" width="228.0" height="28.0" rx="9" fill="#ffffff" stroke="#9C36B5" stroke-width="1.5"/>
<text x="500.0" y="278.5" font-size="11" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">or something bad happens,</text>
<text x="24.0" y="317.0" font-size="11.5" fill="#6b726e" text-anchor="start" font-weight="800" xml:space="preserve">Obstacle</text>
<rect x="150.0" y="298.0" width="228.0" height="28.0" rx="9" fill="#9C36B5" stroke="#9C36B5" stroke-width="1.5"/>
<text x="264.0" y="316.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">but floating cars block the streets.</text>
<rect x="386.0" y="298.0" width="228.0" height="28.0" rx="9" fill="#ffffff" stroke="#9C36B5" stroke-width="1.5"/>
<text x="500.0" y="316.5" font-size="11" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">but a dragon attacks.</text>
<text x="24.0" y="355.0" font-size="11.5" fill="#6b726e" text-anchor="start" font-weight="800" xml:space="preserve">Player action</text>
<rect x="150.0" y="336.0" width="228.0" height="28.0" rx="9" fill="#9C36B5" stroke="#9C36B5" stroke-width="1.5"/>
<text x="264.0" y="354.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">slides the blocks to open a path</text>
<rect x="386.0" y="336.0" width="228.0" height="28.0" rx="9" fill="#ffffff" stroke="#9C36B5" stroke-width="1.5"/>
<text x="500.0" y="354.5" font-size="11" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">shoots enemies</text>
<rect x="24.0" y="380.0" width="592.0" height="50.0" rx="10" fill="#f8f0fc" stroke="none" stroke-width="1.5"/>
<rect x="24.0" y="380.0" width="5.0" height="50.0" rx="2" fill="#9C36B5" stroke="none" stroke-width="1.5"/>
<text x="36.0" y="400.0" font-size="11" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">When the river floods the old city, Nour, a young boat driver, must lead the families on the</text>
<text x="36.0" y="417.0" font-size="11" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">rooftops to the hill before night falls, but floating cars and boxes block the streets…</text>
<rect x="24.0" y="438.0" width="110.0" height="28.0" rx="9" fill="#9C36B5" stroke="#9C36B5" stroke-width="1.5"/>
<text x="79.0" y="456.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Pitch it</text>
</svg>
