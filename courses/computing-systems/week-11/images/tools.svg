<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Five network tools and the question each one answers</text>
<rect x="14" y="60" width="122" height="136" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<rect x="24" y="74" width="102" height="30" rx="6" fill="#1e1e2e"/>
<text x="75" y="94" font-size="12.5" fill="#ffd43b" text-anchor="middle" font-weight="700" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">ipconfig</text>
<text x="75" y="130" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">What is my</text>
<text x="75" y="145.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">address and my</text>
<text x="75" y="161.2" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">gateway?</text>
<rect x="147" y="60" width="122" height="136" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<rect x="157" y="74" width="102" height="30" rx="6" fill="#1e1e2e"/>
<text x="208" y="94" font-size="12.5" fill="#ffd43b" text-anchor="middle" font-weight="700" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">ping</text>
<text x="208" y="130" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Can I reach it?</text>
<text x="208" y="145.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">How fast? Lost</text>
<text x="208" y="161.2" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">packets?</text>
<rect x="280" y="60" width="122" height="136" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<rect x="290" y="74" width="102" height="30" rx="6" fill="#1e1e2e"/>
<text x="341" y="94" font-size="12.5" fill="#ffd43b" text-anchor="middle" font-weight="700" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">tracert</text>
<text x="341" y="130" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Where on the</text>
<text x="341" y="145.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">way is the delay?</text>
<rect x="413" y="60" width="122" height="136" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<rect x="423" y="74" width="102" height="30" rx="6" fill="#1e1e2e"/>
<text x="474" y="94" font-size="12.5" fill="#ffd43b" text-anchor="middle" font-weight="700" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">nslookup</text>
<text x="474" y="130" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Does the name</text>
<text x="474" y="145.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">give an IP</text>
<text x="474" y="161.2" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">address?</text>
<rect x="546" y="60" width="122" height="136" rx="10" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<rect x="556" y="74" width="102" height="30" rx="6" fill="#1e1e2e"/>
<text x="607" y="94" font-size="12.5" fill="#ffd43b" text-anchor="middle" font-weight="700" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">speed test</text>
<text x="607" y="130" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">How much</text>
<text x="607" y="145.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">bandwidth do I</text>
<text x="607" y="161.2" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">have?</text>
<text x="340" y="228" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Windows: open Command Prompt (cmd). macOS and Linux: Terminal (ifconfig or ip a, traceroute).</text>
</svg>
