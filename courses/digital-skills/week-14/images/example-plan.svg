<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">An example plan: Canteen sales</text>
<rect x="20" y="50" width="640" height="38" rx="0" fill="#D9480F"/>
<text x="30" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">part</text>
<text x="140" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">plan</text>
<text x="30" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">question</text>
<text x="140" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">What sells most in the canteen, by money and by count?</text>
<rect x="20" y="126" width="640" height="38" rx="0" fill="#f8f9fa"/>
<text x="30" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">data</text>
<text x="140" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">20 rows: week, item, quantity, price; Total = Qty × Price</text>
<text x="30" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">chart</text>
<text x="140" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a column chart of the total by item</text>
<rect x="20" y="202" width="640" height="38" rx="0" fill="#f8f9fa"/>
<text x="30" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">report</text>
<text x="140" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Introduction, The data, Results, What I learned, AI use</text>
<text x="30" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">talk</text>
<text x="140" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">5 slides: title, question, chart, two insights, thanks</text>
<rect x="20" y="50" width="640" height="228" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
