<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">One job, three apps: Huda&#x27;s monthly report</text>
<rect x="20" y="52" width="206" height="196" rx="12" fill="#ffffff"/>
<rect x="20" y="52" width="206" height="40" rx="12" fill="#2b579a"/>
<rect x="20" y="78" width="206" height="14" rx="0" fill="#2b579a"/>
<rect x="20" y="52" width="206" height="196" rx="12" fill="none" stroke="#2b579a" stroke-width="2.2"/>
<text x="123" y="78" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Word</text>
<text x="123" y="120" font-size="14" fill="#2b579a" text-anchor="middle" font-weight="800" xml:space="preserve">for words</text>
<text x="123" y="156" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">a report of one or two pages</text>
<text x="123" y="184" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">headings, a table, a chart</text>
<text x="123" y="212" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">file: report.docx</text>
<rect x="238" y="52" width="206" height="196" rx="12" fill="#ffffff"/>
<rect x="238" y="52" width="206" height="40" rx="12" fill="#217346"/>
<rect x="238" y="78" width="206" height="14" rx="0" fill="#217346"/>
<rect x="238" y="52" width="206" height="196" rx="12" fill="none" stroke="#217346" stroke-width="2.2"/>
<text x="341" y="78" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Excel</text>
<text x="341" y="120" font-size="14" fill="#217346" text-anchor="middle" font-weight="800" xml:space="preserve">for numbers</text>
<text x="341" y="156" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the data, formulas, totals</text>
<text x="341" y="184" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">a PivotTable and a chart</text>
<text x="341" y="212" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">file: sales.xlsx</text>
<rect x="456" y="52" width="206" height="196" rx="12" fill="#ffffff"/>
<rect x="456" y="52" width="206" height="40" rx="12" fill="#c43e1c"/>
<rect x="456" y="78" width="206" height="14" rx="0" fill="#c43e1c"/>
<rect x="456" y="52" width="206" height="196" rx="12" fill="none" stroke="#c43e1c" stroke-width="2.2"/>
<text x="559" y="78" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">PowerPoint</text>
<text x="559" y="120" font-size="14" fill="#c43e1c" text-anchor="middle" font-weight="800" xml:space="preserve">for showing</text>
<text x="559" y="156" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">a short talk with slides</text>
<text x="559" y="184" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">few words, big pictures</text>
<text x="559" y="212" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">file: talk.pptx</text>
<text x="340" y="276" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Each app does its own job; the content moves between them.</text>
</svg>
