<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Cannon Cove</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Cannon Cove: local, world and camera space</h1>
  <p class="hint">The cannon sits on the ship at <b>(2, 1) in the ship's local space</b>. The ship's matrix puts it into the world. The camera then measures everything from its own position.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const SHIP = [[-2, -1], [3, -1], [4, 0.5], [-2.5, 0.5]];
  // ship: [x, y, angle]; cam: camera position
  const rounds = [
    { ship: [10, 4, 0], goal: "The ship stands at <b>(10, 4)</b> and is not turned. Where is the cannon in the world?", choices: C(["(12, 5)", "(2, 1)", "(8, 3)", "(20, 4)"]), answer: "(12, 5)",
      good: "Local (2, 1) + ship position (10, 4) = (12, 5).", why: { "(2, 1)": "That is the local position, measured on the ship.", "(8, 3)": "Add the ship's position; do not subtract it." } },
    { ship: [10, 4, 90], goal: "Now the ship is turned by <b>90°</b> and stands at <b>(10, 4)</b>. Where is the cannon?", choices: C(["(9, 6)", "(12, 5)", "(11, 2)", "(8, 6)"]), answer: "(9, 6)",
      good: "First rotate: R(90°) × (2, 1) = (−1, 2). Then translate: + (10, 4) = (9, 6).", why: { "(12, 5)": "The turn is missing: rotate (2, 1) first.", "(11, 2)": "That is a turn of −90° (clockwise)." } },
    { ship: [10, 4, 90], goal: "Which 3 × 3 matrix M = T × R puts the turned ship into the world?",
      choices: C(["rows (0, −1, 10), (1, 0, 4), (0, 0, 1)", "rows (1, 0, 10), (0, 1, 4), (0, 0, 1)", "rows (0, −1, 4), (1, 0, 10), (0, 0, 1)"]), answer: "rows (0, −1, 10), (1, 0, 4), (0, 0, 1)",
      good: "R(90°) in the top-left 2 × 2, the position (10, 4) in the last column.", why: { "rows (1, 0, 10), (0, 1, 4), (0, 0, 1)": "This one only translates; the 90° turn is missing." } },
    { ship: [10, 4, 90], cam: [8, 3], goal: "The camera stands at <b>(8, 3)</b> and is not turned. The cannon is at (9, 6) in the world. Where is it in camera space?", choices: C(["(1, 3)", "(17, 9)", "(−1, −3)", "(9, 6)"]), answer: "(1, 3)",
      good: "Camera space measures from the camera: (9, 6) − (8, 3) = (1, 3).", why: { "(17, 9)": "Subtract the camera position; do not add it.", "(−1, −3)": "World minus camera, not camera minus world." } },
    { ship: [10, 4, 90], dir: true, goal: "The cannon fires along local <b>(1, 0)</b>: a direction, w = 0. Which way does it fire in the world (turned ship)?", choices: C(["(0, 1)", "(10, 5)", "(1, 0)", "(11, 4)"]), answer: "(0, 1)",
      good: "A direction has w = 0: the translation is ignored. R(90°) × (1, 0) = (0, 1): straight up.", why: { "(10, 5)": "That adds the ship's position; a direction must not move.", "(1, 0)": "The direction turns with the ship." } },
  ];
  Kit.game({
    rounds, cols: 1, colsPhone: 1, animMs: 900, still: true,
    intro: "Round 1 is the story of the lesson: the ship in the harbour of Cannon Cove.",
    canvas: (W) => Math.min(300, W * 0.6),
    draw(c, W, H, now, r, st) {
      const G = Kit.grid(c, W, H, -1, 15, -1, 9, { step: 2, bg: "#e7f5ff", grid: "#d0ebff", axis: "#74c0fc" });
      if (!r) return;
      const a = r.ship[2] * Math.PI / 180, tr = (p, w = 1) => [Math.cos(a) * p[0] - Math.sin(a) * p[1] + r.ship[0] * w, Math.sin(a) * p[0] + Math.cos(a) * p[1] + r.ship[1] * w];
      c.beginPath(); SHIP.map((p) => tr(p)).forEach((p, i) => (i ? c.lineTo(G.X(p[0]), G.Y(p[1])) : c.moveTo(G.X(p[0]), G.Y(p[1])))); c.closePath();
      c.fillStyle = "#a0522d"; c.fill();
      const o = tr([0, 0]); c.fillStyle = "#fff"; c.beginPath(); c.arc(G.X(o[0]), G.Y(o[1]), 4, 0, 7); c.fill();
      if (st.done && st.ok) {
        const p = tr([2, 1]); c.fillStyle = "#212529"; c.beginPath(); c.arc(G.X(p[0]), G.Y(p[1]), 7, 0, 7); c.fill();
        if (r.dir) { const d = tr([1, 0], 0); Kit.arrow(c, G.X(p[0]), G.Y(p[1]), G.X(p[0] + d[0] * 2), G.Y(p[1] + d[1] * 2), "#e8590c", 3, 10); }
      }
      if (r.cam) { Kit.rrect(c, G.X(r.cam[0]) - 10, G.Y(r.cam[1]) - 7, 20, 14, 3, "#7048e8"); Kit.text(c, "camera", G.X(r.cam[0]), G.Y(r.cam[1]) + 22, 11, "#7048e8"); }
    },
  });
})();
</script>
</body>
</html>
