<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="340" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A 4 GB phone: the RAM is full, the OS closes a background app</text>
<rect x="40" y="74" width="207" height="50" rx="6" fill="#868e96"/>
<text x="145" y="97" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">OS</text>
<text x="145" y="114" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">1.5 GB</text>
<rect x="250" y="74" width="249" height="50" rx="6" fill="#A86700"/>
<text x="376" y="97" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Pocket Quest (background)</text>
<text x="376" y="114" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">1.8 GB</text>
<rect x="502" y="74" width="123" height="50" rx="6" fill="#1c7ed6"/>
<text x="565" y="97" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Camera</text>
<text x="565" y="114" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">0.9 GB</text>
<rect x="40" y="68" width="560" height="62" rx="8" fill="none" stroke="#c92a2a" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="600" y="62" font-size="12.5" fill="#c92a2a" text-anchor="end" font-weight="800" xml:space="preserve">RAM: 4 GB</text>
<text x="636" y="96" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">4.2 GB is</text>
<text x="636" y="114" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">more than 4</text>
<line x1="340" y1="140" x2="340" y2="163.4" stroke="#6b726e" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="340,172 335.2,162.5 344.8,162.5" fill="#6b726e"/>
<rect x="40" y="180" width="207" height="50" rx="6" fill="#868e96"/>
<text x="145" y="210" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">OS</text>
<rect x="250" y="180" width="221" height="50" rx="6" fill="#e9ecef" stroke="#ced4da" stroke-width="1.4"/>
<text x="362" y="210" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">free 1.6 GB</text>
<rect x="474" y="180" width="123" height="50" rx="6" fill="#1c7ed6"/>
<text x="537" y="210" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Camera</text>
<text x="40" y="262" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Phone (Android, iOS): the OS closes the background game to free RAM.</text>
<text x="40" y="284" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">When the player comes back, the game starts again: it must save its state.</text>
<text x="40" y="312" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">PC (Windows): the OS moves memory to the page file on the drive. Nothing closes, but it gets slow.</text>
</svg>
