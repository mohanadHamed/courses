<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="700" height="340" fill="#ffffff"/>
<text x="350" y="34" font-size="17" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Revise: read it aloud, then cut</text>
<rect x="20" y="52" width="400" height="270" rx="10" fill="#fff" stroke="#dee2e6" stroke-width="1.5"/>
<text x="36" y="80" font-size="12" fill="#6b726e" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">SALMA: Hello, Nour. How is your mother?</text>
<line x1="32" y1="76" x2="316.8" y2="76" stroke="#c92a2a" stroke-width="2" stroke-linecap="round"/>
<text x="36" y="110" font-size="12" fill="#6b726e" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">NOUR: She's fine. She's at the hill.</text>
<line x1="32" y1="106" x2="295.2" y2="106" stroke="#c92a2a" stroke-width="2" stroke-linecap="round"/>
<text x="36" y="140" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">SALMA: I am not going. Fifty years I have</text>
<text x="36" y="170" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">lived in this house.</text>
<text x="36" y="200" font-size="12" fill="#6b726e" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">NOUR: As you know, the river has flooded</text>
<line x1="32" y1="196" x2="324" y2="196" stroke="#c92a2a" stroke-width="2" stroke-linecap="round"/>
<text x="36" y="230" font-size="12" fill="#6b726e" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">the whole old city.</text>
<line x1="32" y1="226" x2="172.8" y2="226" stroke="#c92a2a" stroke-width="2" stroke-linecap="round"/>
<text x="36" y="260" font-size="12" fill="#6b726e" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">NOUR: I am very scared and very sad.</text>
<line x1="32" y1="256" x2="295.2" y2="256" stroke="#c92a2a" stroke-width="2" stroke-linecap="round"/>
<text x="36" y="290" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Menlo, Consolas, monospace" xml:space="preserve">The water reaches the door below.</text>
<text x="446" y="76" font-size="15" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Checklist</text>
<rect x="446" y="93" width="16" height="16" rx="4" fill="#fff" stroke="#9C36B5" stroke-width="2"/>
<path d="M449 101 l4 5 l7 -9" fill="none" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="106" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Does something change?</text>
<rect x="446" y="123" width="16" height="16" rx="4" fill="#fff" stroke="#9C36B5" stroke-width="2"/>
<path d="M449 131 l4 5 l7 -9" fill="none" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="136" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Can a line be cut?</text>
<rect x="446" y="153" width="16" height="16" rx="4" fill="#fff" stroke="#9C36B5" stroke-width="2"/>
<path d="M449 161 l4 5 l7 -9" fill="none" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="166" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">No "as you know"?</text>
<rect x="446" y="183" width="16" height="16" rx="4" fill="#fff" stroke="#9C36B5" stroke-width="2"/>
<path d="M449 191 l4 5 l7 -9" fill="none" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="196" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Feelings shown, not said?</text>
<rect x="446" y="213" width="16" height="16" rx="4" fill="#fff" stroke="#9C36B5" stroke-width="2"/>
<path d="M449 221 l4 5 l7 -9" fill="none" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="226" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Each voice different?</text>
<rect x="446" y="243" width="16" height="16" rx="4" fill="#fff" stroke="#9C36B5" stroke-width="2"/>
<path d="M449 251 l4 5 l7 -9" fill="none" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="256" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Format right?</text>
<rect x="446" y="273" width="16" height="16" rx="4" fill="#fff" stroke="#9C36B5" stroke-width="2"/>
<path d="M449 281 l4 5 l7 -9" fill="none" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="286" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Fits its beat and length?</text>
</svg>
