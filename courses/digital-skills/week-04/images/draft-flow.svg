<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A first draft with AI: four steps</text>
<rect x="20" y="60" width="150" height="180" rx="12" fill="#ffffff" stroke="#D9480F" stroke-width="2"/>
<circle cx="40" cy="82" r="13" fill="#D9480F"/>
<text x="40" y="87" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<text x="60" y="87" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Prompt</text>
<text x="34" y="112" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Task, context,</text>
<text x="34" y="128.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">format: “Write a</text>
<text x="34" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">notice: the office</text>
<text x="34" y="160.8" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">closes Thursday at</text>
<text x="34" y="177" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">1 pm. 3 short</text>
<text x="34" y="193.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">lines.”</text>
<line x1="171" y1="150" x2="176.8" y2="150" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="184,150 176,154 176,146" fill="#6b726e"/>
<rect x="185" y="60" width="150" height="180" rx="12" fill="#ffffff" stroke="#D9480F" stroke-width="2"/>
<circle cx="205" cy="82" r="13" fill="#D9480F"/>
<text x="205" y="87" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<text x="225" y="87" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">AI draft</text>
<text x="199" y="112" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">The AI writes a</text>
<text x="199" y="128.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">first draft in a few</text>
<text x="199" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">seconds.</text>
<line x1="336" y1="150" x2="341.8" y2="150" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="349,150 341,154 341,146" fill="#6b726e"/>
<rect x="350" y="60" width="150" height="180" rx="12" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/>
<circle cx="370" cy="82" r="13" fill="#c92a2a"/>
<text x="370" y="87" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<text x="390" y="87" font-size="14" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Check</text>
<text x="364" y="112" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Read it. Is every</text>
<text x="364" y="128.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">fact true? Delete</text>
<text x="364" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">what nobody said.</text>
<line x1="501" y1="150" x2="506.8" y2="150" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="514,150 506,154 506,146" fill="#6b726e"/>
<rect x="515" y="60" width="150" height="180" rx="12" fill="#ffffff" stroke="#D9480F" stroke-width="2"/>
<circle cx="535" cy="82" r="13" fill="#D9480F"/>
<text x="535" y="87" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<text x="555" y="87" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Word</text>
<text x="529" y="112" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Paste with Keep</text>
<text x="529" y="128.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Text Only. Then use</text>
<text x="529" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the styles Title and</text>
<text x="529" y="160.8" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Heading 1.</text>
<text x="340" y="274" font-size="13" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">The AI writes fast. You are responsible for every word you keep.</text>
</svg>
