<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Drop Rate Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 5px 0; font-weight: 700; font-size: .92rem; }
    .sim .task { font-weight: 800; color: var(--sim-accent); margin: 6px 0 0; }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Drop Rate Lab: how long do players wait?</h1>
  <p class="hint">The golden torch of <i>Torch Hall</i> drops from bats. Set the drop rate and, if you want, a pity timer. The curve shows the share of players who have the torch after n bats; the bars show 1000 simulated players.</p>
  <div class="bar" id="sl"></div>
  <label class="bar"><input type="checkbox" id="pity"> Pity timer: the torch is guaranteed at bat number <span id="pn">40</span></label>
  <div class="bar"><button type="button" id="sim">Simulate 1000 players ▶</button></div>
  <canvas id="c" aria-label="The share of players with the torch after n bats"></canvas>
  <p class="calc" id="calc"></p>
  <p class="task" id="task"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const s = { p: 5, pity: false, cap: 40, sims: null };
  const TASKS = [
    { q: "Task 1: With a drop rate of 5 %, after how many bats do 90 % of the players have the torch?", ok: () => s.p === 5 && s.sims },
    { q: "Task 2: The designer wants 90 % of players to have it within 20 bats. Find the drop rate.", ok: () => n90() <= 20 && n90() >= 18 },
    { q: "Task 3: Keep 5 %, switch on a pity timer at 40 bats. What is the longest wait now?", ok: () => s.p === 5 && s.pity && s.sims },
  ];
  let ti = 0, ready = false;
  const P = () => s.p / 100;
  const atLeast = (n) => (s.pity && n >= s.cap ? 1 : 1 - Math.pow(1 - P(), n));
  const nFor = (lvl) => { for (let n = 1; n <= 2000; n++) if (atLeast(n) >= lvl) return n; return Infinity; };
  const n90 = () => nFor(0.9);
  Kit.slider($("sl"), "Drop rate", 1, 30, 1, s.p, (v) => { s.p = v; s.sims = null; if (ready) upd(); }, (v) => v + " %");
  const capIn = Kit.slider($("sl"), "Pity at", 10, 80, 5, s.cap, (v) => { s.cap = v; $("pn").textContent = v; s.sims = null; if (ready) upd(); });
  $("pity").addEventListener("change", (e) => { s.pity = e.target.checked; s.sims = null; upd(); });
  $("sim").addEventListener("click", () => {
    s.sims = Array.from({ length: 1000 }, () => { let n = 0; for (;;) { n++; if (Math.random() < P() || (s.pity && n >= s.cap)) return n; } });
    upd();
  });
  function upd() {
    const avg = s.sims ? s.sims.reduce((a, b) => a + b, 0) / s.sims.length : null, worst = s.sims ? Math.max(...s.sims) : null;
    $("calc").textContent = `average 1/p = ${Kit.fmt(1 / P(), 1)} bats (without pity) · 50 % after ${nFor(0.5)} · 90 % after ${n90()}` + (s.sims ? ` · simulated: average ${Kit.fmt(avg, 1)}, longest wait ${worst}` : "");
    let m = "";
    while (ti < TASKS.length && TASKS[ti].ok()) { ti++; m = "✓ Done. "; Kit.good(); }
    $("task").textContent = ti < TASKS.length ? TASKS[ti].q : "All tasks are done: the drop rate sets the average, the pity timer cuts off the long waits.";
    $("msg").textContent = m + (s.pity ? "With the pity timer nobody waits longer than the cap." : "Without a pity timer, a few unlucky players wait very long.");
    paint();
  }
  const cv = Kit.canvas($("c"), (W) => Math.min(260, W * 0.5));
  function paint() {
    const c = cv.ctx, W = cv.W, H = cv.H, x0 = 40, x1 = W - 10, y0 = 10, y1 = H - 24, N = 100, X = (n) => x0 + (x1 - x0) * n / N, Y = (v) => y1 - (y1 - y0) * v;
    c.clearRect(0, 0, W, H);
    c.strokeStyle = "#adb5bd"; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0, y1); c.lineTo(x1, y1); c.stroke();
    [0, 20, 40, 60, 80, 100].forEach((n) => Kit.text(c, n, X(n), y1 + 15, 10, "#868e96"));
    [0, 0.5, 1].forEach((v) => Kit.text(c, v * 100 + " %", x0 - 4, Y(v) + 4, 10, "#868e96", "right", 700));
    if (s.sims) {
      const cnt = Array(N + 1).fill(0); s.sims.forEach((n) => { cnt[Math.min(N, n)]++; });
      const mx = Math.max(...cnt);
      cnt.forEach((k, n) => { if (!k) return; c.fillStyle = "rgba(116,192,252,.6)"; const h = (y1 - y0) * 0.6 * k / mx; c.fillRect(X(n) - 2, y1 - h, 4, h); });
    }
    c.strokeStyle = "#2F9E44"; c.lineWidth = 2.5; c.beginPath(); for (let n = 0; n <= N; n++) (n ? c.lineTo(X(n), Y(atLeast(n))) : c.moveTo(X(0), Y(0))); c.stroke();
    [[0.5, "#1c7ed6"], [0.9, "#e8590c"]].forEach(([lvl, col]) => { const n = nFor(lvl); if (n > N) return; c.strokeStyle = col; c.setLineDash([5, 4]); c.lineWidth = 1.4; c.beginPath(); c.moveTo(x0, Y(lvl)); c.lineTo(X(n), Y(lvl)); c.lineTo(X(n), y1); c.stroke(); c.setLineDash([]); Kit.text(c, `${lvl * 100} %: ${n}`, X(n) + 4, Y(lvl) + 14, 11, col, "left"); });
  }
  window.addEventListener("resize", () => setTimeout(paint, 60));
  window.DR = { set: (o) => { if (o.p) { const i = document.querySelector("#sl input"); i.value = o.p; i.dispatchEvent(new Event("input")); } if (o.pity !== undefined) { $("pity").checked = o.pity; s.pity = o.pity; s.sims = null; upd(); } }, sim: () => $("sim").click() };
  ready = true; upd();
})();
</script>
</body>
</html>
