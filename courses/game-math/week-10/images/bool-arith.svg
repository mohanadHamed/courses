<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="280" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Boolean algebra: true = 1, false = 0</text>
<rect x="30" y="56" width="590" height="38" rx="0" fill="#2F9E44"/>
<text x="40" y="79.9" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">operator</text>
<text x="260" y="79.9" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">as numbers</text>
<text x="480" y="79.9" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">examples</text>
<text x="40" y="117.9" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">NOT p</text>
<text x="260" y="117.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1 − p</text>
<text x="480" y="117.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">NOT 1 = 0, NOT 0 = 1</text>
<rect x="30" y="132" width="590" height="38" rx="0" fill="#f8f9fa"/>
<text x="40" y="155.9" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">p AND q</text>
<text x="260" y="155.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p × q</text>
<text x="480" y="155.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1 × 1 = 1, 1 × 0 = 0</text>
<text x="40" y="193.9" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">p OR q</text>
<text x="260" y="193.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">p + q (1 + 1 = 1)</text>
<text x="480" y="193.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1 + 0 = 1, 0 + 0 = 0</text>
<rect x="30" y="56" width="590" height="152" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="30" y="240" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">AND behaves like multiplication, OR like addition with a top of 1.</text>
</svg>
