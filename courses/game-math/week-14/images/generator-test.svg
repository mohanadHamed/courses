<text x="387.5" y="245" font-size="10" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">36–39</text>
<text x="230" y="264" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">path length from start to exit (tiles)</text>
