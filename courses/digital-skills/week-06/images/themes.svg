<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="240" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">One slide, three themes (Design tab)</text>
<rect x="20" y="56" width="200" height="112.5" rx="4" fill="#fff4e6" stroke="#ced4da" stroke-width="1.2"/>
<rect x="20" y="56" width="200" height="4.5" rx="0" fill="#D9480F"/>
<text x="32" y="78.5" font-size="12" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">New shop hours</text>
<text x="32" y="96.5" font-size="8.4" fill="#2a211c" text-anchor="start" font-weight="600" xml:space="preserve">• Friday: closed</text>
<text x="32" y="108.5" font-size="8.4" fill="#2a211c" text-anchor="start" font-weight="600" xml:space="preserve">• Saturday: 10–18</text>
<text x="120" y="192" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">Sunrise</text>
<rect x="240" y="56" width="200" height="112.5" rx="4" fill="#e7f5ff" stroke="#ced4da" stroke-width="1.2"/>
<rect x="240" y="56" width="200" height="4.5" rx="0" fill="#1c7ed6"/>
<text x="252" y="78.5" font-size="12" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">New shop hours</text>
<text x="252" y="96.5" font-size="8.4" fill="#1d1b2e" text-anchor="start" font-weight="600" xml:space="preserve">• Friday: closed</text>
<text x="252" y="108.5" font-size="8.4" fill="#1d1b2e" text-anchor="start" font-weight="600" xml:space="preserve">• Saturday: 10–18</text>
<text x="340" y="192" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">Sky</text>
<rect x="460" y="56" width="200" height="112.5" rx="4" fill="#212529" stroke="#ced4da" stroke-width="1.2"/>
<rect x="460" y="56" width="200" height="4.5" rx="0" fill="#fab005"/>
<text x="472" y="78.5" font-size="12" fill="#fab005" text-anchor="start" font-weight="800" xml:space="preserve">New shop hours</text>
<text x="472" y="96.5" font-size="8.4" fill="#f8f9fa" text-anchor="start" font-weight="600" xml:space="preserve">• Friday: closed</text>
<text x="472" y="108.5" font-size="8.4" fill="#f8f9fa" text-anchor="start" font-weight="600" xml:space="preserve">• Saturday: 10–18</text>
<text x="560" y="192" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">Night</text>
<text x="340" y="224" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">A theme changes colours and fonts on all slides at once: the talk looks like one piece.</text>
</svg>
