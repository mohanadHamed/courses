<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Five checks before you hand in your work</text>
<rect x="20" y="64" width="120" height="150" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="80" y="100" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">1 Name</text>
<text x="80" y="130" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">date first, what</text>
<text x="80" y="146.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">it is</text>
<rect x="152" y="64" width="120" height="150" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="212" y="100" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">2 Place</text>
<text x="212" y="130" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the right folder</text>
<rect x="284" y="64" width="120" height="150" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="344" y="100" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">3 Facts</text>
<text x="344" y="130" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">AI text checked</text>
<rect x="416" y="64" width="120" height="150" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="476" y="100" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">4 Look</text>
<text x="476" y="130" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">styles, numbers,</text>
<text x="476" y="146.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">title</text>
<rect x="548" y="64" width="120" height="150" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="608" y="100" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">5 Share</text>
<text x="608" y="130" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the right people,</text>
<text x="608" y="146.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">right rights</text>
<text x="340" y="260" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">The same five checks fit a file in Word, Excel or PowerPoint.</text>
</svg>
