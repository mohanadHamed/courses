<text x="514" y="80" font-size="15" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">In C#</text>
<text x="512" y="100" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">¬p is !p</text>
<text x="512" y="140" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">p ∧ q is p &amp;&amp; q</text>
<text x="512" y="180" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">p ∨ q is p || q</text>
<text x="340" y="290" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">AND needs both; OR needs at least one; NOT turns the value round.</text>
