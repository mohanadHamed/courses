<text x="335" y="241.4" font-size="15" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">T</text>
<rect x="30" y="56" width="360" height="200" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<rect x="420" y="56" width="240" height="200" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="434" y="80" font-size="15" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Read it</text>
<text x="434" y="98" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">XOR: exactly one is true.</text>
<text x="434" y="140" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">p → q is false only when p is true</text>
<text x="434" y="156.9" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">and q is false (red).</text>
<text x="434" y="206" font-size="13" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">p → q has the same value as ¬p ∨</text>
<text x="434" y="222.9" font-size="13" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">q.</text>
