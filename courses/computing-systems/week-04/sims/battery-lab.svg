<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="440" fill="#ffffff"/>
<text x="16" y="30" font-size="19" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Battery Lab</text>
<text x="16" y="52" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">Choose the settings. How long does the battery last, and does the phone get hot?</text>
<text x="16" y="100" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Frame rate</text>
<rect x="150" y="78" width="78" height="34" rx="9" fill="#fff" stroke="#A86700" stroke-width="1.5"/>
<text x="189" y="100" font-size="13" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">30</text>
<rect x="236" y="78" width="78" height="34" rx="9" fill="#A86700" stroke="#A86700" stroke-width="1.5"/>
<text x="275" y="100" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">60</text>
<rect x="322" y="78" width="78" height="34" rx="9" fill="#fff" stroke="#A86700" stroke-width="1.5"/>
<text x="361" y="100" font-size="13" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">120</text>
<text x="16" y="150" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Brightness</text>
<rect x="150" y="128" width="78" height="34" rx="9" fill="#fff" stroke="#A86700" stroke-width="1.5"/>
<text x="189" y="150" font-size="13" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">low</text>
<rect x="236" y="128" width="78" height="34" rx="9" fill="#A86700" stroke="#A86700" stroke-width="1.5"/>
<text x="275" y="150" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">high</text>
<text x="16" y="200" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Graphics</text>
<rect x="150" y="178" width="78" height="34" rx="9" fill="#A86700" stroke="#A86700" stroke-width="1.5"/>
<text x="189" y="200" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">low</text>
<rect x="236" y="178" width="78" height="34" rx="9" fill="#fff" stroke="#A86700" stroke-width="1.5"/>
<text x="275" y="200" font-size="13" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">high</text>
<text x="16" y="250" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">GPS</text>
<rect x="150" y="228" width="78" height="34" rx="9" fill="#A86700" stroke="#A86700" stroke-width="1.5"/>
<text x="189" y="250" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">off</text>
<rect x="236" y="228" width="78" height="34" rx="9" fill="#fff" stroke="#A86700" stroke-width="1.5"/>
<text x="275" y="250" font-size="13" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">on</text>
<rect x="16" y="286" width="608" height="26" rx="8" fill="#e9ecef" stroke="none" stroke-width="1.5"/>
<rect x="16" y="286" width="365" height="26" rx="8" fill="#A86700" stroke="none" stroke-width="1.5"/>
<text x="26" y="304" font-size="12.5" fill="#fff" text-anchor="start" font-weight="800" xml:space="preserve">screen 400 · SoC 500 · other 100 = 1000 mA</text>
<rect x="16" y="326" width="195" height="60" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1.5"/>
<text x="28" y="348" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">current</text>
<text x="28" y="374" font-size="17" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">1000 mA</text>
<rect x="221" y="326" width="195" height="60" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1.5"/>
<text x="233" y="348" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">play time (5000 mAh)</text>
<text x="233" y="374" font-size="17" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">5 h</text>
<rect x="426" y="326" width="195" height="60" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1.5"/>
<text x="438" y="348" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">after 20 min</text>
<text x="438" y="374" font-size="17" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">warm, 60 fps</text>
<text x="16" y="414" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">A made-up model with round numbers, for the lesson.</text>
</svg>
