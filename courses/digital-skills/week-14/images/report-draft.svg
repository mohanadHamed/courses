<text x="40" y="268" font-size="13.5" fill="#2b579a" text-anchor="start" font-weight="800" xml:space="preserve">AI use</text>
<text x="40" y="286" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">AI drafted two sentences; I checked them.</text>
<rect x="440" y="50" width="220" height="256" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="454" y="74" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Checklist</text>
<text x="454" y="95.5" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Heading 1 for each part</text>
<text x="454" y="114.1" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the chart pasted from Excel</text>
