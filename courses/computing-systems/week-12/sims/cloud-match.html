<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Cloud Match</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #fff9db; border: 1.5px solid #A86700; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Cloud Match</h1>
  <p class="hint">Byte Bay and its partners need computing for different jobs. For each job, choose the cloud model or the kind of cloud that fits best.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const M = ["IaaS", "PaaS", "SaaS", "BaaS"], D = ["public cloud", "private cloud", "hybrid cloud", "own servers only"];
  const rounds = [
    { card: "The race server of Pocket Quest needs a special operating system setting. Byte Bay wants full control of the machine, but no hardware.", answer: "IaaS", choices: C(M), good: "IaaS: rent virtual machines and manage the OS yourself." },
    { card: "The leaderboard is a small web program. Byte Bay wants to upload only the code, with no OS updates.", answer: "PaaS", choices: C(M), good: "PaaS: the platform runs the OS and the runtime; you bring the code." },
    { card: "The team needs shared documents and a calendar in the browser.", answer: "SaaS", choices: C(M), good: "SaaS: a finished application; you only use it." },
    { card: "Player accounts, cloud saves and a leaderboard, ready through an SDK in the game engine.", answer: "BaaS", choices: C(M), good: "BaaS: ready game back-end services." },
    { card: "A partner bank must keep payment data only in its own data centre, for one organization.", answer: "private cloud", choices: C(D), good: "A private cloud serves one organization only." },
    { card: "Byte Bay keeps its build PCs in the office, and rents cloud servers only for launch peaks.", answer: "hybrid cloud", choices: C(D), good: "Hybrid: own servers and a public cloud together." },
  ];
  rounds.forEach((r) => { r.goal = "Which fits best?"; r.why = {}; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 2, animMs: 600, intro: "Round 1 is the story of the lesson: the race server of Pocket Quest." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "Every job has its cloud." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
