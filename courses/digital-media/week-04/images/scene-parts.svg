<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="700" height="300" fill="#ffffff"/>
<text x="350" y="34" font-size="17" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">A scene: one place, one time, one change</text>
<rect x="24" y="70" width="156" height="130" rx="12" fill="#fff" stroke="#9C36B5" stroke-width="2"/>
<circle cx="50" cy="98" r="14" fill="#9C36B5" stroke="none" stroke-width="1.5"/>
<text x="50" y="103" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<text x="70" y="103" font-size="13" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">place, time</text>
<text x="38" y="134" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">outside: a flooded</text>
<text x="38" y="152" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">street, at dusk</text>
<line x1="182" y1="135" x2="184.4" y2="135" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="190,135 183.7,138 183.7,132" fill="#6b726e" stroke="none" stroke-width="1.5"/>
<rect x="192" y="70" width="156" height="130" rx="12" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
<circle cx="218" cy="98" r="14" fill="#1c7ed6" stroke="none" stroke-width="1.5"/>
<text x="218" y="103" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<text x="238" y="103" font-size="13" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">goal</text>
<text x="206" y="134" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Nour wants to reach</text>
<text x="206" y="152" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the family</text>
<line x1="350" y1="135" x2="352.4" y2="135" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="358,135 351.7,138 351.7,132" fill="#6b726e" stroke="none" stroke-width="1.5"/>
<rect x="360" y="70" width="156" height="130" rx="12" fill="#fff" stroke="#e8590c" stroke-width="2"/>
<circle cx="386" cy="98" r="14" fill="#e8590c" stroke="none" stroke-width="1.5"/>
<text x="386" y="103" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<text x="406" y="103" font-size="13" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">obstacle</text>
<text x="374" y="134" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the water rises; no</text>
<text x="374" y="152" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">rescue boat comes</text>
<line x1="518" y1="135" x2="520.4" y2="135" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="526,135 519.7,138 519.7,132" fill="#6b726e" stroke="none" stroke-width="1.5"/>
<rect x="528" y="70" width="156" height="130" rx="12" fill="#fff" stroke="#2b8a3e" stroke-width="2"/>
<circle cx="554" cy="98" r="14" fill="#2b8a3e" stroke="none" stroke-width="1.5"/>
<text x="554" y="103" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<text x="574" y="103" font-size="13" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">turn</text>
<text x="542" y="134" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">she grabs the oars:</text>
<text x="542" y="152" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">she goes alone (the</text>
<text x="542" y="170" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">change)</text>
<text x="350" y="236" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">A new place or a new time starts a new scene with a new heading.</text>
<text x="350" y="260" font-size="13" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">If nothing changes in a scene, the player feels that nothing happened.</text>
</svg>
