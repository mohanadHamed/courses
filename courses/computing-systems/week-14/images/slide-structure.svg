<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="240" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Six slides, five minutes</text>
<rect x="20" y="64" width="98" height="70" rx="6" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="69" y="92" font-size="18" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<text x="69" y="156" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the game and</text>
<text x="69" y="170.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the question</text>
<rect x="128" y="64" width="98" height="70" rx="6" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="177" y="92" font-size="18" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<text x="177" y="156" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the platforms</text>
<text x="177" y="170.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">compared</text>
<rect x="236" y="64" width="98" height="70" rx="6" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="285" y="92" font-size="18" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<text x="285" y="156" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">specs and</text>
<text x="285" y="170.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">targets</text>
<rect x="344" y="64" width="98" height="70" rx="6" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="393" y="92" font-size="18" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<text x="393" y="156" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the test plan</text>
<rect x="452" y="64" width="98" height="70" rx="6" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="501" y="92" font-size="18" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">5</text>
<text x="501" y="156" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">risks and fixes</text>
<rect x="560" y="64" width="98" height="70" rx="6" fill="#ffffff" stroke="#A86700" stroke-width="2"/>
<text x="609" y="92" font-size="18" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">6</text>
<text x="609" y="156" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the</text>
<text x="609" y="170.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">recommendation</text>
<text x="340" y="226" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">About 50 seconds per slide; one message per slide; numbers with their source.</text>
</svg>
