<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="640" height="440" fill="#ffffff"/>
<text x="24" y="36" font-size="22" fill="#2a2f2c" text-anchor="start" font-weight="800">AI Chat: is this a good job for AI?</text>
<text x="24" y="60" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800">Prompt 3 of 7</text>
<text x="616" y="60" font-size="14" fill="#D9480F" text-anchor="end" font-weight="800">2 right</text>
<rect x="24" y="72" width="592" height="150" rx="14" fill="#fbfaf8" stroke="#d9d4cf" stroke-width="1.5"/>
<rect x="250" y="86" width="352" height="46" rx="14" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="264" y="106" font-size="13.5" fill="#fff" text-anchor="start" font-weight="700">When did Sunrise Company open</text>
<text x="264" y="124" font-size="13.5" fill="#fff" text-anchor="start" font-weight="700">its first shop?</text>
<rect x="38" y="146" width="360" height="60" rx="14" fill="#fff" stroke="#e3dcd5" stroke-width="1.5"/>
<text x="50" y="166" font-size="11" fill="#0b7285" text-anchor="start" font-weight="800">AI assistant</text>
<text x="50" y="188" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600">It opened its first shop in 2009 in Amman.</text>
<text x="24" y="252" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800">Before you press Send: is this a good job for an AI assistant?</text>
<rect x="24" y="266" width="592" height="36" rx="10" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="38" y="289" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Yes: read the answer, then use it</text>
<rect x="24" y="310" width="592" height="36" rx="10" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="38" y="333" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">AI can help, but check the facts and numbers</text>
<rect x="24" y="354" width="592" height="36" rx="10" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="38" y="377" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">No: do not type personal data into an AI tool</text>
<text x="24" y="422" font-size="13" fill="#2b8a3e" text-anchor="start" font-weight="700">The AI does not know a small company: the date may be invented.</text>
</svg>
