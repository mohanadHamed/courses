<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Shadow Cat</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .hud { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin: 0 0 8px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .sim .hud .lvl { color: var(--sim-accent); }
    .sim .hud .goal b { color: #e8590c; }
    .sim .hud .stars { margin-left: auto; }
    .sim .pad { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-top: 10px; }
    .sim table { border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; width: 100%; }
    .sim th, .sim td { border-bottom: 1px solid #eef0ee; padding: 4px 8px; text-align: left; font-size: 0.9rem; }
    .sim th { color: var(--sim-muted); font-weight: 700; }
    .sim .seen { color: #c92a2a; font-weight: 800; } .sim .safe { color: #2b8a3e; font-weight: 800; }
    .sim .message.bad { color: #c92a2a; }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Shadow Cat</h1>
  <p class="hint">The guard dog sees 60° to each side of its forward vector f (f̂ · d̂ ≥ 0.5) and at most 5 units away. Tap the bush that the dog <b>cannot</b> see. Work it out first: d = bush − dog.</p>
  <div class="hud">
    <span class="lvl" id="lvl">Round 1</span>
    <span class="goal" id="goal"></span>
    <span class="stars" id="stars">★ 0</span>
  </div>
  <canvas id="c" aria-label="A garden grid with the guard dog, its forward vector and three bushes"></canvas>
  <div class="pad" id="choices"></div>
  <table id="tbl" hidden>
    <thead><tr><th>Bush</th><th>d = bush − dog</th><th>|d|</th><th>f̂ · d̂</th><th>The dog…</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="msg" class="message">Round 1 is the story of the lesson.</p>
  <div class="pad"><button id="next" type="button" hidden>Next round ▶</button><button id="sound" type="button" class="ghost">Sound: on</button></div>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const COLS = 12, ROWS = 9, RANGE = 5, LIMIT = 0.5, SNEAK_MS = 900;
  const ROUNDS = [
    { D: [6, 4], f: [1, 0], fl: "(1, 0)", bushes: [["A", 10, 7], ["B", 9, 8], ["C", 6, 9]], fish: [2, 1] },
    { D: [6, 4], f: [0, 1], fl: "(0, 1)", bushes: [["A", 10, 7], ["B", 6, 9], ["C", 10, 1]], fish: [2, 1] },
    { D: [6, 4], f: [-1, 0], fl: "(−1, 0)", bushes: [["A", 2, 7], ["B", 3, 0], ["C", 0, 4]], fish: [11, 8] },
    { D: [4, 2], f: [0.6, 0.8], fl: "(0.6, 0.8)", bushes: [["A", 7, 6], ["B", 9, 2], ["C", 0, 5]], fish: [11, 8] },
    { D: [8, 6], f: [0, -1], fl: "(0, −1)", bushes: [["A", 8, 1], ["B", 5, 2], ["C", 12, 9]], fish: [1, 8] },
  ];
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => { const r = Math.round(n * 100) / 100; return (r < 0 ? "−" : "") + Math.abs(r); };
  const pair = (a, b) => `(${fmt(a)}, ${fmt(b)})`;
  let catPos = [0, 0], W = 0, H = 0, u = 36, round = 0, stars = 0, tries = 0, cur = ROUNDS[0], picked = null, revealed = false, sneak = null, sound = true, audio = null, over = false;

  function test(b) {
    const d = [b[1] - cur.D[0], b[2] - cur.D[1]], m = Math.hypot(d[0], d[1]);
    const c = (cur.f[0] * d[0] + cur.f[1] * d[1]) / m;
    const seen = c >= LIMIT - 1e-9 && m <= RANGE + 1e-9;
    const why = seen ? "sees it" : c < 0 ? "cannot see it: behind" : c < LIMIT - 1e-9 ? "cannot see it: too far to the side" : "cannot see it: too far away";
    return { d, m, c, seen, why };
  }
  function startRound() {
    if (round >= ROUNDS.length) {
      over = true; $("lvl").textContent = "All rounds done"; $("goal").textContent = "";
      $("choices").innerHTML = ""; $("tbl").hidden = true;
      $("msg").textContent = `🎉 The cat got every fish! ★ ${stars} of ${ROUNDS.length * 3}.`; $("msg").className = "message good";
      $("next").hidden = false; $("next").textContent = "Play again ▶"; return;
    }
    over = false; cur = ROUNDS[round]; tries = 0; picked = null; revealed = false; sneak = null; catPos = [0, 0];
    $("lvl").textContent = `Round ${round + 1} / ${ROUNDS.length}`;
    $("goal").innerHTML = `Dog <b>D = ${pair(...cur.D)}</b> looks <b>f = ${cur.fl}</b>`;
    $("choices").innerHTML = "";
    cur.bushes.forEach((b) => {
      const btn = document.createElement("button"); btn.type = "button"; btn.className = "ghost";
      btn.textContent = `Hide in ${b[0]} ${pair(b[1], b[2])}`; btn.dataset.b = b[0];
      btn.addEventListener("click", () => choose(b)); $("choices").appendChild(btn);
    });
    $("tbl").hidden = true; $("next").hidden = true;
    $("msg").textContent = round === 0 ? "Round 1 is the story of the lesson. Which bush can the dog not see?" : "Which bush can the dog not see?"; $("msg").className = "message";
  }
  function reveal() {
    revealed = true; $("tbl").hidden = false;
    $("rows").innerHTML = cur.bushes.map((b) => {
      const r = test(b);
      return `<tr><td>${b[0]} ${pair(b[1], b[2])}</td><td>${pair(...r.d)}</td><td>${fmt(r.m)}</td><td>${fmt(r.c)}</td><td class="${r.seen ? "seen" : "safe"}">${r.why}</td></tr>`;
    }).join("");
  }
  function beep(f, d, type = "triangle") {
    if (!sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain(); o.type = type; o.frequency.value = f; g.gain.value = 0.07;
      o.connect(g); g.connect(audio.destination); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + d); o.start(); o.stop(audio.currentTime + d);
    } catch (_) {}
  }
  function choose(b) {
    if (sneak && !sneak.done) { $("msg").textContent = "Wait: the cat is still moving."; return; }
    if (picked && !test(picked).seen) { $("msg").textContent = "The cat is already safe. Press Next round."; return; }
    const r = test(b); tries++; picked = b;
    sneak = { t0: performance.now(), from: catPos.slice(), to: [b[1], b[2]], done: false }; catPos = [b[1], b[2]];
    setTimeout(() => {   // decide with a timer, not in draw()
      sneak.done = true; reveal();
      if (!r.seen) {
        const got = tries === 1 ? 3 : tries === 2 ? 2 : 1; stars += got; $("stars").textContent = "★ " + stars;
        $("msg").textContent = `✓ Safe in bush ${b[0]}! ${"★".repeat(got)} f̂ · d̂ = ${fmt(r.c)}, |d| = ${fmt(r.m)}: the dog ${r.why}.`;
        $("msg").className = "message good"; $("next").hidden = false; $("next").textContent = "Next round ▶";
        [660, 880, 1320].forEach((f, i) => setTimeout(() => beep(f, 0.14), i * 110));
      } else {
        $("msg").textContent = `✗ Woof! Bush ${b[0]}: f̂ · d̂ = ${fmt(r.c)} ≥ 0.5 and |d| = ${fmt(r.m)} ≤ 5. The dog sees it. Try another bush.`;
        $("msg").className = "message bad"; beep(200, 0.3, "sawtooth");
      }
    }, SNEAK_MS + 60);
  }
  function resize() {
    W = canvas.clientWidth; u = Math.min((W - 40) / COLS, 44);
    H = Math.round(u * ROWS + 40);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const X = (x) => (W - u * COLS) / 2 + x * u, Y = (y) => 14 + (ROWS - y) * u;
  function bush(x, y, name, state) {
    const px = X(x), py = Y(y);
    ctx.fillStyle = state === "seen" ? "#ffa8a8" : state === "safe" ? "#8ce99a" : "#51cf66";
    [[-8, 3], [8, 3], [0, -6], [0, 6]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(px + dx * u / 44, py + dy * u / 44, 11 * u / 44 + 3, 0, 7); ctx.fill(); });
    ctx.fillStyle = "#1b4332"; ctx.font = "800 12px Nunito, system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.fillText(name, px, py + 4);
    ctx.font = "700 10px Nunito, system-ui, sans-serif"; ctx.fillStyle = "#2a211c";
    ctx.fillText(pair(x, y), px, py + 26 * Math.max(0.8, u / 44));
  }
  function cat(px, py) {
    ctx.fillStyle = "#495057";
    ctx.beginPath(); ctx.arc(px, py, 8, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(px - 7, py - 3); ctx.lineTo(px - 5, py - 13); ctx.lineTo(px - 1, py - 6); ctx.fill();
    ctx.beginPath(); ctx.moveTo(px + 7, py - 3); ctx.lineTo(px + 5, py - 13); ctx.lineTo(px + 1, py - 6); ctx.fill();
    ctx.fillStyle = "#ffd43b"; ctx.beginPath(); ctx.arc(px - 3, py - 1, 1.6, 0, 7); ctx.arc(px + 3, py - 1, 1.6, 0, 7); ctx.fill();
  }
  function draw(now) {
    ctx.fillStyle = "#f4fbf0"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#e3eee0"; ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) { ctx.beginPath(); ctx.moveTo(X(i), Y(0)); ctx.lineTo(X(i), Y(ROWS)); ctx.stroke(); }
    for (let j = 0; j <= ROWS; j++) { ctx.beginPath(); ctx.moveTo(X(0), Y(j)); ctx.lineTo(X(COLS), Y(j)); ctx.stroke(); }
    ctx.fillStyle = "#868e96"; ctx.font = "600 10px Nunito, system-ui, sans-serif"; ctx.textAlign = "center";
    for (let i = 0; i <= COLS; i += 2) ctx.fillText(String(i), X(i), Y(0) + 13);
    ctx.textAlign = "right"; for (let j = 0; j <= ROWS; j += 3) ctx.fillText(String(j), X(0) - 4, Y(j) + 3);
    if (over) return;
    const [dx, dy] = cur.D, t = Math.atan2(-cur.f[1], cur.f[0]);
    if (revealed) {
      ctx.fillStyle = "rgba(255,212,59,.45)"; ctx.strokeStyle = "#f59f00"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(X(dx), Y(dy)); ctx.arc(X(dx), Y(dy), RANGE * u, t - Math.PI / 3, t + Math.PI / 3); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    // fish
    const [fx, fy] = cur.fish; ctx.fillStyle = "#e8590c";
    ctx.beginPath(); ctx.ellipse(X(fx), Y(fy), 10, 5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(X(fx) + 8, Y(fy)); ctx.lineTo(X(fx) + 15, Y(fy) - 5); ctx.lineTo(X(fx) + 15, Y(fy) + 5); ctx.fill();
    cur.bushes.forEach((b) => bush(b[1], b[2], b[0], revealed ? (test(b).seen ? "seen" : "safe") : ""));
    // dog with forward arrow
    const ax = X(dx), ay = Y(dy), bx = ax + Math.cos(t) * u * 1.6, by = ay + Math.sin(t) * u * 1.6;
    ctx.strokeStyle = "#2F9E44"; ctx.fillStyle = "#2F9E44"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx + Math.cos(t) * 6, by + Math.sin(t) * 6); ctx.lineTo(bx + Math.cos(t + 2.4) * 10, by + Math.sin(t + 2.4) * 10); ctx.lineTo(bx + Math.cos(t - 2.4) * 10, by + Math.sin(t - 2.4) * 10); ctx.fill();
    ctx.fillStyle = "#8d6e63"; ctx.beginPath(); ctx.arc(ax, ay, 11, 0, 7); ctx.fill();
    ctx.fillStyle = "#5d4037"; ctx.beginPath(); ctx.ellipse(ax - 9, ay - 4, 4, 8, 0.4, 0, 7); ctx.ellipse(ax + 9, ay - 4, 4, 8, -0.4, 0, 7); ctx.fill();
    ctx.fillStyle = "#2a211c"; ctx.font = "800 11px Nunito, system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("f = " + cur.fl, bx, by - 10 < 10 ? by + 22 : by - 10);
    // cat
    let cpos = catPos;
    if (sneak && !sneak.done) {
      const k = Math.max(0, Math.min((now - sneak.t0) / SNEAK_MS, 1));
      cpos = [sneak.from[0] + (sneak.to[0] - sneak.from[0]) * k, sneak.from[1] + (sneak.to[1] - sneak.from[1]) * k];
    }
    cat(X(cpos[0]), Y(cpos[1]) - 4);
  }
  function loop(now) {
    requestAnimationFrame(loop);
    try { draw(now); } catch (e) { /* keep the loop alive */ }
  }
  $("next").addEventListener("click", () => { if (over) { round = 0; stars = 0; $("stars").textContent = "★ 0"; } else round++; startRound(); });
  $("sound").addEventListener("click", () => { sound = !sound; $("sound").textContent = "Sound: " + (sound ? "on" : "off"); });
  window.addEventListener("resize", resize);
  resize(); startRound(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
