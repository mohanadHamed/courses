<text x="254" y="116" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">laws, De Morgan, decision</text>
<text x="254" y="132.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">tables, else-if</text>
