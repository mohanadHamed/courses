<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="330" fill="#ffffff"/>
<rect x="20.0" y="20.0" width="290.0" height="290.0" rx="14" fill="#fff5f5" stroke="#ffc9c9" stroke-width="1.5"/>
<text x="165.0" y="52.0" font-size="15" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">Compatibility problem</text>
<text x="165.0" y="74.0" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">the game cannot install or start</text>
<text x="40.0" y="112.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">the OS version is too old</text>
<text x="40.0" y="136.0" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">(Android 9, the game needs 10)</text>
<text x="40.0" y="160.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">not enough free storage</text>
<text x="40.0" y="184.0" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">(3 GB free, the game needs 4 GB)</text>
<text x="40.0" y="230.0" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Fix: update the OS, free space,</text>
<text x="40.0" y="250.0" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">or choose another device.</text>
<rect x="330.0" y="20.0" width="290.0" height="290.0" rx="14" fill="#fff9db" stroke="#ffe066" stroke-width="1.5"/>
<text x="475.0" y="52.0" font-size="15" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">Performance problem</text>
<text x="475.0" y="74.0" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">the game runs, but slowly</text>
<text x="350.0" y="115.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">CPU</text>
<rect x="392.0" y="100.0" width="200.0" height="20.0" rx="5" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<rect x="392.0" y="100.0" width="180.0" height="20.0" rx="5" fill="#A86700" stroke="none" stroke-width="1.5"/>
<text x="350.0" y="145.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">RAM</text>
<rect x="392.0" y="130.0" width="200.0" height="20.0" rx="5" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<rect x="392.0" y="130.0" width="160.0" height="20.0" rx="5" fill="#A86700" stroke="none" stroke-width="1.5"/>
<text x="350.0" y="175.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">GPU</text>
<rect x="392.0" y="160.0" width="200.0" height="20.0" rx="5" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<rect x="392.0" y="160.0" width="70.0" height="20.0" rx="5" fill="#c92a2a" stroke="none" stroke-width="1.5"/>
<text x="350.0" y="205.0" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">SSD</text>
<rect x="392.0" y="190.0" width="200.0" height="20.0" rx="5" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<rect x="392.0" y="190.0" width="190.0" height="20.0" rx="5" fill="#A86700" stroke="none" stroke-width="1.5"/>
<text x="350.0" y="244.0" font-size="12.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">The weakest part is the bottleneck:</text>
<text x="350.0" y="264.0" font-size="12.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">here the GPU. Fix: lower the</text>
<text x="350.0" y="284.0" font-size="12.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">resolution and the effects.</text>
</svg>
