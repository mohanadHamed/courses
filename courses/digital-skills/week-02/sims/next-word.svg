<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="640" height="440" fill="#ffffff"/>
<text x="24" y="36" font-size="22" fill="#2a2f2c" text-anchor="start" font-weight="800">Next Word: how an AI writes a sentence</text>
<rect x="24" y="52" width="592" height="40" rx="12" fill="#ebfbee" stroke="#b2f2bb" stroke-width="1.5"/>
<text x="36" y="77" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">The real fact: the shop opens at 9 a.m., Saturday to Thursday.</text>
<rect x="24" y="104" width="592" height="58" rx="12" fill="#fbfaf8" stroke="#d9d4cf" stroke-width="1.5"/>
<text x="40" y="141" font-size="21" fill="#2a2f2c" text-anchor="start" font-weight="800">The shop opens at</text>
<rect x="234" y="118" width="30" height="30" rx="6" fill="#fff3bf" stroke="none" stroke-width="1.5"/>
<text x="249" y="141" font-size="21" fill="#2a2f2c" text-anchor="middle" font-weight="800">8</text>
<text x="24" y="190" font-size="14" fill="#7a6a60" text-anchor="start" font-weight="700">Which word comes next?</text>
<rect x="24" y="202" width="592" height="34" rx="10" fill="#fff0e0" stroke="#D9480F" stroke-width="1.5"/>
<text x="38" y="224" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800">a.m.</text>
<rect x="130" y="213" width="340" height="12" rx="6" fill="#FFC078" stroke="none" stroke-width="1.5"/>
<text x="604" y="224" font-size="13" fill="#7a6a60" text-anchor="end" font-weight="700">85%</text>
<rect x="24" y="244" width="592" height="34" rx="10" fill="#fff" stroke="#ffc078" stroke-width="1.5"/>
<text x="38" y="266" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800">o'clock</text>
<rect x="130" y="255" width="60" height="12" rx="6" fill="#FFC078" stroke="none" stroke-width="1.5"/>
<text x="604" y="266" font-size="13" fill="#7a6a60" text-anchor="end" font-weight="700">15%</text>
<rect x="24" y="300" width="196" height="34" rx="10" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="122" y="322" font-size="14" fill="#fff" text-anchor="middle" font-weight="800">Let the AI choose</text>
<rect x="230" y="300" width="120" height="34" rx="10" fill="#fff" stroke="#D9480F" stroke-width="1.5"/>
<text x="290" y="322" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="800">Ask again</text>
<text x="24" y="368" font-size="13.5" fill="#c92a2a" text-anchor="start" font-weight="700">The sentence sounds right, but it is wrong.</text>
<text x="24" y="390" font-size="13.5" fill="#c92a2a" text-anchor="start" font-weight="700">Every word was likely, but the AI did not check the fact.</text>
</svg>
