<path d="M92.0,220.0 L120,140 L148.0,220.0 Z" fill="#9C36B5"/>
<circle cx="120.0" cy="120.0" r="24.0" fill="#f1c27d"/>
<path d="M96.0,112.0 Q120,80.0 144.0,112.0 Z" fill="#5c3d2e"/>
<path d="M102.0,144.0 L138.0,144.0 L164.0,160.0" fill="none" stroke="#F783AC" stroke-width="10.0" stroke-linejoin="round" stroke-linecap="round"/>
