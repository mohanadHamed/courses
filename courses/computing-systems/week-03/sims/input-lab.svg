<text x="230.0" y="173.0" font-size="13" fill="#5c3900" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<text x="36.0" y="262.0" font-size="14" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">Now: 3    Most at once: 3</text>
