<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Asset Shopping</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #f8f0fc; border: 1.5px solid #9C36B5; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Asset Shopping</h1>
  <p class="hint">Rooftop Rescue needs six more assets, and the game will be sold. For each asset Yara and Nour found, choose what Night Owl must do.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const U = ["use it and write the credit", "use it; a credit is kind but not required", "do not use it in a game for sale", "use it and share our changes under the same licence"];
  const rounds = [
    { card: "A thunder sound under CC BY 4.0, by Lina Haddad, on sounds.example.org.", answer: "use it and write the credit", choices: C(U), good: "CC BY allows commercial use with a TASL credit." },
    { card: "A pack of cloud sprites under CC0.", answer: "use it; a credit is kind but not required", choices: C(U), good: "CC0 has no conditions; a thank-you in the credits is still kind." },
    { card: "A cat sprite \"free for non-commercial projects\".", answer: "do not use it in a game for sale", choices: C(U), good: "A game that is sold is commercial: ask for a paid licence or draw a new cat." },
    { card: "Roof tiles under CC BY-SA 4.0; Nour wants to recolour them.", answer: "use it and share our changes under the same licence", choices: C(U), good: "SA (share alike): the recoloured tiles must also be CC BY-SA, with a credit." },
    { card: "A pixel font under the SIL Open Font License.", goal: "What may Night Owl do?", answer: "use it and write the credit", choices: C(U), good: "The OFL allows embedding the font in a game; name the font and its licence, and do not sell the font file alone." },
    { card: "A code library for physics under the MIT licence.", answer: "use it and write the credit", choices: C(U), good: "MIT: use it freely, but keep its copyright notice in the credits or the licence file." },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; r.goal = r.goal || "What must Night Owl do?"; });
  const g = Kit.game({ rounds, cols: 1, colsPhone: 1, animMs: 600, intro: "Round 1 is the first asset of the lesson: a thunder sound." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "The shopping list is checked." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
