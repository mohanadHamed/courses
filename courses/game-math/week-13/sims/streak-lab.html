<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Streak Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 5px 0; font-weight: 700; font-size: .92rem; }
    .sim .task { font-weight: 800; color: var(--sim-accent); margin: 6px 0 0; }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Streak Lab: does random look random?</h1>
  <p class="hint">The guard of <i>Torch Hall</i> attacks 100 times. Each attack hits with the chance you set; a grey square is a miss. The red frame shows the longest run of misses. Then let 1000 players fight and look at their longest runs.</p>
  <div class="bar" id="sl"></div>
  <div class="bar"><button type="button" id="one">100 attacks ▶</button><button type="button" class="ghost" id="many">1000 players ▶</button></div>
  <canvas id="c" aria-label="100 attacks and the longest run of misses"></canvas>
  <p class="calc" id="calc"></p>
  <p class="task" id="task"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const s = { p: 50, seq: null, runs: 0, hist: null, histP: null };
  const longest = (seq) => { let b = 0, c = 0, e = 0; seq.forEach((v, i) => { c = v ? 0 : c + 1; if (c > b) { b = c; e = i; } }); return [b, e - b + 1]; };
  const TASKS = [
    { q: "Task 1: With 50 % (a fair coin), run 100 attacks five times. How long is the longest run of misses each time?", ok: () => s.p === 50 && s.runs >= 5 },
    { q: "Task 2: Let 1000 players fight at 50 %. In what share of the fights is there a run of 5 misses or more?", ok: () => s.hist && s.histP === 50 },
    { q: "Task 3: Set the hit chance to 70 % and let 1000 players fight. How often does a player see 4 misses in a row?", ok: () => s.hist && s.histP === 70 },
  ];
  let ti = 0, ready = false;
  Kit.slider($("sl"), "Hit chance", 10, 95, 5, s.p, (v) => { s.p = v; s.seq = null; s.hist = null; if (ready) upd(); }, (v) => v + " %");
  const cv = Kit.canvas($("c"), (W) => (W < 520 ? 330 : 280));
  function run() { return Array.from({ length: 100 }, () => Math.random() < s.p / 100); }
  function draw() {
    const c = cv.ctx, W = cv.W, H = cv.H;
    c.clearRect(0, 0, W, H);
    const cols = 20, cell = Math.min(26, (W - 20) / cols), g = 3;
    if (s.seq) {
      const [b, start] = longest(s.seq);
      s.seq.forEach((v, i) => { const x = 10 + (i % cols) * cell, y = 10 + Math.floor(i / cols) * cell; Kit.rrect(c, x, y, cell - g, cell - g, 3, v ? "#2f9e44" : "#ced4da"); });
      for (let i = start; i < start + b; i++) { const x = 10 + (i % cols) * cell, y = 10 + Math.floor(i / cols) * cell; c.strokeStyle = "#c92a2a"; c.lineWidth = 3; c.strokeRect(x - 1, y - 1, cell - g + 2, cell - g + 2); }
    } else Kit.text(c, "Press \"100 attacks\".", W / 2, 60, 14, "#6b726e");
    const top = 10 + 5 * cell + 16;
    if (s.hist) {
      const n = 16, bw = (W - 40) / n, mx = Math.max(...s.hist), hh = H - top - 30;
      Kit.text(c, "longest run of misses in 1000 fights", W / 2, top + 4, 12.5, "#2a2f2c");
      for (let k = 1; k <= n; k++) {
        const v = s.hist[k] || 0, h = hh * v / mx * 0.85, x = 20 + (k - 1) * bw;
        Kit.rrect(c, x + 2, top + 14 + hh - h, bw - 4, h, 2, k >= 5 ? "#e8590c" : "#2f9e44");
        Kit.text(c, k === n ? n + "+" : String(k), x + bw / 2, H - 6, 10.5, "#6b726e", "center", 700);
      }
    }
  }
  function upd() {
    draw();
    let calc = "";
    if (s.seq) { const hits = s.seq.filter(Boolean).length, [b] = longest(s.seq); calc = `Hits: ${hits} of 100. Longest run of misses: ${b}.`; }
    if (s.hist) { const tot = 1000, ge = (k) => s.hist.slice(k).reduce((a, b) => a + b, 0) / tot * 100; calc += ` 1000 fights: a run of 4 or more misses in ${ge(4).toFixed(0)} %, 5 or more in ${ge(5).toFixed(0)} %.`; }
    $("calc").textContent = calc;
    let m = "";
    while (ti < TASKS.length && TASKS[ti].ok()) { ti++; m = "✓ Done. "; Kit.good(); }
    $("task").textContent = ti < TASKS.length ? TASKS[ti].q : "All tasks are done: long runs are normal in real randomness, even if they feel unfair.";
    $("msg").textContent = m + "A miss is a grey square. Real randomness has more long runs than people expect.";
  }
  $("one").addEventListener("click", () => { s.seq = run(); s.runs += s.p === 50 ? 1 : 0; upd(); });
  $("many").addEventListener("click", () => { const h = new Array(17).fill(0); for (let k = 0; k < 1000; k++) { const [b] = longest(run()); h[Math.min(16, b)]++; } s.hist = h; s.histP = s.p; if (!s.seq) s.seq = run(); upd(); });
  window.addEventListener("resize", draw);
  window.ST = { one: () => $("one").click(), many: () => $("many").click(), setP: (v) => { s.p = v; s.seq = null; s.hist = null; const i = $("sl").querySelector("input"); i.value = v; i.dispatchEvent(new Event("input")); upd(); } };
  ready = true; upd();
})();
</script>
</body>
</html>
