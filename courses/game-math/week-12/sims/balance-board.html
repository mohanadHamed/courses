<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Balance Board</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #ebfbee; border: 1.5px solid #2F9E44; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Balance Board</h1>
  <p class="hint">Before the update of <i>Torch Hall</i>, the balance team checks the numbers. Use drop rates, expected values and hit chances to answer each card.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "The golden torch drops with p = 5 % per bat.", goal: "P(at least one torch in 20 bats)?", answer: "about 64 %", choices: C(["about 64 %", "100 %", "5 %", "about 36 %"]), good: "1 − 0.95²⁰ ≈ 1 − 0.36 = 0.64.", why: { "100 %": "20 × 5 % = 100 % is wrong: chances do not add like that.", "about 36 %": "That is P(no torch in 20 bats)." } },
    { card: "Players should get a rare gem in about 10 kills on average.", goal: "Which drop rate?", answer: "10 %", choices: C(["10 %", "1 %", "50 %", "100 %"]), good: "Average tries = 1/p, so p = 1/10." },
    { card: "With p = 2 %, some players kill 200 bats without the item and quit.", goal: "What helps without changing the average much?", answer: "a pity timer", choices: C(["a pity timer", "lower p to 1 %", "remove the item", "more bats"]), good: "A guarantee after many misses cuts off the very long waits." },
    { card: "A skeleton has 40 health; the player does 10 damage and hits 80 % of the time.", goal: "Expected player attacks to win?", answer: "5", choices: C(["5", "4", "3.2", "32"]), good: "4 hits needed ÷ 0.8 = 5 attacks on average.", why: { "4": "4 hits, but 20 % of the attacks miss." } },
    { card: "Common 60 (5 coins), rare 30 (20 coins), epic 10 (60 coins): weights and values of a chest.", goal: "Expected coins per chest?", answer: "15", choices: C(["15", "28.3", "85", "60"]), good: "0.6·5 + 0.3·20 + 0.1·60 = 3 + 6 + 6 = 15.", why: { "28.3": "The plain average ignores the weights." } },
    { card: "The skeleton wins 45 % of fights against new players. The target is 70–85 % for the player.", goal: "Which change is the smallest step?", answer: "lower its hit chance a little", choices: C(["lower its hit chance a little", "give it 1 health", "double its damage", "remove the skeleton"]), good: "Change one number a little, then simulate again." },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 1, animMs: 600, intro: "Round 1 is the story of the lesson: the golden torch." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "The update is balanced." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
