<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Rule Smith</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .pad button { font-family: ui-monospace, Consolas, monospace; text-align: left; } .sim .code { font: 700 .98rem ui-monospace, Consolas, monospace; background: #1e1e2e; color: #e9ecef; padding: 10px 12px; border-radius: 10px; margin: 6px 0; white-space: pre-wrap; } .sim .code .say { font-family: Nunito, system-ui, sans-serif; color: #ffd43b; }</style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Rule Smith</h1>
  <p class="hint">The designer of <i>Torch Hall</i> writes the rules in words. You turn them into exact conditions, find what they tell you, and find the bugs in the code.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { box: "<span class=say>“The chest opens if the player has the key and no skeleton is near, or the player is a thief.”</span>\nk: key   s: skeleton near   t: thief",
      goal: "Which condition is the rule?", ans: "(k && !s) || t", choices: C(["(k && !s) || t", "k && (!s || t)", "k && !s && t", "(k || t) && !s"]),
      good: "“, or the player is a thief” is a second way in: (k ∧ ¬s) ∨ t. A thief opens it even with a skeleton near.",
      why: { "k && (!s || t)": "Here a thief without a key cannot open it.", "k && !s && t": "This needs all three: only a thief with a key.", "(k || t) && !s": "Here a thief cannot open it when a skeleton is near." } },
    { box: "<span class=say>“The bridge stays up unless the lever is pulled.”</span>\nl: the lever is pulled",
      goal: "When is the bridge up?", ans: "bridgeUp = !l", choices: C(["bridgeUp = !l", "bridgeUp = l", "bridgeUp = true", "bridgeUp = l || !l"]),
      good: "“Unless l” means “if not l”: the bridge is up exactly when the lever is not pulled.",
      why: { "bridgeUp = l": "This is the opposite: up only when the lever is pulled.", "bridgeUp = l || !l": "This is a tautology: always up." } },
    { box: "<span class=say>“The door opens with the red key or the blue key, but not both.”</span>\nr: red key   b: blue key",
      goal: "Which condition is the rule?", ans: "r ^ b", choices: C(["r ^ b", "r || b", "r && b", "!(r || b)"]),
      good: "“But not both” is XOR: exactly one key opens the door.",
      why: { "r || b": "OR also opens the door with both keys.", "r && b": "This needs both keys." } },
    { box: "<span class=say>“The guard cannot see the player.”</span>\nThe guard sees the player when l && v (the light is on and the player is in view).",
      goal: "Which condition is the same as !(l && v)?", ans: "!l || !v", choices: C(["!l || !v", "!l && !v", "l || v", "!l || v"]),
      good: "De Morgan: the NOT goes into the brackets, and AND becomes OR. One missing thing is enough.",
      why: { "!l && !v": "The operator must change too: this is only true when both are missing." } },
    { box: "if (gold > 0) Sell();\nelse if (gold > 50) Discount();\nelse Close();",
      goal: "Which rule never runs?", ans: "Discount()", choices: C(["Discount()", "Sell()", "Close()", "none"]),
      good: "Every case with gold > 50 also has gold > 0, so Sell catches it first: Discount is unreachable. Put the special rule first.",
      why: { "Close()": "Close runs when gold is 0 or less." } },
    { box: "if (lit || (lit && windy)) Burn();",
      goal: "Which shorter condition is the same?", ans: "lit", choices: C(["lit", "windy", "lit && windy", "lit || windy"]),
      good: "Absorption: p ∨ (p ∧ q) ≡ p. The wind never mattered.",
      why: { "lit && windy": "This burns only with wind; the rule also burns without it.", "lit || windy": "This burns with wind alone." } },
  ];
  rounds.forEach((r) => { r.answer = r.ans; r.why = r.why || {}; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 1, animMs: 600, intro: "Round 1 is the story of the lesson: the chest rule of Torch Hall." });
  const box = Kit.el("div", { class: "code", id: "code" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { if (g.st.i !== last && !g.st.over) { last = g.st.i; box.innerHTML = g.cur().box; } if (g.st.over) box.innerHTML = "All rules are done."; requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
