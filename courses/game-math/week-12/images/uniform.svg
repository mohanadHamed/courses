<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="280" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A uniform distribution: every value equally often</text>
<line x1="40" y1="220" x2="320" y2="220" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round"/>
<rect x="42" y="95.8" width="42.7" height="124.2" rx="2" fill="#2F9E44"/>
<text x="63.3" y="234" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<rect x="88.7" y="96.9" width="42.7" height="123.1" rx="2" fill="#2F9E44"/>
<text x="110" y="234" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
<rect x="135.3" y="87.1" width="42.7" height="132.9" rx="2" fill="#2F9E44"/>
<text x="156.7" y="234" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
<rect x="182" y="93.8" width="42.7" height="126.2" rx="2" fill="#2F9E44"/>
<text x="203.3" y="234" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">4</text>
<rect x="228.7" y="97.4" width="42.7" height="122.6" rx="2" fill="#2F9E44"/>
<text x="250" y="234" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">5</text>
<rect x="275.3" y="99.1" width="42.7" height="120.9" rx="2" fill="#2F9E44"/>
<text x="296.7" y="234" font-size="10.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">6</text>
<text x="180" y="62" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">6000 rolls of a die</text>
<line x1="40" y1="95" x2="320" y2="95" stroke="#c92a2a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="324" y="99" font-size="11" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">1000</text>
<rect x="370" y="56" width="290" height="196" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="384" y="80" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Uniform</text>
<text x="384" y="96" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Discrete: each of n values has probability</text>
<text x="384" y="112.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">1/n (a die: 1/6).</text>
<text x="384" y="156" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Continuous: every number in a range is</text>
<text x="384" y="172.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">equally likely, like Random.Range(0f, 10f).</text>
<text x="384" y="222" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Many tries: the bars are almost flat.</text>
</svg>
