<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="700" height="330" fill="#ffffff"/>
<text x="350" y="34" font-size="17" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Weak lines and better lines</text>
<text x="150" y="66" font-size="13" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">weak</text>
<text x="470" y="66" font-size="13" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">better</text>
<rect x="20" y="80" width="268" height="62" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
<text x="32" y="106" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">"As you know, Nour, the river has</text>
<text x="32" y="124" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">flooded the whole city."</text>
<line x1="296" y1="111" x2="319.6" y2="111" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="326,111 318.8,114.5 318.8,107.5" fill="#6b726e" stroke="none" stroke-width="1.5"/>
<rect x="334" y="80" width="346" height="62" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="346" y="106" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">"It's still rising. Row!"</text>
<text x="346" y="127" font-size="11.5" fill="#2b8a3e" text-anchor="start" font-weight="700" xml:space="preserve">no "as you know": short, it pushes the action</text>
<rect x="20" y="160" width="268" height="62" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
<text x="32" y="186" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">"I am very scared and very sad."</text>
<line x1="296" y1="191" x2="319.6" y2="191" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="326,191 318.8,194.5 318.8,187.5" fill="#6b726e" stroke="none" stroke-width="1.5"/>
<rect x="334" y="160" width="346" height="62" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="346" y="186" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">"I'm fine. Just... hold my hand."</text>
<text x="346" y="207" font-size="11.5" fill="#2b8a3e" text-anchor="start" font-weight="700" xml:space="preserve">subtext: the fear shows, it is not said</text>
<rect x="20" y="240" width="268" height="62" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
<text x="32" y="266" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">"Watch out, there is an obstacle in</text>
<text x="32" y="284" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">front of the boat to avoid."</text>
<line x1="296" y1="271" x2="319.6" y2="271" stroke="#6b726e" stroke-width="2" stroke-linecap="round"/>
<polygon points="326,271 318.8,274.5 318.8,267.5" fill="#6b726e" stroke="none" stroke-width="1.5"/>
<rect x="334" y="240" width="346" height="62" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="346" y="266" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">"Car ahead!"</text>
<text x="346" y="287" font-size="11.5" fill="#2b8a3e" text-anchor="start" font-weight="700" xml:space="preserve">a bark: short, because it repeats</text>
</svg>
