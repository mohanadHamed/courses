<svg xmlns="http://www.w3.org/2000/svg" width="680" height="256" viewBox="0 0 680 256" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="256" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Keep these out of a prompt</text>
<rect x="20" y="52" width="206" height="140" rx="12" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="34" y="76" font-size="14.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">Personal data</text>
<text x="34" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">full names with phone</text>
<text x="34" y="114.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">numbers</text>
<text x="34" y="133.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">ID numbers</text>
<text x="34" y="152.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">home addresses</text>
<text x="34" y="172.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">photos of people</text>
<rect x="238" y="52" width="206" height="140" rx="12" fill="#ffffff" stroke="#c92a2a" stroke-width="1.8"/>
<text x="252" y="76" font-size="14.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Sensitive data</text>
<text x="252" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">health and sick notes</text>
<text x="252" y="117.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">salaries</text>
<text x="252" y="136.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">passwords and PINs</text>
<text x="252" y="155.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">bank details</text>
<rect x="456" y="52" width="206" height="140" rx="12" fill="#ffffff" stroke="#7048e8" stroke-width="1.8"/>
<text x="470" y="76" font-size="14.5" fill="#7048e8" text-anchor="start" font-weight="800" xml:space="preserve">Confidential information</text>
<text x="470" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">customer lists</text>
<text x="470" y="117.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">contracts and prices</text>
<text x="470" y="136.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">exam questions</text>
<text x="470" y="155.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">internal plans</text>
<rect x="20" y="204" width="640" height="40" rx="10" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="340" y="229" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">Instead: use placeholders such as [Customer A], [amount] or [date].</text>
</svg>
