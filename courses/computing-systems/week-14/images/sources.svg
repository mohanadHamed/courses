<svg xmlns="http://www.w3.org/2000/svg" width="680" height="210" viewBox="0 0 680 210" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="210" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Where do performance facts come from?</text>
<rect x="20" y="52" width="310" height="140" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="34" y="76" font-size="14.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Reliable</text>
<text x="34" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">official release notes of the OS and the engine</text>
<text x="34" y="117.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">developer documentation</text>
<text x="34" y="136.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">benchmarks that explain their method</text>
<text x="34" y="155.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">your own tests, written down</text>
<rect x="350" y="52" width="310" height="140" rx="12" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.8"/>
<text x="364" y="76" font-size="14.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Check twice</text>
<text x="364" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">advertising of a phone maker</text>
<text x="364" y="117.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a forum post without tests</text>
<text x="364" y="136.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">one video with one device</text>
<text x="364" y="155.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a date-less blog post</text>
</svg>
