<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Juice It</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .layers { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 10px; }
    .sim .layers label { gap: 5px; font-size: .9rem; border: 1.5px solid #ecdcf1; border-radius: 10px; padding: 4px 9px; cursor: pointer; user-select: none; }
    .sim .layers input { accent-color: var(--sim-accent); }
    .sim .layers label:has(input:checked) { background: color-mix(in srgb, var(--sim-accent2) 22%, #fff); border-color: var(--sim-accent); }
    .sim canvas { cursor: pointer; }
    .sim .meter { font-weight: 800; color: var(--sim-accent); }
  </style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Juice It — same mechanics, different media</h1>
  <p class="hint">Tap the game (or press Space) to jump over the rocks and collect stars. The rules never change. Switch the media layers on, one at a time, and notice how the experience changes.</p>
  <canvas id="c" aria-label="Jump game with switchable media layers"></canvas>
  <div class="layers" id="layers">
    <label><input type="checkbox" data-k="color"> Colour palette</label>
    <label><input type="checkbox" data-k="anim"> Squash &amp; stretch</label>
    <label><input type="checkbox" data-k="sfx"> Sound effects</label>
    <label><input type="checkbox" data-k="music"> Music</label>
    <label><input type="checkbox" data-k="particles"> Particles</label>
    <label><input type="checkbox" data-k="shake"> Camera shake</label>
    <label><input type="checkbox" data-k="story"> Story line</label>
  </div>
  <div class="controls">
    <button id="all" type="button" class="ghost">All layers on</button>
    <button id="none" type="button" class="ghost">All layers off</button>
    <span class="meter" id="layersOn">Media layers: 0 / 7</span>
  </div>
  <p id="msg" class="message">Start with every layer off: the bare mechanics.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const on = { color: false, anim: false, sfx: false, music: false, particles: false, shake: false, story: false };
  const G = 2500, JUMP = 860, SPEED = 260;
  let W = 0, H = 0, ground = 0, last = 0, audio = null, musicTimer = null, beat = 0;
  let st, parts = [], shake = 0;
  const STORY = ["The last lantern spirit runs home before sunrise.", "Collect the stars: each one keeps your light alive.", "The village is close. Do not stop now."];

  function reset() { st = { y: 0, vy: 0, onGround: true, rocks: [], stars: [], t: 0, score: 0, next: 1.4, nextStar: 0.8, squash: 0, hits: 0 }; }
  function resize() {
    W = canvas.clientWidth; H = Math.round(Math.min(270, Math.max(190, W * 0.4)));
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ground = H - 36;
  }
  const ac = () => { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (_) {} return audio; };
  function tone(f, d, type = "triangle", vol = 0.06, slide = 1) {
    const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f; g.gain.value = vol;
    o.connect(g); g.connect(a.destination);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(f * slide, a.currentTime + d);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d); o.start(); o.stop(a.currentTime + d + 0.02);
  }
  const MELODY = [523, 659, 784, 659, 587, 698, 880, 698, 523, 659, 784, 1047, 988, 784, 659, 587];
  function music(play) {
    clearInterval(musicTimer); musicTimer = null;
    if (!play) return;
    musicTimer = setInterval(() => {
      const n = MELODY[beat % MELODY.length]; tone(n / 2, 0.32, "sine", 0.035);
      if (beat % 4 === 0) tone(n / 4, 0.5, "triangle", 0.03);
      beat++;
    }, 300);
  }
  function burst(x, y, color, n = 12) {
    if (!on.particles) return;
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 160; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.6, color }); }
  }
  function jump() {
    ac();
    if (st.onGround) {
      st.vy = JUMP; st.onGround = false; st.squash = -1;
      if (on.sfx) tone(380, 0.16, "square", 0.05, 1.8);
      burst(70, ground, "#d0bfff", 8);
    }
  }
  function update(dt) {
    st.t += dt;
    st.vy -= G * dt; st.y += st.vy * dt;
    if (st.y <= 0) {
      if (!st.onGround) { st.squash = 1; if (on.sfx) tone(140, 0.08, "sine", 0.05); burst(70, ground, "#e9d7ee", 6); }
      st.y = 0; st.vy = 0; st.onGround = true;
    }
    st.squash *= Math.pow(0.0005, dt);
    st.next -= dt; st.nextStar -= dt;
    if (st.next <= 0) { st.rocks.push({ x: W + 20, w: 26, h: 24 + Math.random() * 14, hit: false }); st.next = 1.2 + Math.random() * 1.2; }
    if (st.nextStar <= 0) { st.stars.push({ x: W + 20, y: 60 + Math.random() * 70, got: false }); st.nextStar = 0.9 + Math.random(); }
    const px = 58, py = ground - st.y - 30;
    for (const r of st.rocks) {
      r.x -= SPEED * dt;
      if (!r.hit && px + 24 > r.x + 3 && px < r.x + r.w - 3 && py + 30 > ground - r.h + 3) {
        r.hit = true; st.hits++; st.score = Math.max(0, st.score - 3);
        if (on.sfx) tone(110, 0.3, "sawtooth", 0.06, 0.5);
        if (on.shake) shake = 0.3;
        burst(r.x, ground - r.h, "#ff8787", 14);
      }
    }
    for (const s of st.stars) {
      s.x -= SPEED * dt;
      if (!s.got && Math.abs(s.x - (px + 12)) < 22 && Math.abs(s.y - (py + 15)) < 26) {
        s.got = true; st.score++;
        if (on.sfx) { tone(988, 0.1, "triangle", 0.05); setTimeout(() => tone(1319, 0.14, "triangle", 0.05), 70); }
        burst(s.x, s.y, "#ffe066", 16);
      }
    }
    st.rocks = st.rocks.filter((r) => r.x > -40); st.stars = st.stars.filter((s) => s.x > -40 && !s.got);
    for (const p of parts) { p.life -= dt; p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    parts = parts.filter((p) => p.life > 0);
    shake = Math.max(0, shake - dt);
  }
  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 14 * shake / 0.3, (Math.random() - 0.5) * 10 * shake / 0.3);
    const c = on.color;
    if (c) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#2b1d5c"); g.addColorStop(1, "#f783ac"); ctx.fillStyle = g; }
    else ctx.fillStyle = "#f1f3f5";
    ctx.fillRect(-20, -20, W + 40, H + 40);
    if (c) { ctx.fillStyle = "rgba(255,240,200,.9)"; ctx.beginPath(); ctx.arc(W - 70, 50, 22, 0, 7); ctx.fill(); }
    ctx.fillStyle = c ? "#3b2a63" : "#ced4da"; ctx.fillRect(-20, ground, W + 40, H - ground + 20);
    for (const r of st.rocks) { ctx.fillStyle = c ? "#1f1636" : "#868e96"; ctx.beginPath(); ctx.moveTo(r.x, ground); ctx.lineTo(r.x + r.w * 0.2, ground - r.h); ctx.lineTo(r.x + r.w * 0.8, ground - r.h * 0.8); ctx.lineTo(r.x + r.w, ground); ctx.fill(); }
    for (const s of st.stars) {
      ctx.fillStyle = c ? "#ffe066" : "#adb5bd"; ctx.beginPath();
      for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, R = k % 2 ? 5 : 11; ctx.lineTo(s.x + R * Math.cos(a), s.y + R * Math.sin(a)); }
      ctx.fill();
    }
    // player with optional squash & stretch
    const sq = on.anim ? st.squash : 0, sx = 1 + 0.3 * sq, sy = 1 - 0.3 * sq;
    const pw = 24 * sx, ph = 30 * sy, px = 58 + 12 - pw / 2, py = ground - st.y - ph;
    if (c) { ctx.fillStyle = "rgba(255,224,102,.25)"; ctx.beginPath(); ctx.arc(px + pw / 2, py + ph / 2, 30, 0, 7); ctx.fill(); }
    ctx.fillStyle = c ? "#ffd43b" : "#495057";
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(px, py, pw, ph, 8) : ctx.rect(px, py, pw, ph); ctx.fill();
    ctx.fillStyle = c ? "#5c3d00" : "#f8f9fa"; ctx.fillRect(px + pw * 0.62, py + ph * 0.28, 4, 4);
    for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / 0.6); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = c ? "#fff" : "#343a40"; ctx.font = "800 15px Nunito, system-ui, sans-serif"; ctx.textAlign = "left";
    ctx.fillText("★ " + st.score, 14, 24);
    if (on.story) {
      const line = STORY[Math.floor(st.t / 6) % STORY.length];
      ctx.font = "italic 600 14px Nunito, system-ui, sans-serif"; ctx.textAlign = "center";
      ctx.fillStyle = c ? "rgba(255,255,255,.92)" : "#495057"; ctx.fillText(line, W / 2, 26);
    }
    ctx.restore();
  }
  function loop(now) { const dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60; last = now; update(dt); draw(); requestAnimationFrame(loop); }
  const sync = () => {
    document.querySelectorAll("#layers input").forEach((i) => { on[i.dataset.k] = i.checked; });
    const n = Object.values(on).filter(Boolean).length;
    $("layersOn").textContent = `Media layers: ${n} / 7`;
    music(on.music);
    $("msg").textContent = n === 0 ? "Bare mechanics: the rules work, but the game feels empty." : n === 7 ? "All layers on: the same rules now feel like a different game." : "Same rules. Which layer changed the feeling most?";
  };
  document.querySelectorAll("#layers input").forEach((i) => i.addEventListener("change", () => { ac(); sync(); }));
  $("all").addEventListener("click", () => { ac(); document.querySelectorAll("#layers input").forEach((i) => (i.checked = true)); sync(); });
  $("none").addEventListener("click", () => { document.querySelectorAll("#layers input").forEach((i) => (i.checked = false)); sync(); });
  canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); jump(); });
  window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); jump(); } });
  document.addEventListener("visibilitychange", () => { if (document.hidden) music(false); else if (on.music) music(true); });
  window.addEventListener("resize", resize);
  reset(); resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
