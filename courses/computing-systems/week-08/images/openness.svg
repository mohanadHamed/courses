<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="310" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Openness, installing and updates</text>
<rect x="20" y="54" width="310" height="220" rx="14" fill="#2b8a3e12" stroke="#2b8a3e" stroke-width="2"/>
<text x="36" y="82" font-size="15" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Android: open</text>
<text x="36" y="112" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• apps from Google Play, other stores or an</text>
<text x="36" y="128.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">.apk file</text>
<text x="36" y="154" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• phone makers change the system</text>
<text x="36" y="196" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• updates from the phone maker: late or</text>
<text x="36" y="212.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">never</text>
<text x="36" y="238" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• more freedom, more risk</text>
<rect x="350" y="54" width="310" height="220" rx="14" fill="#1c7ed612" stroke="#1c7ed6" stroke-width="2"/>
<text x="366" y="82" font-size="15" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">iOS: closed</text>
<text x="366" y="112" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• apps from the App Store (other stores</text>
<text x="366" y="128.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">only in some regions)</text>
<text x="366" y="154" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• only Apple changes the system</text>
<text x="366" y="196" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• updates from Apple for all supported</text>
<text x="366" y="212.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">iPhones</text>
<text x="366" y="238" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• less freedom, one set of rules</text>
<text x="340" y="298" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">For a tester: on Android, test old versions too; on iOS, most players are on a recent version.</text>
</svg>
