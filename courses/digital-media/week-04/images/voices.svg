<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="700" height="300" fill="#ffffff"/>
<text x="350" y="34" font-size="17" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Three characters, three voices: "We must leave now."</text>
<rect x="20" y="60" width="214" height="200" rx="12" fill="#fff" stroke="#9C36B5" stroke-width="2"/>
<circle cx="127" cy="100" r="24" fill="#9C36B5" stroke="none" stroke-width="1.5"/>
<text x="127" y="107" font-size="18" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">N</text>
<text x="127" y="148" font-size="12.5" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">NOUR (17)</text>
<text x="127" y="168" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">short, direct, practical</text>
<text x="127" y="204" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">"Get in. Now."</text>
<rect x="246" y="60" width="214" height="200" rx="12" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
<circle cx="353" cy="100" r="24" fill="#1c7ed6" stroke="none" stroke-width="1.5"/>
<text x="353" y="107" font-size="18" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">G</text>
<text x="353" y="148" font-size="12.5" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">GRANDMA SALMA (78)</text>
<text x="353" y="168" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">slow, old sayings, "my child"</text>
<text x="353" y="204" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">"My child, a house is</text>
<text x="353" y="223" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">only walls. Let us go."</text>
<rect x="472" y="60" width="214" height="200" rx="12" fill="#fff" stroke="#e8590c" stroke-width="2"/>
<circle cx="579" cy="100" r="24" fill="#e8590c" stroke="none" stroke-width="1.5"/>
<text x="579" y="107" font-size="18" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">C</text>
<text x="579" y="148" font-size="12.5" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">CAPTAIN TAREK (radio)</text>
<text x="579" y="168" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">formal, numbers, "Over."</text>
<text x="579" y="204" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">"All boats, leave sector</text>
<text x="579" y="223" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">four now. Over."</text>
<text x="350" y="286" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Cover the names: can you still tell who speaks?</text>
</svg>
