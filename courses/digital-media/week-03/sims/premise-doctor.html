<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Premise Doctor</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .hud { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin: 0 0 8px; font-weight: 800; }
    .sim .hud .lvl { color: var(--sim-accent); }
    .sim .hud .stars { margin-left: auto; }
    .sim .premise { background: #f8f0fc; border-left: 5px solid var(--sim-accent); border-radius: 10px; padding: 10px 12px; font-size: 1.05rem; font-weight: 700; line-height: 1.45; }
    .sim .parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-top: 10px; }
    .sim .parts button { text-align: left; }
    .sim .parts button.on { background: #c92a2a; border-color: #c92a2a; color: #fff; }
    .sim .parts button.ok { background: #2b8a3e; border-color: #2b8a3e; color: #fff; }
    .sim .pad { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
    .sim .fix { margin-top: 8px; font-weight: 700; background: #ebfbee; border-radius: 10px; padding: 8px 10px; }
    .sim .message.bad { color: #c92a2a; }
  </style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Premise Doctor: what is missing?</h1>
  <p class="hint">A good premise answers six questions: who, what goal, what stands in the way, what is at stake, where, and what the player does. Tap every part that is <b>missing</b> from the draft, then press Check.</p>
  <div class="hud"><span class="lvl" id="lvl">Draft 1</span><span class="stars" id="stars">★ 0</span></div>
  <div class="premise" id="premise"></div>
  <div class="parts" id="parts"></div>
  <div class="pad"><button id="check" type="button">Check ✓</button><button id="next" type="button" class="ghost" hidden>Next draft ▶</button></div>
  <p id="msg" class="message"></p>
  <div class="fix" id="fix" hidden></div>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const PARTS = [["who", "Who? a character"], ["goal", "What goal?"], ["obstacle", "What stands in the way?"], ["stakes", "What is at stake?"], ["where", "Where?"], ["play", "What does the player do?"]];
  const DRAFTS = [
    { text: "A boy lives in a city by the sea and has adventures.", missing: ["goal", "obstacle", "stakes", "play"],
      fix: "When a storm sinks the ferry, Adam, a young fisherman, must bring the medicine to the island before dawn, but the sea is full of wreckage. (The player steers the boat between the wrecks.)" },
    { text: "Nour, a young boat driver, must lead the families on the rooftops of a flooded city to the hill, but floating cars block the streets. The player slides the blocks to open a path.", missing: ["stakes"],
      fix: "… before night falls, or the families stay on the rooftops all night." },
    { text: "When the village doctor runs out of medicine, someone must carry new medicine across the desert before sunset, or a sick child gets no help tonight. The player runs, jumps and slides.", missing: ["who", "obstacle"],
      fix: "Sami, a delivery rider, … but a sandstorm buries the road under sand." },
    { text: "Lina comes back to her grandmother's farm in a mountain village. She must make the old farm grow again before the spring market, or the family must sell it, but the soil is dry and the well is broken.", missing: ["play"],
      fix: "… The player plants, waters and harvests in short sessions." },
    { text: "A story about friendship and hope in a beautiful world.", missing: ["who", "goal", "obstacle", "stakes", "where", "play"],
      fix: "Start again from the six questions: who wants what, where, what stands in the way, what happens if they fail, and what the player does." },
  ];
  const $ = (id) => document.getElementById(id);
  let i = 0, picked = new Set(), stars = 0, tries = 0, done = false;
  function show() {
    const d = DRAFTS[i]; picked = new Set(); tries = 0; done = false;
    $("lvl").textContent = `Draft ${i + 1} / ${DRAFTS.length}`;
    $("premise").textContent = "“" + d.text + "”";
    $("parts").innerHTML = "";
    PARTS.forEach(([k, label]) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.textContent = label; b.dataset.k = k;
      b.addEventListener("click", () => {
        if (done) { $("msg").textContent = "This draft is done. Press Next draft."; return; }
        picked.has(k) ? picked.delete(k) : picked.add(k); b.classList.toggle("on", picked.has(k));
      });
      $("parts").appendChild(b);
    });
    $("msg").textContent = "Tap every part that is missing."; $("msg").className = "message";
    $("fix").hidden = true; $("next").hidden = true;
  }
  function check() {
    if (done) { $("msg").textContent = "This draft is done. Press Next draft."; return; }
    const d = DRAFTS[i], want = new Set(d.missing); tries++;
    const extra = [...picked].filter((k) => !want.has(k)), lost = d.missing.filter((k) => !picked.has(k));
    if (!extra.length && !lost.length) {
      done = true; const got = tries === 1 ? 2 : 1; stars += got; $("stars").textContent = "★ " + stars;
      document.querySelectorAll("#parts button").forEach((b) => b.classList.toggle("ok", want.has(b.dataset.k)));
      $("msg").textContent = `✓ Right: ${d.missing.length} part${d.missing.length > 1 ? "s" : ""} missing. ${"★".repeat(got)}`; $("msg").className = "message good";
      $("fix").hidden = false; $("fix").textContent = "A better version: " + d.fix;
      $("next").hidden = false; $("next").textContent = i < DRAFTS.length - 1 ? "Next draft ▶" : "Start again ▶";
    } else {
      const name = (k) => PARTS.find((p) => p[0] === k)[1];
      $("msg").textContent = "✗ Not yet. " + (extra.length ? `The draft already has: ${extra.map(name).join(", ")}. ` : "") + (lost.length ? `Something else is missing too.` : "");
      $("msg").className = "message bad";
    }
  }
  $("check").addEventListener("click", check);
  $("next").addEventListener("click", () => { i = (i + 1) % DRAFTS.length; if (i === 0) { stars = 0; $("stars").textContent = "★ 0"; } show(); });
  show();
})();
</script>
</body>
</html>
