<line x1="180" y1="300" x2="180" y2="85" stroke="#e9ecef" stroke-width="1" stroke-linecap="butt"/>
<line x1="230" y1="300" x2="230" y2="85" stroke="#e9ecef" stroke-width="1" stroke-linecap="butt"/>
