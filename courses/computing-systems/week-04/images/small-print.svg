<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<rect x="10" y="10" width="660" height="310" rx="18" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
<text x="34" y="46" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Peak and sustained performance (benchmark score)</text>
<line x1="70" y1="280" x2="410" y2="280" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
<line x1="70" y1="80" x2="70" y2="280" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
<line x1="70" y1="230" x2="410" y2="230" stroke="#e4e8e5" stroke-width="1" stroke-linecap="round"/>
<text x="64" y="234" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">400</text>
<line x1="70" y1="180" x2="410" y2="180" stroke="#e4e8e5" stroke-width="1" stroke-linecap="round"/>
<text x="64" y="184" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">800</text>
<line x1="70" y1="130" x2="410" y2="130" stroke="#e4e8e5" stroke-width="1" stroke-linecap="round"/>
<text x="64" y="134" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">1200</text>
<line x1="70" y1="80" x2="410" y2="80" stroke="#e4e8e5" stroke-width="1" stroke-linecap="round"/>
<text x="64" y="84" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">1600</text>
<text x="70" y="296" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">0 min</text>
<text x="155" y="296" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">5 min</text>
<text x="240" y="296" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">10 min</text>
<text x="325" y="296" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">15 min</text>
<text x="410" y="296" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">20 min</text>
<path d="M70.0 105.0 L138.0 105.0 L223.0 155.0 L410.0 175.0" fill="none" stroke="#c92a2a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="291" y="147" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">P7: 1400 → 840</text>
<path d="M70.0 155.0 L172.0 155.0 L257.0 172.5 L410.0 180.0" fill="none" stroke="#1c7ed6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="291" y="210" font-size="12.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">P6: 1000 → 800</text>
<text x="470" y="100" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The small print</text>
<text x="470" y="130" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">"up to 3.3 GHz": only for</text>
<text x="470" y="152" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a short time.</text>
<text x="470" y="174" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">A short test shows the peak.</text>
<text x="470" y="196" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">After 20 minutes the phone</text>
<text x="470" y="218" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">is warm: the sustained</text>
<text x="470" y="240" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">score is lower.</text>
