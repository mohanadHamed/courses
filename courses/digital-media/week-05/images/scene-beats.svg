<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="340" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">From the scene to beats to panels</text>
<rect x="24" y="52" width="200" height="230" rx="6" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
<text x="36" y="78" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="800" font-family="Courier New, monospace" xml:space="preserve">EXT. FLOODED STREET – DUSK</text>
<text x="36" y="106" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Courier New, monospace" xml:space="preserve">Water fills the street.</text>
<text x="36" y="134" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Courier New, monospace" xml:space="preserve">Nour jumps into the boat.</text>
<text x="36" y="162" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Courier New, monospace" xml:space="preserve">NOUR: Hold on, everyone.</text>
<text x="36" y="190" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Courier New, monospace" xml:space="preserve">She rows to the roof.</text>
<text x="36" y="218" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Courier New, monospace" xml:space="preserve">SALMA: I won&#x27;t leave</text>
<text x="36" y="246" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="600" font-family="Courier New, monospace" xml:space="preserve">without my cat.</text>
<rect x="270" y="66" width="150" height="34" rx="8" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="282" y="88" font-size="12.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">beat 1: the place</text>
<line x1="226" y1="88" x2="266" y2="83" stroke="#adb5bd" stroke-width="1.4" stroke-linecap="round"/>
<line x1="422" y1="83" x2="450.3" y2="83" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="458,83 449.4,87.3 449.4,78.7" fill="#adb5bd"/>
<rect x="462" y="66" width="120" height="34" rx="4" fill="#ffffff" stroke="#2a2f2c" stroke-width="1.6"/>
<text x="522" y="88" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">panel 1: wide</text>
<rect x="270" y="110" width="150" height="34" rx="8" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="282" y="132" font-size="12.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">beat 2: Nour acts</text>
<line x1="226" y1="130" x2="266" y2="127" stroke="#adb5bd" stroke-width="1.4" stroke-linecap="round"/>
<line x1="422" y1="127" x2="450.3" y2="127" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="458,127 449.4,131.3 449.4,122.7" fill="#adb5bd"/>
<rect x="462" y="110" width="120" height="34" rx="4" fill="#ffffff" stroke="#2a2f2c" stroke-width="1.6"/>
<text x="522" y="132" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">panel 2: medium</text>
<rect x="270" y="154" width="150" height="34" rx="8" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="282" y="176" font-size="12.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">beat 3: Nour speaks</text>
<line x1="226" y1="158" x2="266" y2="171" stroke="#adb5bd" stroke-width="1.4" stroke-linecap="round"/>
<line x1="422" y1="171" x2="450.3" y2="171" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="458,171 449.4,175.3 449.4,166.7" fill="#adb5bd"/>
<rect x="462" y="154" width="120" height="34" rx="4" fill="#ffffff" stroke="#2a2f2c" stroke-width="1.6"/>
<text x="522" y="176" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">panel 3: close-up</text>
<rect x="270" y="198" width="150" height="34" rx="8" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="282" y="220" font-size="12.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">beat 4: Nour acts</text>
<line x1="226" y1="186" x2="266" y2="215" stroke="#adb5bd" stroke-width="1.4" stroke-linecap="round"/>
<line x1="422" y1="215" x2="450.3" y2="215" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="458,215 449.4,219.3 449.4,210.7" fill="#adb5bd"/>
<rect x="462" y="198" width="120" height="34" rx="4" fill="#ffffff" stroke="#2a2f2c" stroke-width="1.6"/>
<text x="522" y="220" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">panel 4: medium</text>
<rect x="270" y="242" width="150" height="34" rx="8" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.6"/>
<text x="282" y="264" font-size="12.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">beat 5: Salma speaks</text>
<line x1="226" y1="228" x2="266" y2="259" stroke="#adb5bd" stroke-width="1.4" stroke-linecap="round"/>
<line x1="422" y1="259" x2="450.3" y2="259" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="458,259 449.4,263.3 449.4,254.7" fill="#adb5bd"/>
<rect x="462" y="242" width="120" height="34" rx="4" fill="#ffffff" stroke="#2a2f2c" stroke-width="1.6"/>
<text x="522" y="264" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">panel 5: close-up</text>
<text x="340" y="318" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">A new beat (a new action, a new speaker or a new place) gets a new panel.</text>
</svg>
