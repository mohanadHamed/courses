<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Rule Detective</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .pad button { font-family: ui-monospace, Consolas, monospace; text-align: left; }</style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Rule Detective</h1>
  <p class="hint">In the space game <i>Star Dock</i>, the designer lost the conditions of the dock doors. Only the test logs are left: a truth table for each door. Find the condition that gives exactly this table.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script src="logic.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const names = { p: "p: has the pass", q: "q: shields up", r: "r: alarm on" };
  const rounds = [
    { ans: "p && q", choices: C(["p && q", "p || q", "p ^ q", "!p && q"]), goal: "Door A opens only for a ship with the pass <b>and</b> the shields up. Which condition gives the log?" },
    { ans: "p || q", choices: C(["p || q", "p && q", "p ^ q", "!(p || q)"]), goal: "Door B: look at the log. It is false in one row only. Which condition?" },
    { ans: "p ^ q", choices: C(["p ^ q", "p || q", "p -> q", "!p || !q"]), goal: "Door C is true in two rows: exactly when p and q are different. Which condition?" },
    { ans: "p -> q", choices: C(["p -> q", "q -> p", "p && q", "!p && q"]), goal: "Door D is false only when p is true and q is false. Which condition?" },
    { ans: "(p && q) || r", choices: C(["(p && q) || r", "p && (q || r)", "p || q || r", "(p || q) && r"]), goal: "Door E has three inputs. Look for the rows with r = T. Which condition?" },
    { ans: "p && !r", choices: C(["p && !r", "!p && r", "p || !r", "p && r"]), goal: "The cargo bay: q does not matter. Which condition?" },
  ];
  rounds.forEach((r) => { r.answer = r.ans; r.e = LG.parse(r.ans); r.vars = r.ans.includes("r") ? ["p", "q", "r"] : ["p", "q"]; r.rows = LG.rows(r.vars);
    r.good = `The table of ${r.ans} matches every row of the log.`; r.why = {};
    r.choices.forEach((c) => { if (c.k !== r.ans) { const f = LG.parse(c.k), bad = r.rows.find((x) => f.eval(x) !== r.e.eval(x)); r.why[c.k] = `Look at the row ${r.vars.map((v) => v + " = " + LG.TF(bad[v])).join(", ")}: the log says ${LG.TF(r.e.eval(bad))}, but ${c.k} gives ${LG.TF(f.eval(bad))}.`; } }); });
  Kit.game({
    rounds, cols: 2, colsPhone: 1, animMs: 700, still: true,
    intro: "Round 1 is the story of the lesson: the log of door A.",
    canvas: (W) => 46 + 30 * 8,
    draw(c, W, H, now, r) {
      c.fillStyle = "#fbfdfa"; c.fillRect(0, 0, W, H);
      if (!r) return;
      const cols = [...r.vars, "door"], cw = Math.min(90, (W - 20) / cols.length), x0 = (W - cw * cols.length) / 2, rh = 28;
      cols.forEach((h, j) => { Kit.rrect(c, x0 + j * cw + 2, 6, cw - 4, rh, 6, "#2F9E44"); Kit.text(c, h, x0 + j * cw + cw / 2, 25, 13, "#fff"); });
      r.rows.forEach((row, i) => {
        const vals = [...r.vars.map((v) => row[v]), r.e.eval(row)];
        vals.forEach((v, j) => { const y = 8 + (i + 1) * (rh + 2); Kit.rrect(c, x0 + j * cw + 2, y, cw - 4, rh, 6, v ? "#ebfbee" : "#fff5f5", j === cols.length - 1 ? "#495057" : null, 1.5); Kit.text(c, v ? "T" : "F", x0 + j * cw + cw / 2, y + 19, 13, v ? "#2b8a3e" : "#c92a2a"); });
      });
      Kit.text(c, r.vars.map((v) => names[v]).join(" · "), W / 2, H - 6, 11, "#6b726e");
    },
  });
})();
</script>
</body>
</html>
