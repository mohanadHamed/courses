# 16-week schedule (titles from the official syllabus weekly table).
# The course page lists every lesson from this file. A lesson is ready (bright,
# with links) when week-NN/lesson-NN.qmd exists and has no `draft: true`;
# otherwise it is shown faded as "coming soon".
# Lessons are numbered across the course (week 1 → 01–02, week 2 → 03–04, ...).
weeks:
  - week: 1
    ilos: [A1]
    plos: [1]
    lessons:
      - {n: 1, title: "Computing Systems and Digital Platforms in the Games Industry", ilos: [A1]}
      - {n: 2, title: "How Games Run on the Devices We Use", ilos: [A1]}
  - week: 2
    ilos: [A1]
    plos: [1]
    lessons:
      - {n: 3, title: "Computer Components: CPU, Memory and Storage", ilos: [A1]}
      - {n: 4, title: "Identifying Components and Reading Specifications", ilos: [A1]}
  - week: 3
    ilos: [A1, B2]
    plos: [1, 4]
    lessons:
      - {n: 5, title: "Input/Output Devices, the GPU and Graphics Hardware", ilos: [A1]}
      - {n: 6, title: "Comparing Device Specifications for Gaming", ilos: [A1, B2]}
  - week: 4
    ilos: [A1, B2]
    plos: [1, 4]
    lessons:
      - {n: 7, title: "Smartphone Architecture: SoC, Sensors, Touch Screen and Battery", ilos: [A1]}
      - {n: 8, title: "Analyzing a Smartphone Specification Sheet", ilos: [A1, B2]}
  - week: 5
    ilos: [A2]
    plos: [1]
    lessons:
      - {n: 9, title: "Operating Systems: Functions, Processes and Memory Management", ilos: [A2]}
      - {n: 10, title: "Operating-System Tour on PC and Mobile", ilos: [A2]}
  - week: 6
    ilos: [A2, C1]
    plos: [1, 3]
    lessons:
      - {n: 11, title: "File Systems, Resources and Device Management", ilos: [A2]}
      - {n: 12, title: "Hands-on: File and Resource Management", ilos: [A2, C1]}
  - week: 7
    ilos: [A2, B1]
    plos: [1, 3]
    lessons:
      - {n: 13, title: "Mobile Operating Systems: Android and iOS Architecture", ilos: [A2]}
      - {n: 14, title: "Exploring Android and iOS Features", ilos: [A2, B1]}
  - week: 8
    ilos: [A1, A2, B1]
    plos: [1, 3]
    exam: "Midterm exam · Midterm discussion"
  - week: 9
    ilos: [B1, D1]
    plos: [1, 3]
    lessons:
      - {n: 17, title: "Mobile Platforms Compared: Android vs iOS", ilos: [B1]}
      - {n: 18, title: "Platform Comparison: An Individual Analysis", ilos: [B1, D1]}
  - week: 10
    ilos: [C2]
    plos: [3, 4]
    lessons:
      - {n: 19, title: "App Stores and Publishing Requirements", ilos: [C2]}
      - {n: 20, title: "Reviewing App-Store Guidelines", ilos: [C2]}
  - week: 11
    ilos: [A2]
    plos: [1]
    lessons:
      - {n: 21, title: "Networking Concepts: LAN, the Internet and Protocols", ilos: [A2]}
      - {n: 22, title: "Networking Tools Demonstration", ilos: [A2]}
  - week: 12
    ilos: [A2, C2]
    plos: [1, 3, 4]
    lessons:
      - {n: 23, title: "Cloud Computing: Models and Services", ilos: [A2]}
      - {n: 24, title: "Cloud Services for Games: Storage and Hosting", ilos: [A2, C2]}
  - week: 13
    ilos: [B1, B2]
    plos: [1, 3, 4]
    lessons:
      - {n: 25, title: "Gaming Platforms: Consoles, PC, Mobile and Cloud Gaming", ilos: [B1]}
      - {n: 26, title: "Case Study: Comparing Gaming Platforms", ilos: [B1, B2]}
  - week: 14
    ilos: [C1]
    plos: [1, 3]
    lessons:
      - {n: 27, title: "Setting Up Test Environments: Emulators and Real Devices", ilos: [C1]}
      - {n: 28, title: "Hands-on: Running a Sample App on an Emulator", ilos: [C1]}
  - week: 15
    ilos: [B2, C1, D1]
    plos: [1, 3, 4]
    lessons:
      - {n: 29, title: "Platform Performance and Compatibility: Case Studies", ilos: [B2, C1]}
      - {n: 30, title: "Individual Project: Performance and Compatibility Report", ilos: [B2, C1, D1]}
  - week: 16
    ilos: [All]
    plos: [1, 3, 4]
    exam: "Final exam"
