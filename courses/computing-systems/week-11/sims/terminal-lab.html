<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Terminal Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 5px 0; font-weight: 700; font-size: .9rem; }
    .sim .bar button.on { background: var(--sim-accent); color: #fff; }
    .sim .bar.cmd button { font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
    .sim pre.term { background: #1e1e2e; color: #e9ecef; font: 600 .86rem/1.45 ui-monospace, Consolas, monospace; padding: 10px 12px; border-radius: 10px; height: 290px; overflow: auto; margin: 6px 0; white-space: pre-wrap; }
    .sim pre.term b { color: #ffd43b; font-weight: 700; }
    .sim .in { display: flex; gap: 6px; } .sim .in input { flex: 1; font: 600 .95rem ui-monospace, Consolas, monospace; padding: 6px 8px; border-radius: 8px; border: 1.5px solid #ced4da; }
    .sim .task { font-weight: 800; color: var(--sim-accent); margin: 6px 0 0; }
  </style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Terminal Lab: network tools on Rami's laptop</h1>
  <p class="hint">Rami tests <i>Pocket Quest</i> in four places. Choose the place, then run the tools: tap a command or type it (ipconfig, ping, speedtest). The game server is <b>play.example.net</b>.</p>
  <div class="bar" id="place"></div>
  <div class="bar cmd" id="cmds"></div>
  <pre class="term" id="term" aria-live="polite"></pre>
  <div class="in"><input type="text" id="cmd" aria-label="a command" placeholder="ping play.example.net"><button type="button" id="run">Run</button></div>
  <p class="task" id="task"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SRV = "198.51.100.7", GW = "192.168.1.1";
  // Each place: the laptop's address, the ping times to the gateway and the server, the loss, the DNS and the speed.
  const PLACES = {
    "Office (cable)": { ip: "192.168.1.23", gw: [1, 2], srv: [22, 26], loss: 0, dns: true, down: 94, up: 38, note: "Everything is fine: low ping, no loss." },
    "Café (far from the Wi-Fi)": { ip: "192.168.8.41", gw: [6, 160], srv: [30, 210], loss: 25, dns: true, down: 6, up: 1.5, note: "The ping to the gateway is already slow and jumps: the problem is the Wi-Fi in the café." },
    "Hotel (name problem)": { ip: "10.0.4.17", gw: [3, 4], srv: [28, 31], loss: 0, dns: false, down: 40, up: 12, note: "ping by the name fails, but ping by the IP address works: a DNS problem." },
    "Home in the evening (busy route)": { ip: "192.168.0.12", gw: [2, 3], srv: [95, 120], loss: 2, dns: true, down: 22, up: 5, note: "The gateway answers fast, but the server is slow: the delay is outside the home, on the way to the server." },
  };
  let place = "Office (cable)";
  const ran = {};
  const TASKS = [
    { q: "Task 1: In the office, run ipconfig. What is the default gateway?", ok: () => ran["Office (cable)|ipconfig"] },
    { q: "Task 2: In the office, ping play.example.net. What is the average time?", ok: () => ran["Office (cable)|ping srv"] },
    { q: "Task 3: Go to the café. Ping the gateway and the server. How many packets are lost, and how much does the time jump?", ok: () => ran["Café (far from the Wi-Fi)|ping srv"] || ran["Café (far from the Wi-Fi)|ping gw"] },
    { q: "Task 4: In the hotel, ping play.example.net, then ping 198.51.100.7. What is the problem?", ok: () => ran["Hotel (name problem)|ping name"] && ran["Hotel (name problem)|ping ip"] },
    { q: "Task 5: At home in the evening, ping the gateway, then the server. Is the delay inside the home or outside?", ok: () => ran["Home in the evening (busy route)|ping gw"] && (ran["Home in the evening (busy route)|ping srv"] || ran["Home in the evening (busy route)|ping ip"]) },
  ];
  let ti = 0;
  const R = (a, b) => Math.round(a + Math.random() * (b - a));
  const gwOf = (p) => p.ip.replace(/\.\d+$/, ".1");
  function out(lines) { const t = $("term"); t.innerHTML += lines.join("\n") + "\n\n"; t.scrollTop = t.scrollHeight; }
  function run(raw) {
    const P = PLACES[place], cmd = raw.trim().toLowerCase().replace(/\s+/g, " ");
    if (!cmd) return;
    const [tool, host = ""] = cmd.split(" ");
    const lines = [`<b>C:\\&gt; ${cmd}</b>`];
    let key = null;
    const isSrvName = host === "play.example.net", isSrvIp = host === SRV, isGw = host === gwOf(P);
    if (tool === "ipconfig") {
      key = "ipconfig";
      lines.push("Wireless LAN adapter Wi-Fi:", `   IPv4 Address. . . . : ${P.ip}`, "   Subnet Mask . . . . : 255.255.255.0", `   Default Gateway . . : ${gwOf(P)}`, `   DNS Server. . . . . : ${gwOf(P)}`);
    } else if (tool === "ping") {
      if (!host) lines.push("Write a target, for example: ping play.example.net");
      else if (isSrvName && !P.dns) { lines.push("Ping request could not find host play.example.net."); key = "ping name"; }
      else if (isSrvName || isSrvIp || isGw) {
        const [a, b] = isGw ? P.gw : P.srv, ts = [];
        let lost = 0;
        lines.push(`Pinging ${isGw ? gwOf(P) : SRV}:`);
        for (let i = 0; i < 8; i++) { if (Math.random() * 100 < P.loss && lost < 3) { lines.push("Request timed out."); lost++; } else { const t = R(a, b); ts.push(t); lines.push(`Reply from ${isGw ? gwOf(P) : SRV}: time=${t}ms`); } }
        if (!lost && P.loss >= 20) { lines[lines.length - 1] = "Request timed out."; ts.pop(); lost = 1; }
        lines.push(`Packets: Sent = 8, Received = ${8 - lost}, Lost = ${lost} (${Math.round(lost / 8 * 100)}% loss)`);
        if (ts.length) lines.push(`Minimum = ${Math.min(...ts)}ms, Maximum = ${Math.max(...ts)}ms, Average = ${Math.round(ts.reduce((x, y) => x + y, 0) / ts.length)}ms`);
        key = isGw ? "ping gw" : isSrvIp ? "ping ip" : "ping srv";
      } else if (host === GW) lines.push("Request timed out.", "(This network does not use 192.168.1.1. Run ipconfig to find the gateway.)");
      else lines.push(`Ping request could not find host ${host}.`);
    } else if (tool === "speedtest") {
      lines.push(`Download: ${P.down} Mbit/s`, `Upload:   ${P.up} Mbit/s`, `Ping:     ${R(P.srv[0], P.srv[1])} ms`); key = "speedtest";
    } else lines.push(`'${tool}' is not a command of this lab. Try ipconfig, ping or speedtest.`);
    out(lines);
    if (key) ran[place + "|" + key] = true;
    let m = "";
    while (ti < TASKS.length && TASKS[ti].ok()) { ti++; m = "✓ Done. "; Kit.good(); }
    $("task").textContent = ti < TASKS.length ? TASKS[ti].q : "All tasks are done: from near (ipconfig, the gateway) to far (the server).";
    $("msg").textContent = m + (key ? P.note : "");
  }
  function tabs() {
    Kit.buttons($("place"), Object.keys(PLACES).map((k) => ({ k, label: k })), (k) => { place = k; tabs(); $("term").innerHTML = ""; out([`(Rami is now at: ${k})`]); $("msg").textContent = ""; cmds(); });
    $("place").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.k === place));
  }
  function cmds() {
    const L = ["ipconfig", "ping " + gwOf(PLACES[place]), "ping play.example.net", "ping " + SRV, "speedtest"];
    Kit.buttons($("cmds"), L.map((k) => ({ k, label: k })), (k) => run(k));
  }
  $("run").addEventListener("click", () => { run($("cmd").value); $("cmd").value = ""; });
  $("cmd").addEventListener("keydown", (e) => { if (e.key === "Enter") { run($("cmd").value); $("cmd").value = ""; } });
  window.TL = { place: (k) => { place = k; tabs(); $("term").innerHTML = ""; $("msg").textContent = ""; out([`(Rami is now at: ${k})`]); cmds(); }, run };
  tabs(); cmds(); out(["(Rami is now at: Office (cable))"]);
  $("task").textContent = TASKS[0].q;
})();
</script>
</body>
</html>
