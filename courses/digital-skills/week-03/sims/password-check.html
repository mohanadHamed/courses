<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Password Check</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .warn { font-weight: 800; background: #fff4e6; border: 1.5px dashed #FFC078; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
    .sim input[type=text] { font: inherit; font-size: 1.05rem; padding: 8px 10px; border: 1.5px solid #ced4da; border-radius: 10px; width: 100%; max-width: 420px; box-sizing: border-box; }
    .sim .meter { height: 14px; border-radius: 7px; background: #e9ecef; max-width: 420px; margin: 10px 0 4px; overflow: hidden; }
    .sim .meter i { display: block; height: 100%; width: 0; background: #c92a2a; transition: width .25s, background .25s; }
    .sim .level { font-weight: 800; }
    .sim ul.rules { list-style: none; padding: 0; margin: 8px 0; }
    .sim ul.rules li { margin: 4px 0; font-weight: 700; }
    .sim ul.rules li.ok { color: #2b8a3e; }
    .sim ul.rules li.no { color: #868e96; }
    .sim .pad { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .sim .pad button { font-family: ui-monospace, Menlo, Consolas, monospace; }
  </style>
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Password Check: weak or strong?</h1>
  <p class="hint">Type a made-up password, or tap an example. The checker shows what makes it strong.</p>
  <div class="warn">Never type your real password here, or on any page that is not the real sign-in page.</div>
  <input type="text" id="pw" autocomplete="off" spellcheck="false" placeholder="a made-up password">
  <div class="meter"><i id="bar"></i></div>
  <div class="level" id="level">Type a password.</div>
  <ul class="rules" id="rules"></ul>
  <p><b>Examples:</b></p>
  <div class="pad" id="ex"></div>
  <p id="msg" class="message"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const EXAMPLES = ["sami2005", "Password123", "qwerty", "Blue-Camel-Rain-47", "Huda1990!", "green lamp river 82"];
  const COMMON = ["password", "123456", "qwerty", "111111", "abc123", "iloveyou", "admin", "welcome", "sami", "huda", "omar", "lina", "mona"];
  const $ = (id) => document.getElementById(id);
  function check(p) {
    const low = p.toLowerCase();
    const kinds = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/].filter((r) => r.test(p)).length;
    const common = COMMON.some((w) => low.includes(w)) || /(19|20)\d\d/.test(p);
    const rules = [
      [p.length >= 12, `At least 12 characters (now ${p.length})`],
      [kinds >= 3, "Three kinds: small letters, capital letters, numbers, symbols or spaces"],
      [!common, "No common word, name or year (password, qwerty, sami, 2005 …)"],
    ];
    const score = rules.filter((r) => r[0]).length;
    return { rules, score, common };
  }
  function show() {
    const p = $("pw").value;
    if (!p) { $("bar").style.width = "0"; $("level").textContent = "Type a password."; $("rules").innerHTML = ""; $("msg").textContent = ""; return; }
    const { rules, score, common } = check(p);
    const level = score === 3 ? ["Strong", "#2b8a3e", 100] : score === 2 && !common ? ["Fair", "#e67700", 66] : ["Weak", "#c92a2a", 30];
    $("bar").style.width = level[2] + "%"; $("bar").style.background = level[1];
    $("level").textContent = "Strength: " + level[0]; $("level").style.color = level[1];
    $("rules").innerHTML = rules.map(([ok, t]) => `<li class="${ok ? "ok" : "no"}">${ok ? "✓" : "○"} ${t}</li>`).join("");
    $("msg").className = "message " + (score === 3 ? "good" : "bad");
    $("msg").textContent = score === 3
      ? "✓ Strong: long and hard to guess. Use it for one account only, and turn on two-step verification."
      : common ? "✗ People and programs guess common words, names and years first."
      : p.length < 12 ? "✗ Too short: a computer tries short passwords fast. Join three or four random words." : "✗ Mix more kinds of characters.";
  }
  EXAMPLES.forEach((e) => { const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.textContent = e;
    b.addEventListener("click", () => { $("pw").value = e; show(); }); $("ex").appendChild(b); });
  $("pw").addEventListener("input", show);
  show();
})();
</script>
</body>
</html>
