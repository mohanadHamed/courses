<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="500" fill="#ffffff"/>
<text x="16" y="30" font-size="19" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Scene Cutter</text>
<text x="16" y="52" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">The producer wants 35 seconds. Cut the weak lines; keep the goal, the obstacle and the turn.</text>
<rect x="16" y="66" width="608" height="26" rx="8" fill="#e9ecef" stroke="none" stroke-width="1.5"/>
<rect x="16" y="66" width="526.9" height="26" rx="8" fill="#c92a2a" stroke="none" stroke-width="1.5"/>
<text x="26" y="84" font-size="13" fill="#fff" text-anchor="start" font-weight="800" xml:space="preserve">52 s of 35 s</text>
<rect x="16" y="104" width="608" height="38" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1.5"/>
<text x="30" y="129" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Rain. Salma sits on the roof, the cat in her arms.</text>
<rect x="16" y="150" width="608" height="38" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1.5"/>
<text x="30" y="175" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">NOUR: Grandma Salma! Get in the boat, quickly!</text>
<rect x="16" y="196" width="608" height="38" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
<text x="30" y="221" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">SALMA: Hello, Nour. How is your mother?</text>
<line x1="26" y1="217" x2="295.2" y2="217" stroke="#c92a2a" stroke-width="2" stroke-linecap="round"/>
<rect x="16" y="242" width="608" height="38" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
<text x="30" y="267" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">NOUR: She's fine. She's at the hill with the others.</text>
<line x1="26" y1="263" x2="383.6" y2="263" stroke="#c92a2a" stroke-width="2" stroke-linecap="round"/>
<rect x="16" y="288" width="608" height="38" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1.5"/>
<text x="30" y="313" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">SALMA: I am not going. Fifty years in this house.</text>
<rect x="16" y="334" width="608" height="38" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1.5"/>
<text x="30" y="359" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">NOUR: As you know, the river has flooded the city.</text>
<rect x="16" y="380" width="608" height="38" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1.5"/>
<text x="30" y="405" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">NOUR: I am very scared and very sad.</text>
<text x="16" y="440" font-size="13" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Scene 1 / 2 · Rooftop</text>
<rect x="16" y="452" width="140" height="36" rx="9" fill="#9C36B5" stroke="none" stroke-width="1.5"/>
<text x="86" y="476" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">Check the cut</text>
</svg>
