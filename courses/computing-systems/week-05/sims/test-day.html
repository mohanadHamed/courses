<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Test Day</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .pad button { text-align: left; }</style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Test Day</h1>
  <p class="hint">Rami, a tester at <b>Byte Bay</b>, prepares phone <b>P5</b> to test <i>Pocket Quest 1.2</i> for 40 minutes. Help him make each step right.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  // state: what the phone shows in this round
  const rounds = [
    { st: { free: 1.1, bat: 34, apps: 9 }, goal: "P5 has <b>1.1 GB</b> free. The test needs 2 GB (the build and screenshots). What does Rami do first?",
      choices: C(["delete old videos and clear caches", "clear the storage (data) of every app", "start the test anyway", "buy a new phone"]), answer: "delete old videos and clear caches",
      good: "Old videos and caches free space without deleting anyone's progress.", why: { "clear the storage (data) of every app": "That deletes the progress and the logins of every app.", "start the test anyway": "The phone may run out of space in the middle of the test." } },
    { st: { free: 3.4, bat: 34, apps: 9 }, goal: "The battery shows <b>34 %</b>, and the test lasts 40 minutes. What now?",
      choices: C(["charge it above 50 % first", "turn the brightness to maximum", "test now, it is enough", "take out the battery"]), answer: "charge it above 50 % first",
      good: "A phone in power-saving mode slows down and changes the results; charge first.", why: { "test now, it is enough": "At low battery, many phones save power and slow the game down." } },
    { st: { free: 3.4, bat: 62, apps: 9 }, goal: "<b>9 apps</b> are open in the background. What does Rami do?",
      choices: C(["close them, keep only the game", "open more apps to test", "restart the PC", "nothing"]), answer: "close them, keep only the game",
      good: "Other apps take RAM and CPU time and change the results.", why: { nothing: "Background apps use memory and battery during the test." } },
    { st: { free: 3.4, bat: 62, apps: 1 }, goal: "Rami connects P5 to the PC by USB to copy 40 screenshots. <b>The PC sees no files.</b> Why?",
      choices: C(["the phone is set to charging only", "the screenshots are too big", "the PC has no Wi-Fi", "FAT32"]), answer: "the phone is set to charging only",
      good: "On the phone, choose USB mode “File transfer”; then the PC shows its folders.", why: { FAT32: "The phone's own file system is not the problem here." } },
    { st: { free: 3.4, bat: 62, apps: 1 }, goal: "Which name fits the screenshot of level 3 on P5, taken on 12 November 2026?",
      choices: C(["2026-11-12_P5_level3.png", "screenshot final new.png", "IMG_4821.png", "level3.png"]), answer: "2026-11-12_P5_level3.png",
      good: "Date first, the device, what it shows, no spaces: the files sort by date and tell everything.", why: { "IMG_4821.png": "This says nothing about the test.", "level3.png": "Which phone? Which day?" } },
    { st: { free: 3.4, bat: 62, apps: 1 }, goal: "Last time, a phone call stopped the test in the middle. What does Rami turn on?",
      choices: C(["Do not disturb", "Bluetooth", "the camera", "location"]), answer: "Do not disturb",
      good: "Do not disturb keeps calls and notifications away during the test.", why: { Bluetooth: "Bluetooth does not stop calls." } },
  ];
  Kit.game({
    rounds, cols: 1, colsPhone: 1, animMs: 600, still: true,
    intro: "Round 1 is the story of the lesson: phone P5 before the test.",
    canvas: () => 92,
    draw(c, W, H, now, r) {
      c.fillStyle = "#fffdf5"; c.fillRect(0, 0, W, H);
      if (!r) return;
      const s = r.st, items = [[`Free: ${s.free} GB`, s.free >= 2], [`Battery: ${s.bat} %`, s.bat > 50], [`Open apps: ${s.apps}`, s.apps <= 1]];
      const w = (W - 40) / 3;
      items.forEach(([t, ok], i) => {
        const x = 10 + i * (w + 10);
        Kit.rrect(c, x, 14, w, 60, 10, ok ? "#ebfbee" : "#fff5f5", ok ? "#2b8a3e" : "#c92a2a", 2);
        Kit.text(c, t, x + w / 2, 40, W < 460 ? 11 : 14, ok ? "#2b8a3e" : "#c92a2a");
        Kit.text(c, ok ? "ready" : "not ready", x + w / 2, 60, 11, "#7a6a60");
      });
    },
  });
})();
</script>
</body>
</html>
