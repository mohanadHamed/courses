# Applies to every page in this course folder.
# Source: course syllabus 01101154 v4 (2026-11-14: the official course
# description of the study plan, merged with the description of Smart
# Digital Skills 01101151: Office and AI tools; blended).
author: "Mohanad Hamed"
# Taught to every diploma of the college, not only Mobile Game Development:
# overrides the diploma line of _quarto.yml (banner, PDF footer, title slide).
diploma-line: "All diploma programmes — Technical College, Al-Israa University"
course:
  slug: "digital-skills"
  file-prefix: "digital_skills"   # downloads: digital_skills_lecture5.pdf, digital_skills_practice2.pdf, digital_skills_online6_tasks.pdf
  title: "Digital Skills"
  code: "01101154"
  minutes: 60          # the face-to-face lab lecture = one lesson
  # Blended: each unit has a face-to-face session (Lecture N or Practice N:
  # notes or worksheet, page, slides) and an online activity (online-NN.qmd
  # with online: N; tasks to submit on the e-learning platform). No separate
  # homework.
  blended: true
  theme: "workshop"    # course look: colours in lesson.css and the PDF template
  accent: "#D9480F"
  accent2: "#FFC078"
  tagline: "Office and AI tools, data, databases, websites and e-marketing for study and work"
  textbook: "Evans, A.; Martin, K.; Poatsy, M. A. Technology in Action, Global Edition. 18th ed. Pearson, 2024."
  # Lessons list ILO codes (ilos: [A1]); the banner prints the text below.
  ilos:
    A1: "Explain the concept of digital skills, their importance in the labour market, and the main computer applications used to enhance daily productivity, including artificial intelligence tools. (PLO 3)"
    A2: "Describe digital devices and technologies, and explain basic concepts and terminology related to Microsoft Office applications. (PLO 3)"
    A3: "Describe the main features and uses of Microsoft Word, Excel and PowerPoint: how Word is used to create and format documents, how Excel is used to organize and present data, and the basic features of PowerPoint used to create presentations. (PLO 3)"
    A4: "Describe the basic concepts of digital services and e-marketing. (PLO 3)"
    B1: "Analyze data with spreadsheets (formulas, functions, charts and PivotTables), with the help of AI tools, to reach conclusions that support decisions. (PLO 3, 4)"
    B2: "Evaluate AI-generated text, data and images for accuracy, bias and suitability before using them in a document, worksheet, presentation or marketing content. (PLO 3, 4)"
    C1: "Use digital devices and technologies (operating system, files, cloud services, communication tools and AI assistants) to do study and work tasks safely. (PLO 3)"
    C2: "Create, edit and present digital content (Word documents, PowerPoint presentations and graphics) with suitable digital tools, using AI tools to support document creation and presentation design. (PLO 2, 3)"
    C3: "Organize and manage data in a simple database (tables, relationships, queries, forms and reports). (PLO 1, 3)"
    C4: "Create a simple digital service, and design and publish a website for it. (PLO 2, 3)"
    C5: "Market a digital service or a good online: prepare an e-marketing plan and its promotional content. (PLO 3, 4)"
    D1: "Carry out and present an integrated practical project that applies the course skills (a digital service with its website, Office content, data, marketing plan and a statement of AI use). (PLO 3, 4)"
