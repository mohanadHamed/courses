<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <!-- Source of files/books.png, the picture of the Lecture 4 worksheet (Experiment 4),
       exported with shared/sims/export-poster.typ at 200 ppi (shared/sims/README.md). -->
  <rect x="0" y="0" width="320" height="220" rx="14" fill="#FFF4E6"/>
  <!-- a stack of three books lying on the shelf -->
  <rect x="26" y="146" width="62" height="14" rx="3" fill="#0CA678"/>
  <rect x="30" y="132" width="56" height="14" rx="3" fill="#FAB005"/>
  <rect x="24" y="118" width="60" height="14" rx="3" fill="#7048E8"/>
  <!-- books standing on the shelf -->
  <rect x="98" y="60" width="26" height="100" rx="3" fill="#D9480F"/>
  <rect x="126" y="76" width="22" height="84" rx="3" fill="#FFC078"/>
  <rect x="150" y="52" width="30" height="108" rx="3" fill="#7048E8"/>
  <rect x="182" y="70" width="24" height="90" rx="3" fill="#0CA678"/>
  <rect x="208" y="58" width="28" height="102" rx="3" fill="#E03131"/>
  <rect x="238" y="80" width="22" height="80" rx="3" fill="#FAB005"/>
  <!-- one book leans on the last one -->
  <rect x="262" y="66" width="26" height="96" rx="3" fill="#F783AC" transform="rotate(-12 288 162)"/>
  <!-- labels on the spines -->
  <rect x="104" y="96" width="14" height="22" rx="2" fill="#FFF4E6" opacity="0.85"/>
  <rect x="158" y="90" width="14" height="22" rx="2" fill="#FFF4E6" opacity="0.85"/>
  <rect x="214" y="94" width="16" height="22" rx="2" fill="#FFF4E6" opacity="0.85"/>
  <!-- the wooden shelf -->
  <rect x="14" y="160" width="292" height="16" rx="4" fill="#8B5E34"/>
  <rect x="14" y="176" width="292" height="8" rx="3" fill="#6F4A28"/>
</svg>
