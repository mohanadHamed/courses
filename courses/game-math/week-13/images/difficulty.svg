<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Difficulty from probability: expected hits to win</text>
<rect x="20" y="54" width="690" height="34" rx="0" fill="#2F9E44"/>
<text x="30" y="75.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">enemy</text>
<text x="245" y="75.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">health</text>
<text x="355" y="75.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">damage</text>
<text x="485" y="75.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">hit chance</text>
<text x="635" y="75.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">expected attacks</text>
<text x="30" y="109.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">bat</text>
<text x="245" y="109.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">20</text>
<text x="355" y="109.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">10</text>
<text x="485" y="109.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">0.8</text>
<text x="635" y="109.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">2 / 0.8 = 2.5</text>
<rect x="20" y="122" width="690" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="143.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">skeleton</text>
<text x="245" y="143.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">40</text>
<text x="355" y="143.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">10</text>
<text x="485" y="143.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">0.6</text>
<text x="635" y="143.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">4 / 0.6 ≈ 6.7</text>
<text x="30" y="177.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">guard</text>
<text x="245" y="177.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">60</text>
<text x="355" y="177.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">10</text>
<text x="485" y="177.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">0.5</text>
<text x="635" y="177.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">6 / 0.5 = 12</text>
<rect x="20" y="54" width="690" height="136" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="206" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Hits needed = health ÷ damage (rounded up). Expected attacks = hits ÷ hit chance. A designer changes</text>
<text x="20" y="222.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">one number to move an enemy from easy to hard.</text>
</svg>
