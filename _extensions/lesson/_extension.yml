title: Lesson formats
author: Mohanad Hamed
version: 0.1.0
quarto-required: ">=1.10.0"
contributes:
  formats:
    common:
      shortcodes:
        - shortcodes.lua
    html:
      filters:
        - banner.lua
      css: lesson.css
      include-after-body: sim-embed.html
      format-links: false   # banner.lua adds a "Download PDF" link instead
      toc: true
      toc-title: "In this lesson"
      toc-depth: 2
      code-copy: true
    typst:
      filters:
        - banner.lua
      papersize: a4
      margin:
        x: 2cm
        y: 2cm
      mainfont: "Noto Sans"
      fontsize: 11pt
      page-numbering: "1 / 1"
      toc: false
      callout-icon: false
      include-before-body: typst-body.typ
    pptx:
      slide-level: 2
