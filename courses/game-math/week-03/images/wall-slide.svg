<text x="48.0" y="285.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">floor</text>
<line x1="80.0" y1="100.0" x2="200.0" y2="260.0" stroke="#e8590c" stroke-width="4" stroke-linecap="round" marker-end="url(#me8590c)"/>
<text x="128.0" y="172.0" font-size="13" fill="#e8590c" text-anchor="end" font-weight="800" xml:space="preserve">v = (3, −4)</text>
<line x1="200.0" y1="260.0" x2="200.0" y2="100.0" stroke="#2F9E44" stroke-width="4" stroke-linecap="round" marker-end="url(#m2F9E44)"/>
<text x="208.0" y="132.0" font-size="13" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">n = (0, 1)</text>
<line x1="200.0" y1="260.0" x2="320.0" y2="260.0" stroke="#1971c2" stroke-width="5" stroke-linecap="round" marker-end="url(#m1971c2)"/>
<text x="256.0" y="238.0" font-size="13" fill="#1971c2" text-anchor="middle" font-weight="800" xml:space="preserve">slide = (3, 0)</text>
<line x1="200.0" y1="260.0" x2="200.0" y2="296.0" stroke="#c92a2a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#mc92a2a)"/>
<text x="208.0" y="290.0" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">removed: (0, −4)</text>
<rect x="390.0" y="40.0" width="236.0" height="132.0" rx="10" fill="#f8f9fa" stroke="none" stroke-width="1.5"/>
<text x="402.0" y="64.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">v · n = 3 × 0 + (−4) × 1 = −4</text>
<text x="402.0" y="86.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">into the floor: subtract</text>
<text x="402.0" y="108.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">slide = v − (v · n) n</text>
<text x="402.0" y="130.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">  = (3, −4) − (−4) × (0, 1)</text>
<text x="402.0" y="152.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">  = (3, −4) + (0, 4) = (3, 0)</text>
<text x="390.0" y="210.0" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">The player keeps moving along</text>
<text x="390.0" y="228.0" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">the floor and does not sink in.</text>
</svg>
