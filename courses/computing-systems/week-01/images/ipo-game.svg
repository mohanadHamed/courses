<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A86700"/></marker></defs>
<rect x="20" y="30" width="190" height="120" rx="14" fill="#FFF6DB" stroke="#A86700" stroke-width="2.5"/>
<text x="115.0" y="60" font-size="18" fill="#A86700" text-anchor="middle">INPUT</text>
<text x="115.0" y="86" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">touch screen</text>
<text x="115.0" y="106" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">buttons, sensors</text>
<rect x="265" y="30" width="190" height="120" rx="14" fill="#FFF6DB" stroke="#A86700" stroke-width="2.5"/>
<text x="360.0" y="60" font-size="18" fill="#A86700" text-anchor="middle">PROCESSING</text>
<text x="360.0" y="86" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">CPU: game rules</text>
<text x="360.0" y="106" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">GPU: pictures</text>
<rect x="510" y="30" width="190" height="120" rx="14" fill="#FFF6DB" stroke="#A86700" stroke-width="2.5"/>
<text x="605.0" y="60" font-size="18" fill="#A86700" text-anchor="middle">OUTPUT</text>
<text x="605.0" y="86" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">screen</text>
<text x="605.0" y="106" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">speaker, vibration</text>
<rect x="265" y="230" width="190" height="110" rx="14" fill="#FFF6DB" stroke="#A86700" stroke-width="2.5"/>
<text x="360.0" y="260" font-size="18" fill="#A86700" text-anchor="middle">STORAGE</text>
<text x="360.0" y="286" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">keeps the game</text>
<text x="360.0" y="306" font-size="14" font-weight="400" fill="#2a211c" text-anchor="middle">and your saves</text>
<line x1="212" y1="90" x2="260" y2="90" stroke="#A86700" stroke-width="3" marker-end="url(#a)"/>
<line x1="457" y1="90" x2="505" y2="90" stroke="#A86700" stroke-width="3" marker-end="url(#a)"/>
<line x1="360" y1="155" x2="360" y2="225" stroke="#A86700" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="115" y="172" font-size="13" font-weight="400" font-style="italic" fill="#7a6a60" text-anchor="middle">You tap “jump”.</text>
<text x="605" y="172" font-size="13" font-weight="400" font-style="italic" fill="#7a6a60" text-anchor="middle">You see the jump.</text>
<text x="605" y="190" font-size="13" font-weight="400" font-style="italic" fill="#7a6a60" text-anchor="middle">You hear a sound.</text>
<text x="360" y="362" font-size="13" font-weight="400" font-style="italic" fill="#7a6a60" text-anchor="middle">The game saves your score.</text>
<text x="345" y="186" font-size="13" font-weight="400" font-style="italic" fill="#7a6a60" text-anchor="end">The game moves</text>
<text x="345" y="204" font-size="13" font-weight="400" font-style="italic" fill="#7a6a60" text-anchor="end">the player.</text>
</svg>
