<svg xmlns="http://www.w3.org/2000/svg" width="680" height="296" viewBox="0 0 680 296" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="296" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">An event table for each room of Torch Hall</text>
<rect x="20" y="50" width="610" height="36" rx="0" fill="#2F9E44"/>
<text x="30" y="72.7" font-size="13" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">event</text>
<text x="250" y="72.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">weight</text>
<text x="365" y="72.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">probability</text>
<text x="530" y="72.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">reward or cost</text>
<text x="30" y="108.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">empty room</text>
<text x="250" y="108.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">50</text>
<text x="365" y="108.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">50 %</text>
<text x="530" y="108.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">0</text>
<rect x="20" y="122" width="610" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="144.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">chest</text>
<text x="250" y="144.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">25</text>
<text x="365" y="144.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">25 %</text>
<text x="530" y="144.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">+20 coins</text>
<text x="30" y="180.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">bats</text>
<text x="250" y="180.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">20</text>
<text x="365" y="180.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">20 %</text>
<text x="530" y="180.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">−5 health</text>
<rect x="20" y="194" width="610" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="216.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">golden torch</text>
<text x="250" y="216.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">5</text>
<text x="365" y="216.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">5 %</text>
<text x="530" y="216.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">+100 coins</text>
<rect x="20" y="50" width="610" height="180" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="252" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Expected coins per room: 0.25 · 20 + 0.05 · 100 = 10. A floor of 8 rooms gives 80 coins on average; a</text>
<text x="20" y="267.6" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">shuffle bag of 20 rooms gives exactly 5 chests and 1 torch.</text>
</svg>
