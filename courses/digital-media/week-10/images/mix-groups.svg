<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="310" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A game mix: four groups, one master</text>
<rect x="30" y="56" width="200" height="44" rx="10" fill="#e8590c18" stroke="#e8590c" stroke-width="1.8"/>
<text x="46" y="84" font-size="15" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">voice</text>
<text x="214" y="84" font-size="11.5" fill="#2a2f2c" text-anchor="end" font-weight="700" xml:space="preserve">1 most important</text>
<line x1="232" y1="78" x2="324.6" y2="161.2" stroke="#adb5bd" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="330,166 321.4,163.6 326.7,157.7" fill="#adb5bd"/>
<rect x="30" y="112" width="200" height="44" rx="10" fill="#1c7ed618" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="46" y="140" font-size="15" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">effects</text>
<text x="214" y="140" font-size="11.5" fill="#2a2f2c" text-anchor="end" font-weight="700" xml:space="preserve">2 game information</text>
<line x1="232" y1="134" x2="323.2" y2="163.8" stroke="#adb5bd" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="330,166 321.2,167.3 323.6,159.7" fill="#adb5bd"/>
<rect x="30" y="168" width="200" height="44" rx="10" fill="#9C36B518" stroke="#9C36B5" stroke-width="1.8"/>
<text x="46" y="196" font-size="15" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">music</text>
<text x="214" y="196" font-size="11.5" fill="#2a2f2c" text-anchor="end" font-weight="700" xml:space="preserve">3 mood, a bed</text>
<line x1="232" y1="190" x2="323" y2="167.7" stroke="#adb5bd" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="330,166 323.2,171.8 321.3,164" fill="#adb5bd"/>
<rect x="30" y="224" width="200" height="44" rx="10" fill="#0c859918" stroke="#0c8599" stroke-width="1.8"/>
<text x="46" y="252" font-size="15" fill="#0c8599" text-anchor="start" font-weight="800" xml:space="preserve">UI</text>
<text x="214" y="252" font-size="11.5" fill="#2a2f2c" text-anchor="end" font-weight="700" xml:space="preserve">4 short clicks</text>
<line x1="232" y1="246" x2="324.4" y2="170.6" stroke="#adb5bd" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="330,166 326.3,174.2 321.3,168" fill="#adb5bd"/>
<rect x="336" y="130" width="120" height="72" rx="12" fill="#9C36B5"/>
<text x="396" y="162" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">master</text>
<text x="396" y="184" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" xml:space="preserve">below 0 dB</text>
<rect x="480" y="56" width="180" height="216" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="494" y="80" font-size="15" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Rules</text>
<text x="494" y="98" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Lower before you raise.</text>
<text x="494" y="140" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The voice about 6 dB</text>
<text x="494" y="156.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">above the music.</text>
<text x="494" y="200" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Every player gets a</text>
<text x="494" y="216.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">slider for each group.</text>
</svg>
