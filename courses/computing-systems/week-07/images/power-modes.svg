<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Normal mode and power-saving mode during a game</text>
<rect x="30" y="56" width="600" height="38" rx="0" fill="#A86700"/>
<text x="40" y="79.7" font-size="13" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve"></text>
<text x="330" y="79.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">normal</text>
<text x="530" y="79.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">power saving</text>
<text x="40" y="117.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">frame rate</text>
<text x="330" y="117.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">60 fps</text>
<text x="530" y="117.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">about 30 fps</text>
<rect x="30" y="132" width="600" height="38" rx="0" fill="#f8f9fa"/>
<text x="40" y="155.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">brightness</text>
<text x="330" y="155.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">normal</text>
<text x="530" y="155.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">lower</text>
<text x="40" y="193.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">battery use</text>
<text x="330" y="193.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">about 25 % / hour</text>
<text x="530" y="193.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">about 15 % / hour</text>
<rect x="30" y="208" width="600" height="38" rx="0" fill="#f8f9fa"/>
<text x="40" y="231.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">background work</text>
<text x="330" y="231.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">normal</text>
<text x="530" y="231.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">less (mail, sync)</text>
<text x="40" y="269.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">for a test?</text>
<text x="330" y="269.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">yes</text>
<text x="530" y="269.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">no: charge instead</text>
<rect x="30" y="56" width="600" height="228" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="340" y="308" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Round example numbers; real phones differ. Android: Battery saver. iPhone: Low Power Mode.</text>
</svg>
