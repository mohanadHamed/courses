<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Android and iOS: the same job, two ways</text>
<rect x="20" y="50" width="640" height="33" rx="0" fill="#A86700"/>
<text x="30" y="71.2" font-size="13" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve"></text>
<text x="270" y="71.2" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Android</text>
<text x="530" y="71.2" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">iOS</text>
<text x="30" y="104.2" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">made by</text>
<text x="270" y="104.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Google + many phone makers</text>
<text x="530" y="104.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Apple, for its own devices</text>
<rect x="20" y="116" width="640" height="33" rx="0" fill="#f8f9fa"/>
<text x="30" y="137.2" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">kernel</text>
<text x="270" y="137.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Linux</text>
<text x="530" y="137.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Apple's own kernel</text>
<text x="30" y="170.2" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">app languages</text>
<text x="270" y="170.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Kotlin, Java (C++)</text>
<text x="530" y="170.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Swift (Objective-C, C++)</text>
<rect x="20" y="182" width="640" height="33" rx="0" fill="#f8f9fa"/>
<text x="30" y="203.2" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">app package</text>
<text x="270" y="203.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">.apk / .aab</text>
<text x="530" y="203.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">.ipa</text>
<text x="30" y="236.2" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">graphics</text>
<text x="270" y="236.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Vulkan, OpenGL ES</text>
<text x="530" y="236.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Metal</text>
<rect x="20" y="248" width="640" height="33" rx="0" fill="#f8f9fa"/>
<text x="30" y="269.2" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">main store</text>
<text x="270" y="269.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Google Play (and others)</text>
<text x="530" y="269.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">App Store</text>
<text x="30" y="302.2" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">updates</text>
<text x="270" y="302.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">from the phone maker, late or never</text>
<text x="530" y="302.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">from Apple, for all supported iPhones</text>
<rect x="20" y="50" width="640" height="264" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
</svg>
