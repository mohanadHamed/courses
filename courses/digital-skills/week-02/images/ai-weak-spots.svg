<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="900" height="280" fill="#ffffff"/>
<rect x="10" y="10" width="880" height="260" rx="18" fill="#fff9f2" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="450.0" y="42" font-size="17" fill="#7a2a06" text-anchor="middle" font-weight="800">Five weak spots of AI answers</text>
<rect x="30" y="66" width="160" height="160" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<circle cx="110" cy="104" r="24" fill="#D9480F" stroke="none" stroke-width="0"/>
<text x="110" y="112" font-size="22" fill="#fff" text-anchor="middle" font-weight="800">1</text>
<text x="110" y="152" font-size="14.5" fill="#D9480F" text-anchor="middle" font-weight="800">Invented facts</text>
<text x="110" y="178" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700">a book or an award</text>
<text x="110" y="196" font-size="12" fill="#7a6a60" text-anchor="middle" font-weight="600">that does not exist</text>
<rect x="200" y="66" width="160" height="160" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<circle cx="280" cy="104" r="24" fill="#1c7ed6" stroke="none" stroke-width="0"/>
<text x="280" y="112" font-size="22" fill="#fff" text-anchor="middle" font-weight="800">2</text>
<text x="280" y="152" font-size="14.5" fill="#1c7ed6" text-anchor="middle" font-weight="800">Old information</text>
<text x="280" y="178" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700">a version or a price</text>
<text x="280" y="196" font-size="12" fill="#7a6a60" text-anchor="middle" font-weight="600">from years ago</text>
<rect x="370" y="66" width="160" height="160" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<circle cx="450" cy="104" r="24" fill="#c92a2a" stroke="none" stroke-width="0"/>
<text x="450" y="112" font-size="22" fill="#fff" text-anchor="middle" font-weight="800">3</text>
<text x="450" y="152" font-size="14.5" fill="#c92a2a" text-anchor="middle" font-weight="800">Wrong numbers</text>
<text x="450" y="178" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700">12 x 0.25 = 3.50 JD</text>
<text x="450" y="196" font-size="12" fill="#7a6a60" text-anchor="middle" font-weight="600">(right: 3.00 JD)</text>
<rect x="540" y="66" width="160" height="160" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<circle cx="620" cy="104" r="24" fill="#7048e8" stroke="none" stroke-width="0"/>
<text x="620" y="112" font-size="22" fill="#fff" text-anchor="middle" font-weight="800">4</text>
<text x="620" y="152" font-size="14.5" fill="#7048e8" text-anchor="middle" font-weight="800">Bias</text>
<text x="620" y="178" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700">"the nurse ... she"</text>
<text x="620" y="196" font-size="12" fill="#7a6a60" text-anchor="middle" font-weight="600">unfair ideas from its data</text>
<rect x="710" y="66" width="160" height="160" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<circle cx="790" cy="104" r="24" fill="#0b7285" stroke="none" stroke-width="0"/>
<text x="790" y="112" font-size="22" fill="#fff" text-anchor="middle" font-weight="800">5</text>
<text x="790" y="152" font-size="14.5" fill="#0b7285" text-anchor="middle" font-weight="800">Missing context</text>
<text x="790" y="178" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700">it does not know</text>
<text x="790" y="196" font-size="12" fill="#7a6a60" text-anchor="middle" font-weight="600">your class or your job</text>
<text x="450" y="256" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="700">AI answers sound sure, even when they are wrong. You check before you use them.</text>
</svg>
