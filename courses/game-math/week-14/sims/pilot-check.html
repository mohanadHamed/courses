<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Pilot Check</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #ebfbee; border: 1.5px solid #2F9E44; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Pilot Check</h1>
  <p class="hint">Before the shuttle of <i>Star Dock</i> may fly, the test pilots check six numbers of its movement code. Choose the right result.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "Speed 6 units per second at 30 fps.", goal: "The step in one frame?", answer: "0.2 units", choices: C(["0.2 units", "6 units", "0.1 units", "180 units"]), good: "6 × 1/30 = 0.2; after 30 frames: 6 units.", why: { "0.1 units": "That is the step at 60 fps.", "180 units": "Multiply by Δt = 1/30, not by 30." } },
    { card: "The player holds right and up: input (1, 1). The shuttle must fly at the same speed in every direction.", goal: "What must the code do first?", answer: "normalize the input", choices: C(["normalize the input", "double the speed", "use Δt twice", "nothing"]), good: "(1, 1) is longer than 1, so the diagonal is too fast. Divide the input by its length first.", why: { "nothing": "Then the diagonal is about 40 % faster than the straight moves." } },
    { card: "The velocity is (−4, 4). The sprite is drawn facing +x.", goal: "The rotation of the sprite?", answer: "135°", choices: C(["135°", "45°", "−45°", "225°"]), good: "atan2(4, −4): up and to the left, in quadrant II: 135°.", why: { "45°": "That is (4, 4). Here x is negative.", "−45°": "That is atan2(x, y) by mistake, or (4, −4)." } },
    { card: "A turret turns at 120° per second. The game runs at 60 fps.", goal: "The turn in one frame?", answer: "2°", choices: C(["2°", "120°", "60°", "0.5°"]), good: "Δθ = ω × Δt = 120 × 1/60 = 2° per frame.", why: { "120°": "That is the turn in one second, not in one frame." } },
    { card: "The drone hits the left wall (n = (1, 0)) with v = (−3, 2), e = 1.", goal: "The velocity after the bounce?", answer: "(3, 2)", choices: C(["(3, 2)", "(−3, −2)", "(3, −2)", "(2, 3)"]), good: "v · n = −3; v' = (−3, 2) − 2(−3)(1, 0) = (3, 2). Only the part into the wall turns.", why: { "(3, −2)": "Both parts turned. Only the part along the normal changes its sign." } },
    { card: "The sprite corner (1, 0) is scaled by 3, rotated by 90°, then moved by (4, 1).", goal: "Where is it in the world?", answer: "(4, 4)", choices: C(["(4, 4)", "(7, 1)", "(1, 4)", "(7, 4)"]), good: "(1, 0) → (3, 0) → (0, 3) → (4, 4).", why: { "(7, 1)": "The rotation is missing." } },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 1, animMs: 600, intro: "Round 1 is the first check of the lesson: one frame at 30 fps." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "The shuttle is cleared for flight." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
