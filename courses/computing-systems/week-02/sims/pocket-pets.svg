<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="400" fill="#ffffff"/>
<text x="24" y="36" font-size="22" fill="#2a2f2c" text-anchor="start" font-weight="800">Pocket Pets · support desk</text><text x="24" y="58" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600">Send each player's message to the right part: CPU, RAM or storage.</text>
<text x="24" y="82" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800">Message 1/10</text><text x="616" y="82" font-size="13" fill="#2a2f2c" text-anchor="end" font-weight="800">Score 0</text>
<rect x="24" y="94" width="430" height="130" rx="14" fill="#fffdf7" stroke="#eadfcd" stroke-width="1.5"/>
<circle cx="52" cy="122" r="15" fill="#FFD43B"/><text x="76" y="127" font-size="14" fill="#A86700" text-anchor="start" font-weight="800">Lina writes:</text>
<text x="40" y="162" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="700">“My phone has eight cores, but only</text><text x="40" y="186" font-size="15" fill="#2a2f2c" text-anchor="start" font-weight="700">one is really busy when I play.”</text>
<rect x="24" y="240" width="136" height="54" rx="10" fill="#A86700"/><text x="92" y="263" font-size="15" fill="#fff" text-anchor="middle" font-weight="800">CPU</text><text x="92" y="282" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">runs the game</text>
<rect x="170" y="240" width="136" height="54" rx="10" fill="#A86700"/><text x="238" y="263" font-size="15" fill="#fff" text-anchor="middle" font-weight="800">RAM</text><text x="238" y="282" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">holds what runs now</text>
<rect x="316" y="240" width="136" height="54" rx="10" fill="#A86700"/><text x="384" y="263" font-size="15" fill="#fff" text-anchor="middle" font-weight="800">Storage</text><text x="384" y="282" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">keeps it when off</text>
<rect x="476" y="94" width="140" height="200" rx="20" fill="#fff" stroke="#2a2f2c" stroke-width="3"/>
<rect x="490" y="114" width="112" height="38" rx="8" fill="#FFD43B" stroke="#eadfcd" stroke-width="1.5"/><text x="546" y="138" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800">CPU · 8 cores</text>
<rect x="490" y="166" width="112" height="38" rx="8" fill="#fff" stroke="#eadfcd" stroke-width="1.5"/><text x="546" y="190" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800">RAM · 4 GB</text>
<rect x="490" y="218" width="112" height="38" rx="8" fill="#fff" stroke="#eadfcd" stroke-width="1.5"/><text x="546" y="242" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="800">Storage · 64 GB</text>
<rect x="24" y="340" width="90" height="30" rx="9" fill="#A86700" stroke="#A86700" stroke-width="1.5"/><text x="69.0" y="360" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="800">Start</text>
</svg>
