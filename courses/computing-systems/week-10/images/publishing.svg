<svg xmlns="http://www.w3.org/2000/svg" width="680" height="314" viewBox="0 0 680 314" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="314" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Publishing: accounts, review and the store&#x27;s share</text>
<rect x="20" y="50" width="640" height="38" rx="0" fill="#A86700"/>
<text x="30" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve"></text>
<text x="322.5" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Google Play</text>
<text x="547.5" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Apple App Store</text>
<text x="30" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">developer account</text>
<text x="322.5" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">25 USD, once</text>
<text x="547.5" y="111.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">99 USD every year</text>
<rect x="20" y="126" width="640" height="38" rx="0" fill="#f8f9fa"/>
<text x="30" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">review before publishing</text>
<text x="322.5" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">usually hours to a few days</text>
<text x="547.5" y="149.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">usually one to two days</text>
<text x="30" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">package</text>
<text x="322.5" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">.aab (Android App Bundle)</text>
<text x="547.5" y="187.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">.ipa (App Store Connect)</text>
<rect x="20" y="202" width="640" height="38" rx="0" fill="#f8f9fa"/>
<text x="30" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">store&#x27;s share of sales</text>
<text x="322.5" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">often 15–30 %</text>
<text x="547.5" y="225.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">often 15–30 %</text>
<text x="30" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">test builds for testers</text>
<text x="322.5" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">internal testing track</text>
<text x="547.5" y="263.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">TestFlight</text>
<rect x="20" y="50" width="640" height="228" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="340" y="302" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Round numbers checked in 2026. Fees and rules change: read the official pages before you publish.</text>
</svg>
