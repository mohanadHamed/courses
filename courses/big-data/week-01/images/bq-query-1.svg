<text x="614" y="219.5" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">This query will process 1.55 GB when run.</text>
<rect x="324" y="237" width="545" height="130" fill="#ffffff" stroke="#dadce0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="334" y="259" font-size="11.5" font-weight="400" fill="#a3a8ad" text-anchor="start">1</text>
<text x="358" y="259" font-size="12.5" font-weight="400" fill="#3c4043" text-anchor="start">SELECT EXTRACT(YEAR FROM trip_start_timestamp) AS year,</text>
<text x="334" y="279" font-size="11.5" font-weight="400" fill="#a3a8ad" text-anchor="start">2</text>
<text x="358" y="279" font-size="12.5" font-weight="400" fill="#3c4043" text-anchor="start">  COUNT(*) AS trips</text>
<text x="334" y="299" font-size="11.5" font-weight="400" fill="#a3a8ad" text-anchor="start">3</text>
<text x="358" y="299" font-size="12.5" font-weight="400" fill="#3c4043" text-anchor="start">FROM `bigquery-public-data.chicago_taxi_trips.taxi_trips`</text>
<text x="334" y="319" font-size="11.5" font-weight="400" fill="#a3a8ad" text-anchor="start">4</text>
<text x="358" y="319" font-size="12.5" font-weight="400" fill="#3c4043" text-anchor="start">GROUP BY year</text>
<text x="334" y="339" font-size="11.5" font-weight="400" fill="#a3a8ad" text-anchor="start">5</text>
<text x="358" y="339" font-size="12.5" font-weight="400" fill="#3c4043" text-anchor="start">ORDER BY year;</text>
<text x="324" y="395" font-size="12" font-weight="400" fill="#5f656b" text-anchor="start">Tip: Query (on the table) opens a new tab with a short query in it. Delete it,</text>
