<text x="95" y="88" font-size="13.5" fill="#868e96" text-anchor="middle" font-weight="800" xml:space="preserve">internal test</text>
<text x="95" y="110" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the team, a few</text>
<text x="95" y="125" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">testers</text>
<line x1="171" y1="105" x2="177.7" y2="105" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="184,105 177,108.5 177,101.5" fill="#e8590c"/>
