<text x="260" y="110" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">invited testers</text>
<text x="260" y="125" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">(TestFlight on iOS)</text>
<line x1="336" y1="105" x2="342.7" y2="105" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="349,105 342,108.5 342,101.5" fill="#e8590c"/>
<rect x="350" y="60" width="150" height="90" rx="10" fill="#0c859918" stroke="#0c8599" stroke-width="1.8"/>
<text x="425" y="88" font-size="13.5" fill="#0c8599" text-anchor="middle" font-weight="800" xml:space="preserve">open test</text>
<text x="425" y="110" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">anyone who joins</text>
<line x1="501" y1="105" x2="507.7" y2="105" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
