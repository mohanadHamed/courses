<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Rewrite: the same facts in another tone</text>
<rect x="20" y="50" width="640" height="44" rx="8" fill="#f1f3f5"/>
<text x="34" y="77" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Huda&#x27;s text: “Your order is late. It comes in 2 days. Sorry.”</text>
<rect x="20" y="112" width="200" height="150" rx="12" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="34" y="136" font-size="15" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">formal</text>
<text x="34" y="158.8" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Dear Mr Haddad, we are</text>
<text x="34" y="175.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">sorry: your order will</text>
<text x="34" y="192.6" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">arrive two days late.</text>
<text x="120" y="282" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">for a customer you do not know</text>
<rect x="235" y="112" width="200" height="150" rx="12" fill="#ffffff" stroke="#0c8599" stroke-width="1.8"/>
<text x="249" y="136" font-size="15" fill="#0c8599" text-anchor="start" font-weight="800" xml:space="preserve">neutral</text>
<text x="249" y="158.8" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Hello Mr Haddad, your</text>
<text x="249" y="175.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">order is two days late. It</text>
<text x="249" y="192.6" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">will arrive on Thursday.</text>
<text x="335" y="282" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">for most customers</text>
<rect x="450" y="112" width="200" height="150" rx="12" fill="#ffffff" stroke="#D9480F" stroke-width="1.8"/>
<text x="464" y="136" font-size="15" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">friendly</text>
<text x="464" y="158.8" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Hi Sami! Sorry, your order</text>
<text x="464" y="175.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">is running two days late.</text>
<text x="550" y="282" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">for a customer you know well</text>
</svg>
