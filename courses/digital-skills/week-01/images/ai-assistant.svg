<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="900" height="300" fill="#ffffff"/>
<rect x="10" y="10" width="880" height="280" rx="18" fill="#fff9f2" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="450" y="42" font-size="17" fill="#7a2a06" text-anchor="middle" font-weight="800">An AI assistant: you ask, it writes, you check</text>
<rect x="30" y="70" width="250" height="150" rx="12" fill="#ffffff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="46" y="96" font-size="15" fill="#D9480F" text-anchor="start" font-weight="800">1  Your prompt</text>
<rect x="46" y="110" width="218" height="92" rx="12" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="58" y="134" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">Write a short, polite</text>
<text x="58" y="156" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">reply: the new cup</text>
<text x="58" y="178" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">arrives on Monday.</text>
<line x1="290" y1="145" x2="322" y2="145" stroke="#D9480F" stroke-width="3" stroke-linecap="round"/>
<polygon points="330,145 320,139 320,151" fill="#D9480F"/>
<rect x="335" y="70" width="250" height="150" rx="12" fill="#ffffff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="351" y="96" font-size="15" fill="#0b7285" text-anchor="start" font-weight="800">2  The AI answer</text>
<rect x="351" y="110" width="218" height="92" rx="12" fill="#e3fafc" stroke="#0b7285" stroke-width="1.5"/>
<text x="363" y="132" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">Dear customer, we are</text>
<text x="363" y="151" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">sorry about the cup.</text>
<text x="363" y="170" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">A new cup arrives on</text>
<text x="363" y="189" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600">Monday. Best regards</text>
<line x1="595" y1="145" x2="627" y2="145" stroke="#D9480F" stroke-width="3" stroke-linecap="round"/>
<polygon points="635,145 625,139 625,151" fill="#D9480F"/>
<rect x="640" y="70" width="230" height="150" rx="12" fill="#ffffff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="656" y="96" font-size="15" fill="#2b8a3e" text-anchor="start" font-weight="800">3  You check</text>
<path d="M658 118 l5 6 l10 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="680" y="124" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700">Is every fact right?</text>
<path d="M658 142 l5 6 l10 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="680" y="148" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700">Are the numbers right?</text>
<path d="M658 166 l5 6 l10 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="680" y="172" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700">No personal data?</text>
<path d="M658 190 l5 6 l10 -12" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="680" y="196" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700">Is it in your words?</text>
<text x="450" y="252" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="700">Good jobs for AI: drafts, summaries, ideas, translations.</text>
<text x="450" y="274" font-size="13" fill="#7a6a60" text-anchor="middle" font-weight="600">Weak spots: facts and numbers can be wrong. You are responsible for what you use.</text>
</svg>
