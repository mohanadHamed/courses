<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Projection Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-weight: 700; }
    .sim .seg button.on { background: var(--sim-accent); color: #fff; }
    .sim .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-top: 10px; }
    .sim .card { background: #f8f9fa; border-radius: 10px; padding: 6px 10px; }
    .sim .card small { display: block; color: var(--sim-muted); font-weight: 700; font-size: 0.75rem; }
    .sim .card b { font-variant-numeric: tabular-nums; font-size: 1rem; }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Projection Lab: along and to the side</h1>
  <p class="hint">Drag the tip of the orange vector v. Choose the direction û. <b>along</b> = v · û: how far forward. <b>side</b> = û × v: how far to the side (positive: left, negative: right).</p>
  <div class="seg" id="dirs">û:
    <button type="button" class="ghost on" data-u="1,0">(1, 0)</button>
    <button type="button" class="ghost" data-u="0,1">(0, 1)</button>
    <button type="button" class="ghost" data-u="0.6,0.8">(0.6, 0.8)</button>
    <button type="button" class="ghost" data-u="0.8,0.6">(0.8, 0.6)</button>
    <button type="button" class="ghost" data-u="-1,0">(−1, 0)</button>
  </div>
  <canvas id="c" aria-label="A grid with the vector v, the direction u, how far along and how far to the side"></canvas>
  <div class="cards" id="cards"></div>
  <p id="msg" class="message"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script>
(() => {
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const XMIN = -6, XMAX = 6, YMIN = -5, YMAX = 6;
  let W = 0, H = 0, u = 30, ox = 0, oy = 0, v = [5, 0], dir = [1, 0], drag = false;
  const f = (n) => { const r = Math.round(n * 100) / 100; return (Object.is(r, -0) ? 0 : r < 0 ? "−" : "") + Math.abs(r); };
  const pair = (a) => `(${f(a[0])}, ${f(a[1])})`;
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  function resize() {
    W = canvas.clientWidth; u = Math.min((W - 30) / (XMAX - XMIN), 34);
    H = Math.round(u * (YMAX - YMIN) + 30);
    ox = W / 2; oy = 15 + YMAX * u;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const X = (x) => ox + x * u, Y = (y) => oy - y * u;
  function arrow(a, b, col, w) {
    const x1 = X(a[0]), y1 = Y(a[1]), x2 = X(b[0]), y2 = Y(b[1]), L = Math.hypot(x2 - x1, y2 - y1);
    if (L < 2) return;
    const t = Math.atan2(y2 - y1, x2 - x1);
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(t) * 8, y2 - Math.sin(t) * 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - Math.cos(t - 0.45) * 14, y2 - Math.sin(t - 0.45) * 14);
    ctx.lineTo(x2 - Math.cos(t + 0.45) * 14, y2 - Math.sin(t + 0.45) * 14); ctx.fill();
  }
  function label(t, x, y, col, align = "left") { ctx.fillStyle = col; ctx.font = "800 12px Nunito, system-ui, sans-serif"; ctx.textAlign = align; ctx.fillText(t, x, y); }
  function card(k, val) { return `<div class="card"><small>${k}</small><b>${val}</b></div>`; }
  function draw() {
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#e4e8e5"; ctx.lineWidth = 1;
    for (let i = XMIN; i <= XMAX; i++) { ctx.beginPath(); ctx.moveTo(X(i), Y(YMIN)); ctx.lineTo(X(i), Y(YMAX)); ctx.stroke(); }
    for (let j = YMIN; j <= YMAX; j++) { ctx.beginPath(); ctx.moveTo(X(XMIN), Y(j)); ctx.lineTo(X(XMAX), Y(j)); ctx.stroke(); }
    ctx.strokeStyle = "#adb5bd"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(X(XMIN), Y(0)); ctx.lineTo(X(XMAX), Y(0)); ctx.moveTo(X(0), Y(YMIN)); ctx.lineTo(X(0), Y(YMAX)); ctx.stroke();
    const p = dot(v, dir), along = [dir[0] * p, dir[1] * p];
    const side = dir[0] * v[1] - dir[1] * v[0];
    ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = "#7048e8"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(X(-dir[0] * 9), Y(-dir[1] * 9)); ctx.lineTo(X(dir[0] * 9), Y(dir[1] * 9)); ctx.stroke(); ctx.restore();
    arrow([0, 0], dir, "#7048e8", 3); label("û", X(dir[0]) + 6, Y(dir[1]) - 6, "#7048e8");
    // along: the shadow of v on the line (green); side: from the shadow to the tip of v (blue, dashed)
    if (Math.abs(p) > 0.05) {
      ctx.strokeStyle = "#2F9E44"; ctx.lineWidth = 7; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(along[0]), Y(along[1])); ctx.stroke();
      label("along", X(along[0] / 2) - dir[1] * 22, Y(along[1] / 2) - dir[0] * 22 + 4, "#2F9E44", "center");
    }
    if (Math.abs(side) > 0.05) {
      ctx.save(); ctx.setLineDash([8, 6]); ctx.strokeStyle = "#1971c2"; ctx.lineWidth = 4; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(X(along[0]), Y(along[1])); ctx.lineTo(X(v[0]), Y(v[1])); ctx.stroke(); ctx.restore();
      label("side", X((along[0] + v[0]) / 2) + 8, Y((along[1] + v[1]) / 2) + 4, "#1971c2");
    }
    arrow([0, 0], v, "#e8590c", 3.5);
    label("v", X(v[0]) + 8, Y(v[1]) - 8, "#e8590c");
    const where = Math.abs(side) < 1e-9 ? "on the line" : side > 0 ? "left" : "right";
    document.getElementById("cards").innerHTML =
      card("v", pair(v)) + card("û", pair(dir)) + card("along = v · û", f(p)) +
      card("side = û × v", f(side)) + card("which side?", where);
    document.getElementById("msg").textContent =
      (p < 0 ? "along is negative: v points backwards, behind the start. " : "") +
      (where === "on the line" ? "side is 0: v is on the line." :
        `side is ${side > 0 ? "positive" : "negative"}: v is ${f(Math.abs(side))} units to the ${where} of the line.`);
  }
  function loop() { requestAnimationFrame(loop); try { draw(); } catch (e) { /* keep the loop alive */ } }
  function pick(e) {
    const r = canvas.getBoundingClientRect();
    let x = Math.round((e.clientX - r.left - ox) / u), y = Math.round((oy - (e.clientY - r.top)) / u);
    x = Math.max(XMIN + 1, Math.min(XMAX - 1, x)); y = Math.max(YMIN + 1, Math.min(YMAX - 1, y));
    if (x !== 0 || y !== 0) v = [x, y];
  }
  canvas.addEventListener("pointerdown", (e) => { drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} pick(e); });
  canvas.addEventListener("pointermove", (e) => { if (drag) pick(e); });
  canvas.addEventListener("pointerup", () => { drag = false; });
  document.querySelectorAll("#dirs button").forEach((b) => b.addEventListener("click", () => {
    dir = b.dataset.u.split(",").map(Number);
    document.querySelectorAll("#dirs button").forEach((c) => c.classList.toggle("on", c === b));
  }));
  window.addEventListener("resize", resize);
  resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
