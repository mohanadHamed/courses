<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Weighted choice: probability = weight ÷ sum of weights</text>
<rect x="20" y="54" width="440" height="30" rx="0" fill="#2F9E44"/>
<text x="30" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">item</text>
<text x="180" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">weight</text>
<text x="280" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">probability</text>
<text x="400" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">cumulative</text>
<text x="30" y="103.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">common</text>
<text x="180" y="103.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">60</text>
<text x="280" y="103.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">60/100</text>
<text x="400" y="103.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">60</text>
<rect x="20" y="114" width="440" height="30" rx="0" fill="#f8f9fa"/>
<text x="30" y="133.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">rare</text>
<text x="180" y="133.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">30</text>
<text x="280" y="133.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">30/100</text>
<text x="400" y="133.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">90</text>
<text x="30" y="163.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">epic</text>
<text x="180" y="163.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">9</text>
<text x="280" y="163.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">9/100</text>
<text x="400" y="163.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">99</text>
<rect x="20" y="174" width="440" height="30" rx="0" fill="#f8f9fa"/>
<text x="30" y="193.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">legendary</text>
<text x="180" y="193.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1</text>
<text x="280" y="193.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1/100</text>
<text x="400" y="193.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">100</text>
<rect x="20" y="54" width="440" height="150" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<rect x="20" y="230" width="384" height="28" rx="0" fill="#2b8a3e" stroke="#ffffff" stroke-width="1"/>
<text x="212" y="249" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">common</text>
<rect x="404" y="230" width="192" height="28" rx="0" fill="#1c7ed6" stroke="#ffffff" stroke-width="1"/>
<text x="500" y="249" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">rare</text>
<rect x="596" y="230" width="57.6" height="28" rx="0" fill="#7048e8" stroke="#ffffff" stroke-width="1"/>
<text x="624.8" y="249" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">epic</text>
<rect x="653.6" y="230" width="6.4" height="28" rx="0" fill="#e8590c" stroke="#ffffff" stroke-width="1"/>
<text x="20" y="276" font-size="11" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">0</text>
<text x="404" y="276" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">60</text>
<text x="596" y="276" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">90</text>
<text x="660" y="276" font-size="11" fill="#6b726e" text-anchor="end" font-weight="700" xml:space="preserve">100</text>
<text x="660" y="222" font-size="11.5" fill="#e8590c" text-anchor="end" font-weight="800" xml:space="preserve">legendary: 99–100</text>
<line x1="480.8" y1="200" x2="480.8" y2="219.4" stroke="#c92a2a" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="480.8,228 476,218.5 485.6,218.5" fill="#c92a2a"/>
<text x="486.8" y="206" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">r = 72 → rare</text>
<text x="470" y="70" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">A random number r from 0 to</text>
<text x="470" y="85.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">100 (sum of the weights) falls</text>
<text x="470" y="101.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">into one part of the bar.</text>
</svg>
