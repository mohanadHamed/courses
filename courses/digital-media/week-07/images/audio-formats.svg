<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Audio formats: the 3-minute music of a level (48 kHz, 16-bit, stereo)</text>
<line x1="60" y1="240" x2="390" y2="240" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<rect x="76.5" y="84.2" width="49.5" height="155.8" rx="4" fill="#9C36B5"/>
<text x="101.2" y="78.2" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">33 MB</text>
<text x="101.2" y="257" font-size="13" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">WAV</text>
<rect x="159" y="159.7" width="49.5" height="80.3" rx="4" fill="#0c8599"/>
<text x="183.8" y="153.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">17 MB</text>
<text x="183.8" y="257" font-size="13" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">FLAC</text>
<rect x="241.5" y="225.8" width="49.5" height="14.2" rx="4" fill="#e8590c"/>
<text x="266.2" y="219.8" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">3 MB</text>
<text x="266.2" y="257" font-size="13" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">OGG</text>
<rect x="324" y="225.8" width="49.5" height="14.2" rx="4" fill="#e8590c"/>
<text x="348.8" y="219.8" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">3 MB</text>
<text x="348.8" y="257" font-size="13" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">MP3</text>
<rect x="430" y="64" width="230" height="200" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="444" y="88" font-size="15" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Which one?</text>
<text x="444" y="106" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">WAV: no compression. Short</text>
<text x="444" y="122.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">effects: they play at once.</text>
<text x="444" y="158" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">FLAC: lossless, about half. For</text>
<text x="444" y="174.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">the archive.</text>
<text x="444" y="210" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">OGG, MP3: lossy, about 10 ×</text>
<text x="444" y="226.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">smaller. Music and long</text>
<text x="444" y="242.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">ambience.</text>
<text x="340" y="290" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Round sizes: 48 000 × 2 bytes × 2 channels × 180 s is about 33 MB.</text>
</svg>
