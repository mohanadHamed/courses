<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A video file: a container with coded tracks inside</text>
<rect x="20" y="52" width="360" height="220" rx="14" fill="#fff0f6" stroke="#9C36B5" stroke-width="2.2"/>
<text x="36" y="78" font-size="14" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">container: trailer.mp4</text>
<rect x="36" y="94" width="328" height="46" rx="8" fill="#e5dbff" stroke="#7048e8" stroke-width="1.6"/>
<text x="50" y="122" font-size="13" fill="#7048e8" text-anchor="start" font-weight="800" xml:space="preserve">video track · codec H.264</text>
<rect x="36" y="150" width="328" height="46" rx="8" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.6"/>
<text x="50" y="178" font-size="13" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">audio track · codec AAC</text>
<rect x="36" y="206" width="328" height="46" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6"/>
<text x="50" y="234" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">information · 1920 × 1080 · 30 fps · 30 s</text>
<rect x="400" y="52" width="260" height="30" rx="0" fill="#9C36B5"/>
<text x="410" y="71.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">container</text>
<text x="580" y="71.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">codecs often inside</text>
<text x="410" y="101.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">MP4</text>
<text x="580" y="101.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">H.264, H.265 + AAC</text>
<rect x="400" y="112" width="260" height="30" rx="0" fill="#f8f9fa"/>
<text x="410" y="131.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">MOV</text>
<text x="580" y="131.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">ProRes, H.264</text>
<text x="410" y="161.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">WebM</text>
<text x="580" y="161.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">VP9, AV1 + Opus</text>
<rect x="400" y="52" width="260" height="120" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="400" y="200" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The extension names the container, not the</text>
<text x="400" y="215.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">codec. MP4 with H.264 plays almost</text>
<text x="400" y="231.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">everywhere.</text>
</svg>
