<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Useful feedback in three parts</text>
<rect x="20" y="56" width="200" height="140" rx="12" fill="#1c7ed614" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="120" y="86" font-size="15" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">I hear …</text>
<text x="120" y="116" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">At 0:42 the music covers</text>
<text x="120" y="132.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Nour&#x27;s words.</text>
<rect x="240" y="56" width="200" height="140" rx="12" fill="#e8590c14" stroke="#e8590c" stroke-width="1.8"/>
<text x="340" y="86" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">It matters because …</text>
<text x="340" y="116" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Players may miss the hint</text>
<text x="340" y="132.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">about Pasha.</text>
<rect x="460" y="56" width="200" height="140" rx="12" fill="#9C36B514" stroke="#9C36B5" stroke-width="1.8"/>
<text x="560" y="86" font-size="15" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">Try …</text>
<text x="560" y="116" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Duck the music by about 8</text>
<text x="560" y="132.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">dB while she speaks.</text>
<text x="340" y="226" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Specific, about the player, with a suggestion: and always about the work, not the person.</text>
</svg>
