<text x="40.0" y="214.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Class report: Our visit to the city library. We read books.</text>
<text x="40.0" y="236.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">The library has 2 000 books for children.</text>
<rect x="24.0" y="326.0" width="592.0" height="50.0" rx="10" fill="#ffffff" stroke="#f0e4da" stroke-width="1.5"/>
