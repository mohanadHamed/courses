<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Two choices with the same game: compare the expected values</text>
<rect x="20" y="54" width="310" height="160" rx="12" fill="#ebfbee" stroke="#1c7ed6" stroke-width="2"/>
<text x="36" y="82" font-size="15" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">Safe chest</text>
<text x="36" y="116" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">always:  50 coins</text>
<text x="36" y="194" font-size="16" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">E = 50</text>
<rect x="350" y="54" width="310" height="160" rx="12" fill="#ebfbee" stroke="#e8590c" stroke-width="2"/>
<text x="366" y="82" font-size="15" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">Risky chest</text>
<text x="366" y="116" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">1/2:  120 coins</text>
<text x="366" y="146" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">1/2:  0 coins</text>
<text x="366" y="194" font-size="16" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">E = 60</text>
<text x="20" y="240" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">The risky chest is better on average (60 &gt; 50), but half of the players get nothing. A designer chooses</text>
<text x="20" y="256.2" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">both the average and the risk.</text>
</svg>
