<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Four basic edits on the timeline</text>
<rect x="20" y="54" width="310" height="104" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="34" y="80" font-size="14" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Split</text>
<text x="34" y="104" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">cut a clip at the playhead</text>
<text x="34" y="119.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">(Blade, B; Ctrl+B)</text>
<rect x="220" y="94" width="46" height="26" rx="3" fill="#1c7ed6"/>
<rect x="270" y="94" width="46" height="26" rx="3" fill="#1c7ed6"/>
<line x1="268" y1="84" x2="268" y2="130" stroke="#c92a2a" stroke-width="2.5" stroke-linecap="round"/>
<rect x="350" y="54" width="310" height="104" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="364" y="80" font-size="14" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Trim</text>
<text x="364" y="104" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">drag the start or the end of a</text>
<text x="364" y="119.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">clip</text>
<rect x="550" y="94" width="70" height="26" rx="3" fill="#1c7ed6"/>
<rect x="620" y="94" width="26" height="26" rx="3" fill="#d0ebff" stroke="#1c7ed6" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="642" y1="136" x2="628.3" y2="136" stroke="#c92a2a" stroke-width="2" stroke-linecap="round"/>
<polygon points="622,136 629,132.5 629,139.5" fill="#c92a2a"/>
<rect x="20" y="170" width="310" height="104" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="34" y="196" font-size="14" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Delete with ripple</text>
<text x="34" y="220" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">remove a part and close the</text>
<text x="34" y="235.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">gap</text>
<rect x="220" y="210" width="30" height="26" rx="3" fill="#1c7ed6"/>
<rect x="252" y="210" width="30" height="26" rx="3" fill="#ffe3e3" stroke="#c92a2a" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="284" y="210" width="30" height="26" rx="3" fill="#1c7ed6"/>
<line x1="298" y1="254" x2="272.3" y2="254" stroke="#2b8a3e" stroke-width="2" stroke-linecap="round"/>
<polygon points="266,254 273,250.5 273,257.5" fill="#2b8a3e"/>
<rect x="350" y="170" width="310" height="104" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="364" y="196" font-size="14" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Move</text>
<text x="364" y="220" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">drag a clip to a new place or</text>
<text x="364" y="235.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">track</text>
<rect x="550" y="226" width="40" height="22" rx="3" fill="#1c7ed6"/>
<rect x="600" y="196" width="40" height="22" rx="3" fill="#7048e8"/>
<line x1="580" y1="224" x2="597.9" y2="219.5" stroke="#2a2f2c" stroke-width="2" stroke-linecap="round"/>
<polygon points="604,218 598.1,223.1 596.4,216.3" fill="#2a2f2c"/>
</svg>
