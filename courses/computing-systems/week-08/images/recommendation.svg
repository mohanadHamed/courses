<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="230" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">From the table to a recommendation</text>
<rect x="20" y="56" width="200" height="120" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="120" y="84" font-size="14" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">The facts</text>
<text x="120" y="108" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">the table, with sources and</text>
<text x="120" y="124.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">dates</text>
<line x1="226" y1="116" x2="253" y2="116" stroke="#e8590c" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="262,116 252,121 252,111" fill="#e8590c"/>
<rect x="268" y="56" width="200" height="120" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="368" y="84" font-size="14" fill="#A86700" text-anchor="middle" font-weight="800" xml:space="preserve">The situation</text>
<text x="368" y="108" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Byte Bay: Windows PCs,</text>
<text x="368" y="124.2" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">small budget, players with</text>
<text x="368" y="140.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">budget phones</text>
<line x1="474" y1="116" x2="501" y2="116" stroke="#e8590c" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="510,116 500,121 500,111" fill="#e8590c"/>
<rect x="516" y="56" width="144" height="120" rx="12" fill="#A86700"/>
<text x="588" y="84" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Advice</text>
<text x="588" y="108" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Android first; iOS</text>
<text x="588" y="124.2" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">when the studio has</text>
<text x="588" y="140.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">a Mac</text>
<text x="340" y="210" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">A good recommendation says what, why (with facts) and what would change it.</text>
