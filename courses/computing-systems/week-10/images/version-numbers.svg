<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Two version numbers in every build</text>
<rect x="20" y="52" width="640" height="150" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<rect x="40" y="70" width="600" height="34" rx="0" fill="#A86700"/>
<text x="56" y="92" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">number</text>
<text x="300" y="92" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">who sees it</text>
<text x="520" y="92" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">a bug fix</text>
<text x="56" y="128" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">version name</text>
<text x="300" y="128" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">the players, in the store</text>
<text x="520" y="128" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">1.4 → 1.4.1</text>
<rect x="40" y="140" width="600" height="36" rx="0" fill="#ffffff"/>
<text x="56" y="163" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">build number</text>
<text x="300" y="163" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">the store (Android: version code)</text>
<text x="520" y="163" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">27 → 28</text>
<rect x="40" y="70" width="600" height="106" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="340" y="232" font-size="13" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">The build number must grow with every upload: an old number is refused.</text>
</svg>
