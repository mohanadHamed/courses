<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="400" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The layers of a mobile OS: Android and iOS</text>
<text x="180" y="62" font-size="17" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">Android</text>
<rect x="30" y="76" width="300" height="46" rx="9" fill="#2b8a3e33" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="180" y="105" font-size="14" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">Apps</text>
<rect x="30" y="130" width="300" height="46" rx="9" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="180" y="159" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">App framework: screens, touch</text>
<rect x="30" y="184" width="300" height="46" rx="9" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="180" y="213" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Libraries: Vulkan, OpenGL ES, sound</text>
<rect x="30" y="238" width="300" height="46" rx="9" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="180" y="267" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Linux kernel</text>
<rect x="30" y="300" width="300" height="44" rx="9" fill="#495057"/>
<text x="180" y="327" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Hardware: SoC, RAM, storage, screen, sensors</text>
<text x="510" y="62" font-size="17" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">iOS</text>
<rect x="360" y="76" width="300" height="46" rx="9" fill="#1c7ed633" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="510" y="105" font-size="14" fill="#1c7ed6" text-anchor="middle" font-weight="800" xml:space="preserve">Apps</text>
<rect x="360" y="130" width="300" height="46" rx="9" fill="#1c7ed6" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="510" y="159" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">App framework: screens, touch</text>
<rect x="360" y="184" width="300" height="46" rx="9" fill="#1c7ed6" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="510" y="213" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Libraries: Metal, sound, files</text>
<rect x="360" y="238" width="300" height="46" rx="9" fill="#1c7ed6" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="510" y="267" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Apple's kernel</text>
<rect x="360" y="300" width="300" height="44" rx="9" fill="#495057"/>
<text x="510" y="327" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Hardware: SoC, RAM, storage, screen, sensors</text>
<text x="340" y="384" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Each layer uses only the services of the layer below it.</text>
</svg>
