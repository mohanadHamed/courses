<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="350" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">From the words of the designer to a condition</text>
<rect x="20" y="50" width="640" height="34" rx="0" fill="#2F9E44"/>
<text x="30" y="71.7" font-size="13" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">the words</text>
<text x="375" y="71.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">means</text>
<text x="580" y="71.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">logic   code</text>
<text x="30" y="105.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">and</text>
<text x="375" y="105.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">both must be true</text>
<text x="580" y="105.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">∧   &amp;&amp;</text>
<rect x="20" y="118" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="139.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">or</text>
<text x="375" y="139.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">at least one (also both)</text>
<text x="580" y="139.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">∨   ||</text>
<text x="30" y="173.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">not, no, without</text>
<text x="375" y="173.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">the opposite</text>
<text x="580" y="173.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">¬   !</text>
<rect x="20" y="186" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="207.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">either … or (but not both)</text>
<text x="375" y="207.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">exactly one</text>
<text x="580" y="207.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">⊕   ^</text>
<text x="30" y="241.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">unless p</text>
<text x="375" y="241.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">if not p</text>
<text x="580" y="241.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">¬p → …</text>
<rect x="20" y="254" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="275.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">only if q</text>
<text x="375" y="275.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">q is needed</text>
<text x="580" y="275.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">… → q</text>
<rect x="20" y="50" width="640" height="238" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="314" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">“The chest opens if the player has the key and no skeleton is near, or the player is a thief”</text>
<text x="20" y="336" font-size="13.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">→  (k ∧ ¬s) ∨ t</text>
</svg>
