<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="500" fill="#ffffff"/>
<text x="16" y="30" font-size="19" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Rooftop Rescue</text>
<text x="16" y="52" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">Row Nour's boat down the flooded street. Watch which line plays, and when.</text>
<rect x="16" y="66" width="608" height="230" rx="12" fill="#d0ebff" stroke="none" stroke-width="1.5"/>
<rect x="16" y="200" width="608" height="96" rx="0" fill="#4dabf7" stroke="none" stroke-width="0" opacity="0.6"/>
<rect x="40" y="110" width="90" height="100" rx="2" fill="#ced4da" stroke="none" stroke-width="1.5"/>
<rect x="54" y="130" width="22" height="22" rx="2" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<rect x="94" y="130" width="22" height="22" rx="2" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<rect x="200" y="110" width="90" height="100" rx="2" fill="#ced4da" stroke="none" stroke-width="1.5"/>
<rect x="214" y="130" width="22" height="22" rx="2" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<rect x="254" y="130" width="22" height="22" rx="2" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<rect x="360" y="110" width="90" height="100" rx="2" fill="#ced4da" stroke="none" stroke-width="1.5"/>
<rect x="374" y="130" width="22" height="22" rx="2" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<rect x="414" y="130" width="22" height="22" rx="2" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<rect x="520" y="110" width="90" height="100" rx="2" fill="#ced4da" stroke="none" stroke-width="1.5"/>
<rect x="534" y="130" width="22" height="22" rx="2" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<rect x="574" y="130" width="22" height="22" rx="2" fill="#f1f3f5" stroke="none" stroke-width="1.5"/>
<polygon points="120,214 200,214 188,232 132,232" fill="#8d6e63" stroke="none" stroke-width="1.5"/>
<circle cx="160" cy="200" r="10" fill="#e8590c" stroke="none" stroke-width="1.5"/>
<rect x="220" y="150" width="220" height="40" rx="12" fill="#fff" stroke="#9C36B5" stroke-width="1.5"/>
<text x="232" y="176" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">NOUR: Car ahead! Around it.</text>
<rect x="16" y="306" width="608" height="120" rx="10" fill="#fff" stroke="#dee2e6" stroke-width="1.5"/>
<text x="30" y="330" font-size="11.5" fill="#9C36B5" text-anchor="start" font-weight="800" font-family="Menlo, Consolas, monospace" xml:space="preserve">NOUR_01</text>
<text x="120" y="330" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Hold on, everyone. I'm coming.</text>
<text x="380" y="330" font-size="12" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">the scene starts</text>
<rect x="20" y="339" width="600" height="24" rx="4" fill="#fff3bf" stroke="none" stroke-width="1.5"/>
<text x="30" y="356" font-size="11.5" fill="#9C36B5" text-anchor="start" font-weight="800" font-family="Menlo, Consolas, monospace" xml:space="preserve">NOUR_02</text>
<text x="120" y="356" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Car ahead! Around it.</text>
<text x="380" y="356" font-size="12" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">a floating car is in view</text>
<text x="30" y="382" font-size="11.5" fill="#9C36B5" text-anchor="start" font-weight="800" font-family="Menlo, Consolas, monospace" xml:space="preserve">FAM_01</text>
<text x="120" y="382" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Over here! Please!</text>
<text x="380" y="382" font-size="12" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">the rooftop is in view</text>
<text x="30" y="408" font-size="11.5" fill="#9C36B5" text-anchor="start" font-weight="800" font-family="Menlo, Consolas, monospace" xml:space="preserve">NOUR_03</text>
<text x="120" y="408" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">I see you! Stay there.</text>
<text x="380" y="408" font-size="12" fill="#6b726e" text-anchor="start" font-weight="600" xml:space="preserve">after FAM_01</text>
<rect x="16" y="440" width="140" height="40" rx="10" fill="#9C36B5" stroke="none" stroke-width="1.5"/>
<text x="86" y="466" font-size="15" fill="#fff" text-anchor="middle" font-weight="800" xml:space="preserve">Row</text>
</svg>
