<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Is the dice game fair? Expected gain = E(win) − price</text>
<rect x="20" y="52" width="300" height="230" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="34" y="76" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Pay 2 coins, roll a die</text>
<text x="34" y="94" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">A 6 wins 10 coins, anything else wins 0.</text>
<text x="34" y="140" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">E(win) = 10 · 1/6 + 0 · 5/6 ≈ 1.67</text>
<text x="34" y="176" font-size="13.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">gain = 1.67 − 2 = −0.33 per roll</text>
<text x="34" y="216" font-size="13" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Fair price: 10/6 ≈ 1.67 coins (gain 0).</text>
<rect x="340" y="52" width="320" height="230" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="354" y="76" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Expected number of tries</text>
<text x="354" y="94" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">If one try succeeds with probability p, you</text>
<text x="354" y="110.9" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">need on average 1/p tries.</text>
<text x="354" y="158" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">gold in a crate: p = 1/10 → 10 crates</text>
<text x="354" y="190" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">a 6 with one die: p = 1/6 → 6 rolls</text>
<text x="354" y="228" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">On average: some players need many more.</text>
</svg>
