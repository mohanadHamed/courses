<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">

<rect width="900" height="330" fill="#ffffff"/>
<rect x="10" y="10" width="880" height="310" rx="18" fill="#fff9f2" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="450.0" y="42" font-size="17" fill="#7a2a06" text-anchor="middle" font-weight="800">A clear prompt has three parts</text>
<rect x="40" y="64" width="260" height="150" rx="12" fill="#fff" stroke="#D9480F" stroke-width="2"/>
<rect x="40" y="64" width="260" height="34" rx="12" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<rect x="40" y="86" width="260" height="12" rx="0" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="170" y="87" font-size="15" fill="#fff" text-anchor="middle" font-weight="800">TASK</text>
<text x="170" y="124" font-size="13" fill="#7a6a60" text-anchor="middle" font-weight="700">What must the AI do?</text>
<text x="170" y="160" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800">Write a short message</text>
<text x="170" y="180" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800">to my teacher.</text>
<text x="310" y="148" font-size="26" fill="#2a2f2c" text-anchor="middle" font-weight="800">+</text>
<rect x="320" y="64" width="260" height="150" rx="12" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
<rect x="320" y="64" width="260" height="34" rx="12" fill="#1c7ed6" stroke="none" stroke-width="1.5"/>
<rect x="320" y="86" width="260" height="12" rx="0" fill="#1c7ed6" stroke="none" stroke-width="1.5"/>
<text x="450" y="87" font-size="15" fill="#fff" text-anchor="middle" font-weight="800">CONTEXT</text>
<text x="450" y="124" font-size="13" fill="#7a6a60" text-anchor="middle" font-weight="700">The facts of your situation</text>
<text x="450" y="160" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800">I will miss Thursday's class:</text>
<text x="450" y="180" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800">a doctor's appointment.</text>
<text x="590" y="148" font-size="26" fill="#2a2f2c" text-anchor="middle" font-weight="800">+</text>
<rect x="600" y="64" width="260" height="150" rx="12" fill="#fff" stroke="#2b8a3e" stroke-width="2"/>
<rect x="600" y="64" width="260" height="34" rx="12" fill="#2b8a3e" stroke="none" stroke-width="1.5"/>
<rect x="600" y="86" width="260" height="12" rx="0" fill="#2b8a3e" stroke="none" stroke-width="1.5"/>
<text x="730" y="87" font-size="15" fill="#fff" text-anchor="middle" font-weight="800">FORMAT</text>
<text x="730" y="124" font-size="13" fill="#7a6a60" text-anchor="middle" font-weight="700">How must the answer look?</text>
<text x="730" y="160" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800">3 polite sentences, with</text>
<text x="730" y="180" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800">a greeting and a thank-you.</text>
<rect x="40" y="230" width="820" height="70" rx="12" fill="#fff" stroke="#ffe0c2" stroke-width="1.5"/>
<text x="56" y="254" font-size="13" fill="#7a6a60" text-anchor="start" font-weight="800">The prompt:</text>
<text x="56" y="280" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">Write a short message to my teacher. I will miss Thursday's class because of a doctor's</text>
<text x="56" y="296" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700">appointment. Write 3 polite sentences, with a greeting and a thank-you.</text>
</svg>
