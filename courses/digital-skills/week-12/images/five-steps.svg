<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="270" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Responsible AI use in five steps</text>
<rect x="20" y="60" width="118" height="170" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="2"/>
<circle cx="79" cy="96" r="20" fill="#D9480F"/>
<text x="79" y="103" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">1</text>
<text x="79" y="144" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">Remove</text>
<text x="79" y="160.9" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">personal data</text>
<text x="79" y="192" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">anonymize</text>
<rect x="150" y="60" width="118" height="170" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="2"/>
<circle cx="209" cy="96" r="20" fill="#D9480F"/>
<text x="209" y="103" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">2</text>
<text x="209" y="144" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">Check the rules</text>
<text x="209" y="192" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">settings, terms,</text>
<text x="209" y="206.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">course</text>
<rect x="280" y="60" width="118" height="170" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="2"/>
<circle cx="339" cy="96" r="20" fill="#D9480F"/>
<text x="339" y="103" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">3</text>
<text x="339" y="144" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">Respect</text>
<text x="339" y="160.9" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">copyright</text>
<text x="339" y="192" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">inputs and</text>
<text x="339" y="206.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">outputs</text>
<rect x="410" y="60" width="118" height="170" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="2"/>
<circle cx="469" cy="96" r="20" fill="#D9480F"/>
<text x="469" y="103" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">4</text>
<text x="469" y="144" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">Check the</text>
<text x="469" y="160.9" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">output</text>
<text x="469" y="192" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">facts, sources,</text>
<text x="469" y="206.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">bias</text>
<rect x="540" y="60" width="118" height="170" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="2"/>
<circle cx="599" cy="96" r="20" fill="#D9480F"/>
<text x="599" y="103" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">5</text>
<text x="599" y="144" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="800" xml:space="preserve">State the use</text>
<text x="599" y="192" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">an AI-use</text>
<text x="599" y="206.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">statement</text>
</svg>
