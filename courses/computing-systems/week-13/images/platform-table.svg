<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A comparison table: the next platform for Pocket Quest</text>
<rect x="20" y="50" width="640" height="36" rx="0" fill="#A86700"/>
<text x="30" y="72.5" font-size="13" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">criterion (score 1–5)</text>
<text x="330" y="72.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">PC</text>
<text x="450" y="72.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">console</text>
<text x="570" y="72.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">cloud</text>
<text x="30" y="110" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">reach</text>
<text x="330" y="110" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">4</text>
<text x="450" y="110" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">3</text>
<text x="570" y="110" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">2</text>
<rect x="20" y="124" width="640" height="38" rx="0" fill="#f8f9fa"/>
<text x="30" y="148" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">fit for the game</text>
<text x="330" y="148" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">4</text>
<text x="450" y="148" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">4</text>
<text x="570" y="148" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">3</text>
<text x="30" y="186" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">cost and time</text>
<text x="330" y="186" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">4</text>
<text x="450" y="186" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">2</text>
<text x="570" y="186" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">3</text>
<rect x="270" y="200" width="120" height="38" rx="0" fill="#ffe066"/>
<text x="30" y="224" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">total (of 15)</text>
<text x="330" y="224" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">12</text>
<text x="450" y="224" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">9</text>
<text x="570" y="224" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">8</text>
<rect x="20" y="50" width="640" height="188" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="340" y="268" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Give each platform a score from 1 to 5 (5 = best) with a reason, then add up.</text>
<text x="340" y="288" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Example scores. When two totals are close, say which criterion decides.</text>
</svg>
