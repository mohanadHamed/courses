<text x="470" y="111.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">2 GB</text>
<text x="595" y="111.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">150 MB</text>
<rect x="20" y="126" width="640" height="38" rx="0" fill="#f8f9fa"/>
