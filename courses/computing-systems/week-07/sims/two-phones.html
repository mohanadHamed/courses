<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Two Phones</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .pad button { text-align: left; }</style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Two Phones</h1>
  <p class="hint">Rami prepares the test of <i>Pocket Quest 1.2</i> on <b>P5 (Android)</b> and on <b>P8 (an iPhone)</b>. Each phone does things its own way. Choose the right step.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { ph: "P5", goal: "The report needs the <b>Android version</b> and the <b>security patch</b> of P5. Where does Rami look?",
      choices: C(["Settings › About phone (Software information)", "Settings › Battery", "the Play Store", "the box of the phone"]), answer: "Settings › About phone (Software information)",
      good: "About phone shows the Android version, the security patch level and the model.", why: { "the box of the phone": "The box shows the version the phone was sold with; updates change it." } },
    { ph: "P5", goal: "Rami wants to install the test build from the PC by USB and read its log. What does he turn on first on P5?",
      choices: C(["Developer options, then USB debugging", "Low Power Mode", "Airplane mode", "TestFlight"]), answer: "Developer options, then USB debugging",
      good: "Tap Build number 7 times to show Developer options; USB debugging lets the PC install the build and read the log.", why: { TestFlight: "TestFlight is Apple's beta app for iPhones." } },
    { ph: "P8", goal: "How does the test build reach <b>P8, the iPhone</b>?",
      choices: C(["through TestFlight, Apple's app for beta builds", "copy an .apk file to it", "Developer options › USB debugging", "download it from any website"]), answer: "through TestFlight, Apple's app for beta builds",
      good: "iOS installs apps from the App Store; test builds come through TestFlight (or a Mac with Xcode).", why: { "copy an .apk file to it": ".apk files are Android packages; an iPhone cannot install them." } },
    { ph: "P8", goal: "Pocket Quest asks P8 for the <b>microphone</b>. The test has no voice chat. What does Rami answer?",
      choices: C(["Don't Allow", "Allow", "turn off the phone", "uninstall the game"]), answer: "Don't Allow",
      good: "Give an app only the permissions it needs. He can change it later in Settings › Pocket Quest.", why: { Allow: "The game does not need the microphone for this test." } },
    { ph: "P5", goal: "A map in the game asks P5 for the <b>location</b>, just for one test. Which answer gives it only now?",
      choices: C(["Only this time", "While using the app", "Allow all the time", "Don't allow"]), answer: "Only this time",
      good: "Only this time (iPhone: Allow Once) gives the location now, and asks again next time.", why: { "Allow all the time": "That gives the location even in the background." } },
    { ph: "P8", goal: "Notifications must not appear during the 40-minute test on <b>P8</b>. What does Rami turn on?",
      choices: C(["a Focus: Do Not Disturb", "Low Power Mode", "Bluetooth", "Screen Time"]), answer: "a Focus: Do Not Disturb",
      good: "On iPhone, Do Not Disturb is one of the Focus modes (Control Centre). On Android it is in the quick settings.", why: { "Low Power Mode": "It saves battery but still shows notifications." } },
    { ph: "P8", goal: "At 18 %, P8 asks to turn on <b>Low Power Mode</b>. What happens to the game if Rami says yes?",
      choices: C(["it may run slower, with a lower frame rate", "it runs faster", "nothing changes", "the game is deleted"]), answer: "it may run slower, with a lower frame rate",
      good: "Low Power Mode (Android: Battery saver) lowers the CPU speed, the frame rate and the brightness. Charge the phone instead.", why: { "nothing changes": "The test would show a slower game than the players see." } },
  ];
  Kit.game({
    rounds, cols: 1, colsPhone: 1, animMs: 700, still: true,
    intro: "Round 1 is the story of the lesson: the test plan for the two phones.",
    canvas: () => 92,
    draw(c, W, H, now, r, st) {
      c.fillStyle = "#fffdf5"; c.fillRect(0, 0, W, H);
      if (!r) return;
      [["P5", "Android", "#2b8a3e"], ["P8", "iPhone (iOS)", "#1c7ed6"]].forEach(([p, os, col], i) => {
        const x = W / 2 + (i ? 20 : -20) - (i ? 0 : 150), on = r.ph === p;
        Kit.rrect(c, x, 10, 150, 70, 14, on ? col : "#f1f3f5", col, 2);
        Kit.text(c, p, x + 75, 40, 18, on ? "#fff" : col);
        Kit.text(c, os, x + 75, 62, 12, on ? "#fff" : col);
      });
    },
  });
})();
</script>
</body>
</html>
