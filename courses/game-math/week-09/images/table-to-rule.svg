<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">From a truth table back to a condition</text>
<rect x="30" y="54" width="200" height="34" rx="0" fill="#2F9E44"/>
<text x="60" y="75.9" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">p</text>
<text x="120" y="75.9" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">q</text>
<text x="190" y="75.9" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">door</text>
<rect x="30" y="88" width="60" height="34" rx="0" fill="#ebfbee"/>
<text x="60" y="109.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">T</text>
<rect x="90" y="88" width="60" height="34" rx="0" fill="#ebfbee"/>
<text x="120" y="109.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">T</text>
<rect x="150" y="88" width="80" height="34" rx="0" fill="#fff5f5"/>
<text x="190" y="109.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">F</text>
<rect x="30" y="122" width="200" height="34" rx="0" fill="#f8f9fa"/>
<rect x="30" y="122" width="60" height="34" rx="0" fill="#ffe066"/>
<text x="60" y="143.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">T</text>
<rect x="90" y="122" width="60" height="34" rx="0" fill="#ffe066"/>
<text x="120" y="143.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">F</text>
<rect x="150" y="122" width="80" height="34" rx="0" fill="#ffe066"/>
<text x="190" y="143.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">T</text>
<rect x="30" y="156" width="60" height="34" rx="0" fill="#ffe066"/>
<text x="60" y="177.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">F</text>
<rect x="90" y="156" width="60" height="34" rx="0" fill="#ffe066"/>
<text x="120" y="177.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">T</text>
<rect x="150" y="156" width="80" height="34" rx="0" fill="#ffe066"/>
<text x="190" y="177.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">T</text>
<rect x="30" y="190" width="200" height="34" rx="0" fill="#f8f9fa"/>
<rect x="30" y="190" width="60" height="34" rx="0" fill="#fff5f5"/>
<text x="60" y="211.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">F</text>
<rect x="90" y="190" width="60" height="34" rx="0" fill="#fff5f5"/>
<text x="120" y="211.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">F</text>
<rect x="150" y="190" width="80" height="34" rx="0" fill="#fff5f5"/>
<text x="190" y="211.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">F</text>
<rect x="30" y="54" width="200" height="170" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<rect x="270" y="54" width="390" height="210" rx="12" fill="#ebfbee" stroke="#2F9E44" stroke-width="1.8"/>
<text x="284" y="78" font-size="15" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">One AND for each T row, joined by OR</text>
<text x="286" y="100" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Row 2 (p = T, q = F): p ∧ ¬q</text>
<text x="286" y="132" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Row 3 (p = F, q = T): ¬p ∧ q</text>
<text x="286" y="172" font-size="14.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">door = (p ∧ ¬q) ∨ (¬p ∧ q)</text>
<text x="286" y="214" font-size="13" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">This is p XOR q: exactly one is true.</text>
</svg>
