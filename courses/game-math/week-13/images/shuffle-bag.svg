<text x="90" y="60" font-size="12.5" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">bag 1</text>
<circle cx="52" cy="110" r="10" fill="#adb5bd"/>
<circle cx="78" cy="110" r="10" fill="#adb5bd"/>
<circle cx="104" cy="110" r="10" fill="#c92a2a"/>
<circle cx="130" cy="110" r="10" fill="#adb5bd"/>
<path d="M250 70 h120 l-10 70 h-100 Z" fill="#ebfbee" stroke="#2F9E44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="310" y="60" font-size="12.5" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">bag 2</text>
<circle cx="272" cy="110" r="10" fill="#c92a2a"/>
<circle cx="298" cy="110" r="10" fill="#adb5bd"/>
<circle cx="324" cy="110" r="10" fill="#adb5bd"/>
<circle cx="350" cy="110" r="10" fill="#adb5bd"/>
<path d="M470 70 h120 l-10 70 h-100 Z" fill="#ebfbee" stroke="#2F9E44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="530" y="60" font-size="12.5" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">bag 3</text>
<circle cx="492" cy="110" r="10" fill="#adb5bd"/>
<circle cx="518" cy="110" r="10" fill="#adb5bd"/>
<circle cx="544" cy="110" r="10" fill="#adb5bd"/>
<circle cx="570" cy="110" r="10" fill="#c92a2a"/>
<text x="20" y="176" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">attacks:</text>
<rect x="90" y="162" width="38" height="22" rx="4" fill="#e9ecef"/>
<text x="109" y="178" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">–</text>
<rect x="134" y="162" width="38" height="22" rx="4" fill="#e9ecef"/>
<text x="153" y="178" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">–</text>
<rect x="178" y="162" width="38" height="22" rx="4" fill="#c92a2a"/>
<text x="197" y="178" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">crit</text>
<rect x="222" y="162" width="38" height="22" rx="4" fill="#e9ecef"/>
<text x="241" y="178" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">–</text>
<rect x="266" y="162" width="38" height="22" rx="4" fill="#c92a2a"/>
<text x="285" y="178" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">crit</text>
<rect x="310" y="162" width="38" height="22" rx="4" fill="#e9ecef"/>
<text x="329" y="178" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">–</text>
<rect x="354" y="162" width="38" height="22" rx="4" fill="#e9ecef"/>
<text x="373" y="178" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">–</text>
<rect x="398" y="162" width="38" height="22" rx="4" fill="#e9ecef"/>
<text x="417" y="178" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">–</text>
<rect x="442" y="162" width="38" height="22" rx="4" fill="#e9ecef"/>
<text x="461" y="178" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">–</text>
<rect x="486" y="162" width="38" height="22" rx="4" fill="#e9ecef"/>
<text x="505" y="178" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">–</text>
<rect x="530" y="162" width="38" height="22" rx="4" fill="#e9ecef"/>
<text x="549" y="178" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="800" xml:space="preserve">–</text>
<rect x="574" y="162" width="38" height="22" rx="4" fill="#c92a2a"/>
<text x="593" y="178" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">crit</text>
<text x="20" y="214" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Each bag holds 3 normal hits and 1 critical hit, in a shuffled order. When the bag is empty, refill it and</text>
<text x="20" y="230.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">shuffle again. Exactly 25 % crits, and never more than 6 attacks in a row without one.</text>
</svg>
