<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Clean the data before you count or chart it</text>
<rect x="20" y="50" width="640" height="36" rx="0" fill="#D9480F"/>
<text x="30" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">Problem</text>
<text x="285" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Example</text>
<text x="530" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Fix</text>
<text x="30" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">empty row</text>
<text x="285" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">(a blank line)</text>
<text x="530" y="108.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">delete the row</text>
<rect x="20" y="122" width="640" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">duplicate row</text>
<text x="285" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Tue Bag 36, typed twice</text>
<text x="530" y="144.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Data › Remove Duplicates</text>
<text x="30" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">extra spaces</text>
<text x="285" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">“ Juice” and “Juice ”</text>
<text x="530" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">=TRIM(B3)</text>
<rect x="20" y="194" width="640" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">different spellings</text>
<text x="285" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">drinks, Drinks, DRINKS</text>
<text x="530" y="216.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Find and Replace</text>
<text x="30" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">number as text</text>
<text x="285" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">“12 JD”</text>
<text x="530" y="252.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">type 12; JD in the heading</text>
<rect x="20" y="50" width="640" height="216" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<rect x="20" y="276" width="640" height="40" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.4"/>
<text x="340" y="301" font-size="13" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">Never delete real rows because an AI says so: check each step first.</text>
</svg>
