<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Pictures: keep the shape, add alt text</text>
<rect x="30" y="60" width="130" height="90" rx="4" fill="#ffe8cc" stroke="#2b8a3e" stroke-width="2"/>
<polygon points="30,150 75.5,105 108,127.5 160,150" fill="#2b8a3e"/>
<circle cx="160" cy="150" r="6" fill="#2b8a3e"/>
<text x="100" y="226" font-size="12.5" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">drag a corner: same shape</text>
<rect x="250" y="60" width="80" height="140" rx="4" fill="#ffe8cc" stroke="#c92a2a" stroke-width="2"/>
<polygon points="250,200 278,130 298,165 330,200" fill="#2b8a3e"/>
<circle cx="330" cy="200" r="6" fill="#c92a2a"/>
<text x="320" y="226" font-size="12.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">drag a side: stretched</text>
<rect x="460" y="56" width="200" height="200" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="474" y="80" font-size="15" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Alt text</text>
<text x="474" y="98" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Right-click › View Alt Text.</text>
<text x="474" y="113.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">One sentence: what the</text>
<text x="474" y="129.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">picture shows.</text>
<text x="474" y="178" font-size="12" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">“The new Sunrise shop next</text>
<text x="474" y="193.6" font-size="12" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">to the bus stop.”</text>
<text x="340" y="278" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Use your own photos, Office stock images, or pictures you may use (licence).</text>
</svg>
