<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Score the Scene</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .pad button { text-align: left; }</style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Score the Scene</h1>
  <p class="hint">Yara plans the music and the sound effects of the flood level of <i>Rooftop Rescue</i>. For each moment of the level, choose the best audio decision.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { m: "Calm rowing", goal: "Nour rows through the quiet flooded streets. The player can stay here for minutes. Which music?",
      choices: C(["a calm loop of 8 bars that repeats without a gap", "a 3-minute song that ends with silence", "no sound at all", "a fast drum solo"]), answer: "a calm loop of 8 bars that repeats without a gap",
      good: "The player decides how long the moment lasts: a seamless loop plays as long as needed.", why: { "a 3-minute song that ends with silence": "After 3 minutes the music stops, and the player hears the gap." } },
    { m: "Danger", goal: "A wave comes; the danger rises. How does the music change <b>without a hard cut</b>?",
      choices: C(["drum layers fade in on the same loop", "stop the music and start a new song", "make everything louder", "play two songs at once"]), answer: "drum layers fade in on the same loop",
      good: "Adaptive music: the loop has layers (stems) that come in and go out with the game state, always in time.", why: { "stop the music and start a new song": "A hard cut breaks the mood and is often out of time." } },
    { m: "Pasha caught", goal: "The player catches Pasha with the net. Which audio says “well done” at once?",
      choices: C(["a short stinger of 2 seconds over the loop", "a new 3-minute song", "turn the music off", "a long rain sound"]), answer: "a short stinger of 2 seconds over the loop",
      good: "A stinger is a short musical phrase for one event; it plays over the loop, in the same key.", why: { "turn the music off": "Silence after a success feels like an error." } },
    { m: "Net swish", goal: "The net swish plays every few seconds. Players start to hear the same sound again and again. What helps?",
      choices: C(["3 takes, and a small random pitch change", "one take, louder", "a longer swish", "remove the sound"]), answer: "3 takes, and a small random pitch change",
      good: "Variation: the game picks one of several takes and changes the pitch a little (for example ±5 %).", why: { "one take, louder": "Louder does not make it less repetitive." } },
    { m: "Big splash", goal: "Pasha falls into the water. The splash sounds thin. How does Yara make it full?",
      choices: C(["layer a deep thump, the splash and small drops", "make the splash longer", "add music", "record it in stereo"]), answer: "layer a deep thump, the splash and small drops",
      good: "Layering: a low attack (the thump), the body (the splash) and a tail (drops) make one rich sound.", why: { "record it in stereo": "Stereo changes the space, not the weight." } },
    { m: "Tempo", goal: "The loop of the chase level is at <b>120 BPM</b>, 4 beats per bar. How long is a loop of <b>8 bars</b>?",
      choices: C(["16 seconds", "8 seconds", "32 seconds", "120 seconds"]), answer: "16 seconds",
      good: "One beat = 60 / 120 = 0.5 s; one bar = 4 × 0.5 = 2 s; 8 bars = 16 s.", why: { "8 seconds": "8 s would need bars of 1 s; here one bar is 4 beats of 0.5 s = 2 s." } },
  ];
  Kit.game({
    rounds, cols: 1, colsPhone: 1, animMs: 700, still: true,
    intro: "Round 1 is the story of the lesson: the quiet start of the flood level.",
    canvas: () => 70,
    draw(c, W, H, now, r, st) {
      c.fillStyle = "#f8f0fc"; c.fillRect(0, 0, W, H);
      if (!r) return;
      const ms = rounds.map((x) => x.m), w = (W - 20) / ms.length, cur = ms.indexOf(r.m);
      ms.forEach((t, i) => { const on = i === cur, done = i < cur || (on && st.done && st.ok); Kit.rrect(c, 10 + i * w + 3, 16, w - 6, 38, 10, on ? "#9C36B5" : done ? "#e5dbff" : "#fff", "#9C36B5", 2); Kit.text(c, t, 10 + i * w + w / 2, 40, W < 460 ? 9 : 12, on ? "#fff" : "#5f3dc4"); });
    },
  });
})();
</script>
</body>
</html>
