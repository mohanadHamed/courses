<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="230" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A licence audit in five steps</text>
<rect x="20" y="56" width="118" height="130" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="79" y="88" font-size="13.5" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">1 Inventory</text>
<text x="79" y="134" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">list every asset</text>
<text x="79" y="149.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">file</text>
<line x1="139" y1="121" x2="140.7" y2="121" stroke="#868e96" stroke-width="2" stroke-linecap="round"/>
<polygon points="149,121 139.8,125.6 139.8,116.4" fill="#868e96"/>
<rect x="150" y="56" width="118" height="130" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="209" y="88" font-size="13.5" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">2 Source</text>
<text x="209" y="134" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">find where it</text>
<text x="209" y="149.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">came from</text>
<line x1="269" y1="121" x2="270.7" y2="121" stroke="#868e96" stroke-width="2" stroke-linecap="round"/>
<polygon points="279,121 269.8,125.6 269.8,116.4" fill="#868e96"/>
<rect x="280" y="56" width="118" height="130" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="339" y="88" font-size="13.5" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">3 Licence</text>
<text x="339" y="134" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">read and save it</text>
<line x1="399" y1="121" x2="400.7" y2="121" stroke="#868e96" stroke-width="2" stroke-linecap="round"/>
<polygon points="409,121 399.8,125.6 399.8,116.4" fill="#868e96"/>
<rect x="410" y="56" width="118" height="130" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="469" y="88" font-size="13.5" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">4 Status</text>
<text x="469" y="134" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">cleared, to fix,</text>
<text x="469" y="149.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">replace</text>
<line x1="529" y1="121" x2="530.7" y2="121" stroke="#868e96" stroke-width="2" stroke-linecap="round"/>
<polygon points="539,121 529.8,125.6 529.8,116.4" fill="#868e96"/>
<rect x="540" y="56" width="118" height="130" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="2"/>
<text x="599" y="88" font-size="13.5" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">5 Fix and</text>
<text x="599" y="105.5" font-size="13.5" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">credit</text>
<text x="599" y="134" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">credits file and</text>
<text x="599" y="149.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">report</text>
<text x="340" y="214" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Do it before the release, and again after every update that adds assets.</text>
</svg>
