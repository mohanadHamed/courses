<line x1="60" y1="212" x2="268" y2="212" stroke="#e9ecef" stroke-width="1" stroke-linecap="butt"/>
<line x1="60" y1="186" x2="268" y2="186" stroke="#e9ecef" stroke-width="1" stroke-linecap="butt"/>
<line x1="60" y1="160" x2="268" y2="160" stroke="#e9ecef" stroke-width="1" stroke-linecap="butt"/>
<line x1="60" y1="134" x2="268" y2="134" stroke="#e9ecef" stroke-width="1" stroke-linecap="butt"/>
