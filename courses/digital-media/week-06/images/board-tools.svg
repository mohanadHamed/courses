<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Storyboard tools in the lab</text>
<rect x="20" y="52" width="310" height="104" rx="12" fill="#ffffff" stroke="#9C36B5" stroke-width="1.8"/>
<text x="34" y="76" font-size="14.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Paper and a template</text>
<text x="34" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Print 16:9 frames with caption lines. Fast,</text>
<text x="34" y="114.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">and always works.</text>
<rect x="350" y="52" width="310" height="104" rx="12" fill="#ffffff" stroke="#9C36B5" stroke-width="1.8"/>
<text x="364" y="76" font-size="14.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">PowerPoint or Google Slides</text>
<text x="364" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">One slide per panel; the caption in the notes;</text>
<text x="364" y="114.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">timings and Export › Video make an animatic.</text>
<rect x="20" y="170" width="310" height="104" rx="12" fill="#ffffff" stroke="#9C36B5" stroke-width="1.8"/>
<text x="34" y="194" font-size="14.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">A drawing app (Krita)</text>
<text x="34" y="216.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Free; layers make cleaning a panel easy.</text>
<rect x="350" y="170" width="310" height="104" rx="12" fill="#ffffff" stroke="#9C36B5" stroke-width="1.8"/>
<text x="364" y="194" font-size="14.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">A storyboard app (Storyboarder)</text>
<text x="364" y="216.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Free; panels, captions and timing in one place.</text>
</svg>
