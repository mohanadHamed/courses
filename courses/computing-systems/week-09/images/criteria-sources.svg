<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Plan the comparison: criteria and reliable sources</text>
<rect x="20" y="52" width="300" height="230" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="34" y="76" font-size="15" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">Criteria for Pocket Quest</text>
<text x="36" y="98" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">1. players we can reach</text>
<text x="36" y="128" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">2. tools and computers we need</text>
<text x="36" y="158" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">3. devices to test</text>
<text x="36" y="188" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">4. installing: stores and files</text>
<text x="36" y="218" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">5. updates of the system</text>
<text x="36" y="248" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">6. versions that players use</text>
<rect x="340" y="52" width="320" height="230" rx="12" fill="#ffffff" stroke="#A86700" stroke-width="1.8"/>
<text x="354" y="76" font-size="15" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">Sources</text>
<circle cx="360" cy="93" r="8" fill="#2b8a3e"/>
<text x="376" y="98" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">official pages of Google and Apple</text>
<circle cx="360" cy="131" r="8" fill="#2b8a3e"/>
<text x="376" y="136" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">a dated market report with its data</text>
<circle cx="360" cy="169" r="8" fill="#2b8a3e"/>
<text x="376" y="174" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">a news article with a date and an author</text>
<circle cx="360" cy="207" r="8" fill="#c92a2a"/>
<text x="376" y="212" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">a forum post without a date</text>
<circle cx="360" cy="245" r="8" fill="#c92a2a"/>
<text x="376" y="250" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">a page that sells phones or cases</text>
</svg>
