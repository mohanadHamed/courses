<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Three bugs with random numbers</text>
<rect x="20" y="54" width="204" height="180" rx="12" fill="#ebfbee" stroke="#c92a2a" stroke-width="1.8"/>
<text x="32" y="80" font-size="13.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">New seed every frame</text>
<text x="32" y="112" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Random.InitState(time) in</text>
<text x="32" y="127.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Update(): in one frame the</text>
<text x="32" y="143.2" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">time is the same, so every</text>
<text x="32" y="158.8" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">enemy gets the same number.</text>
<text x="32" y="200" font-size="12" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Fix: Seed once, at the start.</text>
<rect x="236" y="54" width="204" height="180" rx="12" fill="#ebfbee" stroke="#c92a2a" stroke-width="1.8"/>
<text x="248" y="80" font-size="13.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Range(1, 6) for a die</text>
<text x="248" y="112" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The max is not included: you</text>
<text x="248" y="127.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">never roll a 6.</text>
<text x="248" y="200" font-size="12" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Fix: Range(1, 7).</text>
<rect x="452" y="54" width="204" height="180" rx="12" fill="#ebfbee" stroke="#c92a2a" stroke-width="1.8"/>
<text x="464" y="80" font-size="13.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Short period, patterns</text>
<text x="464" y="112" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">A weak generator repeats</text>
<text x="464" y="127.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">soon or makes stripes.</text>
<text x="464" y="200" font-size="12" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Fix: Use the engine&#x27;s</text>
<text x="464" y="215.6" font-size="12" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">generator.</text>
</svg>
