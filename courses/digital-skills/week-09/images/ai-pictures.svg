<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Check an AI picture before it goes on a slide</text>
<rect x="20" y="56" width="280" height="180" rx="6" fill="#e7f5ff" stroke="#ced4da" stroke-width="1.2"/>
<rect x="80" y="76" width="160" height="34" rx="4" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
<text x="160" y="99" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">SUNRSIE CMOPANY</text>
<circle cx="160" cy="166" r="26" fill="#ffd8a8" stroke="#495057" stroke-width="1.5"/>
<line x1="206" y1="196" x2="206" y2="176" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
<line x1="212" y1="196" x2="212" y2="176" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
<line x1="218" y1="196" x2="218" y2="176" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
<line x1="224" y1="196" x2="224" y2="176" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
<line x1="230" y1="196" x2="230" y2="176" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
<line x1="236" y1="196" x2="236" y2="176" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="160" cy="93" rx="96" ry="28" fill="none" stroke="#c92a2a" stroke-width="2.5"/>
<circle cx="222" cy="186" r="28" fill="none" stroke="#c92a2a" stroke-width="2.5"/>
<text x="222" y="232" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">six fingers</text>
<text x="170" y="256" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">wrong text on a sign</text>
<rect x="320" y="56" width="340" height="226" rx="12" fill="#fff4e6" stroke="#D9480F" stroke-width="1.8"/>
<text x="334" y="80" font-size="14" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Rules for AI pictures</text>
<text x="334" y="98" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• Look for errors: text, hands, logos, details.</text>
<text x="334" y="134" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• No pictures of real people or of real brands.</text>
<text x="334" y="170" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• Write alt text, like for any picture.</text>
<text x="334" y="206" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• Say that it is AI-generated (a small note or the</text>
<text x="334" y="221.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">notes pane).</text>
<text x="334" y="242" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• A stock image or your own photo is often better.</text>
</svg>
