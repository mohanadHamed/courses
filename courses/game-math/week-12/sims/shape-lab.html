<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Distribution Shape Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 5px 0; font-weight: 700; }
    .sim .bar button.on { background: var(--sim-accent); color: #fff; }
    .sim .task { font-weight: 800; color: var(--sim-accent); margin: 6px 0 0; }
  </style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Distribution Shape Lab: flat, bell or crowded?</h1>
  <p class="hint">Damage in <i>Torch Hall</i> can come from one die or from the sum of several; coins can be scattered in a round room. Make 1000 values and look at their shape.</p>
  <div class="bar" id="mode"></div>
  <div class="bar" id="opts"></div>
  <div class="bar"><button type="button" id="go">Make 1000 values ▶</button></div>
  <canvas id="c" aria-label="A histogram or a scatter of the values"></canvas>
  <p class="calc" id="calc"></p>
  <p class="task" id="task"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const s = { mode: "damage", dice: 1, sqrt: false, data: null };
  const done = {};
  const TASKS = [
    { q: "Task 1: Damage from 1 die, then from the sum of 3 dice. How does the shape change?", ok: () => done["damage1"] && done["damage3"] },
    { q: "Task 2: Scatter 1000 coins in the round room with radius = R · r. Where do they crowd?", ok: () => done["circle-naive"] },
    { q: "Task 3: Now use radius = R · √r. Are the coins even?", ok: () => done["circle-sqrt"] },
  ];
  let ti = 0;
  const d6 = () => 1 + Math.floor(Math.random() * 6);
  function opts() {
    Kit.buttons($("mode"), [{ k: "damage", label: "Damage: sum of dice" }, { k: "circle", label: "Coins in a round room" }], (k) => { s.mode = k; s.data = null; opts(); upd(); });
    $("mode").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.k === s.mode));
    if (s.mode === "damage") { Kit.buttons($("opts"), [1, 2, 3, 4].map((k) => ({ k, label: k + (k > 1 ? " dice" : " die") })), (k) => { s.dice = +k; s.data = null; opts(); upd(); }); $("opts").querySelectorAll("button").forEach((b) => b.classList.toggle("on", +b.dataset.k === s.dice)); }
    else { Kit.buttons($("opts"), [{ k: "n", label: "radius = R · r" }, { k: "s", label: "radius = R · √r" }], (k) => { s.sqrt = k === "s"; s.data = null; opts(); upd(); }); $("opts").querySelectorAll("button").forEach((b) => b.classList.toggle("on", (b.dataset.k === "s") === s.sqrt)); }
  }
  $("go").addEventListener("click", () => {
    if (s.mode === "damage") { s.data = Array.from({ length: 1000 }, () => { let t = 0; for (let i = 0; i < s.dice; i++) t += d6(); return t; }); done["damage" + s.dice] = true; }
    else { s.data = Array.from({ length: 1000 }, () => { const r = Math.random(), a = Math.random() * 2 * Math.PI, rad = s.sqrt ? Math.sqrt(r) : r; return [rad * Math.cos(a), rad * Math.sin(a)]; }); done[s.sqrt ? "circle-sqrt" : "circle-naive"] = true; }
    upd();
  });
  function upd() {
    let m = "";
    while (ti < TASKS.length && TASKS[ti].ok()) { ti++; m = "✓ Done. "; Kit.good(); }
    $("task").textContent = ti < TASKS.length ? TASKS[ti].q : "All tasks are done: the formula decides the shape of the randomness.";
    if (!s.data) { $("calc").textContent = ""; $("msg").textContent = m + "Press the button to make 1000 values."; }
    else if (s.mode === "damage") { const avg = s.data.reduce((a, b) => a + b, 0) / 1000; $("calc").textContent = `range ${s.dice} … ${6 * s.dice} · average ${Kit.fmt(avg, 2)} (expected ${3.5 * s.dice})`; $("msg").textContent = m + (s.dice === 1 ? "Flat: every damage value equally often. Players feel big swings." : "Bell-shaped: values near the middle are common, extremes are rare. Damage feels steadier."); }
    else { const inner = s.data.filter(([x, y]) => x * x + y * y < 0.25).length; $("calc").textContent = `coins in the inner half of the radius: ${inner} of 1000 (an even spread gives about 250)`; $("msg").textContent = m + (s.sqrt ? "√r spreads the coins evenly over the area." : "Too many coins near the centre: the inner circle has a quarter of the area but gets about half of the coins."); }
    paint();
  }
  const cv = Kit.canvas($("c"), (W) => Math.min(280, W * 0.55));
  function paint() {
    const c = cv.ctx, W = cv.W, H = cv.H;
    c.clearRect(0, 0, W, H);
    if (!s.data) return;
    if (s.mode === "damage") {
      const lo = s.dice, hi = 6 * s.dice, n = hi - lo + 1, cnt = Array(n).fill(0); s.data.forEach((v) => cnt[v - lo]++);
      const max = Math.max(...cnt), bw = (W - 20) / n;
      cnt.forEach((k, i) => { const h = (H - 30) * k / max; c.fillStyle = "#2F9E44"; c.fillRect(10 + i * bw + 1, H - 18 - h, bw - 2, h); if (n <= 12 || i % 2 === 0) Kit.text(c, lo + i, 10 + (i + 0.5) * bw, H - 4, 10, "#868e96"); });
    } else {
      const R = Math.min(W, H) / 2 - 8, cx = W / 2, cy = H / 2;
      c.fillStyle = "#f8f9fa"; c.strokeStyle = "#2F9E44"; c.lineWidth = 2; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.fill(); c.stroke();
      c.setLineDash([4, 4]); c.strokeStyle = "#adb5bd"; c.beginPath(); c.arc(cx, cy, R / 2, 0, 7); c.stroke(); c.setLineDash([]);
      c.fillStyle = s.sqrt ? "#1c7ed6" : "#c92a2a"; s.data.forEach(([x, y]) => { c.beginPath(); c.arc(cx + x * R, cy + y * R, 1.8, 0, 7); c.fill(); });
    }
  }
  window.addEventListener("resize", () => setTimeout(paint, 60));
  window.SH = { set: (o) => { Object.assign(s, o, { data: null }); opts(); upd(); }, go: () => $("go").click() };
  opts(); upd();
})();
</script>
</body>
</html>
