<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Common reasons why games are rejected</text>
<rect x="20" y="54" width="200" height="98" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="120" y="86" font-size="13.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">crashes and bugs</text>
<text x="120" y="108" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">test on real phones</text>
<rect x="240" y="54" width="200" height="98" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="340" y="86" font-size="13.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">incomplete build</text>
<text x="340" y="108" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">no placeholders, no empty shop</text>
<rect x="460" y="54" width="200" height="98" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="560" y="86" font-size="13.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">misleading listing</text>
<text x="560" y="108" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">real screenshots and text</text>
<rect x="20" y="166" width="200" height="98" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="120" y="198" font-size="13.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">privacy</text>
<text x="120" y="220" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">policy, data form, permissions</text>
<rect x="240" y="166" width="200" height="98" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="340" y="198" font-size="13.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">payments</text>
<text x="340" y="220" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">store purchases, show</text>
<text x="340" y="235.6" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">loot-box odds</text>
<rect x="460" y="166" width="200" height="98" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="560" y="198" font-size="13.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">other people&#x27;s content</text>
<text x="560" y="220" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">licences for music, art, brands</text>
<text x="340" y="290" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Each one is a part of the guidelines; the review names the part when it rejects a game.</text>
</svg>
