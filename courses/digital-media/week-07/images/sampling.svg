<text x="40" y="312" font-size="12" fill="#e8590c" text-anchor="start" font-weight="700" xml:space="preserve">each dot = one sample; each dot sits on one of the levels</text>
<rect x="450" y="60" width="210" height="250" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="464" y="84" font-size="15" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Two numbers</text>
<text x="464" y="104" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Sample rate: samples per</text>
<text x="464" y="120.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">second. 44.1 kHz or 48 kHz</text>
<text x="464" y="136.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">for games and music.</text>
<text x="464" y="186" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Bit depth: bits per sample.</text>
<text x="464" y="202.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">16-bit = 65 536 levels;</text>
<text x="464" y="218.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">24-bit for recording.</text>
<text x="464" y="262" font-size="12.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">More of each: better sound,</text>
<text x="464" y="278.2" font-size="12.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">bigger file.</text>
