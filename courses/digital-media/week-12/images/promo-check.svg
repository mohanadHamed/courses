<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Review the promo before you export it</text>
<rect x="20" y="60" width="22" height="22" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<polyline points="25,71 30,76 38,66" fill="none" stroke="#9C36B5" stroke-width="2.5" stroke-linejoin="round"/>
<text x="52" y="76" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The hook is in the first 3 seconds.</text>
<rect x="350" y="60" width="22" height="22" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<polyline points="355,71 360,76 368,66" fill="none" stroke="#9C36B5" stroke-width="2.5" stroke-linejoin="round"/>
<text x="382" y="76" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">No shot is longer than about 4 s (except the</text>
<text x="382" y="92.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">end).</text>
<rect x="20" y="116" width="22" height="22" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<polyline points="25,127 30,132 38,122" fill="none" stroke="#9C36B5" stroke-width="2.5" stroke-linejoin="round"/>
<text x="52" y="132" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Cuts are on the beat or on an action; no</text>
<text x="52" y="148.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">jump cuts.</text>
<rect x="350" y="116" width="22" height="22" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<polyline points="355,127 360,132 368,122" fill="none" stroke="#9C36B5" stroke-width="2.5" stroke-linejoin="round"/>
<text x="382" y="132" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">All text is inside the title safe area and on</text>
<text x="382" y="148.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">screen ≥ 2 s.</text>
<rect x="20" y="172" width="22" height="22" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<polyline points="25,183 30,188 38,178" fill="none" stroke="#9C36B5" stroke-width="2.5" stroke-linejoin="round"/>
<text x="52" y="188" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The voice is clear; the music fades at the</text>
<text x="52" y="204.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">end.</text>
<rect x="350" y="172" width="22" height="22" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<polyline points="355,183 360,188 368,178" fill="none" stroke="#9C36B5" stroke-width="2.5" stroke-linejoin="round"/>
<text x="382" y="188" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The clips match in colour.</text>
<rect x="20" y="228" width="22" height="22" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<polyline points="25,239 30,244 38,234" fill="none" stroke="#9C36B5" stroke-width="2.5" stroke-linejoin="round"/>
<text x="52" y="244" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The end shows the name and the call to</text>
<text x="52" y="260.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">action.</text>
<rect x="350" y="228" width="22" height="22" rx="4" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<polyline points="355,239 360,244 368,234" fill="none" stroke="#9C36B5" stroke-width="2.5" stroke-linejoin="round"/>
<text x="382" y="244" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Exported: right shape, H.264, watched once.</text>
</svg>
