<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Players and devices: Android and iOS</text>
<text x="30" y="70" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Phones in use worldwide (round numbers)</text>
<rect x="30" y="84" width="420" height="40" rx="6" fill="#2b8a3e"/>
<rect x="324" y="84" width="126" height="40" rx="6" fill="#1c7ed6"/>
<text x="177" y="110" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Android about 70 %</text>
<text x="387" y="110" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">iOS about 30 %</text>
<text x="30" y="146" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">The share differs by country: check the market of your game.</text>
<rect x="30" y="168" width="200" height="128" rx="12" fill="#2b8a3e14" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="44" y="192" font-size="14" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Android devices</text>
<text x="44" y="220" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• many makers</text>
<text x="44" y="244" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• cheap to expensive phones</text>
<text x="44" y="268" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• many screens and versions</text>
<rect x="250" y="168" width="200" height="128" rx="12" fill="#1c7ed614" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="264" y="192" font-size="14" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">iOS devices</text>
<text x="264" y="220" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• one maker: Apple</text>
<text x="264" y="244" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• mid-range to expensive</text>
<text x="264" y="268" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">• few models, recent iOS</text>
<rect x="480" y="64" width="180" height="232" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="494" y="88" font-size="15" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">For a game</text>
<text x="494" y="108" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Android: more players,</text>
<text x="494" y="124.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">more devices to test</text>
<text x="494" y="140.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">(fragmentation).</text>
<text x="494" y="196" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">iOS: fewer devices;</text>
<text x="494" y="212.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">players often spend</text>
<text x="494" y="228.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">more in games.</text>
</svg>
