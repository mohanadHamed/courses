<line x1="60" y1="82" x2="268" y2="82" stroke="#e9ecef" stroke-width="1" stroke-linecap="butt"/>
<line x1="54" y1="290" x2="277.9" y2="290" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="286,290 277,294.5 277,285.5" fill="#adb5bd"/>
<line x1="60" y1="296" x2="60" y2="72.1" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="60,64 64.5,73 55.5,73" fill="#adb5bd"/>
<text x="290" y="294" font-size="13" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">x</text>
<text x="60" y="58" font-size="13" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">y</text>
<text x="112" y="306" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">2</text>
<text x="164" y="306" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">4</text>
<text x="216" y="306" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">6</text>
<text x="268" y="306" font-size="11" fill="#6b726e" text-anchor="middle" font-weight="600" xml:space="preserve">8</text>
<text x="53" y="242" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">2</text>
<text x="53" y="190" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">4</text>
<text x="53" y="138" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">6</text>
<text x="53" y="86" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">8</text>
<text x="53" y="306" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">0</text>
<circle cx="138" cy="238" r="5" fill="#1c7ed6"/>
<text x="130" y="230" font-size="12.5" fill="#1c7ed6" text-anchor="end" font-weight="800" xml:space="preserve">P (3, 2)</text>
<circle cx="216" cy="186" r="5" fill="#2F9E44"/>
<text x="224" y="178" font-size="12.5" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">(6, 4)</text>
<path d="M144 232 Q164 186 209 188" fill="none" stroke="#2F9E44" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="209,188 197.8,193 198.3,182" fill="#2F9E44"/>
<path d="M214 194 Q203 232.8 146 240" fill="none" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="146,240 156.2,233.2 157.6,244.1" fill="#e8590c"/>
<text x="169.2" y="160" font-size="12.5" fill="#2F9E44" text-anchor="middle" font-weight="800" xml:space="preserve">A = scale by 2</text>
<text x="216" y="261.4" font-size="12.5" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">A⁻¹ = scale by 0.5</text>
<text x="330" y="80" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">For a 2 × 2 matrix with rows (a, b) and (c, d):</text>
<text x="330" y="110" font-size="17" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">det = ad − bc</text>
<text x="330" y="140" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A⁻¹ = (1 / det) × rows (d, −b) and (−c, a)</text>
<text x="330" y="180" font-size="14" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">det = 0: no inverse.</text>
<text x="330" y="202" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">The matrix squashes the plane flat,</text>
<text x="330" y="220" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">and nothing can bring it back.</text>
<text x="330" y="260" font-size="15" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">Check: A × A⁻¹ = I</text>
</svg>
