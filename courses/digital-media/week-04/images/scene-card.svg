<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="700" height="340" fill="#ffffff"/>
<text x="350" y="34" font-size="17" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">The scene card of "Rooftop"</text>
<rect x="110" y="54" width="480" height="270" rx="10" fill="#fffdf5" stroke="#e9d8a6" stroke-width="2"/>
<text x="132" y="90" font-size="13.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Scene</text>
<text x="250" y="90" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">EXT. ROOFTOP – NIGHT</text>
<line x1="126" y1="99" x2="574" y2="99" stroke="#f1e6c8" stroke-width="1" stroke-linecap="round"/>
<text x="132" y="118" font-size="13.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Characters</text>
<text x="250" y="118" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Nour (17), Grandma Salma (78)</text>
<line x1="126" y1="127" x2="574" y2="127" stroke="#f1e6c8" stroke-width="1" stroke-linecap="round"/>
<text x="132" y="146" font-size="13.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Goal</text>
<text x="250" y="146" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Nour wants Salma in the boat now.</text>
<line x1="126" y1="155" x2="574" y2="155" stroke="#f1e6c8" stroke-width="1" stroke-linecap="round"/>
<text x="132" y="174" font-size="13.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Obstacle</text>
<text x="250" y="174" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Salma will not leave her house.</text>
<line x1="126" y1="183" x2="574" y2="183" stroke="#f1e6c8" stroke-width="1" stroke-linecap="round"/>
<text x="132" y="202" font-size="13.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Turn</text>
<text x="250" y="202" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">The water opens the door; Salma gives</text>
<line x1="126" y1="211" x2="574" y2="211" stroke="#f1e6c8" stroke-width="1" stroke-linecap="round"/>
<text x="250" y="230" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">Nour the house key and gets in.</text>
<text x="132" y="258" font-size="13.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Beat</text>
<text x="250" y="258" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">end of stage 1: the first family is safe</text>
<line x1="126" y1="267" x2="574" y2="267" stroke="#f1e6c8" stroke-width="1" stroke-linecap="round"/>
<text x="132" y="286" font-size="13.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Length</text>
<text x="250" y="286" font-size="13.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">about half a page (30 seconds)</text>
</svg>
