<text x="38.0" y="116.0" font-size="11" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Omar (sales)</text>
<text x="38.0" y="136.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">I must send the price list to a customer. Nobody may</text>
<text x="38.0" y="154.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">change the prices. Which format do I send?</text>
