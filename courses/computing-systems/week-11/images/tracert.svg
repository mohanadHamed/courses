<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">tracert: where on the way is the delay?</text>
<rect x="20" y="50" width="440" height="138" rx="10" fill="#1e1e2e"/>
<text x="32" y="72" font-size="11" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">C:\&gt; tracert play.example.net</text>
<text x="32" y="91" font-size="11" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  1    2 ms   192.168.1.1     (office router)</text>
<text x="32" y="110" font-size="11" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  2    9 ms   10.20.0.1       (ISP)</text>
<text x="32" y="129" font-size="11" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  3   11 ms   203.0.113.9</text>
<rect x="26" y="134" width="428" height="19" rx="4" fill="#5c4813"/>
<text x="32" y="148" font-size="11" fill="#ffd43b" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  4   96 ms   203.0.113.77</text>
<text x="32" y="167" font-size="11" fill="#e9ecef" text-anchor="start" font-weight="600" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  5   98 ms   198.51.100.7    (game server)</text>
<rect x="476" y="50" width="184" height="180" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="490" y="74" font-size="14" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">Read it</text>
<text x="490" y="90" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Each line is one router (a</text>
<text x="490" y="105.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">hop).</text>
<text x="490" y="128" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">The jump from 11 to 96</text>
<text x="490" y="143.6" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">ms is at hop 4: far from</text>
<text x="490" y="159.2" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">the office.</text>
<text x="490" y="190" font-size="12" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Hops 1–3 are fast: the</text>
<text x="490" y="205.6" font-size="12" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">LAN is fine.</text>
</svg>
