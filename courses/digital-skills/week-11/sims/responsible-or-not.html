<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Responsible or Not?</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #fff4e6; border: 1.5px solid #D9480F; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Responsible or Not?</h1>
  <p class="hint">At Sunrise Company and at the college, six people share, use and make things online, three of them with AI tools. For each one, choose the best judgement and action.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  // Lecture 9: three cases of safe sharing and fair use (personal data, a
  // picture, an app permission) and three AI cases. The right answer is the
  // first choice (the page mixes them; ?fixed-order keeps this order).
  const rounds = [
    { card: "Huda shares a screenshot of the class chat in another group. It shows the exam date and Sami's phone number.", answer: "not OK: crop out or cover the phone number", choices: C(["not OK: crop out or cover the phone number", "OK: it is only a screenshot", "OK: the group is small", "OK if Huda deletes it tomorrow"]), good: "A phone number is personal data: keep only the part that matters." },
    { card: "Sami asks an AI to write the whole essay and hands it in as Sami's own work.", answer: "not honest: write it yourself and state any AI help", choices: C(["not honest: write it yourself and state any AI help", "fine: the AI was free", "fine if the grammar is good", "fine if Sami reads it once"]), good: "Presenting AI text as your own is plagiarism; follow the course rules and write an AI-use statement." },
    { card: "Rana needs a picture of a library for her class report.", answer: "a free stock image of Word, or her own photo", choices: C(["a free stock image of Word, or her own photo", "any picture from an image search", "a famous logo", "a classmate's photo, without asking"]), good: "Insert › Pictures › Stock Images is free to use; for a picture from a website, ask and name the source." },
    { card: "Huda pastes the staff salary list, with names, into a free AI chat tool to make a chart.", answer: "not OK: remove the names or use an approved tool", choices: C(["not OK: remove the names or use an approved tool", "OK: it is faster", "OK if the chat is deleted later", "OK: salaries are not personal"]), good: "Salaries with names are sensitive data; anonymize, or use the tool the company approved." },
    { card: "A new flashlight app asks Omar for his contacts and his location.", answer: "deny both: a flashlight needs neither", choices: C(["deny both: a flashlight needs neither", "allow both: apps need them", "allow the contacts only", "allow both, then delete the app"]), good: "An app gets only the permissions that its job needs: a flashlight needs the light, not your contacts." },
    { card: "Sami asks an AI to explain a hard topic, then writes notes in Sami's own words.", answer: "usually fine: learning with AI", choices: C(["usually fine: learning with AI", "cheating", "plagiarism", "a copyright problem"]), good: "Using AI to learn is usually fine; check the explanation in the course book." },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; r.goal = r.goal || "Choose the best judgement."; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 1, animMs: 600, intro: "Round 1 is the first case of the lesson: a screenshot in a class group." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "All cases are judged." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
