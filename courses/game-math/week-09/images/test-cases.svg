<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="280" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Every row of the truth table is one test case</text>
<rect x="30" y="54" width="520" height="34" rx="0" fill="#2F9E44"/>
<text x="40" y="75.7" font-size="13" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">row</text>
<text x="265" y="75.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">test: the ship has …</text>
<text x="490" y="75.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">expected</text>
<text x="40" y="109.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">1</text>
<text x="265" y="109.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">pass, shields, officer</text>
<text x="490" y="109.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">open</text>
<rect x="30" y="122" width="520" height="34" rx="0" fill="#f8f9fa"/>
<text x="40" y="143.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">4</text>
<text x="265" y="143.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">pass only</text>
<text x="490" y="143.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">shut</text>
<text x="40" y="177.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">6</text>
<text x="265" y="177.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">shields only, no pass</text>
<text x="490" y="177.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">shut</text>
<rect x="30" y="190" width="520" height="34" rx="0" fill="#f8f9fa"/>
<text x="40" y="211.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">2</text>
<text x="265" y="211.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">pass and shields</text>
<text x="490" y="211.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">open</text>
<rect x="30" y="54" width="520" height="170" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="30" y="250" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Play each case once and compare the door with the table. A difference is a bug in the code or in the rule.</text>
</svg>
