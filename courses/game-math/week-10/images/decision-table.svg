<text x="245" y="207.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">F</text>
<rect x="290" y="186" width="110" height="34" rx="0" fill="#fff9db"/>
<text x="345" y="207.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">Chase</text>
<text x="65" y="241.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">F</text>
<text x="155" y="241.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">T</text>
<text x="245" y="241.9" font-size="13.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">T</text>
