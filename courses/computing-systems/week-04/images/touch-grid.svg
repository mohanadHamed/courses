<text x="640" y="164" font-size="11" fill="#6b726e" text-anchor="end" font-weight="600" xml:space="preserve">32 ms</text>
<text x="340" y="196" font-size="12.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">240 Hz: a check about every 4 ms</text>
