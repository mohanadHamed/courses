<text x="34" y="46" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">How the screen finds a finger</text>
<rect x="40" y="70" width="230" height="230" rx="12" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
<line x1="50" y1="80" x2="50" y2="290" stroke="#a5d8ff" stroke-width="2" stroke-linecap="round"/>
<line x1="50" y1="80" x2="260" y2="80" stroke="#ffd8a8" stroke-width="2" stroke-linecap="round"/>
<line x1="80" y1="80" x2="80" y2="290" stroke="#a5d8ff" stroke-width="2" stroke-linecap="round"/>
<line x1="50" y1="110" x2="260" y2="110" stroke="#ffd8a8" stroke-width="2" stroke-linecap="round"/>
