<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">From take to game file: the order of the edits</text>
<rect x="20" y="70" width="96" height="110" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="68" y="104" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">1 record</text>
<text x="68" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">3 takes, mono,</text>
<text x="68" y="146.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">48 kHz</text>
<line x1="117" y1="125" x2="122.7" y2="125" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="129,125 122,128.5 122,121.5" fill="#e8590c"/>
<rect x="130" y="70" width="96" height="110" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="178" y="104" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">2 trim</text>
<text x="178" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">silence at the</text>
<text x="178" y="146.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">start</text>
<line x1="227" y1="125" x2="232.7" y2="125" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="239,125 232,128.5 232,121.5" fill="#e8590c"/>
<rect x="240" y="70" width="96" height="110" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="288" y="104" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">3 clean</text>
<text x="288" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">noise</text>
<text x="288" y="146.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">reduction</text>
<line x1="337" y1="125" x2="342.7" y2="125" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="349,125 342,128.5 342,121.5" fill="#e8590c"/>
<rect x="350" y="70" width="96" height="110" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="398" y="104" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">4 fade</text>
<text x="398" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">in and out</text>
<line x1="447" y1="125" x2="452.7" y2="125" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="459,125 452,128.5 452,121.5" fill="#e8590c"/>
<rect x="460" y="70" width="96" height="110" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="508" y="104" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">5 normalize</text>
<text x="508" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">peak to −1 dB</text>
<line x1="557" y1="125" x2="562.7" y2="125" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/>
<polygon points="569,125 562,128.5 562,121.5" fill="#e8590c"/>
<rect x="570" y="70" width="96" height="110" rx="12" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="618" y="104" font-size="14" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">6 export</text>
<text x="618" y="132" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">WAV + name</text>
<text x="340" y="214" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Clean first, then normalize: normalizing first would make the noise and the clicks louder too.</text>
</svg>
