<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="310" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Is the source real? Three quick checks</text>
<rect x="20" y="54" width="640" height="56" rx="8" fill="#fff9db" stroke="#fab005" stroke-width="1.6"/>
<text x="34" y="78" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">AI: “Students who sleep 8 hours get 25 % better marks</text>
<text x="34" y="98" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">(Miller &amp; Hart, 2019, Journal of Student Sleep, 12(3)).”</text>
<rect x="20" y="128" width="204" height="120" rx="10" fill="#fff4e6" stroke="#D9480F" stroke-width="1.6"/>
<text x="32" y="152" font-size="12.5" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Search the title</text>
<text x="32" y="196" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">no article with this title is</text>
<text x="32" y="211.6" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">found</text>
<rect x="236" y="128" width="204" height="120" rx="10" fill="#fff4e6" stroke="#D9480F" stroke-width="1.6"/>
<text x="248" y="152" font-size="12.5" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Search the journal and the</text>
<text x="248" y="168.2" font-size="12.5" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">authors</text>
<text x="248" y="196" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">no such journal; the authors</text>
<text x="248" y="211.6" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">wrote nothing on sleep</text>
<rect x="452" y="128" width="204" height="120" rx="10" fill="#fff4e6" stroke="#D9480F" stroke-width="1.6"/>
<text x="464" y="152" font-size="12.5" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">Open the link or DOI</text>
<text x="464" y="196" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">it leads to another paper, or</text>
<text x="464" y="211.6" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">nowhere</text>
<text x="20" y="280" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">All three fail: a made-up source. Delete the claim, or find a real study and cite that one.</text>
</svg>
