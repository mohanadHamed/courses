<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="230" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Transitions: quiet and the same on every slide</text>
<rect x="20" y="56" width="150" height="110" rx="10" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/>
<text x="95" y="100" font-size="16" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">Fade</text>
<text x="95" y="130" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">calm, 0.5–1 s</text>
<rect x="185" y="56" width="150" height="110" rx="10" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/>
<text x="260" y="100" font-size="16" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">Push</text>
<text x="260" y="130" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">calm, 0.5–1 s</text>
<rect x="350" y="56" width="150" height="110" rx="10" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/>
<text x="425" y="100" font-size="16" fill="#2b8a3e" text-anchor="middle" font-weight="800" xml:space="preserve">Wipe</text>
<text x="425" y="130" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">calm, 0.5–1 s</text>
<rect x="515" y="56" width="150" height="110" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/>
<text x="590" y="100" font-size="16" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">Vortex</text>
<text x="590" y="130" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">distracting</text>
<text x="340" y="200" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">Transitions tab › choose one › Duration › Apply To All.</text>
</svg>
