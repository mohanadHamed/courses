<text x="38" y="150.8" font-size="12.6" fill="#000000" text-anchor="start" font-weight="600" xml:space="preserve">• On Saturday the shop will open later, …</text>
<text x="38" y="168.8" font-size="12.6" fill="#000000" text-anchor="start" font-weight="600" xml:space="preserve">• The new hours start on the first day …</text>
<text x="38" y="186.8" font-size="12.6" fill="#000000" text-anchor="start" font-weight="600" xml:space="preserve">• Please tell every customer about the …</text>
<text x="38" y="204.8" font-size="12.6" fill="#000000" text-anchor="start" font-weight="600" xml:space="preserve">• Rana will put a big notice on the …</text>
<text x="170" y="236" font-size="12.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">too much: the audience reads</text>
