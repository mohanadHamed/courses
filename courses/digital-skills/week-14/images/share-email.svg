<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Share the files, then send a checked e-mail</text>
<rect x="20" y="50" width="300" height="230" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/>
<rect x="20" y="50" width="300" height="26" rx="8" fill="#e9ecef"/>
<rect x="20" y="68" width="300" height="8" rx="0" fill="#e9ecef"/>
<circle cx="34" cy="63" r="4.5" fill="#ff6b6b"/>
<circle cx="48" cy="63" r="4.5" fill="#fcc419"/>
<circle cx="62" cy="63" r="4.5" fill="#51cf66"/>
<text x="170" y="67" font-size="11.5" fill="#495057" text-anchor="middle" font-weight="700" xml:space="preserve">Share &quot;report.docx&quot;</text>
<rect x="36" y="90" width="268" height="30" rx="6" fill="#ffffff" stroke="#ced4da" stroke-width="1.2"/>
<text x="46" y="110" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Rana, Sami (Sunrise Company)</text>
<rect x="217.7" y="129.2" width="64.6" height="21.5" rx="10.8" fill="#2b579a"/>
<text x="250" y="144.1" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Can edit</text>
<rect x="215.8" y="161.2" width="68.4" height="21.5" rx="10.8" fill="#868e96"/>
<text x="250" y="176.1" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">Can view</text>
<text x="36" y="145" font-size="12" fill="#6b726e" text-anchor="start" font-weight="800" xml:space="preserve">co-edit:</text>
<text x="36" y="177" font-size="12" fill="#6b726e" text-anchor="start" font-weight="800" xml:space="preserve">only read:</text>
<text x="36" y="214" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Copy link: one file, always</text>
<text x="36" y="234" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">the newest version</text>
<text x="36" y="262" font-size="12" fill="#2b579a" text-anchor="start" font-weight="800" xml:space="preserve">Comments and version history</text>
<line x1="330" y1="165" x2="343" y2="165" stroke="#868e96" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="352,165 342,170 342,160" fill="#868e96"/>
<rect x="362" y="50" width="298" height="230" rx="10" fill="#ffffff" stroke="#D9480F" stroke-width="2"/>
<text x="378" y="76" font-size="13" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">AI draft of the e-mail</text>
<text x="378" y="106" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Dear managers,</text>
<text x="378" y="136" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">the March report is ready (link).</text>
<text x="378" y="166" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Total sales: 355 JD.</text>
<rect x="586.6" y="151.5" width="42.7" height="21" rx="10.5" fill="#2b8a3e"/>
<text x="608" y="166" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">true</text>
<text x="378" y="196" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Best week: the second week.</text>
<rect x="581.8" y="181.5" width="52.4" height="21" rx="10.5" fill="#c92a2a"/>
<text x="608" y="196" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">wrong</text>
<text x="378" y="226" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Meeting: Monday 10:00.</text>
<rect x="586.6" y="211.5" width="42.7" height="21" rx="10.5" fill="#2b8a3e"/>
<text x="608" y="226" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">true</text>
<text x="378" y="262" font-size="12" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Check names, dates and numbers.</text>
</svg>
