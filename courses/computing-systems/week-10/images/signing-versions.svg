<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="280" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Signing and version numbers</text>
<rect x="20" y="52" width="310" height="200" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="34" y="76" font-size="15" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">Signing</text>
<text x="36" y="96" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Each build is signed with the studio&#x27;s secret</text>
<text x="36" y="112.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">key. The store and the phones accept an</text>
<text x="36" y="128.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">update only with the same key.</text>
<text x="36" y="190" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Keep the key file and its password safe,</text>
<text x="36" y="206.2" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">with a backup.</text>
<rect x="350" y="52" width="310" height="200" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="364" y="76" font-size="15" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">Two version numbers</text>
<rect x="366" y="96" width="260" height="32" rx="0" fill="#A86700"/>
<text x="376" y="116.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve"></text>
<text x="556" y="116.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">players see</text>
<text x="376" y="148.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">version name</text>
<text x="556" y="148.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1.0 → 1.0.1</text>
<rect x="366" y="160" width="260" height="32" rx="0" fill="#f8f9fa"/>
<text x="376" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">build number</text>
<text x="556" y="180.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">12 → 13</text>
<rect x="366" y="96" width="260" height="96" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="366" y="210" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The build number must grow with every</text>
<text x="366" y="226.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">upload.</text>
</svg>
