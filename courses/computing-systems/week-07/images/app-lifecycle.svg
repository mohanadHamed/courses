<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">The life cycle of a game on a phone</text>
<rect x="30" y="56" width="140" height="48" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<text x="100" y="85" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">not running</text>
<rect x="220" y="56" width="140" height="48" rx="12" fill="#A86700" stroke="#A86700" stroke-width="2"/>
<text x="290" y="85" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">foreground</text>
<rect x="410" y="56" width="140" height="48" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<text x="480" y="85" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">background</text>
<rect x="410" y="206" width="140" height="48" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<text x="480" y="235" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">suspended</text>
<rect x="220" y="206" width="140" height="48" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="2"/>
<text x="290" y="235" font-size="14" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">ended</text>
<line x1="170" y1="80" x2="209.9" y2="80" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="218,80 209,84.5 209,75.5" fill="#2a2f2c"/>
<text x="194" y="70" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">tap</text>
<line x1="360" y1="72" x2="399.9" y2="72" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="408,72 399,76.5 399,67.5" fill="#e8590c"/>
<text x="384" y="60" font-size="11.5" fill="#e8590c" text-anchor="middle" font-weight="800" xml:space="preserve">call, home</text>
<line x1="408" y1="90" x2="368.1" y2="90" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="360,90 369,85.5 369,94.5" fill="#2a2f2c"/>
<text x="384" y="108" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">back</text>
<line x1="480" y1="104" x2="480" y2="195.9" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="480,204 475.5,195 484.5,195" fill="#2a2f2c"/>
<text x="488" y="160" font-size="11.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">seconds later</text>
<line x1="410" y1="230" x2="370.1" y2="230" stroke="#c92a2a" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="362,230 371,225.5 371,234.5" fill="#c92a2a"/>
<text x="386" y="220" font-size="11.5" fill="#c92a2a" text-anchor="middle" font-weight="800" xml:space="preserve">RAM low</text>
<line x1="232" y1="206" x2="135.7" y2="109.7" stroke="#2a2f2c" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<polygon points="130,104 139.5,107.2 133.2,113.5" fill="#2a2f2c"/>
<text x="150" y="168" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">start again,</text>
<text x="150" y="183" font-size="11.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">load the save</text>
<rect x="323.6" y="129" width="122.8" height="22" rx="11" fill="#e8590c"/>
<text x="385" y="144.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">pause + save here</text>
<text x="340" y="300" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Android: onPause / onStop. iOS: will resign active / did enter background. Unity: OnApplicationPause.</text>
</svg>
