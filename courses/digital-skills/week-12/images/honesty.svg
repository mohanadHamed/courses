<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="250" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Honest AI use: it depends on the rules</text>
<rect x="20" y="52" width="206" height="132" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="34" y="76" font-size="14.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Usually fine</text>
<text x="34" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">ideas and an outline</text>
<text x="34" y="117.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">spelling and grammar</text>
<text x="34" y="136.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">explain a topic to me</text>
<rect x="238" y="52" width="206" height="132" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.8"/>
<text x="252" y="76" font-size="14.5" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">Fine if allowed and</text>
<text x="252" y="94.1" font-size="14.5" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">stated</text>
<text x="252" y="116.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a first draft that I rewrite</text>
<text x="252" y="135.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">a summary I checked</text>
<text x="252" y="154.8" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">an AI image in a slide</text>
<rect x="456" y="52" width="206" height="132" rx="12" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.8"/>
<text x="470" y="76" font-size="14.5" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">Not honest</text>
<text x="470" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">AI text handed in as my own</text>
<text x="470" y="117.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">invented sources</text>
<text x="470" y="136.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">AI in a test without</text>
<text x="470" y="152.9" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">permission</text>
<text x="340" y="210" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">The course or the company sets the rules. When unsure, ask the teacher or the manager.</text>
<text x="340" y="232" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Keep your drafts and prompts: they show your own work.</text>
</svg>
