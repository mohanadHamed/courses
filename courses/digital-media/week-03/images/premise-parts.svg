<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="640" height="300" fill="#ffffff"/>
<text x="320.0" y="30.0" font-size="15" fill="#2a2f2c" text-anchor="middle" font-weight="800" xml:space="preserve">The parts of a premise (Moon Diver)</text>
<rect x="30.0" y="46.0" width="440.0" height="32.0" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<text x="42.0" y="67.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">When the base on the Moon starts to lose power,</text>
<rect x="482.0" y="50.0" width="128.0" height="24.0" rx="12" fill="#e8590c" stroke="none" stroke-width="1.5"/>
<text x="546.0" y="67.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">inciting incident</text>
<rect x="30.0" y="88.0" width="440.0" height="32.0" rx="8" fill="#ffffff" stroke="#9C36B5" stroke-width="2"/>
<text x="42.0" y="109.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Pip, a small diving robot,</text>
<rect x="482.0" y="92.0" width="128.0" height="24.0" rx="12" fill="#9C36B5" stroke="none" stroke-width="1.5"/>
<text x="546.0" y="109.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">character</text>
<rect x="30.0" y="130.0" width="440.0" height="32.0" rx="8" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text x="42.0" y="151.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">must find the lost crystals in the Deep Lake</text>
<rect x="482.0" y="134.0" width="128.0" height="24.0" rx="12" fill="#1971c2" stroke="none" stroke-width="1.5"/>
<text x="546.0" y="151.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">goal</text>
<rect x="30.0" y="172.0" width="440.0" height="32.0" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/>
<text x="42.0" y="193.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">before the lights go out for good,</text>
<rect x="482.0" y="176.0" width="128.0" height="24.0" rx="12" fill="#c92a2a" stroke="none" stroke-width="1.5"/>
<text x="546.0" y="193.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">stakes</text>
<rect x="30.0" y="214.0" width="440.0" height="32.0" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/>
<text x="42.0" y="235.0" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">but ice eels and dark water stand in the way.</text>
<rect x="482.0" y="218.0" width="128.0" height="24.0" rx="12" fill="#2b8a3e" stroke="none" stroke-width="1.5"/>
<text x="546.0" y="235.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">obstacle (conflict)</text>
<text x="320.0" y="286.0" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Setting: the Deep Lake on the Moon. The player dives: that is the core mechanic.</text>
</svg>
