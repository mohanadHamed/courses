<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Disk Doctor</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .pad button { text-align: left; }</style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Disk Doctor</h1>
  <p class="hint">The team of <b>Byte Bay</b> meets file and device problems with <i>Pocket Quest</i>. Find the cause or the fix. Blocks are 4 KB; 1 MB = 1024 KB.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { icon: "usb", goal: "Omar copies <b>levels.pak (5 GB)</b> to an old USB stick formatted <b>FAT32</b>. Windows says: “File too large.” Why?",
      choices: C(["FAT32 allows no file bigger than 4 GB", "the stick is full", "the file is broken", "the stick has no driver"]), answer: "FAT32 allows no file bigger than 4 GB",
      good: "FAT32 cannot keep a file of 4 GB or more. Format the stick as exFAT (this deletes what is on it).", why: { "the stick is full": "The message says the file is too large, not that the stick is full." } },
    { icon: "folder", goal: "Omar plays on Windows. Where is his save file of Pocket Quest?",
      choices: C(["C:\\Users\\Omar\\Documents\\PocketQuest\\Saves\\slot1.sav", "C:\\Games\\PocketQuest\\Data\\levels.pak", "C:\\Games\\PocketQuest\\PocketQuest.exe", "D:\\slot1"]), answer: "C:\\Users\\Omar\\Documents\\PocketQuest\\Saves\\slot1.sav",
      good: "The player's progress is in his Documents folder; the game folder holds the program and the levels.", why: { "C:\\Games\\PocketQuest\\Data\\levels.pak": "That is the pack of levels, the same for every player." } },
    { icon: "blocks", goal: "An old version had <b>10 000 small files of 1 KB</b>. Blocks are 4 KB. About how much space did they take on disk?",
      choices: C(["about 39 MB", "about 10 MB", "about 4 MB", "about 100 MB"]), answer: "about 39 MB",
      good: "Each file takes one block: 10 000 × 4 KB = 40 000 KB, about 39 MB, for only about 10 MB of data.", why: { "about 10 MB": "That is the data; on disk each 1 KB file takes a whole 4 KB block." } },
    { icon: "pack", goal: "Why did the team pack all levels into one big file, <b>levels.pak</b>?",
      choices: C(["less wasted space and one fast read", "big files are safer from viruses", "Windows cannot keep small files", "to make the game bigger"]), answer: "less wasted space and one fast read",
      good: "One big file wastes at most part of one block, and the drive reads it in one long run.", why: { "Windows cannot keep small files": "It can, but every small file wastes part of a block." } },
    { icon: "pad", goal: "Ali's new gamepad shows a <b>yellow warning sign</b> in Device Manager. What is the fix?",
      choices: C(["install or update its driver", "format the drive", "move the save file", "clear the cache"]), answer: "install or update its driver",
      good: "The yellow sign means the driver is missing or does not work.", why: { "format the drive": "The drive has nothing to do with the gamepad." } },
    { icon: "usb", goal: "A 6 GB test build must go on a USB stick that works on Windows <b>and</b> on a Mac. Which format?",
      choices: C(["exFAT", "FAT32", "NTFS", "APFS"]), answer: "exFAT",
      good: "exFAT works on Windows and Mac and allows big files.", why: { FAT32: "FAT32 stops at 4 GB per file.", NTFS: "A Mac can read NTFS but usually cannot write to it.", APFS: "Windows cannot read APFS without extra software." } },
  ];
  Kit.game({ rounds, cols: 1, colsPhone: 1, animMs: 600, intro: "Round 1 is the story of the lesson: Omar and the old USB stick." });
})();
</script>
</body>
</html>
