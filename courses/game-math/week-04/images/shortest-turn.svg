<polygon points="264.1,145.4 270,155.5 261.4,156.8" fill="#2F9E44" stroke="none" stroke-width="1.5"/>
<text x="294" y="170" font-size="14" fill="#2F9E44" text-anchor="start" font-weight="800" xml:space="preserve">+20°</text>
