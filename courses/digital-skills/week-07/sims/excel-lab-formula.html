<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Excel Lab: a formula</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <link rel="stylesheet" href="../../../../shared/sims/office-lab.css">
</head>
<body class="theme-workshop">
<main class="sim">
  <h1>Excel Lab: a formula</h1>
  <p class="hint">The same steps as your worksheet (Task 2). Click a cell and type; a formula starts with <b>=</b>. Press <b>Enter</b>.</p>
  <div id="excel"></div>
  <div class="jobs"><b class="t">Steps</b> · <span id="progress"></span><ol id="jobs"></ol></div>
  <div class="row"><button id="reset" type="button" class="ghost">Start again</button></div>
  <p id="msg" class="message"></p>
</main>
<script src="../../../../shared/sims/sim-base.js"></script>
<script>
window.EXCEL_LAB = { name: 'shop-Huda', tabs: ['Home'], data: [["Item", "Price", "Qty", "Total"], ["Pens", 2, 10], ["Notebooks", 3, 5], ["Bags", 7, 2]],
  hello: 'Click <b>D2</b> and type <b>=B2*C2</b>, then press Enter.',
  missions: [
    ['<b>D2</b>: type <b>=B2*C2</b> (the price times the quantity)', (x) => /^=B2\*C2$/i.test(x.f('D2').replace(/\s/g, ''))],
    ['Change the price in <b>B2</b> to <b>3</b>: D2 changes by itself to <b>30</b>', (x) => x.v('B2') === 3 && x.v('D2') === 30],
  ] };
</script>
<script src="../../../../shared/sims/excel-lab.js"></script>
</body>
</html>
