<text x="230" y="149.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1080p</text>
<text x="350" y="149.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">60 fps</text>
<text x="470" y="149.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">3 GB</text>
<text x="595" y="149.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">150 MB</text>
<text x="30" y="187.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">PC (minimum)</text>
