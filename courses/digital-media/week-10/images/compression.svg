<rect x="20" y="196" width="640" height="30" rx="0" fill="#9C36B5"/>
<text x="30" y="215.3" font-size="12" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">bitrate (1080p, 30 fps)</text>
<text x="265" y="215.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">4 Mbit/s</text>
<text x="415" y="215.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">10 Mbit/s</text>
