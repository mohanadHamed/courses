<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator: Emulator Lab</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>
    .sim .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 5px 0; font-weight: 700; font-size: .9rem; }
    .sim .bar.cmd button { font-family: ui-monospace, Consolas, monospace; font-size: .82rem; }
    .sim .two { display: grid; grid-template-columns: 1fr 170px; gap: 10px; }
    .sim pre.term { background: #1e1e2e; color: #e9ecef; font: 600 .82rem/1.45 ui-monospace, Consolas, monospace; padding: 10px 12px; border-radius: 10px; height: 300px; overflow: auto; margin: 0; white-space: pre-wrap; }
    .sim pre.term b { color: #ffd43b; font-weight: 700; } .sim pre.term i { color: #ff8787; font-style: normal; }
    .sim .in { display: flex; gap: 6px; margin-top: 6px; } .sim .in input { flex: 1; font: 600 .9rem ui-monospace, Consolas, monospace; padding: 6px 8px; border-radius: 8px; border: 1.5px solid #ced4da; }
    .sim .task { font-weight: 800; color: var(--sim-accent); margin: 6px 0 0; }
    @media (max-width: 520px) { .sim .two { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="theme-circuit">
<main class="sim">
  <h1>Emulator Lab: run Pocket Quest 1.3</h1>
  <p class="hint">Rami's lab computer has Android Studio and one AVD. Tap a command or type it, then use the buttons under the emulator. Commands: <code>emulator -list-avds</code>, <code>emulator -avd P5_API_30</code>, <code>adb devices</code>, <code>adb install PocketQuest_1.3.apk</code>, <code>adb logcat</code>.</p>
  <div class="bar cmd" id="cmds"></div>
  <div class="two">
    <div><pre class="term" id="term" aria-live="polite"></pre>
      <div class="in"><input type="text" id="cmd" aria-label="a command" placeholder="adb devices"><button type="button" id="run">Run</button></div></div>
    <div><canvas id="c" aria-label="The emulator screen"></canvas>
      <div class="bar"><button type="button" class="ghost" id="open">Open the game</button><button type="button" class="ghost" id="rot">Rotate</button><button type="button" class="ghost" id="shot">Screenshot</button></div></div>
  </div>
  <p class="task" id="task"></p>
  <p class="message" id="msg"></p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const s = { listed: false, booted: false, checked: false, installed: false, running: false, land: false, frozen: false, logged: false, shots: 0, t0: 0 };
  const TASKS = [
    { q: "Task 1: List the AVDs and start P5_API_30.", ok: () => s.listed && s.booted },
    { q: "Task 2: Check with adb devices that the emulator is connected.", ok: () => s.checked },
    { q: "Task 3: Install PocketQuest_1.3.apk and open the game.", ok: () => s.installed && s.running },
    { q: "Task 4: Test case 7: start a race and rotate the emulator to landscape. What happens?", ok: () => s.frozen },
    { q: "Task 5: Read the log with adb logcat and take a screenshot for the bug report. Which line shows the error?", ok: () => s.logged && s.shots > 0 },
  ];
  let ti = 0;
  function out(lines) { const t = $("term"); t.innerHTML += lines.join("\n") + "\n\n"; t.scrollTop = t.scrollHeight; }
  function run(raw) {
    const cmd = raw.trim().replace(/\s+/g, " "), L = [`<b>$ ${cmd}</b>`];
    if (!cmd) return;
    if (cmd === "emulator -list-avds") { L.push("P5_API_30"); s.listed = true; }
    else if (/^emulator -avd /.test(cmd)) { const n = cmd.split(" ")[2]; if (n !== "P5_API_30") L.push(`PANIC: Unknown AVD name [${n}], use -list-avds to see valid names.`); else if (s.booted) L.push("The emulator is already running."); else { L.push("INFO: Booting P5_API_30 (Android 11, API 30) ...", "INFO: Boot completed in 18 s."); s.booted = true; s.t0 = performance.now(); } }
    else if (cmd === "adb devices") { L.push("List of devices attached"); if (s.booted) { L.push("emulator-5554\tdevice"); s.checked = true; } }
    else if (/^adb install/.test(cmd)) { if (!s.booted) L.push("<i>adb: no devices/emulators found</i>"); else if (!/PocketQuest_1\.3\.apk$/.test(cmd)) L.push("<i>adb: failed to stat " + (cmd.split(" ")[2] || "") + ": No such file or directory</i>"); else { L.push("Performing Streamed Install", "Success"); s.installed = true; } }
    else if (cmd === "adb logcat") {
      if (!s.booted) L.push("- waiting for device -");
      else { L.push("I/ActivityManager: Start proc com.bytebay.pocketquest"); if (s.running) L.push("I/Unity: Race started, track 3"); if (s.frozen) { L.push("<i>E/Unity: NullReferenceException: RaceHud.OnScreenRotate () (at RaceHud.cs:118)</i>", "<i>W/ActivityManager: Application Not Responding: com.bytebay.pocketquest</i>"); s.logged = true; } L.push("(Ctrl + C stops the log)"); }
    }
    else if (/^adb uninstall/.test(cmd)) { if (s.installed) { L.push("Success"); s.installed = s.running = s.frozen = false; } else L.push("<i>Failure [DELETE_FAILED_INTERNAL_ERROR]</i>"); }
    else L.push(`'${cmd.split(" ")[0]}' is not a command of this lab.`);
    out(L); upd();
  }
  const cv = Kit.canvas($("c"), 280);
  Kit.loop((now) => {
    const c = cv.ctx, W = cv.W, H = cv.H;
    c.clearRect(0, 0, W, H);
    const land = s.land, pw = land ? Math.min(W - 16, 250) : 120, ph = land ? 120 : 250, px = (W - pw) / 2, py = (H - ph) / 2;
    Kit.rrect(c, px - 6, py - 6, pw + 12, ph + 12, 12, "#343a40");
    c.fillStyle = s.booted ? "#e7f5ff" : "#111"; c.fillRect(px, py, pw, ph);
    if (!s.booted) { Kit.text(c, "emulator off", px + pw / 2, py + ph / 2, 12, "#868e96"); return; }
    if (!s.running) {
      Kit.text(c, "Android 11", px + pw / 2, py + 20, 11, "#495057");
      if (s.installed) { Kit.rrect(c, px + pw / 2 - 18, py + ph / 2 - 18, 36, 36, 8, "#e03131"); Kit.text(c, "Pocket Quest", px + pw / 2, py + ph / 2 + 32, 10, "#2a2f2c"); }
      return;
    }
    c.fillStyle = "#74c0fc"; c.fillRect(px, py, pw, ph);
    c.fillStyle = "#495057"; c.fillRect(px + pw * 0.3, py, pw * 0.4, ph);
    const t = s.frozen ? 0 : now;
    for (let k = 0; k < 5; k++) { c.fillStyle = "#fff"; c.fillRect(px + pw / 2 - 2, py + ((t / 8 + k * ph / 5) % ph), 4, 10); }
    Kit.rrect(c, px + pw / 2 - 8, py + ph * 0.7, 16, 24, 4, "#e03131");
    if (s.frozen) { c.fillStyle = "rgba(0,0,0,.45)"; c.fillRect(px, py, pw, ph); Kit.wrap(c, "Pocket Quest isn't responding", px + 8, py + ph / 2 - 8, pw - 16, 11, "#fff", "left", 800); }
  });
  function cmds() { Kit.buttons($("cmds"), ["emulator -list-avds", "emulator -avd P5_API_30", "adb devices", "adb install PocketQuest_1.3.apk", "adb logcat"].map((k) => ({ k, label: k })), (k) => run(k)); }
  function upd(note) {
    let m = "";
    while (ti < TASKS.length && TASKS[ti].ok()) { ti++; m = "✓ Done. "; Kit.good(); }
    $("task").textContent = ti < TASKS.length ? TASKS[ti].q : "All tasks are done: the bug is found, repeated, logged and ready for the report.";
    $("msg").textContent = m + (note || "");
  }
  $("open").addEventListener("click", () => { if (s.installed && s.booted) { s.running = true; upd("The race starts on the emulator."); } else upd("Install the game first."); });
  $("rot").addEventListener("click", () => { if (!s.booted) return upd("Start the emulator first."); s.land = !s.land; if (s.running && s.land) { s.frozen = true; upd("The screen turned to landscape, and the race froze."); } else upd(s.land ? "Landscape." : "Portrait."); });
  $("shot").addEventListener("click", () => { if (!s.booted) return upd("Start the emulator first."); s.shots++; Kit.beep(1200, 0.05); upd(`Screenshot saved: Screenshot_${s.shots}.png`); });
  $("run").addEventListener("click", () => { run($("cmd").value); $("cmd").value = ""; });
  $("cmd").addEventListener("keydown", (e) => { if (e.key === "Enter") { run($("cmd").value); $("cmd").value = ""; } });
  window.EL = { run, open: () => $("open").click(), rotate: () => $("rot").click(), shot: () => $("shot").click() };
  cmds(); out(["(Rami's lab computer. Android Studio is installed.)"]); upd();
})();
</script>
</body>
</html>
