<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Expected value of a loot crate: each value × its probability</text>
<rect x="20" y="52" width="600" height="36" rx="0" fill="#2F9E44"/>
<text x="30" y="74.7" font-size="13" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">item</text>
<text x="230" y="74.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">coins x</text>
<text x="355" y="74.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">probability p</text>
<text x="520" y="74.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">x · p</text>
<text x="30" y="110.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">gold</text>
<text x="230" y="110.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">100</text>
<text x="355" y="110.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">1/10</text>
<text x="520" y="110.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">10</text>
<rect x="20" y="124" width="600" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="146.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">silver</text>
<text x="230" y="146.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">20</text>
<text x="355" y="146.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">3/10</text>
<text x="520" y="146.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">6</text>
<text x="30" y="182.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">wood</text>
<text x="230" y="182.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">5</text>
<text x="355" y="182.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">6/10</text>
<text x="520" y="182.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">3</text>
<rect x="20" y="196" width="600" height="36" rx="0" fill="#f8f9fa"/>
<text x="30" y="218.7" font-size="13" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve"></text>
<text x="230" y="218.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve"></text>
<text x="355" y="218.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">sum = 1</text>
<rect x="420" y="196" width="200" height="36" rx="0" fill="#ffe066"/>
<text x="520" y="218.7" font-size="13" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">E = 19 coins</text>
<rect x="20" y="52" width="600" height="180" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="252" font-size="12.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">E is the average per crate over many crates. One crate never gives 19 coins: it gives 100, 20 or 5.</text>
</svg>
