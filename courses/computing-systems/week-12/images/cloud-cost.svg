<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">A monthly cost estimate (example prices)</text>
<rect x="20" y="52" width="640" height="32" rx="0" fill="#A86700"/>
<text x="30" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">service</text>
<text x="325" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">use per month</text>
<text x="480" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">example price</text>
<text x="600" y="72.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">cost</text>
<text x="30" y="104.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">cloud save (BaaS)</text>
<text x="325" y="104.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">50,000 players</text>
<text x="480" y="104.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">free tier</text>
<text x="600" y="104.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">$0</text>
<rect x="20" y="116" width="640" height="32" rx="0" fill="#f8f9fa"/>
<text x="30" y="136.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">object storage</text>
<text x="325" y="136.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">20 GB of levels</text>
<text x="480" y="136.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">$0.02 / GB</text>
<text x="600" y="136.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">$0.40</text>
<text x="30" y="168.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">CDN downloads</text>
<text x="325" y="168.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">2,000 GB</text>
<text x="480" y="168.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">$0.05 / GB</text>
<text x="600" y="168.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">$100</text>
<rect x="20" y="180" width="640" height="32" rx="0" fill="#f8f9fa"/>
<text x="30" y="200.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">race servers</text>
<text x="325" y="200.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">2 servers × 720 h</text>
<text x="480" y="200.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">$0.10 / h</text>
<text x="600" y="200.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">$144</text>
<text x="30" y="232.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve"></text>
<text x="325" y="232.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve"></text>
<text x="480" y="232.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">total</text>
<rect x="540" y="212" width="120" height="32" rx="0" fill="#ffe066"/>
<text x="600" y="232.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">≈ $244</text>
<rect x="20" y="52" width="640" height="192" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="260" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">The downloads (egress) and the servers cost most, not the storage. Prices are only examples: check the</text>
<text x="20" y="275.6" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">price page of the provider.</text>
</svg>
