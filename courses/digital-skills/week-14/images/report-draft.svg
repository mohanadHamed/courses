<circle cx="62" cy="63" r="4.5" fill="#51cf66"/>
<text x="220" y="67" font-size="11.5" fill="#495057" text-anchor="middle" font-weight="700" xml:space="preserve">report.docx (first draft)</text>
<text x="40" y="100" font-size="13.5" fill="#2b579a" text-anchor="start" font-weight="800" xml:space="preserve">Introduction</text>
<text x="40" y="118" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">My question and why it matters.</text>
<text x="40" y="142" font-size="13.5" fill="#2b579a" text-anchor="start" font-weight="800" xml:space="preserve">The data</text>
<text x="40" y="160" font-size="11.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">20 sales from the canteen, four weeks.</text>
<text x="40" y="184" font-size="13.5" fill="#2b579a" text-anchor="start" font-weight="800" xml:space="preserve">Results</text>
