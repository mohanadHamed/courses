<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Port Planner</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #fff9db; border: 1.5px solid #A86700; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Port Planner</h1>
  <p class="hint">The first test builds of <i>Pocket Quest</i> on PC, console and cloud gaming have problems. For each test report, choose the best fix.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "PC test: on an old laptop (GPU 2 points, 4 GB RAM) the race runs at 20 fps on the only setting.", goal: "What is the best fix?", answer: "add low, medium and high settings", choices: C(["add low, medium and high settings", "remove the PC version", "ask players to buy a new PC", "make the cars faster"]), good: "Settings let weak PCs run on low and strong PCs on high.", why: { "ask players to buy a new PC": "Players leave; first give them settings, then honest minimum requirements." } },
    { card: "Console test: the menu says 'Tap to start' and the buttons are too small to read from the sofa.", goal: "What is the best fix?", answer: "controller prompts and bigger text", choices: C(["controller prompts and bigger text", "a touch screen for the TV", "a new store page", "more race tracks"]), good: "A port adapts the controls and the menus to the new platform." },
    { card: "Certification report: the game freezes when the controller is unplugged during a race.", goal: "What does Byte Bay do?", answer: "pause and show a message, then resubmit", choices: C(["pause and show a message, then resubmit", "ignore it: players rarely do that", "release it on the console anyway", "remove the controller support"]), good: "Certification checks rules like this; fix it and submit the build again.", why: { "release it on the console anyway": "Without passing certification, the game cannot be released on the console." } },
    { card: "PC store page: players ask which PC they need. The page shows nothing about hardware.", goal: "What is missing?", answer: "minimum and recommended requirements", choices: C(["minimum and recommended requirements", "a longer trailer", "a lower price", "cross-play"]), good: "Minimum: GPU 2 points, 4 GB RAM (low). Recommended: GPU 6 points, 8 GB RAM (high)." },
    { card: "A player reaches level 12 on the phone, then starts the PC version at level 1.", goal: "Which feature is missing?", answer: "cross-save with one account", choices: C(["cross-save with one account", "cross-play", "a bigger download", "graphics settings"]), good: "One account and a cloud save carry the progress to every platform.", why: { "cross-play": "Cross-play joins matches, not progress." } },
    { card: "Cloud gaming test: players at 70 ms ping say the car reacts late in fast curves.", goal: "What helps most?", answer: "servers in a region near the players", choices: C(["servers in a region near the players", "4K instead of 1080p", "a bigger download", "more cars on the track"]), good: "A nearer region lowers the ping: 70 + 40 = 110 ms becomes 30 + 40 = 70 ms.", why: { "4K instead of 1080p": "4K needs more bandwidth and does not lower the delay." } },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; });
  const g = Kit.game({ rounds, cols: 2, colsPhone: 1, animMs: 600, intro: "Round 1 is the first test report of the seminar: an old laptop." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "All test reports are fixed." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
