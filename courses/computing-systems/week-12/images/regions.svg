<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="270" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Choose server regions near the players</text>
<rect x="20" y="52" width="640" height="34" rx="0" fill="#A86700"/>
<text x="30" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="800" xml:space="preserve">players in</text>
<text x="285" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">region: Frankfurt</text>
<text x="435" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">region: Bahrain</text>
<text x="585" y="73.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" xml:space="preserve">region: Mumbai</text>
<text x="30" y="107.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Amman</text>
<text x="285" y="107.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">≈ 60 ms</text>
<rect x="360" y="86" width="150" height="34" rx="0" fill="#d3f9d8"/>
<text x="435" y="107.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">≈ 35 ms</text>
<text x="585" y="107.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">≈ 90 ms</text>
<rect x="20" y="120" width="640" height="34" rx="0" fill="#f8f9fa"/>
<text x="30" y="141.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Berlin</text>
<rect x="210" y="120" width="150" height="34" rx="0" fill="#d3f9d8"/>
<text x="285" y="141.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">≈ 10 ms</text>
<text x="435" y="141.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">≈ 90 ms</text>
<text x="585" y="141.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">≈ 120 ms</text>
<text x="30" y="175.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Riyadh</text>
<text x="285" y="175.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">≈ 75 ms</text>
<rect x="360" y="154" width="150" height="34" rx="0" fill="#d3f9d8"/>
<text x="435" y="175.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">≈ 20 ms</text>
<text x="585" y="175.5" font-size="12.5" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">≈ 70 ms</text>
<rect x="20" y="52" width="640" height="136" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="20" y="210" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">Example values, they change with the network. Most players of Pocket Quest are in the Middle East:</text>
<text x="20" y="232" font-size="12" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">one region near them for the races; a second region only when many players live far away.</text>
</svg>
