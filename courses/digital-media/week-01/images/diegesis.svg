<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="600" height="360" fill="#ffffff"/>
<text x="20" y="32" font-size="18" fill="#2a2f2c" text-anchor="start" font-weight="800">Inside or outside the game world?</text>
<rect x="30" y="56" width="260" height="270" rx="14" fill="#f4e1f8" stroke="#9C36B5" stroke-width="1.8"/>
<text x="160" y="92" font-size="20" fill="#9C36B5" text-anchor="middle" font-weight="800">Diegetic</text>
<text x="160" y="116" font-size="12.5" fill="#5f1f70" text-anchor="middle" font-weight="700">the characters could see or hear it</text>
<circle cx="56" cy="157" r="5" fill="#9C36B5"/>
<text x="70" y="162" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600">the crackle of a campfire</text>
<circle cx="56" cy="197" r="5" fill="#9C36B5"/>
<text x="70" y="202" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600">the hero's footsteps</text>
<circle cx="56" cy="237" r="5" fill="#9C36B5"/>
<text x="70" y="242" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600">a radio playing in a room</text>
<circle cx="56" cy="277" r="5" fill="#9C36B5"/>
<text x="70" y="282" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600">a map in the hero's hands</text>
<rect x="310" y="56" width="260" height="270" rx="14" fill="#fbf3fd" stroke="#9C36B5" stroke-width="1.8"/>
<text x="440" y="92" font-size="20" fill="#9C36B5" text-anchor="middle" font-weight="800">Non-diegetic</text>
<text x="440" y="116" font-size="12.5" fill="#5f1f70" text-anchor="middle" font-weight="700">only the player notices it</text>
<circle cx="336" cy="157" r="5" fill="#9C36B5"/>
<text x="350" y="162" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600">the background music</text>
<circle cx="336" cy="197" r="5" fill="#9C36B5"/>
<text x="350" y="202" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600">the health bar and the score</text>
<circle cx="336" cy="237" r="5" fill="#9C36B5"/>
<text x="350" y="242" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600">the "+10" above a coin</text>
<circle cx="336" cy="277" r="5" fill="#9C36B5"/>
<text x="350" y="282" font-size="14" fill="#2a2f2c" text-anchor="start" font-weight="600">a narrator's voice</text>
<text x="300" y="350" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="600" font-style="italic">Ask: could a character in the world notice it?</text>
</svg>
