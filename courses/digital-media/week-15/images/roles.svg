<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="280" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Four production roles</text>
<rect x="20" y="52" width="152" height="190" rx="12" fill="#ffffff" stroke="#9C36B5" stroke-width="1.8"/>
<text x="34" y="76" font-size="14.5" fill="#9C36B5" text-anchor="start" font-weight="800" xml:space="preserve">Producer</text>
<text x="34" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">brief and schedule</text>
<text x="34" y="117.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">folder and names</text>
<text x="34" y="136.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">credits file</text>
<rect x="182" y="52" width="152" height="190" rx="12" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="196" y="76" font-size="14.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">Storyboard</text>
<text x="196" y="94.1" font-size="14.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">artist</text>
<text x="196" y="116.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">6 panels</text>
<text x="196" y="135.5" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">shot list</text>
<text x="196" y="154.8" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">art style</text>
<rect x="344" y="52" width="152" height="190" rx="12" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="358" y="76" font-size="14.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">Sound designer</text>
<text x="358" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">3 effects</text>
<text x="358" y="117.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">music loop</text>
<text x="358" y="136.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">the final mix</text>
<rect x="506" y="52" width="152" height="190" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="1.8"/>
<text x="520" y="76" font-size="14.5" fill="#e8590c" text-anchor="start" font-weight="800" xml:space="preserve">Video editor</text>
<text x="520" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">capture</text>
<text x="520" y="117.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">cut and titles</text>
<text x="520" y="136.6" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">export</text>
<text x="340" y="266" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Alone? Take every role in turn and keep a production log.</text>
</svg>
