<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="220" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Peer feedback: three short lines</text>
<rect x="20" y="52" width="206" height="130" rx="12" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="34" y="76" font-size="14.5" fill="#2b8a3e" text-anchor="start" font-weight="800" xml:space="preserve">One thing that works</text>
<text x="34" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">&quot;The chart is clear and has a</text>
<text x="34" y="114.4" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">title.&quot;</text>
<rect x="238" y="52" width="206" height="130" rx="12" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="252" y="76" font-size="14.5" fill="#1c7ed6" text-anchor="start" font-weight="800" xml:space="preserve">One question</text>
<text x="252" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">&quot;Why did tea sell more cups?&quot;</text>
<rect x="456" y="52" width="206" height="130" rx="12" fill="#ffffff" stroke="#D9480F" stroke-width="1.8"/>
<text x="470" y="76" font-size="14.5" fill="#D9480F" text-anchor="start" font-weight="800" xml:space="preserve">One idea</text>
<text x="470" y="98.1" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="600" xml:space="preserve">&quot;Show the week totals too.&quot;</text>
<text x="340" y="206" font-size="12" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Write down the feedback you receive, and use it for the final version.</text>
</svg>
