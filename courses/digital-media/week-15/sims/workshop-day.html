<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Workshop Day</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .card { font-weight: 700; background: #f8f0fc; border: 1.5px solid #9C36B5; border-radius: 10px; padding: 8px 12px; margin: 6px 0; }</style>
</head>
<body class="theme-studio">
<main class="sim">
  <h1>Workshop Day</h1>
  <p class="hint">During the workshop on the "Storm Night" package, six problems come up. Choose what the team (or the student working alone) should do.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { card: "The editor waits: the storyboard is not finished, so nobody knows which shots to capture.", answer: "finish the storyboard and shot list first", choices: C(["finish the storyboard and shot list first", "capture random shots", "skip the storyboard", "start the export"]), good: "The storyboard and the shot list are the handoff before the capture." },
    { card: "The folder has \"final.wav\", \"final2.wav\" and \"final_REAL.wav\".", answer: "use the naming rule with version numbers", choices: C(["use the naming rule with version numbers", "keep the newest one by date", "delete them all", "rename them \"final3\""]), good: "storm_music_loop_v03.wav: everyone knows which file is the right one." },
    { card: "Two members edit the same promo project at the same time and lose changes.", answer: "one owner per file; others send notes", choices: C(["one owner per file; others send notes", "both save often", "copy the project twice", "work faster"]), good: "Clear roles: the editor owns the edit; the others give feedback." },
    { card: "The music loop clicks every time it starts again.", answer: "cut it at a loop point and fade 10 ms", choices: C(["cut it at a loop point and fade 10 ms", "make it louder", "add an effect on top", "use it once only"]), good: "A seamless loop: cut on the beat at zero crossings, with tiny fades (lecture 15)." },
    { card: "The promo was exported in 9:16 for phones, but the brief asks for 16:9.", answer: "export again with the 16:9 preset", choices: C(["export again with the 16:9 preset", "send it anyway", "stretch it in the player", "change the brief"]), good: "Check the brief before the export; then the review is quick." },
    { card: "One student works alone and has to do all four roles.", answer: "take each role in turn and keep a production log", choices: C(["take each role in turn and keep a production log", "skip the sound", "only make the promo", "copy another team's package"]), good: "The individual alternative: the same package, role by role, with a dated log." },
  ];
  rounds.forEach((r) => { r.why = r.why || {}; r.goal = "What should they do?"; });
  const g = Kit.game({ rounds, cols: 1, colsPhone: 1, animMs: 600, intro: "Round 1 is the first problem of the workshop: a late storyboard." });
  const box = Kit.el("div", { class: "card", id: "card" });
  document.querySelector("main.sim").insertBefore(box, document.getElementById("choices"));
  let last = -1;
  (function upd() { const k = g.st.over ? -2 : g.st.i; if (k !== last) { last = k; box.textContent = g.st.over ? "The package is ready for the presentation." : g.cur().card; } requestAnimationFrame(upd); })();
})();
</script>
</body>
</html>
