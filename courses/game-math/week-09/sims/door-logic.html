<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-game: Door Logic</title>
  <link rel="stylesheet" href="../../../../shared/sims/sim-base.css">
  <style>.sim .pad button { font-family: ui-monospace, Consolas, monospace; }</style>
</head>
<body class="theme-arcade">
<main class="sim">
  <h1>Door Logic</h1>
  <p class="hint">In the dungeon game <i>Torch Hall</i>, every door has a rule. The designer writes the rule in words; you choose the logical condition that the game code must check.</p>
</main>

<script src="../../../../shared/sims/sim-base.js"></script>
<script src="../../../../shared/sims/game-kit.js"></script>
<script>
(() => {
  const C = (list) => list.map((t) => ({ k: t, label: t }));
  const rounds = [
    { st: { key: true, torch: false, boss: false }, goal: "The iron door opens when the player <b>has the key and holds a torch</b>. Which condition?",
      choices: C(["hasKey && hasTorch", "hasKey || hasTorch", "!hasKey && hasTorch", "hasKey ^ hasTorch"]), answer: "hasKey && hasTorch", opens: false,
      good: "AND: both must be true. Now the player has the key but no torch: the door stays shut.", why: { "hasKey || hasTorch": "With OR, the key alone would open it." } },
    { st: { key: false, torch: true, boss: false }, goal: "The wooden door opens with <b>the key or a torch</b> (to burn it). Which condition?",
      choices: C(["hasKey || hasTorch", "hasKey && hasTorch", "!hasTorch", "hasKey ^ hasTorch"]), answer: "hasKey || hasTorch", opens: true,
      good: "OR: one is enough. The torch is true, so the door opens.", why: { "hasKey ^ hasTorch": "XOR would keep the door shut for a player with both." } },
    { st: { key: false, torch: false, boss: false }, goal: "A trap fires when the player <b>does not hold a torch</b>. Which condition?",
      choices: C(["!hasTorch", "hasTorch", "!hasKey", "hasTorch || hasKey"]), answer: "!hasTorch", opens: true,
      good: "NOT turns true into false. No torch: !hasTorch is true, the trap fires.", why: { hasTorch: "That fires the trap for players who do hold a torch." } },
    { st: { key: true, torch: true, boss: false }, items: [["left switch up", true], ["right switch up", true]], goal: "A lever works when <b>exactly one</b> of two switches is up: left up, right up. Which condition?",
      choices: C(["left ^ right", "left && right", "left || right", "!left"]), answer: "left ^ right", opens: false,
      good: "XOR: true when exactly one is true. Both are up, so the lever does not work.", why: { "left || right": "OR is also true when both are up." } },
    { st: { key: true, torch: true, boss: true }, items: [["crown", true], ["boss defeated", true]], goal: "The rule of the game: <b>if the player has the crown, then the boss is defeated</b>. Which condition checks that the rule is kept?",
      choices: C(["!hasCrown || bossDead", "hasCrown && bossDead", "hasCrown || bossDead", "hasCrown && !bossDead"]), answer: "!hasCrown || bossDead", opens: true,
      good: "p → q is the same as ¬p ∨ q: the rule is broken only by a crown without a defeated boss.", why: { "hasCrown && !bossDead": "That is the one case that BREAKS the rule." } },
    { st: { key: true, torch: false, boss: true }, goal: "The last gate opens when the boss is defeated <b>and</b> the player has the key <b>or</b> a torch. Which condition?",
      choices: C(["bossDead && (hasKey || hasTorch)", "bossDead && hasKey || hasTorch", "bossDead || hasKey && hasTorch", "(bossDead && hasKey) && hasTorch"]), answer: "bossDead && (hasKey || hasTorch)", opens: true,
      good: "The brackets join key OR torch first. && is computed before ||, so without brackets a torch alone would open the gate.", why: { "bossDead && hasKey || hasTorch": "&& comes first: this opens for a torch even with the boss alive." } },
  ];
  Kit.game({
    rounds, cols: 1, colsPhone: 1, animMs: 900,
    intro: "Round 1 is the story of the lesson: the iron door of Torch Hall.",
    canvas: (W) => Math.min(150, W * 0.32),
    draw(c, W, H, now, r, st) {
      c.fillStyle = "#2b2622"; c.fillRect(0, 0, W, H);
      if (!r) return;
      const k = st.pick && st.ok ? Math.min(1, (now - st.t0) / 800) : 0, open = r.opens ? k : 0;
      const dw = Math.min(110, W * 0.25), dx = W - dw - 30, dy = 14, dh = H - 28;
      c.fillStyle = "#111"; c.fillRect(dx, dy, dw, dh);
      c.fillStyle = "#8d5524"; c.fillRect(dx, dy, dw * (1 - open), dh);
      c.strokeStyle = "#5c3a17"; c.lineWidth = 3; c.strokeRect(dx, dy, dw, dh);
      const items = r.items || [["key", r.st.key], ["torch", r.st.torch], ["boss defeated", r.st.boss]];
      const n = items.length, hh = (H - 28) / n;
      items.forEach(([t, v], i) => { Kit.rrect(c, 16, 14 + i * hh, Math.min(190, W * 0.46), hh - 6, 8, v ? "#2F9E44" : "#495057");
        Kit.text(c, `${t}: ${v ? "true" : "false"}`, 16 + Math.min(190, W * 0.46) / 2, 14 + i * hh + hh / 2 + 1, 12, "#fff"); });
      if (st.done && st.ok) Kit.text(c, r.opens ? "open" : "shut", dx + dw / 2, dy + dh / 2, 15, r.opens ? "#ffd43b" : "#fff");
    },
  });
})();
</script>
</body>
</html>
