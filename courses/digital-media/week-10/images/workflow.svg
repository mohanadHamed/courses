<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="230" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">From a new project to an exported file</text>
<rect x="14" y="60" width="122" height="104" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="75" y="88" font-size="13.5" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">1 Project</text>
<text x="75" y="114" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">name, 1920 ×</text>
<text x="75" y="128.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">1080, 30 fps</text>
<line x1="136" y1="112" x2="141.6" y2="112" stroke="#9C36B5" stroke-width="2" stroke-linecap="round"/>
<polygon points="147,112 141,115 141,109" fill="#9C36B5"/>
<rect x="147" y="60" width="122" height="104" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="208" y="88" font-size="13.5" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">2 Import</text>
<text x="208" y="114" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">clips into the</text>
<text x="208" y="128.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">media pool</text>
<line x1="269" y1="112" x2="274.6" y2="112" stroke="#9C36B5" stroke-width="2" stroke-linecap="round"/>
<polygon points="280,112 274,115 274,109" fill="#9C36B5"/>
<rect x="280" y="60" width="122" height="104" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="341" y="88" font-size="13.5" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">3 Arrange</text>
<text x="341" y="114" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">clips on the</text>
<text x="341" y="128.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">timeline</text>
<line x1="402" y1="112" x2="407.6" y2="112" stroke="#9C36B5" stroke-width="2" stroke-linecap="round"/>
<polygon points="413,112 407,115 407,109" fill="#9C36B5"/>
<rect x="413" y="60" width="122" height="104" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="474" y="88" font-size="13.5" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">4 Edit</text>
<text x="474" y="114" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">split, trim, title,</text>
<text x="474" y="128.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">music</text>
<line x1="535" y1="112" x2="540.6" y2="112" stroke="#9C36B5" stroke-width="2" stroke-linecap="round"/>
<polygon points="546,112 540,115 540,109" fill="#9C36B5"/>
<rect x="546" y="60" width="122" height="104" rx="10" fill="#f8f0fc" stroke="#9C36B5" stroke-width="1.8"/>
<text x="607" y="88" font-size="13.5" fill="#9C36B5" text-anchor="middle" font-weight="800" xml:space="preserve">5 Export</text>
<text x="607" y="114" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">Deliver: MP4,</text>
<text x="607" y="128.9" font-size="11.5" fill="#2a2f2c" text-anchor="middle" font-weight="700" xml:space="preserve">H.264</text>
<text x="340" y="204" font-size="12.5" fill="#6b726e" text-anchor="middle" font-weight="700" xml:space="preserve">Set the project&#x27;s resolution and frame rate first: they decide the timeline.</text>
</svg>
