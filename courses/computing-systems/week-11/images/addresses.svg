<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" font-family="Helvetica, Arial, sans-serif" font-weight="600">
<rect width="680" height="350" fill="#ffffff"/>
<text x="20" y="30" font-size="17" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">Addresses: IP, MAC and the DNS</text>
<rect x="20" y="52" width="300" height="214" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="34" y="76" font-size="14" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">Rami&#x27;s laptop in the LAN</text>
<rect x="34" y="92" width="280" height="30" rx="0" fill="#f8f9fa"/>
<text x="44" y="111.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">IP address</text>
<text x="234" y="111.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">192.168.1.23</text>
<text x="44" y="141.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">MAC address</text>
<text x="234" y="141.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">3C:52:82:1A:7F:04</text>
<rect x="34" y="152" width="280" height="30" rx="0" fill="#f8f9fa"/>
<text x="44" y="171.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">gateway</text>
<text x="234" y="171.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">192.168.1.1</text>
<text x="44" y="201.3" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="800" xml:space="preserve">DNS server</text>
<text x="234" y="201.3" font-size="12" fill="#2a2f2c" text-anchor="middle" font-weight="600" xml:space="preserve">192.168.1.1</text>
<rect x="34" y="92" width="280" height="120" rx="0" fill="none" stroke="#dee2e6" stroke-width="1.2"/>
<text x="34" y="232" font-size="11.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">192.168.x.x is private: it works only inside the</text>
<text x="34" y="246.9" font-size="11.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">LAN.</text>
<rect x="340" y="52" width="320" height="214" rx="12" fill="#fff9db" stroke="#A86700" stroke-width="1.8"/>
<text x="354" y="76" font-size="14" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">The DNS: names → numbers</text>
<text x="356" y="92" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Laptop: “What is the IP of play.example.net?”</text>
<line x1="500" y1="124" x2="500" y2="137.7" stroke="#A86700" stroke-width="2" stroke-linecap="round"/>
<polygon points="500,146 495.4,136.8 504.6,136.8" fill="#A86700"/>
<text x="356" y="166" font-size="13.5" fill="#A86700" text-anchor="start" font-weight="800" xml:space="preserve">DNS: “198.51.100.7”</text>
<text x="356" y="200" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">Now the laptop sends its packets to that</text>
<text x="356" y="215.6" font-size="12" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">number.</text>
<rect x="20" y="280" width="640" height="56" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="1.5"/>
<text x="36" y="302" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">The router has one public IP on the Internet (for example 203.0.113.45). All devices of the LAN</text>
<text x="36" y="318.2" font-size="12.5" fill="#2a2f2c" text-anchor="start" font-weight="700" xml:space="preserve">share it.</text>
</svg>
