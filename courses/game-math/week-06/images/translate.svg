<text x="400" y="171" font-size="13.5" fill="#6b726e" text-anchor="start" font-weight="700" xml:space="preserve">(1, 3) → (6, 5)</text>
<text x="400" y="214" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="800" xml:space="preserve">A 2 × 2 matrix cannot do this:</text>
<text x="400" y="234" font-size="13" fill="#c92a2a" text-anchor="start" font-weight="700" xml:space="preserve">M × (0, 0) is always (0, 0).</text>
